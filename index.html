"voo day-sahn-DAY luh bool-VAR", "You go down boulevard Martin."], ["Vous continuez la rue Dubois.", "voo kohn-tee-new-AY lah REW", "You continue along rue Dubois."]]}, {"name": "Ex. 12 — descendre, prendre, aller", "items": [["1. — Pour aller en direction du lac, nous prenons la rue d'Aix ? — Oui, c'est exact, vous descendez la rue jusqu'à l'avenue de la Corniche.", "noo pruh-NOHN … voo day-sahn-DAY", "Do we take rue d'Aix? — Yes, go down the street to avenue de la Corniche."], ["2. — Tu prends la voiture pour aller en ville ? — Non, je vais en ville à pied.", "tew PRAHN lah vwa-TEWR … zhuh vay ahn VEEL a pee-AY", "Are you taking the car? — No, I'm walking."], ["3. — Ils demandent l'itinéraire pour arriver à l'auberge. — C'est simple : ils prennent le bus n° 5 et ils descendent à la station Bas-Semnoz.", "eel PREN luh BEWSS … eel day-SAHND", "They take bus 5 and get off at Bas-Semnoz."], ["4. — Nicolas va à Lille pour le week-end, pourquoi tu ne vas pas avec lui ? — Parce que je vais à Marseille.", "nee-ko-LAH VAH a LEEL … zhuh vay a mar-SAY", "Nicolas is going to Lille — why not go with him? — Because I'm going to Marseille."], ["5. — Vos amis vont à Lyon en voiture ? — Oui, ils prennent l'autoroute, c'est rapide.", "vo za-MEE VOHN a lee-OHN … eel PREN lo-to-ROOT", "Are your friends driving to Lyon? — Yes, they take the motorway."]]}, {"name": "Ex. 14 — chassez l'intrus", "note": "<strong>1.</strong> <em>Bonjour monsieur</em> — the others open a card to someone close. <strong>2.</strong> <em>Au revoir !</em> — the others are affectionate sign-offs.", "items": [["Pour commencer : Ma chère Isabelle – Coucou ! – Bonjour monsieur – Salut ! – Cher Julien", "… bohn-ZHOOR muh-SYUH …", "the intruder is Bonjour monsieur"], ["Pour terminer : 1 000 baisers – Au revoir ! – Bisous – À bientôt – Amitiés – Affectueusement", "… oh ruh-VWAHR …", "the intruder is Au revoir !"]]}, {"name": "Ex. 15 — ce, cet, cette, ces", "note": "The eight photos of Nice, completed.", "items": [["Photo 1 : L'architecture de cette maison est vraiment originale !", "… duh set may-ZOHN …", "feminine → cette"], ["Photo 2 : Tu connais cette avenue : c'est la célèbre promenade des Anglais.", "… set av-NEW …", "feminine → cette"], ["Photo 3 : J'adore l'ambiance de ces marchés de Provence !", "… duh say mar-SHAY …", "plural → ces"], ["Photo 4 : Non, je n'habite pas ici, mais les touristes riches descendent dans cet hôtel.", "… dahn set o-TELL", "masculine + vowel → cet"], ["Photo 5 : Tu vois, ce ciel bleu, ce soleil, c'est Nice, c'est la Côte d'Azur !", "… suh see-ELL BLUH, suh so-LAY …", "masculine → ce"], ["Photo 6 : J'aime cet endroit, ce parc est magnifique !", "… set ahn-DRWAH, suh PARK …", "cet + ce"], ["Photo 7 : Ah ! ces fleurs, ces couleurs, c'est extraordinaire ! Et ça sent bon !", "… say FLUR, say koo-LUR …", "plural → ces"], ["Photo 8 : De ma fenêtre, je vois cette jolie église.", "… set zho-LEE ay-GLEEZ", "feminine → cette"]]}, {"name": "Ex. 16 — le déplacement des avions", "note": "Pattern: <em>L'avion vient <strong>de/d'/du/des</strong> X et va <strong>en/au/aux</strong> Y.</em>", "items": [["1. L'avion vient du Japon et va en Grèce.", "la-vee-OHN vee-AN dew zha-POHN ay va ahn GRESS", "from Japan to Greece"], ["2. L'avion vient d'Allemagne et va au Brésil.", "… dal-MAHN-yuh ay va oh bray-ZEEL", "from Germany to Brazil"], ["3. L'avion vient de France et va en Écosse.", "… duh FRAHNSS ay va ah nay-KOSS", "from France to Scotland"], ["4. L'avion vient d'Iran et va aux États-Unis.", "… dee-RAHN ay va oh zay-ta-zew-NEE", "from Iran to the USA"], ["5. L'avion vient des Philippines et va au Portugal.", "… day fee-lee-PEEN ay va oh por-tew-GAL", "from the Philippines to Portugal"]]}], "bookpages": [58, 59]}, {"id": "ae-d2-delf", "label": "Dossier 2 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 60. Reading comprehension built on a friend's message with directions, and an oral exchange of questions.", "art": null, "groups": [{"name": "Le message de Sophie", "note": "Answers: <strong>1.</strong> c — amical · <strong>2.</strong> Sophie · <strong>3.</strong> a — le bus · <strong>4.</strong> b — asiatique (japonais) · <strong>5.</strong> c — le soir (séance de 22 heures) · <strong>6.</strong> c — au cinéma · <strong>7.</strong> a — par téléphone (« Appelle-moi »).", "items": [["Tu es libre samedi ?", "tew ay LEE-bruh sam-DEE", "Are you free on Saturday?"], ["Il y a un nouveau restaurant japonais à côté de mon appartement : il est très bon !", "eel ee a uhn noo-VO res-to-RAHN zha-po-NAY a ko-TAY duh moh na-par-tuh-MAHN", "There's a new Japanese restaurant next to my flat: it's very good!"], ["Pour venir, c'est très simple : tu descends à l'arrêt de bus rue Serviez.", "poor vuh-NEER, say tray SAN-pluh : tew day-SAHN a la-RAY duh BEWSS", "To get here it's very simple: get off at the bus stop on rue Serviez."], ["Au bout de la rue, tu prends à droite la rue Maréchal Foch.", "oh boo duh lah REW, tew PRAHN a DRWAHT", "At the end of the street, take rue Maréchal Foch on the right."], ["Tu continues et tu prends la première à droite.", "tew kohn-tee-NEW ay tew PRAHN lah pruh-mee-AIR a DRWAHT", "Carry on and take the first on the right."], ["Au bout de la rue, tu tournes à gauche, c'est la rue Tran.", "… tew TOORN a GOSH", "At the end, turn left — that's rue Tran."], ["Le restaurant est au numéro 10, en face d'un petit jardin.", "… oh new-may-RO dees, ahn fahss duhn puh-TEE zhar-DAN", "The restaurant is at number 10, opposite a small garden."], ["Nous allons voir un film après le restaurant (séance de 22 heures) ?", "noo za-LOHN vwahr uhn FEELM a-PRAY … say-AHNSS duh van-duh ZUR", "Shall we see a film after the meal (10pm showing)?"], ["Appelle-moi pour me dire si tu es d'accord avec ce programme.", "a-PELL MWAH poor muh DEER see tew ay da-KOR", "Call me to say if you're happy with the plan."], ["Bisous. Sophie", "bee-ZOO", "Kisses. Sophie"]]}, {"name": "Production orale — échange d'informations", "note": "You're given single words and must build a question from each. The example shows you can ask around the word rather than using it: <em>Météo ?</em> → « Vous regardez la météo à la télévision ? » or « Est-ce qu'il fait beau aujourd'hui ? »", "cols": "two", "items": [["Jardin ? → Est-ce qu'il y a un jardin près de chez vous ?", "es-keel ee a uhn zhar-DAN pray duh shay VOO", "Garden?"], ["Langues ? → Quelles langues est-ce que vous parlez ?", "kel LAHNG es-kuh voo par-LAY", "Languages?"], ["Cinéma ? → Est-ce que vous allez souvent au cinéma ?", "es-kuh voo za-LAY soo-VAHN oh see-nay-MAH", "Cinema?"], ["Vacances ? → Où est-ce que vous passez vos vacances ?", "oo es-kuh voo pa-SAY vo va-KAHNSS", "Holidays?"], ["Pays ? → De quel pays est-ce que vous venez ?", "duh kel pay-EE es-kuh voo vuh-NAY", "Country?"], ["Monument ? → Quel monument est-ce que vous aimez dans votre ville ?", "kel mo-new-MAHN es-kuh voo zay-MAY", "Monument?"], ["Téléphone ? → Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO duh tay-lay-FON", "Telephone?"], ["Ville ? → Dans quelle ville est-ce que vous habitez ?", "dahn kel VEEL es-kuh voo za-bee-TAY", "Town?"], ["Âge ? → Quel âge est-ce que vous avez ?", "kel AHZH es-kuh voo za-VAY", "Age?"], ["Restaurant ? → Est-ce que vous aimez les restaurants japonais ?", "es-kuh voo zay-MAY lay res-to-RAHN zha-po-NAY", "Restaurant?"]]}], "bookpages": [60]}, {"id": "ae-d3l1", "label": "Dossier 3 · Leçon 1", "name": "J'adore", "summary": "Pages 62–65. Saying what you love and hate, talking about your free-time activities with faire and aller, and naming professions in both genders.", "art": "faireall", "bookpages": ["p062", "p063", "p064", "p065"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Tracks read from the 🎧 icons on pages 64–65.", "tracks": [{"n": 91, "label": "p.64 act. 9 — les personnes parlent de leur profession"}, {"n": 92, "label": "p.65 act. 11 — phonétique, homme ou femme ?"}]}, {"name": "L'annonce de la chaîne M6", "items": [["Vous avez une passion, un talent ?", "voo za-VAY ewn pa-see-OHN, uhn ta-LAHN", "Do you have a passion, a talent?"], ["Vous aimez la téléréalité ?", "voo zay-MAY lah tay-lay-ray-a-lee-TAY", "Do you like reality TV?"], ["Participez à une émission !", "par-tee-see-PAY a ew nay-mee-see-OHN", "Take part in a programme!"], ["Les annonces des chaînes", "lay za-NOHNSS day SHEN", "The channels' announcements"]]}, {"name": "Les trois émissions", "note": "Each ad gives three things: the <strong>theme</strong>, the <strong>prize</strong>, and the <strong>candidate profile</strong>.", "items": [["Un dîner presque parfait — 5 candidats de la même région, 5 jours, 5 invitations à dîner à la maison", "uhn dee-NAY presk par-FAY", "A nearly perfect dinner — cooking"], ["10 000 € à gagner pour le meilleur hôte !", "dee meel uh-RO a ga-NYAY poor luh may-YUR OT", "€10,000 for the best host!"], ["Vous aimez cuisiner, inviter, préparer une belle table…", "voo zay-MAY kwee-zee-NAY, an-vee-TAY, pray-pa-RAY ewn bell TAH-bluh", "You like cooking, inviting people, laying a nice table…"], ["Pékin Express — 10 000 km en 12 étapes, 10 équipes, 1 € par jour et par candidat", "pay-KAN eks-PRESS … dooz ay-TAP … dee zay-KEEP", "10,000 km in 12 stages, 10 teams, €1 a day"], ["100 000 € à gagner !", "sahn meel uh-RO a ga-NYAY", "€100,000 to be won!"], ["Vous adorez l'aventure, les voyages et le sport.", "voo za-do-RAY la-vahn-TEWR, lay vwa-YAHZH ay luh SPOR", "You love adventure, travel and sport."], ["Nouvelle Star — 10 candidats finalistes, 1 nouvelle star de la chanson française", "noo-VELL STAR … kahn-dee-DAH fee-na-LEEST", "10 finalists, one new French singing star"], ["À gagner : un contrat dans une maison de disques !", "a ga-NYAY : uhn kohn-TRAH dahn zewn may-ZOHN duh DEESK", "To be won: a record label contract!"], ["Vous faites de la musique, vous aimez chanter, vous rêvez d'enregistrer un album.", "voo fet duh lah mew-ZEEK, voo zay-may shahn-TAY, voo ray-VAY dahn-ruh-zhees-TRAY", "You make music, like singing, dream of recording an album."], ["Casting le 20 novembre / le 16 janvier / le 3 février", "kas-TEENG luh van no-VAHM-bruh", "Casting on 20 Nov / 16 Jan / 3 Feb"]]}, {"name": "La fiche de Baptiste Leroy", "note": "Nom : Baptiste Leroy · Âge : 27 ans · Profession : coiffeur. He fits <strong>Nouvelle Star</strong> — music is his life.", "items": [["Je travaille pour le cinéma.", "zhuh tra-VIGH poor luh see-nay-MAH", "I work for the cinema."], ["Mes journées de travail sont longues, mais je rencontre beaucoup d'artistes, c'est génial !", "may zhoor-NAY duh tra-VIGH sohn LOHNG … zhay-nee-AL", "My working days are long, but I meet lots of artists — it's brilliant!"], ["Je suis sociable, je sors beaucoup : j'adore faire la fête avec mes copains.", "zhuh swee so-see-AH-bluh, zhuh sor bo-KOO : zha-DOR fair lah FET", "I'm sociable, I go out a lot: I love partying with my mates."], ["aller dans des bars ou au restaurant", "a-LAY dahn day BAR oo oh res-to-RAHN", "going to bars or out to eat"], ["J'aime voyager et rencontrer des gens !", "zhem vwa-ya-ZHAY ay rahn-kohn-TRAY day ZHAHN", "I like travelling and meeting people!"], ["Le soir et le week-end, je fais de la musique.", "luh SWAHR ay luh week-END, zhuh fay duh lah mew-ZEEK", "In the evenings and at weekends I make music."], ["Fan de rock, je joue de la guitare et je chante dans un groupe.", "fahn duh ROK, zhuh zhoo duh lah gee-TAR ay zhuh SHAHNT", "A rock fan, I play guitar and sing in a band."], ["J'aime aussi la chanson française actuelle. La musique, c'est ma vie !", "zhem oh-SEE lah shahn-SOHN frahn-SEZ ak-tew-ELL", "I also like current French song. Music is my life!"], ["Très sportif, je vais à la montagne ou à la mer pour les vacances.", "tray spor-TEEF, zhuh vay a lah mohn-TAN-yuh oo a lah MAIR", "Very sporty, I go to the mountains or the sea for holidays."], ["Je fais du ski, de l'escalade, du parapente et du surf.", "zhuh fay dew SKEE, duh les-ka-LAHD, dew pa-ra-PAHNT ay dew SEURF", "I ski, climb, paraglide and surf."]]}, {"name": "La fiche de Victor Caurel", "note": "Nom : Victor Caurel · Âge : 32 ans · Profession : cuisinier. He fits <strong>Un dîner presque parfait</strong> — cooking is his trade and his joy.", "items": [["J'adore mon métier !", "zha-DOR mohn may-tee-AY", "I love my job!"], ["Je travaille avec des grands chefs et j'aime faire plaisir avec ma cuisine.", "zhuh tra-VIGH a-vek day grahn SHEF ay zhem fair play-ZEER", "I work with great chefs and I like giving pleasure with my cooking."], ["J'ai une copine mais je vis seul et je suis très indépendant.", "zhay ewn ko-PEEN may zhuh vee SUL … tray zan-day-pahn-DAHN", "I have a girlfriend but I live alone and I'm very independent."], ["Je sors peu parce que je n'ai pas beaucoup de temps libre.", "zhuh sor PUH pars kuh zhuh nay pah bo-KOO duh tahn LEE-bruh", "I don't go out much because I don't have much free time."], ["Quand je ne travaille pas, je déteste rester en ville !", "kahn zhuh nuh tra-VIGH PAH, zhuh day-TEST res-TAY ahn VEEL", "When I'm not working, I hate staying in town!"], ["J'aime bien aller à la montagne ou à la campagne ; je fais de la randonnée, du vélo.", "zhem bee-AN a-LAY … zhuh fay duh lah rahn-do-NAY, dew vay-LO", "I quite like going to the mountains or the countryside; I hike and cycle."], ["Le soir, je lis beaucoup.", "luh SWAHR, zhuh lee bo-KOO", "In the evening I read a lot."], ["Pour les vacances, j'adore les voyages sportifs.", "poor lay va-KAHNSS, zha-DOR lay vwa-YAHZH spor-TEEF", "For holidays I love active trips."], ["Quand c'est possible, je vais à l'étranger.", "kahn say po-SEE-bluh, zhuh vay a lay-trahn-ZHAY", "When possible I go abroad."], ["Je marche des kilomètres et je fais de la photo.", "zhuh marsh day kee-lo-MET-ruh ay zhuh fay duh lah fo-TO", "I walk for miles and I take photographs."], ["Je rêve de vivre une aventure, loin, très loin…", "zhuh rev duh VEE-vruh ewn a-vahn-TEWR, lwan, tray LWAN", "I dream of living an adventure, far, far away…"]]}, {"name": "Activité 4 — l'ordre des informations", "note": "Both cards give the same four blocks in the same order: <strong>1. l'identité</strong> du candidat · <strong>2. la vie professionnelle</strong> · <strong>3. la personnalité et le mode de vie</strong> · <strong>4. les activités de loisirs</strong>.", "cols": "two", "items": [["l'identité du candidat", "lee-dahn-tee-TAY dew kahn-dee-DAH", "the candidate's identity"], ["la vie professionnelle", "lah vee pro-fay-see-o-NELL", "working life"], ["la personnalité et le mode de vie", "lah pair-so-na-lee-TAY ay luh mod duh VEE", "personality and lifestyle"], ["les activités de loisirs", "lay zak-tee-vee-TAY duh lwa-ZEER", "leisure activities"], ["les goûts : ce que la personne aime / n'aime pas", "lay GOO", "tastes: what the person likes / dislikes"], ["les activités sportives, culturelles", "lay zak-tee-vee-TAY spor-TEEV, kewl-tew-RELL", "sporting and cultural activities"]]}, {"name": "Point Langue — parler de ses goûts", "note": "The scale, from loathing to love: <strong>je déteste → je n'aime pas → j'aime bien → j'aime → j'adore</strong>. All of them take either a <strong>noun</strong> or a <strong>verb in the infinitive</strong>.", "cols": "two", "items": [["J'aime bien voyager.", "zhem bee-AN vwa-ya-ZHAY", "I quite like travelling. — + infinitive"], ["J'adore les voyages.", "zha-DOR lay vwa-YAHZH", "I love travel. — + noun"], ["Je n'aime pas rester en ville.", "zhuh nem pah res-TAY ahn VEEL", "I don't like staying in town."], ["Je déteste la ville.", "zhuh day-TEST lah VEEL", "I hate the city."], ["J'ai horreur de la routine.", "zhay o-RUR duh lah roo-TEEN", "I loathe routine."], ["Je suis passionné par la lecture.", "zhuh swee pa-see-o-NAY par lah lek-TEWR", "I'm passionate about reading."], ["Je m'intéresse à l'art.", "zhuh man-tay-RESS a LAR", "I'm interested in art."]]}, {"name": "Aide-mémoire — faire au présent", "cols": "three", "items": [["je fais", "zhuh FAY", "I do / make"], ["tu fais", "tew FAY", "you do"], ["il / elle fait", "eel FAY", "he / she does"], ["nous faisons", "noo fuh-ZOHN", "we do — note: fuh, not fay"], ["vous faites", "voo FET", "you do — irregular"], ["ils / elles font", "eel FOHN", "they do"]]}, {"name": "Point Langue — aller + lieu, faire + activité", "note": "<strong>aller</strong> takes <em>au / à la / à l'</em> and a <strong>place</strong>. <strong>faire</strong> takes <em>du / de la / de l'</em> and an <strong>activity</strong>. Get the gender right and both are automatic.", "cols": "two", "items": [["Je vais au restaurant ; au cinéma.", "zhuh vay oh res-to-RAHN ; oh see-nay-MAH", "masculine place → au"], ["Je vais à la montagne ; à la campagne ; à la mer.", "zhuh vay a lah mohn-TAN-yuh", "feminine place → à la"], ["Je vais à l'étranger.", "zhuh vay a lay-trahn-ZHAY", "vowel → à l'"], ["Je fais du vélo ; du ski.", "zhuh fay dew vay-LO ; dew SKEE", "masculine activity → du"], ["Je fais de la musique ; de la photo ; de la natation.", "zhuh fay duh lah mew-ZEEK … duh lah na-ta-see-OHN", "feminine activity → de la"], ["Je fais de l'escalade ; de l'aquarelle.", "zhuh fay duh les-ka-LAHD ; duh la-kwa-RELL", "vowel → de l'"]]}, {"name": "Les activités — le vocabulaire complet", "cols": "two", "items": [["faire du sport", "fair dew SPOR", "to do sport"], ["faire du ski", "fair dew SKEE", "to ski"], ["faire du vélo", "fair dew vay-LO", "to cycle"], ["faire du surf", "fair dew SEURF", "to surf"], ["faire du parapente", "fair dew pa-ra-PAHNT", "to paraglide"], ["faire de la natation", "fair duh lah na-ta-see-OHN", "to swim"], ["faire de la randonnée", "fair duh lah rahn-do-NAY", "to hike"], ["faire de l'escalade", "fair duh les-ka-LAHD", "to rock climb"], ["faire de la musique", "fair duh lah mew-ZEEK", "to play music"], ["faire de la photo", "fair duh lah fo-TO", "to do photography"], ["faire de l'aquarelle", "fair duh la-kwa-RELL", "to paint in watercolour"], ["faire la fête", "fair lah FET", "to party"], ["jouer de la guitare", "zhoo-AY duh lah gee-TAR", "t et féminin à l'oral"}, {"n": 94, "label": "p.67 act. 5 — phonétique, homme ou femme ?"}, {"n": 95, "label": "p.67 act. 6 — qui parle avec qui ?"}, {"n": 96, "label": "p.68 act. 11–12 — le dialogue de Julie"}]}, {"name": "L'affiche de la soirée", "note": "<strong>Date :</strong> jeudi 12 février, de 19 h à 22 h · <strong>Lieu :</strong> aux Galeries Lafayette Haussmann · <strong>Objectif :</strong> trouver son Valentin(e) — meeting a partner before Valentine's Day.", "items": [["Soirée des célibataires", "swa-RAY day say-lee-ba-TAIR", "Singles evening"], ["Jeudi 12 février de 19 h à 22 h", "zhuh-DEE dooz fay-vree-AY", "Thursday 12 February, 7pm to 10pm"], ["Trouvez votre Valentin(e) !", "troo-VAY VOT-ruh va-lahn-TAN", "Find your Valentine!"], ["Speed Dating, consultations gratuites de voyantes", "… kohn-sewl-ta-see-OHN gra-TWEET duh vwa-YAHNT", "speed dating, free fortune-teller readings"], ["Maquillage gratuit, cours de danse", "ma-kee-YAHZH gra-TWEE, koor duh DAHNSS", "free make-up, dance lessons"], ["Grand jeu du cœur, avec des centaines de cadeaux à gagner", "grahn zhuh dew KUR … day sahn-TEN duh ka-DO", "the big heart game, hundreds of prizes"], ["Remise immédiate de 15 € à partir de 120 € d'achats", "ruh-MEEZ ee-may-dee-AT", "€15 off immediately when you spend €120"]]}, {"name": "Activité 2 — le type d'informations données", "note": "The four ads give: <strong>prénom, âge, numéro de téléphone, description physique, caractère, profession, goûts et loisirs, type de relation recherchée</strong>. They do <em>not</em> give a date of birth, an email address or a family situation.", "cols": "two", "items": [["un prénom", "uhn pray-NOHN", "a first name"], ["l'âge", "LAHZH", "age"], ["un numéro de téléphone", "uhn new-may-RO duh tay-lay-FON", "a phone number"], ["la description physique", "lah des-kreep-see-OHN fee-ZEEK", "physical description"], ["le caractère", "luh ka-rak-TAIR", "character"], ["les goûts et loisirs", "lay goo ay lwa-ZEER", "tastes and hobbies"], ["la situation familiale", "lah see-tew-a-see-OHN fa-mee-lee-AL", "family situation"], ["le type de relation recherchée", "luh teep duh ruh-la-see-OHN ruh-shair-SHAY", "the kind of relationship sought"]]}, {"name": "L'annonce d'Alice, 35 ans", "note": "Assez grande (1 m 70), élégante.", "items": [["Bien dans mon corps et dans ma tête.", "bee-AN dahn mohn KOR ay dahn ma TET", "Comfortable in my body and my mind."], ["Je suis architecte et j'adore mon travail.", "zhuh swee zar-shee-TEKT ay zha-DOR mohn tra-VIGH", "I'm an architect and I love my work."], ["Je suis très indépendante mais je suis rarement seule…", "… tray zan-day-pahn-DAHNT may zhuh swee rar-MAHN SUL", "I'm very independent but rarely alone…"], ["Je suis sagittaire.", "zhuh swee sa-zhee-TAIR", "I'm a Sagittarius."], ["Je voyage beaucoup. Je sors avec mes amis, je danse.", "zhuh vwa-YAHZH bo-KOO. zhuh sor a-vek may za-MEE", "I travel a lot. I go out with my friends, I dance."], ["J'adore le cinéma. J'ai horreur de la routine !", "zha-DOR luh see-nay-MAH. zhay o-RUR duh lah roo-TEEN", "I love cinema. I loathe routine!"], ["LUI : Homme 42 ans maximum, pas petit, libre, intelligent, cultivé.", "… pah puh-TEE, LEE-bruh, an-tay-lee-ZHAHN, kewl-tee-VAY", "Man, 42 max, not short, free, intelligent, cultured."], ["Une soirée et peut-être plus…", "ewn swa-RAY ay puh-TET-ruh PLEW", "An evening and maybe more…"]]}, {"name": "L'annonce de Mélanie, 32 ans", "note": "1 m 65, un peu ronde, décontractée.", "items": [["Artiste, créative et généreuse.", "ar-TEEST, kray-a-TEEV ay zhay-nay-RUHZ", "Artistic, creative and generous."], ["Je suis romantique et je voudrais rencontrer l'homme de ma vie.", "… ay zhuh voo-DREH rahn-kohn-TRAY LOM duh ma VEE", "I'm romantic and I'd like to meet the man of my life."], ["Je suis douce et calme.", "zhuh swee DOOSS ay KALM", "I'm gentle and calm."], ["J'aime les musées, je m'intéresse à l'art et à la musique.", "zhem lay mew-ZAY, zhuh man-tay-RESS a LAR", "I like museums, I'm interested in art and music."], ["Je suis une excellente cuisinière.", "zhuh swee zewn ek-say-LAHNT kwee-zee-nee-AIR", "I'm an excellent cook."], ["Le soir, je déteste regarder la télévision, je préfère sortir…", "luh SWAHR, zhuh day-TEST ruh-gar-DAY", "In the evening I hate watching TV, I prefer going out…"], ["J'ai deux chats.", "zhay duh SHA", "I have two cats."], ["ELLE : Homme 40 ans maximum, grand, mince, élégant, cultivé. Pour fonder une famille.", "… grahn, MANSS, ay-lay-GAHN … poor fohn-DAY ewn fa-MEE", "Man, 40 max, tall, slim, elegant, cultured. To start a family."]]}, {"name": "L'annonce de Pietro, 35 ans", "note": "Pas très grand, pas très mince.", "items": [["Je suis dessinateur.", "zhuh swee day-see-na-TUR", "I'm an illustrator."], ["Je suis timide, mais j'ai beaucoup d'amis.", "zhuh swee tee-MEED, may zhay bo-KOO da-MEE", "I'm shy, but I have lots of friends."], ["J'aime sortir. Je suis passionné par la lecture et la musique.", "zhem sor-TEER … pa-see-o-NAY par lah lek-TEWR", "I like going out. I'm passionate about reading and music."], ["J'aime la bonne cuisine et je fais d'excellents spaghettis (je suis d'origine italienne).", "… zhuh fay dek-say-LAHN spa-gay-TEE", "I like good food and I make excellent spaghetti (I'm of Italian origin)."], ["J'aime les animaux. Je n'aime pas les femmes autoritaires.", "zhem lay za-nee-MO. zhuh nem pah lay fam oh-to-ree-TAIR", "I like animals. I don't like bossy women."], ["ELLE : Jeune femme 24–34 ans, douce, intelligente, romantique. Pour une belle histoire d'amour.", "zhuhn FAM … poor ewn bell ees-TWAHR da-MOOR", "Young woman 24–34, gentle, intelligent, romantic. For a beautiful love story."]]}, {"name": "L'annonce de David, 39 ans", "note": "Grand, mince, sportif.", "items": [["Professeur de salsa, je joue de la guitare et j'adore la musique latine.", "pro-fay-SUR duh sal-SAH … lah mew-ZEEK la-TEEN", "Salsa teacher, I play guitar and love Latin music."], ["J'aime beaucoup lire. Je suis optimiste, je vois la vie en rose…", "zhem bo-KOO LEER. zhuh swee zop-tee-MEEST, zhuh vwah lah vee ahn ROZ", "I love reading. I'm optimistic, I see life through rose-tinted glasses…"], ["J'aime les voyages, je visite toujours des pays différents.", "zhem lay vwa-YAHZH, zhuh vee-ZEET too-ZHOOR day pay-EE dee-fay-RAHN", "I like travel, I always visit different countries."], ["Je suis allergique aux chats et je ne fume pas.", "zhuh swee za-lair-ZHEEK oh SHA ay zhuh nuh fewm PAH", "I'm allergic to cats and I don't smoke."], ["ELLE : Femme 30–38 ans, dynamique, cultivée, positive.", "fam … dee-na-MEEK, kewl-tee-VAY, po-zee-TEEV", "Woman 30–38, dynamic, cultured, positive."], ["Pour partager sorties, voyages, soleil et champagne.", "poor par-ta-ZHAY sor-TEE, vwa-YAHZH, so-LAY ay shahm-PAN-yuh", "To share outings, travel, sunshine and champagne."]]}, {"name": "Activité 3 — quels couples vont se former ?", "note": "The ads answer each other. <strong>Mélanie et David</strong> match well — she wants a tall, slim, cultured man to start a family; he wants a cultured, positive woman. But she has <em>two cats</em> and he is <em>allergic to cats</em> — the exercise wants you to spot exactly this kind of detail.<br><br><strong>Alice et Pietro</strong> is the other likely pair: she wants an intelligent, cultured man who isn't short; he wants a gentle, intelligent, romantic woman — though he dislikes bossy women and she is very independent.", "items": [["Mariez les célibataires !", "ma-ree-AY lay say-lee-ba-TAIR", "Match up the singles!"], ["Justifiez votre réponse.", "zhews-tee-fee-AY VOT-ruh ray-POHNSS", "Justify your answer."], ["À votre avis, vont-ils se revoir ?", "a VOT-ruh a-VEE, vohn TEEL suh ruh-VWAHR", "In your view, will they see each other again?"]]}, {"name": "Aide-mémoire — goûts et centres d'intérêt", "cols": "two", "items": [["J'aime / J'adore mon travail.", "zhem / zha-DOR mohn tra-VIGH", "I like / love my work."], ["Je suis passionné(e) par la lecture.", "zhuh swee pa-see-o-NAY par lah lek-TEWR", "I'm passionate about reading."], ["Je m'intéresse à l'art.", "zhuh man-tay-RESS a LAR", "I'm interested in art."], ["Je n'aime pas / Je déteste la télévision.", "zhuh nem pah / zhuh day-TEST", "I don't like / I hate television."], ["J'ai horreur de la routine.", "zhay o-RUR duh lah roo-TEEN", "I loathe routine."]]}, {"name": "Activité 4 — phrases équivalentes", "note": "Answers: <strong>1→c, 2→e, 3→d, 4→a, 5→b</strong>.", "items": [["Je suis timide. → Je ne communique pas facilement.", "zhuh swee tee-MEED → zhuh nuh ko-mew-NEEK pah fa-seel-MAHN", "I'm shy → I don't communicate easily."], ["Je suis généreuse. → Je donne beaucoup aux autres.", "zhuh swee zhay-nay-RUHZ → zhuh dun bo-KOO oh ZOH-truh", "I'm generous → I give a lot to others."], ["Je suis indépendante. → J'aime être libre.", "… → zhem EH-truh LEE-bruh", "I'm independent → I like being free."], ["J'ai horreur de la routine. → Je déteste la monotonie.", "… → zhuh day-TEST lah mo-no-to-NEE", "I loathe routine → I hate monotony."], ["Je suis passionné par la lecture. → J'adore lire.", "… → zha-DOR LEER", "I'm passionate about reading → I love to read."]]}, {"name": "Point Langue — le masculin et le féminin des adjectifs", "note": "Written, the feminine usually adds <strong>-e</strong>. Spoken, that <em>-e</em> wakes the consonant, so <strong>the two often sound different</strong> — but where the masculine already ends in <em>-e</em>, they are identical.", "cols": "two", "items": [["intelligent → intelligente", "an-tay-lee-ZHAHN → an-tay-lee-ZHAHNT", "+ -e, sound changes"], ["grand → grande", "GRAHN → GRAHND", "+ -e, sound changes"], ["sportif → sportive", "spor-TEEF → spor-TEEV", "-f → -ve"], ["généreux → généreuse", "zhay-nay-RUH → zhay-nay-RUHZ", "-eux → -euse"], ["cultivé → cultivée", "kewl-tee-VAY", "+ -e, sound identical"], ["libre → libre", "LEE-bruh", "already -e, no change"], ["romantique → romantique", "ro-mahn-TEEK", "already -e, no change"], ["doux → douce", "DOO → DOOSS", "irregular"], ["mince → mince", "MANSS", "no change"], ["élégant → élégante", "ay-lay-GAHN → ay-lay-GAHNT", "+ -e"]]}, {"name": "Point Langue — les pronoms toniques", "note": "Used to <strong>emphasise</strong> a person or to stand alone. Completed: <strong>Moi</strong>, je suis lion. <strong>Toi</strong> aussi, tu es artiste ? <strong>Lui</strong>, il adore voyager. <strong>Elle</strong> aussi, elle est artiste. <strong>Nous</strong>, nous allons à la soirée. <strong>Vous</strong> aussi, vous aimez voyager ? <strong>Eux</strong>, ils détestent les chats. <strong>Elles</strong>, elles vont souvent au cinéma.", "cols": "two", "items": [["moi", "MWAH", "me — with je"], ["toi", "TWAH", "you — with tu"], ["lui", "LWEE", "him — with il"], ["elle", "EL", "her — with elle"], ["nous", "NOO", "us — with nous"], ["vous", "VOO", "you — with vous"], ["eux", "UH", "them (m) — with ils"], ["elles", "EL", "them (f) — with elles"], ["Moi, je suis lion.", "MWAH, zhuh swee lee-OHN", "Me, I'm a Leo."], ["Lui, il adore voyager.", "LWEE, eel a-DOR vwa-ya-ZHAY", "Him, he loves travelling."], ["Eux, ils détestent les chats.", "UH, eel day-TEST lay SHA", "Them, they hate cats."], ["Et toi ? / Et vous ?", "ay TWAH / ay VOO", "And you?"]]}, {"name": "L'enquête — les hommes et les femmes", "note": "From the book cover <em>Les hommes viennent de Mars, les femmes viennent de Vénus</em>. <strong>Positive:</strong> romantique, responsable, patient, optimiste, organisé, sérieux. <strong>Negative:</strong> compliqué, superficiel, indécis, menteur.", "cols": "two", "items": [["romantique", "ro-mahn-TEEK", "romantic"], ["compliqué / compliquée", "kohm-plee-KAY", "complicated"], ["responsable", "res-pohn-SAH-bluh", "responsible"], ["patient / patiente", "pa-see-AHN / pa-see-AHNT", "patient"], ["superficiel / superficielle", "sew-pair-fee-see-ELL", "superficial"], ["optimiste", "op-tee-MEEST", "optimistic"], ["organisé / organisée", "or-ga-nee-ZAY", "organised"], ["indécis / indécise", "an-day-SEE / an-day-SEEZ", "indecisive"], ["sérieux / sérieuse", "say-ree-UH / say-ree-UHZ", "serious"], ["menteur / menteuse", "mahn-TUR / mahn-TUHZ", "a liar"], ["Les femmes et les hommes sont fondamentalement différents.", "… fohn-da-mahn-tal-MAHN dee-fay-RAHN", "Women and men are fundamentally different."], ["tout à fait d'accord / plutôt d'accord / pas d'accord", "too ta fay da-KOR / plew-TO / pah da-KOR", "completely agree / rather agree / disagree"]]}, {"name": "Point Langue — le pluriel des adjectifs", "note": "The rule to find: in general you add <strong>-s</strong>. But an adjective already ending in <strong>-s</strong> or <strong>-x</strong> does not change in the masculine plural — <em>indécis</em> and <em>sérieux</em> stay put — and <em>beau</em> becomes <strong>beaux</strong>.", "cols": "two", "items": [["patient → patients · patiente → patientes", "pa-see-AHN → pa-see-AHN", "+ -s"], ["organisé → organisés · organisée → organisées", "or-ga-nee-ZAY", "+ -s"], ["superficiel → superficiels · superficielle → superficielles", "sew-pair-fee-see-ELL", "+ -s"], ["indécis → indécis (pas de changement)", "an-day-SEE", "already -s"], ["sérieux → sérieux (pas de changement)", "say-ree-UH", "already -x"], ["beau → beaux · belle → belles", "BO → BO / BELL", "irregular"]]}, {"name": "Le vocabulaire de la leçon", "cols": "two", "items": [["un célibataire / une célibataire", "uhn say-lee-ba-TAIR", "a single person"], ["une soirée", "ewn swa-RAY", "an evening event"], ["une annonce", "ew na-NOHNSS", "an ad"], ["rencontrer", "rahn-kohn-TRAY", "to meet"], ["se revoir", "suh ruh-VWAHR", "to see each other again"], ["fonder une famille", "fohn-DAY ewn fa-MEE", "to start a family"], ["partager", "par-ta-ZHAY", "to share"], ["une histoire d'amour", "ewn ees-TWAHR da-MOOR", "a love story"], ["grand / grande", "GRAHN / GRAHND", "tall"], ["petit / petite", "puh-TEE / puh-TEET", "short, small"], ["mince", "MANSS", "slim"], ["rond / ronde", "ROHN / ROHND", "round, plump"], ["élégant / élégante", "ay-lay-GAHN / -GAHNT", "elegant"], ["timide", "tee-MEED", "shy"], ["doux / douce", "DOO / DOOSS", "gentle, soft"], ["calme", "KALM", "calm"], ["décontracté / décontractée", "day-kohn-trak-TAY", "relaxed"], ["dynamique", "dee-na-MEEK", "dynamic"], ["cultivé / cultivée", "kewl-tee-VAY", "cultured"], ["généreux / généreuse", "zhay-nay-RUH / -RUHZ", "generous"], ["autoritaire", "oh-to-ree-TAIR", "bossy"], ["allergique à", "a-lair-ZHEEK a", "allergic to"], ["un dessinateur", "uhn day-see-na-TUR", "an illustrator"], ["un architecte", "uh nar-shee-TEKT", "an architect"], ["une qualité / un défaut", "ewn ka-lee-TAY / uhn day-FO", "a good point / a flaw"], ["une enquête", "ew nahn-KET", "a survey"], ["une dispute", "ewn dees-PEWT", "an argument"], ["un conflit", "uhn kohn-FLEE", "a conflict"], ["voir la vie en rose", "vwahr lah vee ahn ROZ", "to see life through rose-tinted glasses"]]}]}, {"id": "ae-d3l3", "label": "Dossier 3 · Leçon 3", "name": "En famille", "summary": "Pages 70–73. A family tree and a wedding photo: every family relationship, the possessive adjectives in full, announcing births and marriages, reacting to news, and the parts of the body.", "art": "arbre3", "bookpages": ["p070", "p071", "p072", "p073"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Tracks read from the 🎧 icons on pages 70–73.", "tracks": [{"n": 97, "label": "p.70 act. 2 — Florian montre son album de photos"}, {"n": 98, "label": "p.71 act. 5 — phonétique, les « mots doux »"}, {"n": 99, "label": "p.71 act. 5 — phonétique, identique ou différent ?"}, {"n": 100, "label": "p.71 act. 5 — phonétique, singulier ou pluriel ?"}, {"n": 101, "label": "p.73 act. 11 — la conversation téléphonique"}]}, {"name": "La photo — l'événement célébré", "note": "It's a <strong>mariage</strong>: the white dress, the bouquet, the petals on the ground and the whole family gathered outside a church.", "items": [["Identifiez l'événement célébré.", "ee-dahn-tee-fee-AY lay-vayn-MAHN say-lay-BRAY", "Identify the event being celebrated an", "lah mair duh ma-MAHN", "mum's mother"], ["son mari, mon grand-père → Jacques Bossan", "sohn ma-REE", "her husband, my grandfather"], ["au premier rang", "oh pruh-mee-AY RAHN", "in the front row"], ["juste derrière", "zhewst dair-ee-AIR", "just behind"], ["à côté d'elle", "a ko-TAY DELL", "next to her"]]}, {"name": "Aide-mémoire — la famille", "cols": "two", "items": [["les parents = le père et la mère", "lay pa-RAHN", "parents = father and mother"], ["les enfants = le fils et la fille", "lay zahn-FAHN = luh FEESS ay lah FEE-yuh", "children = son and daughter"], ["les grands-parents = le grand-père et la grand-mère", "lay grahn-pa-RAHN", "grandparents"], ["les petits-enfants = le petit-fils et la petite-fille", "lay puh-tee-zahn-FAHN", "grandchildren"], ["le frère / la sœur", "luh FRAIR / lah SUR", "brother / sister"], ["le beau-frère / la belle-sœur", "luh bo-FRAIR / lah bell-SUR", "brother-in-law / sister-in-law"], ["le beau-père / la belle-mère", "luh bo-PAIR / lah bell-MAIR", "father-in-law / mother-in-law"], ["l'oncle / la tante", "LOHN-kluh / lah TAHNT", "uncle / aunt"], ["le cousin / la cousine", "luh koo-ZAN / lah koo-ZEEN", "cousin"], ["le neveu / la nièce", "luh nuh-VUH / lah nee-ESS", "nephew / niece"], ["le mari / la femme", "luh ma-REE / lah FAM", "husband / wife"]]}, {"name": "Activité 4 — vrai ou faux", "note": "<strong>1. VRAI</strong> — Franck's sister-in-law is Laure, his wife's sister.<br><strong>2. FAUX</strong> — Marion and Camille are Sonia's <em>nieces</em>, so this one is true: yes, VRAI.<br><strong>3. FAUX</strong> — Florian is Laure's <em>nephew</em>, not her brother-in-law.<br><strong>4. FAUX</strong> — Florian is Camille's <em>cousin</em>, not her brother.<br><strong>5. VRAI</strong> — Franck's father-in-law is Jacques, his wife's father.", "items": [["1. La belle-sœur de Franck s'appelle Laure. → VRAI", "lah bell-SUR duh frank sa-PELL lor", "Franck's sister-in-law is Laure."], ["2. Les nièces de Sonia s'appellent Marion et Camille. → VRAI", "lay nee-ESS duh so-NYA", "Sonia's nieces are Marion and Camille."], ["3. Le beau-frère de Laure s'appelle Florian. → FAUX : c'est son neveu.", "luh bo-FRAIR duh LOR", "Laure's brother-in-law is Florian. — false, he's her nephew."], ["4. Florian est le frère de Camille. → FAUX : c'est son cousin.", "flo-ree-AHN ay luh frair duh ka-MEE", "Florian is Camille's brother. — false, her cousin."], ["5. Le beau-père de Franck s'appelle Jacques. → VRAI", "luh bo-PAIR duh FRANK", "Franck's father-in-law is Jacques."]]}, {"name": "Point Langue — les adjectifs possessifs", "note": "The table completed: <strong>mon</strong> père · <strong>ma</strong> tante · <strong>mes</strong> grands-parents · <strong>ton</strong> oncle · <strong>ta</strong> mère · <strong>tes</strong> enfants · <strong>son</strong> frère · <strong>sa</strong> sœur · <strong>ses</strong> parents · <strong>notre</strong> fils · <strong>notre</strong> fille · <strong>nos</strong> enfants · <strong>votre</strong> frère · <strong>votre</strong> sœur · <strong>vos</strong> parents · <strong>leur</strong> fils · <strong>leur</strong> fille · <strong>leurs</strong> enfants.", "cols": "three", "items": [["mon père · ma tante · mes grands-parents", "mohn PAIR · ma TAHNT · may grahn-pa-RAHN", "je"], ["ton oncle · ta mère · tes enfants", "toh NOHN-kluh · ta MAIR · tay zahn-FAHN", "tu"], ["son frère · sa sœur · ses parents", "sohn FRAIR · sa SUR · say pa-RAHN", "il / elle"], ["notre fils · notre fille · nos enfants", "NOT-ruh FEESS · NOT-ruh FEE · no zahn-FAHN", "nous"], ["votre frère · votre sœur · vos parents", "VOT-ruh FRAIR · VOT-ruh SUR · vo pa-RAHN", "vous"], ["leur fils · leur fille · leurs enfants", "lur FEESS · lur FEE · lur zahn-FAHN", "ils / elles"]]}, {"name": "Attention — devant une voyelle", "note": "Before a feminine word beginning with a vowel, <strong>ma / ta / sa</strong> become <strong>mon / ton / son</strong> — purely for the sound.", "items": [["mon amie", "moh na-MEE", "my friend (f) — not ma amie"], ["ton amie", "toh na-MEE", "your friend (f)"], ["son amie", "soh na-MEE", "his / her friend (f)"]]}, {"name": "Un ou plusieurs possesseurs", "note": "Completed: Franck Kassovitz et <strong>son</strong> fils Florian → son + masculine · Franck et <strong>sa</strong> femme Sonia → sa + feminine · Sonia et <strong>ses</strong> nièces → ses + plural · Franck, Sonia et <strong>leur</strong> fils Florian → leur + singular · Laure, Philippe et <strong>leurs</strong> filles → leurs + plural.", "items": [["Franck Kassovitz et son fils Florian", "… ay sohn feess flo-ree-AHN", "one owner + masculine noun"], ["Franck et sa femme Sonia", "… ay sa fam so-NYA", "one owner + feminine noun"], ["Sonia et ses nièces Marion et Camille", "… ay say nee-ESS", "one owner + plural noun"], ["Franck, Sonia et leur fils Florian", "… ay lur FEESS", "several owners + singular noun"], ["Laure, Philippe et leurs filles, Marion et Camille", "… ay lur FEE-yuh", "several owners + plural noun"]]}, {"name": "Point Culture — les noms de famille", "note": "The three married women each kept a double name: Sonia <strong>Bossan-Kassovitz</strong>, Laure <strong>Vaillant-Bossan</strong>, Hélène Bossan <strong>née Tailé</strong>. The children take either the father's name, or both.<br><br>On marrying Franck Kassovitz, Sonia has four options: keep <em>Bossan</em>, take <em>Kassovitz</em>, or use <em>Bossan-Kassovitz</em> or <em>Kassovitz-Bossan</em>. The child has the same four possibilities.", "cols": "two", "items": [["un nom de famille", "uhn nohn duh fa-MEE", "a surname"], ["son nom de jeune fille", "sohn nohn duh zhuhn FEE", "her maiden name"], ["née Tailé", "nay ta-ee-LAY", "née Tailé"], ["se marier avec", "suh ma-ree-AY a-VEK", "to marry someone"], ["après son mariage", "a-PRAY sohn ma-ree-AHZH", "after her wedding"], ["garder son nom", "gar-DAY sohn NOHN", "to keep her name"]]}, {"name": "Les quatre faire-part", "note": "<strong>a</strong> — a birth (Clémentine) · <strong>b</strong> — a wedding (Aude et Christophe) · <strong>c</strong> — a wedding, informal style (Olivier et Fanny) · <strong>d</strong> — a birth, announced by the older siblings (Léa).", "items": [["Julie et David sont heureux de vous annoncer la naissance de leur fille Clémentine.", "… sohn tuh-RUH duh voo za-nohn-SAY lah nay-SAHNSS duh lur FEE", "Julie and David are happy to announce the birth of their daughter."], ["51 cm, 3 kg 100, le 10 juin", "sank-ahnt-ay-uhn sahn-tee-MET-ruh", "51 cm, 3.1 kg, on 10 June"], ["M. et Mme Dunand et M. et Mme Lagrange sont heureux de vous annoncer le mariage de leurs enfants Aude et Christophe.", "… luh ma-ree-AHZH duh lur zahn-FAHN", "…are happy to announce the marriage of their children."], ["le 15 septembre 2012, à la mairie de Chantilly à 15 h 30, puis à l'église Notre-Dame à 16 h 30", "… a lah may-REE … pwee a lay-GLEEZ", "at the town hall at 3.30pm, then at the church at 4.30pm"], ["Le 17 mai, nous disons oui, oui, oui !", "luh dee-set MAY, noo dee-ZOHN WEE", "On 17 May we say yes, yes, yes!"], ["à la mairie de Fontainebleau à 17 h 00", "a lah may-REE duh fohn-ten-BLO", "at Fontainebleau town hall at 5pm"], ["Après la cérémonie, rendez-vous à la salle des fêtes.", "a-PRAY lah say-ray-mo-NEE, rahn-day-VOO a lah sal day FET", "After the ceremony, meet at the village hall."], ["Vous dites oui ? Confirmez votre présence avant le 17 février.", "voo deet WEE ? kohn-feer-MAY VOT-ruh pray-ZAHNSS", "Are you saying yes? Confirm your attendance before 17 February."], ["Notre petite sœur s'appelle Léa.", "NOT-ruh puh-teet SUR sa-PELL lay-AH", "Our little sister is called Léa."], ["Elle est née le 3 avril. Elle pèse 2 kg 900 et mesure 50 cm.", "el ay nay luh trwa za-VREEL. el PEZ … ay muh-ZEWR", "She was born on 3 April. She weighs 2.9 kg and is 50 cm."]]}, {"name": "Aide-mémoire — dire au présent", "cols": "three", "note": "Note the pattern in the <em>vous</em> forms: <strong>vous êtes · vous faites · vous dites</strong> — the only three verbs that end this way.", "items": [["je dis", "zhuh DEE", "I say"], ["tu dis", "tew DEE", "you say"], ["il / elle dit", "eel DEE", "he / she says"], ["nous disons", "noo dee-ZOHN", "we say"], ["vous dites", "voo DEET", "you say — irregular"], ["ils / elles disent", "eel DEEZ", "they say"]]}, {"name": "Les cinq textos", "note": "<strong>Announcing:</strong> 4 (Clémence marries), 5 (Marc's son Nathan is born), 2 (Claire's aunt has died). <strong>Replying:</strong> 1 (Mamie Marie congratulates), 3 (Samuel congratulates on the birth).<br><br>Events: <strong>4 = mariage</strong>, <strong>5 = naissance</strong>, <strong>2 = décès</strong>.", "items": [["Mamie Marie : Quelle bonne nouvelle ! Tous mes vœux de bonheur pour toi et ton futur mari ! Bises", "kell bun noo-VELL ! too may vuh duh bo-NUR", "What good news! All my best wishes for happiness."], ["Claire : Je sors de l'hôpital. J'ai une mauvaise nouvelle : tante Marcelle est décédée…", "zhuh sor duh lo-pee-TAL … ewn mo-VEZ noo-VELL … ay day-say-DAY", "I'm leaving the hospital. Bad news: aunt Marcelle has died."], ["Samuel : Félicitations pour la naissance de ta fille ! Je suis très heureux pour vous. Et comment va la maman ?", "fay-lee-see-ta-see-OHN poor lah nay-SAHNSS", "Congratulations on your daughter's birth! How's the mother?"], ["Clémence : J'ai une grande nouvelle ! Je me marie ! Bisous", "zhay ewn grahnd noo-VELL ! zhuh muh ma-REE", "I have big news! I'm getting married!"], ["Marc : Je suis papa pour la 2e fois ! Nathan est né cette nuit à 3 h !", "zhuh swee pa-PAH poor lah duh-zee-EM FWAH ! na-TAHN ay NAY", "I'm a dad for the second time! Nathan was born last night at 3am!"]]}, {"name": "Aide-mémoire — annoncer et réagir", "cols": "two", "items": [["M. et Mme … sont heureux de vous annoncer la naissance de…", "sohn tuh-RUH duh voo za-nohn-SAY", "are happy to announce the birth of…"], ["… le mariage de…", "luh ma-ree-AHZH duh", "…the marriage of…"], ["J'ai une bonne / grande nouvelle : je me marie !", "zhay ewn bun / grahnd noo-VELL", "I have good / big news: I'm getting married!"], ["M. et Mme … ont la grande tristesse de vous annoncer le décès de…", "ohn lah grahnd trees-TESS … luh day-SAY duh", "have the great sadness to announce the death of…"], ["J'ai une mauvaise nouvelle : ta tante est décédée.", "zhay ewn mo-VEZ noo-VELL", "I have bad news: your aunt has died."], ["Félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Quelle bonne nouvelle ! Je suis très heureux pour toi / vous.", "kell bun noo-VELL", "What good news! I'm very happy for you."], ["Tous mes / nos vœux de bonheur.", "too may / no vuh duh bo-NUR", "All my / our best wishes for happiness."], ["Quelle triste nouvelle ! Je suis désolé(e) pour toi / vous.", "kell treest noo-VELL … day-zo-LAY", "What sad news! I'm sorry for you."]]}, {"name": "Activité 11 — la conversation dans l'ordre", "note": "The right order is: <strong>Maman, ça y est, Nathan est arrivé ! → Oui, cette nuit à 3 heures ! → Je trouve qu'il ressemble à sa maman… → Oh, elle va bien…</strong> This matches <strong>texto 5</strong> on page 72.", "items": [["Maman, ça y est, Nathan est arrivé !", "ma-MAHN, sa ee AY, na-TAHN ay ta-ree-VAY", "Mum, that's it, Nathan has arrived!"], ["Oui, cette nuit à 3 heures !", "wee, set NWEE a trwa ZUR", "Yes, last night at 3!"], ["Je trouve qu'il ressemble à sa maman, il a le nez et la bouche de Marie !", "zhuh troov keel ruh-SAHM-bluh a sa ma-MAHN", "I think he looks like his mum — he has Marie's nose and mouth!"], ["Il pèse 3 kilos et il mesure 50 cm !", "eel pez trwa kee-LO ay eel muh-ZEWR", "He weighs 3 kilos and is 50 cm!"], ["Oh, elle va bien, elle a juste un peu mal au ventre, c'est normal !", "o, el va bee-AN, el a zhewst uhn puh mal oh VAHN-truh", "Oh, she's fine, just a bit of a sore stomach — that's normal!"], ["Mais moi, je suis épuisé. J'ai mal à la tête, c'est terrible.", "may MWAH, zhuh swee zay-pwee-ZAY. zhay mal a lah TET", "But me, I'm exhausted. I have a headache, it's terrible."]]}, {"name": "Point Langue — les parties du corps", "cols": "two", "items": [["la tête", "lah TET", "the head"], ["les cheveux", "lay shuh-VUH", "the hair"], ["un œil / les yeux", "uh NUH-yuh / lay ZYUH", "an eye / the eyes"], ["le nez", "luh NAY", "the nose"], ["la bouche", "lah BOOSH", "the mouth"], ["les dents", "lay DAHN", "the teeth"], ["une oreille", "ew no-RAY", "an ear"], ["une épaule", "ew nay-POL", "a shoulder"], ["un bras", "uhn BRAH", "an arm"], ["une main", "ewn MAN", "a hand"], ["le ventre", "luh VAHN-truh", "the stomach"], ["le dos", "luh DO", "the back"], ["une jambe", "ewn ZHAHMB", "a leg"], ["un pied", "uhn pee-AY", "a foot"]]}, {"name": "Aide-mémoire — demander et donner des nouvelles", "cols": "two", "items": [["Comment vas-tu ? / Comment allez-vous ?", "ko-mahn va TEW / ko-mahn ta-lay VOO", "How are you?"], ["Comment elle va ?", "ko-mahn el VA", "How is she?"], ["Elle va bien. / Elle va mieux.", "el va bee-AN / el va mee-UH", "She's well. / She's better."], ["Elle va mal.", "el va MAL", "She's unwell."], ["Elle a mal.", "el a MAL", "She's in pain."], ["J'ai mal à la tête.", "zhay mal a lah TET", "I have a headache."], ["J'ai mal à l'épaule.", "zhay mal a lay-POL", "My shoulder hurts."], ["J'ai mal au ventre.", "zhay mal oh VAHN-truh", "I have stomach ache."], ["J'ai mal aux jambes.", "zhay mal oh ZHAHMB", "My legs hurt."], ["Je suis épuisé(e).", "zhuh swee zay-pwee-ZAY", "I'm exhausted."]]}, {"name": "Le vocabulaire de la leçon", "cols": "two", "items": [["un faire-part", "uhn fair-PAR", "an announcement card"], ["une naissance", "ewn nay-SAHNSS", "a birth"], ["un mariage", "uhn ma-ree-AHZH", "a wedding"], ["un décès", "uhn day-SAY", "a death"], ["décéder", "day-say-DAY", "to pass away"], ["un événement familial", "uh nay-vayn-MAHN fa-mee-lee-AL", "a family event"], ["une nouvelle", "ewn noo-VELL", "a piece of news"], ["annoncer", "a-nohn-SAY", "to announce"], ["réagir", "ray-a-ZHEER", "to react"], ["féliciter", "fay-lee-see-TAY", "to congratulate"], ["le b
