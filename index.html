n artist?"], ["LUI, il adore voyager.", "LWEE, ee la-DOR vwa-ya-ZHAY", "Him, he loves travelling."], ["ELLE aussi, elle est artiste.", "EL oh-SEE, el ay tar-TEEST", "Her too, she's an artist."], ["NOUS, nous allons à la soirée des célibataires.", "NOO, noo za-LOHN a lah swa-RAY", "Us, we're going to the singles evening."], ["VOUS aussi, vous aimez voyager ?", "VOO oh-SEE, voo zay-MAY vwa-ya-ZHAY", "You too, do you like travelling?"], ["EUX, ils détestent les chats.", "UH, eel day-TEST lay SHA", "Them, they hate cats."], ["ELLES, elles vont souvent au cinéma.", "EL, el vohn soo-VAHN oh see-nay-MAH", "Them (f), they often go to the cinema."]], "note": "Eight stressed pronouns: <strong>moi · toi · lui · elle · nous · vous · eux · elles</strong>. Note that <em>nous, vous</em> and <em>elle(s)</em> are identical to the subject pronouns — only <em>moi, toi, lui, eux</em> are different forms.", "cols": "two"}, {"name": "Page 67 — activités 6, 7 et 8", "items": [["Activité 6 : Écoutez, relisez les annonces et répondez.", "ay-koo-TAY, ruh-lee-ZAY lay za-NOHNSS", "Listen, reread the ads and answer."], ["1. Qui parle avec qui ?", "kee parl a-vek KEE", "Who is talking to whom?"], ["2. À votre avis, vont-ils se revoir ? Justifiez votre réponse.", "a VOT-ruh a-VEE, vohn TEEL suh ruh-VWAHR", "In your view, will they meet again? Justify."], ["Activité 7 : Vous désirez rencontrer des gens. Vous allez sur le site rencontres.com.", "voo day-zee-RAY rahn-kohn-TRAY day ZHAHN", "You want to meet people. You go to rencontres.com."], ["Écrivez votre annonce sur le modèle des annonces p. 66.", "ay-kree-VAY VOT-ruh a-NOHNSS", "Write your ad on the model of those on p.66."], ["Vous vous présentez. Vous précisez votre caractère et vos goûts.", "voo voo pray-zahn-TAY … VOT-ruh ka-rak-TAIR ay vo GOO", "Introduce yourself. Give your character and your tastes."], ["Vous dites qui vous souhaitez rencontrer (caractère, goûts) et vous précisez votre objectif (activités culturelles/sportives, voyages, mariage, etc.).", "… kee voo soo-ay-TAY rahn-kohn-TRAY", "Say who you'd like to meet and what you're looking for."], ["Activité 8 : Jouez la scène.", "zhoo-AY lah SEN", "Act out the scene."], ["Pendant la soirée organisée par rencontres.com, vous participez à un speed dating : vous avez 3 minutes pour faire connaissance avec chaque personne !", "… trwah mee-NEWT poor fair ko-nay-SAHNSS", "At the rencontres.com evening you do speed dating: 3 minutes to get to know each person!"]]}, {"name": "Page 68 — la couverture du livre", "items": [["Caractériser une personne", "ka-rak-tay-ree-ZAY ewn pair-SUN", "Describing a person"], ["J'AI LU — Bien-être — PSYCHOLOGIE", "zhay LEW — bee-an-EH-truh — psee-ko-lo-ZHEE", "the publisher, the series and the category"], ["JOHN GRAY — Les hommes viennent de Mars, les femmes viennent de Vénus", "lay ZOM vee-EN duh MARSS, lay FAM vee-EN duh vay-NEWSS", "Men are from Mars, Women are from Venus"], ["Connaître nos différences pour mieux nous comprendre.", "ko-NET-ruh no dee-fay-RAHNSS poor mee-UH noo kohm-PRAHN-druh", "Knowing our differences to understand each other better."], ["Activité 9 : Observez cette couverture de livre et répondez.", "ob-sair-VAY set koo-vair-TEWR duh LEE-vruh", "Look at this book cover and answer."], ["1. Connaissez-vous ce livre ? Est-il édité dans votre pays ?", "ko-nay-say VOO suh LEE-vruh ? ay TEEL ay-dee-TAY", "Do you know this book? Is it published in your country?"], ["2. Quels sont le thème et l'objectif du livre ?", "kel sohn luh TEM ay lob-zhek-TEEF", "What are the book's theme and purpose?"], ["→ Le thème : les différences entre les hommes et les femmes. L'objectif : mieux se comprendre dans le couple.", "luh TEM … lob-zhek-TEEF", "Theme: the differences between men and women. Purpose: to understand each other better."]], "note": "The cover shows a man's and a woman's profile facing each other, his head topped with toy cars, hers with dolls and flowers — the stereotype the book examines. The cartoon below shows two astronauts, one from Mars, one from Venus."}, {"name": "Page 68 — l'enquête du jour", "items": [["Enquête du jour", "ahn-KET dew ZHOOR", "Survey of the day"], ["Les hommes viennent de Mars et les femmes de Vénus ?", "lay ZOM vee-EN duh MARSS ay lay FAM duh vay-NEWSS", "Are men from Mars and women from Venus?"], ["Les femmes et les hommes sont fondamentalement différents.", "… sohn fohn-da-mahn-tal-MAHN dee-fay-RAHN", "Women and men are fundamentally different."], ["oui, tout à fait d'accord", "wee, too ta fay da-KOR", "yes, completely agree"], ["plutôt d'accord", "plew-TO da-KOR", "rather agree"], ["non, pas d'accord", "nohn, pah da-KOR", "no, disagree"], ["Valider", "va-lee-DAY", "Submit"], ["Activité 10 a) Lisez l'enquête sur Internet et dites quel est le thème.", "lee-ZAY lahn-KET", "Read the online survey and say what the theme is."], ["b) Classez les caractéristiques en deux catégories : positives et négatives.", "kla-SAY lay ka-rak-tay-rees-TEEK", "Sort the characteristics into positive and negative."]]}, {"name": "Page 68 — les neuf caractéristiques, au masculin et au féminin", "items": [["romantiques / romantiques — POSITIF", "ro-mahn-TEEK", "romantic"], ["compliqués / compliquées — NÉGATIF", "kohm-plee-KAY", "complicated"], ["responsables / responsables — POSITIF", "res-pohn-SAH-bluh", "responsible"], ["patients / patientes — POSITIF", "pa-see-AHN / pa-see-AHNT", "patient"], ["superficiels / superficielles — NÉGATIF", "sew-pair-fee-see-ELL", "superficial"], ["optimistes / optimistes — POSITIF", "op-tee-MEEST", "optimistic"], ["organisés / organisées — POSITIF", "or-ga-nee-ZAY", "organised"], ["indécis / indécises — NÉGATIF", "an-day-SEE / an-day-SEEZ", "indecisive"], ["sérieux / sérieuses — POSITIF", "say-ree-UH / say-ree-UHZ", "serious"], ["menteurs / menteuses — NÉGATIF", "mahn-TUR / mahn-TUHZ", "liars"]], "note": "Six positive, four negative. Note that the survey prints both columns so you can see every masculine and feminine plural side by side — which is exactly what the Point Langue on the next page draws on.", "cols": "two"}, {"name": "Page 68 — activités 11 et 12", "items": [["Activité 11 : Écoutez le dialogue et identifiez la situation : qui parle ? de quoi ?", "ay-koo-TAY luh dee-a-LOG … kee PARL ? duh KWAH", "Listen and identify the situation: who's speaking? about what?"], ["Activité 12 : Réécoutez le dialogue et identifiez quelles caractéristiques Julie sélectionne dans l'enquête.", "ray-ay-koo-TAY … kel ka-rak-tay-rees-TEEK zhew-LEE say-lek-see-OHN", "Listen again and identify which characteristics Julie selects in the survey."]], "note": "The answers come from the recording (piste 96) — Julie is filling in the online survey and saying aloud which boxes she ticks."}, {"name": "Page 69 — Point Langue : le pluriel des adjectifs", "items": [["Observez les listes de qualificatifs dans l'enquête sur Internet p. 68 puis complétez.", "ob-sair-VAY lay leest duh ka-lee-fee-ka-TEEF", "Look at the adjective lists in the survey then complete."], ["patient → patientS · patiente → patienteS", "pa-see-AHN → pa-see-AHN", "add -s"], ["organisé → organiséS · organisée → organiséeS", "or-ga-nee-ZAY", "add -s"], ["superficiel → superficielS · superficielle → superficielleS", "sew-pair-fee-see-ELL", "add -s"], ["Exceptions : indécis → indécis (pas de changement) · indécise → indéciseS", "an-day-SEE", "already ends in -s"], ["sérieux → sérieux (pas de changement) · sérieuse → sérieuseS", "say-ree-UH", "already ends in -x"], ["beau → beauX · belle → belleS", "BO → BO / BELL", "irregular: beau takes -x"], ["En général, pour mettre les adjectifs au pluriel, on ajoute un -S.", "ahn zhay-nay-RAL … ohn a-ZHOOT uh ness", "In general, to make an adjective plural you add -s."]], "note": "Three exceptions in one small table: adjectives already ending in <strong>-s</strong> or <strong>-x</strong> don't change in the masculine plural, and <strong>beau</strong> takes <strong>-x</strong> instead of -s. Note also that none of these plural endings is pronounced — the plural is silent.", "cols": "two"}, {"name": "Page 69 — activité 13 : l'enquête dans la classe", "items": [["Faites une enquête dans la classe. Formez un groupe femmes et un groupe hommes.", "fet ewn ahn-KET dahn lah KLAHSS", "Run a survey in the class. Form a women's group and a men's group."], ["1. Chacun écrit deux caractéristiques positives (qualités) et deux caractéristiques négatives (défauts) pour qualifier les personnes du sexe opposé.", "sha-KUHN ay-KREE … lay ka-lee-TAY … lay day-FO", "Each person writes two qualities and two faults describing the opposite sex."], ["2. Dans chaque groupe, vous échangez et décidez d'une liste commune (six caractéristiques maximum).", "… ewn leest ko-MEWN", "In each group, agree a shared list of up to six characteristics."], ["Vous classez les caractéristiques par ordre d'importance.", "voo kla-SAY … par or-druh dan-por-TAHNSS", "Rank them in order of importance."], ["3. En grand groupe, comparez les deux classements et réagissez :", "ahn grahn GROOP, kohm-pa-RAY lay duh klahss-MAHN", "As a whole class, compare the two rankings and react:"], ["— Les classements sont-ils positifs, négatifs ?", "lay klahss-MAHN sohn TEEL po-zee-TEEF", "Are the rankings positive or negative?"], ["— Est-ce qu'il y a des caractéristiques communes ?", "es-keel ee a day ka-rak-tay-rees-TEEK ko-MEWN", "Are there characteristics in common?"], ["— Quelle est votre conclusion après cette enquête ? Les hommes et les femmes sont-ils très différents ?", "kel ay VOT-ruh kohn-klew-zee-OHN", "What's your conclusion? Are men and women very different?"], ["une qualité / un défaut", "ewn ka-lee-TAY / uhn day-FO", "a good quality / a flaw"]]}, {"name": "Page 69 — activité 14 : Cartographie d'une dispute de couple", "items": [["Yvon Dallaire — CARTOGRAPHIE D'UNE DISPUTE DE COUPLE", "kar-to-gra-FEE dewn dees-PEWT duh KOO-pluh", "Mapping a couple's argument"], ["Le secret des couples heureux", "luh suh-KRAY day koo-pluh uh-RUH", "The secret of happy couples"], ["jouvence éditions", "zhoo-VAHNSS ay-dee-see-OHN", "the publisher"], ["a) Observez la couverture de livre et le dessin ci-dessus. Trouvez dans le titre du livre le mot clé qui correspond au dessin.", "… luh mo KLAY", "Find in the title the key word matching the drawing."], ["→ Le mot clé est DISPUTE : le dessin montre un couple qui se dispute.", "lah dees-PEWT", "The key word is 'dispute' — the drawing shows a couple arguing."], ["b) Échangez en petits groupes. Les psychologues identifient des thèmes très spécifiques à l'origine des disputes dans les couples.", "lay psee-ko-LOG ee-dahn-tee-FEE", "Psychologists identify very specific themes behind couples' arguments."], ["Par exemple : l'éducation des enfants.", "lay-dew-ka-see-OHN day zahn-FAHN", "For example: raising children."], ["Dites quels sont, à votre avis, les autres sujets de conflits pour les couples.", "… lay zo-truh sew-ZHAY duh kohn-FLEE", "Say what other subjects of conflict there are."], ["c) Lisez le sous-titre du livre et échangez à deux.", "lee-ZAY luh soo-TEE-truh", "Read the subtitle and discuss in pairs."], ["D'après vous, quelles sont les caractéristiques nécessaires, chez l'homme et chez la femme, pour former un couple heureux ?", "da-PRAY VOO … poor for-MAY uhn koo-pluh uh-RUH", "What characteristics are needed, in a man and in a woman, to make a happy couple?"]], "note": "The cover shows two figures moving little wooden pieces around a coloured board — an argument drawn as a game of strategy. The illustration beside it shows a couple shouting at each other in silhouette."}, {"name": "Page 69 — le projet", "items": [["Projet Dossier 3 — Pour réaliser une affiche de film sur la famille, vous allez :", "poor ray-a-lee-ZAY ewn a-FEESH duh FEELM sewr lah fa-MEE", "To make a film poster about the family, you will:"], ["Tâche leçon 2 : Définir le caractère des personnages.", "day-fee-NEER luh ka-rak-TAIR day pair-so-NAHZH", "Task: define the characters' personalities."]]}, {"name": "Le vocabulaire de la leçon", "items": [["un / une célibataire", "uhn say-lee-ba-TAIR", "a single person"], ["une soirée", "ewn swa-RAY", "an evening event"], ["une annonce", "ew na-NOHNSS", "an ad"], ["rencontrer", "rahn-kohn-TRAY", "to meet"], ["se revoir", "suh ruh-VWAHR", "to meet again"], ["fonder une famille", "fohn-DAY ewn fa-MEE", "to start a family"], ["partager", "par-ta-ZHAY", "to share"], ["une histoire d'amour", "ewn ees-TWAHR da-MOOR", "a love story"], ["un couple", "uhn KOO-pluh", "a couple"], ["une dispute", "ewn dees-PEWT", "an argument"], ["un conflit", "uhn kohn-FLEE", "a conflict"], ["grand / grande", "GRAHN / GRAHND", "tall"], ["petit / petite", "puh-TEE / puh-TEET", "short"], ["mince", "MANSS", "slim"], ["rond / ronde", "ROHN / ROHND", "plump"], ["élégant / élégante", "ay-lay-GAHN / -GAHNT", "elegant"], ["timide", "tee-MEED", "shy"], ["doux / douce", "DOO / DOOSS", "gentle"], ["calme", "KALM", "calm"], ["décontracté / décontractée", "day-kohn-trak-TAY", "relaxed"], ["dynamique", "dee-na-MEEK", "dynamic"], ["cultivé / cultivée", "kewl-tee-VAY", "cultured"], ["généreux / généreuse", "zhay-nay-RUH / -RUHZ", "generous"], ["autoritaire", "oh-to-ree-TAIR", "bossy"], ["allergique à", "a-lair-ZHEEK a", "allergic to"], ["un dessinateur", "uhn day-see-na-TUR", "an illustrator"], ["un architecte", "uh nar-shee-TEKT", "an architect"], ["la monotonie", "lah mo-no-to-NEE", "monotony"], ["une enquête", "ew nahn-KET", "a survey"], ["fondamentalement", "fohn-da-mahn-tal-MAHN", "fundamentally"], ["voir la vie en rose", "vwahr lah vee ahn ROZ", "to see life through rose-tinted glasses"], ["être d'accord", "EH-truh da-KOR", "to agree"]], "cols": "two"}]}, {"id": "ae-d3l3", "label": "Dossier 3 · Leçon 3", "name": "En famille", "summary": "Pages 70–73, complete. The wedding photo and ten labels, the Bossan family tree with the dialogue resolved, all family terms, possessive adjectives, French surname rules, all four announcement cards, the five texts, the body parts and avoir mal à.", "art": "arbre3", "bookpages": ["p070", "p071", "p072", "p073"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 3, in page order.", "tracks": [{"n": 97, "label": "p.70 act. 2 — Florian montre son album de photos"}, {"n": 98, "label": "p.71 act. 5 — phonétique, les « mots doux »"}, {"n": 99, "label": "p.71 act. 5 — prononciation identique ou différente ?"}, {"n": 100, "label": "p.71 act. 5 — singulier ou pluriel ?"}, {"n": 101, "label": "p.73 act. 11 — la conversation téléphonique"}]}, {"name": "Page 70 — la photo de mariage", "items": [["En famille", "ahn fa-MEE", "As a family"], ["Parler de sa famille", "par-LAY duh sa fa-MEE", "Talking about your family"], ["Activité 1 : Observez la photo et répondez.", "ob-sair-VAY lah fo-TO", "Look at the photo and answer."], ["1. Identifiez l'événement célébré. Justifiez votre réponse.", "ee-dahn-tee-fee-AY lay-vayn-MAHN say-lay-BRAY", "Identify the event being celebrated. Justify."], ["→ C'est un mariage : la mariée en robe blanche avec un bouquet, le marié en costume, la famille sur les marches de l'église, les pétales par terre.", "say tuhn ma-ree-AHZH … lay pay-TAL par TAIR", "It's a wedding: the bride in white with a bouquet, the groom in a suit, the family on the church steps, petals on the ground."], ["2. Comparez avec votre pays : que voit-on sur la photo d'un événement similaire ?", "kohm-pa-RAY a-vek VOT-ruh pay-EE", "Compare with your country: what do you see in a photo of a similar event?"], ["la mariée / le marié", "lah ma-ree-AY / luh ma-ree-AY", "the bride / the groom"], ["une robe blanche", "ewn rob BLAHNSH", "a white dress"], ["un bouquet", "uhn boo-KAY", "a bouquet"], ["des pétales", "day pay-TAL", "petals"]]}, {"name": "Page 70 — activité 2 : les dix étiquettes", "items": [["a) Florian montre son album de photos à son amie Coralie.", "flo-ree-AHN MOHN-truh soh nal-BOM duh fo-TO a soh na-MEE ko-ra-LEE", "Florian shows his photo album to his friend Coralie."], ["Écoutez Florian et repérez sur la photo les personnes citées.", "ay-koo-TAY … ay ruh-pay-RAY sewr lah fo-TO lay pair-SUN see-TAY", "Listen and find on the photo the people mentioned."], ["b) Réécoutez et associez les étiquettes aux personnes de la photo.", "… a-so-see-AY lay zay-TEE-ket", "Listen again and match the labels to the people."], ["ma mère", "ma MAIR", "my mother"], ["ma tante", "ma TAHNT", "my aunt"], ["mon grand-père paternel", "mohn grahn-PAIR pa-tair-NELL", "my paternal grandfather"], ["mon cousin", "mohn koo-ZAN", "my cousin (m)"], ["ma grand-mère paternelle", "ma grahn-MAIR pa-tair-NELL", "my paternal grandmother"], ["mon père", "mohn PAIR", "my father"], ["mon grand-père maternel", "mohn grahn-PAIR ma-tair-NELL", "my maternal grandfather"], ["mes cousines", "may koo-ZEEN", "my cousins (f)"], ["ma grand-mère maternelle", "ma grahn-MAIR ma-tair-NELL", "my maternal grandmother"], ["mon oncle", "moh NOHN-kluh", "my uncle"]], "note": "<strong>paternel</strong> = on your father's side · <strong>maternel</strong> = on your mother's side. French distinguishes them where English usually doesn't.", "cols": "two"}, {"name": "Page 70 — activité 3 : le dialogue entre Florian et Coralie", "items": [["Observez l'arbre généalogique de la famille Bossan et lisez les extraits du dialogue entre Florian et Coralie.", "ob-sair-VAY LAR-bruh zhay-nay-a-lo-ZHEEK", "Look at the Bossan family tree and read the dialogue extracts."], ["Trouvez le nom des personnes citées en caractères gras.", "troo-VAY luh nohn day pair-SUN see-TAY ahn ka-rak-TAIR GRAH", "Find the names of the people in bold."], ["Exemple : ton père → Franck Kassovitz", "tohn PAIR", "the worked example"], ["— C'est le jour du mariage de MES PARENTS. → Franck Kassovitz et Sonia Bossan-Kassovitz", "say luh zhoor dew ma-ree-AHZH duh may pa-RAHN", "It's my parents' wedding day."], ["— … la jeune femme juste derrière TON PÈRE, c'est TA TANTE ? → Laure Vaillant-Bossan", "lah zhuhn fam zhewst dair-ee-AIR tohn PAIR", "the young woman just behind your father, is that your aunt?"], ["— Oui, …, LA SŒUR DE MAMAN. → Laure Vaillant-Bossan", "lah sur duh ma-MAHN", "Yes, my mother's sister."], ["Et à côté d'elle, derrière maman, c'est MON ONCLE… → Philippe Vaillant", "ay a ko-TAY DELL, dair-ee-AIR ma-MAHN", "And next to her, behind mum, that's my uncle…"], ["et LEURS DEUX FILLES, elles sont là, au premier rang. → Marion et Camille Vaillant", "ay lur duh FEE-yuh … oh pruh-mee-AY RAHN", "and their two daughters, they're there, in the front row."], ["— Ah ! Ce sont TES COUSINES ! → Marion et Camille Vaillant", "suh sohn tay koo-ZEEN", "Ah! Those are your cousins!"], ["… Et TES GRANDS-PARENTS ? → Jacques Bossan et Hélène Bossan", "ay tay grahn-pa-RAHN", "And your grandparents?"], ["— Eh bien, LA MÈRE DE MAMAN, c'est la dame à gauche au premier rang. → Hélène Bossan (née Tailé)", "lah mair duh ma-MAHN … a GOSH oh pruh-mee-AY RAHN", "Well, my mother's mother is the lady on the left in the front row."], ["… Et SON MARI, MON GRAND-PÈRE, il est juste à côté de maman. → Jacques Bossan", "ay sohn ma-REE, mohn grahn-PAIR", "And her husband, my grandfather, is right next to mum."]]}, {"name": "Page 70 — l'arbre généalogique de la famille Bossan", "items": [["Jacques Bossan — Hélène Bossan (née Tailé)", "zhahk bo-SAHN — ay-LEN bo-SAHN (nay ta-ee-LAY)", "the grandparents"], ["Franck Kassovitz — Sonia Bossan-Kassovitz", "frank ka-so-VEETS — so-NYA", "Florian's parents"], ["Laure Vaillant-Bossan — Philippe Vaillant", "LOR va-YAHN — fee-LEEP", "the aunt and uncle"], ["Florian Kassovitz-Bossan", "flo-ree-AHN", "the speaker, only child"], ["Marion Vaillant", "ma-ree-OHN", "cousin (f)"], ["Camille Vaillant", "ka-MEE", "cousin (f)"], ["Alexandre Vaillant", "a-lek-SAHN-druh", "cousin (m)"]], "note": "Reading it from Florian's position: Jacques and Hélène are his <strong>grands-parents maternels</strong>; Sonia is his <strong>mère</strong>, Laure his <strong>tante</strong>, Philippe his <strong>oncle</strong>; Marion, Camille and Alexandre are his <strong>cousins</strong>. Note that all three married women carry double surnames."}, {"name": "Page 71 — Aide-mémoire : la famille", "items": [["Les parents = le père et la mère", "lay pa-RAHN = luh PAIR ay lah MAIR", "parents = father and mother"], ["Les enfants = le fils et la fille", "lay zahn-FAHN = luh FEESS ay lah FEE-yuh", "children = son and daughter"], ["Les grands-parents = le grand-père et la grand-mère", "lay grahn-pa-RAHN", "grandparents"], ["Les petits-enfants = le petit-fils et la petite-fille", "lay puh-tee-zahn-FAHN = luh puh-tee-FEESS ay lah puh-teet-FEE-yuh", "grandchildren = grandson and granddaughter"], ["Le frère / la sœur", "luh FRAIR / lah SUR", "brother / sister"], ["Le beau-frère / la belle-sœur", "luh bo-FRAIR / lah bell-SUR", "brother-in-law / sister-in-law"], ["Le beau-père / la belle-mère", "luh bo-PAIR / lah bell-MAIR", "father-in-law / mother-in-law"], ["L'oncle / la tante", "LOHN-kluh / lah TAHNT", "uncle / aunt"], ["Le cousin / la cousine", "luh koo-ZAN / lah koo-ZEEN", "cousin"], ["Le neveu / la nièce", "luh nuh-VUH / lah nee-ESS", "nephew / niece"]], "note": "Two traps here. <strong>le fils</strong> is pronounced <em>FEESS</em> — the l is silent and the s is sounded, the opposite of what you'd expect. And <strong>beau-père</strong> means both <em>father-in-law</em> and <em>stepfather</em>; context decides.", "cols": "two"}, {"name": "Page 71 — activité 4 : vrai ou faux", "items": [["Vrai ou faux ? Regardez l'arbre généalogique p. 70 et répondez.", "vray oo FO", "True or false? Look at the family tree and answer."], ["1. La belle-sœur de Franck s'appelle Laure. → VRAI : Laure est la sœur de sa femme Sonia.", "lah bell-SUR duh FRANK", "TRUE — Laure is his wife's sister."], ["2. Les nièces de Sonia s'appellent Marion et Camille. → VRAI : ce sont les filles de sa sœur Laure.", "lay nee-ESS duh so-NYA", "TRUE — they're her sister Laure's daughters."], ["3. Le beau-frère de Laure s'appelle Florian. → FAUX : Florian est son neveu ; son beau-frère est Franck.", "luh bo-FRAIR duh LOR", "FALSE — Florian is her nephew; her brother-in-law is Franck."], ["4. Florian est le frère de Camille. → FAUX : Florian est son cousin.", "flo-ree-AHN ay luh frair duh ka-MEE", "FALSE — Florian is her cousin."], ["5. Le beau-père de Franck s'appelle Jacques. → VRAI : Jacques est le père de sa femme Sonia.", "luh bo-PAIR duh FRANK", "TRUE — Jacques is his wife's father."]]}, {"name": "Page 71 — Point Langue : les adjectifs possessifs", "items": [["a) Complétez le tableau avec les adjectifs possessifs.", "kohm-play-TAY luh ta-BLO", "Complete the table with the possessive adjectives."], ["(je) MON père · MA tante · MES grands-parents", "mohn PAIR · ma TAHNT · may grahn-pa-RAHN", "my"], ["(tu) TON oncle · TA mère · TES enfants", "toh NOHN-kluh · ta MAIR · tay zahn-FAHN", "your (familiar)"], ["(il/elle) SON frère · SA sœur · SES parents", "sohn FRAIR · sa SUR · say pa-RAHN", "his / her"], ["(nous) NOTRE fils · NOTRE fille · NOS enfants", "NOT-ruh FEESS · NOT-ruh FEE · no zahn-FAHN", "our"], ["(vous) VOTRE frère · VOTRE sœur · VOS parents", "VOT-ruh FRAIR · VOT-ruh SUR · vo pa-RAHN", "your (polite/plural)"], ["(ils/elles) LEUR fils · LEUR fille · LEURS enfants", "lur FEESS · lur FEE · lur zahn-FAHN", "their"], ["Attention ! Mon amie, ton amie, son amie.", "moh na-MEE, toh na-MEE, soh na-MEE", "Careful! Before a feminine noun starting with a vowel."], ["Mon / ton / son + nom féminin qui commence par une voyelle.", "… kee ko-MAHNSS par ewn vwa-YELL", "Use mon/ton/son before a feminine noun beginning with a vowel."]], "note": "The one that trips everyone: <strong>son père</strong> means both <em>his father</em> and <em>her father</em>. French possessives agree with the thing owned, never with the owner.", "cols": "three"}, {"name": "Page 71 — un ou plusieurs possesseurs", "items": [["b) Complétez.", "kohm-play-TAY", "Complete."], ["UN POSSESSEUR — Franck Kassovitz et SON fils Florian → SON + nom masculin", "uhn po-say-SUR … sohn feess", "one owner + masculine noun → son"], ["Franck et SA femme Sonia → SA + nom féminin", "sa FAM", "one owner + feminine noun → sa"], ["Sonia et SES nièces Marion et Camille → SES + nom pluriel", "say nee-ESS", "one owner + plural noun → ses"], ["DEUX OU PLUSIEURS POSSESSEURS — Franck, Sonia et LEUR fils Florian → LEUR + nom singulier", "duh oo plew-zee-UR po-say-SUR … lur FEESS", "several owners + singular noun → leur"], ["Laure, Philippe et LEURS filles, Marion et Camille → LEURS + nom pluriel", "lur FEE-yuh", "several owners + plural noun → leurs"]], "note": "The distinction that matters: <strong>son/sa/ses</strong> for one owner, <strong>leur/leurs</strong> for several. And <em>leur</em> agrees only in number, never in gender — <em>leur fils</em>, <em>leur fille</em>, but <em>leurs enfants</em>."}, {"name": "Page 71 — Point Culture : les noms de famille", "items": [["Les noms de famille", "lay nohn duh fa-MEE", "Surnames"], ["A. Observez les noms de famille des trois femmes mariées dans l'arbre généalogique p. 70.", "… day trwah fam ma-ree-AY", "Look at the surnames of the three married women."], ["Observez les noms de famille des enfants, Florian, Marion, Camille et Alexandre. Que remarquez-vous ?", "kuh ruh-mar-kay VOO", "Look at the children's surnames. What do you notice?"], ["→ Hélène Bossan (née Tailé) a pris le nom de son mari.", "a pree luh nohn duh sohn ma-REE", "Hélène took her husband's name."], ["→ Sonia Bossan-Kassovitz et Laure Vaillant-Bossan ont un nom double.", "ohn tuhn nohn DOO-bluh", "Sonia and Laure have double surnames."], ["→ Florian porte les deux noms (Kassovitz-Bossan), mais Marion, Camille et Alexandre portent seulement le nom du père (Vaillant).", "… POR-tuh lay duh NOHN", "Florian carries both names; the Vaillant children carry only their father's."], ["B. Sonia Bossan se marie avec Franck Kassovitz. Après son mariage, elle a quatre choix possibles pour son nom de famille :", "… katr SHWAH po-SEE-bluh", "After marrying, Sonia has four possible choices of surname:"], ["- Elle peut garder son nom de jeune fille (Bossan).", "el puh gar-DAY sohn nohn duh zhuhn FEE", "She can keep her maiden name."], ["- Elle peut aussi s'appeler : KASSOVITZ, BOSSAN-KASSOVITZ ou KASSOVITZ-BOSSAN.", "el puh oh-SEE sa-play", "Or she can be called Kassovitz, Bossan-Kassovitz or Kassovitz-Bossan."], ["Il y a aussi quatre possibilités pour le nom de son enfant : BOSSAN, KASSOVITZ, BOSSAN-KASSOVITZ, KASSOVITZ-BOSSAN.", "… poor luh nohn duh soh nahn-FAHN", "There are also four possibilities for the child's name."], ["C. Comparez avec la situation dans votre pays.", "kohm-pa-RAY a-vek lah see-tew-a-see-OHN", "Compare with the situation in your country."], ["un nom de jeune fille", "uhn nohn duh zhuhn FEE", "a maiden name"], ["née", "NAY", "née — born"]]}, {"name": "Page 71 — activités 5, 6 et 7", "items": [["Activité 5 Phonétique a) Écoutez les « mots doux » et répétez.", "ay-koo-TAY lay mo DOO", "Listen to the 'sweet words' and repeat."], ["b) Écoutez et dites si la prononciation est identique ou différente.", "… ee-dahn-TEEK oo dee-fay-RAHNT", "Say whether the pronunciation is the same or different."], ["c) Écoutez et dites si le mot est au singulier ou au pluriel.", "… oh san-gew-lee-AY oo oh plew-ree-AY", "Say whether the word is singular or plural."], ["Activité 6 : Échangez ! Comparez la composition de vos familles.", "ay-shahn-ZHAY ! kohm-pa-RAY lah kohm-po-zee-see-OHN duh vo fa-MEE", "Compare the make-up of your families."], ["(nombre de frères/sœurs, oncles/tantes, cousins/cousines, nombre d'enfants…)", "NOHM-bruh duh FRAIR / SUR", "number of brothers and sisters, uncles and aunts, cousins, children"], ["Qui a une très grande famille ? Qui a une petite famille ?", "kee a ewn tray grahnd fa-MEE", "Who has a very large family? Who has a small one?"], ["Activité 7 : Dessinez votre arbre généalogique et présentez votre famille à votre voisin(e).", "day-see-NAY VOT-ruh AR-bruh zhay-nay-a-lo-ZHEEK", "Draw your family tree and present your family to your neighbour."], ["Si possible, apportez une photo de votre famille en classe.", "see po-SEE-bluh, a-por-TAY ewn fo-TO", "If possible, bring a family photo to class."]], "note": "The <em>mots doux</em> in activity 5 are the affectionate family words — <em>papa, maman, papi, mamie, tonton, tatie</em> — and the drill contrasts singular and plural forms that sound alike."}, {"name": "Page 72 — Faire-part a : la naissance de Clémentine", "items": [["Annoncer un événement familial, réagir", "a-nohn-SAY uh nay-vayn-MAHN fa-mee-lee-AL, ray-a-ZHEER", "Announcing a family event, reacting"], ["Julie et David sont heureux de vous annoncer la naissance de leur fille", "zhew-LEE ay da-VEED sohn tuh-RUH duh voo za-nohn-SAY lah nay-SAHNSS duh lur FEE", "Julie and David are happy to announce the birth of their daughter"], ["Clémentine", "klay-mahn-TEEN", "Clémentine"], ["51 cm, 3 kg 100, le 10 juin", "san-kahnt-ay-UHN sahn-tee-MET-ruh, trwah kee-lo SAHN, luh dee ZHWAN", "51 cm, 3.1 kg, on 10 June"], ["Julie et David Bontemps, 12 rue de la République — 21000 Dijon", "bohn-TAHN", "the parents and their address"]], "note": "A birth announcement, printed on pink card. Note that the baby's <strong>measurements and weight</strong> are given — standard on French birth announcements, unlike in English-speaking countries."}, {"name": "Page 72 — Faire-part b : le mariage d'Aude et Christophe", "items": [["M. et Mme Dunand, 19, rue du Connétable, 60500 Chantilly", "muh-SYUH ay ma-DAM dew-NAHN", "the bride's parents"], ["M. et Mme Lagrange, 9, rue Léon Blum, 80000 Amiens", "la-GRAHNZH", "the groom's parents"], ["sont heureux de vous annoncer le mariage de leurs enfants", "sohn tuh-RUH duh voo za-nohn-SAY luh ma-ree-AHZH duh lur zahn-FAHN", "are happy to announce the marriage of their children"], ["Aude et Christophe", "OD ay krees-TOF", "Aude and Christophe"], ["le 15 septembre 2012", "luh kanz sep-TAHM-bruh duh meel dooz", "on 15 September 2012"], ["à la mairie de Chantilly à 15 h 30", "a lah may-REE duh shahn-tee-YEE a kanz UR trahnt", "at Chantilly town hall at 3.30pm"], ["puis à l'église Notre-Dame à 16 h 30", "pwee a lay-GLEEZ no-truh-DAM a sez UR trahnt", "then at Notre-Dame church at 4.30pm"]], "note": "A formal wedding announcement, in copperplate script, sent by <strong>the parents of both families</strong> rather than by the couple. Note the two ceremonies: the civil one at the <em>mairie</em> is the legally binding one in France, the church service follows."}, {"name": "Page 72 — Faire-part c : le mariage d'Olivier et Fanny", "items": [["Je dis oui ! / Je dis oui !", "zhuh dee WEE", "I say yes! — on placards held by the couple"], ["Le 17 mai nous disons oui, oui, oui !", "luh dee-SET MAY noo dee-ZOHN wee, wee, WEE", "On 17 May we say yes, yes, yes!"], ["à la mairie de Fontainebleau à 17 h 00.", "a lah may-REE duh fohn-ten-BLO a dee-set UR", "at Fontainebleau town hall at 5pm."], ["Après la cérémonie, rendez-vous à la salle des fêtes.", "a-PRAY lah say-ray-mo-NEE, rahn-day-VOO a lah sal day FET", "After the ceremony, meet at the village hall."], ["Vous dites oui ? Confirmez votre présence avant le 17 février.", "voo deet WEE ? kohn-feer-MAY VOT-ruh pray-ZAHNSS", "Are you saying yes? Confirm your attendance before 17 February."], ["olivieretfanny.over-blog.fr", "…", "their wedding blog"]], "note": "The informal counterpart to card b: same event, but sent by <strong>the couple themselves</strong>, with a photo, a joke on <em>dire oui</em>, and a blog address instead of an RSVP card."}, {"name": "Page 72 — Faire-part d : la naissance de Léa", "items": [["Notre petite sœur s'appelle Léa", "NOT-ruh puh-teet SUR sa-PELL lay-AH", "Our little sister is called Léa"], ["Elle est née le 3 avril.", "el ay nay luh trwah za-VREEL", "She was born on 3 April."], ["Elle pèse 2 kg 900 et mesure 50 cm.", "el pez duh kee-lo nuhf SAHN ay muh-ZEWR san-KAHNT sahn-tee-MET-ruh", "She weighs 2.9 kg and is 50 cm."], ["Simon et Julie, Agathe et Jérôme Duchemin", "see-MOHN ay zhew-LEE, a-GAT ay zhay-ROM dew-shuh-MAN", "the older siblings and the parents"], ["14 rue de la Marne, 34000 Montpellier", "…", "the address"]], "note": "The clever touch: this birth is announced by <strong>the older brother and sister</strong>, Simon and Julie, not by the parents — which is why it opens <em>Notre petite sœur</em>."}, {"name": "Page 72 — activités 8 et 9", "items": [["Activité 8 : Lisez les quatre faire-part et répondez.", "lee-ZAY lay katr fair-PAR", "Read the four announcements and answer."], ["1. Quels événements sont annoncés ?", "kel zay-vayn-MAHN sohn ta-nohn-SAY", "Which events are announced?"], ["→ Deux naissances (a : Clémentine ; d : Léa) et deux mariages (b : Aude et Christophe ; c : Olivier et Fanny).", "duh nay-SAHNSS ay duh ma-ree-AHZH", "Two births and two marriages."], ["2. Quel type de faire-part préférez-vous ? Pourquoi ?", "kel teep duh fair-PAR pray-fay-ray VOO", "Which kind do you prefer? Why?"], ["3. Est-ce que dans votre pays les familles envoient des faire-part pour ces événements ? Si oui, de quel type ?", "… lay fa-MEE ahn-VWAH day fair-PAR", "Do families in your country send announcements for these events?"], ["Activité 9 : Relisez les faire-part et trouvez pour chacun :", "ruh-lee-ZAY … poor sha-KUHN", "For each one, find:"], ["1. qui annonce l'événement", "kee a-NOHNSS lay-vayn-MAHN", "who announces the event"], ["→ a : les parents · b : les parents des mariés · c : les mariés eux-mêmes · d : le frère et la sœur", "…", "the four answers"], ["2. qui fait l'événement", "kee fay lay-vayn-MAHN", "who the event is about"], ["→ a : Clémentine · b : Aude et Christophe · c : Olivier et Fanny · d : Léa", "…", "the four answers"], ["3. quels sont les liens familiaux", "kel sohn lay lee-AN fa-mee-lee-O", "what the family relationships are"], ["→ a : parents/fille · b : parents/enfants · c : le couple · d : frère et sœur/petite sœur", "…", "the four answers"]]}, {"name": "Page 72 — Aide-mémoire : dire au présent", "items": [["je dis", "zhuh DEE", "I say"], ["tu dis", "tew DEE", "you say"], ["il / elle dit", "eel DEE", "he / she says"], ["nous disons", "noo dee-ZOHN", "we say"], ["vous dites", "voo DEET", "you say"], ["ils / elles disent", "eel DEEZ", "they say"], ["Observez : vous êtes / vous faites / vous dites", "voo ZET / voo FET / voo DEET", "Note these three."]], "note": "These are <strong>the only three verbs in French</strong> whose <em>vous</em> form ends in <strong>-tes</strong> instead of <em>-ez</em>. Every other verb, without exception, takes <em>-ez</em>.", "cols": "three"}, {"name": "Page 72 — activité 10 : les cinq textos", "items": [["a) Lisez les textos et identifiez l'événement familial : mariage, naissance ou décès ?", "lee-ZAY lay teks-TO", "Read the texts and identify the event: marriage, birth or death?"], ["Texto 1 — Mamie Marie : « Quelle bonne nouvelle ! Tous mes vœux de bonheur pour toi et ton futur mari ! Bises »", "kell bun noo-VELL ! too may vuh duh bo-NUR … tohn few-TEWR ma-REE", "What good news! All my best wishes for you and your future husband!"], ["Texto 2 — Claire : « Je sors de l'hôpital. J'ai une mauvaise nouvelle : tante Marcelle est décédée… »", "zhuh sor duh lo-pee-TAL. zhay ewn mo-VEZ noo-VELL … ay day-say-DAY", "I'm leaving the hospital. Bad news: aunt Marcelle has died…"], ["Texto 3 — Samuel : « Félicitations pour la naissance de ta fille ! Je suis très heureux pour vous. Et comment va la maman ? »", "fay-lee-see-ta-see-OHN poor lah nay-SAHNSS … ay ko-mahn va lah ma-MAHN", "Congratulations on your daughter's birth! And how is the mother?"], ["Texto 4 — Clémence : « J'ai une grande nouvelle ! Je me marie ! Bisous »", "zhay ewn grahnd noo-VELL ! zhuh muh ma-REE", "I have big news! I'm getting married!"], ["Texto 5 — Marc : « Je suis papa pour la 2e fois ☺ ! Nathan est né cette nuit à 3 h ! »", "zhuh swee pa-PAH poor lah duh-zee-EM FWAH ! na-TAHN ay nay set NWEE", "I'm a dad for the second time! Nathan was born last night at 3am!"], ["b) Répondez. 1. Quels textos annoncent un événement ?", "kel teks-TO a-NOHNSS uh nay-vayn-MAHN", "Which texts announce an event?"], ["→ Les textos 2 (un décès), 4 (un mariage) et 5 (une naissance).", "…", "texts 2, 4 and 5"], ["2. Quels textos répondent à l'annonce d'un événement ?", "kel teks-TO ray-POHND a la-NOHNSS", "Which texts reply to an announcement?"], ["→ Les textos 1 (réponse à Clémence) et 3 (réponse à Marc).", "…", "texts 1 and 3"]]}, {"name": "Page 73 — Aide-mémoire : annoncer et réagir", "items": [["Annoncer un événement familial", "a-nohn-SAY uh nay-vayn-MAHN fa-mee-lee-AL", "Announcing a family event"], ["M. et Mme … sont heureux de vous annoncer la naissance de…", "sohn tuh-RUH duh voo za-nohn-SAY lah nay-SAHNSS duh", "are happy to announce the birth of…"], ["… le mariage de…", "luh ma-ree-AHZH duh", "…the marriage of…"], ["J'ai une bonne / grande nouvelle : je me marie !", "zhay ewn bun / grahnd noo-VELL", "I have good / big news: I'm getting married!"], ["M. et Mme … ont la grande tristesse de vous annoncer le décès de…", "ohn lah grahnd trees-TESS duh voo za-nohn-SAY luh day-SAY duh", "have the great sadness to announce the death of…"], ["J'ai une mauvaise nouvelle : ta tante est décédée.", "zhay ewn mo-VEZ noo-VELL : ta tahnt ay day-say-DAY", "I have bad news: your aunt has died."], ["Réagir à une nouvelle, féliciter", "ray-a-ZHEER a ewn noo-VELL, fay-lee-see-TAY", "Reacting to news, congratulating"], ["Félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Quelle bonne nouvelle ! Je suis très heureux / heureuse pour toi / vous.", "kell bun noo-VELL", "What good news! I'm very happy for you."], ["Tous mes / nos vœux de bonheur.", "too may / no vuh duh bo-NUR", "All my / our best wishes for happiness."], ["Quelle triste nouvelle ! Je suis désolé(e) pour toi / vous.", "kell treest noo-VELL … zhuh swee day-zo-LAY", "What sad news! I'm sorry for you."]], "note": "Notice the built-in contrast: <strong>sont heureux de</strong> for a happy announcement, <strong>ont la grande tristesse de</strong> for a death — the formal wording pairs are fixed.", "cols": "two"}, {"name": "Page 73 — activité 11 : la conversation téléphonique", "items": [["a) Écoutez la conversation téléphonique. Identifiez la situation et faites des hypothèses sur l'événement annoncé.", "… fet day zee-po-TEZ", "Listen to the phone call. Identify the situation and guess the event."], ["b) Réécoutez. Mettez dans l'ordre les répliques suivantes pour reconstituer la conversation.", "met-TAY dahn LOR-druh lay ray-PLEEK", "Put the lines in order to reconstruct the conversation."], ["1. — Maman, ça y est, Nathan est arrivé !", "ma-MAHN, sa ee AY, na-TAHN ay ta-ree-VAY", "Mum, that's it, Nathan has arrived!"], ["2. — Oui, cette nuit à 3 heures !", "wee, set NWEE a trwa ZUR", "Yes, last night at 3!"], ["3. — Je trouve qu'il ressemble à sa maman, il a le nez et la bouche de Marie ! Il pèse 3 kilos et il mesure 50 cm !", "zhuh troov keel ruh-SAHM-bluh a sa ma-MAHN … eel a luh NAY ay lah BOOSH", "I think he looks like his mum — he has Marie's nose and mouth! He weighs 3 kilos and is 50 cm!"], ["4. — Oh, elle va bien, elle a juste un peu mal au ventre, c'est normal ! Mais moi, je suis épuisé. J'ai mal à la tête, c'est terrible.", "… ewn puh mal oh VAHN-truh … zhuh swee zay-pwee-ZAY. zhay mal a lah TET", "Oh, she's fine, just a bit of stomach ache, that's normal! But me, I'm exhausted. I have a headache, it's terrible."], ["c) Dites quel texto de la p. 72 correspond à cette situation.", "deet kel teks-TO … ko-res-POHN", "Say which text on p.72 matches this situation."], ["→ Le texto 5, de Marc : « Nathan est né cette nuit à 3 h ! »", "luh teks-TO SANK", "Text 5, from Marc."]], "note": "The order is <strong>1 → 2 → 3 → 4</strong>: the announcement, the confirmation of time, the description of the baby, then the news of the mother and the exhausted father."}, {"name": "Page 73 — Point Langue : les parties du corps", "items": [["Associez les mots aux numéros.", "a-so-see-AY lay mo oh new-may-RO", "Match the words to the numbers."], ["les cheveux (1)", "lay shuh-VUH", "the hair — top of the head"], ["un œil, les yeux (2)", "uh NUH-yuh, lay ZYUH", "an eye, the eyes"], ["le nez (3)", "luh NAY", "the nose"], ["la bouche (4)", "lah BOOSH", "the mouth"], ["une main (5)", "ewn MAN", "a hand"], ["un pied (6)", "uhn pee-AY", "a foot"], ["une jambe (7)", "ewn ZHAHMB", "a leg"], ["le ventre (8)", "luh VAHN-truh", "the stomach"], ["un bras (9)", "uhn BRAH", "an arm"], ["une épaule (10)", "ew nay-POL", "a shoulder"], ["une oreille (11)", "ew no-RAY", "an ear"], ["les dents (12)", "lay DAHN", "the teeth"], ["le dos (13)", "luh DO", "the back"], ["la tête (14)", "lah TET", "the head"]], "note": "Two irregular plurals in one list: <strong>un œil → les yeux</strong> (completely different word) and <strong>un cheveu → les cheveux</strong> (you almost always use the plural for hair).", "cols": "two"}, {"name": "Page 73 — Aide-mémoire : demander et donner des nouvelles", "items": [["Demander des nouvelles de quelqu'un", "duh-mahn-DAY day noo-VELL duh kel-KUHN", "Asking after someone"], ["Comment vas-tu ? / Comment allez-vous ?", "ko-mahn va TEW / ko-mahn ta-lay VOO", "How are you?"], ["Comment elle va ?", "ko-mahn el VA", "How is she?"], ["Donner des nouvelles", "do-NAY day noo-VELL", "Giving news"], ["Elle va bien (mieux). ≠ Elle va mal…", "el va bee-AN (mee-UH) ≠ el va MAL", "She's well (better). ≠ She's unwell…"], ["Elle a mal.", "el a MAL", "She's in pain."], ["J'ai mal à la tête.", "zhay mal a lah TET", "I have a headache."], ["J'ai mal à l'épaule.", "zhay mal a lay-POL", "My shoulder hurts."], ["J'ai mal au ventre.", "zhay mal oh VAHN-truh", "I have stomach ache."], ["J'ai mal aux jambes.", "zhay mal oh ZHAHMB", "My legs hurt."]], "note": "<strong>avoir mal à</strong> + the body part, and the article contracts exactly as always: <em>à la</em> tête, <em>à l'</em>épaule, <em>au</em> ventre, <em>aux</em> jambes.", "cols": "two"}, {"name": "Page 73 — activités 12, 13 et le projet", "items": [["Activité 12 : Imaginez une situation puis mimez devant le groupe pour montrer où vous avez mal.", "ee-ma-zhee-NAY ewn see-tew-a-see-OHN pwee mee-MAY", "Imagine a situation then mime it to show where it hurts."], ["Le groupe devine où vous avez mal. Exemple : après un marathon", "luh groop duh-VEEN … a-PRAY uhn ma-ra-TOHN", "The group guesses. Example: after a marathon"], ["Activité 13 a) Marc annonce la naissance de Nathan. En petits groupes, vous imaginez le faire-part (texte et présentation).", "… voo zee-ma-zhee-NAY luh fair-PAR", "In small groups, invent the birth announcement for Nathan."], ["b) En réponse au faire-part de Marc, vous écrivez un mail pour féliciter et demander des nouvelles.", "… poor fay-lee-see-TAY ay duh-mahn-DAY day noo-VELL", "Write a reply email to congratulate and ask for news."], ["Projet Dossier 3 — Tâches leçon 3 : Composer une famille pour un scénario de film et concevoir l'affiche du film.", "kohm-po-ZAY ewn fa-MEE … ay kohn-suh-VWAHR la-FEESH", "Tasks: compose a family for a film scenario and design the poster."]], "note": "Activity 13 pulls the whole lesson together — you need the announcement formulas from the aide-mémoire, the baby's measurements as on cards a and d, and then the congratulation phrases plus <em>comment va la maman ?</em> for the reply."}, {"name": "Le vocabulaire de la leçon", "items": [["un faire-part", "uhn fair-PAR", "an announcement card"], ["une naissance", "ewn nay-SAHNSS", "a birth"], ["un mariage", "uhn ma-ree-AHZH", "a wedding"], ["un décès", "uhn day-SAY", "a death"], ["décéder", "day-say-DAY", "to pass away"], ["naître / né(e)", "NET-ruh / NAY", "to be born / born"], ["un événement familial", "uh nay-vayn-MAHN fa-mee-lee-AL", "a family event"], ["une nouvelle", "ewn noo-VELL", "a piece of news"], ["annoncer", "a-nohn-SAY", "to announce"], ["réagir", "ray-a-ZHEER", "to react"], ["féliciter", "fay-lee-see-TAY", "to congratulate"], ["les félicitations", "lay fay-lee-see-ta-see-OHN", "congratulations"], ["le bonheur", "luh bo-NUR", "happiness"], ["la tristesse", "lah trees-TESS", "sadness"], ["des vœux", "day VUH", "wishes"], ["une cérémonie", "ewn say-ray-mo-NEE", "a ceremony"], ["la mairie", "lah may-REE", "the town hall"], ["l'église", "lay-GLEEZ", "the church"], ["la salle des fêtes", "lah sal day FET", "the village hall"], ["confirmer sa présence", "kohn-feer-MAY sa pray-ZAHNSS", "to confirm attendance"], ["peser", "puh-ZAY", "to weigh"], ["mesurer", "muh-zew-RAY", "to measure"], ["ressembler à", "ruh-sahm-BLAY a", "to look like"], ["épuisé / épuisée", "ay-pwee-ZAY", "exhausted"], ["l'hôpital", "lo-pee-TAL", "the hospital"], ["les liens familiaux", "lay lee-AN fa-mee-lee-O", "family ties"], ["un rang", "uhn RAHN", "a row"], ["paternel / maternel", "pa-tair-NELL / ma-tair-NELL", "paternal / maternal"], ["un arbre généalogique", "uh NAR-bruh zhay-nay-a-lo-ZHEEK", "a family tree"], ["un texto", "uhn teks-TO", "a text message"]], "cols": "two"}]}, {"id": "ae-d3-carnet", "label": "Dossier 3 · Carnet de voyage", "name": "Loisirs", "summary": "Pages 74–75, complete. Five leisure-fair posters, seven hobbies matched to their fair, the full cultural-leisure table from 1990 to 2010, and the six outdoor activities ranked.", "art": null, "bookpages": ["p074", "p075"], "groups": [{"name": "Page 74 — les cinq affiches de salons", "items": [["Carnet de voyage — Loisirs", "kar-NAY duh vwa-YAHZH — lwa-ZEER", "Travel notebook — Leisure"], ["2e salon des Loisirs créatifs — Ville de Gagny", "duh-zee-EM sa-LOHN day lwa-ZEER kray-a-TEEF", "2nd Creative Crafts Fair — town of Gagny"], ["2 et 3 avril, 10h-12h30 / 14h-18h30, à l'ARENA — Entrée libre", "duh ay trwah za-VREEL … ahn-TRAY LEE-bruh", "2 and 3 April, 10–12.30 and 2–6.30, at the Arena — free entry"], ["MAP — Salon de la Photographie & des Loisirs Numériques", "sa-LOHN duh lah fo-to-gra-FEE ay day lwa-ZEER new-may-REEK", "Photography and Digital Leisure Fair"], ["Du 16 au 18 Mai — Toulouse - Diagora", "dew sez oh dee-ZWEET MAY", "16 to 18 May, Toulouse"], ["Rencontres · Innovations · Démonstrations — www.map-photo.fr", "rahn-KOHN-truh · ee-no-va-see-OHN · day-mohn-stra-see-OHN", "Meetings, innovations, demonstrations"], ["Salon de la Pêche & des Loisirs Aquatiques", "sa-LOHN duh lah PESH ay day lwa-ZEER a-kwa-TEEK", "Fishing and Watersports Fair"], ["20, 21, 22, 23 mai — Hippodrome de la Côte d'Azur", "ee-po-DROM duh lah kot da-ZEWR", "20–23 May, at the Côte d'Azur racecourse"], ["Vivre le Plein'Air — Le week-end des sports et loisirs de plein air", "VEE-vruh luh plen-AIR", "Living the Outdoors — the outdoor sports and leisure weekend"], ["06 et 07 juin — Forbach", "zay-RO sees ay zay-RO set ZHWAN", "6 and 7 June, Forbach"], ["Music & You Paris — Salon de la Musique, Grande Halle de la Villette", "mew-ZEEK ay YOU", "the Music Fair at the Grande Halle de la Villette"], ["28 Sept. → 1er Oct. 2012 — Ateliers, showcases, concerts, démos", "a-tuh-lee-AY, shoh-KAYS, kohn-SAIR, day-MO", "workshops, showcases, concerts, demos"], ["Apprendre, jouer, partager — Fêter toutes les musiques — Tous les instruments", "a-PRAHN-druh, zhoo-AY, par-ta-ZHAY", "Learn, play, share — celebrating all music — all instruments"], ["www.salon-musique.com", "…", "the website"]], "note": "Five fairs, each with its dates and venue. Activity 1 asks you to choose the one that interests you and say why."}, {"name": "Page 74 — activités 1 et 2", "items": [["Activité 1 : Regardez les affiches de différents salons de loisirs et choisissez le salon qui vous intéresse. Justifiez votre choix.", "… shwa-zee-SAY luh sa-LOHN kee voo zan-tay-RESS", "Look at the posters and choose the fair that interests you. Justify."], ["Activité 2 : Regardez la liste d'activités de loisirs suivante et associez chaque activité à un des salons.", "… a-so-see-AY shak ak-tee-vee-TAY", "Match each activity to one of the fairs."], ["1. calligraphie → Salon des Loisirs créatifs", "ka-lee-gra-FEE", "calligraphy"], ["2. plongée sous-marine → Salon de la Pêche & des Loisirs Aquatiques", "plohn-ZHAY soo-ma-REEN", "scuba diving"], ["3. VTT → Vivre le Plein'Air", "vay-tay-TAY", "mountain biking (vélo tout terrain)"], ["4. tricot / couture → Salon des Loisirs créatifs", "tree-KO / koo-TEWR", "knitting / sewing"], ["5. composition de musique → Music & You, Salon de la Musique", "kohm-po-zee-see-OHN duh mew-ZEEK", "composing music"], ["6. voile → Salon de la Pêche & des Loisirs Aquatiques", "VWAL", "sailing"], ["7. montage photo → MAP, Salon de la Photographie", "mohn-TAHZH fo-TO", "photo editing"]]}, {"name": "Page 75 — activité 3 : les loisirs culturels des Français", "items": [["Prenez connaissance des statistiques suivantes sur les loisirs culturels des Français.", "pruh-NAY ko-nay-SAHNSS day sta-tees-TEEK", "Study the following statistics on French cultural leisure."], ["a) Regardez les affiches p. 74. Les activités citées dans l'enquête correspondent à quels salons ?", "… ko-res-POHND a kel sa-LOHN", "Which fairs do the survey's activities correspond to?"], ["b) Quel salon concerne un nouveau type de loisirs apparu dans les années 2000 ?", "kel sa-LOHN kohn-SAIRN uhn noo-VO teep duh lwa-ZEER a-pa-REW", "Which fair concerns a new kind of leisure that appeared in the 2000s?"], ["→ Le salon MAP (photographie et loisirs numériques) : l'activité en amateur sur ordinateur passe de 0 à 23 %.", "… lwa-ZEER new-may-REEK", "The MAP fair — digital leisure. Computer-based hobbies went from nothing to 23%."], ["Sur 100 personnes de 15 ans et plus, ont pratiqué au cours des douze derniers mois les activités suivantes :", "sewr sahn pair-SUN duh kanz ahn ay PLEW", "Per 100 people aged 15+, who did the following in the last twelve months:"]]}, {"name": "Page 75 — le tableau complet : 1990-2000 → 2001-2010", "items": [["Faire des photographies : 66 → 70", "fair day fo-to-gra-FEE", "taking photographs — up"], ["Appareil non numérique : 66 → 27", "a-pa-RAY nohn new-may-REEK", "non-digital camera — collapsed"], ["Appareil numérique (téléphone inclus) : / → 60", "a-pa-RAY new-may-REEK", "digital camera, phones included — from nothing to 60"], ["Faire des films ou des vidéos : 14 → 27", "fair day FEELM oo day vee-day-O", "making films or videos — nearly doubled"], ["Caméra ou caméscope non numérique : 14 → 4", "ka-may-RAH oo ka-may-SKOP", "non-digital camcorder — collapsed"], ["Caméscope numérique (téléphone inclus) : / → 26", "ka-may-SKOP new-may-REEK", "digital camcorder — from nothing to 26"], ["Faire de la musique : 17 → 16", "fair duh lah mew-ZEEK", "making music — stable"], ["Jouer d'un instrument de musique : 13 → 12", "zhoo-AY duhn an-strew-MAHN", "playing an instrument"], ["Faire du chant ou de la musique avec une organisation ou des amis : 10 → 8", "fair dew SHAHN", "singing or playing with a group or friends"], ["Pratiquer une autre activité en amateur : 32 → 30", "pra-tee-KAY ew NO-truh ak-tee-vee-TAY ah na-ma-TUR", "other amateur activities"], ["Faire du théâtre : 2 → 2", "fair dew tay-AH-truh", "amateur theatre"], ["Faire de la danse : 7 → 8", "fair duh lah DAHNSS", "dancing"], ["Tenir un journal intime, noter des réflexions : 9 → 8", "tuh-NEER uhn zhoor-NAL an-TEEM", "keeping a diary"], ["Écrire des poèmes, nouvelles, romans : 6 → 6", "ay-KREER day po-EM, noo-VELL, ro-MAHN", "writing poems, short stories, novels"], ["Faire de la peinture, sculpture ou gravure : 10 → 9", "fair duh lah pan-TEWR, skewl-TEWR oo gra-VEWR", "painting, sculpture or engraving"], ["Faire du dessin : 16 → 14", "fair dew day-SAN", "drawing"], ["Faire de l'artisanat d'art : 4 → 4", "fair duh lar-tee-za-NAH DAR", "craft work"], ["Avoir une activité en amateur sur l'ordinateur : / → 23", "a-VWAHR ewn ak-tee-vee-TAY … sewr lor-dee-na-TUR", "computer-based hobbies — from nothing to 23"], ["Créer de la musique sur ordinateur : / → 4", "kray-AY duh lah mew-ZEEK", "making music on a computer"], ["Écrire un journal personnel sur ordinateur : / → 12", "ay-KREER uhn zhoor-NAL pair-so-NELL", "keeping a personal journal on a computer"], ["Avoir une activité graphique sur ordinateur : / → 8", "… ak-tee-vee-TAY gra-FEEK", "graphic work on a computer"], ["Créer un blog ou un site personnel : / → 7", "kray-AY uhn BLOG oo uhn seet pair-so-NELL", "creating a blog or personal site"], ["* Sauf dans le cas des activités en amateur sur ordinateur. ** Hors photographie et vidéo.", "SOF … OR fo-to-gra-FEE", "the two footnotes"], ["Source : ministère de la Culture et de la Communication", "mee-nees-TAIR duh lah kewl-TEWR", "the source"]], "note": "The story in one line: <strong>photography and video didn't decline — they went digital</strong>. Film cameras fell from 66 to 27 while digital rose from nothing to 60, and camcorders did the same, 14 down to 4 against 26.", "cols": "two"}, {"name": "Page 75 — activité 4 : les loisirs de plein air", "items": [["a) Dans une enquête sur les Français et les loisirs de plein air, les résultats indiquent six loisirs principaux :", "… lay lwa-ZEER duh plen AIR", "In a survey on the French and outdoor leisure, six main activities emerge:"], ["jardinage — camping — pique-nique — sport nautique — barbecue — randonnée", "zhar-dee-NAHZH — kahm-PEENG — peek-NEEK — spor no-TEEK — bar-buh-KEW — rahn-do-NAY", "gardening, camping, picnicking, watersports, barbecue, hiking"], ["En petits groupes, faites des hypothèses sur la pratique de ces loisirs en France : imaginez leur classement de 1 à 6.", "… ee-ma-zhee-NAY lur klahss-MAHN", "In small groups, guess how they rank from 1 to 6."], ["b) Vérifiez vos hypothèses : découvrez en bas de page le classement de l'enquête.", "vay-ree-fee-AY vo zee-po-TEZ", "Check your guesses at the foot of the page."], ["Des loisirs en plein air largement pratiqués par les Français :", "larzh-MAHN pra-tee-KAY", "Outdoor activities widely practised by the French:"], ["1. Barbecue — 75 %", "bar-buh-KEW", "the clear winner"], ["2. Pique-nique — 62 %", "peek-NEEK", "picnicking"], ["3. Jardinage — 55 %", "zhar-dee-NAHZH", "gardening"], ["4. Randonnée — 48 %", "rahn-do-NAY", "hiking"], ["5. Camping — 34 %", "kahm-PEENG", "camping"], ["6. Sport nautique — 25 %", "spor no-TEEK", "watersports"]], "note": "The answers are printed upside down at the foot of the page. The surprise for most learners is that <strong>the barbecue tops the list</strong>, ahead of gardening and hiking."}, {"name": "Page 75 — activités 5 et 6", "items": [["Activité 5 : Imaginez une enquête similaire dans votre pays.", "ee-ma-zhee-NAY ewn ahn-KET see-mee-LAIR", "Imagine a similar survey in your country."], ["a) Dites si ces six loisirs de plein air sont importants.", "deet see say see lwa-ZEER … sohn tan-por-TAHN", "Say whether these six outdoor activities matter there."], ["b) Dites si d'autres loisirs de plein air ont beaucoup de succès.", "… ohn bo-KOO duh sewk-SAY", "Say whether other outdoor activities are very popular."], ["Activité 6 : Le Salon de tous les loisirs commence bientôt dans votre ville.", "luh sa-LOHN duh too lay lwa-ZEER", "The All-Leisure Fair is starting soon in your town."], ["Faites une enquête dans la classe et dites quels stands vous proposez pour ce salon, en fonction de vos intérêts et des tendances actuelles.", "… kel STAHND voo pro-po-ZAY … ay day tahn-DAHNSS ak-tew-ELL", "Survey the class and say which stands you'd propose, based on your interests and current trends."]]}, {"name": "Le vocabulaire du carnet", "items": [["un salon", "uhn sa-LOHN", "a trade fair, a show"], ["un stand", "uhn STAHND", "a stand"], ["l'entrée libre", "lahn-TRAY LEE-bruh", "free entry"], ["les loisirs créatifs", "lay lwa-ZEER kray-a-TEEF", "creative crafts"], ["les loisirs numériques", "lay lwa-ZEER new-may-REEK", "digital leisure"], ["les loisirs de plein air", "lay lwa-ZEER duh plen AIR", "outdoor leisure"], ["la calligraphie", "lah ka-lee-gra-FEE", "calligraphy"], ["la plongée sous-marine", "lah plohn-ZHAY soo-ma-REEN", "scuba diving"], ["le VTT (vélo tout terrain)", "luh vay-tay-TAY", "mountain biking"], ["le tricot", "luh tree-KO", "knitting"], ["la couture", "lah koo-TEWR", "sewing"], ["la voile", "lah VWAL", "sailing"], ["le montage photo", "luh mohn-TAHZH fo-TO", "photo editing"], ["la pêche", "lah PESH", "fishing"], ["le jardinage", "luh zhar-dee-NAHZH", "gardening"], ["le camping", "luh kahm-PEENG", "camping"], ["un pique-nique", "uhn peek-NEEK", "a picnic"], ["un sport nautique", "uhn spor no-TEEK", "a watersport"], ["un barbecue", "uhn bar-buh-KEW", "a barbecue"], ["une randonnée", "ewn rahn-do-NAY", "a hike"], ["un appareil photo", "uh na-pa-RAY fo-TO", "a camera"], ["un caméscope", "uhn ka-may-SKOP", "a camcorder"], ["numérique", "new-may-REEK", "digital"], ["en amateur", "ah na-ma-TUR", "as an amateur"], ["un classement", "uhn klahss-MAHN", "a ranking"], ["une tendance", "ewn tahn-DAHNSS", "a trend"], ["des statistiques", "day sta-tees-TEEK", "statistics"], ["un journal intime", "uhn zhoor-NAL an-TEEM", "a private diary"], ["l'artisanat d'art", "lar-tee-za-NAH DAR", "craftwork"], ["la gravure", "lah gra-VEWR", "engraving"]], "cols": "two"}]}, {"id": "ae-d3-sexercer", "label": "Dossier 3 · S'exercer", "name": "Les corrigés", "summary": "Pages 76–77, complete. All seventeen exercises with every item and every answer — tastes, faire and aller, professions, adjective agreement, stressed pronouns, plurals, family definitions, possessives, dire/être/faire and avoir mal à.", "art": null, "bookpages": ["p076", "p077"], "groups": [{"name": "Leçon 1 — Ex. 1 : exprimer ses goûts", "items": [["Exprimez vos goûts avec les éléments proposés.", "eks-pree-MAY vo GOO", "Express your tastes with the items given."], ["Exemple : J'adore aller au cinéma.", "zha-DOR a-LAY oh see-nay-MAH", "the worked example"], ["aimer ♥ – ne pas aimer ✗ – adorer ♥♥ – détester ✗✗", "ay-MAY – nuh pah zay-MAY – a-do-RAY – day-tes-TAY", "the four levels"], ["aller au cinéma", "a-LAY oh see-nay-MAH", "going to the cinema"], ["regarder la télévision", "ruh-gar-DAY lah tay-lay-vee-zee-OHN", "watching television"], ["faire la cuisine", "fair lah kwee-ZEEN", "cooking"], ["aller au supermarché", "a-LAY oh sew-pair-mar-SHAY", "going to the supermarket"], ["écouter de la musique", "ay-koo-TAY duh lah mew-ZEEK", "listening to music"], ["lire des livres", "leer day LEE-vruh", "reading books"], ["faire des promenades", "fair day prom-NAHD", "going for walks"], ["visiter des musées", "vee-zee-TAY day mew-ZAY", "visiting museums"], ["voyager en avion", "vwa-ya-ZHAY ah na-vee-OHN", "travelling by plane"]]}, {"name": "Leçon 1 — Ex. 2 : comparer ses goûts", "items": [["Par deux, comparez vos goûts pour les loisirs.", "par DUH, kohm-pa-RAY vo GOO", "In pairs, compare your leisure tastes."], ["Exemple : J'adore le cinéma, et toi ?", "zha-DOR luh see-nay-MAH, ay TWAH", "the worked example"], ["le cinéma", "luh see-nay-MAH", "cinema"], ["le théâtre", "luh tay-AH-truh", "theatre"], ["l'opéra", "lo-pay-RAH", "opera"], ["les expositions de peinture", "lay zeks-po-zee-see-OHN duh pan-TEWR", "painting exhibitions"], ["le football", "luh foot-BOL", "football"]]}, {"name": "Leçon 1 — Ex. 3 : faire et aller + articles", "items": [["Où allez-vous le week-end ? pendant la semaine ? pendant les vacances ? Répondez en utilisant les éléments suivants.", "oo a-lay VOO luh week-END", "Where do you go at the weekend? During the week? On holiday?"], ["Je vais à l'école.", "zhuh vay a lay-KOL", "I go to school."], ["Je vais au cinéma.", "zhuh vay oh see-nay-MAH", "I go to the cinema."], ["Je vais à l'hôtel.", "zhuh vay a lo-TELL", "I go to the hotel."], ["Je vais à la montagne.", "zhuh vay a lah mohn-TAN-yuh", "I go to the mountains."], ["Je vais à l'université.", "zhuh vay a lew-nee-vair-see-TAY", "I go to the university."], ["Je vais au restaurant.", "zhuh vay oh res-to-RAHN", "I go to the restaurant."], ["Je vais au théâtre.", "zhuh vay oh tay-AH-truh", "I go to the theatre."], ["Je vais à Paris.", "zhuh vay a pa-REE", "I go to Paris."], ["Je vais au marché.", "zhuh vay oh mar-SHAY", "I go to the market."], ["Je vais à Bordeaux.", "zhuh vay a bor-DO", "I go to Bordeaux."]], "note": "Cities take plain <strong>à</strong> with no article at all — <em>à Paris, à Bordeaux</em> — while other places take <em>au, à la</em> or <em>à l'</em>."}, {"name": "Leçon 1 — Ex. 4 : les dix dessins", "items": [["Associez les dessins aux activités puis faites des phrases, comme dans l'exemple.", "a-so-see-AY lay day-SAN oh zak-tee-vee-TAY", "Match the drawings to the activities then make sentences."], ["Exemple : J'aime le football, je fais du football le dimanche.", "zhem luh foot-BOL, zhuh fay dew foot-BOL", "the worked example"], ["dessin 1 : un ballon de football → e. le football → je fais du football", "luh foot-BOL", "football"], ["dessin 2 : deux judokas → d. le judo → je fais du judo", "luh zhew-DO", "judo"], ["dessin 3 : un piano → b. le piano → je fais du piano", "luh pee-a-NO", "piano"], ["dessin 4 : un ballon de basket → g. le basket → je fais du basket", "luh bas-KET", "basketball"], ["dessin 5 : un randonneur avec un sac à dos → f. la randonnée → je fais de la randonnée", "lah rahn-do-NAY", "hiking"], ["dessin 6 : une raquette et une balle → a. le tennis → je fais du tennis", "luh tay-NEESS", "tennis"], ["dessin 7 : une paroi d'escalade → h. l'escalade → je fais de l'escalade", "les-ka-LAHD", "climbing"], ["dessin 8 : une palette de peinture → c. la peinture → je fais de la peinture", "lah pan-TEWR", "painting"], ["dessin 9 : un vélo → i. le vélo → je fais du vélo", "luh vay-LO", "cycling"], ["dessin 10 : une guitare → j. la guitare → je fais de la guitare", "lah gee-TAR", "guitar"]], "cols": "two"}, {"name": "Leçon 1 — Ex. 5 : faire ou aller à", "items": [["Complétez avec faire ou aller à au présent. Faites les changements nécessaires.", "kohm-play-TAY a-vek FAIR oo a-LAY a", "Complete with faire or aller à in the present."], ["1. — Le dimanche, vous ALLEZ AU cinéma ? — Oui, avec des amis. Et après, nous ALLONS AU restaurant.", "voo za-lay oh see-nay-MAH … noo za-LOHN oh res-to-RAHN", "On Sundays do you go to the cinema? — Yes, with friends. And afterwards we go to a restaurant."], ["2. — Vous FAITES DU sport régulièrement ? — Non, je déteste ça. Mais je FAIS DE LA randonnée en vacances.", "voo fet dew SPOR … zhuh fay duh lah rahn-do-NAY", "Do you do sport regularly? — No, I hate it. But I hike on holiday."], ["3. — Les Français VONT À LA mer, en été ? — Oui, et, en hiver, ils VONT À LA montagne ; ils FONT DU ski.", "eel vohn a lah MAIR … eel fohn dew SKEE", "Do the French go to the sea in summer? — Yes, and in winter they go to the mountains; they ski."], ["4. — Moi, je FAIS DU vélo, j'adore ça ! — Tu VAS AU bureau à vélo ? — Non, mais le dimanche, je VAIS À LA campagne et je FAIS DU vélo.", "zhuh fay dew vay-LO … zhuh vay a lah kahm-PAN-yuh", "I cycle, I love it! — Do you cycle to the office? — No, but on Sundays I go to the countryside and cycle."]]}, {"name": "Leçon 1 — Ex. 6 : qui fait quoi ?", "items": [["Complétez avec un nom de profession au masculin ou au féminin.", "kohm-play-TAY a-vek uhn nohn duh pro-fay-see-OHN", "Complete with a job name in the masculine or feminine."], ["1. Une OPTICIENNE vend des lunettes.", "ewn op-tee-see-EN vahn day lew-NETT", "An optician sells glasses."], ["2. Un PHOTOGRAPHE fait des photos.", "uhn fo-to-GRAF fay day fo-TO", "A photographer takes photos."], ["3. Une COIFFEUSE coupe les cheveux.", "ewn kwa-FUHZ koop lay shuh-VUH", "A hairdresser cuts hair."], ["4. Un PHARMACIEN vend des médicaments.", "uhn far-ma-see-AN vahn day may-dee-ka-MAHN", "A pharmacist sells medicines."], ["5. Un BOULANGER fait du pain.", "uhn boo-lahn-ZHAY fay dew PAN", "A baker makes bread."], ["6. Une RÉALISATRICE fait des films.", "ewn ray-a-lee-za-TREESS fay day FEELM", "A director makes films."], ["7. Un JOURNALISTE fait des reportages.", "uhn zhoor-na-LEEST fay day ruh-por-TAHZH", "A journalist does reports."], ["8. Une COUTURIÈRE fait des vêtements.", "ewn koo-tew-ree-AIR fay day vet-MAHN", "A dressmaker makes clothes."]]}, {"name": "Leçon 2 — Ex. 7 : corriger les adjectifs", "items": [["Observez ces annonces de rencontres : il y a une erreur sur le prénom des personnes. Faites les changements nécessaires pour marquer le masculin ou le féminin des adjectifs.", "… ewn ay-RUR sewr luh pray-NOHN", "There's a mistake in each first name. Change the adjectives accordingly."], ["ALEXANDRE → ALEXANDRA : Grande, mince, la trentaine.", "GRAHND, MANSS, lah trahn-TEN", "Tall, slim, around thirty."], ["J'ai un poste à responsabilités. Je suis dynamique et organisée.", "… ay or-ga-nee-ZAY", "I have a job with responsibilities. I'm dynamic and organised."], ["J'aime les voyages, la musique, mais je déteste être seule.", "… EH-truh SUL", "I like travel and music, but I hate being alone."], ["Qui veut passer un week-end avec moi, ou peut-être plus ?", "kee vuh pa-SAY uhn week-END", "Who'd like to spend a weekend with me, or maybe more?"], ["NICOLE → NICOLAS : 35 ans, petit, mince.", "puh-TEE, MANSS", "35, short, slim."], ["Sincère, généreux, doux, j'aime la vie en famille.", "san-SAIR, zhay-nay-RUH, DOO", "Sincere, generous, gentle, I like family life."], ["J'ai un chien mais je suis allergique aux chats. Je ne suis pas sportif.", "… a-lair-ZHEEK oh SHA … spor-TEEF", "I have a dog but I'm allergic to cats. I'm not sporty."], ["Je cherche une partenaire pour la vie.", "zhuh shairsh ewn par-tuh-NAIR poor lah VEE", "I'm looking for a partner for life."], ["LAURENT → LAURE : 25 ans, grande, sportive, professeure de gym.", "GRAHND, spor-TEEV, pro-fay-SUR duh ZHEEM", "25, tall, sporty, gym teacher."], ["Je suis indépendante. J'aime les sorties avec des amis, les musées, les restos.", "an-day-pahn-DAHNT … lay res-TO", "I'm independent. I like going out with friends, museums, restaurants."], ["Je suis à la recherche d'un partenaire cultivé, dynamique, positif mais pas autoritaire.", "… uhn par-tuh-NAIR kewl-tee-VAY", "I'm looking for a cultured, dynamic, positive but not bossy partner."]], "note": "The trick is that changing the name flips every adjective in the ad — and also the word <em>partenaire</em>'s article: <em>une partenaire</em> for Nicolas, <em>un partenaire</em> for Laure."}, {"name": "Leçon 2 — Ex. 8 : reformuler avec un adjectif", "items": [["Reformulez les informations avec un adjectif qualificatif.", "ruh-for-mew-LAY … a-vek uh nad-zhek-TEEF ka-lee-fee-ka-TEEF", "Rephrase using an adjective."], ["Exemple : Lui : 1 m 90, pratique 5 sports. → Lui : grand, sportif.", "GRAHN, spor-TEEF", "the worked example"], ["1. Elle : diplômée d'une grande école, adore lire, communique peu avec les autres. → Elle : cultivée, timide.", "kewl-tee-VAY, tee-MEED", "cultured, shy"], ["2. Elle : 1 m 80, 56 kg, championne de ski, aime l'action. → Elle : grande, mince, sportive, dynamique.", "GRAHND, MANSS, spor-TEEV, dee-na-MEEK", "tall, slim, sporty, dynamic"], ["3. Lui : fait de la peinture et écrit des chansons, aime rencontrer des gens, voit la vie en rose. → Lui : créatif, sociable, optimiste.", "kray-a-TEEF, so-see-AH-bluh, op-tee-MEEST", "creative, sociable, optimistic"], ["4. Elle : 1 m 55, 62 kg, rêve du grand amour. → Elle : petite, un peu ronde, romantique.", "puh-TEET, uhn puh ROHND, ro-mahn-TEEK", "short, a little plump, romantic"]]}, {"name": "Leçon 2 — Ex. 9 : les pronoms toniques", "items": [["Complétez avec le pronom tonique qui convient.", "kohm-play-TAY a-vek luh pro-NOHN to-NEEK", "Complete with the right stressed pronoun."], ["1. — MOI, j'aime bien le cinéma, et TOI ? — MOI, je préfère le théâtre.", "MWAH … ay TWAH … MWAH", "Me, I like cinema, and you? — Me, I prefer theatre."], ["2. — NOUS, nous sortons demain soir, et VOUS ? — NOUS, nous regardons un match à la télé.", "NOO … ay VOO … NOO", "Us, we're going out tomorrow evening, and you? — Us, we're watching a match on TV."], ["3. — ELLE, elle est grande, belle et cultivée et LUI, il est petit, pas très beau et pas très intelligent !", "EL … ay LWEE", "Her, she's tall, beautiful and cultured, and him, he's short, not very good-looking and not very bright!"], ["4. — Les filles de ta classe sont comment ? — ELLES, elles sont sérieuses. — Et les garçons ? — EUX, ils sont superficiels.", "EL … UH", "The girls in your class, what are they like? — Them, they're serious. — And the boys? — Them, they're superficial."]]}, {"name": "Leçon 2 — Ex. 10 : le pluriel des adjectifs", "items": [["Transformez comme dans l'exemple.", "trahns-for-MAY", "Transform as in the example."], ["Exemple : Mon ami François est grand, mince, sportif et il n'est pas compliqué ! → Mes amies Louise et Emma sont grandes, minces, sportives et elles ne sont pas compliquées !", "may za-MEE … sohn GRAHND, MANSS, spor-TEEV", "the worked example"], ["1. Thomas est beau, doux, généreux et créatif mais un peu timide et indécis. → Claire et Marie sont belles, douces, généreuses et créatives mais un peu timides et indécises.", "BELL, DOOSS, zhay-nay-RUHZ, kray-a-TEEV … an-day-SEEZ", "beautiful, gentle, generous, creative, shy, indecisive"], ["2. Je n'aime pas mon voisin, il est superficiel, peu sérieux et menteur ! → Je n'aime pas mes deux voisines, elles sont superficielles, peu sérieuses et menteuses !", "sew-pair-fee-see-ELL, say-ree-UHZ, mahn-TUHZ", "superficial, unserious, liars"], ["3. J'adore cet acteur, il est élégant, dynamique et décontracté. → J'adore ces deux actrices, elles sont élégantes, dynamiques et décontractées.", "ay-lay-GAHNT, dee-na-MEEK, day-kohn-trak-TAY", "elegant, dynamic, relaxed"], ["4. J'aime ce garçon, il est calme, patient et optimiste. → J'aime ces filles, elles sont calmes, patientes et optimistes.", "KALM, pa-see-AHNT, op-tee-MEEST", "calm, patient, optimistic"]]}, {"name": "Leçon 2 — Ex. 11 : compléter avec des adjectifs", "items": [["Complétez les phrases suivantes avec des adjectifs de caractérisation.", "kohm-play-TAY … a-vek day zad-zhek-TEEF duh ka-rak-tay-ree-za-see-OHN", "Complete with descriptive adjectives."], ["1. Je déteste les enfants, ils sont … → bruyants, capricieux, compliqués", "brwee-YAHN, ka-pree-see-UH", "noisy, capricious, complicated — model answers"], ["2. J'adore les femmes, elles sont … → douces, généreuses, organisées", "DOOSS, zhay-nay-RUHZ, or-ga-nee-ZAY", "gentle, generous, organised"], ["3. J'aime bien les sportifs, ils sont … → dynamiques, sérieux, patients", "dee-na-MEEK, say-ree-UH, pa-see-AHN", "dynamic, serious, patient"], ["4. Je déteste les fumeurs, ils sont … → superficiels, indécis", "sew-pair-fee-see-ELL, an-day-SEE", "superficial, indecisive"], ["5. Je déteste les touristes, ils sont … → compliqués, autoritaires, menteurs", "kohm-plee-KAY, oh-to-ree-TAIR, mahn-TUR", "complicated, bossy, liars"]], "note": "Open answers — the point is that the adjective must agree in gender and number with the noun before it."}, {"name": "Leçon 3 — Ex. 12 : la famille, associez", "items": [["Associez le mot et sa définition.", "a-so-see-AY luh mo ay sa day-fee-nee-see-OHN", "Match the word to its definition."], ["1. La belle-sœur → c. La sœur du mari ou de la femme.", "lah bell-SUR", "sister-in-law"], ["2. Le beau-père → d. Le père du mari ou de la femme.", "luh bo-PAIR", "father-in-law"], ["3. Le cousin → b. Le fils de l'oncle ou de la tante.", "luh koo-ZAN", "cousin"], ["4. L'oncle → a. Le frère du père ou de la mère.", "LOHN-kluh", "uncle"]], "note": "Answers: <strong>1→c · 2→d · 3→b · 4→a</strong>."}, {"name": "Leçon 3 — Ex. 13 : définir d'autres liens de parenté", "items": [["Trouvez les définitions de ces autres liens de parenté.", "troo-VAY lay day-fee-nee-see-OHN … day lee-AN duh pa-rahn-TAY", "Define these other family relationships."], ["La tante → la sœur du père ou de la mère.", "lah TAHNT", "the father's or mother's sister"], ["La cousine → la fille de l'oncle ou de la tante.", "lah koo-ZEEN", "the uncle's or aunt's daughter"], ["La belle-mère → la mère du mari ou de la femme.", "lah bell-MAIR", "the husband's or wife's mother"], ["Le neveu → le fils du frère ou de la sœur.", "luh nuh-VUH", "the brother's or sister's son"], ["La nièce → la fille du frère ou de la sœur.", "lah nee-ESS", "the brother's or sister's daughter"], ["Les grands-parents → les parents du père ou de la mère.", "lay grahn-pa-RAHN", "the parents of the father or mother"], ["La petite-fille → la fille du fils ou de la fille.", "lah puh-teet-FEE", "the son's or daughter's daughter"]]}, {"name": "Leçon 3 — Ex. 14 : les adjectifs possessifs", "items": [["Complétez avec les adjectifs possessifs mon/ma/mes – ton/ta/tes – notre/nos – votre/vos.", "kohm-play-TAY", "Complete with the possessives."], ["1. Jérôme présente sa famille : Moi, je m'appelle Jérôme et MA femme, Sylvie. J'ai trois enfants : MON fils s'appelle Thomas et MES filles s'appellent Cécile et Pauline.", "ma FAM … mohn FEESS … may FEE-yuh", "my wife, my son, my daughters"], ["2. Jean-Claude et Suzanne présentent leur famille : Nous sommes mariés depuis 25 ans, NOTRE fils s'appelle Jérémy et NOTRE fille, Pascale. NOS enfants sont grands maintenant. Pascale a un bébé : NOTRE petit-fils s'appelle Léo.", "NOT-ruh FEESS … no zahn-FAHN", "our son, our daughter, our children, our grandson"], ["3. Claire pose des questions à un ami sur sa famille : TES parents s'appellent comment ? — Hélène et Olivier. Et TES sœurs ? — Édith et Myriam. TES grands-parents sont morts ? — Non, MES grands-parents sont toujours en vie.", "tay pa-RAHN … may grahn-pa-RAHN", "your parents, your sisters, your grandparents, my grandparents"], ["4. Maxime parle à Leila et Ali de leur famille : VOTRE père est marocain et VOTRE mère est française ; VOS grands-parents paternels habitent au Maroc.", "VOT-ruh PAIR … vo grahn-pa-RAHN", "your father, your mother, your grandparents"], ["5. Béatrice répond à des questions sur sa famille : — Vos parents s'appellent comment ? — Michèle et Patrick. — Et VOS grands-parents s'appellent comment ? — Anne et Henri. — Daniel, c'est bien VOTRE oncle ? — Oui, c'est le frère de ma mère. — Et Nathalie, c'est VOTRE tante ? — Oui, bien sûr, c'est la femme de MON oncle Daniel.", "vo grahn-pa-RAHN … VOT-ruh NOHN-kluh … moh NOHN-kluh", "your grandparents, your uncle, your aunt, my uncle"]]}, {"name": "Leçon 3 — Ex. 15 : son, sa, ses, leur, leurs", "items": [["Complétez avec son, sa, ses, leur, leurs.", "kohm-play-TAY a-vek", "Complete with son, sa, ses, leur or leurs."], ["1. Regarde ces photos d'Arnaud et Capucine : c'est le jour de LEUR mariage, tu vois LEURS amis et, là, LEUR famille.", "lur ma-ree-AHZH … lur za-MEE … lur fa-MEE", "their wedding, their friends, their family"], ["2. Christophe, SON papa, et Véronique, SA maman, sont heureux de vous envoyer la première photo de Marine dans les bras de SON grand frère Paul.", "sohn pa-PAH … sa ma-MAHN … sohn grahn FRAIR", "her dad, her mum, her big brother"], ["3. Léa et Léon sont nés le 15 avril 2012. Voici Léon dans les bras de SA maman et Léa dans les bras de SON papa. LEURS parents sont heureux, très heureux !", "sa ma-MAHN … sohn pa-PAH … lur pa-RAHN", "his mum, her dad, their parents"]], "note": "Watch item 2: <em>son papa</em> and <em>sa maman</em> refer to <strong>Marine</strong>, a girl — but the possessive follows <em>papa</em> (masculine) and <em>maman</em> (feminine), not her."}, {"name": "Leçon 3 — Ex. 16 : dire, être et faire", "items": [["Complétez avec dire, être ou faire à la forme correcte.", "kohm-play-TAY a-vek DEER, EH-truh oo FAIR", "Complete with dire, être or faire."], ["1. Tu FAIS attention, tu DIS bien « bonjour » à la dame, mon chéri !", "tew fay a-tahn-see-OHN, tew dee bee-AN", "Pay attention, say hello nicely to the lady, darling!"], ["2. Les enfants FONT des progrès : ils DISENT chaque jour deux ou trois mots nouveaux.", "eel FOHN day pro-GRAY : eel DEEZ", "The children are making progress: they say two or three new words every day."], ["3. Vous ÊTES polis, les petits, vous DITES merci !", "voo ZET po-LEE … voo deet mair-SEE", "You're polite, little ones, you say thank you!"], ["4. Mon fils a 11 mois et il DIT déjà « papa » et « maman » !", "eel DEE day-ZHA", "My son is 11 months and already says papa and maman!"], ["5. Vous FAITES beaucoup de promenades en famille ?", "voo fet bo-KOO duh prom-NAHD", "Do you go for a lot of family walks?"], ["6. Quand vous ne DITES pas d'accord, vous FAITES un signe de la main.", "… voo fet uhn SEEN-yuh duh lah MAN", "When you don't say you agree, you make a hand signal."], ["7. Nous DISONS « oui » à 11 h devant monsieur le maire !", "noo dee-ZOHN WEE … duh-VAHN muh-syuh luh MAIR", "We say 'I do' at 11 before the mayor!"]]}, {"name": "Leçon 3 — Ex. 17 : avoir mal à", "items": [["Complétez les phrases avec les étiquettes ci-dessous. Faites les transformations nécessaires.", "kohm-play-TAY … a-vek lay zay-TEE-ket", "Complete with the labels below, making the necessary changes."], ["Les étiquettes : les oreilles – le dos – la main – les jambes – la tête – les bras – les épaules – les dents", "…", "the eight labels"], ["Exemple : Après une journée devant mon ordinateur, j'ai mal aux yeux.", "zhay mal oh ZYUH", "the worked example"], ["1. J'ai mal AUX DENTS, j'appelle le dentiste pour un rendez-vous.", "zhay mal oh DAHN", "I have toothache, I'm calling the dentist."], ["2. Nous avons mal AUX OREILLES avec cette musique !", "noo za-vohn mal oh zo-RAY", "Our ears hurt with this music!"], ["3. 30 kilomètres à vélo et vous avez mal AUX JAMBES, c'est normal !", "voo za-vay mal oh ZHAHMB", "30 km on a bike and your legs hurt — that's normal!"], ["4. Après ce long match de tennis, ils ont mal AUX BRAS / AUX ÉPAULES.", "eel zohn mal oh BRAH", "After that long tennis match their arms / shoulders hurt."], ["5. Tu as mal À LA MAIN parce que tu écris toute la journée.", "tew a mal a lah MAN", "Your hand hurts because you write all day."], ["6. Il a mal AU DOS quand il porte son bébé longtemps.", "ee la mal oh DO", "His back hurts when he carries his baby a long time."]], "note": "The contraction again: <strong>à + le = au</strong> (au dos), <strong>à + les = aux</strong> (aux dents, aux jambes), while <em>à la</em> and <em>à l'</em> stay put."}]}, {"id": "ae-d3-delf", "label": "Dossier 3 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 78, complete. Two listening exercises worth 15 points, the phone-message card, and the 40–50 word postcard task.", "art": null, "bookpages": ["p078"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Two listening exercises, tracks 102 and 103.", "tracks": [{"n": 102, "label": "p.78 exercice 1 — les cours de sport (5 points)"}, {"n": 103, "label": "p.78 exercice 2 — le message téléphonique (10 points)"}]}, {"name": "Page 78 — Compréhension de l'oral, exercice 1 (5 points)", "items": [["Compréhension de l'oral — 15 points", "lah kohm-pray-ahn-see-OHN duh lo-RAL", "Listening comprehension — 15 points"], ["Exercice 1 — 5 points", "eg-zair-SEESS uhn", "Exercise 1"], ["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN … duh FWAH", "Read the questions. Listen twice then answer."], ["1. La femme demande des informations sur : a. / b. / c.", "lah fam duh-MAHND day zan-for-ma-see-OHN sewr", "The woman asks for information about:"], ["dessin a : un cours de yoga ou de gymnastique douce", "uhn koor duh yo-GAH", "drawing a: a yoga or gentle-gym class"], ["dessin b : un cours de danse classique", "uhn koor duh dahnss kla-SEEK", "drawing b: a ballet class"], ["dessin c : un cours de gymnastique (anneaux, cheval d'arçons)", "uhn koor duh zheem-nas-TEEK", "drawing c: a gymnastics class with rings and a pommel horse"], ["2. Sa fille a quel âge ?", "sa FEE a kel AHZH", "How old is her daughter?"], ["3. Les cours pour adultes sont le : a. mercredi. b. vendredi. c. samedi.", "lay koor poor a-DEWLT", "The adult classes are on:"], ["4. Les cours pour enfants sont à : a. 15 heures. b. 16 heures. c.
