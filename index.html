": [["J'ai faim.", "zhay FAN", "I'm hungry. — not je suis faim"], ["J'ai 25 ans.", "zhay van-sank AHN", "I'm 25. — not je suis 25"], ["J'ai froid.", "zhay FRWAH", "I'm cold. — not je suis froid"]]}]}, {"id": "gm-avoir", "label": "Le verbe", "name": "Avoir — to have", "art": "avoirtable", "summary": "The other verb you cannot do without. Present tense, the liaisons that carry the meaning, and the long list of things French 'has' where English 'is'.", "groups": [{"name": "Le présent", "cols": "two", "items": [["j'ai", "ZHAY", "I have"], ["tu as", "tew AH", "you have"], ["il a", "ee LAH", "he has"], ["elle a", "el LAH", "she has"], ["on a", "oh NAH", "one has / we have"], ["nous avons", "noo za-VOHN", "we have"], ["vous avez", "voo za-VAY", "you have"], ["ils ont", "eel ZOHN", "they have (m)"], ["elles ont", "el ZOHN", "they have (f)"]]}, {"name": "Les liaisons d'avoir", "note": "Every plural form of <em>avoir</em> starts with a vowel, so every one of them liaises: nou<strong>s a</strong>vons, vou<strong>s a</strong>vez, il<strong>s o</strong>nt — all with a <strong>z</strong>.", "items": [["nous avons", "noo za-VOHN", "we have"], ["vous avez", "voo za-VAY", "you have"], ["ils ont / elles ont", "eel ZOHN / el ZOHN", "they have"], ["il a un frère", "ee la uhn FRAIR", "he has a brother"], ["on a une question", "oh na ewn kes-tee-OHN", "we have a question"]]}, {"name": "Avoir pour l'âge et le corps", "cols": "two", "note": "These are all <strong>avoir</strong> in French and <strong>be</strong> in English. Learn them as a block.", "items": [["avoir … ans", "a-VWAHR … AHN", "to be … years old"], ["Quel âge avez-vous ? — J'ai trente ans.", "kel AHZH a-vay VOO — zhay trahnt AHN", "How old are you? — I'm thirty."], ["avoir faim", "a-VWAHR FAN", "to be hungry"], ["avoir soif", "a-VWAHR SWAHF", "to be thirsty"], ["avoir chaud", "a-VWAHR SHOW", "to be hot"], ["avoir froid", "a-VWAHR FRWAH", "to be cold"], ["avoir sommeil", "a-VWAHR so-MAY", "to be sleepy"], ["avoir peur", "a-VWAHR PUR", "to be afraid"], ["avoir mal à…", "a-VWAHR mal a", "to have a pain in…"], ["avoir raison", "a-VWAHR ray-ZOHN", "to be right"], ["avoir tort", "a-VWAHR TOR", "to be wrong"], ["avoir besoin de", "a-VWAHR buh-ZWAN duh", "to need"], ["avoir envie de", "a-VWAHR ahn-VEE duh", "to feel like"], ["avoir de la chance", "a-VWAHR duh lah SHAHNSS", "to be lucky"]]}, {"name": "La négation — et le piège du « de »", "note": "After a negative, <strong>un, une, des</strong> all collapse into <strong>de</strong> (or <strong>d'</strong>). <em>J'ai une voiture</em> → <em>Je n'ai <strong>pas de</strong> voiture</em>. This does not happen with <em>le, la, les</em>.", "items": [["J'ai un frère. → Je n'ai pas de frère.", "zhuh nay pah duh FRAIR", "un → de"], ["J'ai une voiture. → Je n'ai pas de voiture.", "zhuh nay pah duh vwa-TEWR", "une → de"], ["J'ai des amis ici. → Je n'ai pas d'amis ici.", "zhuh nay pah da-MEE ee-SEE", "des → d'"], ["Il n'a pas le temps.", "eel na pah luh TAHN", "le stays le"]]}, {"name": "Il y a — there is, there are", "note": "Built from <em>avoir</em> and completely fixed: <strong>il y a</strong> never changes for singular or plural.", "items": [["Il y a un musée.", "eel ya uhn mew-ZAY", "There is a museum."], ["Il y a des jardins.", "eel ya day zhar-DAN", "There are gardens."], ["Il n'y a pas de pharmacie.", "eel nya pah duh far-ma-SEE", "There is no pharmacy."], ["Qu'est-ce qu'il y a ?", "kes-keel YA", "What is there? / What's wrong?"], ["Il y a combien de places ?", "eel ya kohm-bee-AN duh PLAHSS", "How many seats are there?"]]}]}, {"id": "gm-poss", "label": "Les déterminants", "name": "L'adjectif possessif", "art": "possessifs", "summary": "mon, ma, mes… The rule that catches everyone: the word agrees with the thing owned, not with the owner.", "groups": [{"name": "Le tableau complet", "cols": "two", "note": "Read across: <strong>masculine · feminine · plural</strong>. The choice depends entirely on the <em>noun that follows</em>.", "items": [["mon frère · ma sœur · mes parents", "mohn FRAIR · ma SUR · may pa-RAHN", "my"], ["ton frère · ta sœur · tes parents", "tohn FRAIR · ta SUR · tay pa-RAHN", "your (familiar)"], ["son frère · sa sœur · ses parents", "sohn FRAIR · sa SUR · say pa-RAHN", "his / her / its"], ["notre frère · notre sœur · nos parents", "NOT-ruh · NOT-ruh · no pa-RAHN", "our"], ["votre frère · votre sœur · vos parents", "VOT-ruh · VOT-ruh · vo pa-RAHN", "your (polite / plural)"], ["leur frère · leur sœur · leurs parents", "lur FRAIR · lur SUR · lur pa-RAHN", "their"]]}, {"name": "Le point qui piège tout le monde", "note": "<strong>son</strong> and <strong>sa</strong> do NOT tell you the owner's gender. <em>son père</em> is <em>his father</em> or <em>her father</em> — French does not care. What decides is that <em>père</em> is masculine.<br><br>So a woman says <strong>son mari</strong> and a man says <strong>sa femme</strong>.", "items": [["Marie parle de son père.", "ma-REE parl duh sohn PAIR", "Marie talks about her father."], ["Paul parle de son père.", "pol parl duh sohn PAIR", "Paul talks about his father. — identical"], ["Marie parle de sa mère.", "ma-REE parl duh sa MAIR", "Marie talks about her mother."], ["Paul parle de sa mère.", "pol parl duh sa MAIR", "Paul talks about his mother. — identical"]]}, {"name": "Ma devient mon devant une voyelle", "note": "Before a feminine word starting with a vowel or silent h, <strong>ma → mon, ta → ton, sa → son</strong>. It is purely for the sound — the noun is still feminine.", "items": [["une amie → mon amie", "moh na-MEE", "my friend (f) — not ma amie"], ["une adresse → mon adresse", "moh na-DRESS", "my address"], ["une école → ton école", "toh nay-KOL", "your school"], ["une histoire → son histoire", "soh nees-TWAHR", "his / her story"]]}, {"name": "Notre, votre, leur — un seul mot au singulier", "note": "These three don't change for gender at all. Only the plural moves: <strong>nos, vos, leurs</strong>.", "cols": "two", "items": [["notre maison", "NOT-ruh may-ZOHN", "our house"], ["notre jardin", "NOT-ruh zhar-DAN", "our garden"], ["nos enfants", "no zahn-FAHN", "our children"], ["votre nom", "VOT-ruh NOHN", "your surname"], ["vos coordonnées", "vo ko-or-do-NAY", "your contact details"], ["leur fille", "lur FEE-yuh", "their daughter"], ["leurs amis", "lur za-MEE", "their friends"]]}, {"name": "En pratique", "items": [["Quel est votre nom ? — Mon nom est Martin.", "kel ay VOT-ruh NOHN — mohn nohn ay mar-TAN", "What's your surname? — My surname is Martin."], ["C'est ma sœur et son mari.", "say ma SUR ay sohn ma-REE", "This is my sister and her husband."], ["Voici mes parents et leurs amis.", "vwa-SEE may pa-RAHN ay lur za-MEE", "Here are my parents and their friends."], ["Mon adresse mail et mon numéro de téléphone.", "moh na-DRESS mail ay mohn new-may-RO duh tay-lay-FON", "My email address and my phone number."], ["Ta langue maternelle, c'est quoi ?", "ta lahng ma-tair-NELL, say KWAH", "What's your mother tongue?"]]}]}, {"id": "tn-present", "label": "Le temps", "name": "Le présent", "summary": "What is happening now, what is generally true, and what is about to happen. Three verb families, plus the irregulars you cannot avoid.", "art": null, "groups": [{"name": "Les trois groupes", "note": "French verbs fall into three families by their infinitive ending. The <strong>-er</strong> group is by far the biggest — around 90% of all verbs — and completely regular.", "cols": "two", "items": [["1er groupe : -er — parler, aimer, habiter", "par-LAY, ay-MAY, a-bee-TAY", "regular, the huge majority"], ["2e groupe : -ir — finir, choisir, réussir", "fee-NEER, shwa-ZEER, ray-ew-SEER", "regular, adds -iss- in the plural"], ["3e groupe : -re, -oir, irréguliers — prendre, voir, faire", "PRAHN-druh, VWAHR, FAIR", "irregular, learn one by one"]]}, {"name": "1er groupe — parler", "cols": "three", "items": [["je parle", "zhuh PARL", "I speak"], ["tu parles", "tew PARL", "you speak"], ["il parle", "eel PARL", "he speaks"], ["nous parlons", "noo par-LOHN", "we speak"], ["vous parlez", "voo par-LAY", "you speak"], ["ils parlent", "eel PARL", "they speak"]]}, {"name": "2e groupe — finir", "cols": "three", "note": "The giveaway is <strong>-iss-</strong> in the three plural forms.", "items": [["je finis", "zhuh fee-NEE", "I finish"], ["tu finis", "tew fee-NEE", "you finish"], ["il finit", "eel fee-NEE", "he finishes"], ["nous finissons", "noo fee-nee-SOHN", "we finish"], ["vous finissez", "voo fee-nee-SAY", "you finish"], ["ils finissent", "eel fee-NEESS", "they finish"]]}, {"name": "Les irréguliers indispensables", "cols": "two", "items": [["aller : je vais, tu vas, il va, nous allons, vous allez, ils vont", "zhuh VAY … eel VOHN", "to go"], ["faire : je fais, tu fais, il fait, nous faisons, vous faites, ils font", "zhuh FAY … noo fuh-ZOHN … eel FOHN", "to do, to make"], ["prendre : je prends, nous prenons, ils prennent", "zhuh PRAHN … eel PREN", "to take"], ["venir : je viens, nous venons, ils viennent", "zhuh vee-AN … eel vee-EN", "to come"], ["pouvoir : je peux, nous pouvons, ils peuvent", "zhuh PUH … eel PUV", "to be able to"], ["vouloir : je veux, nous voulons, ils veulent", "zhuh VUH … eel VUL", "to want"], ["devoir : je dois, nous devons, ils doivent", "zhuh DWAH … eel DWAHV", "to have to"], ["savoir : je sais, nous savons, ils savent", "zhuh SAY … eel SAHV", "to know"], ["voir : je vois, nous voyons, ils voient", "zhuh VWAH … eel VWAH", "to see"], ["dire : je dis, nous disons, vous dites, ils disent", "zhuh DEE … voo DEET", "to say"]]}, {"name": "À quoi sert le présent", "items": [["J'habite à Vancouver.", "zha-BEET a vahn-koo-VAIR", "a permanent situation"], ["Je travaille en ce moment.", "zhuh tra-VIGH ahn suh mo-MAHN", "happening right now"], ["Le train part à huit heures.", "luh tran par a wee TUR", "a timetabled future"], ["L'eau bout à cent degrés.", "lo boo a sahn duh-GRAY", "a general truth"], ["Je suis en train de manger.", "zhuh swee zahn tran duh mahn-ZHAY", "emphasising right now"]]}]}, {"id": "tn-passe-compose", "label": "Le temps", "name": "Le passé composé", "summary": "The everyday past tense. Two pieces: a helper verb in the present, plus the past participle — and the rule for which helper to use.", "art": null, "groups": [{"name": "La formule", "note": "<strong>avoir</strong> or <strong>être</strong> in the present + the <strong>participe passé</strong>. Most verbs take avoir.", "items": [["J'ai mangé.", "zhay mahn-ZHAY", "I ate / I have eaten."], ["Je suis allé.", "zhuh swee za-LAY", "I went."], ["Nous avons fini.", "noo za-vohn fee-NEE", "We finished."], ["Elle est partie.", "el ay par-TEE", "She left."]]}, {"name": "Les participes passés", "cols": "two", "items": [["-er → -é : parler → parlé", "par-LAY", "spoken"], ["-ir → -i : finir → fini", "fee-NEE", "finished"], ["-re → -u : vendre → vendu", "vahn-DEW", "sold"], ["être → été", "ay-TAY", "been"], ["avoir → eu", "EW", "had"], ["faire → fait", "FAY", "done"], ["prendre → pris", "PREE", "taken"], ["voir → vu", "VEW", "seen"], ["venir → venu", "vuh-NEW", "come"], ["mettre → mis", "MEE", "put"], ["écrire → écrit", "ay-KREE", "written"], ["lire → lu", "LEW", "read"], ["boire → bu", "BEW", "drunk"], ["pouvoir → pu", "PEW", "been able"], ["vouloir → voulu", "voo-LEW", "wanted"], ["dire → dit", "DEE", "said"]]}, {"name": "Les verbes avec être", "note": "A short, closed list — mostly verbs of coming and going, plus all reflexives. The classic memory aid is <strong>DR &amp; MRS VANDERTRAMP</strong>. With être, the participle <strong>agrees</strong> with the subject.", "cols": "two", "items": [["aller / venir", "a-LAY / vuh-NEER", "to go / to come"], ["arriver / partir", "a-ree-VAY / par-TEER", "to arrive / to leave"], ["entrer / sortir", "ahn-TRAY / sor-TEER", "to enter / to go out"], ["monter / descendre", "mohn-TAY / day-SAHN-druh", "to go up / to go down"], ["naître / mourir", "NET-ruh / moo-REER", "to be born / to die"], ["rester / tomber", "res-TAY / tohm-BAY", "to stay / to fall"], ["passer / retourner", "pa-SAY / ruh-toor-NAY", "to pass by / to return"], ["tous les verbes pronominaux", "too lay vairb pro-no-mee-NO", "all reflexive verbs"]]}, {"name": "L'accord avec être", "note": "Feminine adds <strong>-e</strong>, plural adds <strong>-s</strong>. With <em>avoir</em> there is no agreement with the subject at all.", "items": [["Il est allé.", "ee lay ta-LAY", "He went."], ["Elle est allée.", "el ay ta-LAY", "She went. — same sound"], ["Ils sont allés.", "eel sohn ta-LAY", "They went. (m)"], ["Elles sont allées.", "el sohn ta-LAY", "They went. (f)"], ["Elle s'est levée tôt.", "el say luh-VAY TOH", "She got up early. — reflexive"], ["Elle a mangé.", "el a mahn-ZHAY", "She ate. — avoir, no agreement"]]}, {"name": "La négation", "note": "The <strong>ne … pas</strong> wraps around the <em>helper</em>, not the participle.", "items": [["Je n'ai pas mangé.", "zhuh nay pah mahn-ZHAY", "I didn't eat."], ["Il n'est pas venu.", "eel nay pah vuh-NEW", "He didn't come."], ["Nous ne sommes pas sortis.", "noo nuh som pah sor-TEE", "We didn't go out."]]}]}, {"id": "tn-imparfait", "label": "Le temps", "name": "L'imparfait", "summary": "The other past. Used for description, habit and background — and the one tense with no exceptions in its endings.", "art": null, "groups": [{"name": "Comment le former", "note": "Take the <strong>nous</strong> form of the present, drop <strong>-ons</strong>, add the endings. This works for every verb in the language except <em>être</em>.", "cols": "two", "items": [["nous parlons → parl- → je parlais", "zhuh par-LAY", "I was speaking"], ["nous finissons → finiss- → je finissais", "zhuh fee-nee-SAY", "I was finishing"], ["nous prenons → pren- → je prenais", "zhuh pruh-NAY", "I was taking"], ["nous faisons → fais- → je faisais", "zhuh fuh-ZAY", "I was doing"], ["être → ét- → j'étais", "zhay-TAY", "I was — the one exception"]]}, {"name": "Les terminaisons", "cols": "three", "items": [["je parlais", "zhuh par-LAY", "-ais"], ["tu parlais", "tew par-LAY", "-ais"], ["il parlait", "eel par-LAY", "-ait"], ["nous parlions", "noo par-lee-OHN", "-ions"], ["vous parliez", "voo par-lee-AY", "-iez"], ["ils parlaient", "eel par-LAY", "-aient"]]}, {"name": "Imparfait ou passé composé ?", "note": "<strong>Imparfait</strong> = the setting, the habit, the ongoing. <strong>Passé composé</strong> = the event that happened once and moved the story on.", "items": [["Il faisait beau.", "eel fuh-ZAY BO", "The weather was fine. — description"], ["Je mangeais quand le téléphone a sonné.", "zhuh mahn-ZHAY kahn luh tay-lay-FON a so-NAY", "I was eating when the phone rang."], ["Quand j'étais petit, j'habitais à Dhaka.", "kahn zhay-TAY puh-TEE, zha-bee-TAY a da-KAH", "When I was small I lived in Dhaka. — habit"], ["Hier, j'ai visité le musée.", "ee-AIR, zhay vee-zee-TAY luh mew-ZAY", "Yesterday I visited the museum. — single event"], ["Elle était fatiguée alors elle est rentrée.", "el ay-TAY fa-tee-GAY a-LOR el ay rahn-TRAY", "She was tired so she went home. — both, in one sentence"]]}]}, {"id": "tn-plus-que-parfait", "label": "Le temps", "name": "Le plus-que-parfait", "summary": "The past before the past — what had already happened when something else took place.", "art": null, "groups": [{"name": "La formule", "note": "<strong>avoir</strong> or <strong>être</strong> in the <em>imparfait</em> + the past participle. Same helper rules as the passé composé.", "cols": "two", "items": [["j'avais mangé", "zha-VAY mahn-ZHAY", "I had eaten"], ["tu avais fini", "tew a-VAY fee-NEE", "you had finished"], ["il avait pris", "eel a-VAY PREE", "he had taken"], ["nous étions partis", "noo zay-tee-OHN par-TEE", "we had left"], ["vous étiez arrivés", "voo zay-tee-AY a-ree-VAY", "you had arrived"], ["elles étaient venues", "el zay-TAY vuh-NEW", "they had come"]]}, {"name": "En contexte", "items": [["Quand je suis arrivé, il était déjà parti.", "kahn zhuh swee za-ree-VAY, eel ay-TAY day-zha par-TEE", "When I arrived, he had already left."], ["J'avais oublié mon passeport.", "zha-vay zoo-blee-AY mohn pas-POR", "I had forgotten my passport."], ["Elle a dit qu'elle avait visité Paris.", "el a dee kel a-VAY vee-zee-TAY pa-REE", "She said she had visited Paris."], ["déjà / ne … jamais / avant", "day-ZHA / nuh … zha-MAY / a-VAHN", "already / never / before — its usual companions"]]}]}, {"id": "tn-futur-proche", "label": "Le temps", "name": "Le futur proche", "summary": "The easiest future in French, and the one people actually use in speech: going to do something.", "art": null, "groups": [{"name": "aller + infinitif", "cols": "two", "items": [["je vais manger", "zhuh vay mahn-ZHAY", "I'm going to eat"], ["tu vas partir", "tew va par-TEER", "you're going to leave"], ["il va arriver", "eel va a-ree-VAY", "he's going to arrive"], ["nous allons voir", "noo za-lohn VWAHR", "we're going to see"], ["vous allez comprendre", "voo za-lay kohm-PRAHN-druh", "you're going to understand"], ["ils vont commencer", "eel vohn ko-mahn-SAY", "they're going to start"]]}, {"name": "La négation et les expressions de temps", "items": [["Je ne vais pas sortir ce soir.", "zhuh nuh vay pah sor-TEER suh SWAHR", "I'm not going out tonight."], ["demain", "duh-MAN", "tomorrow"], ["ce soir", "suh SWAHR", "tonight"], ["la semaine prochaine", "lah suh-men pro-SHEN", "next week"], ["dans deux jours", "dahn duh ZHOOR", "in two days"], ["tout à l'heure", "too ta LUR", "later today"], ["bientôt", "bee-an-TO", "soon"]]}]}, {"id": "tn-futur-simple", "label": "Le temps", "name": "Le futur simple", "summary": "The written and more distant future. One set of endings for every verb — they are the present tense of avoir.", "art": null, "groups": [{"name": "Comment le former", "note": "Infinitive + endings. For <strong>-re</strong> verbs, drop the final <em>e</em> first. The endings are the same for every verb without exception: <strong>-ai, -as, -a, -ons, -ez, -ont</strong>.", "cols": "three", "items": [["je parlerai", "zhuh par-luh-RAY", "I will speak"], ["tu parleras", "tew par-luh-RAH", "you will speak"], ["il parlera", "eel par-luh-RAH", "he will speak"], ["nous parlerons", "noo par-luh-ROHN", "we will speak"], ["vous parlerez", "voo par-luh-RAY", "you will speak"], ["ils parleront", "eel par-luh-ROHN", "they will speak"], ["finir → je finirai", "zhuh fee-nee-RAY", "I will finish"], ["prendre → je prendrai", "zhuh prahn-DRAY", "I will take"], ["écrire → j'écrirai", "zhay-kree-RAY", "I will write"]]}, {"name": "Les radicaux irréguliers", "note": "A handful of very common verbs change their stem — but they still take the same endings.", "cols": "two", "items": [["être → je serai", "zhuh suh-RAY", "I will be"], ["avoir → j'aurai", "zho-RAY", "I will have"], ["aller → j'irai", "zhee-RAY", "I will go"], ["faire → je ferai", "zhuh fuh-RAY", "I will do"], ["venir → je viendrai", "zhuh vee-an-DRAY", "I will come"], ["voir → je verrai", "zhuh vay-RAY", "I will see"], ["pouvoir → je pourrai", "zhuh poo-RAY", "I will be able"], ["vouloir → je voudrai", "zhuh voo-DRAY", "I will want"], ["devoir → je devrai", "zhuh duh-VRAY", "I will have to"], ["savoir → je saurai", "zhuh so-RAY", "I will know"], ["il faut → il faudra", "eel fo-DRAH", "it will be necessary"], ["il y a → il y aura", "eel ee o-RAH", "there will be"]]}, {"name": "Proche ou simple ?", "items": [["Je vais partir dans cinq minutes.", "zhuh vay par-TEER", "near, certain, spoken"], ["Un jour, je partirai.", "uhn zhoor, zhuh par-tee-RAY", "distant, more formal"], ["Quand j'aurai le temps, je viendrai.", "kahn zho-RAY luh TAHN", "after quand, French uses the future where English uses the present"]]}]}, {"id": "tn-conditionnel", "label": "Le temps", "name": "Le conditionnel", "summary": "For politeness, wishes and hypotheticals — and the single most useful phrase for a beginner: je voudrais.", "art": null, "groups": [{"name": "Comment le former", "note": "The <strong>future stem</strong> plus the <strong>imparfait endings</strong>. If you know those two, you already know this one.", "cols": "three", "items": [["je parlerais", "zhuh par-luh-RAY", "I would speak"], ["tu parlerais", "tew par-luh-RAY", "you would speak"], ["il parlerait", "eel par-luh-RAY", "he would speak"], ["nous parlerions", "noo par-luh-ree-OHN", "we would speak"], ["vous parleriez", "voo par-luh-ree-AY", "you would speak"], ["ils parleraient", "eel par-luh-RAY", "they would speak"]]}, {"name": "La politesse — à apprendre tout de suite", "note": "This is why the conditional matters at A1: it turns a demand into a request.", "items": [["Je voudrais un café, s'il vous plaît.", "zhuh voo-DREH uhn ka-FAY", "I would like a coffee, please."], ["Je voudrais réserver une chambre.", "zhuh voo-DREH ray-zair-VAY ewn SHAHM-bruh", "I'd like to book a room."], ["Pourriez-vous m'aider ?", "poo-ree-ay VOO may-DAY", "Could you help me?"], ["Est-ce que vous auriez une table ?", "es-kuh voo zo-ree-AY ewn TAH-bluh", "Would you have a table?"], ["J'aimerais visiter Paris.", "zhem-RAY vee-zee-TAY pa-REE", "I would love to visit Paris."], ["Ce serait parfait.", "suh suh-RAY par-FAY", "That would be perfect."]]}, {"name": "Si + imparfait → conditionnel", "items": [["Si j'avais le temps, je viendrais.", "see zha-VAY luh TAHN, zhuh vee-an-DRAY", "If I had time, I would come."], ["Si j'étais riche, j'achèterais une maison.", "see zhay-TAY REESH, zha-shet-RAY ewn may-ZOHN", "If I were rich, I'd buy a house."], ["On pourrait aller au cinéma.", "ohn poo-RAY a-LAY oh see-nay-MAH", "We could go to the cinema."]]}]}, {"id": "tn-imperatif", "label": "Le mode", "name": "L'impératif", "summary": "Giving instructions, directions and advice — the form you meet constantly in exercise books and on street signs.", "art": null, "groups": [{"name": "Trois formes seulement", "note": "Built from the present tense with the subject pronoun removed. For <strong>-er</strong> verbs the <em>tu</em> form drops its <strong>-s</strong>.", "cols": "three", "items": [["Parle !", "PARL", "Speak! — tu"], ["Parlons !", "par-LOHN", "Let's speak! — nous"], ["Parlez !", "par-LAY", "Speak! — vous"], ["Va !", "VAH", "Go! — note: vas-y with y"], ["Allons !", "a-LOHN", "Let's go!"], ["Allez !", "a-LAY", "Go!"], ["Finis !", "fee-NEE", "Finish!"], ["Finissons !", "fee-nee-SOHN", "Let's finish!"], ["Finissez !", "fee-nee-SAY", "Finish!"]]}, {"name": "Les irréguliers", "cols": "two", "items": [["être → sois, soyons, soyez", "SWAH, swa-YOHN, swa-YAY", "be"], ["avoir → aie, ayons, ayez", "AY, ay-OHN, ay-YAY", "have"], ["savoir → sache, sachons, sachez", "SAHSH, sa-SHOHN, sa-SHAY", "know"], ["vouloir → veuillez", "vuh-YAY", "kindly (very formal)"]]}, {"name": "Dans la vie de tous les jours", "cols": "two", "items": [["Écoutez !", "ay-koo-TAY", "Listen!"], ["Répétez !", "ray-pay-TAY", "Repeat!"], ["Regardez !", "ruh-gar-DAY", "Look!"], ["Tournez à droite.", "toor-NAY a DRWAHT", "Turn right."], ["Prenez la première rue.", "pruh-NAY lah pruh-mee-AIR REW", "Take the first street."], ["Asseyez-vous.", "a-say-YAY VOO", "Sit down."], ["Ne fumez pas.", "nuh few-MAY PAH", "Don't smoke."], ["N'ayez pas peur.", "na-yay pah PUR", "Don't be afraid."], ["Excusez-moi.", "eks-kew-zay MWAH", "Excuse me."], ["Attendez !", "a-tahn-DAY", "Wait!"]]}]}, {"id": "tn-subjonctif", "label": "Le mode", "name": "Le subjonctif présent", "summary": "Not a tense but a mood — used after certain expressions of wish, emotion, doubt and necessity. Worth recognising early even if you use it later.", "art": null, "groups": [{"name": "Comment le former", "note": "Take the <strong>ils</strong> form of the present, drop <strong>-ent</strong>, add: <em>-e, -es, -e, -ions, -iez, -ent</em>. It almost always appears after <strong>que</strong>.", "cols": "three", "items": [["que je parle", "kuh zhuh PARL", "that I speak"], ["que tu parles", "kuh tew PARL", "that you speak"], ["qu'il parle", "keel PARL", "that he speaks"], ["que nous parlions", "kuh noo par-lee-OHN", "that we speak"], ["que vous parliez", "kuh voo par-lee-AY", "that you s  Enchantée", "ahn-shahn-TAY", "Pleased to meet you"]]}, {"name": "S'appeler — indicatif présent", "cols": "two", "items": [["Je m'appelle Paul.", "zhuh ma-PELL pol", "My name is Paul."], ["Tu t'appelles comment ?", "tew ta-pell ko-MAHN", "What are you called?"], ["Il s'appelle Karl Rainer.", "eel sa-PELL karl RAY-nair", "His name is Karl Rainer."], ["Elle s'appelle Isabelle.", "el sa-PELL ee-za-BELL", "Her name is Isabelle."], ["Nous nous appelons Pablo et Alexandra.", "noo noo za-play-OHN", "We're called Pablo and Alexandra."], ["Vous vous appelez Sofia.", "voo voo za-play so-FEE-a", "Your name is Sofia."], ["Ils s'appellent M. et Mme Johnson.", "eel sa-PELL", "They're called Mr and Mrs Johnson."], ["Elles s'appellent Alexandra et Barbara.", "el sa-PELL", "Their names are Alexandra and Barbara."]]}, {"name": "Être — indicatif présent", "cols": "two", "items": [["Je suis canadien.", "zhuh swee ka-na-dee-AN", "I'm Canadian."], ["Tu es belge.", "tew ay BELZH", "You're Belgian."], ["Il est allemand ?", "eel ay tal-MAHN", "Is he German?"], ["Elle est française.", "el ay frahn-SEZ", "She's French."], ["Nous sommes espagnols.", "noo som es-pan-YOL", "We're Spanish."], ["Vous êtes russe ?", "voo-ZET rewss", "Are you Russian?"], ["Ils sont canadiens.", "eel sohn ka-na-dee-AN", "They're Canadian."], ["Elles sont espagnoles.", "el sohn es-pan-YOL", "They're Spanish. (fem.)"]]}, {"name": "Faire connaissance — au cocktail", "items": [["Vous vous appelez Sofia ? Moi aussi !", "voo voo za-play so-FEE-a ? mwah oh-SEE", "Your name's Sofia? Mine too!"], ["Je me présente : José Gomes.", "zhuh muh pray-ZAHNT", "Let me introduce myself: José Gomes."], ["Je m'appelle Paul Bouchard.", "zhuh ma-PELL pol boo-SHAR", "My name is Paul Bouchard."], ["Voici Isabelle Moreau. Elle est française.", "vwa-SEE ee-za-BELL mo-RO. el ay frahn-SEZ", "This is Isabelle Moreau. She's French."], ["Il s'appelle Karl Rainer.", "eel sa-PELL karl RAY-nair", "His name is Karl Rainer."], ["Qui est-ce ?", "kee ESS", "Who is it?"], ["Natacha Muller, je suis autrichienne.", "zhuh swee zoh-tree-shee-EN", "Natacha Muller, I'm Austrian."], ["Moi, je suis mexicaine.", "mwah, zhuh swee mek-see-KEN", "Me, I'm Mexican."]]}, {"name": "Les articles définis", "cols": "two", "note": "<strong>le</strong> masculine · <strong>la</strong> feminine · <strong>l'</strong> before a vowel or silent h · <strong>les</strong> plural.", "items": [["le professeur", "luh pro-fess-UR", "the teacher"], ["le livre", "luh LEEV-ruh", "the book"], ["la photo", "lah fo-TO", "the photo"], ["la réponse", "lah ray-PONSS", "the answer"], ["l'étudiant", "lay-tew-dee-AHN", "the student (m)"], ["l'étudiante", "lay-tew-dee-AHNT", "the student (f)"], ["les étudiants", "lay zay-tew-dee-AHN", "the students"], ["les réponses", "lay ray-PONSS", "the answers"]]}, {"name": "Le genre des noms de pays", "note": "Country names ending in <strong>-e</strong> are usually feminine (la Chine, la France, l'Italie). Ending in <strong>-s</strong> → plural (les États-Unis, les Philippines). Everything else is masculine (le Canada, le Japon, l'Iran).<br><br><strong>Four exceptions</strong> end in -e but stay masculine: le Mexique, le Cambodge, le Zimbabwe, le Mozambique.", "items": [["Les noms de pays qui se terminent par la lettre E sont féminins.", "lay nom duh pay-EE kee suh tair-MEEN par lah let-ruh uh sohn fay-mee-NAN", "Countries ending in -e are feminine"], ["Les noms de pays qui se terminent par la lettre S sont pluriels.", "… sohn plew-ree-ELL", "Countries ending in -s are plural"]]}, {"name": "La communication en classe — le professeur", "items": [["Écoutez le dialogue.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue."], ["Répétez, s'il vous plaît.", "ray-pay-TAY, seel voo PLEH", "Repeat, please."], ["Regardez la photo.", "ruh-gar-DAY lah fo-TO", "Look at the picture."], ["Écrivez la réponse.", "ay-kree-VAY lah ray-PONSS", "Write the answer."], ["Répétez la phrase.", "ray-pay-TAY lah FRAZ", "Repeat the sentence."], ["Cochez la bonne réponse.", "ko-SHAY lah bun ray-PONSS", "Tick the correct answer."], ["Soulignez les questions.", "soo-leen-YAY lay kes-tee-OHN", "Underline the questions."], ["Parlez plus fort !", "par-LAY plew FOR", "Speak louder!"], ["Ouvrez le livre.", "oo-VRAY luh LEEV-ruh", "Open the book."], ["Fermez votre livre.", "fair-MAY VOT-ruh LEEV-ruh", "Close your book."], ["Travaillez en groupe.", "tra-va-YAY ahn GROOP", "Work in groups."], ["Travaillez par deux.", "tra-va-YAY par DUH", "Work in pairs."], ["Associez les dialogues aux dessins.", "a-so-see-AY lay dee-a-LOG oh day-SAN", "Match the dialogues to the pictures."], ["Lisez pour vérifier.", "lee-ZAY poor vay-ree-fee-AY", "Read to check."]]}, {"name": "La communication en classe — l'étudiant", "items": [["Je ne comprends pas.", "zhuh nuh kohm-PRAHN pah", "I don't understand."], ["Je ne sais pas.", "zhuh nuh say PAH", "I don't know."], ["Comment ça s'écrit ?", "ko-mahn sa say-KREE", "How is it spelled?"], ["Comment ça se prononce ?", "ko-mahn sa suh pro-NONSS", "How is it pronounced?"], ["Comment on dit « house » en français ?", "ko-mahn ohn DEE … ahn frahn-SAY", "How do you say 'house' in French?"], ["C'est à quelle page ?", "set a kel PAHZH", "What page is it?"], ["Quelle est la différence entre tu et vous ?", "kel ay lah dee-fay-RAHNSS ahn-truh tew ay VOO", "What's the difference between tu and vous?"], ["Comment ? / Pardon ?", "ko-MAHN / par-DOHN", "Sorry, what?"]]}, {"name": "Mots internationaux", "cols": "three", "note": "Every one of these is a near-twin of its English counterpart — proof you already recognise more French than you think.", "items": [["téléphone", "tay-lay-FON", "telephone"], ["film", "feelm", "film"], ["hôtel", "oh-TELL", "hotel"], ["liberté", "lee-bair-TAY", "liberty"], ["démocratie", "day-mo-kra-SEE", "democracy"], ["cliché", "klee-SHAY", "cliché"], ["philosophie", "fee-lo-zo-FEE", "philosophy"], ["musique", "mew-ZEEK", "music"], ["chocolat", "sho-ko-LAH", "chocolate"], ["architecture", "a
