-TRAY duh va-KAHNSS", "to come back from holiday"], ["un sentiment", "uhn sahn-tee-MAHN", "a feeling"], ["content / contente", "kohn-TAHN / kohn-TAHNT", "happy"], ["triste", "TREEST", "sad"]], "cols": "two"}], "bookpages": ["p052", "p053", "p054", "p055"]}, {"id": "ae-d2-carnet", "label": "Dossier 2 · Carnet de voyage", "name": "Paris, hier et aujourd'hui", "summary": "Pages 56–57, complete. Modern Paris in photos, the nine true/false questions answered, the snail text on the twenty arrondissements, every place on the map, and the three located landmarks.", "art": null, "groups": [{"name": "Page 56 — le panneau de photos", "items": [["Carnet de voyage — Paris, hier et aujourd'hui", "kar-NAY duh vwa-YAHZH — pa-REE, ee-AIR ay oh-zhoor-DWEE", "Travel notebook — Paris, yesterday and today"], ["Activité 1 : Regardez ce panneau de photos et répondez.", "ruh-gar-DAY suh pa-NO duh fo-TO", "Look at this photo board and answer."], ["Reconnaissez-vous ces lieux parisiens ?", "ruh-ko-nay-say VOO say lee-UH pa-ree-zee-AN", "Do you recognise these Parisian places?"], ["Activité 2 : Paris est la première ville touristique dans le monde.", "pa-REE ay lah pruh-mee-AIR veel too-rees-TEEK dahn luh MOHND", "Paris is the most visited city in the world."], ["1. En petits groupes, dites quels lieux de Paris vous connaissez.", "ahn puh-TEE GROOP, deet kel lee-UH", "In small groups, say which places in Paris you know."], ["2. Ces lieux sont-ils sur le plan p. 57 ?", "say lee-UH sohn TEEL sewr luh PLAHN", "Are these places on the map on p.57?"]], "note": "The board shows modern Paris: the Centre Pompidou's coloured pipes and escalators, the Institut du monde arabe, the Grande Bibliothèque towers, the Louvre pyramid, the green wall of the musée du quai Branly, the Géode sphere at La Villette, and the Simone de Beauvoir footbridge."}, {"name": "Page 57 — activité 3a : vrai ou faux", "items": [["Testez vos connaissances sur Paris !", "tes-TAY vo ko-nay-SAHNSS sewr pa-REE", "Test your knowledge of Paris!"], ["a) Vrai ou faux ? Regardez le plan et répondez en petits groupes.", "vray oo FO", "True or false? Look at the map and answer."], ["1. À Paris, il y a une rivière. → FAUX : la Seine est un fleuve, pas une rivière.", "lah SEN ay tuhn FLUV", "FALSE — the Seine is a fleuve (a river flowing to the sea), not a rivière."], ["2. Le musée du Louvre se trouve sur la rive gauche de la Seine. → FAUX : il est sur la rive droite.", "sewr lah reev DRWAHT", "FALSE — the Louvre is on the right bank."], ["3. À Paris, il y a une île. → VRAI : l'île de la Cité (et l'île Saint-Louis).", "leel duh lah see-TAY", "TRUE — the île de la Cité."], ["4. La cathédrale Notre-Dame se trouve sur l'île de la Cité. → VRAI", "no-truh-DAM … sewr leel duh lah see-TAY", "TRUE."], ["5. À Paris, il y a 20 arrondissements. → VRAI", "van ta-rohn-deess-MAHN", "TRUE — twenty."], ["6. Le Sacré-Cœur se trouve dans le 17e arrondissement. → FAUX : il est dans le 18e.", "luh sa-kray-KUR … dahn luh dee-zwee-TYEM", "FALSE — it's in the 18th."], ["7. Près de Paris, il y a un bois. → VRAI : le bois de Boulogne et le bois de Vincennes.", "luh bwah duh boo-LON-yuh ay luh bwah duh van-SEN", "TRUE — two of them."], ["8. Le boulevard périphérique fait le tour de Paris. → VRAI", "luh bool-VAR pay-ree-fay-REEK fay luh toor duh pa-REE", "TRUE — the ring road circles the city."], ["9. Les « portes » marquent les limites de Paris. → VRAI", "lay PORT MARK lay lee-MEET duh pa-REE", "TRUE — the 'gates' mark the city boundary."]]}, {"name": "Page 57 — Paris est comme… un escargot !", "items": [["b) Pour aller plus loin, lisez le texte suivant.", "poor a-LAY plew LWAN", "To go further, read the following text."], ["Paris est comme… un escargot !", "pa-REE ay kom uh nes-kar-GO", "Paris is like… a snail!"], ["Paris compte 20 arrondissements.", "pa-REE kohnt van ta-rohn-deess-MAHN", "Paris has 20 arrondissements."], ["Observez le plan : le 1er arrondissement se situe « au cœur » de Paris.", "luh pruh-mee-AY a-rohn-deess-MAHN suh see-TEW oh KUR", "The 1st arrondissement sits at the heart of Paris."], ["Pourquoi ? Parce que Paris est né sur l'île de la Cité (Paris s'appelle alors Lutèce).", "pars kuh pa-REE ay nay sewr leel duh lah see-TAY … lew-TESS", "Because Paris was born on the île de la Cité — then called Lutèce."], ["Puis la ville grandit, petit à petit, autour de ce centre.", "pwee lah veel grahn-DEE, puh-tee ta puh-TEE, oh-TOOR duh suh SAHN-truh", "Then the city grew, little by little, around that centre."], ["À partir de 1860, Paris compte 20 arrondissements, numérotés en spirale.", "a par-TEER duh dee-zwee sahn swa-SAHNT … new-may-ro-TAY ahn spee-RAL", "From 1860, Paris has 20 arrondissements, numbered in a spiral."], ["Pour situer un lieu à Paris, les Parisiens citent souvent la rive de la Seine (rive droite, rive gauche),", "poor see-tew-AY uhn lee-UH … lah REEV duh lah SEN", "To locate a place, Parisians often name the bank of the Seine,"], ["l'arrondissement et, pour être plus précis, la station de métro.", "… ay, poor EH-truh plew pray-SEE, lah sta-see-OHN duh may-TRO", "the arrondissement and, to be more precise, the metro station."], ["Ils disent, par exemple : « La tour Eiffel se trouve rive gauche, dans le 7e, métro Bir-Hakeim ».", "… reev GOSH, dahn luh set-YEM, may-TRO beer-a-KEM", "They say, for example: 'The Eiffel Tower is on the left bank, in the 7th, metro Bir-Hakeim'."]], "note": "The snail image is exact: the arrondissements spiral outwards clockwise from the 1st at the centre, so the 20th ends up back near the 18th and 19th in the north-east."}, {"name": "Page 57 — les lieux du plan de Paris", "items": [["Montmartre — le Sacré-Cœur", "mohn-MAR-truh — luh sa-kray-KUR", "the hill and basilica, 18th"], ["l'Arc de Triomphe", "lark duh tree-OHNF", "the Arc de Triomphe"], ["l'avenue des Champs-Élysées", "lav-NEW day shahn-zay-lee-ZAY", "the Champs-Élysées"], ["l'Opéra", "lo-pay-RAH", "the Opera house"], ["la place de la Concorde", "lah plahss duh lah kohn-KORD", "place de la Concorde"], ["le musée du Louvre", "luh mew-ZAY dew LOO-vruh", "the Louvre"], ["le musée d'Orsay", "luh mew-ZAY dor-SAY", "the Orsay museum"], ["le Centre Pompidou", "luh sahn-truh pohm-pee-DOO", "the Pompidou Centre"], ["Notre-Dame", "no-truh-DAM", "Notre-Dame cathedral"], ["la Sorbonne", "lah sor-BUN", "the Sorbonne"], ["le jardin du Luxembourg", "luh zhar-DAN dew lewk-sahm-BOOR", "the Luxembourg gardens"], ["la tour Eiffel", "lah toor ay-FELL", "the Eiffel Tower"], ["la tour Montparnasse", "lah toor mohn-par-NAHSS", "the Montparnasse tower"], ["le cimetière du Père-Lachaise", "luh seem-TYAIR dew pair-la-SHEZ", "Père-Lachaise cemetery"], ["le bois de Boulogne", "luh bwah duh boo-LON-yuh", "the Boulogne wood, west"], ["le bois de Vincennes", "luh bwah duh van-SEN", "the Vincennes wood, east"], ["le quai d'Issy / le quai de Bercy / le quai d'Ivry", "luh kay dee-SEE", "quays along the Seine"], ["la porte Maillot", "lah port ma-YO", "one of the city gates"], ["la porte de Clignancourt", "lah port duh kleen-yahn-KOOR", "a northern gate"], ["la porte de la Chapelle", "lah port duh lah sha-PELL", "a northern gate"], ["la porte de la Villette", "lah port duh lah vee-LETT", "a north-eastern gate"], ["la porte de Vincennes", "lah port duh van-SEN", "an eastern gate"], ["la porte d'Italie", "lah port dee-ta-LEE", "a southern gate"], ["la porte d'Orléans", "lah port dor-lay-AHN", "a southern gate"], ["la porte de Versailles", "lah port duh vair-SIGH", "a south-western gate"], ["la porte d'Auteuil", "lah port do-TUH-yuh", "a western gate"], ["la porte Dauphine", "lah port do-FEEN", "a western gate"]], "note": "The map shows all twenty arrondissements numbered, the ring of <em>portes</em> around the edge marking the old city gates, the Seine cutting east to west, and the two woods outside the boundary.", "cols": "two"}, {"name": "Page 57 — activité 4 : situer les lieux", "items": [["À partir des indications données, situez les lieux suivants sur le plan de Paris.", "a par-TEER day zan-dee-ka-see-OHN do-NAY, see-tew-AY lay lee-UH", "From the information given, locate these places on the map."], ["1. Le musée du quai Branly se trouve dans le 7e arrondissement, au bord de la Seine, près de la tour Eiffel.", "luh mew-ZAY dew kay brahn-LEE … oh bor duh lah SEN", "The quai Branly museum is in the 7th, on the riverside, near the Eiffel Tower."], ["2. La Bibliothèque Nationale de France se trouve au bord de la Seine, dans le 13e arrondissement.", "lah bee-blee-o-TEK na-see-o-NAL duh FRAHNSS … dahn luh trayz-YEM", "The National Library is by the Seine, in the 13th."], ["La passerelle Simone de Beauvoir, en face de la Bibliothèque Nationale, relie les 12e et 13e arrondissements.", "lah pas-RELL … ruh-LEE lay dooz-YEM ay trayz-YEM", "The Simone de Beauvoir footbridge, opposite the library, links the 12th and 13th."], ["3. La Fondation Cartier pour l'art contemporain se trouve dans le 14e arrondissement, dans le quartier de Montparnasse.", "lah fohn-da-see-OHN kar-tee-AY poor lar kohn-tahm-po-RAN … ka-torz-YEM", "The Cartier Foundation for contemporary art is in the 14th, in Montparnasse."], ["au bord de la Seine", "oh bor duh lah SEN", "on the banks of the Seine"], ["relier", "ruh-lee-AY", "to link, to connect"], ["une passerelle", "ewn pas-RELL", "a footbridge"]]}, {"name": "Page 57 — activité 5 et le vocabulaire", "items": [["Échangez ! Vous visitez la capitale : quel Paris préférez-vous ?", "ay-shahn-ZHAY ! … kel pa-REE pray-fay-ray VOO", "Talk together! Which Paris do you prefer?"], ["Le Paris d'hier ou le Paris d'aujourd'hui ?", "luh pa-REE dee-AIR oo luh pa-REE doh-zhoor-DWEE", "Yesterday's Paris or today's?"], ["Quels lieux visitez-vous en priorité ?", "kel lee-UH vee-zee-tay VOO ahn pree-o-ree-TAY", "Which places would you visit first?"], ["un arrondissement", "uh na-rohn-deess-MAHN", "a district of Paris"], ["la rive droite / la rive gauche", "lah reev DRWAHT / lah reev GOSH", "the right bank / the left bank"], ["un fleuve", "uhn FLUV", "a river that flows to the sea"], ["une île", "ew NEEL", "an island"], ["un bois", "uhn BWAH", "a wood"], ["le boulevard périphérique", "luh bool-VAR pay-ree-fay-REEK", "the ring road"], ["une porte", "ewn PORT", "a gate — a city entrance"], ["une limite", "ewn lee-MEET", "a boundary"], ["une station de métro", "ewn sta-see-OHN duh may-TRO", "a metro station"], ["un quartier", "uhn kar-tee-AY", "a neighbourhood"], ["un escargot", "uh nes-kar-GO", "a snail"], ["en spirale", "ahn spee-RAL", "in a spiral"], ["grandir", "grahn-DEER", "to grow"], ["petit à petit", "puh-tee ta puh-TEE", "little by little"], ["autour de", "oh-TOOR duh", "around"], ["au cœur de", "oh KUR duh", "at the heart of"], ["touristique", "too-rees-TEEK", "touristic, much visited"], ["l'art contemporain", "lar kohn-tahm-po-RAN", "contemporary art"]], "cols": "two"}], "bookpages": ["p056", "p057"]}, {"id": "ae-d2-sexercer", "label": "Dossier 2 · S'exercer", "name": "Les corrigés", "summary": "Pages 58–59, complete. All sixteen exercises with every item and every answer — articles, explanations, prepositions of place, contracted articles, the scrambled hotel dialogue, questions, directions, three irregular verbs, demonstratives and country prepositions.", "art": null, "groups": [{"name": "Leçon 1 — Ex. 1 : article défini ou indéfini", "items": [["Complétez avec un article défini ou indéfini.", "kohm-play-TAY a-vek uh nar-TEE-kluh", "Complete with a definite or indefinite article."], ["Exemple : … ville de Pontoise est à 30 km de Paris. → LA ville de Pontoise est à 30 km de Paris.", "lah veel duh pohn-TWAHZ", "the worked example"], ["1. LES villes de Melun et d'Evry se trouvent dans LA banlieue de Paris.", "lay VEEL … dahn lah bahn-lee-UH", "identified towns and a known suburb"], ["2. Pissarro est UN peintre.", "pee-sa-RO ay tuhn PAN-truh", "introducing a profession → un"], ["3. LE jardin des Cinq Sens est dans LE centre-ville.", "luh zhar-DAN … dahn luh sahn-truh-VEEL", "both identified → le"], ["4. À Pontoise, il y a DES musées.", "eel ee a day mew-ZAY", "non-specific plural → des"], ["5. LE théâtre de Pontoise s'appelle L'Apostrophe.", "luh tay-AH-truh … sa-PELL la-pos-TROF", "identified → le"], ["6. Il y a UNE rivière qui passe à Pontoise : L'Oise.", "eel ee a ewn ree-vee-AIR … LWAHZ", "first mention → une, then named → l'"], ["7. Pontoise est à 30 km de LA capitale de LA France.", "… duh lah ka-pee-TAL duh lah FRAHNSS", "identified → la"]], "note": "The logic throughout: <strong>un/une/des</strong> when you introduce something, <strong>le/la/les</strong> when it's already identified or unique."}, {"name": "Leçon 1 — Ex. 2 : citer des lieux célèbres", "items": [["Citez des lieux célèbres (musée, place, parc, magasin, avenue…) dans des grandes villes du monde : Londres, Venise, Madrid, New York…", "see-TAY day lee-UH say-LEB-ruh", "Name famous places in the world's great cities."], ["Exemple : À Londres, il y a un grand magasin célèbre, c'est le magasin Harrod's.", "a LOHN-druh, eel ee a uhn grahn ma-ga-ZAN say-LEB-ruh", "the worked example"], ["À Venise, il y a une place célèbre, c'est la place Saint-Marc.", "a vuh-NEEZ … lah plahss san-MARK", "a model answer"], ["À Madrid, il y a un musée célèbre, c'est le musée du Prado.", "a ma-DREED … luh mew-ZAY dew pra-DO", "a model answer"], ["À New York, il y a un parc célèbre, c'est Central Park.", "a new-YORK … uhn PARK say-LEB-ruh", "a model answer"]], "note": "The pattern is exactly the Point Langue from p.45: <strong>il y a + indefinite</strong>, then <strong>c'est + definite</strong>."}, {"name": "Leçon 1 — Ex. 3 : pourquoi ? parce que…", "items": [["Associez les questions et les réponses.", "a-so-see-AY", "Match the questions to the answers."], ["1. Pourquoi habitez-vous à Pontoise ? → d. Parce que je suis étudiant à l'université de Cergy-Pontoise.", "poor-KWAH a-bee-tay VOO", "Why do you live in Pontoise? — Because I'm a student there."], ["2. Pourquoi êtes-vous au théâtre de L'Apostrophe, ce soir ? → f. Parce que j'adore les spectacles de danse.", "… oh tay-AH-truh … suh SWAHR", "Why are you at the theatre tonight? — Because I love dance shows."], ["3. Pourquoi photographiez-vous la cathédrale ? → a. Parce qu'elle a une belle architecture.", "poor-KWAH fo-to-gra-fee-ay VOO", "Why are you photographing the cathedral? — Because it has beautiful architecture."], ["4. Pourquoi aimez-vous Pissarro ? → b. Parce que c'est un peintre impressionniste.", "… ay-may VOO pee-sa-RO", "Why do you like Pissarro? — Because he's an impressionist painter."], ["5. Pourquoi y a-t-il un pont sur le blason de la ville de Pontoise ? → c. Parce que la ville se trouve sur la rivière Oise.", "… sewr luh bla-ZOHN", "Why is there a bridge on the coat of arms? — Because the town is on the Oise."], ["6. Pourquoi visitez-vous les remparts ? → e. Parce que j'aime les lieux historiques.", "… lay rahm-PAR", "Why are you visiting the ramparts? — Because I like historic places."]], "note": "Answers: <strong>1→d · 2→f · 3→a · 4→b · 5→c · 6→e</strong>."}, {"name": "Leçon 1 — Ex. 4 : les prépositions de lieu", "items": [["Alice commente ses photos de week-end. Observez les dessins et complétez les commentaires avec les prépositions suivantes : sur – derrière – devant – sous – à côté de.", "… kohm-play-TAY lay ko-mahn-TAIR", "Complete Alice's photo captions with these prepositions."], ["1. Promenade DERRIÈRE les remparts.", "prom-NAHD dair-ee-AIR lay rahm-PAR", "A walk behind the ramparts."], ["2. Pique-nique SOUS un arbre.", "peek-NEEK soo zuh NAR-bruh", "Picnic under a tree."], ["3. Nous trois, DEVANT la cathédrale Saint-Maclou.", "noo TWAH, duh-VAHN lah ka-tay-DRAL", "The three of us in front of the cathedral."], ["4. Betty au marché, À CÔTÉ D'un commerçant (Léa est SUR le monsieur !).", "… a ko-TAY duhn ko-mair-SAHN … SEWR luh muh-SYUH", "Betty at the market next to a trader (Léa is on the gentleman!)."]]}, {"name": "Leçon 1 — Ex. 5 : chassez l'intrus", "items": [["Chassez l'intrus.", "sha-SAY lan-TREW", "Find the odd one out."], ["1. le cinéma – le théâtre – LE RESTAURANT – le musée", "luh res-to-RAHN", "the others are culture; a restaurant is a business"], ["2. le jardin – l'église – LA RIVIÈRE", "lah ree-vee-AIR", "the others are places you go into; a river is not"], ["3. LE MARCHÉ – l'école – l'université", "luh mar-SHAY", "the others are education"], ["4. l'épicerie – la boulangerie – L'HÔPITAL", "lo-pee-TAL", "the others are food shops"], ["5. LA PHARMACIE – la mairie – la poste", "lah far-ma-SEE", "the others are public services"]]}, {"name": "Leçon 1 — Ex. 6 : l'article contracté", "items": [["Transformez comme dans l'exemple.", "trahns-for-MAY", "Transform as in the example."], ["Exemple : Le parc est à côté de l'hôtel de ville. (le musée) → Le parc est à côté DU musée.", "a ko-TAY dew mew-ZAY", "the worked example"], ["1. La poste est en face du théâtre. (l'église) → La poste est en face DE L'église.", "ahn fahss duh lay-GLEEZ", "de + l' stays de l'"], ["2. Le restaurant est à droite de la banque. (le supermarché) → Le restaurant est à droite DU supermarché.", "a DRWAHT dew sew-pair-mar-SHAY", "de + le = du"], ["3. Le jardin est à côté de la cathédrale. (les remparts) → Le jardin est à côté DES remparts.", "a ko-TAY day rahm-PAR", "de + les = des"], ["4. La banque est à gauche de la boulangerie. (le cinéma) → La banque est à gauche DU cinéma.", "a GOSH dew see-nay-MAH", "de + le = du"], ["5. L'université est loin de la ville. (le centre-ville) → L'université est loin DU centre-ville.", "lwan dew sahn-truh-VEEL", "de + le = du"], ["6. Le marché est près de la bibliothèque. (le théâtre) → Le marché est près DU théâtre.", "pray dew tay-AH-truh", "de + le = du"]]}, {"name": "Leçon 2 — Ex. 7 : le dialogue à l'hôtel dans l'ordre", "items": [["Remettez le dialogue dans l'ordre.", "ruh-met-TAY luh dee-a-LOG dahn LOR-druh", "Put the dialogue back in order."], ["c. Réceptionniste : Hôtel du lac, bonjour !", "o-TELL dew LAK, bohn-ZHOOR", "Hôtel du Lac, good morning!"], ["h. Client : Bonjour, madame, je voudrais une chambre pour ce soir. C'est possible ?", "zhuh voo-DREH ewn SHAHM-bruh poor suh SWAHR", "I'd like a room for tonight. Is that possible?"], ["a. Réceptionniste : Oui. Pour combien de personnes ?", "poor kohm-bee-AN duh pair-SUN", "Yes. For how many people?"], ["d. Client : Une personne. Vous avez une chambre avec salle de bains ?", "ewn pair-SUN … a-vek sal duh BAN", "One person. Do you have a room with a bathroom?"], ["g. Réceptionniste : Ah non, désolée, monsieur, nous avons seulement une chambre avec douche à vous proposer.", "… sul-MAHN ewn SHAHM-bruh a-vek DOOSH", "Sorry, we only have a room with a shower."], ["j. Client : Vous acceptez les chiens ?", "voo zak-sep-TAY lay shee-AN", "Do you accept dogs?"], ["e. Réceptionniste : Oui, mais les petits chiens seulement.", "wee, may lay puh-TEE shee-AN sul-MAHN", "Yes, but only small dogs."], ["b. Client : Quel est le prix de la chambre ?", "kel ay luh PREE duh lah SHAHM-bruh", "What's the price of the room?"], ["k. Réceptionniste : 26 euros, petit déjeuner inclus.", "van-sees uh-RO, puh-tee day-zhuh-NAY an-KLEW", "€26, breakfast included."], ["f. Client : Bien, je prends la chambre. C'est loin de la gare ?", "bee-AN, zhuh prahn lah SHAHM-bruh. say lwan duh lah GAR", "Fine, I'll take it. Is it far from the station?"], ["i. Réceptionniste : Non, c'est tout près. Nous sommes à cinq minutes de la gare.", "nohn, say too PRAY … a sank mee-NEWT", "No, very close. We're five minutes from the station."]], "note": "The correct order is <strong>c – h – a – d – g – j – e – b – k – f – i</strong>."}, {"name": "Leçon 2 — Ex. 8 : trouvez la question", "items": [["Trouvez la question.", "troo-VAY lah kes-tee-OHN", "Find the question."], ["Exemple : Non, il n'y a pas de restaurant dans l'hôtel. → Est-ce qu'il y a un restaurant dans l'hôtel ?", "es-keel ee a uhn res-to-RAHN", "the worked example"], ["1. Non, je ne travaille pas à l'auberge de jeunesse. → Est-ce que vous travaillez à l'auberge de jeunesse ?", "es-kuh voo tra-va-YAY", "Do you work at the youth hostel?"], ["2. Oui, il y a une salle de bains à l'étage. → Est-ce qu'il y a une salle de bains à l'étage ?", "es-keel ee a ewn sal duh BAN a lay-TAHZH", "Is there a bathroom on the landing?"], ["3. Oui, mon ami a une carte d'adhérent. → Est-ce que ton ami a une carte d'adhérent ?", "es-kuh toh na-MEE a ewn kart da-day-RAHN", "Does your friend have a membership card?"], ["4. Non, je ne téléphone pas pour une réservation. → Est-ce que vous téléphonez pour une réservation ?", "es-kuh voo tay-lay-fo-NAY", "Are you calling about a booking?"], ["5. Non, nous ne réservons pas la chambre. → Est-ce que vous réservez la chambre ?", "es-kuh voo ray-zair-VAY", "Are you booking the room?"], ["6. Oui, j'ai une chambre libre pour samedi. → Est-ce que vous avez une chambre libre pour samedi ?", "es-kuh voo za-VAY ewn SHAHM-bruh LEE-bruh", "Do you have a room free for Saturday?"]]}, {"name": "Leçon 2 — Ex. 9 : compléter avec Est-ce que ou Quel(le)(s)", "items": [["Complétez le dialogue avec les questions. Utilisez Est-ce que ou Quel(le)(s).", "kohm-play-TAY luh dee-a-LOG", "Complete the dialogue with questions."], ["Un couple prépare un week-end à Annecy.", "uhn KOO-pluh pray-PAR uhn week-END a a-nuh-SEE", "A couple are planning a weekend in Annecy."], ["— Bon, j'ai une réservation dans un hôtel à Annecy pour le week-end.", "bohn, zhay ewn ray-zair-va-see-OHN", "Right, I've got a hotel booking for the weekend."], ["— Est-ce que c'est un hôtel 5 étoiles ? — Non, ce n'est pas un 5 étoiles, mais un petit hôtel 2 étoiles très confortable.", "es-kuh set uh no-TELL sank ay-TWAHL", "Is it a 5-star? — No, a very comfortable little 2-star."], ["— Est-ce qu'il est loin de la gare ? — Non, il est à 200 mètres de la gare.", "es-keel ay lwan duh lah GAR", "Is it far from the station? — No, 200 metres."], ["— Quel est le prix de la chambre ? — 80 euros avec le petit déjeuner.", "kel ay luh PREE duh lah SHAHM-bruh", "What's the room price? — €80 with breakfast."], ["— Est-ce qu'il y a des chambres avec vue ? — Non, les chambres avec vue sont déjà réservées.", "es-keel ee a day SHAHM-bruh a-vek VEW", "Are there rooms with a view? — No, already booked."], ["— Quel est le nom de l'hôtel ? — « L'Hôtel des Alpes ».", "kel ay luh NOHN duh lo-TELL", "What's the hotel called? — L'Hôtel des Alpes."], ["— Quel jour est-ce que nous arrivons ? — Nous arrivons le vendredi soir.", "kel ZHOOR es-kuh noo za-ree-VOHN", "What day do we arrive? — Friday evening."]]}, {"name": "Leçon 2 — Ex. 10 : associez les éléments", "items": [["Associez les éléments des deux colonnes. (Plusieurs réponses sont possibles.)", "a-so-see-AY lay zay-lay-MAHN day duh ko-LUN", "Match the two columns. Several answers are possible."], ["Vous tournez → à gauche.", "voo toor-NAY a GOSH", "You turn left."], ["Vous allez → tout droit.", "voo za-LAY too DRWAH", "You go straight on."], ["Vous traversez → la place.", "voo tra-vair-SAY lah PLAHSS", "You cross the square."], ["Vous prenez → la rue Dubois. / la 1re à droite.", "voo pruh-NAY lah REW … lah pruh-mee-AIR a DRWAHT", "You take rue Dubois / the first on the right."], ["Vous descendez → le boulevard Martin.", "voo day-sahn-DAY luh bool-VAR", "You go down boulevard Martin."], ["Vous continuez → tout droit. / la rue Dubois.", "voo kohn-tee-new-AY too DRWAH", "You carry straight on."]]}, {"name": "Leçon 2 — Ex. 11 : écrire l'itinéraire", "items": [["Observez le plan. Écrivez l'itinéraire pour aller du point A au point B.", "ob-sair-VAY luh PLAHN. ay-kree-VAY lee-tee-nay-RAIR", "Look at the map. Write the route from A to B."], ["Utilisez les verbes passer, tourner, continuer, traverser, aller et prendre.", "… pa-SAY, toor-NAY, kohn-tee-new-AY, tra-vair-SAY, a-LAY ay PRAHN-druh", "Use these six verbs."], ["Les lieux du plan : la rue de la Gare, l'église, le cinéma, la rue Amelot, la rue Plot, le supermarché, la mairie, la place St Jean, la rue Victor Hugo, le square Rapp, le café, la rue Pasteur, la rue Blanche, l'avenue Gambetta, la rue Scribe, la rue du Duc", "…", "everything printed on the little map"], ["Modèle : Vous prenez la rue Victor Hugo, vous continuez tout droit, vous traversez la place St Jean, vous passez devant la mairie, vous tournez à droite rue Blanche et vous allez jusqu'au supermarché.", "… zhews-KO sew-pair-mar-SHAY", "a model answer using all six verbs"]]}, {"name": "Leçon 2 — Ex. 12 : descendre, prendre, aller", "items": [["Complétez avec les verbes descendre, prendre ou aller au présent.", "kohm-play-TAY a-vek lay VAIRB", "Complete with descendre, prendre or aller in the present."], ["1. — Pour aller en direction du lac, nous PRENONS la rue d'Aix ? — Oui, c'est exact, vous DESCENDEZ la rue jusqu'à l'avenue de la Corniche.", "noo pruh-NOHN … voo day-sahn-DAY", "Do we take rue d'Aix? — Yes, go down it to avenue de la Corniche."], ["2. — Tu PRENDS la voiture pour aller en ville ? — Non, je VAIS en ville à pied.", "tew PRAHN lah vwa-TEWR … zhuh vay ahn veel a pee-AY", "Are you taking the car? — No, I'm walking."], ["3. — Ils demandent l'itinéraire pour arriver à l'auberge de jeunesse. — C'est simple : ils PRENNENT le bus n° 5 et ils DESCENDENT à la station Bas-Semnoz.", "eel PREN luh BEWSS … eel day-SAHND", "They take bus 5 and get off at Bas-Semnoz."], ["4. — Nicolas VA à Lille pour le week-end, pourquoi tu ne VAS pas avec lui ? — Parce que je VAIS à Marseille.", "nee-ko-LAH VAH a LEEL … zhuh vay a mar-SAY", "Nicolas is going to Lille — why not go too? — Because I'm going to Marseille."], ["5. — Vos amis VONT à Lyon en voiture ? — Oui, ils PRENNENT l'autoroute, c'est rapide.", "vo za-MEE VOHN a lee-OHN … eel PREN lo-to-ROOT", "Are your friends driving to Lyon? — Yes, they take the motorway."]]}, {"name": "Leçon 3 — Ex. 13 : le vocabulaire de la correspondance", "items": [["Continuez la liste des mots pour parler de la correspondance.", "kohn-tee-NEW-ay lah leest day MO", "Continue the list of words for writing letters."], ["Un timbre, une carte postale…", "uhn TAN-bruh, ewn kart pos-TAL", "A stamp, a postcard…"], ["une lettre", "ewn LET-ruh", "a letter"], ["une enveloppe", "ew nahn-VLOP", "an envelope"], ["une adresse", "ew na-DRESS", "an address"], ["le code postal", "luh kod pos-TAL", "the postcode"], ["l'expéditeur / le destinataire", "leks-pay-dee-TUR / luh des-tee-na-TAIR", "sender / addressee"], ["la poste / une boîte aux lettres", "lah POST / ewn bwat oh LET-ruh", "the post office / a postbox"], ["le facteur", "luh fak-TUR", "the postman"], ["envoyer / recevoir", "ahn-vwa-YAY / ruh-suh-VWAHR", "to send / to receive"]]}, {"name": "Leçon 3 — Ex. 14 : chassez l'intrus", "items": [["Chassez l'intrus.", "sha-SAY lan-TREW", "Find the odd one out."], ["1. Pour commencer une carte postale : Ma chère Isabelle – Coucou ! – BONJOUR MONSIEUR – Salut ! – Cher Julien", "bohn-ZHOOR muh-SYUH", "the intruder is Bonjour monsieur — that's formal, the others are for people you know"], ["2. Pour terminer : 1 000 baisers – AU REVOIR ! – Bisous – À bientôt – Amitiés – Affectueusement", "oh ruh-VWAHR", "the intruder is Au revoir ! — you say it, you don't write it at the end of a card"], ["1 000 baisers", "meel bay-ZAY", "a thousand kisses"], ["Affectueusement", "a-fek-tew-uhz-MAHN", "Affectionately"]]}, {"name": "Leçon 3 — Ex. 15 : ce, cet, cette, ces", "items": [["Complétez les commentaires avec ce, cet, cette ou ces. Je t'envoie ces huit photos de Nice.", "zhuh tahn-VWAH say weet fo-TO duh NEESS", "I'm sending you these eight photos of Nice."], ["Photo n° 1 : L'architecture de CETTE maison est vraiment originale !", "duh set may-ZOHN", "feminine → cette"], ["Photo n° 2 : Tu connais CETTE avenue : c'est la célèbre promenade des Anglais.", "set av-NEW … lah prom-NAHD day zahn-GLAY", "feminine → cette"], ["Photo n° 3 : J'adore l'ambiance de CES marchés de Provence !", "day mar-SHAY duh pro-VAHNSS", "plural → ces"], ["Photo n° 4 : Non, je n'habite pas ici, mais les touristes riches descendent dans CET hôtel.", "dahn set o-TELL", "masculine + vowel → cet"], ["Photo n° 5 : Tu vois, CE ciel bleu, CE soleil, c'est Nice, c'est la Côte d'Azur !", "suh see-ELL BLUH, suh so-LAY … lah kot da-ZEWR", "masculine → ce"], ["Photo n° 6 : J'aime CET endroit, CE parc est magnifique !", "set ahn-DRWAH, suh PARK", "cet before a vowel, ce before a consonant"], ["Photo n° 7 : Ah ! CES fleurs, CES couleurs, c'est extraordinaire ! Et ça sent bon !", "say FLUR, say koo-LUR … ay sa sahn BOHN", "plural → ces; and it smells good!"], ["Photo n° 8 : De ma fenêtre, je vois CETTE jolie église.", "set zho-LEE ay-GLEEZ", "feminine → cette"]]}, {"name": "Leçon 3 — Ex. 16 : le déplacement des avions", "items": [["Décrivez le déplacement de ces avions.", "day-kree-VAY luh day-plahss-MAHN duh say za-vee-OHN", "Describe these planes' journeys."], ["Exemple : L'avion vient d'Italie et va en France.", "la-vee-OHN vee-AN dee-ta-LEE ay va ahn FRAHNSS", "the worked example"], ["1. Japon → Grèce : L'avion vient du Japon et va en Grèce.", "… dew zha-POHN ay va ahn GRESS", "masculine origin → du; feminine destination → en"], ["2. Allemagne → Brésil : L'avion vient d'Allemagne et va au Brésil.", "… dal-MAHN-yuh ay va oh bray-ZEEL", "vowel → d'; masculine → au"], ["3. France → Écosse : L'avion vient de France et va en Écosse.", "… duh FRAHNSS ay va ah nay-KOSS", "feminine → de; vowel → en"], ["4. Iran → États-Unis : L'avion vient d'Iran et va aux États-Unis.", "… dee-RAHN ay va oh zay-ta-zew-NEE", "vowel → d'; plural → aux"], ["5. Philippines → Portugal : L'avion vient des Philippines et va au Portugal.", "… day fee-lee-PEEN ay va oh por-tew-GAL", "plural → des; masculine → au"]]}], "bookpages": ["p058", "p059"]}, {"id": "ae-d2-delf", "label": "Dossier 2 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 60, complete. Sophie's message word for word, all eight questions answered with their evidence, every street on the map, and the ten oral prompts turned into questions.", "art": null, "groups": [{"name": "Compréhension des écrits — 10 points", "items": [["Vous recevez le message suivant. Lisez puis répondez.", "voo ruh-suh-VAY luh muh-SAHZH swee-VAHN", "You receive the following message. Read it then answer."], ["Salut,", "sa-LEW", "Hi,"], ["Tu es libre samedi ?", "tew ay LEE-bruh sam-DEE", "Are you free on Saturday?"], ["Il y a un nouveau restaurant japonais à côté de mon appartement : il est très bon !", "eel ee a uhn noo-VO res-to-RAHN zha-po-NAY a ko-TAY duh moh na-par-tuh-MAHN", "There's a new Japanese restaurant next to my flat: it's very good!"], ["Pour venir, c'est très simple : tu descends à l'arrêt de bus rue Serviez ;", "poor vuh-NEER, say tray SAN-pluh : tew day-SAHN a la-RAY duh BEWSS", "To get here it's very simple: get off at the bus stop on rue Serviez;"], ["au bout de la rue, tu prends à droite la rue Maréchal Foch,", "oh boo duh lah REW, tew PRAHN a DRWAHT", "at the end of the street, take rue Maréchal Foch on the right,"], ["tu continues et tu prends la première à droite.", "tew kohn-tee-NEW ay tew PRAHN lah pruh-mee-AIR a DRWAHT", "carry on and take the first on the right."], ["Au bout de la rue, tu tournes à gauche, c'est la rue Tran :", "… tew TOORN a GOSH", "At the end of the street, turn left — that's rue Tran:"], ["le restaurant est au numéro 10, en face d'un petit jardin.", "… oh new-may-RO dees, ahn fahss duhn puh-TEE zhar-DAN", "the restaurant is at number 10, opposite a small garden."], ["Nous allons voir un film après le restaurant (séance de 22 heures) ?", "noo za-LOHN vwahr uhn FEELM … say-AHNSS duh van-duh ZUR", "Shall we see a film after dinner (the 10pm showing)?"], ["Appelle-moi pour me dire si tu es d'accord avec ce programme.", "a-PELL MWAH poor muh DEER see tew ay da-KOR", "Call me to say if you're happy with the plan."], ["Bisous. Sophie", "bee-ZOO", "Kisses. Sophie"]]}, {"name": "Les huit questions et leurs réponses", "items": [["1. C'est un message : a. familial / b. professionnel / c. amical → C. AMICAL", "a-mee-KAL", "It's a friendly message — Salut, Bisous, tu."], ["2. Qui écrit ? → SOPHIE", "kee ay-KREE", "Who's writing? Sophie."], ["3. Pour aller au rendez-vous, vous prenez : a. le bus / b. un taxi / c. le métro → A. LE BUS", "luh BEWSS", "You take the bus — 'tu descends à l'arrêt de bus'."], ["4. Le rendez-vous est dans un restaurant : a. africain / b. asiatique / c. américain → B. ASIATIQUE", "a-zee-a-TEEK", "Asian — it's a Japanese restaurant."], ["5. Le rendez-vous est : a. le matin / b. l'après-midi / c. le soir → C. LE SOIR", "luh SWAHR", "In the evening — the film is at 10pm."], ["6. Après le restaurant, Sophie propose d'aller : a. au théâtre / b. au musée / c. au cinéma → C. AU CINÉMA", "oh see-nay-MAH", "To the cinema — 'voir un film'."], ["7. Sophie demande une réponse : a. par téléphone / b. par mail / c. par SMS → A. PAR TÉLÉPHONE", "par tay-lay-FON", "By phone — 'Appelle-moi'."], ["8. Sur le plan, tracez le chemin pour aller de l'arrêt de bus au restaurant. Indiquez la position exacte du restaurant.", "tra-SAY luh shuh-MAN", "Trace the route on the map and mark the restaurant."]]}, {"name": "Les rues du plan", "items": [["rue Serviez — l'arrêt de bus (BUS)", "rew sair-vee-AY", "where you get off"], ["rue Maréchal Foch", "rew ma-ray-SHAL FOSH", "first right"], ["rue Tran", "rew TRAHN", "where the restaurant is, at n° 10"], ["rue A. Taylor", "rew tay-LOR", "on the map"], ["rue J.B. Carreau", "rew ka-RO", "on the map"], ["rue Bernadotte", "rew bair-na-DOT", "on the map"], ["rue des Cordeliers", "rew day kor-duh-lee-AY", "on the map"], ["rue du Hédas", "rew dew ay-DAHSS", "on the map"], ["rue R. Fourmets", "rew foor-MAY", "on the map"], ["impasse de la Foi", "an-PAHSS duh lah FWAH", "a dead end on the map"], ["rue Samonzet", "rew sa-mohn-ZAY", "on the map"], ["rue Duboué", "rew dew-boo-AY", "on the map"], ["rue Gambetta", "rew gahm-bay-TAH", "on the map"], ["rue Lamothe", "rew la-MOT", "on the map"], ["rue V. Meunier", "rew muh-nee-AY", "on the map"], ["rue J. Monnet", "rew mo-NAY", "on the map"], ["place G. Clemenceau", "plahss klay-mahn-SO", "a square on the map"], ["place St Louis de Gonzague", "plahss san loo-EE duh gohn-ZAG", "a square on the map"]], "cols": "two"}, {"name": "Production orale — 10 points", "items": [["Échange d'informations", "ay-SHAHNZH dan-for-ma-see-OHN", "Exchanging information"], ["Posez des questions à votre voisin(e) à partir des mots proposés.", "po-ZAY day kes-tee-OHN a VOT-ruh vwa-ZAN", "Ask your neighbour questions using the words given."], ["Jardin ? → Est-ce qu'il y a un jardin près de chez vous ?", "zhar-DAN", "Garden?"], ["Langues ? → Quelles langues est-ce que vous parlez ?", "LAHNG", "Languages?"], ["Cinéma ? → Est-ce que vous allez souvent au cinéma ?", "see-nay-MAH", "Cinema?"], ["Vacances ? → Où est-ce que vous passez vos vacances ?", "va-KAHNSS", "Holidays?"], ["Pays ? → De quel pays est-ce que vous venez ?", "pay-EE", "Country?"], ["Monument ? → Quel monument est-ce que vous préférez ?", "mo-new-MAHN", "Monument?"], ["Téléphone ? → Quel est votre numéro de téléphone ?", "tay-lay-FON", "Telephone?"], ["Ville ? → Dans quelle ville est-ce que vous habitez ?", "VEEL", "Town?"], ["Âge ? → Quel âge est-ce que vous avez ?", "AHZH", "Age?"], ["Restaurant ? → Est-ce que vous aimez les restaurants japonais ?", "res-to-RAHN", "Restaurant?"], ["Attention ! C'est possible de poser une question avec la même idée mais sans le mot.", "… sahn luh MO", "You may ask a question with the same idea but without using the word."], ["Exemple : Météo ? → « Vous regardez la météo à la télévision ? » / « Est-ce qu'il fait beau aujourd'hui ? »", "may-tay-O", "the worked example"]]}], "bookpages": ["p060"]}, {"id": "ae-d3l1", "label": "Dossier 3 · Leçon 1", "name": "J'adore", "summary": "Pages 61–65, complete. The three M6 reality shows, both casting cards word for word, the likes-and-dislikes scale, faire/aller with articles, the French sport survey, all nine job photos and the six masculine-feminine patterns.", "art": "faireall", "bookpages": ["p061", "p062", "p063", "p064", "p065"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 1, in page order.", "tracks": [{"n": 91, "label": "p.64 act. 9 — les personnes parlent de leur profession"}, {"n": 92, "label": "p.65 act. 11 — phonétique, homme ou femme ?"}]}, {"name": "Page 61 — la page d'ouverture du dossier", "items": [["Dossier 3 — Dis-moi qui tu es", "dee-MWAH kee tew AY", "Dossier 3 — Tell me who you are"], ["Leçon 1 : J'adore", "zha-DOR", "Lesson 1: I love it"], ["> Parler de ses goûts, de ses activités", "par-LAY duh say GOO, duh say zak-tee-vee-TAY", "Talking about your tastes and activities"], ["> Parler de sa profession", "par-LAY duh sa pro-fay-see-OHN", "Talking about your job"], ["Leçon 2 : Solo ou duo ?", "so-LO oo dew-O", "Lesson 2: Solo or duo?"], ["> Parler de soi", "par-LAY duh SWAH", "Talking about yourself"], ["> Caractériser une personne", "ka-rak-tay-ree-ZAY ewn pair-SUN", "Describing a person"], ["Leçon 3 : En famille", "ahn fa-MEE", "Lesson 3: As a family"], ["> Parler de sa famille", "par-LAY duh sa fa-MEE", "Talking about your family"], ["> Annoncer un événement familial, réagir", "a-nohn-SAY uh nay-vayn-MAHN fa-mee-lee-AL, ray-a-ZHEER", "Announcing a family event, reacting"], ["> Demander / Donner des nouvelles de quelqu'un", "duh-mahn-DAY / do-NAY day noo-VELL duh kel-KUHN", "Asking for / giving news of someone"], ["Carnet de voyage : Loisirs", "kar-NAY duh vwa-YAHZH : lwa-ZEER", "Travel notebook: Leisure"], ["Vers le DELF A1", "vair luh DELF", "Towards the DELF A1"], ["Projet : Réaliser une affiche de film sur la famille", "ray-a-lee-ZAY ewn a-FEESH duh FEELM sewr lah fa-MEE", "Project: make a film poster about the family"], ["Phonie-graphie → activités 1 à 4 p. 191-192", "fo-nee-gra-FEE", "Sound-and-spelling"], ["Lexique thématique → p. 198-199", "lek-SEEK tay-ma-TEEK", "Thematic lexicon"]], "note": "The opener shows two photographs side by side: a wedding party posed on steps, and a group of people in matching red outfits with backpacks — family on the left, chosen company on the right."}, {"name": "Page 62 — l'annonce de M6", "items": [["J'adore", "zha-DOR", "I love it"], ["Parler de ses goûts, de ses activités", "par-LAY duh say GOO", "Talking about your tastes and activities"], ["TéléJournal — semaine 10 — Les annonces des chaînes", "tay-lay-zhoor-NAL — suh-MEN dees — lay za-NOHNSS day SHEN", "TV guide — week 10 — Channel announcements"], ["Vous avez une passion, un talent ?", "voo za-VAY ewn pa-see-OHN, uhn ta-LAHN", "Do you have a passion, a talent?"], ["Vous aimez la téléréalité ?", "voo zay-MAY lah tay-lay-ray-a-lee-TAY", "Do you like reality TV?"], ["Participez à une émission !", "par-tee-see-PAY a ew nay-mee-see-OHN", "Take part in a programme!"]]}, {"name": "Page 62 — les trois émissions en détail", "items": [["Un dîner presque parfait", "uhn dee-NAY presk par-FAY", "'A nearly perfect dinner'"], ["5 candidats de la même région · 5 jours · 5 invitations à dîner à la maison", "sank kahn-dee-DAH duh lah mem ray-zhee-OHN", "5 contestants from the same region, 5 days, 5 dinner invitations at home"], ["10 000 € à gagner pour le meilleur hôte !", "dee meel uh-RO a ga-NYAY poor luh may-YUR OT", "€10,000 for the best host!"], ["Vous aimez cuisiner, inviter, préparer une belle table…", "voo zay-MAY kwee-zee-NAY, an-vee-TAY, pray-pa-RAY ewn bell TAH-bluh", "You like cooking, inviting people, laying a beautiful table…"], ["Casting le 20 novembre", "kas-TEENG luh van no-VAHM-bruh", "Casting on 20 November"], ["Pékin Express", "pay-KAN eks-PRESS", "'Peking Express'"], ["10 000 km en 12 étapes · 10 équipes · 1 € par jour et par candidat", "dee meel kee-lo-MET-ruh ahn dooz ay-TAP", "10,000 km in 12 stages, 10 teams, €1 per day per contestant"], ["100 000 € à gagner !", "sahn meel uh-RO a ga-NYAY", "€100,000 to be won!"], ["Vous adorez l'aventure, les voyages et le sport.", "voo za-do-RAY la-vahn-TEWR, lay vwa-YAHZH ay luh SPOR", "You love adventure, travel and sport."], ["Casting le 16 janvier", "kas-TEENG luh sez zhahn-vee-AY", "Casting on 16 January"], ["Nouvelle Star", "noo-VELL STAR", "'New Star'"], ["10 candidats finalistes · 1 nouvelle star de la chanson française", "dee kahn-dee-DAH fee-na-LEEST", "10 finalists, one new French singing star"], ["À gagner : un contrat dans une maison de disques !", "a ga-NYAY : uhn kohn-TRAH dahn zewn may-ZOHN duh DEESK", "To be won: a record label contract!"], ["Vous faites de la musique, vous aimez chanter, vous rêvez d'enregistrer un album.", "voo fet duh lah mew-ZEEK … voo ray-VAY dahn-ruh-zhees-TRAY uh nal-BOM", "You make music, like singing, dream of recording an album."], ["Casting le 3 février", "kas-TEENG luh trwah fay-vree-AY", "Casting on 3 February"]], "note": "Activity 1b asks for three things per programme — <strong>la thématique</strong> (cooking, adventure, singing), <strong>le prix pour le gagnant</strong> (€10,000, €100,000, a record contract), and <strong>le profil des candidats</strong> (the 'Vous aimez…' line)."}, {"name": "Page 62 — activités 1 et 2", "items": [["Activité 1 a) Lisez l'annonce de la chaîne M6 et identifiez le type d'émission présenté.", "lee-ZAY la-NOHNSS duh lah SHEN", "Read the M6 announcement and identify the type of programme."], ["→ Ce sont des émissions de téléréalité, avec casting.", "suh sohn day zay-mee-see-OHN duh tay-lay-ray-a-lee-TAY", "They're reality TV shows with an audition."], ["b) Pour chaque émission, précisez : la thématique, le prix pour le gagnant, le profil des candidats.", "pray-see-ZAY : lah tay-ma-TEEK, luh PREE poor luh ga-NYAHN, luh pro-FEEL", "For each programme give the theme, the prize and the candidate profile."], ["Activité 2 : Échangez ! Connaissez-vous des émissions avec les mêmes concepts ?", "ay-shahn-ZHAY ! ko-nay-say VOO", "Do you know programmes with the same concepts?"], ["Regardez-vous ce type d'émission ? Pourquoi ?", "ruh-gar-day VOO suh teep day-mee-see-OHN", "Do you watch this kind of programme? Why?"]]}, {"name": "Page 62 — la fiche de casting de Baptiste Leroy", "items": [["CASTING M6 — Émission : …", "kas-TEENG", "the casting card, with the programme left blank"], ["Nom : Baptiste Leroy — Âge : 27 ans — Profession : coiffeur", "ba-TEEST luh-RWAH … kwa-FUR", "Name, age, job: hairdresser"], ["Profil : Je travaille pour le cinéma.", "zhuh tra-VIGH poor luh see-nay-MAH", "I work for the cinema."], ["Mes journées de travail sont longues, mais je rencontre beaucoup d'artistes, c'est génial !", "may zhoor-NAY duh tra-VIGH sohn LOHNG … zhay-nee-AL", "My working days are long, but I meet lots of artists — it's brilliant!"], ["Je suis sociable, je sors beaucoup : j'adore faire la fête avec mes copains,", "zhuh swee so-see-AH-bluh, zhuh sor bo-KOO", "I'm sociable, I go out a lot: I love partying with my mates,"], ["aller dans des bars ou au restaurant.", "a-LAY dahn day BAR oo oh res-to-RAHN", "going to bars or out to eat."], ["J'aime voyager et rencontrer des gens !", "zhem vwa-ya-ZHAY ay rahn-kohn-TRAY day ZHAHN", "I like travelling and meeting people!"], ["Le soir et le week-end, je fais de la musique.", "luh SWAHR ay luh week-END, zhuh fay duh lah mew-ZEEK", "Evenings and weekends I make music."], ["Fan de rock, je joue de la guitare et je chante dans un groupe ;", "fahn duh ROK, zhuh zhoo duh lah gee-TAR", "A rock fan, I play guitar and sing in a band;"], ["mais j'aime aussi la chanson française actuelle.", "may zhem oh-SEE lah shahn-SOHN frahn-SEZ ak-tew-ELL", "but I also like current French song."], ["La musique, c'est ma vie !", "lah mew-ZEEK, say ma VEE", "Music is my life!"], ["Très sportif, je vais à la montagne ou à la mer pour les vacances :", "tray spor-TEEF, zhuh vay a lah mohn-TAN-yuh oo a lah MAIR", "Very sporty, I go to the mountains or the sea on holiday:"], ["je fais du ski, de l'escalade, du parapente et du surf.", "zhuh fay dew SKEE, duh les-ka-LAHD, dew pa-ra-PAHNT ay dew SEURF", "I ski, climb, paraglide and surf."]], "note": "Activity 3 answer: Baptiste is a candidate for <strong>Nouvelle Star</strong> — <em>je joue de la guitare, je chante dans un groupe, la musique c'est ma vie</em>."}, {"name": "Page 62 — la fiche de casting de Victor Caurel", "items": [["Nom : Victor Caurel — Âge : 32 ans — Profession : cuisinier", "veek-TOR ko-RELL … kwee-zee-nee-AY", "Name, age, job: cook"], ["Profil : J'adore mon métier !", "zha-DOR mohn may-tee-AY", "I love my job!"], ["Je travaille avec des grands chefs et j'aime faire plaisir avec ma cuisine.", "zhuh tra-VIGH a-vek day grahn SHEF ay zhem fair play-ZEER", "I work with great chefs and like giving pleasure through my cooking."], ["J'ai une copine mais je vis seul et je suis très indépendant.", "zhay ewn ko-PEEN may zhuh vee SUL", "I have a girlfriend but I live alone and I'm very independent."], ["Je sors peu parce que je n'ai pas beaucoup de temps libre.", "zhuh sor PUH pars kuh zhuh nay pah bo-KOO duh tahn LEE-bruh", "I don't go out much because I don't have much free time."], ["Quand je ne travaille pas, je déteste rester en ville !", "kahn zhuh nuh tra-VIGH PAH, zhuh day-TEST res-TAY ahn VEEL", "When I'm not working I hate staying in town!"], ["J'aime bien aller à la montagne ou à la campagne ; je fais de la randonnée, du vélo.", "zhem bee-AN a-LAY … duh lah rahn-do-NAY, dew vay-LO", "I quite like the mountains or the countryside; I hike and cycle."], ["Le soir, je lis beaucoup.", "luh SWAHR, zhuh lee bo-KOO", "In the evening I read a lot."], ["Pour les vacances, j'adore les voyages sportifs.", "poor lay va-KAHNSS, zha-DOR lay vwa-YAHZH spor-TEEF", "For holidays I love active trips."], ["Quand c'est possible, je vais à l'étranger.", "kahn say po-SEE-bluh, zhuh vay a lay-trahn-ZHAY", "When possible I go abroad."], ["Je marche des kilomètres et je fais de la photo.", "zhuh marsh day kee-lo-MET-ruh ay zhuh fay duh lah fo-TO", "I walk for miles and take photographs."], ["Je rêve de vivre une aventure, loin, très loin…", "zhuh rev duh VEE-vruh ewn a-vahn-TEWR, lwan, tray LWAN", "I dream of living an adventure, far, far away…"]], "note": "Activity 3 answer: Victor fits <strong>Un dîner presque parfait</strong> — he's a cook who loves making people happy with his food. His dream of a far-off adventure could also point to <em>Pékin Express</em>, which is worth arguing in class."}, {"name": "Page 62 — activité 4", "items": [["a) Relisez les fiches et dites dans quel ordre les éléments suivants sont donnés :", "… dahn kel OR-druh", "In what order is the following given?"], ["1. Identité du candidat (nom, âge, profession)", "ee-dahn-tee-TAY dew kahn-dee-DAH", "the candidate's identity — first"], ["2. Vie professionnelle du candidat", "vee pro-fay-see-o-NELL", "working life — second"], ["3. Personnalité et mode de vie du candidat", "pair-so-na-lee-TAY ay mod duh VEE", "personality and lifestyle — third"], ["4. Activités de loisirs du candidat", "ak-tee-vee-TAY duh lwa-ZEER", "leisure activities — fourth"], ["b) Relisez les fiches et repérez pour chaque candidat toutes les informations sur :", "ruh-pay-RAY … toot lay zan-for-ma-see-OHN", "Find for each candidate all the information about:"], ["1. les goûts (ce que la personne aime / n'aime pas)", "lay GOO", "tastes: what they like and dislike"], ["2. les activités de loisirs (activités sportives, culturelles…)", "lay zak-tee-vee-TAY duh lwa-ZEER", "leisure activities, sporting and cultural"]]}, {"name": "Page 63 — Point Langue : parler de ses goûts", "items": [["Complétez.", "kohm-play-TAY", "Complete."], ["♥ J'aime (bien) voyager. / ♥♥ J'adore les voyages.", "zhem bee-AN vwa-ya-ZHAY / zha-DOR lay vwa-YAHZH", "one heart: I like; two hearts: I love"], ["✗ Je n'aime pas rester en ville. / ✗✗ Je déteste la ville.", "zhuh nem pah res-TAY ahn VEEL / zhuh day-TEST lah VEEL", "one cross: I don't like; two crosses: I hate"], ["aimer (bien) – adorer – détester + nom / verbe à l'infinitif", "ay-MAY / a-do-RAY / day-tes-TAY", "all three take either a noun or an infinitive"]], "note": "The whole scale in order: <strong>je déteste → je n'aime pas → j'aime bien → j'aime → j'adore</strong>. All of them are followed either by a noun (<em>les voyages</em>) or by a plain infinitive (<em>voyager</em>) — never by <em>de</em>."}, {"name": "Page 63 — Aide-mémoire : faire au présent", "items": [["je fais", "zhuh FAY", "I do / make"], ["tu fais", "tew FAY", "you do"], ["il / elle fait", "eel FAY", "he / she does"], ["nous faisons", "noo fuh-ZOHN", "we do"], ["vous faites", "voo FET", "you do"], ["ils / elles font", "eel FOHN", "they do"]], "note": "Two irregularities to watch: <strong>nous faisons</strong> is pronounced <em>fuh-ZOHN</em>, not <em>fay-zohn</em> — the only verb where <em>ai</em> sounds like <em>uh</em>. And <strong>vous faites</strong> is one of only three verbs ending in <em>-tes</em>, with <em>vous êtes</em> and <em>vous dites</em>.", "cols": "three"}, {"name": "Page 63 — Point Langue : faire et aller + articles", "items": [["Relisez les deux fiches p. 62 puis complétez avec les articles.", "… pwee kohm-play-TAY a-vek lay zar-TEE-kluh", "Reread the two cards then complete with the articles."], ["ALLER au / à la / à l' + LIEU — Je vais…", "a-LAY oh / a lah / a LUH + lee-UH", "aller + a place"], ["Nom masculin : je vais AU restaurant ; AU cinéma.", "zhuh vay oh res-to-RAHN ; oh see-nay-MAH", "masculine → au"], ["Nom féminin : je vais À LA montagne ; À LA campagne ; À LA mer.", "a lah mohn-TAN-yuh ; a lah kahm-PAN-yuh ; a lah MAIR", "feminine → à la"], ["Nom commençant par une voyelle : je vais À L'étranger.", "a lay-trahn-ZHAY", "vowel → à l'"], ["FAIRE du / de la / de l' + ACTIVITÉ sportive ou culturelle — Je fais…", "fair dew / duh lah / duh LUH", "faire + an activity"], ["Nom masculin : je fais DU vélo ; DU ski.", "zhuh fay dew vay-LO ; dew SKEE", "masculine → du"], ["Nom féminin : je fais DE LA musique ; DE LA photo ; DE LA natation.", "duh lah mew-ZEEK ; duh lah fo-TO ; duh lah na-ta-see-OHN", "feminine → de la"], ["Nom commençant par une voyelle : je fais DE L'escalade ; DE L'aquarelle.", "duh les-ka-LAHD ; duh la-kwa-RELL", "vowel → de l'"]], "note": "The clean split: where you <strong>go</strong> takes <em>à</em>; what you <strong>do</strong> takes <em>de</em>. Get the gender right and both follow automatically.", "cols": "two"}, {"name": "Page 63 — activités 5 et 6", "items": [["Activité 5 : Échangez ! Par deux, comparez vos goûts.", "ay-shahn-ZHAY ! par DUH, kohm-pa-RAY vo GOO", "Talk together! In pairs, compare your tastes."], ["Qu'est-ce que vous adorez / détestez ?", "kes-kuh voo za-do-RAY / day-tes-TAY", "What do you love / hate?"], ["Dessinez puis montrez à votre voisin(e). Il/Elle devine et vous pose des questions.", "day-see-NAY pwee mohn-TRAY … eel duh-VEEN", "Draw it, show your neighbour, who guesses and asks questions."], ["Exemple : Tu aimes la mer ? le soleil ? les vacances ? → Oui, j'adore la mer pour les vacances !", "tew em lah MAIR ? luh so-LAY ?", "the worked example"], ["Activité 6 : Échangez !", "ay-shahn-ZHAY", "Talk together!"], ["1. Faites des groupes de 4 à 6 personnes. Chaque personne dit quel(s) sport(s) elle pratique.", "… shak pair-SUN dee kel SPOR el pra-TEEK", "In groups of 4–6, each person says which sports they do."], ["Le groupe sélectionne son « champion » ou sa « championne », c'est-à-dire la personne qui pratique le plus grand nombre de sports.", "… say-ta-DEER lah pair-SUN kee pra-TEEK luh plew grahn NOHM-bruh", "The group picks its champion — the person who does the most sports."], ["2. Les champions sélectionnés miment devant la classe les sports pratiqués. Les autres groupes devinent les sports.", "… MEEM duh-VAHN lah KLAHSS", "The champions mime their sports; the other groups guess."]]}, {"name": "Page 63 — Point Culture : les Français et le sport", "items": [["Observez cet extrait de l'enquête « Les Français et le sport ».", "ob-sair-VAY set eks-TRAH duh lahn-KET", "Look at this extract from the survey 'The French and sport'."], ["Comparez les résultats avec le profil sportif de la classe.", "kohm-pa-RAY lay ray-zewl-TAH", "Compare the results with your class's sporting profile."], ["LA FRÉQUENCE DE LA PRATIQUE SPORTIVE SELON L'ÂGE", "lah fray-KAHNSS duh lah pra-TEEK spor-TEEV suh-LOHN LAHZH", "HOW OFTEN PEOPLE PLAY SPORT, BY AGE"], ["Actuellement, pratiquez-vous un sport (de façon personnelle, dans un club, une association ou une salle) ?", "ak-tew-EL-mahn, pra-tee-kay VOO uhn SPOR", "Do you currently play a sport (on your own, in a club, an association or a gym)?"], ["15-24 ans : 64 % sportif régulier · 13 % occasionnel · 23 % non sportif", "swa-sahnt-KATR poor SAHN", "the youngest group is the most active"], ["25-34 ans : 44 % · 12 % · 44 %", "ka-rahnt-KATR", "25–34"], ["35-49 ans : 40 % · 11 % · 49 %", "ka-RAHNT", "35–49"], ["50-64 ans : 41 % · 9 % · 50 %", "ka-rahnt-ay-UHN", "50–64"], ["65-74 ans : 45 % · 4 % · 50 %", "ka-rahnt-SANK", "65–74"], ["75 ans et plus : 29 % · 4 % · 67 %", "van-NUHF", "75 and over"], ["Moyenne nationale : sportif régulier 44 % · sportif occasionnel 10 % · non sportif 46 %", "mwa-YEN na-see-o-NAL", "the national average"], ["Enquête TNS-Sofres", "ahn-KET", "the polling institute credited"], ["sportif régulier / sportif occasionnel / non sportif", "spor-TEEF ray-gew-lee-AY / o-ka-zee-o-NELL / nohn spor-TEEF", "regular / occasional / non-sporty"]], "note": "Read the striking figure: <strong>64%</strong> of 15–24s play sport regularly, against <strong>29%</strong> of the over-75s — and nearly half of all French people, 46%, do none at all.", "cols": "two"}, {"name": "Page 63 — activité 7", "items": [["Par deux, imaginez un(e) candidat(e) pour la troisième émission de M6. Écrivez sa fiche pour le casting.", "… ay-kree-VAY sa FEESH poor luh kas-TEENG", "In pairs, invent a candidate for the third M6 programme and write their casting card."]], "note": "The third programme is <em>Pékin Express</em> — so your invented candidate should love adventure, travel and sport, following the four-part order from activity 4."}, {"name": "Page 64 — le témoignage de TéléJournal", "items": [["Parler de sa profession", "par-LAY duh sa pro-fay-see-OHN", "Talking about your job"], ["TéléJournal — Les actus des chaînes", "tay-lay-zhoor-NAL — lay zak-TEW day SHEN", "TV guide — Channel news"], ["Tout sur les nouveaux candidats !", "too sewr lay noo-VO kahn-dee-DAH", "All about the new contestants!"], ["Témoignage :", "tay-mwa-NYAHZH", "Testimony:"], ["« Je travaille beaucoup : le soir, le week-end… C'est difficile,", "zhuh tra-VIGH bo-KOO … say dee-fee-SEEL", "I work a lot: evenings, weekends… It's hard,"], ["mais ma profession, c'est une passion !", "may ma pro-fay-see-OHN, set ewn pa-see-OHN", "but my job is a passion!"], ["J'imagine des recettes nouvelles, c'est créatif !", "zhee-ma-ZHEEN day ruh-SET noo-VELL, say kray-a-TEEF", "I invent new recipes — it's creative!"], ["Mais, quand je suis en vacances, je ne cuisine pas.", "may, kahn zhuh swee zahn va-KAHNSS, zhuh nuh kwee-ZEEN pah", "But when I'm on holiday, I don't cook."], ["Nous allons au restaurant avec ma copine et nous découvrons les spécialités des autres chefs. »", "noo za-LOHN oh res-to-RAHN … noo day-koo-VROHN lay spay-see-a-lee-TAY day ZO-truh SHEF", "We eat out with my girlfriend and discover other chefs' specialities."]]}, {"name": "Page 64 — activité 8 : les réponses", "items": [["a) Lisez le témoignage et dites qui écrit : Baptiste ou Victor ? Justifiez votre réponse.", "… kee ay-KREE", "Who wrote it: Baptiste or Victor? Justify."], ["→ C'est VICTOR : il parle de recettes, de cuisine, de chefs et de sa copine.", "say veek-TOR", "It's Victor — recipes, cooking, chefs, and his girlfriend."], ["b) Relevez les aspects positifs et les aspects négatifs de sa profession.", "ruh-luh-VAY lay zas-PAY po-zee-TEEF ay nay-ga-TEEF", "Note the positive and negative aspects of his job."], ["Aspects positifs : c'est une passion ; j'imagine des recettes nouvelles ; c'est créatif ; je travaille avec des grands chefs ; j'aime faire plaisir.", "as-PAY po-zee-TEEF", "the positives"], ["Aspects négatifs : je travaille beaucoup, le soir, le week-end ; c'est difficile ; je n'ai pas beaucoup de temps libre ; je sors peu.", "as-PAY nay-ga-TEEF", "the negatives"]]}, {"name": "Page 64 — activité 9 : les neuf photos", "items": [["a) Écoutez les personnes qui parlent de leur profession. Associez les photos et les personnes.", "… a-so-see-AY lay fo-TO ay lay pair-SUN", "Listen to the people talking about their jobs. Match photos to people."], ["b) Pour chaque photo, trouvez dans la liste suivante le nom de la profession au masculin et au féminin.", "… oh mas-kew-LAN ay oh fay-mee-NAN", "For each photo find the job name in masculine and feminine."], ["photo a : une femme en blouse blanche devant des médicaments → une PHARMACIENNE", "far-ma-see-EN", "a pharmacist, female"], ["photo b : une femme avec un mètre-ruban qui ajuste un vêtement → une COUTURIÈRE", "koo-tew-ree-AIR", "a dressmaker, female"], ["photo c : un homme qui sort des pains d'un four → un BOULANGER", "boo-lahn-ZHAY", "a baker, male"], ["photo d : une femme avec un appareil photo sur trépied → une PHOTOGRAPHE", "fo-to-GRAF", "a photographer, female"], ["photo e : un homme avec un stéthoscope qui examine un chien → un VÉTÉRINAIRE", "vay-tay-ree-NAIR", "a vet, male"], ["photo f : un homme qui parle devant une caméra et une perche à micro → un JOURNALISTE", "zhoor-na-LEEST", "a journalist, male"], ["photo g : une jeune femme qui tient une caméra → une RÉALISATRICE", "ray-a-lee-za-TREESS", "a film director, female"], ["photo h : une femme qui présente des lunettes devant un tableau de vision → une OPTICIENNE", "op-tee-see-EN", "an optician, female"], ["photo i : une personne qui coiffe une mariée → une COIFFEUSE", "kwa-FUHZ", "a hairdresser, female"]]}, {"name": "Page 64 — la liste complète des professions", "items": [["boulanger / boulangère", "boo-lahn-ZHAY / boo-lahn-ZHAIR", "baker"], ["opticien / opticienne", "op-tee-see-AN / op-tee-see-EN", "optician"], ["journaliste / journaliste", "zhoor-na-LEEST", "journalist — no change"], ["vétérinaire / vétérinaire", "vay-tay-ree-NAIR", "vet — no change"], ["coiffeur / coiffeuse", "kwa-FUR / kwa-FUHZ", "hairdresser"], ["couturier / couturière", "koo-tew-ree-AY / koo-tew-ree-AIR", "dressmaker, fashion designer"], ["pharmacien / pharmacienne", "far-ma-see-AN / far-ma-see-EN", "pharmacist"], ["photographe / photographe", "fo-to-GRAF", "photographer — no change"], ["réalisateur / réalisatrice", "ray-a-lee-za-TUR / ray-a-lee-za-TREESS", "film director"]], "note": "The list on the page gives all eighteen forms jumbled together — these are the nine pairs sorted out.", "cols": "two"}, {"name": "Page 65 — Point Langue : masculin et féminin des professions", "items": [["a) Observez le tableau.", "ob-sair-VAY luh ta-BLO", "Look at the table."], ["-ien → -ienne : un pharmacien → une pharmacienne", "far-ma-see-AN → far-ma-see-EN", "pattern 1"], ["-er → -ère : un boulanger → une boulangère", "boo-lahn-ZHAY → boo-lahn-ZHAIR", "pattern 2"], ["-eur → -euse : un coiffeur → une coiffeuse", "kwa-FUR → kwa-FUHZ", "pattern 3"], ["-teur → -trice : un réalisateur → une réalisatrice", "ray-a-lee-za-TUR → ray-a-lee-za-TREESS", "pattern 4"], ["-iste → -iste : un journaliste → une journaliste", "zhoor-na-LEEST", "pattern 5 — no change"], ["-e → -e : un vétérinaire → une vétérinaire", "vay-tay-ree-NAIR", "pattern 6 — no change"], ["* Attention ! chanteur → chanteuse", "shahn-TUR → shahn-TUHZ", "the exception: not chantrice"], ["b) Trouvez dans l'activité 9 un exemple de nom de profession pour chaque catégorie.", "troo-VAY … poor shak ka-tay-go-REE", "Find an example from activity 9 for each category."]], "note": "The starred trap: <strong>-teur</strong> normally gives <strong>-trice</strong> (<em>réalisateur → réalisatrice</em>), but <em>chanteur</em> follows the <strong>-eur → -euse</strong> pattern instead. Both patterns exist; you learn which verb takes which."}, {"name": "Page 65 — activités 10, 11, 12 et 13", "items": [["Activité 10 : En petits groupes. Pour chaque lettre de l'alphabet, trouvez un maximum de mots en relation avec les professions et le travail.", "poor shak LET-ruh duh lal-fa-BAY", "For each letter of the alphabet, find as many job and work words as you can."], ["Vous avez 5 minutes ! Puis comparez avec les autres groupes.", "voo za-VAY sank mee-NEWT", "You have 5 minutes! Then compare with the other groups."], ["Activité 11 Phonétique : On parle d'un homme ou d'une femme ? Écoutez et répondez.", "ohn parl duh NOM oo dewn FAM", "Are we talking about a man or a woman? Listen and answer."], ["Exemple : 1 → femme", "fam", "the worked example"], ["Activité 12 : Parlez de votre profession ou de celle d'un(e) ami(e) / personne de votre famille. La classe devine la profession.", "… lah klahss duh-VEEN", "Talk about your job or a friend's or relative's. The class guesses."], ["Activité 13 : Échangez ! Dites quelle est / quelles sont pour vous la/les profession(s) idéale(s) et expliquez pourquoi.", "… lah pro-fay-see-OHN ee-day-AL", "Say which job or jobs are ideal for you, and why."]], "note": "Activity 11 is the listening version of the Point Langue: since <em>pharmacien</em> and <em>pharmacienne</em> sound different, the ending alone tells you the person's gender."}, {"name": "Page 65 — les pictogrammes de métiers", "items": [["un serveur / une serveuse", "uhn sair-VUR / ewn sair-VUHZ", "waiter / waitress"], ["un homme d'affaires / une femme d'affaires", "uh NOM da-FAIR", "businessman / businesswoman"], ["un peintre en bâtiment", "uhn PAN-truh ahn ba-tee-MAHN", "a decorator"], ["un professeur / une professeure", "uhn pro-fay-SUR", "a teacher"], ["un cuisinier / une cuisinière", "uhn kwee-zee-nee-AY", "a cook"], ["une infirmière / un infirmier", "ew nan-feer-mee-AIR", "a nurse"], ["un serveur en costume", "uhn sair-VUR ahn kos-TEWM", "a waiter in uniform"], ["un cycliste / une cycliste", "uhn see-KLEEST", "a cyclist"], ["un médecin", "uhn mayd-SAN", "a doctor"], ["un scientifique", "uhn see-ahn-tee-FEEK", "a scientist"], ["un peintre / une peintre", "uhn PAN-truh", "a painter"], ["un employé / une employée", "uh nahm-plwa-YAY", "an employee"]], "note": "The page prints a grid of coloured job pictograms with no captions — these are the trades they show, for activity 13.", "cols": "two"}, {"name": "Page 65 — activité 14 et le projet", "items": [["Vous êtes candidat à l'une des trois émissions de M6. Vous envoyez votre fiche pour le casting.", "voo zet kahn-dee-DAH a lewn day trwah zay-mee-see-OHN", "You're a candidate for one of the three M6 programmes. Send in your casting card."], ["Vous donnez des précisions sur vos activités professionnelles", "voo do-NAY day pray-see-zee-OHN sewr vo zak-tee-vee-TAY pro-fay-see-o-NELL", "Give details of your working life"], ["et vous donnez des indications sur votre personnalité et/ou votre mode de vie.", "… sewr VOT-ruh pair-so-na-lee-TAY ay/oo VOT-ruh mod duh VEE", "and indications about your personality and lifestyle."], ["Vous parlez de vos goûts et de vos activités de loisirs.", "voo par-LAY duh vo GOO ay duh vo zak-tee-vee-TAY duh lwa-ZEER", "Talk about your tastes and leisure activities."], ["CASTING M6 — Émission : … Nom : … Âge : … Profession : … Profil : …", "kas-TEENG", "the blank casting card to fill in"], ["Projet Dossier 3 — Tâche leçon 1 : Créer des personnages de fiction.", "kray-AY day pair-so-NAHZH duh feek-see-OHN", "Task: create fictional characters."]], "note": "The card follows exactly the four-part order you identified in activity 4: identity, working life, personality and lifestyle, leisure activities."}, {"name": "Le vocabulaire de la leçon", "items": [["une émission", "ew nay-mee-see-OHN", "a TV programme"], ["une chaîne", "ewn SHEN", "a channel"], ["la téléréalité", "lah tay-lay-ray-a-lee-TAY", "reality TV"], ["un candidat / une candidate", "uhn kahn-dee-DAH", "a contestant"], ["un casting", "uhn kas-TEENG", "an audition"], ["un témoignage", "uhn tay-mwa-NYAHZH", "a personal account"], ["une fiche", "ewn FEESH", "a form, a card"], ["un talent", "uhn ta-LAHN", "a talent"], ["une passion", "ewn pa-see-OHN", "a passion"], ["un métier", "uhn may-tee-AY", "a trade, a job"], ["une profession", "ewn pro-fay-see-OHN", "a profession"], ["un loisir", "uhn lwa-ZEER", "a leisure activity"], ["le temps libre", "luh tahn LEE-bruh", "free time"], ["le mode de vie", "luh mod duh VEE", "lifestyle"], ["la personnalité", "lah pair-so-na-lee-TAY", "personality"], ["une recette", "ewn ruh-SET", "a recipe"], ["une spécialité", "ewn spay-see-a-lee-TAY", "a speciality"], ["un chef", "uhn SHEF", "a chef"], ["une copine / un copain", "ewn ko-PEEN / uhn ko-PAN", "girlfriend / boyfriend, mate"], ["sociable", "so-see-AH-bluh", "sociable"], ["sportif / sportive", "spor-TEEF / spor-TEEV", "sporty"], ["créatif / créative", "kray-a-TEEF / kray-a-TEEV", "creative"], ["indépendant / indépendante", "an-day-pahn-DAHN / -DAHNT", "independent"], ["génial / géniale", "zhay-nee-AL", "brilliant"], ["difficile", "dee-fee-SEEL", "difficult"], ["faire la fête", "fair lah FET", "to party"], ["faire plaisir", "fair play-ZEER", "to give pleasure"], ["rencontrer des gens", "rahn-kohn-TRAY day ZHAHN", "to meet people"], ["à l'étranger", "a lay-trahn-ZHAY", "abroad"], ["une aventure", "ew na-vahn-TEWR", "an adventure"], ["gagner", "ga-NYAY", "to win, to earn"], ["le gagnant / la gagnante", "luh ga-NYAHN", "the winner"], ["un contrat", "uhn kohn-TRAH", "a contract"], ["une maison de disques", "ewn may-ZOHN duh DEESK", "a record label"], ["enregistrer", "ahn-ruh-zhees-TRAY", "to record"], ["une équipe", "ewn ay-KEEP", "a team"], ["une étape", "ew nay-TAP", "a stage, a leg"], ["un hôte", "uh NOT", "a host"], ["deviner", "duh-vee-NAY", "to guess"], ["mimer", "mee-MAY", "to mime"], ["pratiquer un sport", "pra-tee-KAY uhn SPOR", "to play a sport"]], "cols": "two"}]}, {"id": "ae-d3l2", "label": "Dossier 3 · Leçon 2", "name": "Solo ou duo ?", "summary": "Pages 66–69, complete. The singles evening poster, all four personal ads word for word, adjective agreement written and spoken, the eight stressed pronouns, the Mars/Venus survey with all ten characteristics, and plural adjectives with their three exceptions.", "art": "toniques", "bookpages": ["p066", "p067", "p068", "p069"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 2, in page order.", "tracks": [{"n": 93, "label": "p.67 Point Langue b — masculin et féminin à l'oral"}, {"n": 94, "label": "p.67 act. 5 — phonétique, homme ou femme ?"}, {"n": 95, "label": "p.67 act. 6 — qui parle avec qui ?"}, {"n": 96, "label": "p.68 act. 11 & 12 — le dialogue de Julie"}]}, {"name": "Page 66 — l'affiche de la soirée", "items": [["Solo ou duo ?", "so-LO oo dew-O", "Solo or duo?"], ["Parler de soi", "par-LAY duh SWAH", "Talking about yourself"], ["SOIRÉE DES CÉLIBATAIRES", "swa-RAY day say-lee-ba-TAIR", "SINGLES EVENING"], ["JEUDI 12 FÉVRIER DE 19 H À 22 H", "zhuh-DEE dooz fay-vree-AY duh deez-nuh VUR a van-duh ZUR", "Thursday 12 February, 7pm to 10pm"], ["AUX GALERIES LAFAYETTE HAUSSMANN", "oh gal-REE la-fa-YETT os-MAN", "at the Galeries Lafayette Haussmann store"], ["TROUVEZ VOTRE VALENTIN(E)", "troo-VAY VOT-ruh va-lahn-TAN", "FIND YOUR VALENTINE"], ["Speed Dating, consultations gratuites de voyantes", "kohn-sewl-ta-see-OHN gra-TWEET duh vwa-YAHNT", "speed dating, free fortune-teller consultations"], ["Maquillage gratuit, cours de danse", "ma-kee-YAHZH gra-TWEE, koor duh DAHNSS", "free make-up, dance lessons"], ["Grand jeu du cœur, avec des centaines de cadeaux à gagner, et beaucoup d'autres surprises…", "grahn zhuh dew KUR … day sahn-TEN duh ka-DO", "the big heart game, hundreds of prizes to win, and many other surprises"], ["Remise immédiate de 15 € à partir de 120 € d'achats.", "ruh-MEEZ ee-may-dee-AT duh kanz uh-RO a par-TEER duh sahn-van uh-RO da-SHA", "€15 off immediately when you spend €120."], ["Activité 1 : Observez l'affiche et relevez les informations suivantes : date, lieu et objectif de la soirée.", "… dat, lee-UH ay ob-zhek-TEEF", "Note the date, place and purpose of the evening."]], "note": "<strong>Date :</strong> jeudi 12 février, 19 h–22 h · <strong>Lieu :</strong> aux Galeries Lafayette Haussmann, Paris · <strong>Objectif :</strong> trouver son Valentin(e) — meeting a partner before Valentine's Day. The poster shows a red heart pierced by an arrow."}, {"name": "Page 66 — activités 2 et 3", "items": [["Activité 2 : Lisez les annonces affichées à l'entrée de la soirée des célibataires.", "lee-ZAY lay za-NOHNSS a-fee-SHAY a lahn-TRAY", "Read the ads displayed at the entrance."], ["Puis choisissez dans la liste suivante le type d'informations données.", "… luh teep dan-for-ma-see-OHN do-NAY", "Then choose from the list which kinds of information are given."], ["prénom ✓", "pray-NOHN", "first name — given"], ["numéro de téléphone ✓", "new-may-RO duh tay-lay-FON", "phone number — given"], ["adresse mail ✗", "a-DRESS mail", "email — not given"], ["âge ✓", "AHZH", "age — given"], ["date de naissance ✗", "dat duh nay-SAHNSS", "date of birth — not given"], ["description physique ✓", "des-kreep-see-OHN fee-ZEEK", "physical description — given"], ["caractère ✓", "ka-rak-TAIR", "character — given"], ["profession ✓", "pro-fay-see-OHN", "job — given"], ["goûts et loisirs ✓", "GOO ay lwa-ZEER", "tastes and hobbies — given"], ["situation familiale ✗", "see-tew-a-see-OHN fa-mee-lee-AL", "family situation — not given"], ["type de relation recherchée (mariage ou autre) ✓", "teep duh ruh-la-see-OHN ruh-shair-SHAY", "kind of relationship sought — given"], ["Activité 3 : Mariez les célibataires ! À partir des caractéristiques données, imaginez quels couples vont se former. Justifiez votre réponse.", "ma-ree-AY lay say-lee-ba-TAIR", "Match up the singles! From the characteristics given, imagine which couples will form."]]}, {"name": "Page 66 — l'annonce d'Alice", "items": [["MOI : Alice, 35 ans — 06 19 48 57 76", "a-LEESS, trahnt-sank AHN", "Me: Alice, 35"], ["Assez grande (1 m 70), élégante.", "a-SAY GRAHND (uhn MET-ruh swa-SAHNT-dees), ay-lay-GAHNT", "Fairly tall (1m70), elegant."], ["Bien dans mon corps et dans ma tête.", "bee-AN dahn mohn KOR ay dahn ma TET", "Comfortable in my body and my mind."], ["Je suis architecte et j'adore mon travail.", "zhuh swee zar-shee-TEKT ay zha-DOR mohn tra-VIGH", "I'm an architect and I love my work."], ["Je suis très indépendante mais je suis rarement seule…", "… tray zan-day-pahn-DAHNT may zhuh swee rar-MAHN SUL", "I'm very independent but rarely alone…"], ["Je suis sagittaire.", "zhuh swee sa-zhee-TAIR", "I'm a Sagittarius."], ["Je voyage beaucoup. Je sors avec mes amis, je danse.", "zhuh vwa-YAHZH bo-KOO. zhuh sor a-vek may za-MEE, zhuh DAHNSS", "I travel a lot. I go out with my friends, I dance."], ["J'adore le cinéma. J'ai horreur de la routine !", "zha-DOR luh see-nay-MAH. zhay o-RUR duh lah roo-TEEN", "I love cinema. I loathe routine!"], ["LUI : Homme 42 ans maximum, pas petit, libre, intelligent, cultivé.", "OM ka-rahnt-DUH zahn mak-see-MOM, pah puh-TEE, LEE-bruh", "Him: man, 42 max, not short, free, intelligent, cultured."], ["Une soirée et peut-être plus…", "ewn swa-RAY ay puh-TET-ruh PLEW", "An evening and maybe more…"]]}, {"name": "Page 66 — l'annonce de Mélanie", "items": [["MOI : Mélanie, 32 ans — 06 76 36 27 98", "may-la-NEE, trahnt-DUH zahn", "Me: Mélanie, 32"], ["1 m 65, un peu ronde, décontractée.", "uhn MET-ruh swa-sahnt-SANK, uhn puh ROHND, day-kohn-trak-TAY", "1m65, a little plump, relaxed."], ["Artiste, créative et généreuse.", "ar-TEEST, kray-a-TEEV ay zhay-nay-RUHZ", "Artistic, creative and generous."], ["Je suis romantique et je voudrais rencontrer l'homme de ma vie.", "… ay zhuh voo-DREH rahn-kohn-TRAY LOM duh ma VEE", "I'm romantic and I'd like to meet the man of my life."], ["Je suis douce et calme. J'aime les musées, je m'intéresse à l'art et à la musique.", "zhuh swee DOOSS ay KALM … zhuh man-tay-RESS a LAR", "I'm gentle and calm. I like museums, I'm interested in art and music."], ["Je suis une excellente cuisinière.", "zhuh swee zewn ek-say-LAHNT kwee-zee-nee-AIR", "I'm an excellent cook."], ["Le soir, je déteste regarder la télévision, je préfère sortir… J'ai deux chats.", "luh SWAHR, zhuh day-TEST … zhay duh SHA", "In the evening I hate watching TV, I prefer going out… I have two cats."], ["ELLE : Homme 40 ans maximum, grand, mince, élégant, cultivé. Pour fonder une famille.", "OM ka-RAHNT ahn … poor fohn-DAY ewn fa-MEE", "Her: man, 40 max, tall, slim, elegant, cultured. To start a family."]]}, {"name": "Page 66 — l'annonce de Pietro", "items": [["MOI : Pietro, 35 ans — 06 88 49 61 39", "pee-ay-TRO, trahnt-sank AHN", "Me: Pietro, 35"], ["Pas très grand, pas très mince.", "pah tray GRAHN, pah tray MANSS", "Not very tall, not very slim."], ["Je suis dessinateur. Je suis timide, mais j'ai beaucoup d'amis.", "zhuh swee day-see-na-TUR. zhuh swee tee-MEED", "I'm an illustrator. I'm shy, but I have lots of friends."], ["J'aime sortir. Je suis passionné par la lecture et la musique.", "zhem sor-TEER. … pa-see-o-NAY par lah lek-TEWR", "I like going out. I'm passionate about reading and music."], ["J'aime la bonne cuisine et je fais d'excellents spaghettis (je suis d'origine italienne).", "… zhuh fay dek-say-LAHN spa-gay-TEE", "I like good food and make excellent spaghetti (I'm of Italian origin)."], ["J'aime les animaux. Je n'aime pas les femmes autoritaires.", "zhem lay za-nee-MO. zhuh nem pah lay fam oh-to-ree-TAIR", "I like animals. I don't like bossy women."], ["ELLE : Jeune femme 24-34 ans, douce, intelligente, romantique. Pour une belle histoire d'amour.", "zhuhn FAM … poor ewn bell ees-TWAHR da-MOOR", "Her: young woman 24–34, gentle, intelligent, romantic. For a beautiful love story."]]}, {"name": "Page 66 — l'annonce de David", "items": [["MOI : David, 39 ans — 06 34 59 61 28", "da-VEED, trahnt-nuh VAHN", "Me: David, 39"], ["Grand, mince, sportif.", "GRAHN, MANSS, spor-TEEF", "Tall, slim, sporty."], ["Professeur de salsa, je joue de la guitare et j'adore la musique latine.", "pro-fay-SUR duh sal-SAH … lah mew-ZEEK la-TEEN", "Salsa teacher, I play guitar and love Latin music."], ["J'aime beaucoup lire. Je suis optimiste, je vois la vie en rose…", "zhem bo-KOO LEER. … zhuh vwah lah vee ahn ROZ", "I love reading. I'm optimistic, I see life through rose-tinted glasses…"], ["J'aime les voyages, je visite toujours des pays différents.", "zhem lay vwa-YAHZH … day pay-EE dee-fay-RAHN", "I like travel, I always visit different countries."], ["Je suis allergique aux chats et je ne fume pas.", "zhuh swee za-lair-ZHEEK oh SHA ay zhuh nuh fewm PAH", "I'm allergic to cats and I don't smoke."], ["ELLE : Femme 30-38 ans, dynamique, cultivée, positive.", "FAM … dee-na-MEEK, kewl-tee-VAY, po-zee-TEEV", "Her: woman 30–38, dynamic, cultured, positive."], ["Pour partager sorties, voyages, soleil et champagne.", "poor par-ta-ZHAY sor-TEE, vwa-YAHZH, so-LAY ay shahm-PAN-yuh", "To share outings, travel, sunshine and champagne."]], "note": "<strong>Activité 3 — les couples possibles :</strong> Mélanie wants a tall, slim, cultured man to start a family, and David is tall, slim and cultured — but she has <em>two cats</em> and he is <em>allergic to cats</em>. Alice and Pietro is the other pairing: she wants an intelligent, cultured man who isn't short; he wants a gentle, intelligent, romantic woman — though he dislikes bossy women and she is very independent. The exercise is designed so that no pair is perfect."}, {"name": "Page 67 — Aide-mémoire : goûts et centres d'intérêt", "items": [["Parler de ses goûts et de ses centres d'intérêt", "par-LAY duh say GOO ay duh say sahn-truh dan-tay-RAY", "Talking about your tastes and interests"], ["J'aime / J'adore mon travail.", "zhem / zha-DOR mohn tra-VIGH", "I like / love my work."], ["Je suis passionné(e) par la lecture.", "zhuh swee pa-see-o-NAY par lah lek-TEWR", "I'm passionate about reading."], ["Je m'intéresse à l'art.", "zhuh man-tay-RESS a LAR", "I'm interested in art."], ["Je n'aime pas / Je déteste la télévision.", "zhuh nem pah / zhuh day-TEST lah tay-lay-vee-zee-OHN", "I don't like / I hate television."], ["J'ai horreur de la routine.", "zhay o-RUR duh lah roo-TEEN", "I loathe routine."]], "note": "Watch the three different prepositions: <strong>passionné PAR</strong>, <strong>je m'intéresse À</strong>, <strong>j'ai horreur DE</strong>. Each is fixed and must be learnt with the phrase."}, {"name": "Page 67 — activité 4 : phrases équivalentes", "items": [["a) Associez les phrases de sens équivalent.", "a-so-see-AY lay frahz duh sahns ay-kee-va-LAHN", "Match the sentences with the same meaning."], ["1. Je suis timide. → c. Je ne communique pas facilement.", "zhuh nuh ko-mew-NEEK pah fa-seel-MAHN", "I'm shy → I don't communicate easily."], ["2. Je suis généreuse. → e. Je donne beaucoup aux autres.", "zhuh dun bo-KOO oh ZO-truh", "I'm generous → I give a lot to others."], ["3. Je suis indépendante. → d. J'aime être libre.", "zhem EH-truh LEE-bruh", "I'm independent → I like being free."], ["4. J'ai horreur de la routine. → a. Je déteste la monotonie.", "zhuh day-TEST lah mo-no-to-NEE", "I loathe routine → I hate monotony."], ["5. Je suis passionné par la lecture. → b. J'adore lire.", "zha-DOR LEER", "I'm passionate about reading → I love to read."], ["b) Relisez les quatre annonces p. 66 et trouvez les mots pour caractériser une personne :", "… poor ka-rak-tay-ree-ZAY ewn pair-SUN", "Find the words used to describe a person:"], ["1. physiquement : grand(e), petit(e), mince, rond(e), élégant(e), assez grande, 1 m 70", "fee-zeek-MAHN", "physically"], ["2. psychologiquement : timide, généreuse, indépendante, romantique, douce, calme, décontractée, sociable, optimiste, dynamique, cultivé(e), autoritaire, positive, créative, sportif", "psee-ko-lo-zheek-MAHN", "psychologically"]], "note": "Answers: <strong>1→c · 2→e · 3→d · 4→a · 5→b</strong>."}, {"name": "Page 67 — Point Langue : masculin et féminin des adjectifs", "items": [["a) Observez le tableau. Relisez les annonces p. 66 pour compléter les colonnes Masculin, Féminin et À l'écrit.", "… lay ko-LUN", "Complete the Masculine, Feminine and Written columns."], ["b) Écoutez et dites si les formes du masculin et du féminin sont identiques à l'oral.", "… ee-dahn-TEEK a lo-RAL", "Say whether the masculine and feminine sound the same."], ["intelligent → intelligente : à l'écrit + -e · à l'oral DIFFÉRENT", "an-tay-lee-ZHAHN → an-tay-lee-ZHAHNT", "the t wakes up"], ["grand → grande : + -e · DIFFÉRENT", "GRAHN → GRAHND", "the d wakes up"], ["sportif → sportive : -f devient -ve · DIFFÉRENT", "spor-TEEF → spor-TEEV", "f becomes v"], ["généreux → généreuse : -x devient -se · DIFFÉRENT", "zhay-nay-RUH → zhay-nay-RUHZ", "x becomes s, sounded z"], ["cultivé → cultivée : + -e · IDENTIQUE", "kewl-tee-VAY", "already a vowel — no change in sound"], ["libre → libre : rien · IDENTIQUE", "LEE-bruh", "already ends in -e"], ["romantique → romantique : rien · IDENTIQUE", "ro-mahn-TEEK", "already ends in -e"]], "note": "The rule underneath: adding <strong>-e</strong> makes a silent final consonant audible, so those pairs sound different. Where the masculine already ends in a vowel sound, nothing changes."}, {"name": "Page 67 — activité 5 et Point Langue : les pronoms toniques", "items": [["Activité 5 Phonétique : On parle d'un homme ou d'une femme ? Écoutez et répondez. Exemple : 1 → femme", "ohn parl duh NOM oo dewn FAM", "Man or woman? Listen and answer."], ["Les pronoms toniques pour parler des personnes", "lay pro-NOHN to-NEEK", "Stressed pronouns for talking about people"], ["Complétez les phrases avec toi, moi, elles, nous, elle, vous.", "kohm-play-TAY lay FRAZ", "Complete with these pronouns."], ["MOI, je suis lion.", "MWAH, zhuh swee lee-OHN", "Me, I'm a Leo."], ["TOI aussi, tu es artiste ?", "TWAH oh-SEE, tew ay zar-TEEST", "You too, are you a
