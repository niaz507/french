lay"], ["une fête", "ewn FET", "a festival, party"], ["francophone", "frahn-ko-FON", "French-speaking"], ["la francophonie", "lah frahn-ko-fo-NEE", "the French-speaking world"], ["le monde", "luh MOHND", "the world"], ["habiter", "a-bee-TAY", "to live (somewhere)"], ["vivre", "VEE-vruh", "to live"], ["naître — je suis né(e)", "NEH-truh — zhuh swee NAY", "to be born — I was born"], ["arriver", "a-ree-VAY", "to arrive"], ["travailler", "tra-va-YAY", "to work"], ["un architecte", "uh nar-shee-TEKT", "an architect"]]}]}, {"id": "ae-d1-carnet", "label": "Dossier 1 · Carnet de voyage", "name": "La France en Europe", "summary": "Pages 38–39. France's neighbours and seas, fourteen symbols of Europe to place, and the country in six numbers.", "art": "voisins", "groups": [{"name": "L'Hexagone", "items": [["« L'Hexagone » est un autre nom pour « la France ».", "lek-sa-GON ay tuh-NOH-truh nohn poor lah FRAHNSS", "“The Hexagon” is another name for France."], ["un hexagone", "uh nek-sa-GON", "a hexagon — France has six roughly straight sides"], ["Repérez la France sur la carte d'Europe.", "ruh-pay-RAY lah FRAHNSS sewr lah kart duh-ROP", "Find France on the map of Europe."], ["Testez vos connaissances en géographie.", "tes-TAY vo ko-nay-SAHNSS ahn zhay-o-gra-FEE", "Test your geography knowledge."]]}, {"name": "Activité 2a — les pays voisins de la France", "note": "<strong>Six of the listed countries border France:</strong> l'Allemagne, la Belgique, l'Espagne, le Luxembourg, l'Italie, la Suisse.<br><br>The others do <em>not</em> touch France: l'Irlande, la Pologne, le Portugal, la Suède, les Pays-Bas, l'Autriche. (France also borders Monaco and Andorra, which aren't on the list.)", "cols": "two", "items": [["l'Allemagne", "lal-MAHN-yuh", "Germany — voisin ✓"], ["la Belgique", "lah bel-ZHEEK", "Belgium — voisin ✓"], ["l'Espagne", "les-PAN-yuh", "Spain — voisin ✓"], ["le Luxembourg", "luh lewk-sahm-BOOR", "Luxembourg — voisin ✓"], ["l'Italie", "lee-ta-LEE", "Italy — voisin ✓"], ["la Suisse", "lah SWEESS", "Switzerland — voisin ✓"], ["l'Irlande", "leer-LAHND", "Ireland — pas voisin ✗"], ["la Pologne", "lah po-LON-yuh", "Poland — pas voisin ✗"], ["le Portugal", "luh por-tew-GAL", "Portugal — pas voisin ✗"], ["la Suède", "lah sew-ED", "Sweden — pas voisin ✗"], ["les Pays-Bas", "lay pay-ee-BAH", "the Netherlands — pas voisin ✗"], ["l'Autriche", "loh-TREESH", "Austria — pas voisin ✗"]]}, {"name": "Activités 2b, 2c, 2d — les réponses", "note": "<strong>b)</strong> Three neighbours are French-speaking: la Belgique, la Suisse, le Luxembourg.<br><strong>c)</strong> France is bordered by la mer du Nord, la mer Méditerranée and l'océan Atlantique — plus la Manche, the Channel. Not the Pacific, not the Black Sea.<br><strong>d)</strong> The green countries are the members of the European Union.", "cols": "two", "items": [["Les pays voisins francophones sont la Belgique, la Suisse et le Luxembourg.", "lay pay-ee vwa-ZAN frahn-ko-FON sohn lah bel-ZHEEK, lah SWEESS ay luh lewk-sahm-BOOR", "The French-speaking neighbours are Belgium, Switzerland and Luxembourg."], ["la mer du Nord", "lah mair dew NOR", "the North Sea ✓"], ["la mer Méditerranée", "lah mair may-dee-tay-ra-NAY", "the Mediterranean ✓"], ["l'océan Atlantique", "lo-say-AHN at-lahn-TEEK", "the Atlantic Ocean ✓"], ["la Manche", "lah MAHNSH", "the English Channel ✓"], ["l'océan Pacifique", "lo-say-AHN pa-see-FEEK", "the Pacific — ✗ not France"], ["la mer Noire", "lah mair NWAHR", "the Black Sea — ✗ not France"], ["Les pays de couleur verte sont les pays de l'Union européenne.", "lay pay-ee duh koo-LUR VAIRT sohn lay pay-ee duh lew-nee-OHN uh-ro-pay-EN", "The green countries are the European Union countries."]]}, {"name": "Activité 3 — quelques symboles", "note": "The country represented <strong>three times</strong> is <strong>la France</strong>: la mode, le TGV and 1789.", "cols": "two", "items": [["1. la mode → la France", "lah MOD", "fashion → France · événements/culture"], ["2. la Saint-Patrick → l'Irlande", "lah san-pa-TREEK", "St Patrick's Day → Ireland · événements/culture"], ["3. le TGV → la France", "luh tay-zhay-VAY", "the high-speed train → France · technologie"], ["4. le carnaval → l'Italie", "luh kar-na-VAL", "the carnival (Venice) → Italy · événements/culture"], ["5. Mozart → l'Autriche", "mo-ZAR", "Mozart → Austria · personnages célèbres"], ["6. 1789 → la France", "meel set sahn kat-ruh-van-NUHF", "1789, the Revolution → France · événements/culture"], ["7. Vermeer → les Pays-Bas", "vair-MEER", "Vermeer → the Netherlands · personnages célèbres"], ["8. Volkswagen → l'Allemagne", "volks-va-GEN", "Volkswagen → Germany · technologie"], ["9. les moules-frites → la Belgique", "lay mool-FREET", "mussels and chips → Belgium · spécialités/gastronomie"], ["10. une montre → la Suisse", "ewn MOHN-truh", "a watch → Switzerland · technologie"], ["11. Vasco de Gama → le Portugal", "vas-KO duh ga-MAH", "Vasco da Gama → Portugal · personnages célèbres"], ["12. la paella → l'Espagne", "lah pa-ay-LAH", "paella → Spain · spécialités/gastronomie"], ["13. l'heure du thé → le Royaume-Uni", "lur dew TAY", "teatime → the United Kingdom · événements/culture"], ["14. Kafka → la République tchèque", "kaf-KAH", "Kafka → the Czech Republic · personnages célèbres"]]}, {"name": "Les catégories", "cols": "two", "items": [["les spécialités / la gastronomie", "lay spay-see-a-lee-TAY / lah gas-tro-no-MEE", "specialities / food"], ["la technologie", "lah tek-no-lo-ZHEE", "technology"], ["les événements / la culture", "lay zay-vayn-MAHN / lah kewl-TEWR", "events / culture"], ["les personnages célèbres", "lay pair-so-NAHZH say-LEB-ruh", "famous figures"], ["les monuments", "lay mo-new-MAHN", "monuments"], ["l'histoire", "lees-TWAHR", "history"]]}, {"name": "Activité 5 — la France en chiffres", "note": "The six numbers <code>2,2 – 12 – 66 – 533 965 – 22 – 9</code> slot in like this. Note the French decimal comma: <strong>2,2</strong> is read <em>deux virgule deux</em>.", "items": [["les habitants : 66 millions", "lay za-bee-TAHN : swa-sahnt-sees meel-YOHN", "inhabitants: 66 million"], ["la superficie : 533 965 kilomètres carrés", "lah sew-pair-fee-SEE : sank sahn trahnt-trwah meel nuhf sahn swa-sahnt-sank kee-lo-MET-ruh ka-RAY", "area: 533,965 km²"], ["les régions : 22", "lay ray-zhee-OHN : van-DUH", "regions: 22"], ["le salaire minimum : 9 euros de l'heure", "luh sa-LAIR mee-nee-MOM : nuh vuh-RO duh LUR", "minimum wage: €9 an hour"], ["le nombre d'habitants à Paris : 2,2 millions", "luh NOHM-bruh da-bee-TAHN a pa-REE : duh veer-gewl duh meel-YOHN", "people in Paris: 2.2 million"], ["dans le grand Paris (Paris + banlieue) : 12 millions", "dahn luh grahn pa-REE (pa-REE plew bahn-lee-UH) : dooz meel-YOHN", "in greater Paris (city + suburbs): 12 million"]]}, {"name": "Le vocabulaire du carnet", "cols": "two", "items": [["un carnet de voyage", "uhn kar-NAY duh vwa-YAHZH", "a travel notebook"], ["une carte", "ewn KART", "a map"], ["un pays voisin", "uhn pay-EE vwa-ZAN", "a neighbouring country"], ["entourer", "ahn-too-RAY", "to surround"], ["une mer", "ewn MAIR", "a sea"], ["un océan", "uh no-say-AHN", "an ocean"], ["représenter", "ruh-pray-zahn-TAY", "to represent"], ["un symbole", "uhn san-BOL", "a symbol"], ["dessiner", "day-see-NAY", "to draw"], ["les habitants", "lay za-bee-TAHN", "the inhabitants"], ["la superficie", "lah sew-pair-fee-SEE", "the surface area"], ["une région", "ewn ray-zhee-OHN", "a region"], ["le salaire minimum", "luh sa-LAIR mee-nee-MOM", "the minimum wage"], ["la banlieue", "lah bahn-lee-UH", "the suburbs"], ["les chiffres", "lay SHEE-fruh", "the figures, numbers"], ["les connaissances", "lay ko-nay-SAHNSS", "knowledge"]]}]}, {"id": "ae-d1-sexercer", "label": "Dossier 1 · S'exercer", "name": "Les corrigés", "summary": "Pages 40–41. All eighteen practice exercises worked through — greetings, tu/vous, avoir, negation, possessives, articles, quel, numbers, prepositions, -ER verbs, être and avoir.", "art": null, "groups": [{"name": "Ex. 1 — les personnes", "note": "This one matches labels to eight drawings, so the pairing depends on your page. Here is the full label list with pronunciation — several labels can fit the same picture, which the exercise itself warns about.", "cols": "three", "items": [["un homme", "uh NOM", "a man"], ["une femme", "ewn FAM", "a woman"], ["un monsieur", "uhn muh-SYUH", "a gentleman"], ["une dame", "ewn DAM", "a lady"], ["un garçon", "uhn gar-SOHN", "a boy"], ["une fille", "ewn FEE-yuh", "a girl"], ["un jeune homme", "uhn zhuh-NOM", "a young man"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["une jeune fille", "ewn zhuhn FEE-yuh", "a young girl"], ["un bébé", "uhn bay-BAY", "a baby"], ["un enfant", "uh nahn-FAHN", "a child"]]}, {"name": "Ex. 2 — saluer", "items": [["1. — Bonjour ! Tu vas bien ? — Oui, et toi ?", "bohn-ZHOOR ! tew va bee-AN ? — wee, ay TWAH", "Hello! You OK? — Yes, and you?"], ["2. — Bonjour, madame. — Bonjour, mademoiselle. Comment allez-vous ? — Très bien, et vous ?", "… ko-mahn ta-lay VOO ? — tray bee-AN, ay VOO", "Hello madam… How are you? — Very well, and you?"], ["3. — Bonjour, monsieur. — Bonjour mademoiselle, vous allez bien ? — Bien, merci.", "… voo za-lay bee-AN ? — bee-AN, mair-SEE", "Hello sir. — Hello miss, are you well? — Fine, thanks."], ["4. — Salut ! Tu vas bien ? — Super, et toi ?", "sa-LEW ! tew va bee-AN ? — sew-PAIR, ay TWAH", "Hi! You OK? — Great, and you?"]]}, {"name": "Ex. 3 — tu ou vous ?", "items": [["1. — Bonjour, monsieur, comment allez-vous ? — Bien, merci.", "ko-mahn ta-lay VOO", "Formal → vous"], ["2. — Bonjour, tu vas bien ? — Oui, et toi ?", "tew va bee-AN", "Informal → tu"], ["3. — Salut les filles ! Vous allez bien ? — Oui, ça va !", "voo za-lay bee-AN", "Several people → vous, even though they're friends"]]}, {"name": "Ex. 4 — le verbe avoir", "items": [["1. — Tu as quel âge ? — J'ai dix-huit ans.", "tew a kel AHZH ? — zhay dee-zwee TAHN", "How old are you? — I'm eighteen."], ["2. — Vous avez des contacts ? — Oui, nous avons des contacts anglophones et francophones.", "voo za-VAY day kohn-TAKT ? — wee, noo za-VOHN", "Do you have contacts? — Yes, we have English- and French-speaking contacts."], ["3. — Tu as des amis à l'université ? — Oui, j'ai deux amis d'origine mexicaine mais ils ont la nationalité française.", "tew a day za-MEE … eel zohn lah na-see-o-na-lee-TAY frahn-SEZ", "Do you have friends at university? — Yes, two of Mexican origin but they have French nationality."], ["4. — Rachida a vingt-deux ans comme toi ? — Non, elle a vingt ans.", "ra-shee-DAH a van-DUH zahn kom TWAH ? — nohn, el a van TAHN", "Is Rachida twenty-two like you? — No, she's twenty."], ["5. — Tu n'as pas cours, aujourd'hui ? — Non. C'est bien, j'ai le temps d'aller au cinéma !", "tew na pah KOOR, oh-zhoor-DWEE ? — … zhay luh TAHN da-LAY oh see-nay-MAH", "No class today? — No. Good, I've time to go to the cinema!"]]}, {"name": "Ex. 5 — la négation ne… pas", "items": [["1. Elle étudie l'économie ou elle n'étudie pas l'économie ?", "el ay-tew-DEE lay-ko-no-MEE oo el nay-tew-DEE pah", "Does she study economics or not?"], ["2. Nous travaillons le matin ou nous ne travaillons pas le matin ?", "noo tra-va-YOHN luh ma-TAN oo noo nuh tra-va-YOHN pah", "Do we work mornings or not?"], ["3. Ils sont français ou ils ne sont pas français ?", "eel sohn frahn-SAY oo eel nuh sohn pah frahn-SAY", "Are they French or not?"], ["4. Je travaille le mardi ou je ne travaille pas le mardi ?", "zhuh tra-VIGH luh mar-DEE oo zhuh nuh tra-VIGH pah", "Do I work Tuesdays or not?"], ["5. Tu es étudiant ou tu n'es pas étudiant ?", "tew ay zay-tew-dee-AHN oo tew nay pah zay-tew-dee-AHN", "Are you a student or not?"], ["6. Vous avez 20 ans ou vous n'avez pas 20 ans ?", "voo za-VAY van TAHN oo voo na-VAY pah", "Are you twenty or not?"]]}, {"name": "Ex. 6 — l'adjectif possessif", "note": "<strong>mon / ma / mes</strong> = my · <strong>votre / vos</strong> = your (polite). The choice follows the <em>noun</em>, not the owner: <em>ma langue</em> because langue is feminine, <em>mes études</em> because études is plural.", "items": [["1. Votre profil : votre nom, votre âge, vos coordonnées, votre nationalité, votre langue maternelle, vos études.", "VOT-ruh pro-FEEL : VOT-ruh nohn, VOT-ruh AHZH, vo ko-or-do-NAY…", "Your profile: your name, age, contact details, nationality, mother tongue, studies."], ["2. Votre connexion : votre adresse mail — votre mot de passe.", "VOT-ruh ko-nek-see-OHN : VOT-ruh a-DRESS mail — VOT-ruh mo duh PAHSS", "Your login: your email address — your password."], ["3. Mon profil : mon nom : Lorenzo Lentati — mon âge : 35 ans — ma langue maternelle : italien — mes études : architecture.", "mohn pro-FEEL : mohn NOHN … ma lahng ma-tair-NELL … may zay-TEWD", "My profile: my name, my age, my mother tongue, my studies."]]}, {"name": "Ex. 7 — l'article indéfini", "items": [["L'étudiante demande des informations pour une inscription dans une médiathèque.", "lay-tew-dee-AHNT duh-MAHND day zan-for-ma-see-OHN poor ewn an-skreep-see-OHN dahn zewn may-dee-a-TEK", "The student asks for information about registering at a media library."], ["Elle complète un formulaire.", "el kohm-PLET uhn for-mew-LAIR", "She fills in a form."], ["L'employé demande une photo et une pièce d'identité : un passeport ou une carte d'identité.", "lahm-plwa-YAY duh-MAHND ewn fo-TO ay ewn pee-ESS dee-dahn-tee-TAY", "The clerk asks for a photo and ID: a passport or an identity card."]]}, {"name": "Ex. 8 — l'adjectif interrogatif quel", "items": [["— Bonjour, c'est pour une inscription, s'il vous plaît.", "bohn-ZHOOR, say poor ewn an-skreep-see-OHN", "Hello, it's to register, please."], ["— Quel est votre nom ? — Bourdier.", "kel ay VOT-ruh NOHN ? — boor-dee-AY", "What's your surname? — Bourdier."], ["— Quel est votre prénom ? — Sandra.", "kel ay VOT-ruh pray-NOHN ? — sahn-DRAH", "What's your first name? — Sandra."], ["— Vous habitez à quelle adresse ? — 20 rue Marie Curie, 54000 Nancy.", "voo za-bee-TAY a kel a-DRESS", "What address do you live at? — 20 rue Marie Curie, 54000 Nancy."], ["— Quelle langue étudiez-vous ? — L'espagnol.", "kel lahng ay-tew-dee-ay VOO ? — les-pan-YOL", "Which language are you studying? — Spanish."], ["— Quel jour préférez-vous ? — Le vendredi.", "kel zhoor pray-fay-ray VOO ? — luh vahn-druh-DEE", "Which day do you prefer? — Friday."]]}, {"name": "Ex. 9 — écrire les questions du formulaire", "items": [["Nom : Bertholet → Quel est votre nom ?", "kel ay VOT-ruh NOHN", "Surname → What's your surname?"], ["Prénom : Maxime → Quel est votre prénom ?", "kel ay VOT-ruh pray-NOHN", "First name → What's your first name?"], ["Date de naissance : 10 juin 1991 → Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "Born 10 June 1991 → What's your date of birth?"], ["Nationalité : française → Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "French → What's your nationality?"], ["Adresse : 59 rue Savary, 86000 Poitiers → Quelle est votre adresse ?", "kel ay VOT-ruh a-DRESS", "Address → What's your address?"], ["Tél. domicile et portable → Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO duh tay-lay-FON", "Two numbers → What are your phone numbers?"]]}, {"name": "Ex. 10 — les opérations", "cols": "two", "items": [["70 + 1 = soixante et onze", "swa-sahnt-ay-ONZ", "71"], ["100 + 80 = cent quatre-vingts", "sahn kat-ruh-VAN", "180"], ["95 − 10 = quatre-vingt-cinq", "kat-ruh-van-SANK", "85"], ["1 000 + 2 000 = trois mille", "twah MEEL", "3 000"], ["100 − 1 = quatre-vingt-dix-neuf", "kat-ruh-van-deez-NUHF", "99"], ["66 + 10 = soixante-seize", "swa-sahnt-SEZ", "76"], ["300 + 50 + 15 + 9 = trois cent soixante-quatorze", "twah sahn swa-sahnt-ka-TORZ", "374"], ["63 + 10 = soixante-treize", "swa-sahnt-TREZ", "73"]]}, {"name": "Ex. 11 — les distances depuis Paris", "cols": "two", "items": [["Paris – Bruxelles : deux cent quatre-vingt-treize kilomètres", "duh sahn kat-ruh-van-TREZ", "293 km"], ["Paris – Madrid : mille deux cent quarante-trois kilomètres", "meel duh sahn ka-rahnt-TWAH", "1 243 km"], ["Paris – Prague : mille cinq kilomètres", "meel SANK", "1 005 km"], ["Paris – Varsovie : mille cinq cent quatre-vingt-sept kilomètres", "meel sank sahn kat-ruh-van-SET", "1 587 km"], ["Paris – Rome : mille trois cent soixante-deux kilomètres", "meel twah sahn swa-sahnt-DUH", "1 362 km"], ["Paris – Dublin : huit cent quarante-six kilomètres", "wee sahn ka-rahnt-SEES", "846 km"]]}, {"name": "Ex. 12 — lire les numéros de téléphone", "note": "Always in <strong>pairs</strong>. A leading zero is <em>zéro</em>, and 00 is <em>zéro zéro</em>.", "items": [["01 42 84 90 00", "zay-RO uhn, ka-rahnt-DUH, kat-ruh-van-KATR, kat-ruh-van-DEES, zay-RO zay-RO", "zéro un, quarante-deux, quatre-vingt-quatre, quatre-vingt-dix, zéro zéro"], ["01 61 19 28 91", "zay-RO uhn, swa-sahnt-ay-UHN, deez-NUHF, van-TWEET, kat-ruh-van-ONZ", "zéro un, soixante et un, dix-neuf, vingt-huit, quatre-vingt-onze"], ["06 04 78 29 81", "zay-RO sees, zay-RO katr, swa-sahnt-dee-ZWEET, van-NUHF, kat-ruh-van-UHN", "zéro six, zéro quatre, soixante-dix-huit, vingt-neuf, quatre-vingt-un"], ["03 46 49 73 79", "zay-RO twah, ka-rahnt-SEES, ka-rahnt-NUHF, swa-sahnt-TREZ, swa-sahnt-deez-NUHF", "zéro trois, quarante-six, quarante-neuf, soixante-treize, soixante-dix-neuf"], ["06 19 21 44 94", "zay-RO sees, deez-NUHF, van-tay-UHN, ka-rahnt-KATR, kat-ruh-van-ka-TORZ", "zéro six, dix-neuf, vingt et un, quarante-quatre, quatre-vingt-quatorze"], ["02 48 80 93 84", "zay-RO duh, ka-rahnt-WEET, kat-ruh-VAN, kat-ruh-van-TREZ, kat-ruh-van-KATR", "zéro deux, quarante-huit, quatre-vingts, quatre-vingt-treize, quatre-vingt-quatre"]]}, {"name": "Ex. 13 — choisir la préposition", "items": [["1. David est américain, il est né aux États-Unis.", "… eel ay nay oh zay-ta-zew-NEE", "plural country → aux"], ["2. Ling est née à Pékin, en Chine. Elle vit en France.", "… a pay-KAN, ahn SHEEN. el vee ahn FRAHNSS", "city → à · feminine country → en"], ["3. Angelica habite en Angleterre mais elle est née au Canada.", "… ah nahn-gluh-TAIR … oh ka-na-DAH", "vowel → en · masculine → au"], ["4. Abdel travaille six mois en Suisse et six mois au Maroc.", "… ahn SWEESS ay see mwah oh ma-ROK", "feminine → en · masculine → au"], ["5. Anna est née à Varsovie, en Pologne, mais elle habite aux Pays-Bas.", "… a var-so-VEE, ahn po-LON-yuh … oh pay-ee-BAH", "city → à · feminine → en · plural → aux"]]}, {"name": "Ex. 14 — l'interview de Tom au présent", "items": [["Comme les autres candidats, vous désirez aller à Paris, n'est-ce pas ?", "kom lay zo-truh kahn-dee-DAH, voo day-zee-RAY a-LAY a pa-REE, ness PAH", "Like the other contestants, you want to go to Paris, don't you?"], ["Oui, je rêve de voir Paris.", "wee, zhuh rev duh vwahr pa-REE", "Yes, I dream of seeing Paris."], ["J'aime la langue et la culture françaises et j'adore la musique.", "zhem lah lahng ay lah kewl-TEWR frahn-SEZ ay zha-DOR lah mew-ZEEK", "I like the French language and culture and I love music."], ["Je désire assister à la Fête de la musique le 21 juin.", "zhuh day-ZEER a-sees-TAY a lah fet duh lah mew-ZEEK", "I want to attend the Music Festival on 21 June."], ["Vous travaillez, vous êtes musicien professionnel ?", "voo tra-va-YAY, voo zet mew-zee-see-AN pro-fay-see-o-NELL", "Do you work — are you a professional musician?"], ["Avec des amis, nous formons un groupe de rock.", "a-vek day za-MEE, noo for-MOHN uhn groop duh ROK", "With friends we form a rock band."], ["Nous jouons dans un bar mais nous travaillons le week-end seulement.", "noo zhoo-OHN dah zuhn BAR may noo tra-va-YOHN luh week-END sul-MAHN", "We play in a bar but we only work weekends."]]}, {"name": "Ex. 15 — changer de personne", "cols": "two", "items": [["Il habite à Tokyo. (ils) → Ils habitent à Tokyo.", "eel za-BEET a to-kee-O", "They live in Tokyo."], ["Tu travailles où ? (vous) → Vous travaillez où ?", "voo tra-va-YAY OO", "Where do you work?"], ["Elle étudie l'économie. (elles) → Elles étudient l'économie.", "el zay-TEW-dee lay-ko-no-MEE", "They study economics."], ["J'arrive lundi. (nous) → Nous arrivons lundi.", "noo za-ree-VOHN luhn-DEE", "We arrive Monday."], ["Elles visitent Barcelone. (elle) → Elle visite Barcelone.", "el vee-ZEET bar-suh-LUN", "She's visiting Barcelona."], ["Vous regardez le film ? (tu) → Tu regardes le film ?", "tew ruh-GARD luh FEELM", "Are you watching the film?"], ["Nous adorons la musique ! (je) → J'adore la musique !", "zha-DOR lah mew-ZEEK", "I love music!"], ["Ils parlent trois langues. (il) → Il parle trois langues.", "eel parl twah LAHNG", "He speaks three languages."]]}, {"name": "Ex. 16 — arriver, habiter, participer, rêver", "items": [["1. — Vous participez à l'émission ? — Oui, je participe au jeu.", "voo par-tee-see-PAY a lay-mee-see-OHN ? — wee, zhuh par-tee-SEEP oh ZHUH", "Are you taking part in the show? — Yes, I'm in the game."], ["2. — Vous habitez où ? — Nous habitons à Dakar.", "voo za-bee-TAY OO ? — noo za-bee-TOHN a da-KAR", "Where do you live? — We live in Dakar."], ["3. — Vous rêvez de visiter Paris ? — Oui, je rêve de visiter le musée d'Orsay.", "voo ray-VAY duh vee-zee-TAY pa-REE ? — wee, zhuh REV duh …", "Do you dream of visiting Paris? — Yes, of visiting the Musée d'Orsay."], ["4. — Vous arrivez quand à Paris ? — Nous arrivons le 23 septembre.", "voo za-ree-VAY kahn a pa-REE ? — noo za-ree-VOHN luh van-TWAH sep-TAHM-bruh", "When do you arrive in Paris? — We arrive on 23 September."]]}, {"name": "Ex. 17 — être ou avoir (à la cafétéria)", "items": [["— Bonjour, Marta. Ça va ? — Ça va bien.", "bohn-ZHOOR, mar-TAH. sa VA ? — sa va bee-AN", "Hello Marta. OK? — I'm fine."], ["Je suis très contente ; j'ai de nouveaux amis : Marion et Vincent.", "zhuh swee tray kohn-TAHNT ; zhay duh noo-VO za-MEE", "I'm very happy; I have new friends: Marion and Vincent."], ["Ils sont français et ils sont étudiants en architecture comme moi.", "eel sohn frahn-SAY ay eel sohn tay-tew-dee-AHN ah nar-shee-tek-TEWR kom MWAH", "They're French and they're architecture students like me."], ["Ils sont mariés et ils ont un bébé : il a six mois !", "eel sohn ma-ree-AY ay eel zohn tuhn bay-BAY : eel a see MWAH", "They're married and they have a baby: he's six months old!"]]}, {"name": "Ex. 18 — reformuler avec être ou avoir", "items": [["Votre nom ? → Quel est votre nom ? — José Esteves.", "kel ay VOT-ruh NOHN", "Your name? → What is your name?"], ["Date de naissance ? → Quelle est votre date de naissance ? — Le 26 avril 1995.", "kel ay VOT-ruh dat duh nay-SAHNSS", "Date of birth? → What is your date of birth?"], ["Étudiant à Paris ? → Vous êtes étudiant à Paris ? — Oui.", "voo zet ay-tew-dee-AHN a pa-REE", "Student in Paris? → Are you a student in Paris?"], ["Une pièce d'identité ? → Vous avez une pièce d'identité, s'il vous plaît ?", "voo za-VAY ewn pee-ESS dee-dahn-tee-TAY", "ID? → Do you have proof of identity, please?"], ["Libre le lundi ? → Vous êtes libre le lundi ? — Oui.", "voo zet LEE-bruh luh luhn-DEE", "Free on Monday? → Are you free on Monday?"], ["Un numéro de portable ? → Vous avez un numéro de portable ? — 07 29 92 36 75.", "voo za-VAY uhn new-may-RO duh por-TAH-bluh", "A mobile number? → Do you have a mobile number?"]]}]}, {"id": "ae-d1-delf", "label": "Dossier 1 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 42. A mock exam section: ten points of listening comprehension, ten points of written production — filling in a competition form.", "art": null, "groups": [{"name": "Les enregistrements", "note": "The original CD tracks for this lesson, in book order. Track numbers are read from the 🎧 icons printed on the pages.", "items": [], "tracks": [{"n": 54, "label": "D1 · p.42 — Vers le DELF A1, compréhension"}]}, {"name": "Compréhension de l'oral — les questions", "note": "The recording itself isn't something I can hear, so the answers depend on your audio track. What you <em>can</em> prepare is the question language — these five phrasings come up in every A1 listening paper.", "items": [["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN. ay-koo-TAY luh do-kew-MAHN duh FWAH pwee ray-pohn-DAY", "Read the questions. Listen twice, then answer."], ["Maria téléphone pour des cours de français, d'anglais ou de portugais ?", "ma-ree-AH tay-lay-FON poor day KOOR duh frahn-SAY, dahn-GLAY oo duh por-tew-GAY", "Is Maria calling about French, English or Portuguese lessons?"], ["Quelle est la profession de Maria ?", "kel ay lah pro-fay-see-OHN duh ma-ree-AH", "What is Maria's job?"], ["Elle est libre quel jour ?", "el ay LEE-bruh kel ZHOOR", "Which day is she free?"], ["Elle est libre à quel moment : le matin, l'après-midi ou le soir ?", "el ay LEE-bruh a kel mo-MAHN", "What time of day is she free: morning, afternoon or evening?"], ["Quel est le numéro de téléphone de Maria ?", "kel ay luh new-may-RO duh tay-lay-FON duh ma-ree-AH", "What is Maria's phone number?"]]}, {"name": "Production écrite — le formulaire", "note": "Ten points for filling this in correctly. Everything here you have already met — this is the payoff of Dossier 1.", "cols": "two", "items": [["Complétez le formulaire pour gagner un dictionnaire.", "kohm-play-TAY luh for-mew-LAIR poor ga-NYAY uhn deek-see-o-NAIR", "Fill in the form to win a dictionary."], ["Jeu concours Hachette", "zhuh kohn-KOOR a-SHET", "Hachette prize competition"], ["Dictionnaires à gagner", "deek-see-o-NAIR a ga-NYAY", "Dictionaries to be won"], ["Tirage au sort à la fin du mois", "tee-RAHZH oh SOR a lah fan dew MWAH", "Prize draw at the end of the month"], ["Nom", "NOHN", "Surname"], ["Prénom", "pray-NOHN", "First name"], ["Date de naissance", "dat duh nay-SAHNSS", "Date of birth"], ["Nationalité", "na-see-o-na-lee-TAY", "Nationality"], ["Adresse", "a-DRESS", "Address"], ["Pays", "pay-EE", "Country"], ["Numéro de téléphone", "new-may-RO duh tay-lay-FON", "Phone number"], ["Mail", "MAIL", "Email"], ["École / Université", "ay-KOL / ew-nee-vair-see-TAY", "School / University"]]}, {"name": "Le vocabulaire de l'examen", "cols": "two", "items": [["la compréhension de l'oral", "lah kohm-pray-ahn-see-OHN duh lo-RAL", "listening comprehension"], ["la production écrite", "lah pro-dewk-see-OHN ay-KREET", "written production"], ["dix points", "dee PWAN", "ten points"], ["un document", "uhn do-kew-MAHN", "a document, a recording"], ["deux fois", "duh FWAH", "twice"], ["répondre", "ray-POHN-druh", "to answer"], ["être libre", "EH-truh LEE-bruh", "to be free / available"], ["un moment", "uhn mo-MAHN", "a time, a moment"], ["un cours", "uhn KOOR", "a class, a lesson"], ["un dictionnaire", "uhn deek-see-o-NAIR", "a dictionary"]]}]}, {"id": "ae-d2l1", "label": "Dossier 2 · Leçon 1", "name": "C'est ma ville", "summary": "Pages 44–47. Pontoise, a town of art and history 30 km from Paris: naming the places in a town, saying where they are, and explaining why you like them.", "art": "prepolieu", "groups": [{"name": "Les enregistrements", "note": "The original CD tracks for this lesson, in book order. Track numbers are read from the 🎧 icons printed on the pages.", "items": [], "tracks": [{"n": 59, "label": "D2 L1 · p.45 act. 4–5 — le journaliste"}, {"n": 60, "label": "D2 L1 · p.45 act. 4–5 — le journaliste"}, {"n": 61, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 62, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 63, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 64, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 65, "label": "D2 L1 · p.47 act. 11 — vérifier sur le plan"}, {"n": 66, "label": "D2 L1 · p.47 act. 11 — vérifier sur le plan"}]}, {"name": "L'affiche de Pontoise", "items": [["Bienvenue à Pontoise", "bee-an-vuh-NEW a pohn-TWAHZ", "Welcome to Pontoise"], ["« Ville d'art et d'histoire » à 30 km de Paris", "VEEL dar ay dees-TWAHR a trahnt kee-lo-MET-ruh duh pa-REE", "“Town of art and history”, 30 km from Paris"], ["la ville de Pontoise", "lah veel duh pohn-TWAHZ", "the town of Pontoise"], ["Observez l'affiche de la ville.", "ob-sair-VAY la-FEESH duh lah VEEL", "Look at the town's poster."], ["Regardez les photos et faites des hypothèses.", "ruh-gar-DAY lay fo-TO ay fet day zee-po-TEZ", "Look at the photos and make some guesses."], ["Parler de sa ville", "par-LAY duh sa VEEL", "Talking about your town"]]}, {"name": "Activité 1 — à Pontoise, il y a…", "note": "Checking against the leaflet on p.45, <strong>all eight are true</strong>. The museum is Camille Pissarro, the university is Cergy-Pontoise, the theatre is L'Apostrophe, the river is l'Oise, the cathedral is Saint-Maclou, and there are two gardens. The <em>château</em> is the qualified one — only <strong>les remparts de l'ancien château</strong> survive.", "cols": "two", "items": [["un musée", "uhn mew-ZAY", "a museum ✓"], ["une université", "ew new-nee-vair-see-TAY", "a university ✓"], ["un théâtre", "uhn tay-AH-truh", "a theatre ✓"], ["une rivière", "ewn ree-vee-AIR", "a river ✓ — l'Oise"], ["un château", "uhn sha-TO", "a castle — only the ramparts remain"], ["une cathédrale", "ewn ka-tay-DRAL", "a cathedral ✓ — Saint-Maclou"], ["un pont", "uhn POHN", "a bridge ✓"], ["des jardins", "day zhar-DAN", "gardens ✓"]]}, {"name": "Point Culture — Pontoise, ville de l'Île-de-France", "note": "<strong>The Île-de-France is made of:</strong> Paris (both a city and a département) + the <strong>3</strong> départements of the inner suburbs, in orange (92 Hauts-de-Seine, 93 Seine-Saint-Denis, 94 Val-de-Marne) + the <strong>4</strong> départements of the outer suburbs, in yellow (95 Val-d'Oise, 78 Yvelines, 91 Essonne, 77 Seine-et-Marne).<br><br><strong>Pontoise is in the grande banlieue</strong>, in the Val-d'Oise (95).<br><br>And the riddle in part B: the river hides inside the town's own name — <strong>PONT + OISE</strong>. The coat of arms shows a bridge over the Oise.", "cols": "two", "items": [["la région Île-de-France", "lah ray-zhee-OHN eel-duh-FRAHNSS", "the Île-de-France region"], ["un département", "uhn day-par-tuh-MAHN", "a department (administrative area)"], ["la proche banlieue", "lah prosh bahn-lee-UH", "the inner suburbs"], ["la grande banlieue", "lah grahnd bahn-lee-UH", "the outer suburbs"], ["Pontoise se trouve en grande banlieue.", "pohn-TWAHZ suh troov ahn grahnd bahn-lee-UH", "Pontoise is in the outer suburbs."], ["le blason", "luh bla-ZOHN", "the coat of arms"], ["l'Oise", "LWAHZ", "the Oise — the river inside the name Pont-oise"], ["se trouver", "suh troo-VAY", "to be located"]]}, {"name": "Le dépliant — votre ville, d'hier à aujourd'hui", "cols": "two", "items": [["la cathédrale Saint-Maclou", "lah ka-tay-DRAL san-ma-KLOO", "Saint-Maclou cathedral"], ["l'Oise et les remparts", "LWAHZ ay lay rahm-PAR", "the Oise and the ramparts"], ["le musée Camille Pissarro", "luh mew-ZAY ka-MEE pee-sa-RO", "the Camille Pissarro museum"], ["l'université de Cergy-Pontoise", "lew-nee-vair-see-TAY duh sair-ZHEE pohn-TWAHZ", "Cergy-Pontoise university"], ["le musée Tavet-Delacour", "luh mew-ZAY ta-VAY duh-la-KOOR", "the Tavet-Delacour museum"], ["le jardin de la Ville", "luh zhar-DAN duh lah VEEL", "the town garden"], ["le jardin des Cinq Sens", "luh zhar-DAN day sank SAHNSS", "the Garden of the Five Senses"], ["le théâtre de L'Apostrophe", "luh tay-AH-truh duh la-pos-TROF", "L'Apostrophe theatre"], ["le cinéma Royal Utopia", "luh see-nay-MAH rwa-YAL ew-to-PYA", "the Royal Utopia cinema"], ["le complexe sportif des Louvrais", "luh kohm-PLEX spor-TEEF day loo-VRAY", "the Louvrais sports complex"], ["les marchés", "lay mar-SHAY", "the markets"]]}, {"name": "Activité 2b — art et histoire / vie quotidienne", "note": "A reasonable split: <strong>art et histoire</strong> — la cathédrale, les remparts, le musée Pissarro, le musée Tavet-Delacour, les jardins, le théâtre. <strong>vie quotidienne</strong> — l'université, le cinéma, le complexe sportif, les marchés. Some sit on the line (a theatre is both culture and daily life), and the exercise expects you to argue your case.", "cols": "two", "items": [["l'art et l'histoire", "LAR ay lees-TWAHR", "art and history"], ["la vie quotidienne", "lah vee ko-tee-dee-EN", "daily life"], ["Classez les lieux dans les deux catégories.", "kla-SAY lay lee-UH dahn lay duh ka-tay-go-REE", "Sort the places into the two categories."]]}, {"name": "Point Langue — articles définis et indéfinis", "note": "<strong>The rule you're meant to find:</strong> the indefinite articles <em>un, une, des</em> give <strong>non-specific</strong> information — there is <em>a</em> museum. The definite articles <em>le, la, l', les</em> give <strong>specific</strong> information — it's <em>the</em> Camille Pissarro museum.", "cols": "two", "items": [["Il y a un musée. → C'est le musée Camille Pissarro.", "eel ee a uhn mew-ZAY → say luh mew-ZAY", "There's a museum → It's the Camille Pissarro museum."], ["Il y a une cathédrale. → C'est la cathédrale Saint-Maclou.", "… ewn ka-tay-DRAL → say lah ka-tay-DRAL", "There's a cathedral → It's Saint-Maclou cathedral."], ["Il y a une université. → C'est l'université de Cergy-Pontoise.", "… ew new-nee-vair-see-TAY", "There's a university → It's Cergy-Pontoise university."], ["Il y a une rivière. → C'est l'Oise.", "… ewn ree-vee-AIR → say LWAHZ", "There's a river → It's the Oise."], ["Il y a des remparts. → Ce sont les remparts de l'ancien château.", "… day rahm-PAR → suh sohn lay rahm-PAR duh lahn-see-AN sha-TO", "There are ramparts → They're the ramparts of the old castle."]]}, {"name": "Aide-mémoire — demander et donner une explication", "items": [["Pourquoi aimez-vous ce lieu ?", "poor-KWAH ay-may VOO suh lee-UH", "Why do you like this place?"], ["Parce que j'adore la peinture.", "pars kuh zha-DOR lah pan-TEWR", "Because I love painting."], ["Parce qu'il y a des spectacles intéressants.", "pars keel ee a day spek-TAH-kluh an-tay-ray-SAHN", "Because there are interesting shows."], ["Mon lieu préféré, c'est…", "mohn lee-UH pray-fay-RAY, say", "My favourite place is…"], ["Quel est votre lieu préféré dans votre ville ?", "kel ay VOT-ruh lee-UH pray-fay-RAY dahn VOT-ruh VEEL", "What's your favourite place in your town?"]]}, {"name": "Phonétique — un / une", "cols": "two", "items": [["un musée", "uhn mew-ZAY", "a museum — nasal uhn"], ["un endroit", "uh nahn-DRWAH", "a place — liaison, the n links across"], ["une rivière", "ewn ree-vee-AIR", "a river — clear ewn"], ["une épicerie", "ew nay-pee-SREE", "a grocer's — liaison again"]]}, {"name": "Localiser — les bonnes adresses de Mélanie", "note": "From the town magazine <em>Pontoise infos</em>, page « Vivre et sortir à Pontoise ». Each entry gives three things: the name, an opinion in quotation marks, and the location.", "items": [["Le restaurant L'Audience : « un bon restaurant traditionnel »", "luh res-to-RAHN lo-dee-AHNSS : uhn bohn res-to-RAHN tra-dee-see-o-NELL", "The L'Audience restaurant: “a good traditional restaurant”"], ["sur la place de l'Hôtel de Ville, en face de la mairie, à côté de la pharmacie", "sewr lah plahss duh lo-TELL duh VEEL, ahn fahss duh lah may-REE, a ko-TAY duh lah far-ma-SEE", "on the town hall square, opposite the town hall, next to the pharmacy"], ["Le cinéma Royal Utopia : « une programmation intéressante »", "luh see-nay-MAH rwa-YAL ew-to-PYA : ewn pro-gra-ma-see-OHN an-tay-ray-SAHNT", "The Royal Utopia cinema: “an interesting programme”"], ["dans la rue Alexandre Prachay, à gauche de la bibliothèque Guillaume-Apollinaire", "dahn lah rew a-lek-SAHN-druh pra-SHAY, a GOSH duh lah bee-blee-o-TEK", "on rue Alexandre Prachay, to the left of the Guillaume-Apollinaire library"], ["Le marché du centre : « des commerçants sympathiques »", "luh mar-SHAY dew SAHN-truh : day ko-mair-SAHN san-pa-TEEK", "The central market: “friendly traders”"], ["dans la rue de l'Hôtel de Ville et sur la place, le samedi matin", "dahn lah rew duh lo-TELL duh VEEL ay sewr lah PLAHSS, luh sam-DEE ma-TAN", "on rue de l'Hôtel de Ville and on the square, Saturday mornings"], ["L'épicerie fine L'Arbre blanc : « des produits de qualité et une galerie d'art ! »", "lay-pee-SREE FEEN LAR-bruh BLAHN : day pro-DWEE duh ka-lee-TAY ay ewn gal-REE DAR", "The L'Arbre blanc delicatessen: “quality products and an art gallery!”"], ["dans la rue Alexandre Prachay, près du cinéma", "dahn lah rew a-lek-SAHN-druh pra-SHAY, pray dew see-nay-MAH", "on rue Alexandre Prachay, near the cinema"]]}, {"name": "Activité 8 — les réponses", "note": "<strong>1.</strong> Mélanie is a resident of Pontoise — <em>une Pontoisienne</em> — sharing her favourite local spots in the town magazine.<br><strong>2.</strong> Her addresses are all <strong>commerces et loisirs</strong>: a restaurant, a cinema, a market and a delicatessen.<br><strong>3.</strong> For each place the magazine gives <strong>the name, an opinion, and the location</strong>.", "cols": "two", "items": [["Qui est Mélanie ?", "kee ay may-la-NEE", "Who is Mélanie?"], ["C'est une habitante de Pontoise, une Pontoisienne.", "set ewn a-bee-TAHNT duh pohn-TWAHZ, ewn pohn-twa-zee-EN", "She's a resident of Pontoise."], ["les commerces et les loisirs", "lay ko-MAIRSS ay lay lwa-ZEER", "shops and leisure"], ["le nom, l'opinion et la localisation", "luh NOHN, lo-pee-nee-OHN ay lah lo-ka-lee-za-see-OHN", "the name, the opinion and the location"], ["une bonne adresse", "ewn bun a-DRESS", "a good address, a place worth knowing"], ["le centre-ville", "luh sahn-truh-VEEL", "the town centre"]]}, {"name": "Aide-mémoire — les prépositions de lieu (Où ?)", "cols": "two", "items": [["dans", "dahn", "in"], ["sur ≠ sous", "sewr ≠ soo", "on ≠ under"], ["devant ≠ derrière", "duh-VAHN ≠ dair-ee-AIR", "in front of ≠ behind"], ["près de ≠ loin de", "pray duh ≠ lwan duh", "near ≠ far from"], ["à gauche de ≠ à droite de", "a GOSH duh ≠ a DRWAHT duh", "to the left of ≠ to the right of"], ["en face de", "ahn fahss duh", "opposite"], ["à côté de", "a ko-TAY duh", "next to"], ["Où se trouve la pharmacie ?", "oo suh TROOV lah far-ma-SEE", "Where is the pharmacy?"]]}, {"name": "Point Langue — l'article contracté", "note": "<strong>de + le = du</strong> · <strong>de + les = des</strong> · <em>de la</em> and <em>de l'</em> never contract. This is not optional — <em>près de le cinéma</em> is simply wrong French.", "cols": "two", "items": [["la banque → près de la banque", "pray duh lah BAHNK", "near the bank — feminine, no change"], ["le restaurant → à côté du restaurant", "a ko-TAY dew res-to-RAHN", "next to the restaurant — de + le = du"], ["l'hôtel de ville → à droite de l'hôtel de ville", "a DRWAHT duh lo-TELL duh VEEL", "to the right of the town hall — no change before a vowel"], ["les écoles → loin des écoles", "lwan day zay-KOL", "far from the schools — de + les = des"], ["à gauche du parking", "a GOSH dew par-KEENG", "to the left of the car park"], ["en face de la mairie", "ahn fahss duh lah may-REE", "opposite the town hall"], ["près du cinéma", "pray dew see-nay-MAH", "near the cinema"]]}, {"name": "Activité 10 — vrai ou faux", "note": "<strong>Number 3 is FAUX</strong>, and the magazine text proves it: L'Audience is <em>à côté de la pharmacie</em> — <strong>next to</strong> the pharmacy, not with it behind. <strong>Number 5 is also FAUX</strong> on the same evidence: the text places L'Arbre blanc <em>près du cinéma</em>, not next to the car park.<br><br>Statements 1, 2 and 4 can only be settled against the street plan on p.46 — read them off your own page.", "items": [["1. Le musée Tavet est en face de la poste.", "luh mew-ZAY ta-VAY et ahn fahss duh lah POST", "The Tavet museum is opposite the post office."], ["2. Il y a une boulangerie à droite de la banque.", "eel ee a ewn boo-lahn-ZHREE a DRWAHT duh lah BAHNK", "There's a bakery to the right of the bank."], ["3. Sur la place, il y a une pharmacie derrière le restaurant L'Audience.", "sewr lah PLAHSS, eel ee a ewn far-ma-SEE dair-ee-AIR luh res-to-RAHN", "On the square there's a pharmacy behind L'Audience. — FAUX, it's next to it"], ["4. La banque est près de l'église Sainte-Anne.", "lah BAHNK ay pray duh lay-GLEEZ sant-ANN", "The bank is near Sainte-Anne church."], ["5. L'épicerie fine L'Arbre blanc est dans la rue Alexandre Prachay, à côté du parking.", "lay-pee-SREE FEEN … a ko-TAY dew par-KEENG", "L'Arbre blanc is on rue Alexandre Prachay, next to the car park. — FAUX, it's near the cinema"]]}, {"name": "Point Langue — les lieux de la ville, par catégorie", "note": "<strong>administrations</strong> — l'hôtel de ville (= la mairie), la poste · <strong>culture</strong> — le cinéma, la cathédrale, le théâtre, le musée, l'église, la bibliothèque · <strong>commerces</strong> — la boulangerie, le restaurant, le marché, l'épicerie, le supermarché, la pharmacie · <strong>nature</strong> — le jardin, la rivière · <strong>éducation</strong> — l'école, l'université · <strong>autres</strong> — l'hôpital.", "cols": "two", "items": [["l'hôtel de ville (= la mairie)", "lo-TELL duh VEEL (= lah may-REE)", "the town hall"], ["la poste", "lah POST", "the post office"], ["le cinéma", "luh see-nay-MAH", "the cinema"], ["la cathédrale", "lah ka-tay-DRAL", "the cathedral"], ["le théâtre", "luh tay-AH-truh", "the theatre"], ["le musée", "luh mew-ZAY", "the museum"], ["l'église", "lay-GLEEZ", "the church"], ["la bibliothèque", "lah bee-blee-o-TEK", "the library"], ["la boulangerie", "lah boo-lahn-ZHREE", "the bakery"], ["le restaurant", "luh res-to-RAHN", "the restaurant"], ["le marché", "luh mar-SHAY", "the market"], ["l'épicerie", "lay-pee-SREE", "the grocer's"], ["le supermarché", "luh sew-pair-mar-SHAY", "the supermarket"], ["la pharmacie", "lah far-ma-SEE", "the pharmacy"], ["le jardin", "luh zhar-DAN", "the garden, park"], ["la rivière", "lah ree-vee-AIR", "the river"], ["l'école", "lay-KOL", "the school"], ["l'université", "lew-nee-vair-see-TAY", "the university"], ["l'hôpital", "lo-pee-TAL", "the hospital"], ["la banque", "lah BAHNK", "the bank"], ["le parking", "luh par-KEENG", "the car park"], ["la place", "lah PLAHSS", "the square"], ["la rue", "lah REW", "the street"], ["le boulevard", "luh bool-VAR", "the boulevard"], ["le quartier", "luh kar-tee-AY", "the neighbourhood"]]}, {"name": "Activité 12 — le forum de citemag.com", "items": [["Participez à notre forum sur la ville !", "par-tee-see-PAY a NOT-ruh fo-ROM sewr lah VEEL", "Take part in our forum about the town!"], ["Avez-vous un endroit préféré dans votre ville ?", "a-vay VOO uh nahn-DRWAH pray-fay-RAY dahn VOT-ruh VEEL", "Do you have a favourite spot in your town?"], ["Dites quel endroit vous préférez.", "deet kel ahn-DRWAH voo pray-fay-RAY", "Say which place you prefer."], ["Indiquez où il se trouve.", "an-dee-KAY oo eel suh TROOV", "Say where it is."], ["Expliquez pourquoi vous l'aimez.", "eks-plee-KAY poor-KWAH voo lay-MAY", "Explain why you like it."], ["Mon endroit préféré, c'est la bibliothèque, près de la place, parce qu'elle est calme.", "moh nahn-DRWAH pray-fay-RAY, say lah bee-blee-o-TEK, pray duh lah PLAHSS, pars kel ay KALM", "A model answer, using all three parts."]]}, {"name": "Le vocabulaire de la leçon", "cols": "two", "items": [["une ville", "ewn VEEL", "a town, a city"], ["un lieu", "uhn lee-UH", "a place"], ["un endroit", "uh nahn-DRWAH", "a spot, a place"], ["un habitant", "uh na-bee-TAHN", "an inhabitant"], ["une affiche", "ewn a-FEESH", "a poster"], ["un dépliant", "uhn day-plee-AHN", "a leaflet"], ["un plan", "uhn PLAHN", "a street map"], ["une carte", "ewn KART", "a map"], ["un magazine", "uhn ma-ga-ZEEN", "a magazine"], ["un journaliste", "uhn zhoor-na-LEEST", "a journalist"], ["un commerçant", "uhn ko-mair-SAHN", "a shopkeeper"], ["un spectacle", "uhn spek-TAH-kluh", "a show"], ["une programmation", "ewn pro-gra-ma-see-OHN", "a programme, a line-up"], ["un produit", "uhn pro-DWEE", "a product"], ["la qualité", "lah ka-lee-TAY", "quality"], ["une galerie d'art", "ewn gal-REE DAR", "an art gallery"], ["les remparts", "lay rahm-PAR", "the ramparts"], ["un pont", "uhn POHN", "a bridge"], ["ancien / ancienne", "ahn-see-AN / ahn-see-EN", "old, former"], ["traditionnel / traditionnelle", "tra-dee-see-o-NELL", "traditional"], ["intéressant / intéressante", "an-tay-ray-SAHN / an-tay-ray-SAHNT", "interesting"], ["préféré / préférée", "pray-fay-RAY", "favourite"], ["localiser", "lo-ka-lee-ZAY", "to locate"], ["situer", "see-tew-AY", "to place, to situate"], ["expliquer", "eks-plee-KAY", "to explain"], ["vivre et sortir", "VEE-vruh ay sor-TEER", "to live and go out"], ["d'hier à aujourd'hui", "dee-AIR a oh-zhoor-DWEE", "from yesterday to today"]]}]}]}, {"id": "grammaire", "name": "Grammaire Progressive", "short": "Grammaire", "color": "#3F8F63", "blurb": "Six chapters that build the skeleton: introducing yourself, making adjectives agree in all four forms, être, questions, negation, and your first verb family.", "lessons": [{"id": "gr-1", "label": "Chapitre 1", "name": "Vous êtes japonais ?", "summary": "La présentation. Je suis + name, nationality, job — and why French drops the article before a profession.", "art": null, "groups": [{"name": "La présentation", "note": "Two rules this chapter rests on. <strong>Always use je suis or je m'appelle</strong> — never a bare name. And <strong>no article before a profession</strong>: <em>je suis médecin</em>, never <em>je suis un médecin</em>. That one catches every English speaker.", "items": [["Bonjour, je suis Kenji Takashi.", "bohn-ZHOOR, zhuh swee", "Hello, I'm Kenji Takashi."], ["Je m'appelle Kenji Takashi.", "zhuh ma-PELL", "My name is Kenji Takashi."], ["Vous êtes japonais ? — Oui, je suis japonais.", "voo-ZET zha-po-NAY", "Are you Japanese? — Yes, I am."], ["Vous êtes médecin ? — Non, je suis chimiste.", "voo-ZET mayd-SAN — nohn, zhuh swee shee-MEEST", "Are you a doctor? — No, I'm a chemist."], ["Je suis français. Je suis professeur.", "zhuh swee frahn-SAY. zhuh swee pro-fess-UR", "I'm French. I'm a teacher."], ["Jean, vous êtes professeur ou étudiant ?", "zhahn, voo-ZET pro-fess-UR oo zay-tew-dee-AHN", "Jean, are you a teacher or a student?"], ["Kenji, vous êtes médecin ou chimiste ?", "voo-ZET mayd-SAN oo shee-MEEST", "Kenji, are you a doctor or a chemist?"], ["Bip, vous êtes astronaute ou professeur ?", "voo-ZET zas-tro-NOTE oo pro-fess-UR", "Bip, are you an astronaut or a teacher?"]]}]}, {"id": "gr-2", "label": "Chapitre 2", "name": "Il est grand. Elle est grande.", "summary": "Masculine to feminine. Add -e and the silent consonant wakes up — that's how you hear gender.", "art": "agreement", "groups": [{"name": "Masculin → féminin", "cols": "two", "note": "<strong>Féminin = masculin + -e.</strong> The point of that -e: a silent final consonant becomes audible, so you can <em>hear</em> the gender. Words already ending in -e (jeune, russe, calme) don't change.", "items": [["français → française", "frahn-SAY → frahn-SEZ", "French"], ["portugais → portugaise", "por-tew-GAY → por-tew-GEZ", "Portuguese"], ["suédois → suédoise", "sway-DWAH → sway-DWAZ", "Swedish"], ["chinois → chinoise", "shee-NWAH → shee-NWAZ", "Chinese"], ["mexicain → mexicaine", "mek-see-KAN → mek-see-KEN", "Mexican"], ["américain → américaine", "a-may-ree-KAN → a-may-ree-KEN", "American"], ["autrichien → autrichienne", "oh-tree-shee-AN → oh-tree-shee-EN", "Austrian"], ["canadien → canadienne", "ka-na-dee-AN → ka-na-dee-EN", "Canadian"], ["coréen → coréenne", "ko-ray-AN → ko-ray-EN", "Korean"], ["allemand → allemande", "al-MAHN → al-MAHND", "German"], ["espagnol → espagnole", "es-pan-YOL → es-pan-YOL", "Spanish"], ["russe → russe", "rewss → rewss", "Russian — identical"], ["grec → grecque", "grek → grek", "Greek — irregular"], ["turc → turque", "tewrk → tewrk", "Turkish — irregular"], ["étudiant → étudiante", "ay-tew-dee-AHN → ay-tew-dee-AHNT", "student"], ["grand → grande", "GRAHN → GRAHND", "tall"], ["blond → blonde", "BLOHN → BLOHND", "blond"], ["marié → mariée", "ma-ree-AY → ma-ree-AY", "married"], ["petit → petite", "puh-TEE → puh-TEET", "small"], ["vert → verte", "VAIR → VAIRT", "green"], ["amusant → amusante", "a-mew-ZAHN → a-mew-ZAHNT", "funny"], ["intelligent → intelligente", "an-tel-ee-ZHAHN → an-tel-ee-ZHAHNT", "intelligent"], ["souriant → souriante", "soo-ree-AHN → soo-ree-AHNT", "smiling"], ["jeune → jeune", "ZHUHN → ZHUHN", "young — no change"]]}, {"name": "Les autres terminaisons", "cols": "two", "note": "<strong>-on → -onne</strong> · <strong>-er → -ère</strong> · <strong>-eur / -eux → -euse</strong> · <strong>-teur → -trice</strong> for most professions.<br><br>One exception: <strong>chanteur → chanteuse</strong>, not chantrice. And some jobs never change: <strong>professeur, médecin, écrivain, auteur</strong> stay identical — though professeure, écrivaine and auteure are increasingly used.", "items": [["bon → bonne", "bohn → bun", "good"], ["breton → bretonne", "bruh-TOHN → bruh-TUN", "Breton"], ["mignon → mignonne", "meen-YOHN → meen-YUN", "cute"], ["étranger → étrangère", "ay-trahn-ZHAY → ay-trahn-ZHAIR", "foreign"], ["boulanger → boulangère", "boo-lahn-ZHAY → boo-lahn-ZHAIR", "baker"], ["infirmier → infirmière", "an-feer-mee-AY → an-feer-mee-AIR", "nurse"], ["poissonnier → poissonnière", "pwa-son-YAY → pwa-son-YAIR", "fishmonger"], ["serveur → serveuse", "sair-VUR → sair-VUZ", "waiter"], ["danseur → danseuse", "dahn-SUR → dahn-SUHZ", "dancer"], ["menteur → menteuse", "mahn-TUR → mahn-TUZ", "liar"], ["heureux → heureuse", "uh-RUH → uh-RUZ", "happy"], ["acteur → actrice", "ak-TUR → ak-TREESS", "actor"], ["instituteur → institutrice", "an-stee-tew-TUR → an-stee-tew-TREESS", "primary teacher"], ["présentateur → présentatrice", "pray-zahn-ta-TUR → pray-zahn-ta-TREESS", "presenter"], ["chanteur → chanteuse", "shahn-TUR → shahn-TUHZ", "singer — the exception"], ["professeur → professeur", "pro-fess-UR", "teacher — unchanged"], ["médecin → médecin", "mayd-SAN", "doctor — unchanged"], ["beau → belle", "BO → BELL", "beautiful"], ["gros → grosse", "GRO → GROSS", "big / fat"], ["vieux → vieille", "vee-UH → vee-AY-yuh", "old"], ["gentil → gentille", "zhahn-TEE → zhahn-TEE-yuh", "kind"], ["blanc → blanche", "BLAHN → BLAHNSH", "white"]]}]}, {"id": "gr-3", "label": "Chapitre 3", "name": "Ils sont grands.", "summary": "Singular to plural — add -s, unless the word already ends in -s or -x.", "art": null, "groups": [{"name": "Singulier → pluriel", "cols": "two", "note": "<strong>Pluriel = singulier + -s.</strong> But a masculine word already ending in <strong>-s</strong> or <strong>-x</strong> doesn't change at all. One irregular: <em>beau → beaux</em>.<br><br>And when a group is mixed, the masculine plural always wins — one man among ten women still makes it <strong>ils</strong>.", "items": [["il est blond → ils sont blonds", "eel ay BLOHN → eel sohn BLOHN", "he is / they are blond"], ["elle est blonde → elles sont blondes", "el ay BLOHND → el sohn BLOHND", "she is / they are blonde"], ["il est étudiant → ils sont étudiants", "eel et ay-tew-dee-AHN → eel sohn tay-tew-dee-AHN", "student(s)"], ["il est français → ils sont français", "eel ay frahn-SAY → eel sohn frahn-SAY", "French — no change"], ["il est vieux → ils sont vieux", "eel ay vee-UH → eel sohn vee-UH", "old — no change"], ["il est beau → ils sont beaux", "eel ay BO → eel sohn BO", "handsome — irregular"], ["Ils sont américains.", "eel sohn ta-may-ree-KAN", "They're American."], ["Elles sont brésiliennes.", "el sohn bray-zeel-YEN", "They're Brazilian. (fem.)"], ["Elles sont danseuses.", "el sohn dahn-SUHZ", "They're dancers. (fem.)"], ["Ils sont gentils.", "eel sohn zhahn-TEE", "They're kind."], ["Elles sont gentilles.", "el sohn zhahn-TEE-yuh", "They're kind. (fem.)"], ["Elles sont célibataires.", "el sohn say-lee-ba-TAIR", "They're single. (fem.)"]]}]}, {"id": "gr-4", "label": "Chapitre 4", "name": "Je suis, tu es, il est…", "summary": "Être in full, the tu/vous decision, and the two very different jobs of on.", "art": null, "groups": [{"name": "Être, tu/vous, on", "note": "<strong>vous</strong> does two jobs: polite singular, and plural of any register. <strong>tu</strong> is familiar singular only.<br><br><strong>on</strong> also does two: casual 'we' (<em>Jean et moi, on est fatigués</em>) and general 'people' (<em>Quand on est enrhumé, on est fatigué</em>). It always conjugates like <em>il</em>.", "items": [["Vous êtes prêt, monsieur Meyer ?", "voo-ZET PREH, muh-syuh may-AIR", "Are you ready, Mr Meyer? (polite)"], ["Tu es prêt, papa ?", "tew ay PREH, pa-PAH", "Are you ready, dad? (familiar)"], ["Vous êtes prêts ? (messieurs)", "voo-ZET PREH", "Are you ready? (several men)"], ["Vous êtes prêtes ? (mesdames)", "voo-ZET PRET", "Are you ready? (several women)"], ["Jean et moi, on est enrhumés.", "zhahn ay mwah, oh-nay tahn-rew-MAY", "Jean and I have colds. (on = nous)"], ["Quand on est enrhumé, on est fatigué.", "kahn oh-nay tahn-rew-MAY, oh-nay fa-tee-GAY", "When you have a cold, you're tired. (on = people)"], ["Nous sommes contents d'être à Paris.", "noo sum kohn-TAHN detr a pa-REE", "We're happy to be in Paris."], ["Nous sommes désolés d'être en retard.", "noo sum day-zo-LAY detr ahn ruh-TAR", "We're sorry to be late."], ["Quand on est en vacances, on est content.", "kahn oh-nay ahn va-KAHNSS, oh-nay kohn-TAHN", "When you're on holiday, you're happy."], ["Quand on est en retard, on est pressé.", "kahn oh-nay ahn ruh-TAR, oh-nay press-AY", "When you're late, you're in a hurry."]]}]}, {"id": "gr-5", "label": "Chapitre 5", "name": "Est-ce que… ? Non, je ne suis pas…", "summary": "Three ways to ask a yes/no question, and where pas goes.", "art": "nepas", "groups": [{"name": "Poser une question", "note": "Three ways to ask the same yes/no question: rising intonation alone, or <strong>est-ce que</strong> on the front. Both are normal in speech — est-ce que is the safer default while you're building confidence, because it signals 'question' from word one.", "items": [["Vous êtes japonais.", "voo-ZET zha-po-NAY", "You're Japanese. (statement, falling tone)"], ["Vous êtes japonais ?", "voo-ZET zha-po-NAY", "Are you Japanese? (rising tone)"], ["Est-ce que vous êtes japonais ?", "es-kuh voo-ZET zha-po-NAY", "Are you Japanese? (with est-ce que)"], ["Est-ce que Jean est français ?", "es-kuh zhahn ay frahn-SAY", "Is Jean French?"], ["Est-ce que vous êtes étudiant ?", "es-kuh voo-ZET zay-tew-dee-AHN", "Are you a student?"], ["Est-ce que tu es marié ?", "es-kuh tew ay ma-ree-AY", "Are you married?"], ["Est-ce que Marco est blond ?", "es-kuh mar-KO ay BLOHN", "Is Marco blond?"]]}, {"name": "La négation ne… pas", "cols": "two", "items": [["Je ne suis pas content.", "zhuh nuh swee pah kohn-TAHN", "I'm not happy."], ["Elle n'est pas riche.", "el nay pah REESH", "She's not rich."], ["Ils ne sont pas italiens.", "eel nuh sohn pah zee-tal-YAN", "They're not Italian."], ["Je ne suis pas brun.", "zhuh nuh swee pah BRUHN", "I'm not dark-haired."], ["Je ne suis pas français.", "zhuh nuh swee pah frahn-SAY", "I'm not French."], ["Je ne suis pas professeur.", "zhuh nuh swee pah pro-fess-UR", "I'm not a teacher."], ["Le lit n'est pas confortable.", "luh LEE nay pah kohn-for-TAHB-luh", "The bed isn't comfortable."], ["L'eau n'est pas chaude.", "lo nay pah SHOWD", "The water isn't hot."], ["Les chambres ne sont pas chères.", "lay SHAHM-bruh nuh sohn pah SHAIR", "The rooms aren't expensive."], ["Non, il n'est pas blond. Il est brun.", "nohn, eel nay pah BLOHN. eel ay BRUHN", "No, he's not blond. He's dark-haired."]]}]}, {"id": "gr-6", "label": "Chapitre 6", "name": "Je parle, je regarde, j'aime…", "summary": "Regular -ER verbs — the biggest verb family in French, and the one that never lets you down.", "art": null, "groups": [{"name": "Les verbes en -ER", "cols": "two", "note": "<strong>Drop -er, add -e.</strong> That final -e is silent — <em>je parle</em> is said zhuh PARL. And <strong>je → j'</strong> before a vowel or silent h.<br><br>This is the biggest verb family in French. Almost every new verb you meet will follow it.", "items": [["parler → je parle", "zhuh PARL", "to speak → I speak"], ["regarder → je regarde", "zhuh ruh-GARD", "to watch → I watch"], ["manger → je mange", "zhuh MAHNZH", "to eat → I eat"], ["travailler → je travaille", "zhuh tra-VIGH", "to work → I work"], ["téléphoner → je téléphone", "zhuh tay-lay-FON", "to call → I call"], ["écouter → j'écoute", "zhay-KOOT", "to listen → I listen"], ["aimer → j'aime", "zhem", "to love → I love"], ["habiter → j'habite", "zha-BEET", "to live → I live"], ["étudier → j'étudie", "zhay-tew-DEE", "to study → I study"], ["commencer → je commence", "zhuh ko-MAHNSS", "to start → I start"], ["terminer → je termine", "zhuh tair-MEEN", "to finish → I finish"], ["dîner → je dîne", "zhuh DEEN", "to have dinner → I have dinner"]]}, {"name": "Une journée — le modèle", "items": [["Je travaille dans une banque.", "zhuh tra-vigh dahn zewn BAHNK", "I work in a bank."], ["Le matin, je commence à 9 heures.", "luh ma-TAN, zhuh ko-MAHNSS a nuh-VUR", "In the morning I start at 9."], ["Le soir, je termine à 18 heures.", "luh SWAHR, zhuh tair-MEEN a dee-zwee-TUR", "In the evening I finish at 6."], ["À midi, je mange à la cafétéria avec mes collègues.", "a mee-DEE, zhuh MAHNZH a lah ka-fay-tay-REE-a a-vek may ko-LEG", "At noon I eat in the cafeteria with my colleagues."], ["Le soir, je dîne chez moi.", "luh SWAHR, zhuh DEEN shay MWAH", "In the evening I have dinner at home."], ["Après le repas, je regarde la télévision ou j'écoute la radio.", "a-PRAY luh ruh-PAH, zhuh ruh-GARD lah tay-lay-vee-zee-OHN oo zhay-KOOT lah ra-dee-O", "After the meal I watch TV or listen to the radio."], ["J'aime le sport et la musique.", "zhem luh SPOR ay lah mew-ZEEK", "I like sport and music."], ["J'habite à Paris.", "zha-BEET a pa-REE", "I live in Paris."], ["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["J'étudie l'anglais.", "zhay-tew-DEE lahn-GLAY", "I'm studying English."]]}]}]}, {"id": "vocab-prog", "name": "Vocabulaire Progressif", "short": "Vocab. Prog.", "color": "#8C5A2B", "blurb": "Three units of social French: the politeness rituals, the whole family tree with life stages, and the vocabulary of love and feeling.", "lessons": [{"id": "vp-1", "label": "Unité 1", "name": "Les usages, la politesse", "summary": "Greeting, introducing, welcoming, apologising, thanking, congratulating, wishing.", "art": "bise", "groups": [{"name": "Dire bonjour", "items": [["Bonjour, madame / monsieur.", "bohn-ZHOOR, ma-DAM / muh-SYUH", "Hello — during the day."], ["Bonsoir, madame.", "bohn-SWAHR, ma-DAM", "Good evening."], ["Bonjour, ma chère Mathilde !", "bohn-ZHOOR, ma SHAIR", "Hello, my dear Mathilde!"], ["Bonjour, Bénédicte, comment vas-tu ?", "ko-mahn va-TEW", "Hello Bénédicte, how are you?"], ["Bien, merci, et toi ?", "bee-AN, mair-SEE, ay TWAH", "Fine thanks, and you?"], ["Ça va bien, merci.", "sa va bee-AN, mair-SEE", "I'm doing well, thanks."], ["Salut, Mathilde, ça va ?", "sa-LEW, sa VA", "Hi Mathilde, you good?"], ["Tiens, salut ! Ça va, merci, et toi ?", "tee-AN, sa-LEW", "Oh hey! Good thanks, you?"]]}, {"name": "Dire au revoir", "items": [["Au revoir, Diane, à bientôt !", "oh ruh-VWAHR, a bee-an-TO", "Goodbye Diane, see you soon!"], ["Salut, Simon ! À tout à l'heure !", "sa-LEW, a too ta LUR", "Bye Simon! See you in a bit!"], ["Bonsoir, Raphaël, à lundi !", "bohn-SWAHR, a luhn-DEE", "Goodnight Raphaël, see you Monday!"]]}, {"name": "Présenter quelqu'un", "items": [["Je vous présente Florence Dusapin.", "zhuh voo pray-ZAHNT", "Let me introduce Florence Dusapin."], ["Bonjour, madame, enchanté.", "bohn-ZHOOR, ma-DAM, ahn-shahn-TAY", "Hello madam, delighted. (said by a man)"], ["Enchantée, monsieur.", "ahn-shahn-TAY, muh-SYUH", "Delighted. (said by a woman)"], ["Nicolas, est-ce que tu connais ma copine Émilie ?", "es-kuh tew ko-NAY ma ko-PEEN", "Nicolas, do you know my friend Émilie?"], ["Non, pas encore. Bonjour, Émilie.", "nohn, pa zahn-KOR", "No, not yet. Hello, Émilie."]]}, {"name": "Accueillir", "items": [["Entrez, je vous en prie !", "ahn-TRAY, zhuh voo zahn PREE", "Come in, please!"], ["Je peux prendre votre manteau ?", "zhuh puh PRAHN-druh VOT-ruh mahn-TO", "May I take your coat?"], ["Ça me fait plaisir de vous voir !", "sa muh fay play-ZEER duh voo VWAHR", "Lovely to see you!"], ["Asseyez-vous, je vous en prie !", "a-say-yay VOO, zhuh voo zahn PREE", "Please sit down."], ["Je suis content de te voir ! Assieds-toi, je t'en prie !", "zhuh swee kohn-TAHN duh tuh VWAHR", "Glad to see you! Sit down. (familiar)"]]}, {"name": "S'excuser", "items": [["Oh, pardon, madame. Je suis désolé !", "oh, par-DOHN, ma-DAM. zhuh swee day-zo-LAY", "Oh, sorry madam. My apologies!"], ["Ce n'est rien, monsieur !", "suh nay ree-AN", "It's nothing, sir!"], ["Excusez-moi, je suis désolée d'être en retard !", "eks-kew-zay MWAH", "Excuse me, I'm sorry I'm late!"], ["Je vous en prie, ce n'est pas grave.", "zhuh voo zahn PREE, suh nay pah GRAHV", "Not at all, it's fine."]]}, {"name": "Demander et remercier", "items": [["Pardon, madame, vous pouvez me dire où est la poste, s'il vous plaît ?", "par-DOHN … voo poo-VAY muh DEER oo ay lah POST", "Excuse me, could you tell me where the post office is?"], ["C'est au bout de la rue, à droite.", "set oh boo duh lah REW, a DRWAHT", "It's at the end of the street, on the right."], ["Je vous remercie, madame.", "zhuh voo ruh-mair-SEE", "Thank you, madam."], ["Je vous en prie, monsieur.", "zhuh voo zahn PREE", "You're welcome, sir."], ["Tu peux me prêter un euro, s'il te plaît ?", "tew puh muh pray-TAY uhn UR-oh", "Can you lend me a euro, please?"], ["Oui, bien sûr ! Voilà !", "wee, bee-AN SEWR ! vwa-LAH", "Yes of course! Here you go!"], ["Merci beaucoup !", "mair-SEE bo-KOO", "Thanks a lot!"], ["De rien !", "duh ree-AN", "You're welcome!"]]}, {"name": "Féliciter et plaindre", "items": [["Félicitations ! Toutes mes félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Je suis vraiment content pour toi !", "zhuh swee vray-MAHN kohn-TAHN poor TWAH", "I'm really happy for you!"], ["Bravo !", "bra-VO", "Well done!"], ["Tous mes vœux de bonheur !", "too may vuh duh bo-NUR", "Wishing you every happiness! (a wedding)"], ["Oh, mon pauvre Marc ! Tu n'as pas de chance !", "oh, mohn PO-vruh … tew na pah duh SHAHNSS", "Oh, poor Marc! Tough luck!"], ["C'est terrible, c'est affreux, ce n'est pas possible !", "say tair-EE-bluh, set a-FRUH", "That's terrible, that's awful, that can't be!"], ["Je suis désolé pour vous.", "zhuh swee day-zo-LAY poor VOO", "I'm so sorry for you."]]}, {"name": "Souhaiter", "cols": "two", "items": [["Bonne journée !", "bun zhoor-NAY", "Have a good day!"], ["Bonne après-midi !", "bun a-pray-mee-DEE", "Have a good afternoon!"], ["Bonne soirée !", "bun swa-RAY", "Have a good evening!"], ["Bonne nuit ! Dors bien !", "bun NWEE ! dor bee-AN", "Good night, sleep well!"], ["Bon week-end !", "bohn week-END", "Have a good weekend!"], ["Bonnes vacances ! Repose-toi bien !", "bun va-KAHNSS ! ruh-poz-twah bee-AN", "Enjoy your holiday, rest well!"], ["Bon voyage !", "bohn vwa-YAHZH", "Have a good trip!"], ["Bon appétit !", "bohn a-pay-TEE", "Enjoy your meal!"], ["Bon anniversaire ! Joyeux anniversaire !", "bun a-nee-vair-SAIR", "Happy birthday!"], ["Bonne chance !", "bun SHAHNSS", "Good luck!"], ["Joyeux Noël !", "zhwa-YUH no-ELL", "Merry Christmas!"], ["Bonne année ! Tous mes vœux !", "bun a-NAY ! too may VUH", "Happy New Year!"]]}]}, {"id": "vp-2", "label": "Unité 2", "name": "La famille, les périodes de la vie", "summary": "Every relative from grand-père to belle-sœur, plus the stages of a life and how to talk about age.", "art": "tree", "groups": [{"name": "La famille", "cols": "two", "items": [["le mari", "luh ma-REE", "husband"], ["la femme", "lah FAM", "wife / woman"], ["les parents", "lay pa-RAHN", "parents"], ["les enfants", "lay zahn-FAHN", "children"], ["le fils", "luh FEESS", "son"], ["la fille", "lah FEE-yuh", "daughter / girl"], ["le frère", "luh FRAIR", "brother"], ["la sœur", "lah SUR", "sister"], ["le beau-père", "luh bo-PAIR", "father-in-law / stepfather"], ["la belle-mère", "lah bell-MAIR", "mother-in-law / stepmother"], ["la belle-fille", "lah bell-FEE-yuh", "daughter-in-law"], ["le gendre", "luh ZHAHN-druh", "son-in-law"], ["le beau-frère", "luh bo-FRAIR", "brother-in-law"], ["la belle-sœur", "lah bell-SUR", "sister-in-law"], ["les beaux-parents", "lay bo-pa-RAHN", "parents-in-law"], ["les grands-parents", "lay grahn-pa-RAHN", "grandparents"], ["le grand-père", "luh grahn-PAIR", "grandfather"], ["la grand-mère", "lah grahn-MAIR", "grandmother"], ["les petits-enfants", "lay puh-tee-zahn-FAHN", "grandchildren"], ["le petit-fils", "luh puh-tee-FEESS", "grandson"], ["la petite-fille", "lah puh-teet-FEE-yuh", "granddaughter"], ["l'oncle", "LON-kluh", "uncle"], ["la tante", "lah TAHNT", "aunt"], ["le neveu", "luh nuh-VUH", "nephew"], ["la nièce", "lah nee-ESS", "niece"], ["le cousin", "luh koo-ZAN", "cousin (m)"], ["la cousine", "lah koo-ZEEN", "cousin (f)"]]}, {"name": "Les noms familiers", "cols": "three", "items": [["maman", "ma-MAHN", "mum"], ["papa", "pa-PAH", "dad"], ["papi", "pa-PEE", "grandpa"], ["mamie", "ma-MEE", "grandma"], ["tonton", "tohn-TOHN", "uncle (childish)"], ["tatie", "ta-TEE", "auntie"]]}, {"name": "Les périodes de la vie", "cols": "two", "note": "<strong>bébé</strong> is always masculine, even for a girl. <strong>personne</strong> is always feminine, even for a man.<br><br>Careful with <strong>la petite-fille</strong> (granddaughter) versus <strong>une petite fille</strong> (a little girl) — the hyphen and article change everything. And <strong>vieux</strong> sounds blunt; <strong>âgé</strong> is the polite word.", "items": [["un bébé — de 0 à 2 ans", "uhn bay-BAY", "a baby"], ["un enfant — de 2 à 11 ans", "uhn nahn-FAHN", "a child"], ["un adolescent — de 12 à 18 ans", "uhn na-do-lay-SAHN", "a teenager"], ["un adulte — après 18 ans", "uhn na-DEWLT", "an adult"], ["une personne âgée", "ewn pair-SUN a-ZHAY", "an elderly person"], ["un petit garçon / une petite fille", "uhn puh-tee gar-SOHN / ewn puh-teet FEE-yuh", "a little boy / girl"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["J'ai passé mon enfance en Bretagne.", "zhay pa-SAY moh nahn-FAHNSS", "I spent my childhood in Brittany."], ["Il a eu une adolescence heureuse.", "eel a ew ewn a-do-lay-SAHNSS uh-RUHZ", "He had a happy adolescence."], ["Quel âge ont Véronique et Denis ?", "kel AHZH ohn", "How old are Véronique and Denis?"], ["Véronique a 5 ans de moins que Denis.", "… san kahn duh MWAN kuh", "Véronique is 5 years younger than Denis."], ["Denis a 5 ans de plus que sa femme.", "… san kahn duh PLEWSS kuh", "Denis is 5 years older than his wife."], ["Les enfants grandissent.", "lay zahn-FAHN grahn-DEESS", "Children grow."]]}, {"name": "La vie et la mort", "items": [["Aude est née le 28 septembre 1960.", "ohd ay NAY luh van-weet sep-TAHM-bruh", "Aude was born 28 September 1960."], ["Sa date de naissance est le 28/09/60.", "sa dat duh nay-SAHNSS", "Her date of birth is 28/09/60."], ["Elle a son anniversaire le 28 septembre.", "el a soh na-nee-vair-SAIR", "Her birthday is 28 September."], ["Il a perdu sa femme : elle est morte le 10 mai.", "eel a pair-DEW sa FAM : el ay MORT", "He lost his wife: she died on 10 May."], ["Elle est décédée.", "el ay day-say-DAY", "She passed away."]]}]}, {"id": "vp-3", "label": "Unité 3", "name": "L'amour, les émotions", "summary": "Meeting, falling in love, marrying, separating — and the intensity ladder of the verb aimer.", "art": "aimer", "groups": [{"name": "L'amour", "items": [["Il tombe amoureux de Mathilde.", "eel tohnb a-moo-RUH duh", "He falls in love with Mathilde."], ["Elle tombe amoureuse.", "el tohnb a-moo-RUHZ", "She falls in love."], ["Ils s'embrassent.", "eel sahm-BRAHSS", "They kiss."], ["Je t'aime.", "zhuh TEM", "I love you."], ["Ils commencent une relation.", "eel ko-MAHNSS ewn ruh-la-see-OHN", "They start a relationship."], ["Il est célibataire, il vit seul.", "eel ay say-lee-ba-TAIR, eel vee SUL", "He's single, he lives alone."], ["Ils vivent ensemble.", "eel VEEV ahn-SAHM-bluh", "They live together."], ["Il sort avec Mathilde.", "eel sor a-vek", "He's going out with Mathilde."], ["Ils sont amoureux. C'est la passion !", "eel sohn ta-moo-RUH. say lah pa-see-OHN", "They're in love. It's passion!"], ["Ils décident de se marier.", "eel day-SEED duh suh ma-ree-AY", "They decide to get married."], ["un mariage civil / un mariage religieux", "uhn ma-ree-AHZH see-VEEL / ruh-lee-zhee-UH", "a civil / religious wedding"], ["Ils vont à la mairie.", "eel vohn a lah may-REE", "They go to the town hall."], ["une belle robe de mariée", "ewn bell rob duh ma-ree-AY", "a beautiful wedding dress"], ["Ils vivent en couple depuis cinq ans.", "eel veev ahn KOO-pluh duh-PWEE sank ahn", "They've been a couple for five years."]]}, {"name": "Après le mariage", "note": "In France only the <strong>mariage civil</strong> at the mairie has legal force. For an unmarried partner you say <strong>mon ami(e)</strong>, or casually <strong>mon copain / ma copine</strong>. Married, it's <strong>mon mari / ma femme</strong>.", "items": [["Ils vont avoir un enfant.", "eel vohn ta-VWAHR uhn nahn-FAHN", "They're going to have a baby."], ["Ils ont divorcé.", "eel zohn dee-vor-SAY", "They got divorced."], ["Elle a demandé le divorce.", "el a duh-mahn-DAY luh dee-VORSS", "She asked for the divorce."], ["Elle a quitté Gabriel il y a six mois.", "el a kee-TAY … eel ee a see MWAH", "She left Gabriel six months ago."], ["La séparation doit être difficile.", "lah say-pa-ra-see-OHN dwah tet-ruh dee-fee-SEEL", "The separation must be hard."], ["Il est libre, maintenant.", "eel ay LEE-bruh, man-tuh-NAHN", "He's free now."], ["On se disputait beaucoup.", "ohn suh dees-pew-TAY bo-KOO", "We argued a lot."], ["Elle était très jalouse.", "el ay-TAY tray zha-LOOZ", "She was very jealous."], ["Est-ce que tu voudrais te remarier ?", "es-kuh tew voo-DREH tuh ruh-ma-ree-AY", "Would you want to remarry?"]]}, {"name": "Le verbe aimer — l'échelle", "note": "The intensity ladder, and it matters: <strong>j'aime bien</strong> = a friend · <strong>j'aime beaucoup</strong> = a close friend · <strong>j'aime</strong> alone = your romantic partner · <strong>j'adore</strong> = for things.<br><br>Say bare <em>j'aime</em> about a friend and it sounds like a declaration you didn't mean to make.", "items": [["Grégoire aime bien Carine.", "gray-GWAHR em bee-AN", "Grégoire likes Carine — they're friends."], ["Grégoire aime beaucoup Dora.", "gray-GWAHR em bo-KOO", "Grégoire is very fond of Dora."], ["Grégoire aime Juliette.", "gray-GWAHR EM", "Grégoire loves Juliette — romantically."], ["Juliette est la femme de sa vie !", "zhew-lee-ETT ay lah fam duh sa VEE", "Juliette is the love of his life!"], ["J'aime bien le chocolat.", "zhem bee-AN luh sho-ko-LAH", "I quite like chocolate."], ["J'aime beaucoup le chocolat.", "zhem bo-KOO luh sho-ko-LAH", "I really like chocolate."], ["J'adore le chocolat !", "zha-DOR luh sho-ko-LAH", "I love chocolate!"]]}, {"name": "Quelques émotions", "items": [["La joie — les enfants sont joyeux, ils rient.", "lah ZHWAH — zhwa-YUH, eel REE", "Joy — the children are joyful, they laugh."], ["La fierté — les parents sont fiers de leurs enfants.", "lah fee-air-TAY — fee-AIR", "Pride — the parents are proud of their children."], ["La tristesse — elle est très malheureuse, elle pleure.", "lah trees-TESS — mal-uh-RUHZ, el PLUR", "Sadness — she's very unhappy, she cries."], ["Elle a beaucoup de chagrin.", "el a bo-KOO duh sha-GRAN", "She's deeply grieving."], ["La colère — sa mère est furieuse contre lui.", "lah ko-LAIR — few-ree-UHZ", "Anger — his mother is furious with him."], ["Elle est en colère contre lui.", "el et ahn ko-LAIR kohn-truh LWEE", "She's angry with him."], ["La peur — il a eu très peur.", "lah PUR — eel a ew tray PUR", "Fear — he was very frightened."], ["La surprise — il est surpris, étonné.", "lah sewr-PREEZ — sewr-PREE, ay-to-NAY", "Surprise — he's surprised, astonished."], ["une bonne surprise / une mauvaise surprise", "ewn bun sewr-PREEZ / ewn mo-VEZ sewr-PREE const LESSONS=[], FLAT=[];
DATA.forEach(sec=>{
  sec.count=0;
  sec.lessons.forEach(les=>{
    les.section=sec;
    les.count=les.groups.reduce((a,g)=>a+(g.items?g.items.length:0)+(g.pages?g.pages.length:0)+(g.tracks?g.tracks.length:0),0);
    sec.count+=les.count;
    LESSONS.push(les);
    les.groups.forEach(g=>(g.items||[]).forEach(it=>{
      FLAT.push({it,les,group:g.name,key:it[0]+'|'+(it[2]||'')});
    }));
  });
});
const lessonById=id=>LESSONS.find(l=>l.id===id);
const TOTAL=FLAT.length;
