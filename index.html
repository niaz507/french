17 heures.", "lay koor poor ahn-FAHN", "The children's classes are at:"], ["5. Quelle est la qualité du professeur ?", "kel ay lah ka-lee-TAY dew pro-fay-SUR", "What is the teacher's good quality?"]], "note": "Everything you need is from this dossier: the leisure activities, the days of the week, telling the time, ages, and the adjectives for describing a person."}, {"name": "Page 78 — Compréhension de l'oral, exercice 2 (10 points)", "items": [["Exercice 2 — 10 points", "eg-zair-SEESS DUH", "Exercise 2"], ["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN", "Read the questions. Listen twice then answer."], ["1. Qui téléphone ? a. un médecin b. un secrétaire c. un mari", "kee tay-lay-FON", "Who is phoning? a doctor, a secretary, a husband"], ["2. Le rendez-vous est pour : a. Madame Lebon. b. Mademoiselle Lebon. c. Monsieur Lebon.", "luh rahn-day-VOO ay poor", "The appointment is for:"], ["3. Lisez la fiche. Complétez avec les informations entendues.", "lee-ZAY lah FEESH. kohm-play-TAY", "Read the card. Complete it with what you hear."], ["Message téléphonique", "muh-SAHZH tay-lay-fo-NEEK", "Telephone message"], ["Date du message : …", "dat dew muh-SAHZH", "Date of the message"], ["Nom : Lebon", "luh-BOHN", "Name"], ["Problème de santé : mal … et … + …", "pro-BLEM duh sahn-TAY : MAL", "Health problem: pain in… and… plus…"], ["Visite à domicile : ☐ oui ☐ non", "vee-ZEET a do-mee-SEEL", "Home visit: yes / no"], ["Tél : 05 .. .. .. ..", "tay-lay-FON", "Phone"]], "note": "The card is filled in from the recording. Note the phrase <strong>une visite à domicile</strong> — a home visit by the doctor, still common in France."}, {"name": "Page 78 — Production écrite (15 points)", "items": [["Production écrite — 15 points", "lah pro-dewk-see-OHN ay-KREET", "Written production — 15 points"], ["Vous êtes en vacances avec votre famille.", "voo zet ahn va-KAHNSS a-vek VOT-ruh fa-MEE", "You're on holiday with your family."], ["Écrivez une carte postale à un(e) ami(e) :", "ay-kree-VAY ewn kart pos-TAL a uh na-MEE", "Write a postcard to a friend:"], ["dites où vous êtes, avec qui et quelles sont vos activités.", "deet oo voo ZET, a-vek KEE ay kel sohn vo zak-tee-vee-TAY", "say where you are, who with, and what your activities are."], ["40 à 50 mots", "ka-RAHNT a san-KAHNT MO", "40 to 50 words"], ["Modèle : Chère Sophie, Je suis en vacances à la montagne avec mes parents et ma sœur.", "shair so-FEE … a lah mohn-TAN-yuh", "A model: Dear Sophie, I'm on holiday in the mountains with my parents and my sister."], ["Il fait très beau ! Je fais de la randonnée et du vélo, ma sœur fait de l'escalade.", "eel fay tray BO … zhuh fay duh lah rahn-do-NAY", "The weather's lovely! I hike and cycle, my sister climbs."], ["Le soir, nous faisons des barbecues. C'est génial ! Bisous, …", "luh SWAHR, noo fuh-ZOHN day bar-buh-KEW", "In the evening we have barbecues. It's brilliant! Kisses, …"]], "note": "Two holiday photos are printed beside the blank postcard — a beach with palm trees and a green mountain. The task combines three things you've now covered: the postcard format from Dossier 2, the family words from Leçon 3, and <em>faire</em> + activity from Leçon 1."}, {"name": "Le vocabulaire de l'examen", "items": [["la compréhension de l'oral", "lah kohm-pray-ahn-see-OHN duh lo-RAL", "listening comprehension"], ["la production écrite", "lah pro-dewk-see-OHN ay-KREET", "written production"], ["un exercice", "uh neg-zair-SEESS", "an exercise"], ["15 points / 5 points / 10 points", "kanz PWAN", "the marks"], ["un cours pour adultes", "uhn koor poor a-DEWLT", "an adult class"], ["un cours pour enfants", "uhn koor poor ahn-FAHN", "a children's class"], ["un médecin", "uhn mayd-SAN", "a doctor"], ["un secrétaire / une secrétaire", "uhn suh-kray-TAIR", "a secretary"], ["un rendez-vous", "uhn rahn-day-VOO", "an appointment"], ["un problème de santé", "uhn pro-BLEM duh sahn-TAY", "a health problem"], ["une visite à domicile", "ewn vee-ZEET a do-mee-SEEL", "a home visit"], ["une fiche", "ewn FEESH", "a card, a form"], ["un message téléphonique", "uhn muh-SAHZH tay-lay-fo-NEEK", "a phone message"]], "cols": "two"}]}, {"id": "ae-d4l1", "label": "Dossier 4 · Leçon 1", "name": "Au fil des heures", "summary": "Pages 79–83, complete. The three opening-hours signs, official versus conversational time, devoir and il faut, the Gontrand family's media habits, reflexive verbs, the TV listings and French internet use.", "art": null, "bookpages": ["p079", "p080", "p081", "p082", "p083"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 1, in page order.", "tracks": [{"n": 108, "label": "p.80 act. 1, 3, 4, 5 — le dialogue de Julien et Pauline"}, {"n": 109, "label": "p.80 act. 2, 3, 4, 5 — les messages"}, {"n": 110, "label": "p.81 act. 6 — les jours et horaires d'ouverture"}, {"n": 111, "label": "p.81 act. 7 — identifiez les heures"}, {"n": 112, "label": "p.81 act. 8 — phonétique, identique ou différente ?"}, {"n": 113, "label": "p.81 act. 8 — écoutez et répétez"}, {"n": 114, "label": "p.81 act. 8 — quelle heure entendez-vous ?"}]}, {"name": "Page 79 — la page d'ouverture du dossier", "items": [["Dossier 4 — À chacun son rythme", "a sha-KUHN sohn REETM", "Dossier 4 — To each their own rhythm"], ["Leçon 1 : Au fil des heures", "oh feel day ZUR", "Lesson 1: As the hours go by"], ["> Indiquer l'heure et les horaires", "an-dee-KAY LUR ay lay zo-RAIR", "Telling the time and giving opening hours"], ["> Parler de ses habitudes", "par-LAY duh say za-bee-TEWD", "Talking about your habits"], ["Leçon 2 : Rendez-vous", "rahn-day-VOO", "Lesson 2: Meeting up"], ["> Proposer une sortie", "pro-po-ZAY ewn sor-TEE", "Suggesting an outing"], ["> Inviter", "an-vee-TAY", "Inviting"], ["Leçon 3 : Au jour le jour", "oh zhoor luh ZHOOR", "Lesson 3: Day by day"], ["> Parler de ses activités quotidiennes", "par-LAY duh say zak-tee-vee-TAY ko-tee-dee-EN", "Talking about your daily activities"], ["> Raconter des événements passés", "ra-kohn-TAY day zay-vayn-MAHN pa-SAY", "Recounting past events"], ["Carnet de voyage : Il faut faire…", "eel fo FAIR", "Travel notebook: You have to…"], ["Vers le DELF A1", "vair luh DELF", "Towards the DELF A1"], ["Projet : Organiser une journée de sorties", "or-ga-nee-ZAY ewn zhoor-NAY duh sor-TEE", "Project: organise a day of outings"], ["Phonie-graphie → activités 1 et 2 p. 192", "fo-nee-gra-FEE", "Sound-and-spelling"], ["Lexique thématique → p. 199", "lek-SEEK tay-ma-TEEK", "Thematic lexicon"]], "note": "The opener photographs a spread of coloured wristwatches and a cluster of hanging pocket watches — time as the theme of the whole dossier."}, {"name": "Page 80 — les trois panneaux d'horaires", "items": [["Au fil des heures", "oh feel day ZUR", "As the hours go by"], ["Indiquer l'heure et les horaires", "an-dee-KAY LUR ay lay zo-RAIR", "Telling the time and giving opening hours"], ["Panneau a — HORAIRES", "o-RAIR", "Sign a — Opening hours"], ["Ouvert du lundi au vendredi de 8 h 30 à 18 h 30", "oo-VAIR dew luhn-DEE oh vahn-druh-DEE", "Open Monday to Friday from 8.30 to 18.30"], ["Le samedi de 8 h 30 à 12 h 00", "luh sam-DEE", "Saturday from 8.30 to 12.00"], ["Fermé le dimanche", "fair-MAY luh dee-MAHNSH", "Closed on Sundays"], ["Panneau b — Horaires du magasin", "o-RAIR dew ma-ga-ZAN", "Sign b — Shop hours"], ["du mardi au samedi", "dew mar-DEE oh sam-DEE", "Tuesday to Saturday"], ["le dimanche", "luh dee-MAHNSH", "Sunday"], ["Fermé le dimanche après-midi et le lundi", "fair-MAY luh dee-MAHNSH a-pray-mee-DEE ay luh luhn-DEE", "Closed Sunday afternoon and Monday"], ["Panneau c — HORAIRES D'OUVERTURE", "o-RAIR doo-vair-TEWR", "Sign c — Opening hours"], ["du mardi au samedi : 7 H 30 – 12 H 30 · 15 H 00 – 19 H 00", "dew mar-DEE oh sam-DEE", "Tuesday to Saturday, with a midday closing"], ["Fermé le dimanche et le lundi", "fair-MAY luh dee-MAHNSH ay luh luhn-DEE", "Closed Sunday and Monday"]], "note": "Sign <strong>b</strong> shows the times on clock faces rather than in figures. Sign <strong>c</strong> has the classic French <em>coupure de midi</em> — the long lunchtime closing between 12.30 and 15.00."}, {"name": "Page 80 — activités 1, 2 et 3", "items": [["Activité 1 : Écoutez le dialogue et répondez.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue and answer."], ["1. Où sont Julien et Pauline ? dans un bureau / à la poste / à la maison", "oo sohn zhew-lee-AN ay po-LEEN", "Where are Julien and Pauline?"], ["2. Quand ? le matin / l'après-midi / le soir", "KAHN", "When?"], ["3. Ils parlent de quoi ? de prix / de travail / d'horaires", "eel parl duh KWAH", "What are they talking about?"], ["Activité 2 : Écoutez les messages et identifiez la situation : qui parle à qui ? quand ? pourquoi ?", "… kee parl a KEE ? kahn ? poor-KWAH", "Listen to the messages: who's speaking to whom? when? why?"], ["Activité 3 : Réécoutez le dialogue et les messages et observez les trois panneaux.", "ray-ay-koo-TAY … ay ob-sair-VAY lay trwah pa-NO", "Listen again and look at the three signs."], ["Dites quel panneau correspond : au pressing, à la boulangerie, à la poste.", "… oh pray-SEENG, a lah boo-lahn-ZHREE, a lah POST", "Say which sign matches the dry cleaner's, the bakery, the post office."]], "note": "The three signs match by their closing patterns: the <strong>poste</strong> keeps Monday-to-Friday office hours (sign a), the <strong>boulangerie</strong> closes Sunday afternoon and Monday (sign b), and the <strong>pressing</strong> has the long midday break (sign c)."}, {"name": "Page 80 — activités 4 et 5", "items": [["Activité 4 : Réécoutez. Associez les créneaux horaires et les lieux pour reconstituer la journée de Julien.", "… lay kray-NO o-RAIR ay lay lee-UH", "Match the time slots to the places to reconstruct Julien's day."], ["avant 9 h 15", "a-VAHN nuh vur kanz", "before 9.15"], ["9 h 15 – 18 h 00", "duh nuh vur kanz a dee-zwee TUR", "9.15 – 18.00"], ["18 h 30 – 19 h 00", "dee-zwee UR trahnt", "18.30 – 19.00"], ["19 h 15 – 20 h 00", "deez-nuh vur KANZ", "19.15 – 20.00"], ["au bureau", "oh bew-RO", "at the office"], ["à la boulangerie", "a lah boo-lahn-ZHREE", "at the bakery"], ["à la poste", "a lah POST", "at the post office"], ["au pressing", "oh pray-SEENG", "at the dry cleaner's"], ["Activité 5 : Réécoutez et observez les panneaux. Repérez comment les horaires sont donnés à l'oral et à l'écrit.", "… a lo-RAL ay a lay-KREE", "Note how the times are given in speech and in writing."], ["un créneau horaire", "uhn kray-NO o-RAIR", "a time slot"]]}, {"name": "Page 80 — Point Langue : l'heure officielle et l'heure de la conversation", "items": [["Heure officielle / formelle → Heure dans la conversation", "UR o-fee-see-ELL → UR dahn lah kohn-vair-sa-see-OHN", "Official time → conversational time"], ["Il est 6 heures. → Il est 6 heures du matin.", "eel ay see ZUR dew ma-TAN", "6 a.m."], ["Il est 18 heures. → Il est 6 heures du soir.", "eel ay see ZUR dew SWAHR", "6 p.m."], ["Il est 22 heures. → Il est 10 heures.", "eel ay dee ZUR", "10 p.m."], ["Il est 12 heures. → Il est midi.", "eel ay mee-DEE", "midday"], ["Il est 0 heure. → Il est minuit.", "eel ay mee-NWEE", "midnight"], ["Il est 5 h 10. → Il est cinq heures dix.", "eel ay san kur DEESS", "five past five"], ["Il est 19 h 15. → Il est sept heures et quart.", "eel ay set ur ay KAR", "quarter past seven"], ["Il est 18 h 30. → Il est six heures et demie.", "eel ay see zur ay duh-MEE", "half past six"], ["Il est 1 h 40. → Il est 2 heures moins vingt.", "eel ay duh zur mwan VAN", "twenty to two"], ["Il est 1 h 45. → Il est 2 heures moins le quart.", "eel ay duh zur mwan luh KAR", "quarter to two"]], "note": "Two systems side by side. The <strong>24-hour clock</strong> is used for timetables, appointments and anything official; in conversation the French switch to the <strong>12-hour</strong> forms with <em>et quart, et demie, moins vingt, moins le quart</em> — and add <em>du matin, du soir</em> only when it's genuinely unclear.", "cols": "two"}, {"name": "Page 80 — Point Langue : régularité et période", "items": [["b) Lisez les panneaux et complétez.", "lee-ZAY lay pa-NO ay kohm-play-TAY", "Read the signs and complete."], ["Pour exprimer une régularité : Fermé LE dimanche après-midi et LE lundi.", "poor eks-pree-MAY ewn ray-gew-la-ree-TAY", "To express a regular occurrence: use LE + day."], ["Pour exprimer une période de temps : DE 8 h 30 À 18 h 30 ; DU lundi AU vendredi.", "poor eks-pree-MAY ewn pay-ree-OD duh TAHN", "To express a period: DE… À… for times, DU… AU… for days."]], "note": "The distinction to hold on to: <strong>le lundi</strong> means <em>every Monday</em>, while <strong>lundi</strong> on its own means <em>this coming Monday</em>. And note that <em>de… à…</em> becomes <strong>du… au…</strong> before a masculine day name."}, {"name": "Page 81 — Point Langue : devoir et il faut", "items": [["Devoir et Il faut pour exprimer une obligation", "duh-VWAHR ay eel FO poor eks-pree-MAY ew no-blee-ga-see-OHN", "Devoir and il faut for expressing obligation"], ["Observez les phrases suivantes extraites des enregistrements puis choisissez l'information correcte.", "ob-sair-VAY lay frahz swee-VAHNT", "Look at these sentences from the recordings then choose the correct statement."], ["Il faut aller à la poste.", "eel fo a-LAY a lah POST", "Someone has to go to the post office."], ["Il faut acheter du pain.", "eel fo ash-TAY dew PAN", "Bread has to be bought."], ["Je dois être au bureau à 9 heures.", "zhuh dwah zEH-truh oh bew-RO a nuh VUR", "I have to be at the office at 9."], ["Tu dois prendre ton costume.", "tew dwah PRAHN-druh tohn kos-TEWM", "You have to take your suit."], ["— On précise la personne avec : ✓ le verbe DEVOIR", "ohn pray-SEEZ lah pair-SUN", "You specify the person with devoir."], ["— Après il faut et devoir, le verbe est : ✓ à l'infinitif.", "a lan-fee-nee-TEEF", "After il faut and devoir, the verb is in the infinitive."], ["Devoir au présent : je dois, tu dois, il/elle doit, nous devons, vous devez, ils/elles doivent.", "zhuh DWAH, tew DWAH, eel DWAH, noo duh-VOHN, voo duh-VAY, eel DWAHV", "devoir in the present"], ["Une seule forme pour falloir : Il faut.", "ewn sul FORM poor fa-LWAHR : eel FO", "falloir has only one form: il faut."]], "note": "The choice between them is about <strong>who</strong>. <em>Il faut</em> is impersonal — a general necessity with nobody named. <em>Devoir</em> pins the obligation on a person. The cartoon on the page shows a man rushing up to a bakery that has just closed.", "cols": "two"}, {"name": "Page 81 — activités 6 et 7", "items": [["Activité 6 a) Écoutez et notez les jours et les horaires d'ouverture.", "… lay ZHOOR ay lay zo-RAIR doo-vair-TEWR", "Listen and note the days and opening hours."], ["b) Pour chaque enregistrement, identifiez le lieu.", "… ee-dahn-tee-fee-AY luh lee-UH", "For each recording, identify the place."], ["une banque", "ewn BAHNK", "a bank"], ["un magasin de vêtements", "uhn ma-ga-ZAN duh vet-MAHN", "a clothes shop"], ["un grand magasin", "uhn grahn ma-ga-ZAN", "a department store"], ["Activité 7 : Écoutez l'enregistrement et identifiez les heures.", "… ay ee-dahn-tee-fee-AY lay ZUR", "Listen and identify the times."], ["8 h 15 — huit heures et quart", "wee tur ay KAR", "quarter past eight"], ["10 h 50 — onze heures moins dix", "ohn zur mwan DEESS", "ten to eleven"], ["12 h 30 — midi et demie", "mee-DEE ay duh-MEE", "half past twelve"], ["13 h 45 — deux heures moins le quart", "duh zur mwan luh KAR", "quarter to two"], ["16 h 35 — cinq heures moins vingt-cinq", "san kur mwan van-SANK", "twenty-five to five"], ["19 h 20 — sept heures vingt", "set ur VAN", "twenty past seven"], ["22 h 40 — onze heures moins vingt", "ohn zur mwan VAN", "twenty to eleven"], ["0 h 10 — minuit dix", "mee-nwee DEESS", "ten past midnight"]], "cols": "two"}, {"name": "Page 81 — Aide-mémoire : demander l'heure et les horaires", "items": [["Quelle heure est-il ?", "kel ur ay TEEL", "What time is it?"], ["Vous avez l'heure, s'il vous plaît ?", "voo za-VAY LUR, seel voo PLAY", "Do you have the time, please?"], ["La poste ouvre / ferme à quelle heure ?", "lah post OO-vruh / FAIRM a kel UR", "What time does the post office open / close?"], ["Quels sont les / vos horaires d'ouverture, s'il vous plaît ?", "kel sohn lay / vo zo-RAIR doo-vair-TEWR", "What are your opening hours, please?"]]}, {"name": "Page 81 — activité 8 : phonétique", "items": [["a) Prononciation identique ou différente ? Écoutez les nombres et répondez.", "pro-nohn-see-a-see-OHN ee-dahn-TEEK oo dee-fay-RAHNT", "Same or different pronunciation? Listen to the numbers."], ["Exemple : 1 → prononciation différente", "dee-fay-RAHNT", "the worked example"], ["b) Écoutez et répétez.", "ay-koo-TAY ay ray-pay-TAY", "Listen and repeat."], ["c) Quelle heure entendez-vous ? Écoutez et choisissez.", "kel ur ahn-tahn-day VOO", "Which time do you hear? Listen and choose."], ["1. Il est deux heures. / Il est douze heures.", "eel ay duh ZUR / eel ay doo ZUR", "two o'clock / twelve o'clock"], ["2. Il est sept heures. / Il est seize heures.", "eel ay se TUR / eel ay say ZUR", "seven / sixteen"], ["3. Il est trois heures. / Il est treize heures.", "eel ay trwa ZUR / eel ay tray ZUR", "three / thirteen"], ["4. Il est cinq heures. / Il est quinze heures.", "eel ay san KUR / eel ay kan ZUR", "five / fifteen"], ["5. Il est six heures. / Il est seize heures.", "eel ay see ZUR / eel ay say ZUR", "six / sixteen"], ["6. Il est dix heures. / Il est six heures.", "eel ay dee ZUR / eel ay see ZUR", "ten / six"]], "note": "Every pair is a genuine trap on the telephone: <strong>deux/douze</strong>, <strong>sept/seize</strong>, <strong>trois/treize</strong>, <strong>cinq/quinze</strong>, <strong>six/seize</strong>, <strong>dix/six</strong>. The liaison with <em>heures</em> makes them even closer."}, {"name": "Page 81 — Point Culture : les rythmes de la ville", "items": [["Les rythmes de la ville", "lay REETM duh lah VEEL", "The city's rhythms"], ["A. Regardez les panneaux p. 80 et répondez.", "ruh-gar-DAY lay pa-NO", "Look at the signs on p.80 and answer."], ["Qu'est-ce que vous remarquez sur les jours de fermeture ? Et sur les horaires ?", "kes-kuh voo ruh-mar-KAY sewr lay zhoor duh fair-muh-TEWR", "What do you notice about the closing days? And the hours?"], ["→ Beaucoup de commerces ferment le dimanche et le lundi ; beaucoup ferment aussi à midi.", "… FAIRM luh dee-MAHNSH ay luh luhn-DEE", "Many shops close Sunday and Monday; many also close at midday."], ["B. Comparez avec votre pays.", "kohm-pa-RAY a-vek VOT-ruh pay-EE", "Compare with your country."], ["un jour de fermeture", "uhn zhoor duh fair-muh-TEWR", "a closing day"], ["la coupure de midi", "lah koo-PEWR duh mee-DEE", "the midday closing"]]}, {"name": "Page 81 — activité 9", "items": [["Jouez la scène à deux devant le groupe.", "zhoo-AY lah sen a DUH", "Act out the scene in pairs in front of the group."], ["Vous demandez les horaires dans un magasin ou service.", "voo duh-mahn-DAY lay zo-RAIR", "You ask for the opening hours of a shop or service."], ["À partir des horaires, le groupe devine le lieu.", "a par-TEER day zo-RAIR, luh groop duh-VEEN luh lee-UH", "From the hours, the group guesses the place."]]}, {"name": "Page 82 — l'article de TVMag", "items": [["Parler de ses habitudes", "par-LAY duh say za-bee-TEWD", "Talking about your habits"], ["TVMag — du 12 au 18 janvier — Les médias et vous…", "lay may-dee-AH ay VOO", "the magazine, its dates, and the feature title"], ["Les (multi)médias rythment votre journée !", "lay mewl-tee-may-dee-AH REETM VOT-ruh zhoor-NAY", "The (multi)media set the rhythm of your day!"], ["Le multimédia occupe une place de plus en plus importante dans notre vie.", "luh mewl-tee-may-dee-AH o-KEWP ewn plahss duh plew zahn plew zan-por-TAHNT", "Multimedia takes an ever more important place in our lives."], ["92 % des internautes en France se connectent chaque jour,", "kat-ruh-van-DOOZ poor sahn day zan-tair-NOT … suh ko-NEKT shak ZHOOR", "92% of internet users in France go online every day,"], ["mais la télévision et la radio restent des médias privilégiés.", "may lah tay-lay-vee-zee-OHN ay lah ra-dee-O rest day may-dee-AH pree-vee-lay-ZHAY", "but television and radio remain favoured media."], ["Le témoignage de la famille Gontrand illustre cette réalité.", "luh tay-mwa-NYAHZH duh lah fa-MEE gohn-TRAHN ee-LEWS-truh set ray-a-lee-TAY", "The Gontrand family's account illustrates this."]]}, {"name": "Page 82 — Nicolas Gontrand, le père, 45 ans", "items": [["À la maison, tous les médias sont importants : la télé, la radio, Internet…", "a lah may-ZOHN, too lay may-dee-AH sohn tan-por-TAHN", "At home all the media matter: TV, radio, internet…"], ["Cela dépend des personnes et des moments de la journée.", "suh-LAH day-PAHN day pair-SUN ay day mo-MAHN", "It depends on the person and the time of day."], ["Le matin, j'allume la radio quand je me réveille, à 7 heures.", "luh ma-TAN, zha-LEWM lah ra-dee-O kahn zhuh muh ray-VAY", "In the morning I switch the radio on when I wake up, at 7."], ["Ensuite, ma femme Nathalie et moi, nous nous préparons tranquillement", "ahn-SWEET … noo noo pray-pa-ROHN trahn-keel-MAHN", "Then my wife Nathalie and I get ready calmly"], ["et notre fils de 11 ans prend le petit déjeuner devant la télé, jusqu'à 8 heures.", "… prahn luh puh-tee day-zhuh-NAY duh-VAHN lah tay-LAY, zhews-KA wee TUR", "and our 11-year-old son has breakfast in front of the TV until 8."], ["Le soir, il regarde un peu la télé ou joue sur l'ordinateur mais il se couche tôt.", "luh SWAHR … may zeel suh koosh TOH", "In the evening he watches a bit of TV or plays on the computer but goes to bed early."], ["Avec ma femme, nous regardons toujours le 20 heures.", "… luh van TUR", "With my wife we always watch the eight o'clock news."], ["Ensuite, quand il y a un bon film, nous regardons la télé ensemble.", "… noo ruh-gar-DOHN lah tay-LAY ahn-SAHM-bluh", "Then, when there's a good film, we watch TV together."], ["Mais, quand il y a un match, ma femme préfère aller sur Internet :", "may, kahn teel ee a uhn MATCH, ma fam pray-FAIR", "But when there's a match, my wife prefers to go online:"], ["elle regarde ses mails, elle surfe, elle fait des achats ou des réservations en ligne…", "el ruh-GARD say MAIL, el SEURF, el fay day za-SHA … ahn LEEN-yuh", "she checks her emails, surfs, shops or books online…"], ["Et moi, je reste devant la télé, je suis un fan de foot !", "ay MWAH, zhuh rest duh-VAHN lah tay-LAY", "And me, I stay in front of the TV — I'm a football fan!"], ["Notre grande fille, elle, passe la soirée dans sa chambre, devant son ordinateur.", "NOT-ruh grahnd FEE, el, pahss lah swa-RAY dahn sa SHAHM-bruh", "Our eldest daughter spends the evening in her room, at her computer."]]}, {"name": "Page 82 — Morgane, la fille, 20 ans", "items": [["Je ne regarde pas la télé ! Le soir, j'allume l'ordi quand je rentre :", "zhuh nuh ruh-gard pah lah tay-LAY … zha-LEWM lor-DEE kahn zhuh RAHN-truh", "I don't watch TV! In the evening I switch the computer on when I get in:"], ["je me connecte sur Facebook, je regarde des vidéos, j'écoute de la musique sur Internet…", "zhuh muh ko-NEKT … zhay-KOOT duh lah mew-ZEEK", "I log on to Facebook, watch videos, listen to music online…"], ["Je me couche tard, vers une heure du matin.", "zhuh muh koosh TAR, vair ew nur dew ma-TAN", "I go to bed late, around one in the morning."]]}, {"name": "Page 82 — Maël, le fils, 11 ans", "items": [["Le matin, je regarde les clips sur M6 avant l'école.", "luh ma-TAN, zhuh ruh-GARD lay KLEEP … a-VAHN lay-KOL", "In the morning I watch music videos on M6 before school."], ["Après l'école, je m'amuse jusqu'à 6 heures :", "a-PRAY lay-KOL, zhuh ma-MEWZ zhews-KA see ZUR", "After school I have fun until 6:"], ["je regarde des dessins animés et des séries à la télé ou je vais sur Internet et je joue en ligne.", "… day day-SAN a-nee-MAY ay day say-REE … zhuh zhoo ahn LEEN-yuh", "I watch cartoons and series on TV or go online and play games."], ["Après, je fais mes devoirs.", "a-PRAY, zhuh fay may duh-VWAHR", "Afterwards I do my homework."]]}, {"name": "Page 82 — Colette, la grand-mère, 70 ans", "items": [["Je me réveille vers 6 h 30 et j'allume la télé.", "zhuh muh ray-VAY vair see zur trahnt ay zha-LEWM lah tay-LAY", "I wake around 6.30 and turn the TV on."], ["D'abord, je regarde les informations, puis il y a mon émission de cuisine préférée.", "da-BOR, zhuh ruh-GARD lay zan-for-ma-see-OHN, pwee zeel ee a moh nay-mee-see-OHN duh kwee-ZEEN pray-fay-RAY", "First I watch the news, then there's my favourite cookery programme."], ["L'après-midi, je regarde mon feuilleton à 14 heures, je me repose", "la-pray-mee-DEE, zhuh ruh-GARD mohn fuh-yuh-TOHN … zhuh muh ruh-POZ", "In the afternoon I watch my soap at 2, I rest"], ["ou je vais sur Internet pour écrire à ma famille et mes amis qui habitent loin, je m'informe…", "… poor ay-KREER a ma fa-MEE … zhuh man-FORM", "or go online to write to my family and friends who live far away, I keep informed…"], ["Le soir, je regarde les actualités puis je choisis un bon film ou un documentaire intéressant.", "luh SWAHR, zhuh ruh-GARD lay zak-tew-a-lee-TAY pwee zhuh shwa-ZEE", "In the evening I watch the news then choose a good film or an interesting documentary."], ["Mais souvent, je m'endors devant l'écran !", "may soo-VAHN, zhuh mahn-DOR duh-VAHN lay-KRAHN", "But often I fall asleep in front of the screen!"]]}, {"name": "Page 82 — activité 10 et la statistique", "items": [["a) Lisez le titre et l'introduction de cet article de magazine. Identifiez le thème de l'article.", "lee-ZAY luh TEE-truh ay lan-tro-dewk-see-OHN", "Read the title and introduction. Identify the theme."], ["→ La place des médias — télé, radio, Internet — dans la journée des Français.", "lah plahss day may-dee-AH", "The place of media in French people's day."], ["b) Lisez les témoignages de la famille Gontrand et le résultat de l'enquête ci-dessous.", "… luh ray-zewl-TAH duh lahn-KET", "Read the accounts and the survey result below."], ["Situez les cinq personnes par rapport à la moyenne nationale.", "see-tew-AY lay sank pair-SUN par ra-POR a lah mwa-YEN na-see-o-NAL", "Place the five people in relation to the national average."], ["Les Français âgés de plus de 4 ans regardent la télévision en moyenne 3 heures et 38 minutes par jour.", "lay frahn-SAY a-ZHAY duh plew duh katr AHN … ahn mwa-YEN", "French people over 4 watch television on average 3 hours 38 minutes a day."], ["Source : Stratégies - 6 avril 2010", "SOORSS", "the source"], ["→ Colette est au-dessus de la moyenne ; Morgane est très en dessous (elle ne regarde pas la télé).", "oh-duh-SEW / ahn duh-SOO", "Colette is above average; Morgane far below."]]}, {"name": "Page 82 — activité 11 : le programme de télévision", "items": [["Regardez le programme de télévision et choisissez des émissions pour Nicolas, Nathalie, Morgane, Maël et Colette. Justifiez.", "ruh-gar-DAY luh pro-GRAM duh tay-lay-vee-zee-OHN", "Look at the TV listings and choose programmes for each person."], ["Programme du jeudi 11 mai — France 2", "pro-GRAM dew zhuh-DEE ohnz MAY", "Thursday 11 May listings"], ["6 h 30 Télématin — Journal", "tay-lay-ma-TAN", "breakfast news"], ["7 h 30 Ludo — Magazine jeunesse", "lew-DO — ma-ga-ZEEN zhuh-NESS", "children's magazine"], ["8 h 00 Julie cuisine — Magazine culinaire", "zhew-LEE kwee-ZEEN — ma-ga-ZEEN kew-lee-NAIR", "cookery magazine"], ["9 h 10 Des jours et des vies — Feuilleton", "day zhoor ay day VEE — fuh-yuh-TOHN", "soap opera"], ["9 h 55 Amour, gloire et beauté — Feuilleton", "a-MOOR, GLWAHR ay bo-TAY", "soap opera"], ["10 h 55 C'est au programme — Magazine", "set oh pro-GRAM", "magazine"], ["11 h 30 Brothers & Sisters — Série", "say-REE", "series"], ["12 h Les 12 coups de midi — Jeu", "lay dooz koo duh mee-DEE — ZHUH", "game show"], ["12 h 55 Météo", "may-tay-O", "weather"], ["13 h Le journal", "luh zhoor-NAL", "the news"], ["14 h Plus belle la vie — Feuilleton", "plew bell lah VEE", "soap opera"], ["15 h Camping Paradis — Téléfilm", "tay-lay-FEELM", "TV film"], ["16 h 35 Les Simpson's — Dessin animé", "day-SAN a-nee-MAY", "cartoon"], ["17 h 15 Les experts - Miami — Série", "say-REE", "series"], ["17 h 55 Top 10 — Magazine musical", "ma-ga-ZEEN mew-zee-KAL", "music magazine"], ["18 h 15 Julie Lescaut — Série", "say-REE", "series"], ["19 h 15 Des chiffres et des lettres — Jeu", "day SHEE-fruh ay day LET-ruh", "word and numbers game"], ["20 h Journal", "zhoor-NAL", "the eight o'clock news"], ["20 h 35 Météo", "may-tay-O", "weather"], ["20 h 45 Le nom des gens — Film", "luh nohn day ZHAHN", "film"], ["22 h 30 C'est ma terre — Magazine", "say ma TAIR", "magazine"], ["23 h 45 Le journal de la nuit", "luh zhoor-NAL duh lah NWEE", "the late news"]], "note": "Matching them up: <strong>Colette</strong> → Télématin, Julie cuisine, Plus belle la vie at 14 h, the 20 h journal, then the film. <strong>Maël</strong> → Ludo, Les Simpson's, Les experts. <strong>Nicolas</strong> → the 20 h journal and the film. <strong>Nathalie</strong> → the journal, but she goes online during the match. <strong>Morgane</strong> → nothing; she doesn't watch television.", "cols": "two"}, {"name": "Page 83 — activité 12", "items": [["Relisez les témoignages de la famille Gontrand p. 82.", "ruh-lee-ZAY lay tay-mwa-NYAHZH", "Reread the Gontrand family's accounts."], ["1. Identifiez les différentes utilisations d'Internet pour chaque personne.", "… lay dee-fay-RAHNT ew-tee-lee-za-see-OHN", "Identify each person's different uses of the internet."], ["→ Nathalie : mails, surf, achats, réservations en ligne.", "… a-SHA, ray-zair-va-see-OHN ahn LEEN-yuh", "Nathalie: emails, surfing, shopping, online booking."], ["→ Morgane : Facebook, vidéos, musique.", "fays-BOOK, vee-day-O, mew-ZEEK", "Morgane: Facebook, videos, music."], ["→ Maël : jeux en ligne.", "zhuh ahn LEEN-yuh", "Maël: online games."], ["→ Colette : écrire à sa famille et ses amis, s'informer.", "ay-KREER … san-for-MAY", "Colette: writing to family and friends, keeping informed."], ["2. Identifiez les autres activités quotidiennes de chaque personne. Repérez les moments cités.", "… lay zak-tee-vee-TAY ko-tee-dee-EN … lay mo-MAHN see-TAY", "Identify each person's other daily activities and note the times mentioned."]]}, {"name": "Page 83 — Point Langue : les verbes pronominaux", "items": [["a) Observez et répondez. Quelle est la particularité de ces verbes ?", "kel ay lah par-tee-kew-la-ree-TAY duh say VAIRB", "What is special about these verbs?"], ["Je me réveille vers 6 h 30.", "zhuh muh ray-VAY vair see zur trahnt", "I wake up around 6.30."], ["Je m'endors.", "zhuh mahn-DOR", "I fall asleep."], ["Il se couche tôt.", "eel suh koosh TOH", "He goes to bed early."], ["Nous nous préparons tranquillement.", "noo noo pray-pa-ROHN trahn-keel-MAHN", "We get ready calmly."], ["Les Français se connectent.", "lay frahn-SAY suh ko-NEKT", "The French go online."], ["→ Ces verbes ont un pronom réfléchi (me, te, se, nous, vous, se) devant le verbe.", "… uhn pro-NOHN ray-flay-SHEE", "These verbs have a reflexive pronoun before the verb."], ["b) Complétez la conjugaison du verbe se réveiller à l'indicatif présent.", "kohm-play-TAY lah kohn-zhew-gay-ZOHN", "Complete the conjugation of se réveiller."], ["je ME réveille", "zhuh muh ray-VAY", "I wake up"], ["tu TE réveilles", "tew tuh ray-VAY", "you wake up"], ["il / elle SE réveille", "eel suh ray-VAY", "he / she wakes up"], ["nous NOUS réveillons", "noo noo ray-vay-YOHN", "we wake up"], ["vous VOUS réveillez", "voo voo ray-vay-YAY", "you wake up"], ["ils / elles SE réveillent", "eel suh ray-VAY", "they wake up"], ["NB : Je NE me réveille PAS.", "zhuh nuh muh ray-VAY PAH", "In the negative, ne goes before the pronoun and pas after the verb."]], "cols": "two"}, {"name": "Page 83 — activité 12c : classer les verbes", "items": [["Classez les verbes ci-dessous dans les trois catégories proposées.", "kla-SAY lay VAIRB … dahn lay trwah ka-tay-go-REE", "Sort the verbs into the three categories."], ["Les actions du matin : se réveiller, se lever, se laver / se doucher, se raser, se coiffer, se maquiller, s'habiller, se brosser les dents, se préparer", "lay zak-see-OHN dew ma-TAN", "morning actions"], ["Les actions du soir : se reposer, se coucher, s'endormir, s'amuser", "lay zak-see-OHN dew SWAHR", "evening actions"], ["Les actions sur l'ordinateur : se connecter, s'informer, s'amuser", "… sewr lor-dee-na-TUR", "computer actions"], ["se raser", "suh ra-ZAY", "to shave"], ["s'informer", "san-for-MAY", "to keep informed"], ["se lever", "suh luh-VAY", "to get up"], ["se reposer", "suh ruh-po-ZAY", "to rest"], ["se coiffer", "suh kwa-FAY", "to do one's hair"], ["s'amuser", "sa-mew-ZAY", "to have fun"], ["se maquiller", "suh ma-kee-YAY", "to put on make-up"], ["s'endormir", "sahn-dor-MEER", "to fall asleep"], ["se laver / se doucher", "suh la-VAY / suh doo-SHAY", "to wash / to shower"], ["se connecter", "suh ko-nek-TAY", "to log on"], ["se coucher", "suh koo-SHAY", "to go to bed"], ["se préparer", "suh pray-pa-RAY", "to get ready"], ["s'habiller", "sa-bee-YAY", "to get dressed"], ["se brosser les dents", "suh bro-SAY lay DAHN", "to brush one's teeth"]], "note": "<strong>s'amuser</strong> belongs in two columns — it works for the evening and for the computer, which is the point the exercise is making.", "cols": "two"}, {"name": "Page 83 — Aide-mémoire : horaires et succession des actions", "items": [["Indiquer les horaires", "an-dee-KAY lay zo-RAIR", "Indicating times"], ["une heure exacte : à 9 heures", "ew nur eg-ZAKT : a nuh VUR", "an exact time: at 9"], ["une heure approximative : vers 10 heures", "… a-prok-see-ma-TEEV : vair dee ZUR", "an approximate time: around 10"], ["une heure limite : jusqu'à 8 heures", "… lee-MEET : zhews-KA wee TUR", "a cut-off time: until 8"], ["une période de temps : de 8 h 30 à 18 h 30", "ewn pay-ree-OD duh TAHN", "a period: from 8.30 to 18.30"], ["Indiquer la succession des actions", "an-dee-KAY lah sewk-say-see-OHN day zak-see-OHN", "Indicating the order of actions"], ["d'abord", "da-BOR", "first"], ["puis", "PWEE", "then"], ["ensuite", "ahn-SWEET", "next"], ["après", "a-PRAY", "afterwards"], ["finalement", "fee-nal-MAHN", "finally"]], "cols": "two"}, {"name": "Page 83 — Point Culture : les Français et Internet", "items": [["Observez les statistiques ci-dessous et dites si le témoignage de la famille Gontrand correspond à l'utilisation d'Internet par les Français.", "ob-sair-VAY lay sta-tees-TEEK", "Look at the statistics and say whether the Gontrand family matches French internet use."], ["Que faites-vous sur Internet ?", "kuh fet VOO sewr an-tair-NET", "What do you do on the internet?"], ["Envoyer ou recevoir des mails — 81 %", "ahn-vwa-YAY oo ruh-suh-VWAHR day MAIL", "sending or receiving emails"], ["Surfer pour vous distraire, vous détendre — 58 %", "SEUR-fay poor voo dees-TRAIR, voo day-TAHN-druh", "surfing to entertain or relax"], ["Obtenir des informations pratiques (météo, trafic routier, horaires et réservations) — 57 %", "ob-tuh-NEER day zan-for-ma-see-OHN pra-TEEK", "getting practical information"], ["Utiliser une messagerie instantanée — 50 %", "ew-tee-lee-ZAY ewn may-sa-zhuh-REE an-stahn-ta-NAY", "using instant messaging"], ["Suivre l'actualité — 37 %", "SWEE-vruh lak-tew-a-lee-TAY", "following the news"], ["Acheter des produits ou services — 24 %", "ash-TAY day pro-DWEE oo sair-VEESS", "buying products or services"], ["Consulter un blog — 18 %", "kohn-sewl-TAY uhn BLOG", "reading a blog"], ["Télécharger de la musique, des films ou des livres — 16 %", "tay-lay-shar-ZHAY duh lah mew-ZEEK", "downloading music, films or books"], ["Jouer en ligne ou en réseau — 13 %", "zhoo-AY ahn LEEN-yuh oo ahn ray-ZO", "playing online or networked games"], ["Participer à des forums de discussion, à des chats — 11 %", "par-tee-see-PAY a day fo-ROM duh dees-kew-see-OHN", "taking part in forums and chats"], ["Faire des rencontres — 2 %", "fair day rahn-KOHN-truh", "online dating"], ["Effectuer des transactions en bourse — 2 %", "ay-fek-tew-AY day trahn-zak-see-OHN ahn BOORSS", "trading shares"], ["Source : TNS-Sofres", "…", "the polling institute"]], "note": "Email tops the list at <strong>81%</strong> — far above everything else. Note how low online dating and share trading are, at 2% each.", "cols": "two"}, {"name": "Page 83 — activités 13, 14 et le projet", "items": [["Activité 13 Phonétique a) Écoutez et comptez les syllabes.", "ay-koo-TAY ay kohn-TAY lay see-LAHB", "Listen and count the syllables."], ["Exemple : Tu t'réveilles tôt ? → 4 syllabes", "tew tray-vay TOH", "the worked example — note the dropped e"], ["b) Réécoutez et répétez.", "ray-ay-koo-TAY ay ray-pay-TAY", "Listen again and repeat."], ["Activité 14 : Vous témoignez pour le magazine TV Mag.", "voo tay-mwa-NYAY poor luh ma-ga-ZEEN", "You give your account for TV Mag."], ["Vous décrivez vos habitudes et vos horaires.", "voo day-kree-VAY vo za-bee-TEWD ay vo zo-RAIR", "Describe your habits and your times."], ["Vous indiquez quel type d'émission vous regardez à la télévision et/ou quelles activités vous faites sur Internet, et à quel moment de la journée.", "… ay a kel mo-MAHN duh lah zhoor-NAY", "Say which programmes you watch and what you do online, and when."], ["Projet Dossier 4 — Tâche leçon 1 : Identifier les rythmes de vie dans le groupe.", "ee-dahn-tee-fee-AY lay reetm duh VEE", "Task: identify the group's rhythms of life."]], "note": "The phonetics point is the dropped <em>e</em> in fast speech: written <em>Tu te réveilles</em> is five syllables, but spoken it becomes <em>tu t'réveilles</em> — four."}]}, {"id": "ae-d4l2", "label": "Dossier 4 · Leçon 2", "name": "Rendez-vous", "summary": "Pages 84–87, complete. Lucille's diary and the text thread, proposing and accepting an outing, the pronoun on, pouvoir and vouloir, two invitations formal and informal, the imperative and the futur proche.", "art": null, "bookpages": ["p084", "p085", "p086", "p087"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 2, in page order.", "tracks": [{"n": 116, "label": "p.84 act. 1 & 2 — le dialogue de Malik et Lucille"}, {"n": 117, "label": "p.85 act. 5 — phonétique, le son [ɔ̃] de « on »"}, {"n": 118, "label": "p.85 act. 6 — phonétique, [ø] ou [œ] ?"}]}, {"name": "Page 84 — activités 1 et 2", "items": [["Rendez-vous", "rahn-day-VOO", "Meeting up"], ["Proposer une sortie", "pro-po-ZAY ewn sor-TEE", "Suggesting an outing"], ["Activité 1 : Écoutez et répondez. Vrai ou faux ?", "ay-koo-TAY ay ray-pohn-DAY. vray oo FO", "Listen and answer. True or false?"], ["1. Malik et Lucille sont amis.", "ma-LEEK ay lew-SEEL sohn ta-MEE", "Malik and Lucille are friends."], ["2. Lucille propose à Malik de sortir.", "lew-SEEL pro-POZ a ma-LEEK duh sor-TEER", "Lucille suggests going out to Malik."], ["3. Lucille est très disponible.", "lew-SEEL ay tray dees-po-NEE-bluh", "Lucille is very free."], ["4. Malik et Lucille fixent un rendez-vous.", "… FEEKS uhn rahn-day-VOO", "Malik and Lucille arrange to meet."], ["Activité 2 : Réécoutez le dialogue et vérifiez l'agenda de Lucille. Complétez l'agenda.", "… vay-ree-fee-AY la-zhahn-DAH", "Listen again, check Lucille's diary and complete it."], ["disponible", "dees-po-NEE-bluh", "free, available"], ["fixer un rendez-vous", "feek-SAY uhn rahn-day-VOO", "to arrange a meeting"]], "note": "Statement 3 is the one to watch — Lucille's diary is full, so she is <strong>not</strong> very available. That's the whole point of the dialogue."}, {"name": "Page 84 — l'agenda de Lucille", "items": [["AGENDA", "a-zhahn-DAH", "Diary"], ["mardi 15 juin", "mar-DEE kanz ZHWAN", "Tuesday 15 June"], ["12 h – 14 h : déjeuner M. Cardon", "day-zhuh-NAY", "lunch with Mr Cardon"], ["15 h – 17 h : réunion projet Trio", "ray-ew-nee-OHN pro-ZHAY tree-O", "Trio project meeting"], ["mercredi 16 juin", "mair-kruh-DEE sez ZHWAN", "Wednesday 16 June"], ["10 h : signature agence Trio", "see-nya-TEWR a-ZHAHNSS", "signing at the Trio agency"], ["jeudi 17 juin", "zhuh-DEE dee-SET ZHWAN", "Thursday 17 June"], ["13 h 30 – 15 h : réunion projet Trio", "ray-ew-nee-OHN pro-ZHAY", "Trio project meeting"], ["vendredi 18 juin", "vahn-druh-DEE dee-ZWEET ZHWAN", "Friday 18 June"], ["17 h : expo avec Flora", "eks-PO a-vek flo-RAH", "exhibition with Flora"], ["samedi 19 juin", "sam-DEE deez-NUHF ZHWAN", "Saturday 19 June"], ["dimanche 20 juin", "dee-MAHNSH van ZHWAN", "Sunday 20 June"]], "note": "Note how the diary is written: a start time and an end time in the left column, the appointment in the right. Saturday and Sunday are empty — which is where the outing will have to go."}, {"name": "Page 84 — les textos de Sonia et Lucille", "items": [["SONIA — 06 18 86 51 42", "so-NYA", "the contact and her number"], ["Coucou Lucille ! Tu es libre jeudi soir ? Tu veux aller au restau avec nous (Hugo et moi) ?", "koo-KOO … tew ay LEE-bruh zhuh-DEE SWAHR ? … oh res-TO", "Hi Lucille! Are you free Thursday evening? Want to go to the restaurant with us?"], ["lun. 14 juin, 18:49", "luhn-DEE ka-TORZ ZHWAN", "Monday 14 June, 18:49"], ["Je ne suis pas libre, je vais au ciné avec Malik. Vous voulez venir ?", "zhuh nuh swee pah LEE-bruh, zhuh vay oh see-NAY … voo voo-LAY vuh-NEER", "I'm not free, I'm going to the cinema with Malik. Do you want to come?"], ["Ok, je veux bien ! À quelle heure ?", "o-KAY, zhuh vuh bee-AN ! a kel UR", "OK, I'd love to! What time?"], ["On a rdv à 18 h 30, on boit 1 verre et on va au ciné.", "oh na rahn-day-VOO a dee-zwee UR trahnt, ohn bwah uhn VAIR", "We're meeting at 18.30, having a drink and going to the cinema."], ["D'accord, mais on arrive à 19 h, on doit passer chez ma sœur avant. On se retrouve où ?", "da-KOR … ohn dwah pa-SAY shay ma SUR a-VAHN. ohn suh ruh-TROOV OO", "OK, but we'll arrive at 19.00, we have to call at my sister's first. Where shall we meet?"], ["Sur le Vieux-Port.", "sewr luh vee-uh-POR", "On the Vieux-Port."], ["Alors rdv à la Marine, c'est 1 bar sympa.", "a-LOR rahn-day-VOO a lah ma-REEN, say uhn bar san-PAH", "Then let's meet at La Marine, it's a nice bar."], ["Ok, ça marche ! À jeudi 19 h. Bises", "o-KAY, sa MARSH ! a zhuh-DEE deez-nuh VUR", "OK, that works! See you Thursday at 19.00. Kisses"]], "note": "Text-message shorthand worth knowing: <strong>rdv</strong> = rendez-vous, <strong>1</strong> = un/une, <strong>ciné</strong> = cinéma, <strong>restau</strong> = restaurant. The Vieux-Port places this in <strong>Marseille</strong>."}, {"name": "Page 84 — activité 3 : le texto à compléter", "items": [["Lisez les textos suivants sur le téléphone de Lucille et complétez le texto de Lucille à Malik.", "lee-ZAY lay teks-TO … ay kohm-play-TAY", "Read the texts and complete Lucille's message to Malik."], ["MALIK — 06 65 01 12 77", "ma-LEEK", "the contact and his number"], ["Slt ! Rdv jeudi à … au bar … .", "sa-LEW ! rahn-day-VOO zhuh-DEE", "Hi! Meeting Thursday at… at the… bar."], ["… peuvent venir mais ils arrivent à … seulement. Bises", "… PUV vuh-NEER may zeel a-REEV a … sul-MAHN", "…can come but they're only arriving at… ."], ["lun. 14 juin, 20:13", "…", "Monday 14 June, 20:13"], ["→ Slt ! Rdv jeudi à 18 h 30 au bar la Marine. Sonia et Hugo peuvent venir mais ils arrivent à 19 h seulement. Bises", "… oh bar lah ma-REEN … a deez-nuh VUR sul-MAHN", "the completed message"]], "note": "Every blank is answerable from Sonia's thread: the meeting time <strong>18 h 30</strong>, the bar <strong>la Marine</strong>, the names <strong>Sonia et Hugo</strong>, and their arrival at <strong>19 h</strong>."}, {"name": "Page 85 — Point Langue : proposer une sortie", "items": [["Complétez le tableau avec les formules suivantes.", "kohm-play-TAY luh ta-BLO", "Complete the table with these phrases."], ["PROPOSER UNE SORTIE — Tu veux sortir ? / On peut aller en boîte ?", "tew vuh sor-TEER ? / ohn puh a-LAY ahn BWAHT", "Do you want to go out? / Shall we go clubbing?"], ["— Tu veux aller au resto ?", "tew vuh a-LAY oh res-TO", "Do you want to go to the restaurant?"], ["— Pourquoi pas un film ?", "poor-KWAH pah uhn FEELM", "Why not a film?"], ["ACCEPTER — Oui, d'accord.", "wee, da-KOR", "Yes, all right."], ["Je veux bien.", "zhuh vuh bee-AN", "I'd like that."], ["Si tu veux.", "see tew VUH", "If you like."], ["Ok, ça marche !", "o-KAY, sa MARSH", "OK, that works!"], ["Oui, jeudi, ça me va.", "wee, zhuh-DEE, sa muh VA", "Yes, Thursday suits me."], ["REFUSER — Désolée, je ne peux pas.", "day-zo-LAY, zhuh nuh puh PAH", "Sorry, I can't."], ["C'est impossible pour moi.", "set an-po-SEE-bluh poor MWAH", "It's impossible for me."], ["Je ne suis pas libre.", "zhuh nuh swee pah LEE-bruh", "I'm not free."], ["FIXER UN RENDEZ-VOUS — On se retrouve où ?", "ohn suh ruh-TROOV OO", "Where shall we meet?"]], "note": "Eleven phrases sorted into four functions. Note that <strong>Je veux bien</strong> is an acceptance, not a mere statement of wanting — it's the standard polite yes.", "cols": "two"}, {"name": "Page 85 — activité 4 : sorties, lieux et significations", "items": [["Associez les activités de sortie, les lieux et les significations.", "a-so-see-AY lay zak-tee-vee-TAY duh sor-TEE", "Match the activities, the places and the meanings."], ["Pour danser → On va en boîte → Cela signifie : dans une discothèque", "poor dahn-SAY … ahn BWAHT … dahn zewn dees-ko-TEK", "To dance → we go clubbing → in a nightclub"], ["Pour voir des œuvres d'art → On va à une expo → dans une exposition", "poor vwahr day zuh-vruh DAR … a ew nex-PO", "To see works of art → to an exhibition"], ["Pour prendre un verre → On va dans un bar sympa → dans un bar agréable", "poor PRAHN-druh uhn VAIR … uhn bar san-PAH", "To have a drink → to a nice bar"], ["Pour dîner → On va au resto → au restaurant", "poor dee-NAY … oh res-TO", "To have dinner → to the restaurant"], ["Pour voir un film → On va au ciné → au cinéma", "poor vwahr uhn FEELM … oh see-NAY", "To see a film → to the cinema"]], "note": "Four of the five are <strong>abbreviations</strong> used in speech: <em>une boîte</em> for a nightclub, <em>une expo</em> for an exposition, <em>le resto</em> for a restaurant, <em>le ciné</em> for the cinema."}, {"name": "Page 85 — Point Langue : le pronom on", "items": [["a) Observez ces phrases.", "ob-sair-VAY say FRAZ", "Look at these sentences."], ["On peut aller en boîte ?", "ohn puh a-LAY ahn BWAHT", "Shall we go clubbing?"], ["On va au ciné.", "ohn va oh see-NAY", "We're going to the cinema."], ["On arrive à 19 h.", "oh na-REEV a deez-nuh VUR", "We arrive at 19.00."], ["b) Complétez. On va = NOUS ALLONS", "ohn VA = noo za-LOHN", "on va = we go"], ["Attention ! Après on, le verbe est conjugué à la 3e personne du singulier.", "… a lah trwa-zee-EM pair-SUN dew san-gew-lee-AY", "After on, the verb takes the third person singular."]], "note": "This is the everyday spoken <strong>nous</strong>. It means <em>we</em> but conjugates like <em>il</em> — so <em>on va</em>, not <em>on allons</em>. In casual French you'll hear <em>on</em> far more often than <em>nous</em>."}, {"name": "Page 85 — Aide-mémoire : pouvoir et vouloir", "items": [["Pouvoir — je peux", "zhuh PUH", "I can"], ["tu peux", "tew PUH", "you can"], ["il / elle peut", "eel PUH", "he / she can"], ["nous pouvons", "noo poo-VOHN", "we can"], ["vous pouvez", "voo poo-VAY", "you can"], ["ils / elles peuvent", "eel PUV", "they can"], ["Vouloir — je veux", "zhuh VUH", "I want"], ["tu veux", "tew VUH", "you want"], ["il / elle veut", "eel VUH", "he / she wants"], ["nous voulons", "noo voo-LOHN", "we want"], ["vous voulez", "voo voo-LAY", "you want"], ["ils / elles veulent", "eel VUL", "they want"], ["Ils peuvent venir.", "eel puv vuh-NEER", "They can come."], ["Tu veux sortir ?", "tew vuh sor-TEER", "Do you want to go out?"]], "note": "Both are followed directly by an <strong>infinitive</strong>, with no preposition. And both follow the same shape: <em>peux/peux/peut</em> and <em>veux/veux/veut</em> sound identical in the singular, then the plural changes.", "cols": "two"}, {"name": "Page 85 — activités 5, 6 et 7", "items": [["Activité 5 Phonétique a) Écoutez et indiquez dans quelle syllabe vous entendez [ɔ̃].", "… dahn kel see-LAHB voo zahn-tahn-DAY", "Listen and say in which syllable you hear the nasal [ɔ̃]."], ["Exemple : On peut sortir ? → dans la 1re syllabe", "dahn lah pruh-mee-AIR see-LAHB", "the worked example"], ["b) Réécoutez et répétez.", "ray-ay-koo-TAY ay ray-pay-TAY", "Listen again and repeat."], ["Activité 6 Phonétique a) Lisez et écoutez les formes verbales.", "lee-ZAY ay ay-koo-TAY lay form vair-BAL", "Read and listen to the verb forms."], ["1. Il peut. [ø]", "eel PUH", "closed eu — singular"], ["2. Il veut. [ø]", "eel VUH", "closed eu — singular"], ["3. Ils peuvent. [œ]", "eel PUV", "open eu — plural"], ["4. Ils veulent. [œ]", "eel VUL", "open eu — plural"], ["b) [ø] ou [œ] ? Réécoutez et répondez.", "… oo …", "Which sound? Listen again and answer."], ["Activité 7 : Jouez la scène à deux.", "zhoo-AY lah sen a DUH", "Act out the scene in pairs."], ["Vous discutez avec un(e) ami(e) pour choisir une sortie ou une activité.", "voo dees-kew-TAY … poor shwa-ZEER ewn sor-TEE", "You discuss with a friend to choose an outing or activity."], ["Vous regardez votre agenda pour décider à quel moment. Vous fixez le rendez-vous.", "… poor day-see-DAY a kel mo-MAHN. voo feek-SAY luh rahn-day-VOO", "Look at your diary to decide when. Arrange the meeting."]], "note": "This is how you hear singular from plural: <strong>il peut</strong> ends in a closed [ø] with no consonant, <strong>ils peuvent</strong> opens to [œ] and sounds the <em>v</em>. Same for <em>il veut</em> / <em>ils veulent</em>."}, {"name": "Page 86 — Message 1 : le mail de Charlotte et Clément", "items": [["Inviter", "an-vee-TAY", "Inviting"], ["De : blue92@orange.fr — À : alambert@gmail.com — Objet : Fête !", "duh … a … ob-ZHAY : FET", "the header: From, To, Subject: Party!"], ["Amélie,", "a-may-LEE", "Amélie,"], ["Samedi prochain, c'est l'anniversaire d'Olivier !", "sam-DEE pro-SHAN, say la-nee-vair-SAIR do-lee-vee-AY", "Next Saturday it's Olivier's birthday!"], ["On organise une fête surprise et on espère que tu vas venir !", "oh nor-ga-NEEZ ewn fet sewr-PREEZ ay oh nes-PAIR kuh tew va vuh-NEER", "We're organising a surprise party and we hope you'll come!"], ["Viens à 21 h. Tu peux amener un(e) ami(e) si tu veux (on va être environ 30 personnes).", "vee-AN a van-tay-uh NUR. tew puh am-NAY … ahn-vee-ROHN trahnt pair-SUN", "Come at 9pm. You can bring a friend if you like (there'll be about 30 of us)."], ["On habite au 23 rue Mandar.", "oh na-BEET oh van-TWAH rew mahn-DAR", "We live at 23 rue Mandar."], ["Pour venir, c'est simple : prends le métro et descends à la station Hôtel de Ville, c'est tout près.", "poor vuh-NEER … PRAHN luh may-TRO ay day-SAHN a lah sta-see-OHN", "To get here it's simple: take the metro and get off at Hôtel de Ville, it's very close."], ["S'il te plaît, apporte quelque chose à boire ou à manger", "seel tuh PLAY, a-PORT kel-kuh shoz a BWAHR oo a mahn-ZHAY", "Please bring something to drink or eat"], ["et surtout n'oublie pas ta guitare !", "ay sewr-TOO noo-blee pah ta gee-TAR", "and above all don't forget your guitar!"], ["On va faire de la musique, on va danser ! Et on va faire des jeux.", "ohn va fair duh lah mew-ZEEK, ohn va dahn-SAY", "We're going to make music, dance! And play games."], ["Écris ou téléphone avant mercredi pour confirmer.", "ay-KREE oo tay-lay-FON a-VAHN mair-kruh-DEE poor kohn-feer-MAY", "Write or phone before Wednesday to confirm."], ["Bisous", "bee-ZOO", "Kisses"], ["PS : Ne dis rien à Olivier, bien sûr !!!", "nuh dee ree-AN a o-lee-vee-AY, bee-an SEWR", "PS: Don't say anything to Olivier, of course!!!"]], "note": "Signed by <strong>Charlotte et Clément</strong> — the informal message, using <em>tu</em> throughout."}, {"name": "Page 86 — Message 2 : le mot des voisins", "items": [["Mademoiselle,", "mad-mwa-ZELL", "Miss,"], ["Nous sommes vos nouveaux voisins. Faisons connaissance !", "noo som vo noo-VO vwa-ZAN. fuh-ZOHN ko-nay-SAHNSS", "We're your new neighbours. Let's get to know each other!"], ["Vous êtes libre samedi prochain ?", "voo zet LEE-bruh sam-DEE pro-SHAN", "Are you free next Saturday?"], ["Venez à la maison pour un petit apéritif, à 19 h 30.", "vuh-NAY a lah may-ZOHN poor uhn puh-tee ta-pay-ree-TEEF", "Come to the house for a little drink, at 7.30pm."], ["Laissez SVP un petit mot sous la porte (notre appartement est à côté de l'ascenseur)", "lay-SAY seel voo PLAY uhn puh-tee MO soo lah PORT … a ko-TAY duh la-sahn-SUR", "Please leave a note under the door (our flat is next to the lift)"], ["ou dans la boîte aux lettres pour dire si vous êtes d'accord.", "oo dahn lah bwat oh LET-ruh poor DEER see voo zet da-KOR", "or in the letterbox to say if you agree."], ["À très bientôt,", "a tray bee-an-TO", "See you very soon,"]], "note": "Signed by <strong>M. et Mme Aubert</strong> — the formal message, using <em>vous</em> throughout, and opening with <em>Mademoiselle</em> rather than a first name."}, {"name": "Page 86 — activités 8 et 9", "items": [["Activité 8 a) Lisez les deux messages et trouvez la signature qui correspond.", "… ay troo-VAY lah see-nya-TEWR", "Read the two messages and find the matching signature."], ["→ Message 1 (le mail) : Charlotte et Clément. Message 2 (le mot) : M. et Mme Aubert.", "…", "the two answers"], ["b) Dites qui sont ces personnes et pourquoi elles écrivent à Amélie.", "deet kee sohn say pair-SUN ay poor-KWAH", "Say who these people are and why they're writing."], ["→ Charlotte et Clément sont des amis : ils invitent Amélie à une fête surprise pour l'anniversaire d'Olivier.", "… ewn fet sewr-PREEZ", "friends inviting her to a surprise birthday party"], ["→ M. et Mme Aubert sont les nouveaux voisins : ils invitent Amélie à un apéritif pour faire connaissance.", "lay noo-VO vwa-ZAN … uh na-pay-ree-TEEF", "the new neighbours inviting her for a drink to get acquainted"], ["Activité 9 : Relisez les deux messages. Identifiez pour chaque message quels éléments sont donnés et dans quel ordre.", "… kel zay-lay-MAHN sohn do-NAY ay dahn kel OR-druh", "Identify which elements are given in each message and in what order."], ["pourquoi on invite", "poor-KWAH ohn an-VEET", "why you're inviting"], ["comment venir", "ko-MAHN vuh-NEER", "how to get there"], ["le jour", "luh ZHOOR", "the day"], ["quoi apporter", "kwah a-por-TAY", "what to bring"], ["qui est invité", "kee ay tan-vee-TAY", "who is invited"], ["l'adresse", "la-DRESS", "the address"], ["l'heure", "LUR", "the time"], ["combien de personnes sont invitées", "kohm-bee-AN duh pair-SUN", "how many people are invited"], ["demande de confirmation", "duh-MAHND duh kohn-feer-ma-see-OHN", "request to confirm"]], "note": "The mail gives all nine elements; the neighbours' note gives only the reason, the day, the time, the address (implied — the flat by the lift) and the request to confirm."}, {"name": "Page 86 — activité 10 : reconstituer les réponses d'Amélie", "items": [["Reconstituez les réponses d'Amélie aux deux messages.", "ruh-kohn-stee-tew-AY lay ray-POHNSS da-may-LEE", "Reconstruct Amélie's replies to the two messages."], ["Les éléments à trier : Amélie / D'accord pour samedi ! / Si vous avez un problème ou si vous avez besoin d'aide, demandez-moi ! / Madame, Monsieur, / Et je vais faire un gâteau au chocolat. / Salut ! / Je viens seule. / Bises, / Je vous remercie pour votre invitation. / Amélie Lambert. / Je peux venir samedi, mais je ne vais pas rester très longtemps. / Est-ce que vous voulez de l'aide pour préparer la soirée ? / J'apporte ma guitare, bien sûr !", "…", "the thirteen lines to sort"], ["→ Réponse au mail (informelle) : Salut ! D'accord pour samedi ! Je viens seule. J'apporte ma guitare, bien sûr ! Et je vais faire un gâteau au chocolat. Est-ce que vous voulez de l'aide pour préparer la soirée ? Bises, Amélie", "sa-LEW ! … zhuh vee-AN SUL … uhn ga-TO oh sho-ko-LAH", "the informal reply, using tu-register"], ["→ Réponse au mot (formelle) : Madame, Monsieur, Je vous remercie pour votre invitation. Je peux venir samedi, mais je ne vais pas rester très longtemps. Si vous avez un problème ou si vous avez besoin d'aide, demandez-moi ! Amélie Lambert", "ma-DAM, muh-SYUH … zhuh voo ruh-mair-SEE", "the formal reply, using vous-register"]], "note": "The sort is by <strong>register</strong>: <em>Salut ! / Bises, / Amélie</em> and the guitar and cake belong to the friends; <em>Madame, Monsieur, / Je vous remercie / Amélie Lambert</em> and the full surname belong to the neighbours."}, {"name": "Page 87 — Point Langue : l'impératif", "items": [["L'impératif pour inviter et donner des instructions", "lan-pay-ra-TEEF poor an-vee-TAY ay do-NAY day zan-strewk-see-OHN", "The imperative for inviting and giving instructions"], ["a) Lisez et identifiez les instructions parmi les phrases suivantes.", "… par-MEE lay frahz swee-VAHNT", "Identify the instructions among these sentences."], ["prends le métro → INSTRUCTION", "PRAHN luh may-TRO", "take the metro"], ["tu peux amener un(e) ami(e) → pas une instruction", "tew puh am-NAY", "you can bring a friend"], ["écris pour confirmer → INSTRUCTION", "ay-KREE poor kohn-feer-MAY", "write to confirm"], ["laissez un petit mot sous la porte → INSTRUCTION", "lay-SAY uhn puh-tee MO", "leave a note under the door"], ["vous êtes chez vous samedi prochain → pas une instruction", "voo zet shay VOO", "you're at home next Saturday"], ["b) Observez et dites quelles différences vous remarquez.", "… kel dee-fay-RAHNSS voo ruh-mar-KAY", "Say what differences you notice."], ["Tu viens à 21 h. → Viens à 21 h.", "tew vee-AN → vee-AN", "present → imperative"], ["Tu écris pour confirmer. → Écris pour confirmer.", "tew ay-KREE → ay-KREE", "present → imperative"], ["Tu apportes quelque chose. → Apporte quelque chose.", "tew a-PORT → a-PORT", "note the dropped -s"], ["Tu téléphones. → Téléphone.", "tew tay-lay-FON → tay-lay-FON", "note the dropped -s"], ["Tu n'oublies pas. → N'oublie pas.", "tew noo-BLEE pah → noo-blee PAH", "negative imperative"], ["Tu ne dis rien à Olivier ! → Ne dis rien à Olivier !", "… → nuh dee ree-AN", "negative imperative"], ["Vous venez à la maison. → Venez à la maison.", "voo vuh-NAY → vuh-NAY", "vous form"], ["Nous faisons connaissance ! → Faisons connaissance !", "noo fuh-ZOHN → fuh-ZOHN", "nous form: let's…"]], "cols": "two"}, {"name": "Page 87 — les trois réponses de l'activité c", "items": [["c) Vrai ou faux ? Répondez et justifiez.", "vray oo FO ? ray-pohn-DAY ay zhews-tee-fee-AY", "True or false? Answer and justify."], ["— À l'impératif, il y a un sujet avant le verbe. → FAUX : le sujet disparaît.", "luh sew-ZHAY dees-pa-RAY", "FALSE — the subject disappears."], ["— Il n'y a pas de différence entre les formes verbales de l'impératif et du présent de l'indicatif. → FAUX : les verbes en -er perdent le -s à la 2e personne du singulier (tu apportes → apporte).", "… PAIRD luh ess", "FALSE — -er verbs drop the -s in the tu form."], ["— La place de la négation est différente à l'impératif et au présent de l'indicatif. → VRAI : Tu n'oublies pas → N'oublie pas.", "lah plahss duh lah nay-ga-see-OHN", "TRUE — with no subject, ne comes first."]], "note": "Three points in one: <strong>no subject pronoun</strong>, <strong>-er verbs lose the final -s</strong> in the <em>tu</em> form, and the <strong>negation wraps the verb directly</strong> — <em>ne… pas</em> with nothing in between."}, {"name": "Page 87 — Point Langue : le futur proche", "items": [["Le futur proche pour parler des projets", "luh few-TEWR PROSH poor par-LAY day pro-ZHAY", "The near future for talking about plans"], ["a) Observez.", "ob-sair-VAY", "Observe."], ["Je vais faire un gâteau.", "zhuh vay fair uhn ga-TO", "I'm going to make a cake."], ["Tu vas venir.", "tew va vuh-NEER", "You're going to come."], ["On va danser.", "ohn va dahn-SAY", "We're going to dance."], ["b) Complétez. Futur proche = verbe ALLER au présent + verbe à l'INFINITIF.", "luh vairb a-LAY oh pray-ZAHN plew luh vairb a lan-fee-nee-TEEF", "aller in the present + the infinitive"], ["c) Observez et identifiez la place de la négation.", "… lah plahss duh lah nay-ga-see-OHN", "Identify where the negation goes."], ["Je NE vais PAS rester très longtemps.", "zhuh nuh vay pah res-TAY tray lohn-TAHN", "I'm not going to stay very long."], ["→ La négation entoure ALLER, pas l'infinitif.", "… ahn-TOOR a-LAY", "The negation wraps around aller, not the infinitive."]], "note": "Exactly like English <em>I'm going to…</em>. And the negative works the same way as the passé composé: <strong>ne… pas</strong> goes around the helper verb, never around the infinitive."}, {"name": "Page 87 — activité 11 et le projet", "items": [["Vous écrivez un mail pour inviter un(e) ami(e), un(e) collègue, une personne de votre famille, un(e) voisin(e) ou un(e) personne de la classe", "voo zay-kree-VAY uhn MAIL poor an-vee-TAY", "Write an email inviting a friend, colleague, relative, neighbour or classmate"], ["à un dîner, un apéritif ou une soirée.", "a uhn dee-NAY, uh na-pay-ree-TEEF oo ewn swa-RAY", "to a dinner, a drink or an evening."], ["Vous précisez qui vous invitez (la personne seule ou avec quelqu'un), la date, l'heure, la raison.", "voo pray-see-ZAY kee voo zan-vee-TAY … lah dat, LUR, lah ray-ZOHN", "Specify who you're inviting, the date, the time and the reason."], ["Vous donnez des instructions (pour venir, pour répondre à l'invitation, pour apporter quelque chose, etc.).", "voo do-NAY day zan-strewk-see-OHN", "Give instructions: how to get there, how to reply, what to bring."], ["Projet Dossier 4 — Tâche leçon 2 : Préparer un programme de sorties.", "pray-pa-RAY uhn pro-GRAM duh sor-TEE", "Task: prepare a programme of outings."]], "note": "This task needs everything from the lesson: the nine invitation elements from activity 9, the imperative for the instructions, and the futur proche for what you'll be doing."}, {"name": "Le vocabulaire de la leçon", "items": [["un rendez-vous", "uhn rahn-day-VOO", "an appointment, a meeting"], ["une sortie", "ewn sor-TEE", "an outing"], ["un agenda", "uh na-zhahn-DAH", "a diary"], ["une réunion", "ewn ray-ew-nee-OHN", "a meeting"], ["disponible", "dees-po-NEE-bluh", "available"], ["libre", "LEE-bruh", "free"], ["fixer un rendez-vous", "feek-SAY uhn rahn-day-VOO", "to arrange a meeting"], ["se retrouver", "suh ruh-troo-VAY", "to meet up"], ["prendre un verre", "PRAHN-druh uhn VAIR", "to have a drink"], ["aller en boîte", "a-LAY ahn BWAHT", "to go clubbing"], ["une discothèque", "ewn dees-ko-TEK", "a nightclub"], ["une expo(sition)", "ewn eks-po-zee-see-OHN", "an exhibition"], ["une œuvre d'art", "ew NUH-vruh DAR", "a work of art"], ["un resto(rant)", "uhn res-TO", "a restaurant"], ["le ciné(ma)", "luh see-NAY", "the cinema"], ["sympa", "san-PAH", "nice, friendly"], ["une fête surprise", "ewn fet sewr-PREEZ", "a surprise party"], ["un anniversaire", "uh na-nee-vair-SAIR", "a birthday"], ["un apéritif", "uh na-pay-ree-TEEF", "pre-dinner drinks"], ["une soirée", "ewn swa-RAY", "an evening, a party"], ["amener quelqu'un", "am-NAY kel-KUHN", "to bring someone"], ["apporter quelque chose", "a-por-TAY kel-kuh SHOZ", "to bring something"], ["confirmer", "kohn-feer-MAY", "to confirm"], ["une invitation", "ew nan-vee-ta-see-OHN", "an invitation"], ["un voisin / une voisine", "uhn vwa-ZAN / ewn vwa-ZEEN", "a neighbour"], ["faire connaissance", "fair ko-nay-SAHNSS", "to get acquainted"], ["l'ascenseur", "la-sahn-SUR", "the lift"], ["la boîte aux lettres", "lah bwat oh LET-ruh", "the letterbox"], ["laisser un mot", "lay-SAY uhn MO", "to leave a note"], ["avoir besoin d'aide", "a-VWAHR buh-ZWAN DED", "to need help"], ["un gâteau au chocolat", "uhn ga-TO oh sho-ko-LAH", "a chocolate cake"], ["environ", "ahn-vee-ROHN", "about, approximately"]], "cols": "two"}]}, {"id": "ae-d4l3", "label": "Dossier 4 · Leçon 3", "name": "Au jour le jour", "summary": "Pages 88–91, complete. Myriam's day in twelve comic frames, habit and frequency, all the daily-routine and chore verbs, her holiday diary, present versus past time markers and the passé composé in full.", "art": null, "bookpages": ["p088", "p089", "p090", "p091"], "groups": [{"name": "Page 88 — la bande dessinée", "items": [["Au jour le jour", "oh zhoor luh ZHOOR", "Day by day"], ["Parler de ses activités quotidiennes", "par-LAY duh say zak-tee-vee-TAY ko-tee-dee-EN", "Talking about your daily activities"], ["Extrait de La BD des copines, Mainguy et Grisseaux, Vents d'Ouest.", "eks-TRAH duh lah bay-DAY day ko-PEEN", "the source of the comic strip"], ["une bande dessinée (une BD)", "ewn bahnd day-see-NAY (ewn bay-DAY)", "a comic strip"], ["une vignette", "ewn veen-YETT", "a frame, a panel"], ["Vignette b : « Tu devrais t'inscrire dans un club de gym, toi qui ne fais pas de sport. »", "tew duh-VRAY tan-SKREER dahn zuhn klub duh ZHEEM", "You should join a gym, you who never do any sport."], ["Vignette l : « Ben ? Qu'est-ce que j'ai dit ??? »", "BAN ? kes-kuh zhay DEE", "Er? What did I say???"], ["Vignette k : EN PANNE", "ahn PAN", "OUT OF ORDER — the sign on the lift"], ["Vignette g : PRIX CHOC", "pree SHOK", "BARGAIN PRICES — the supermarket sign"]], "note": "Twelve frames, <strong>a</strong> to <strong>l</strong>, each with a clock face showing the time. The joke is in the last frame: after watching Myriam race through her entire day, her husband Patrick — who suggested she join a gym because she does no sport — gets the reaction he deserves."}, {"name": "Page 89 — activité 1", "items": [["Les vignettes a à k de la bande dessinée p. 88 sont dans le désordre. Observez et répondez.", "… sohn dahn luh day-ZOR-druh", "Frames a to k are out of order. Look and answer."], ["1. La BD raconte : une journée de week-end / une journée de vacances / une journée de la semaine", "lah bay-DAY ra-KOHNT", "The comic tells the story of: a weekend day / a holiday day / a weekday"], ["→ une journée de la semaine (les enfants vont à l'école).", "ewn zhoor-NAY duh lah suh-MEN", "a weekday — the children go to school"], ["2. Le personnage principal est : un enfant / une mère de famille / un père de famille", "luh pair-so-NAHZH pran-see-PAL", "The main character is:"], ["→ une mère de famille : Myriam.", "ewn mair duh fa-MEE", "a mother — Myriam"], ["3. Dans la famille, il y a : 2 personnes / 3 personnes / 4 personnes", "dahn lah fa-MEE, eel ee A", "In the family there are:"], ["→ 4 personnes : Myriam, son mari Patrick et leurs deux enfants.", "katr pair-SUN", "four — Myriam, Patrick and their two children"]]}, {"name": "Page 89 — activité 2 : les neuf commentaires", "items": [["a) Trouvez l'ordre des vignettes et reconstituez l'histoire.", "troo-VAY LOR-druh day veen-YETT", "Find the order of the frames and reconstruct the story."], ["Expliquez la réaction de la femme, Myriam, dans la dernière vignette.", "eks-plee-KAY lah ray-ak-see-OHN", "Explain Myriam's reaction in the last frame."], ["b) Mettez dans l'ordre les commentaires suivants pour les onze premières vignettes.", "met-TAY dahn LOR-druh lay ko-mahn-TAIR", "Put the following captions in order for the first eleven frames."], ["Attention, il y a 9 commentaires et 11 vignettes ; 2 commentaires correspondent à 2 vignettes.", "… duh ko-mahn-TAIR ko-res-POHND a duh veen-YETT", "Careful: 9 captions for 11 frames; two captions cover two frames each."], ["7. Chaque matin, elle prépare le petit déjeuner pour toute la famille.", "shak ma-TAN, el pray-PAR luh puh-tee day-zhuh-NAY", "Every morning she makes breakfast for the whole family."], ["3. Tous les matins, elle emmène les enfants à l'école à 8 h 30.", "too lay ma-TAN, el ahm-MEN lay zahn-FAHN a lay-KOL", "Every morning she takes the children to school at 8.30."], ["4. Souvent, elle doit courir pour prendre le bus !", "soo-VAHN, el dwah koo-REER poor PRAHN-druh luh BEWSS", "She often has to run for the bus!"], ["1. Tous les jours, elle va chercher les enfants à l'école vers 11 h 30.", "too lay ZHOOR, el va shair-SHAY … vair ohnz UR trahnt", "Every day she collects the children from school around 11.30."], ["9. En général, elle fait les courses au supermarché l'après-midi et rapporte ses achats à la maison.", "ahn zhay-nay-RAL, el fay lay KOORSS … ay ra-PORT say za-SHA", "She generally does the shopping in the afternoon and brings it home."], ["6. Elle reprend les enfants à l'école à 16 h 30.", "el ruh-PRAHN lay zahn-FAHN … a sez UR trahnt", "She picks the children up from school at 16.30."], ["8. Les enfants dînent vers 19 h 30.", "lay zahn-FAHN DEEN vair deez-nuh vur trahnt", "The children have dinner around 19.30."], ["5. D'habitude, elle fait la vaisselle pendant que son mari Patrick lit le journal.", "da-bee-TEWD, el fay lah vay-SELL pahn-DAHN kuh sohn ma-REE pa-TREEK lee luh zhoor-NAL", "She usually does the washing-up while her husband Patrick reads the paper."], ["2. Le soir, elle fait le ménage, elle range les chambres.", "luh SWAHR, el fay luh may-NAHZH, el rahnzh lay SHAHM-bruh", "In the evening she cleans and tidies the bedrooms."]], "note": "The captions in story order run <strong>7 – 3 – 4 – 1 – 9 – 6 – 8 – 5 – 2</strong>, following the clock faces through her day from breakfast to bedtime."}, {"name": "Page 89 — activité 3", "items": [["Relisez les commentaires (activité 2) et répondez. Justifiez votre réponse.", "ruh-lee-ZAY lay ko-mahn-TAIR ay ray-pohn-DAY", "Reread the captions and answer. Justify."], ["À votre avis, la journée racontée dans la BD est une journée exceptionnelle ou habituelle pour cette mère de famille ?", "… ek-sep-see-o-NELL oo a-bee-tew-ELL", "Is the day an exceptional or an ordinary one for this mother?"], ["→ Une journée habituelle : les commentaires disent « chaque matin », « tous les jours », « tous les matins », « d'habitude », « en général », « souvent ».", "ewn zhoor-NAY a-bee-tew-ELL", "An ordinary day — the captions are full of habit expressions."]]}, {"name": "Page 89 — Point Langue : régularité et fréquence", "items": [["a) Relevez dans les commentaires (activité 2) les mots qui expriment l'habitude.", "ruh-luh-VAY … lay mo kee eks-PREEM la-bee-TEWD", "Note the words expressing habit."], ["d'habitude", "da-bee-TEWD", "usually"], ["chaque matin", "shak ma-TAN", "every morning"], ["tous les jours", "too lay ZHOOR", "every day"], ["tous les matins", "too lay ma-TAN", "every morning"], ["en général", "ahn zhay-nay-RAL", "generally"], ["souvent", "soo-VAHN", "often"], ["b) Trouvez des expressions équivalentes pour les éléments en gras.", "troo-VAY day zeks-pray-see-OHN ay-kee-va-LAHNT", "Find equivalent expressions."], ["LE SOIR, elle fait le ménage. → tous les soirs, chaque soir", "too lay SWAHR, shak SWAHR", "every evening"], ["L'APRÈS-MIDI, elle fait les courses. → tous les après-midi, chaque après-midi", "too lay za-pray-mee-DEE", "every afternoon"], ["CHAQUE MATIN, elle prépare le petit déjeuner. → tous les matins, le matin", "too lay ma-TAN", "every morning"], ["TOUS LES JOURS, elle va chercher les enfants. → chaque jour", "shak ZHOOR", "every day"]], "note": "The pattern to take away: <strong>le/la + singular</strong>, <strong>tous les / toutes les + plural</strong>, and <strong>chaque + singular</strong> all express the same regular habit. <em>Le soir</em> means <em>every evening</em>, not <em>this evening</em>."}, {"name": "Page 89 — Aide-mémoire : les activités quotidiennes", "items": [["Le début de la journée", "luh day-BEW duh lah zhoor-NAY", "The start of the day"], ["se réveiller", "suh ray-vay-YAY", "to wake up"], ["se lever", "suh luh-VAY", "to get up"], ["préparer le petit déjeuner", "pray-pa-RAY luh puh-tee day-zhuh-NAY", "to make breakfast"], ["se doucher", "suh doo-SHAY", "to shower"], ["se préparer", "suh pray-pa-RAY", "to get ready"], ["s'habiller", "sa-bee-YAY", "to get dressed"], ["Les repas", "lay ruh-PAH", "Meals"], ["prendre le petit déjeuner", "PRAHN-druh luh puh-tee day-zhuh-NAY", "to have breakfast"], ["déjeuner", "day-zhuh-NAY", "to have lunch"], ["dîner", "dee-NAY", "to have dinner"], ["Les tâches ménagères", "lay tahsh may-na-ZHAIR", "Household chores"], ["faire les courses", "fair lay KOORSS", "to do the shopping"], ["faire le ménage", "fair luh may-NAHZH", "to do the cleaning"], ["faire la vaisselle", "fair lah vay-SELL", "to do the washing-up"], ["ranger", "rahn-ZHAY", "to tidy"], ["La fin de la journée", "lah fan duh lah zhoor-NAY", "The end of the day"], ["se coucher", "suh koo-SHAY", "to go to bed"], ["s'endormir", "sahn-dor-MEER", "to fall asleep"], ["dormir", "dor-MEER", "to sleep"], ["Autres", "OH-truh", "Others"], ["emmener les enfants à l'école", "ahm-NAY lay zahn-FAHN a lay-KOL", "to take the children to school"], ["aller chercher / reprendre les enfants à l'école", "a-LAY shair-SHAY / ruh-PRAHN-druh", "to fetch / collect the children from school"]], "note": "The book marks <strong>emmener ≠ aller chercher</strong> as opposites: you <em>emmener</em> the children <em>to</em> school and <em>aller chercher</em> or <em>reprendre</em> them <em>from</em> it.", "cols": "two"}, {"name": "Page 89 — activités 4 et 5", "items": [["Activité 4 : Échangez avec votre voisin(e).", "ay-shahn-ZHAY a-vek VOT-ruh vwa-ZAN", "Talk with your neighbour."], ["1. Comparez vos rythmes de vie : à l'aide des dessins, dites quelles activités vous faites le matin, à midi, le soir. Précisez l'heure.", "kohm-pa-RAY vo reetm duh VEE … pray-see-ZAY LUR", "Compare your rhythms of life using the drawings. Give the times."], ["Les douze dessins : dormir – faire la cuisine – faire les courses – se réveiller – se doucher – regarder la télé", "dor-MEER, fair lah kwee-ZEEN, fair lay KOORSS", "the first six pictograms"], ["…manger – lire – ranger – faire la vaisselle – faire le ménage – se coucher", "mahn-ZHAY, LEER, rahn-ZHAY", "the last six pictograms"], ["2. Dites quelles activités vous aimez / n'aimez pas faire.", "deet kel zak-tee-vee-TAY voo zay-MAY", "Say which activities you like and dislike doing."], ["3. Sélectionnez les activités agréables et imaginez une journée idéale.", "say-lek-see-o-NAY lay zak-tee-vee-TAY a-gray-AH-bluh", "Pick the pleasant ones and imagine an ideal day."], ["Activité 5 : Imaginez !", "ee-ma-zhee-NAY", "Imagine!"], ["Journaliste au magazine Elle, vous êtes responsable de la rubrique « 24 heures avec… ».", "zhoor-na-LEEST … lah rew-BREEK van-katr UR a-VEK", "As a journalist at Elle, you run the '24 hours with…' column."], ["Vous avez interviewé une personne célèbre sur sa journée habituelle et vous la racontez dans le magazine :", "voo za-vay an-tair-vew-AY ewn pair-SUN say-LEB-ruh", "You've interviewed a celebrity about their typical day and write it up:"], ["ses activités et horaires, les lieux où il/elle va…", "say zak-tee-vee-TAY ay zo-RAIR, lay lee-UH oo eel VA", "their activities and times, the places they go…"]]}, {"name": "Les enregistrements", "items": [], "note": "The 🎧 icons in Leçon 3.", "tracks": [{"n": 119, "label": "p.91 act. 9 — phonétique, mots identiques ou différents ?"}, {"n": 120, "label": "p.91 act. 9 — quelle phrase entendez-vous ?"}]}, {"name": "Page 90 — le journal intime : 14 mai, 21 heures", "items": [["Raconter des événements passés", "ra-kohn-TAY day zay-vayn-MAHN pa-SAY", "Recounting past events"], ["14 mai, 21 heures — Vacances !", "ka-TORZ MAY, van-tay-uh NUR — va-KAHNSS", "14 May, 9pm — Holiday!"], ["Pas de dîner à préparer, pas de mari, pas d'enfants, super !", "pah duh dee-NAY a pray-pa-RAY, pah duh ma-REE, pah dahn-FAHN", "No dinner to make, no husband, no children, great!"], ["Hier, je suis restée au lit tout l'après-midi et j'ai lu !", "ee-AIR, zhuh swee res-TAY oh LEE too la-pray-mee-DEE ay zhay LEW", "Yesterday I stayed in bed all afternoon and I read!"], ["Je n'ai pas fait le ménage, je n'ai pas couru pour prendre le bus, je n'ai pas fait les courses… Quel bonheur !", "zhuh nay pah fay luh may-NAHZH … zhuh nay pah koo-REW … kel bo-NUR", "I didn't clean, I didn't run for the bus, I didn't do the shopping… What bliss!"], ["Ce soir, je suis allée dans un petit resto près de la plage", "suh SWAHR, zhuh swee za-LAY dahn zuhn puh-tee res-TO pray duh lah PLAHZH", "This evening I went to a little restaurant near the beach"], ["et, ce matin, j'ai dormi jusqu'à 10 h 30…", "ay, suh ma-TAN, zhay dor-MEE zhews-KA dee zur trahnt", "and this morning I slept until 10.30…"], ["Cet après-midi, je suis sortie de l'hôtel à 3 heures et j'ai marché sur la plage, c'est tout !", "set a-pray-mee-DEE, zhuh swee sor-TEE duh lo-TELL … ay zhay mar-SHAY", "This afternoon I left the hotel at 3 and walked on the beach, that's all!"], ["Nice, c'est magnifique !", "NEESS, say ma-nyee-FEEK", "Nice is magnificent!"]]}, {"name": "Page 90 — 16 mai, minuit", "items": [["16 mai, minuit", "SEZ MAY, mee-NWEE", "16 May, midnight"], ["Aujourd'hui, journée soleil, détente et lecture sur la plage.", "oh-zhoor-DWEE, zhoor-NAY so-LAY, day-TAHNT ay lek-TEWR sewr lah PLAHZH", "Today: a day of sun, relaxation and reading on the beach."], ["J'ai rencontré des gens sympas qui sont venus en vacances ; ils sont arrivés hier matin.", "zhay rahn-kohn-TRAY day zhahn san-PAH kee sohn vuh-NEW … eel sohn ta-ree-VAY ee-AIR ma-TAN", "I met some nice people who've come on holiday; they arrived yesterday morning."], ["Ce soir, nous avons dansé après le dîner !", "suh SWAHR, noo za-VOHN dahn-SAY a-PRAY luh dee-NAY", "This evening we danced after dinner!"], ["Ce matin, Thomas a téléphoné… Il me demande de rentrer !", "suh ma-TAN, to-MAH a tay-lay-fo-NAY … eel muh duh-MAHND duh rahn-TRAY", "This morning Thomas phoned… He's asking me to come home!"], ["Mais je suis EN VACANCES !", "may zhuh swee zahn va-KAHNSS", "But I'm ON HOLIDAY!"]]}, {"name": "Page 90 — 18 mai, 18 heures", "items": [["18 mai, 18 heures", "dee-ZWEET MAY, dee-zwee TUR", "18 May, 6pm"], ["Hier, je suis partie toute la journée, j'ai visité deux musées : le musée Matisse et le musée Chagall.", "ee-AIR, zhuh swee par-TEE toot lah zhoor-NAY, zhay vee-zee-TAY duh mew-ZAY", "Yesterday I was out all day, I visited two museums: the Matisse and the Chagall."], ["Aujourd'hui, j'ai pris le bus et j'ai visité la région : Antibes, Juan-les-Pins, Saint-Paul-de-Vence.", "oh-zhoor-DWEE, zhay pree luh BEWSS ay zhay vee-zee-TAY lah ray-zhee-OHN", "Today I took the bus and toured the region: Antibes, Juan-les-Pins, Saint-Paul-de-Vence."], ["Thomas a encore appelé ce matin, il a laissé un message à l'hôtel…", "to-MAH a ahn-KOR a-play SUH ma-TAN, ee la lay-SAY uhn muh-SAHZH", "Thomas called again this morning, he left a message at the hotel…"], ["Je dois rentrer demain, mais j'ai décidé une chose importante cette semaine :", "zhuh dwah rahn-TRAY duh-MAN, may zhay day-see-DAY ewn shoz an-por-TAHNT", "I have to go home tomorrow, but I've decided something important this week:"], ["maintenant, une semaine de vacances SEULE, chaque année !", "mant-NAHN, ewn suh-MEN duh va-KAHNSS SUL, shak a-NAY", "from now on, a week's holiday ALONE, every year!"], ["Et à partir de demain, tout change à la maison !", "ay a par-TEER duh duh-MAN, too SHAHNZH a lah may-ZOHN", "And from tomorrow, everything changes at home!"]]}, {"name": "Page 90 — activité 6", "items": [["Observez le document et répondez.", "ob-sair-VAY luh do-kew-MAHN", "Look at the document and answer."], ["1. Il s'agit : d'une lettre / d'une page de journal intime / d'un article de journal", "eel sa-ZHEE", "This is: a letter / a diary page / a newspaper article"], ["→ d'une page de journal intime.", "dewn pahzh duh zhoor-NAL an-TEEM", "a diary page"], ["2. Qui écrit ? Quand ? Où ? Pourquoi ?", "kee ay-KREE ? kahn ? oo ? poor-KWAH", "Who writes? When? Where? Why?"], ["→ Myriam écrit les 14, 16 et 18 mai, à Nice, pendant une semaine de vacances seule.", "… a NEESS, pahn-DAHN ewn suh-MEN duh va-KAHNSS SUL", "Myriam writes on 14, 16 and 18 May, in Nice, during a week's holiday alone."], ["b) Choisissez la bonne réponse. Le séjour au bord de la mer est :", "luh say-ZHOOR oh bor
