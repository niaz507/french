-kay-REK", "the user's name"], ["Travaille chez : Nexton", "tra-VIGH shay", "Works at: Nexton"], ["A étudié à : l'université de Grenoble", "a ay-tew-dee-AY a", "Studied at: the University of Grenoble"], ["Habite à : Grenoble", "a-BEET a", "Lives in: Grenoble"], ["Né le : 26 juillet", "NAY luh van-sees zhwee-YAY", "Born on: 26 July"], ["Amis (263)", "a-MEE", "Friends (263)"], ["Delphine Guillet · Karim Keffache · Sarah Barnier · Stéphanie Legrand · Patrice Bazin", "del-FEEN gee-YAY · ka-REEM · sa-RAH bar-nee-AY · stay-fa-NEE luh-GRAHN · pa-TREESS ba-ZAN", "the five friends listed"], ["Exprimez-vous", "eks-pree-may VOO", "Say something — the status box"], ["Partager", "par-ta-ZHAY", "Share"], ["Yann Lequérec : « C'est décidé, je quitte mon boulot, je prends la route ! Bientôt le grand départ ! »", "say day-see-DAY, zhuh keet mohn boo-LO, zhuh prahn lah ROOT", "It's decided, I'm quitting my job, I'm hitting the road! The big departure soon!"]], "note": "<strong>le boulot</strong> is very common informal French for <em>work</em> or <em>job</em>. The photo strip shows him climbing, in the snow, mountain biking, at the Eiffel Tower and in the sea; the status photo shows a packed cardboard box on an empty office chair."}, {"name": "Page 102 — activités 1, 2 et 3", "items": [["Activité 1 : Regardez cette page du réseau social Mybook.", "… luh ray-ZO so-see-AL", "Look at this page from the social network Mybook."], ["1. Trouvez toutes les informations personnelles sur l'utilisateur.", "… sewr lew-tee-lee-za-TUR", "Find all the personal information about the user."], ["2. Identifiez l'information importante dans l'actualité de l'utilisateur.", "… dahn lak-tew-a-lee-TAY", "Identify the important news in the user's update."], ["Activité 2 : Écoutez la conversation téléphonique de Yann et regardez sa page Mybook.", "ay-koo-TAY lah kohn-vair-sa-see-OHN tay-lay-fo-NEEK", "Listen to Yann's phone conversation and look at his page."], ["1. Identifiez, dans la liste de ses amis, qui appelle et pourquoi.", "… kee a-PELL ay poor-KWAH", "Identify from his friends list who is calling and why."], ["2. Expliquez le message de Yann sur son mur : « je prends la route ! Bientôt le grand départ ! »", "eks-plee-KAY luh muh-SAHZH … sewr sohn MEWR", "Explain Yann's wall message."], ["Activité 3 : Réécoutez la conversation téléphonique entre Yann et son amie puis répondez.", "ray-ay-koo-TAY", "Listen again then answer."], ["1. Parmi les événements annoncés, quels sont les événements passés et les événements futurs ? Justifiez vos réponses.", "par-MEE lay zay-vayn-MAHN a-nohn-SAY", "Which of the announced events are past and which are future?"], ["fête de départ – héritage – départ de Grenoble – tour du monde", "fet duh day-PAR – ay-ree-TAHZH – day-PAR duh gruh-NO-bluh – toor dew MOHND", "leaving party, inheritance, leaving Grenoble, round-the-world trip"], ["→ Passé : l'héritage (je viens de recevoir un héritage). Futur : la fête de départ, le départ de Grenoble, le tour du monde.", "pa-SAY … few-TEWR", "The inheritance has happened; the rest is to come."], ["2. Comment l'amie de Yann réagit-elle à la nouvelle ?", "ko-MAHN … ray-a-zhee TELL", "How does Yann's friend react to the news?"], ["le mur", "luh MEWR", "the wall (on a social network)"], ["un utilisateur / une utilisatrice", "uh new-tee-lee-za-TUR", "a user"], ["l'actualité", "lak-tew-a-lee-TAY", "the news, the update"]]}, {"name": "Page 103 — Point Langue : le passé récent et le futur proche", "items": [["a) Observez.", "ob-sair-VAY", "Observe."], ["Pour situer une action dans le passé immédiat, on utilise LE PASSÉ RÉCENT :", "poor see-tew-AY … dahn luh pa-SAY ee-may-dee-AH", "For an action in the immediate past, use the passé récent:"], ["Je viens de voir ton mur sur Mybook.", "zhuh vee-AN duh vwahr tohn MEWR", "I've just seen your wall on Mybook."], ["Je viens de recevoir un héritage.", "zhuh vee-AN duh ruh-suh-VWAHR uh nay-ree-TAHZH", "I've just received an inheritance."], ["Pour situer une action dans le futur immédiat, on utilise LE FUTUR PROCHE :", "… dahn luh few-TEWR ee-may-dee-AH", "For an action in the immediate future, use the futur proche:"], ["Tu vas quitter Grenoble ?", "tew va kee-TAY gruh-NO-bluh", "You're going to leave Grenoble?"], ["Je vais faire le tour du monde.", "zhuh vay fair luh toor dew MOHND", "I'm going to travel round the world."], ["b) Complétez les règles de formation.", "kohm-play-TAY lay reg duh for-ma-see-OHN", "Complete the formation rules."], ["Passé récent : verbe VENIR + DE + infinitif de l'action", "vairb vuh-NEER plew duh plew lan-fee-nee-TEEF", "venir + de + infinitive"], ["Futur proche (rappel) : verbe ALLER + infinitif de l'action", "vairb a-LAY plew lan-fee-nee-TEEF", "aller + infinitive"]], "note": "A neat symmetry: <strong>venir de</strong> looks just behind the present moment, <strong>aller</strong> just ahead of it. Note that only the passé récent needs the <strong>de</strong>."}, {"name": "Page 103 — activités 4 et 5", "items": [["Activité 4 : Écoutez les appels téléphoniques et regardez la page Mybook p. 102.", "ay-koo-TAY lay za-PELL tay-lay-fo-NEEK", "Listen to the phone calls and look at the Mybook page."], ["Identifiez les deux personnes qui cherchent à communiquer et dites à quel sujet.", "… kee shairsh a ko-mew-nee-KAY ay deet a kel sew-ZHAY", "Identify the two people trying to get in touch and what about."], ["Activité 5 : Réécoutez les appels. Pour chaque appel, identifiez la situation :", "poor shak a-PELL, ee-dahn-tee-fee-AY lah see-tew-a-see-OHN", "For each call, identify the situation:"], ["— qui appelle", "kee a-PELL", "who is calling"], ["— pour parler à qui", "poor par-LAY a KEE", "who they want to speak to"], ["— pourquoi précisément", "poor-KWAH pray-see-zay-MAHN", "exactly why"], ["— sur quel téléphone (portable, domicile…)", "sewr kel tay-lay-FON (por-TAH-bluh, do-mee-SEEL)", "on which phone: mobile, landline…"], ["— qui répond", "kee ray-POHN", "who answers"]]}, {"name": "Page 103 — Point Langue : appeler et répondre au téléphone", "items": [["Associez les situations au téléphone et les formules.", "a-so-see-AY lay see-tew-a-see-OHN … ay lay for-MEWL", "Match the phone situations to the phrases."], ["1. demander une personne au téléphone → a. (Est-ce que) Yann est là ? / f. Je voudrais parler à Yann Lequérec, s'il vous plaît.", "… ay TEEL LAH … zhuh voo-DREH par-LAY a", "asking for someone — a and f"], ["2. demander l'identité de la personne qui appelle → h. C'est de la part de qui ? / Qui est à l'appareil ?", "say duh lah par duh KEE … kee ay ta la-pa-RAY", "asking who's calling — h"], ["3. donner / confirmer son identité → b. C'est moi. / C'est Yann. / i. C'est qui ? / Qui est-ce ? / C'est Stéphanie ?", "say MWAH … say KEE", "giving or confirming identity — b and i"], ["4. demander de patienter → e. Ne quittez pas, je vous le passe. / Ne quitte pas, je te le passe.", "nuh kee-TAY PAH, zhuh voo luh PAHSS", "asking someone to hold — e"], ["5. proposer de laisser un message → c. Vous voulez / Tu veux laisser un message ?", "voo voo-LAY lay-SAY uhn muh-SAHZH", "offering to take a message — c"], ["6. vérifier / indiquer une erreur de numéro → d. Quel numéro demandez-vous ? / Vous faites erreur !", "kel new-may-RO duh-mahn-day VOO … voo fet ay-RUR", "checking or pointing out a wrong number — d"], ["7. s'excuser pour une erreur de numéro → g. Excusez-moi, je me suis trompée !", "eks-kew-zay MWAH, zhuh muh swee trohm-PAY", "apologising for a wrong number — g"]], "note": "Two phrases every learner needs: <strong>Qui est à l'appareil ?</strong> — literally 'who is at the apparatus' — and <strong>Ne quittez pas</strong>, which means 'hold the line', not 'don't leave'.", "cols": "two"}, {"name": "Page 103 — activités 6 et 7", "items": [["Activité 6 Phonétique a) Mots identiques ou différents ? Écoutez et répondez.", "mo zee-dahn-TEEK oo dee-fay-RAHN", "Same or different words? Listen and answer."], ["b) Écoutez et repérez la phrase entendue.", "… ruh-pay-RAY lah frahz ahn-tahn-DEW", "Listen and identify the sentence you hear."], ["1. Il tient bien. / Ils tiennent bien.", "eel tee-AN bee-AN / eel tee-EN bee-AN", "singular / plural"], ["2. Il vient bientôt. / Ils viennent bientôt.", "eel vee-AN bee-an-TO / eel vee-EN bee-an-TO", "singular / plural"], ["3. Il se souvient de tout. / Ils se souviennent de tout.", "eel suh soo-vee-AN duh TOO / eel suh soo-vee-EN duh TOO", "singular / plural"], ["4. Elle revient tard. / Elles reviennent tard.", "el ruh-vee-AN TAR / el ruh-vee-EN TAR", "singular / plural"], ["c) Réécoutez et répétez.", "ray-ay-koo-TAY ay ray-pay-TAY", "Listen again and repeat."], ["Activité 7 : Jouez la scène à deux.", "zhoo-AY lah sen a DUH", "Act out the scene in pairs."], ["Vous téléphonez à un(e) ami(e) pour lui annoncer un événement important qui vient de se produire et qui va avoir des conséquences sur votre vie.", "… kee vee-AN duh suh pro-DWEER ay kee va a-VWAHR day kohn-say-KAHNSS", "You phone a friend to announce an important event that has just happened and will change your life."]], "note": "The whole drill is the <strong>venir</strong> family: <em>tenir, venir, se souvenir, revenir</em>. Singular gives the nasal <strong>[jɛ̃]</strong> — <em>il vient</em>; plural opens it to <strong>[jɛn]</strong> — <em>ils viennent</em>. Activity 7 then makes you use both new tenses at once."}, {"name": "Page 104 — le site routard.com", "items": [["Donner des conseils", "do-NAY day kohn-SAY", "Giving advice"], ["http://www.routard.com/guide_dossier/id_dp/30/faire_le_tour_du_monde.htm", "…", "the web address"], ["routard.com — GUIDE · MAG · PARTIR · COMMUNAUTÉ", "roo-TAR — GEED · MAG · par-TEER · ko-mew-noh-TAY", "the site's four tabs"], ["VOYAGE MODE D'EMPLOI — Avant de partir · Transports · Pendant le voyage · Après le voyage", "vwa-YAHZH mod dahm-PLWAH", "Travel: instructions for use — the sidebar menu"], ["Préparer son tour du monde · Faire le tour du monde", "pray-pa-RAY sohn toor dew MOHND", "the submenu"], ["Recherche sur routard.com", "ruh-SHAIRSH", "Search routard.com"], ["Espace de connexion · Inscription newsletter", "es-PAHSS duh ko-nek-see-OHN", "login area, newsletter sign-up"], ["un routard", "uhn roo-TAR", "a backpacker"]], "note": "<em>Le Routard</em> is France's best-known budget travel guide series; <strong>un routard</strong> means a backpacker, from <em>la route</em>."}, {"name": "Page 104 — FAIRE LE TOUR DU MONDE : Pourquoi ?", "items": [["FAIRE LE TOUR DU MONDE — POURQUOI ?", "fair luh toor dew MOHND — poor-KWAH", "TRAVELLING ROUND THE WORLD — WHY?"], ["Il y a beaucoup de raisons de faire le tour du monde : fin d'études, départ en retraite, congé sabbatique…", "… fan day-TEWD, day-PAR ahn ruh-TRET, kohn-ZHAY sa-ba-TEEK", "There are many reasons: finishing your studies, retiring, a sabbatical…"], ["Mais c'est un voyage unique dans une vie, il se prépare longtemps à l'avance.", "… eel suh pray-PAR lohn-TAHN a la-VAHNSS", "But it's a once-in-a-lifetime trip; it takes long preparation."], ["Impossible de partir du jour au lendemain :", "an-po-SEE-bluh duh par-TEER dew zhoor oh lahn-duh-MAN", "You can't just leave from one day to the next:"], ["organisez-vous pour profiter au maximum de cette aventure, n'improvisez pas !", "or-ga-nee-zay VOO poor pro-fee-TAY … nan-pro-vee-zay PAH", "get organised to make the most of the adventure, don't improvise!"]]}, {"name": "Page 104 — FAIRE LE TOUR DU MONDE : Comment ?", "items": [["COMMENT ?", "ko-MAHN", "HOW?"], ["Un tour du monde se compose généralement d'escales dans des pays qu'on veut découvrir.", "… suh kohm-POZ zhay-nay-ral-MAHN des-KAL", "A round-the-world trip is generally made up of stops in countries you want to discover."], ["Mais vous pouvez aussi imaginer le voyage en fonction d'une passion ou d'un centre d'intérêt :", "… ahn fohnk-see-OHN dewn pa-see-OHN", "But you can also plan it around a passion or an interest:"], ["les déserts, la musique, le vélo, les îles, etc.", "lay day-ZAIR, lah mew-ZEEK, luh vay-LO, lay ZEEL", "deserts, music, cycling, islands, etc."], ["Avant de partir, posez-vous des questions : quelles sont vos motivations ? Que voulez-vous voir ?", "… po-zay VOO day kes-tee-OHN … vo mo-tee-va-see-OHN", "Before you go, ask yourself questions: what are your motivations? What do you want to see?"], ["Préparez une liste des pays à visiter, fixez une durée pour le voyage,", "pray-pa-RAY ewn LEEST … feek-SAY ewn dew-RAY", "Draw up a list of countries, set a duration for the trip,"], ["choisissez une bonne période (en fonction du climat, des prix…).", "shwa-zee-SAY ewn bun pay-ree-OD (ahn fohnk-see-OHN dew klee-MAH)", "choose a good time of year (climate, prices…)."], ["Faites des recherches pour effectuer les bons choix et réussir votre voyage !", "fet day ruh-SHAIRSH poor ay-fek-tew-AY lay bohn SHWAH", "Do your research to make the right choices and make the trip a success!"], ["Autre petit conseil : ne soyez pas trop rigide.", "OH-truh puh-tee kohn-SAY : nuh swa-yay pah tro ree-ZHEED", "Another small piece of advice: don't be too rigid."], ["Le voyage, ce sont les rencontres, la découverte et les surprises (bonnes ou mauvaises), ce n'est pas un marathon.", "… lay rahn-KOHN-truh, lah day-koo-VAIRT ay lay sewr-PREEZ", "Travel is about encounters, discovery and surprises (good or bad) — it isn't a marathon."], ["Faites-vous plaisir, soyez curieux et n'ayez pas peur d'aller vers les autres.", "fet voo play-ZEER, swa-yay kew-ree-UH ay na-yay pah PUR", "Enjoy yourself, be curious and don't be afraid to approach people."], [">>> Page suivante", "pahzh swee-VAHNT", "Next page"]], "note": "Notice how much of this page is <strong>imperative</strong>: organisez-vous, n'improvisez pas, posez-vous, préparez, fixez, choisissez, faites, ne soyez pas, faites-vous plaisir, soyez, n'ayez pas peur. That is the grammar point of the lesson, embedded in real text."}, {"name": "Page 104 — activités 8 et 9", "items": [["Activité 8 : Observez cette page du site routard.com.", "ob-sair-VAY set PAHZH", "Look at this page from routard.com."], ["1. Expliquez le logo et le nom du site.", "eks-plee-KAY luh lo-GO ay luh NOHN", "Explain the site's logo and name."], ["→ Le logo montre un voyageur avec un sac à dos ; « routard » vient de « la route » et désigne un voyageur au petit budget.", "uhn vwa-ya-ZHUR a-vek uhn sak a DO", "The logo shows a backpacker; 'routard' comes from 'route'."], ["2. Identifiez le thème de la page. → Comment préparer un tour du monde.", "ee-dahn-tee-fee-AY luh TEM", "Identify the theme: how to prepare a round-the-world trip."], ["Activité 9 : Vrai ou faux ? Lisez la page « Faire le tour du monde » et répondez. Justifiez vos réponses.", "vray oo FO", "True or false? Justify your answers."], ["1. L'article donne des informations générales. → VRAI (les raisons, la composition d'un tour du monde).", "… day zan-for-ma-see-OHN zhay-nay-RAL", "TRUE — reasons and how a trip is structured."], ["2. L'article propose des destinations. → FAUX : il parle de thèmes (déserts, îles) mais ne nomme aucun pays.", "pro-POZ day des-tee-na-see-OHN", "FALSE — it suggests themes, not named destinations."], ["3. L'article propose des récits de tours du monde. → FAUX : il n'y a pas de témoignages.", "day ray-SEE", "FALSE — there are no travellers' accounts."], ["4. L'article donne des conseils. → VRAI : organisez-vous, n'improvisez pas, ne soyez pas trop rigide…", "dun day kohn-SAY", "TRUE — the whole second half is advice."]]}, {"name": "Page 104 — le forum : la demande de Yann", "items": [["Forum Le guide du routard — Communauté > Forums de voyage", "fo-ROM luh geed dew roo-TAR", "the forum's location on the site"], ["COMMUNAUTÉ — Forums de voyage · Photos de voyage · Bons plans · Petites annonces", "ko-mew-noh-TAY … bohn PLAHN · puh-teet za-NOHNSS", "the community menu: forums, photos, tips, small ads"], ["Vos conseils pour partir", "vo kohn-SAY poor par-TEER", "Your advice for setting off"], ["Posté par Yannou le 15 janvier à 23h45 dans Argent et budget", "pos-TAY par ya-NOO … dahn zar-ZHAHN ay bewd-ZHAY", "Posted by Yannou on 15 January at 23:45 in Money and budget"], ["Bonjour, Je voudrais faire le tour du monde et j'ai un petit budget.", "zhuh voo-DREH fair luh toor dew MOHND ay zhay uhn puh-tee bewd-ZHAY", "Hello, I'd like to travel round the world and I have a small budget."], ["Quels sont vos conseils pour voyager quand on n'a pas beaucoup d'argent ?", "kel sohn vo kohn-SAY poor vwa-ya-ZHAY", "What's your advice for travelling when you don't have much money?"], ["Merci à vous !!", "mair-SEE a VOO", "Thank you!!"]], "note": "Activity 10 asks you to identify the request: Yann — posting as <strong>Yannou</strong> — wants advice on travelling <strong>cheaply</strong>, and he's posted it in the <em>Argent et budget</em> section."}, {"name": "Page 104 — la réponse de Daniel", "items": [["Bonjour, Voici quelques conseils, à partir de mon expérience.", "vwa-SEE kel-kuh kohn-SAY, a par-TEER duh moh nek-spay-ree-AHNSS", "Hello, here's some advice, from my own experience."], ["Première chose pour économiser : voyage en stop !", "pruh-mee-AIR shoz poor ay-ko-no-mee-ZAY : vwa-YAHZH ahn STOP", "First thing to save money: hitchhike!"], ["Pour la nuit, emporte une tente, c'est pratique et pas cher.", "poor lah NWEE, ahm-PORT ewn TAHNT", "For the night, take a tent, it's practical and cheap."], ["Le problème, c'est la sécurité… Sois prudent, ne dors pas sur la plage.", "luh pro-BLEM, say lah say-kew-ree-TAY… swah prew-DAHN, nuh dor pah sewr lah PLAHZH", "The problem is safety… Be careful, don't sleep on the beach."], ["Beaucoup de personnes acceptent de loger des voyageurs, n'aie pas peur de demander.", "… ak-SEPT duh lo-ZHAY day vwa-ya-ZHUR, nay pah PUR duh duh-mahn-DAY", "Lots of people are happy to put travellers up; don't be afraid to ask."], ["Autre possibilité : inscris-toi sur le site couchsurfing.com.", "OH-truh po-see-bee-lee-TAY : an-skree TWAH", "Another option: sign up on couchsurfing.com."], ["Mais… n'économise pas sur la santé, la sécurité et la communication avec ta famille et tes amis.", "may … nay-ko-no-MEEZ pah sewr lah sahn-TAY", "But… don't economise on health, safety or keeping in touch with family and friends."], ["Pour d'autres conseils, informe-toi sur des sites spécialisés, par exemple http://forum.tourdumonde.be/ ou http://www.e-voyageur.com.", "an-FORM TWAH sewr day seet spay-see-a-lee-ZAY", "For more advice, look at specialist sites."], ["Ne t'inquiète pas ! Ça va être super ! Bonne route ! Daniel", "nuh tan-kee-ET PAH ! sa va EH-truh sew-PAIR ! bun ROOT", "Don't worry! It'll be great! Safe travels! Daniel"], ["* Réseau social : permet de dormir gratuitement et temporairement chez des personnes qui accueillent des voyageurs.", "ray-ZO so-see-AL … kee a-KUH-yuh day vwa-ya-ZHUR", "the footnote explaining couchsurfing"]], "note": "Activity 11: Daniel's advice covers <strong>transport</strong> (hitchhiking), <strong>logement</strong> (tent, couchsurfing) and <strong>sécurité</strong> (be careful, don't sleep on the beach, don't skimp on health) — but not food or visits."}, {"name": "Page 105 — Point Langue : l'impératif pour donner des conseils", "items": [["a) Observez les verbes dans les phrases suivantes. Expliquez la différence et trouvez l'infinitif des verbes.", "… eks-plee-KAY lah dee-fay-RAHNSS", "Explain the difference and find the infinitives."], ["Faites des recherches. → faire (verbe simple)", "fet day ruh-SHAIRSH", "a plain verb"], ["Faites-vous plaisir. → se faire plaisir (verbe pronominal)", "fet voo play-ZEER", "a reflexive verb — the pronoun follows"], ["b) Relisez les conseils du site routard.com et de Daniel. Complétez le tableau.", "kohm-play-TAY luh ta-BLO", "Complete the table."], ["Être → 2e personne du singulier : Sois prudent · 2e du pluriel : Soyez prudent", "SWAH prew-DAHN / swa-YAY prew-DAHN", "Be careful"], ["Avoir (ne pas avoir peur) → N'aie pas peur · N'ayez pas peur", "nay pah PUR / na-yay pah PUR", "Don't be afraid"], ["S'informer → Informe-toi · Informez-vous", "an-FORM TWAH / an-for-may VOO", "Find out"], ["S'organiser → Organise-toi · Organisez-vous", "or-ga-NEEZ TWAH / or-ga-nee-zay VOO", "Get organised"], ["S'inscrire → Inscris-toi · Inscrivez-vous", "an-SKREE TWAH / an-skree-vay VOO", "Sign up"], ["S'inquiéter (ne pas s'inquiéter) → Ne t'inquiète pas · Ne vous inquiétez pas", "nuh tan-kee-ET PAH / nuh voo zan-kee-ay-TAY PAH", "Don't worry"]], "cols": "two"}, {"name": "Page 105 — la règle de l'impératif pronominal", "items": [["c) Répondez (rappel). On utilise le sujet avec les verbes à l'impératif. → FAUX", "ohn ew-tee-LEEZ luh sew-ZHAY", "FALSE — the imperative has no subject pronoun."], ["d) Trouvez la règle de l'impératif des verbes pronominaux.", "troo-VAY lah REG", "Find the rule for reflexive imperatives."], ["À l'impératif AFFIRMATIF, le pronom apparaît APRÈS LE VERBE.", "a lan-pay-ra-TEEF a-feer-ma-TEEF … a-PRAY luh VAIRB", "In the affirmative imperative, the pronoun comes after the verb."], ["Exemple : Organise-toi. / Informez-vous.", "or-ga-NEEZ TWAH", "and it's joined by a hyphen"], ["À l'impératif NÉGATIF, le pronom apparaît AVANT LE VERBE.", "… nay-ga-TEEF … a-VAHN luh VAIRB", "In the negative imperative, the pronoun comes before the verb."], ["Exemple : Ne t'inquiète pas. / Ne vous inquiétez pas.", "nuh tan-kee-ET PAH", "and it goes back inside the ne… pas"]], "note": "Two more details worth noting: <strong>te</strong> becomes <strong>toi</strong> when it moves after the verb, and <em>être</em> and <em>avoir</em> have irregular imperatives — <strong>sois / soyez</strong> and <strong>aie / ayez</strong>."}, {"name": "Page 105 — activité 12 et le projet", "items": [["a) En petits groupes, décidez quelle demande de conseil vous souhaitez poster sur le forum de routard.com.", "… kel duh-MAHND duh kohn-SAY voo soo-ay-TAY pos-TAY", "In small groups, decide what request for advice you want to post."], ["b) Les groupes lisent les demandes de conseil et choisissent de répondre à l'une d'elles.", "… ay shwa-ZEESS duh ray-POHN-druh a lewn DELL", "The groups read the requests and choose one to answer."], ["Forum Le guide du routard — Les bons plans routards par les routards", "lay bohn plahn roo-TAR par lay roo-TAR", "Backpacker tips by backpackers"], ["Bienvenue sur les forums du routard. Ces forums de voyage ont VRAIMENT été pensés pour vous !", "bee-an-vuh-NEW … ohn vray-MAHN ay-TAY pahn-SAY poor VOO", "Welcome to the Routard forums. These travel forums were REALLY designed for you!"], ["Alors, n'hésitez pas : engagez la discussion !", "a-LOR, nay-zee-tay PAH : ahn-ga-ZHAY lah dees-kew-see-OHN", "So don't hesitate: start the conversation!"], ["Projet Dossier 5 — Tâche leçon 2 : Organiser l'action et mobiliser les participants.", "or-ga-nee-ZAY lak-see-OHN ay mo-bee-lee-ZAY lay par-tee-see-PAHN", "Task: organise the action and rally the participants."]]}, {"name": "Le vocabulaire de la leçon", "items": [["un réseau social", "uhn ray-ZO so-see-AL", "a social network"], ["le mur", "luh MEWR", "the wall"], ["un utilisateur", "uh new-tee-lee-za-TUR", "a user"], ["le boulot", "luh boo-LO", "work, job (informal)"], ["quitter", "kee-TAY", "to leave, to quit"], ["prendre la route", "PRAHN-druh lah ROOT", "to hit the road"], ["le grand départ", "luh grahn day-PAR", "the big departure"], ["un héritage", "uh nay-ree-TAHZH", "an inheritance"], ["le tour du monde", "luh toor dew MOHND", "a round-the-world trip"], ["un conseil", "uhn kohn-SAY", "a piece of advice"], ["conseiller", "kohn-say-YAY", "to advise"], ["une escale", "ew nes-KAL", "a stopover"], ["une motivation", "ewn mo-tee-va-see-OHN", "a motivation"], ["une durée", "ewn dew-RAY", "a duration"], ["une période", "ewn pay-ree-OD", "a period, a time of year"], ["le climat", "luh klee-MAH", "the climate"], ["faire des recherches", "fair day ruh-SHAIRSH", "to do research"], ["improviser", "an-pro-vee-ZAY", "to improvise"], ["rigide", "ree-ZHEED", "rigid, inflexible"], ["curieux / curieuse", "kew-ree-UH / kew-ree-UHZ", "curious"], ["se faire plaisir", "suh fair play-ZEER", "to treat oneself"], ["économiser", "ay-ko-no-mee-ZAY", "to save money"], ["voyager en stop", "vwa-ya-ZHAY ahn STOP", "to hitchhike"], ["une tente", "ewn TAHNT", "a tent"], ["loger", "lo-ZHAY", "to put someone up"], ["prudent / prudente", "prew-DAHN / prew-DAHNT", "careful"], ["la sécurité", "lah say-kew-ree-TAY", "safety"], ["s'inquiéter", "san-kee-ay-TAY", "to worry"], ["s'inscrire", "san-SKREER", "to sign up"], ["un congé sabbatique", "uhn kohn-ZHAY sa-ba-TEEK", "a sabbatical"], ["le départ en retraite", "luh day-PAR ahn ruh-TRET", "retirement"], ["du jour au lendemain", "dew zhoor oh lahn-duh-MAN", "from one day to the next"], ["Bonne route !", "bun ROOT", "Safe travels!"]], "cols": "two"}]}, {"id": "ae-d5l3", "label": "Dossier 5 · Leçon 3", "name": "Vie privée, vie publique", "summary": "Pages 106–109. Celebrity press covers, the passé composé for past events (avoir vs être, including the donner naissance / naître contrast), the fifteen être-verbs, physical description vocabulary, and c'est vs il/elle est. The Voilà magazine article is summarised rather than reproduced, as genuine periodical content.", "art": null, "bookpages": ["p106", "p107", "p108", "p109"], "groups": [{"name": "Page 106 — les couvertures de magazines", "items": [["Vie privée, vie publique", "vee pree-VAY, vee pew-BLEEK", "Private life, public life"], ["Évoquer des faits passés", "ay-vo-KAY day fay pa-SAY", "Referring to past events"], ["France Dimanche — a celebrity weekly, cover line about Céline Dion", "frahnss dee-MAHNSH", "the first magazine cover shown"], ["Paris Match — a celebrity weekly, cover about the royal wedding of Albert and Charlène of Monaco", "pa-ree MATCH", "the second magazine cover shown"], ["Voilà, n° 75 — a third celebrity weekly, the article used for the lesson", "vwa-LAH", "the magazine the activities are based on"]], "note": "These are genuine French celebrity-press magazines (France Dimanche, Paris Match, Voilà), reproduced in the coursebook as realia. Their content is real periodical journalism, so rather than transcribing the articles' body text at length here, this entry stays at the level of what each cover and page is and what it's about."}, {"name": "Page 106 — activité 1 : les couvertures", "items": [["Activité 1 a) Regardez les deux couvertures de magazine et répondez.", "ruh-gar-DAY lay duh koo-vair-TEWR duh ma-ga-ZEEN", "Look at the two magazine covers and answer."], ["De quel type de magazine s'agit-il ?", "duh kel teep duh ma-ga-ZEEN sa-zheet EEL", "What kind of magazine is this?"], ["→ Ce sont des magazines people / à sensation, sur les célébrités.", "suh sohn day ma-ga-ZEEN PEE-pul", "Celebrity / tabloid-style magazines."], ["De quoi ces magazines parlent-ils en général ?", "duh kwah say ma-ga-ZEEN parl TEEL ahn zhay-nay-RAL", "What do these magazines generally cover?"], ["→ De la vie privée des célébrités : mariages, naissances, confidences.", "duh lah vee pree-VAY day say-lay-bree-TAY", "The private lives of celebrities: weddings, births, confessions."], ["b) Pourquoi est-ce que les gens lisent ce type de magazine ? Et vous, lisez-vous ces magazines ? Pourquoi ?", "poor-KWAH es-kuh lay zhahn LEEZ suh teep duh ma-ga-ZEEN", "Why do people read this kind of magazine? Do you? Why?"]], "note": "On the France Dimanche cover, the headline concerns Céline Dion; on Paris Match, the royal wedding of Albert and Charlène of Monaco. Both are shown only to identify the genre, in line with activity 1's actual question — what kind of magazine, and why people read it."}, {"name": "Page 106 — l'article de Voilà : le sujet", "items": [["Voilà, n° 75", "vwa-LAH, new-may-RO swa-sahnt-KANZ", "Voilà, issue 75"], ["Marion Cotillard a donné naissance à son premier enfant.", "ma-ree-OHN ko-tee-YAR a do-NAY nay-SAHNSS a sohn pruh-mee-AY rahn-FAHN", "Headline: Marion Cotillard has given birth to her first child."], ["Guillaume Canet et Marion Cotillard sont les heureux parents d'un petit Marcel !", "gee-YOM ka-NAY ay ma-ree-OHN ko-tee-YAR sohn lay zuh-RUH pa-RAHN duhn puh-tee mar-SELL", "Guillaume Canet and Marion Cotillard are the happy parents of a little Marcel!"], ["Riches, beaux, célèbres… et heureux", "REESH, BO, say-LEB-ruh, ay uh-RUH", "Rich, good-looking, famous… and happy — the first section heading"], ["Une famille d'artistes", "ewn fa-MEE dar-TEEST", "A family of artists — the second section heading"]], "note": "The article's two sections describe the couple's careers and the birth of their son Marcel, named after Marcel Cerdan — the great love of Édith Piaf, whom Cotillard played in the film La Môme, for which she won the Oscar for Best Actress in 2008. Guillaume Canet is an actor and director whose film Les Petits Mouchoirs (2010) was a major popular success. The full article text is genuine magazine journalism and isn't reproduced here at length; this is a summary of its content for the exercise."}, {"name": "Page 106 — activité 2", "items": [["Activité 2 : Lisez l'article du magazine Voilà et répondez.", "lee-ZAY lar-TEE-kluh dew ma-ga-ZEEN vwa-LAH", "Read the Voilà magazine article and answer."], ["1. Qui sont les personnes sur la photo (nom, relation, profession) ?", "kee sohn lay pair-SUN sewr lah fo-TO (nohn, ruh-la-see-OHN, pro-fay-see-OHN)", "Who are the people in the photo (name, relationship, profession)?"], ["→ Guillaume Canet, acteur et réalisateur, et Marion Cotillard, actrice ; ils sont en couple.", "gee-YOM ka-NAY, ak-TUR ay ray-a-lee-za-TUR … ak-TREESS", "Guillaume Canet, actor and director, and Marion Cotillard, actress; they're a couple."], ["2. Quelle nouvelle est annoncée ?", "kel noo-VELL ay ta-nohn-SAY", "What news is announced?"], ["→ La naissance de leur premier enfant, un petit garçon prénommé Marcel.", "lah nay-SAHNSS duh lur pruh-mee-AY rahn-FAHN, uhn puh-tee gar-SOHN pray-no-MAY mar-SELL", "The birth of their first child, a little boy named Marcel."]]}, {"name": "Le vocabulaire de la leçon (introduction)", "items": [["la vie privée / la vie publique", "lah vee pree-VAY / lah vee pew-BLEEK", "private life / public life"], ["un magazine people", "uhn ma-ga-ZEEN PEE-pul", "a celebrity magazine"], ["une célébrité", "ewn say-lay-bree-TAY", "a celebrity"], ["une confession", "ewn kohn-fay-see-OHN", "a confession"], ["donner naissance à", "do-NAY nay-SAHNSS a", "to give birth to"], ["les heureux parents", "lay zuh-RUH pa-RAHN", "the happy parents"], ["un couple glamour", "uhn KOO-pluh gla-MOOR", "a glamorous couple"], ["se rencontrer", "suh rahn-kohn-TRAY", "to meet each other"], ["le tournage", "luh toor-NAHZH", "the filming"], ["une carrière", "ewn ka-ree-AIR", "a career"], ["un réalisateur / une réalisatrice", "uhn ray-a-lee-za-TUR", "a director"], ["un metteur en scène", "uhn met-tur ahn SEN", "a stage/film director"], ["un succès populaire", "uhn sewk-SAY po-pew-LAIR", "a popular success"], ["un hommage à", "uh no-MAHZH a", "a tribute to"]], "cols": "two"}, {"name": "Les enregistrements", "items": [], "note": "The 🎧 icons in Leçon 3, pages 107–109.", "tracks": [{"n": 134, "label": "p.107 act. 5 & 6 — le dialogue et la notice de Marion Cotillard"}, {"n": 135, "label": "p.107 act. 7 — phonétique, le récit et les formes pronominales"}]}, {"name": "Page 107 — activités 3 et 4", "items": [["Activité 3 : Relisez l'article p. 106 et trouvez le thème de chaque paragraphe.", "ruh-lee-ZAY lar-TEE-kluh … ay troo-VAY luh TEM duh shak pa-ra-GRAF", "Reread the article and find each paragraph's theme."], ["Naissance du bébé", "nay-SAHNSS dew bay-BAY", "the baby's birth"], ["Explication du choix du prénom", "eks-plee-ka-see-OHN dew shwah dew pray-NOHN", "explanation of the first name chosen"], ["Biographie de la mère", "bee-o-gra-FEE duh lah MAIR", "the mother's biography"], ["Présentation du couple et de leur relation", "pray-zahn-ta-see-OHN dew KOO-pluh ay duh lur ruh-la-see-OHN", "introducing the couple and their relationship"], ["Biographie du père", "bee-o-gra-FEE dew PAIR", "the father's biography"], ["Activité 4 : Relisez et trouvez la chronologie des événements. Justifiez vos réponses.", "ruh-lee-ZAY ay troo-VAY lah kro-no-lo-ZHEE", "Reread and work out the order of events. Justify."], ["naissance d'un premier enfant", "nay-SAHNSS duhn pruh-mee-AY rahn-FAHN", "birth of a first child"], ["rencontre amoureuse", "rahn-KOHN-truh a-moo-RUHZ", "falling in love / meeting"], ["obtention d'un Oscar", "ob-tahn-see-OHN duhn os-KAR", "winning an Oscar"], ["annonce de la relation amoureuse", "a-NOHNSS duh lah ruh-la-see-OHN a-moo-RUHZ", "announcing the relationship"], ["obtention d'un César", "ob-tahn-see-OHN duhn say-ZAR", "winning a César"]], "note": "From the summarised article: they met in 2003, made their relationship official in 2007, Cotillard won the Oscar in 2008, and their son was born in 2011 — so the order is: rencontre → annonce → Oscar → naissance. The César is mentioned for Canet's own directing award, a separate event."}, {"name": "Page 107 — Point Langue : le passé composé, a) et b)", "items": [["Le passé composé pour évoquer des faits passés", "luh pa-SAY kohm-po-ZAY poor ay-vo-KAY day fay pa-SAY", "The passé composé for referring to past events"], ["a) Dites dans quelle colonne placer les extraits suivants.", "deet dahn kel ko-LUN plah-SAY lay zeks-TRAH", "Say which column each extract belongs in."], ["Colonne AVOIR : Marion Cotillard a obtenu l'Oscar.", "ma-ree-OHN ko-tee-YAR a ob-tuh-NEW los-KAR", "Marion Cotillard won the Oscar."], ["Colonne AVOIR : Il a remporté le César.", "ee la rahm-por-TAY luh say-ZAR", "He won the César."], ["Colonne AVOIR : Guillaume Canet a commencé sa carrière au théâtre.", "gee-YOM ka-NAY a ko-mahn-SAY sa ka-ree-AIR oh tay-AH-truh", "Guillaume Canet began his career in theatre."], ["Colonne AVOIR : Il a joué dans plusieurs films.", "ee la zhoo-AY dahn plew-zee-UR FEELM", "He acted in several films."], ["Colonne ÊTRE : Leur histoire est devenue officielle en 2007.", "lur ees-TWAHR ay duh-vuh-NEW o-fee-see-ELL", "Their relationship became official in 2007."], ["Colonne ÊTRE : Ils se sont rencontrés en 2003.", "eel suh sohn rahn-kohn-TRAY", "They met in 2003. — reflexive"], ["Colonne ÊTRE : Marion Cotillard a donné naissance à son premier enfant.", "… a do-NAY nay-SAHNSS", "Marion Cotillard gave birth to her first child. — this one is AVOIR, despite the topic"], ["Colonne ÊTRE : Le petit Marcel est né le 20 mai.", "luh puh-tee mar-SELL ay NAY", "Little Marcel was born on 20 May."], ["Colonne ÊTRE : L'actrice ne s'est pas déplacée.", "lak-TREESS nuh say pah day-pla-SAY", "The actress did not travel there. — reflexive negative"]], "note": "Watch the one that trips people up: <em>donner naissance à</em> uses <strong>avoir</strong> — <em>a donné naissance</em> — even though the topic is a birth; it's <em>naître</em> (<em>est né</em>) that takes être."}, {"name": "Page 107 — Point Langue : c), d) et les quinze verbes", "items": [["b) Quinze verbes se conjuguent avec être au passé composé. Complétez la liste.", "kanz vairb suh kohn-zhewg a-vek EH-truh", "Fifteen verbs take être. Complete the list."], ["monter ≠ descendre", "mohn-TAY ≠ day-SAHN-druh", "to go up ≠ to go down"], ["aller ≠ venir", "a-LAY ≠ vuh-NEER", "to go ≠ to come"], ["naître ≠ mourir", "NET-ruh ≠ moo-REER", "to be born ≠ to die"], ["entrer ≠ sortir", "ahn-TRAY ≠ sor-TEER", "to enter ≠ to go out"], ["arriver ≠ partir", "a-ree-VAY ≠ par-TEER", "to arrive ≠ to leave"], ["retourner", "ruh-toor-NAY", "to return"], ["tomber", "tohm-BAY", "to fall"], ["passer", "pa-SAY", "to pass by, to call in"], ["rester", "res-TAY", "to stay"], ["c) Tous les verbes pronominaux se conjuguent avec être au passé composé. Donnez d'autres exemples.", "too lay vairb pro-no-mee-NO suh kohn-zhewg a-vek EH-truh", "All reflexive verbs take être. Give other examples."], ["se déplacer", "suh day-pla-SAY", "to travel, to move about"], ["se rencontrer", "suh rahn-kohn-TRAY", "to meet each other"], ["se marier", "suh ma-ree-AY", "to get married"], ["se lever", "suh luh-VAY", "to get up"], ["d) Rappelez-vous ! Complétez la règle.", "ra-play-VOO ! kohm-play-TAY lah REG", "Remember! Complete the rule."], ["Quand le passé composé est formé avec AVOIR, le participe passé ne s'accorde pas avec le sujet. Exemple : Elle a obtenu l'Oscar.", "el a ob-tuh-NEW los-KAR", "With avoir, the participle doesn't agree with the subject."], ["Quand le passé composé est formé avec ÊTRE, le participe passé s'accorde avec le sujet. Exemple : Elle est née à Paris.", "el ay nay a pa-REE", "With être, the participle agrees with the subject."]], "note": "The full DR & MRS VANDERTRAMP-style list from the book: monter/descendre, aller/venir, naître/mourir, entrer/sortir, arriver/partir, retourner, tomber, passer, rester — nine pairs and singles, fifteen verbs counting both members of each pair.", "cols": "two"}, {"name": "Page 107 — Aide-mémoire : situer un événement", "items": [["Situer un événement dans une biographie", "see-tew-AY uh nay-vayn-MAHN dahn zewn bee-o-gra-FEE", "Placing an event in a biography"], ["en 1996", "ahn deez-nuhf sahn katr-van-SEZ", "in 1996"], ["l'année suivante", "la-NAY swee-VAHNT", "the following year"], ["à 21 ans / à l'âge de 21 ans", "a van-tay-uhn AHN / a LAHZH duh van-tay-uhn AHN", "at 21 / at the age of 21"]]}, {"name": "Page 107 — activités 5, 6, 7, 8", "items": [["Activité 5 : Écoutez le dialogue. Identifiez la situation et trouvez le lien avec l'article p. 106.", "ay-koo-TAY luh dee-a-LOG … troo-VAY luh lee-AN", "Listen to the dialogue. Identify the situation and its link with the article."], ["Activité 6 : Réécoutez le dialogue et complétez la notice biographique de Marion Cotillard avec les dates. Justifiez vos réponses.", "… kohm-play-TAY lah NO-teess bee-o-gra-FEEK … a-vek lay DAT", "Listen again and complete Marion Cotillard's biographical notice with the dates."], ["Marion Cotillard — 1975 : naissance à Paris", "nay-SAHNSS a pa-REE", "1975: born in Paris"], ["… : débuts au cinéma", "day-BEW oh see-nay-MAH", "first film roles"], ["… : rôle dans le film Taxi", "ROL dahn luh feelm tak-SEE", "role in the film Taxi"], ["… : début de sa carrière internationale (Big Fish)", "day-BEW duh sa ka-ree-AIR an-tair-na-see-o-NAL", "start of her international career, in Big Fish"], ["… : rôle d'Édith Piaf dans le film La Môme", "ROL day-DEET pee-AF dahn luh feelm lah MOM", "the role of Édith Piaf in La Môme"], ["… : Oscar et César de la meilleure actrice", "os-KAR ay say-ZAR duh lah may-YUR ak-TREESS", "Oscar and César for Best Actress"], ["… : Les Petits Mouchoirs de Guillaume Canet", "lay puh-tee moo-SHWAHR duh gee-YOM ka-NAY", "Guillaume Canet's film Les Petits Mouchoirs"], ["Activité 7 Phonétique : Écoutez le récit et répétez les formes pronominales.", "ay-koo-TAY luh ray-SEE ay ray-pay-TAY lay form pro-no-mee-NAL", "Listen to the account and repeat the reflexive forms."], ["Activité 8 a) Échangez ! En petits groupes, dites quelles personnalités sont dans l'actualité et pour quel événement (public ou privé).", "ay-shahn-ZHAY ! … kel pair-so-na-lee-TAY sohn dahn lak-tew-a-lee-TAY", "Discuss which celebrities are in the news and for what event."], ["b) Choisissez une personnalité et imaginez une page de magazine pour raconter l'événement. Rédigez l'article et la notice biographique.", "shwa-zee-SAY ewn pair-so-na-lee-TAY … ray-dee-ZHAY lar-TEE-kluh", "Choose a celebrity and invent a magazine page. Write the article and biographical notice."]], "note": "The biographical box's dates are deliberately left blank as an exercise, to be filled in from the recording — only the fixed 1975 birth year is printed."}, {"name": "Page 108 — le site stars.com", "items": [["Décrire physiquement une personne", "day-KREER fee-zeek-MAHN ewn pair-SUN", "Describing someone physically"], ["www.stars.com — people > filles et fils de stars", "peel duh STAR — FEE ay FEESS duh STAR", "stars.com — celebrities > daughters and sons of stars"], ["Célèbres de père en fils, de mère en fille", "say-LEB-ruh duh pair ahn FEESS, duh mair ahn FEE-yuh", "Famous from father to son, from mother to daughter"], ["David Hallyday", "da-VEED a-lee-DAY", "the featured profile"], ["C'est le fils de Johnny Hallyday et de Sylvie Vartan.", "say luh feess duh zho-NEE a-lee-DAY ay duh seel-VEE var-TAHN", "He's the son of Johnny Hallyday and Sylvie Vartan."], ["Il est chanteur comme son père et sa mère.", "ee lay shahn-TUR kom sohn PAIR ay sa MAIR", "He's a singer like his father and mother."], ["Il a les yeux verts et les cheveux blonds de son père.", "ee la lay zyuh VAIR ay lay shuh-VUH BLOHN duh sohn PAIR", "He has his father's green eyes and blond hair."], ["Ils ont la même taille : ils sont grands tous les deux.", "eel zohn lah mem TIGH : eel sohn grahn too lay DUH", "They're the same height: both are tall."], ["suivant >>", "swee-VAHN", "next >>"]], "note": "A fictional celebrity-gossip-style website built for the exercise, featuring the real French singer David Hallyday, son of Johnny Hallyday and Sylvie Vartan. The strip of thumbnails below shows the next profiles: Chiara Mastroianni, Thomas Dutronc, Charlotte Gainsbourg."}, {"name": "Page 108 — activités 9 et 10a", "items": [["Activité 9 : Observez cette page du site stars.com. Regardez les photos et expliquez le titre de l'article.", "ob-sair-VAY set pahzh … eks-plee-KAY luh TEE-truh", "Look at this page and explain the article's title."], ["→ Le titre joue sur la ressemblance familiale : les enfants de stars sont eux-mêmes célèbres, souvent dans le même métier que leurs parents.", "… lah ruh-sahm-BLAHNSS fa-mee-lee-AL", "The title plays on family resemblance: celebrities' children are famous themselves, often in the same profession as their parents."], ["Activité 10 a) Lisez les trois textes suivants et identifiez les photos correspondantes sur la page Internet.", "lee-ZAY lay trwah TEKST … ee-dahn-tee-fee-AY lay fo-TO", "Read the three texts and match them to the photos on the web page."]]}, {"name": "Page 108 — Chiara Mastroianni", "items": [["Chiara Mastroianni", "kee-a-RAH mas-tro-ee-AH-nee", "the profile heading"], ["Elle est actrice, comme sa mère et son père (c'est la fille de Catherine Deneuve et de Marcello Mastroianni).", "el ay ak-TREESS, kom sa mair ay sohn pair", "She's an actress, like her mother and father (she's the daughter of Catherine Deneuve and Marcello Mastroianni)."], ["Elle est mince et a l'allure distinguée de sa mère.", "el ay MANSS ay a la-LEUR dees-tan-GAY duh sa MAIR", "She's slim and has her mother's distinguished look."], ["Mais, physiquement, elle ressemble plus à son père : elle a les mêmes yeux marron et elle est brune.", "may, fee-zeek-MAHN, el ruh-SAHM-bluh plew a sohn PAIR", "But physically she looks more like her father: she has the same brown eyes and is dark-haired."]]}, {"name": "Page 108 — Thomas Dutronc", "items": [["Thomas Dutronc", "to-MAH dew-TROHNK", "the profile heading"], ["C'est le fils de Jacques Dutronc et de Françoise Hardy.", "say luh feess duh zhahk dew-TROHNK ay duh frahn-SWAHZ ar-DEE", "He's the son of Jacques Dutronc and Françoise Hardy."], ["Il est chanteur comme son père et sa mère.", "ee lay shahn-TUR kom sohn PAIR ay sa MAIR", "He's a singer like his father and mother."], ["Il a le regard et le sourire de son père : ils se ressemblent comme deux gouttes d'eau.", "ee la luh ruh-GAR ay luh soo-REER duh sohn PAIR : eel suh ruh-SAHM-bluh kom duh goot DO", "He has his father's look and smile: they're as alike as two peas in a pod (literally 'two drops of water')."], ["Tous les deux ont beaucoup de charme.", "too lay duh zohn bo-KOO duh SHARM", "Both have a lot of charm."]]}, {"name": "Page 108 — Charlotte Gainsbourg", "items": [["Charlotte Gainsbourg", "shar-LOT gan-SBOOR", "the profile heading"], ["C'est une actrice franco-britannique : c'est la fille de Serge Gainsbourg et de Jane Birkin.", "set ewn ak-TREESS frahn-ko-bree-ta-NEEK : say lah feess duh sairzh gan-SBOOR ay duh djayn bir-KEEN", "She's a Franco-British actress: the daughter of Serge Gainsbourg and Jane Birkin."], ["Elle chante aussi, comme ses deux parents.", "el SHAHNT oh-SEE, kom say duh pa-RAHN", "She sings too, like both her parents."], ["Comme sa mère, elle est mince et elle a l'air fragile.", "kom sa MAIR, el ay MANSS ay el a lair fra-ZHEEL", "Like her mother, she's slim and looks fragile."], ["Toutes les deux ont les cheveux châtains ; Charlotte a les cheveux longs et raides.", "toot lay duh zohn lay shuh-vuh sha-TAN ; shar-lot a lay shuh-vuh LOHN ay RED", "Both have chestnut-brown hair; Charlotte's is long and straight."], ["Elle a l'air timide.", "el a lair tee-MEED", "She seems shy."]], "note": "Three short exercise texts, each pairing physical-description vocabulary with a real French celebrity family. Photo <strong>a</strong> = Chiara Mastroianni, <strong>b</strong> = Thomas Dutronc, <strong>c</strong> = Charlotte Gainsbourg — matching the thumbnails on the stars.com mock-up above."}, {"name": "Page 109 — activités 10b et 11", "items": [["b) Relisez les quatre textes p. 108. Identifiez les parents des personnes présentées.", "ruh-lee-ZAY lay katr TEKST … ee-dahn-tee-fee-AY lay pa-RAHN", "Reread the four texts. Identify the parents of the people presented."], ["Dites pourquoi le père, la mère et le fils/la fille sont célèbres.", "deet poor-KWAH luh PAIR, lah MAIR ay luh feess / lah FEE-yuh sohn say-LEB-ruh", "Say why the father, mother and son/daughter are famous."], ["Activité 11 : Relisez les textes et identifiez les ressemblances physiques.", "ruh-lee-ZAY lay TEKST ay ee-dahn-tee-fee-AY lay ruh-sahm-BLAHNSS fee-ZEEK", "Reread the texts and identify the physical resemblances."]]}, {"name": "Page 109 — Point Langue : décrire physiquement", "items": [["Décrire physiquement une personne", "day-KREER fee-zeek-MAHN ewn pair-SUN", "Describing someone physically"], ["À l'aide des quatre textes p. 108, complétez les éléments de description.", "a LED day katr TEKST … kohm-play-TAY lay zay-lay-MAHN duh des-kreep-see-OHN", "Using the four texts on p.108, complete the description elements."], ["L'apparence générale — Il/Elle a l'air fatigué / sportif", "la-pa-RAHNSS zhay-nay-RAL — ee-la-LAIR fa-tee-GAY / spor-TEEF", "General appearance: he/she looks tired / sporty"], ["Il/Elle a une allure sportive", "ee-la ewn a-LEUR spor-TEEV", "He/she has a sporty look"], ["La taille — Il/Elle est petit(e) ≠ grand(e), de taille moyenne", "lah TIGH — ee-lay puh-TEE(T) ≠ GRAHN(D), duh tigh mwa-YEN", "Height: short ≠ tall, average height"], ["La silhouette — Il/Elle est gros(se) / fort(e) ≠ maigre", "lah see-loo-ETT — ee-lay GRO(SS) / FOR(T) ≠ MEG-ruh", "Build: fat / heavily built ≠ skinny"], ["Les yeux — Il/Elle a les yeux noirs / bleus", "lay zyuh — ee-la lay zyuh NWAHR / BLUH", "Eyes: he/she has black / blue eyes"], ["Les cheveux — Il/Elle est blond(e) / roux (rousse) / châtain", "lay shuh-VUH — ee-lay BLOHN(D) / ROO (ROOSS) / sha-TAN", "Hair: he/she is blond / red-haired / chestnut-brown"], ["Il/Elle a les cheveux roux / bruns…", "ee-la lay shuh-vuh ROO / BRUHN", "he/she has red / dark hair…"], ["…mi-longs / courts…", "mee-LOHN / KOOR", "…shoulder-length / short…"], ["…frisés / bouclés…", "free-ZAY / boo-KLAY", "…frizzy / curly…"], ["Attention ! Il est brun/blond. → couleur des cheveux", "eel ay BRUHN / BLOHN", "hair colour"], ["Il est blanc/noir. → couleur de la peau", "eel ay BLAHN / NWAHR", "skin colour"]], "note": "The gaps marked … in the book are left for students to add their own extra vocabulary; only what's actually printed is given here. The warning at the end matters: <strong>brun/blond</strong> describes hair colour, while <strong>blanc/noir</strong> describes skin colour — the same adjectives shift meaning depending on what they modify.", "cols": "two"}, {"name": "Page 109 — Aide-mémoire : ressemblances physiques", "items": [["Évoquer des ressemblances physiques", "ay-vo-KAY day ruh-sahm-BLAHNSS fee-ZEEK", "Referring to physical resemblances"], ["Ils se ressemblent (comme deux gouttes d'eau).", "eel suh ruh-SAHM-bluh (kom duh goot DO)", "They look alike (like two peas in a pod)."], ["Elle ressemble à son père : elle a les mêmes yeux.", "el ruh-SAHM-bluh a sohn PAIR : el a lay mem ZYUH", "She looks like her father: she has the same eyes."], ["Il a le sourire de son père.", "ee la luh soo-REER duh sohn PAIR", "He has his father's smile."], ["Elle est mince comme sa mère.", "el ay MANSS kom sa MAIR", "She's slim like her mother."]]}, {"name": "Page 109 — activité 12 et Point Langue : identifier quelqu'un", "items": [["Activité 12 : Écoutez puis observez la page Internet p. 108. Trouvez quelle photo est à l'origine de la conversation.", "ay-koo-TAY pwee ob-sair-VAY … troo-VAY kel fo-TO ay ta lo-ree-ZHEEN", "Listen then look at the web page. Find which photo prompted the conversation."], ["Identifier / Donner des informations sur quelqu'un", "ee-dahn-tee-fee-AY / do-NAY day zan-for-ma-see-OHN sewr kel-KUHN", "Identifying / giving information about someone"], ["Observez puis choisissez la bonne réponse.", "ob-sair-VAY pwee shwa-zee-SAY lah bun ray-POHNSS", "Observe then choose the right answer."], ["C'est Thomas, c'est le fils de Jacques Dutronc. Il est chanteur.", "say to-MAH, say luh feess duh zhahk dew-TROHNK. ee lay shahn-TUR", "This is Thomas, Jacques Dutronc's son. He's a singer."], ["C'est Charlotte. C'est la fille de… Elle est mince, elle est brune.", "say shar-LOT. say lah feess duh… el ay MANSS, el ay BREWN", "This is Charlotte. She's the daughter of… She's slim, dark-haired."], ["C'est une actrice franco-britannique. Elle est actrice.", "set ewn ak-TREESS frahn-ko-bree-ta-NEEK. el ay tak-TREESS", "She's a Franco-British actress. She's an actress."], ["Pour identifier/donner des informations sur quelqu'un, on utilise :", "poor ee-dahn-tee-fee-AY … ohn ew-TEE-leez", "To identify or give information about someone, use:"], ["c'est + article + nom", "say + ar-TEE-kluh + NOHN", "c'est + article + noun"], ["il/elle est + profession", "ee-lay / el ay + pro-fay-see-OHN", "il/elle est + profession"], ["c'est + prénom", "say + pray-NOHN", "c'est + first name"], ["il/elle est + adjectif", "ee-lay / el ay + ad-zhek-TEEF", "il/elle est + adjective"]], "note": "The exercise matches each sentence type to its rule: <strong>c'est</strong> introduces a name or 'c'est + article + noun' (c'est le fils de…, c'est Thomas), while <strong>il/elle est</strong> is followed directly by a profession or an adjective with no article (il est chanteur, elle est mince)."}, {"name": "Page 109 — activités 13 et 14, et le projet", "items": [["Activité 13 : Observez les photos de Laura Smet et David Hallyday et dites si le demi-frère et la demi-sœur se ressemblent. Justifiez votre réponse.", "ob-sair-VAY … luh duh-mee-FRAIR ay lah duh-mee-SUR suh ruh-SAHM-bluh", "Look at the photos of Laura Smet and David Hallyday and say whether the half-siblings resemble each other."], ["un demi-frère / une demi-sœur", "uhn duh-mee-FRAIR / ewn duh-mee-SUR", "a half-brother / half-sister"], ["Activité 14 : Échangez ! Y a-t-il aussi dans votre pays des familles de célébrités ? Lesquelles ?", "ay-shahn-ZHAY ! ee a TEEL oh-SEE dahn VOT-ruh pay-EE day fa-MEE duh say-lay-bree-TAY", "Discuss! Are there celebrity families in your country too? Which ones?"], ["Projet Dossier 5 — Tâche leçon 3 : Réaliser la flash mob et faire le reportage.", "ray-a-lee-ZAY lah flash MOB ay fair luh ruh-por-TAHZH", "Task: carry out the flash mob and produce the report."]], "note": "Laura Smet is Johnny Hallyday's daughter with Nathalie Baye, making her David Hallyday's half-sister — both children of Johnny Hallyday by different mothers."}]}, {"id": "ae-d5-carnet", "label": "Dossier 5 · Carnet de voyage", "name": "Monstres sacrés", "summary": "Pages 110–111. A real book about French singers and the Olympia concert hall — the back-cover text and info box are paraphrased as genuine published prose, with the exercises and artist names given in full.", "art": null, "bookpages": ["p110", "p111"], "groups": [{"name": "Page 110 — la couverture du livre et l'activité 1", "items": [["Carnet de voyage — Monstres sacrés", "kar-NAY duh vwa-YAHZH — MOHN-struh sa-KRAY", "Travel notebook — Sacred monsters"], ["Monstres sacrés — Portraits de la chanson française — Jean-Michel Boris, Gervais", "MOHN-struh sa-KRAY — por-TRAY duh lah shahn-SOHN frahn-SEZ", "the real book's title and authors, shown on its cover"], ["Activité 1 : Regardez cette couverture de livre et répondez.", "ruh-gar-DAY set koo-vair-TEWR duh LEE-vruh", "Look at this book cover and answer."], ["Quel est le thème du livre ? Reconnaissez-vous les personnes caricaturées ?", "kel ay luh TEM dew LEE-vruh ? ruh-ko-nay-say VOO lay pair-SUN ka-ree-ka-tew-RAY", "What is the book's theme? Do you recognise the caricatured people?"]], "note": "The cover shows caricature portraits by the illustrator Gervais, by the French artist Gervais, of well-known French singers."}, {"name": "Page 110 — activité 2 : la quatrième de couverture", "items": [["Activité 2 a) Lisez le texte de quatrième de couverture et précisez le thème du livre.", "lee-ZAY luh tekst duh ka-tree-EM duh koo-vair-TEWR", "Read the back-cover text and say what the book is about."], ["Comment comprenez-vous l'expression « monstres sacrés » ?", "ko-mahn kohm-pruh-nay VOO leks-pray-see-OHN MOHN-struh sa-KRAY", "How do you understand the phrase 'sacred monsters'?"], ["→ « Monstre sacré » désigne une personnalité si célèbre et respectée dans son art qu'elle est presque intouchable — ici, une légende de la chanson.", "MOHN-struh sa-KRAY … an-too-SHAH-bluh", "A 'monstre sacré' is a figure so famous and respected in their art as to be almost untouchable — here, a legend of French song."], ["Le livre rassemble les portraits, dessinés par Gervais, de grands noms de la chanson française — parmi eux Brel, Brassens, Piaf, Gainsbourg, Johnny Hallyday, Michel Jonasz, Véronique Sanson, Manu Chao, Jean-Jacques Goldman, -M- et Zazie —", "luh LEE-vruh ra-SAHM-bluh lay por-TRAY … day-see-NAY par zhair-VAY", "The book gathers portraits, drawn by Gervais, of great names in French song — among them Brel, Brassens, Piaf, Gainsbourg, Johnny Hallyday, Michel Jonasz, Véronique Sanson, Manu Chao, Jean-Jacques Goldman, -M- and Zazie —"], ["accompagnés des souvenirs de Jean-Michel Boris, qui a dirigé la salle de l'Olympia pendant 46 ans.", "a-kohm-pa-NYAY day soo-vuh-NEER duh zhahn-mee-SHELL bo-REESS", "together with the memories of Jean-Michel Boris, who ran the Olympia for 46 years."], ["b) Regardez la liste des artistes cités au début du texte. Connaissez-vous certains de ces chanteurs(euses) ?", "ruh-gar-DAY lah LEEST day zar-TEEST see-TAY … ko-nay-say VOO sair-TAN duh say shahn-TUR", "Look at the list of artists named. Do you know any of these singers?"]], "note": "The book's own back-cover paragraph is a short piece of real published prose, so it's paraphrased above rather than quoted in full; the list of artist names and the biographical fact about Jean-Michel Boris are given as stated, since names and the '46 ans' detail are simple facts rather than the author's phrasing."}, {"name": "Page 110 — « Faire l'Olympia »", "items": [["« Faire l'Olympia »", "fair lo-lam-PYAH", "'To play the Olympia' — the idiom explained in the info box"], ["L'Olympia est une salle de concert mythique à Paris, au 28 boulevard des Capucines, dans le 9e arrondissement.", "lol-am-PYAH et ewn sal duh kohn-SAIR mee-TEEK", "The Olympia is a legendary Paris concert hall, at 28 boulevard des Capucines, in the 9th arrondissement."], ["Fondée en 1888, c'est la plus ancienne salle de music-hall de la capitale encore en activité.", "fohn-DAY ahn deez-weet sahn katr-van-WEET", "Founded in 1888, it's the oldest music-hall in the capital still operating."], ["Dire qu'un artiste « a fait l'Olympia » signifie qu'il y a donné un spectacle — presque tous les grands noms de la chanson, française et étrangère, y sont passés.", "deer kuhn nar-TEEST a fay lol-am-PYAH … ee a do-NAY uhn spek-TAH-kluh", "To say an artist 'has done the Olympia' means they've performed there — almost every great name in French and foreign song has played it."]], "note": "This information box is the book's own written text, factual but still continuous prose from the source, so it's paraphrased here rather than quoted at length. The core facts — address, founding year, and the idiom's meaning — are the ones the exercise actually needs."}, {"name": "Page 110 — activité 3 : les six artistes en photo", "items": [["Activité 3 : En petits groupes. Observez les photos des artistes cités dans la quatrième de couverture et répondez.", "ob-sair-VAY lay fo-TO day zar-TEEST see-TAY", "In small groups, look at the photos of the artists named on the back cover."], ["1. Qui sont les artistes caricaturés sur la couverture du livre ?", "kee sohn lay zar-TEEST ka-ree-ka-tew-RAY sewr lah koo-vair-TEWR", "Who are the caricatured artists on the cover?"], ["2. Quels artistes chantent à l'époque actuelle ? Faites des hypothèses.", "kel zar-TEEST SHAHNT a lay-POK ak-tew-ELL ? fet day zee-po-TEZ", "Which artists are still performing today? Make guesses."], ["M (Mathieu Chedid)", "EM (ma-tee-UH shuh-DEED)", "the stage name -M- and the performer behind it"], ["Édith Piaf", "ay-DEET pee-AF", "one of the six pictured artists"], ["Michel Jonasz", "mee-SHELL zho-NAHZ", "one of the six pictured artists"], ["Manu Chao", "ma-NEW SHAO", "one of the six pictured artists"], ["Jacques Brel", "zhahk BRELL", "one of the six pictured artists"], ["Jean-Jacques Goldman", "zhahn-zhahk gold-MAHN", "one of the six pictured artists"]], "note": "Six photographs, each captioned with the artist's name: -M- (Mathieu Chedid), Édith Piaf, Michel Jonasz, Manu Chao, Jacques Brel, Jean-Jacques Goldman — a mix of performers active today and legends from earlier decades, which is exactly what question 2 asks you to sort out."}, {"name": "Les enregistrements", "items": [], "note": "One shared track for two listening activities.", "tracks": [{"n": 137, "label": "p.111 act. 4 & 5 — huit extraits de chansons"}]}, {"name": "Page 111 — les six autres portraits", "items": [["Zazie", "za-ZEE", "one of the six photographed artists"], ["Serge Gainsbourg", "sairzh gan-SBOOR", "one of the six photographed artists"], ["Véronique Sanson", "vay-ro-NEEK sahn-SOHN", "one of the six photographed artists"], ["Johnny Hallyday", "zho-NEE a-lee-DAY", "one of the six photographed artists"], ["Georges Brassens", "zhorzh bra-SAHNSS", "one of the six photographed artists"]]}, {"name": "Page 111 — activité 3 : les dates biographiques", "items": [["Prenez connaissance des dates biographiques suivantes et vérifiez vos hypothèses.", "pruh-NAY ko-nay-SAHNSS day dat bee-o-gra-FEEK … vay-ree-fee-AY vo zee-po-TEZ", "Look at these biographical dates and check your guesses."], ["M (Mathieu Chedid) : né en 1971", "nay ahn deez-nuhf sahn swa-sahnt-ONZ", "born 1971 — still performing"], ["Édith Piaf : 1915-1963", "deez-nuhf sahn kanz — deez-nuhf sahn swa-sahnt-TWAH", "1915–1963 — a legend from the past"], ["Michel Jonasz : né en 1947", "nay ahn deez-nuhf sahn karant-SET", "born 1947"], ["Manu Chao : né en 1961", "nay ahn deez-nuhf sahn swa-sahnt-UHN", "born 1961 — still performing"], ["Jacques Brel : 1929-1978", "deez-nuhf sahn van-NUHF — deez-nuhf sahn swa-sahnt-DEEZ-WEET", "1929–1978"], ["Jean-Jacques Goldman : né en 1951", "nay ahn deez-nuhf sahn sank-AHNT-UHN", "born 1951"], ["Serge Gainsbourg : 1928-1991", "deez-nuhf sahn van-WEET — deez-nuhf sahn katr-VAN-ONZ", "1928–1991"], ["Zazie : née en 1964", "nay ahn deez-nuhf sahn swa-sahnt-KATR", "born 1964 — still performing"], ["Johnny Hallyday : né en 1943", "nay ahn deez-nuhf sahn karant-TWAH", "born 1943"], ["Véronique Sanson : née en 1949", "nay ahn deez-nuhf sahn karant-NUHF", "born 1949"], ["Georges Brassens : 1921-1981", "deez-nuhf sahn van-tay-UHN — deez-nuhf sahn katr-van-UHN", "1921–1981"]], "note": "The dates settle activity 3's question: M, Manu Chao and Zazie were born recently enough to still be performing today; the others belong more to earlier decades, several no longer living.", "cols": "two"}, {"name": "Page 111 — activité 4 : les huit titres", "items": [["Activité 4 : Voici une sélection de titres très connus de huit de ces artistes.", "vwa-SEE ewn say-lek-see-OHN duh TEE-truh tray ko-NEW", "Here is a selection of well-known song titles by eight of these artists."], ["Écoutez les extraits et dites dans quel ordre les titres apparaissent.", "ay-koo-TAY lay zeks-TRAH ay deet dahn kel OR-druh lay TEE-truh a-pa-RESS", "Listen to the extracts and say in what order the titles appear."], ["a. Je suis venu te dire que je m'en vais", "zhuh swee vuh-NEW tuh deer kuh zhuh mahn VAY", "a Jacques Brel song title"], ["b. La Vie en rose", "lah vee ahn ROZ", "an Édith Piaf song title"], ["c. Je dis « Aime »", "zhuh dee EM", "an -M- song title"], ["d. Ne me quitte pas", "nuh muh keet PAH", "a Jacques Brel song title"], ["e. Je ne t'aime plus", "zhuh nuh tem PLEW", "a Manu Chao song title"], ["f. Les Amoureux des bancs publics", "lay za-moo-RUH day bahn pew-BLEEK", "a Georges Brassens song title"], ["g. Je suis un homme", "zhuh swee zuh NOM", "a Zazie song title"], ["h. Quelque chose de Tennessee", "kel-kuh shoz duh ten-eh-SEE", "a Johnny Hallyday song title"]], "note": "These are song titles only — brief identifying names, not the lyrics themselves, which aren't reproduced. Activity 4 asks you to order them by ear from the recording; activity 5 asks you to match each to its performer."}, {"name": "Page 111 — activités 5, 6 et 7", "items": [["Activité 5 : En petits groupes, réécoutez les extraits de chansons. Pouvez-vous identifier l'artiste pour chaque titre ?", "ray-ay-koo-TAY lay zeks-TRAH duh SHAHN-sohn", "In small groups, listen again and identify the artist for each title."], ["Activité 6 : Imaginons le livre Monstres sacrés - Portraits du cinéma français.", "ee-ma-zhee-NOHN luh LEE-vruh MOHN-struh sa-KRAY — por-TRAY dew see-nay-MAH frahn-SAY", "Let's imagine the book 'Sacred Monsters — Portraits of French Cinema'."], ["a) Regardez les caricatures ci-dessous. (Re)connaissez-vous ces deux monstres sacrés du cinéma français ? (réponse en bas de page)", "ruh-ko-nay-say VOO say duh MOHN-struh sa-KRAY dew see-nay-MAH frahn-SAY", "Look at the caricatures below. Do you recognise these two giants of French cinema? (answer at the foot of the page)"], ["b) Quels autres « monstres sacrés » imaginez-vous sur la couverture du livre ?", "kel zo-truh MOHN-struh sa-KRAY ee-ma-zhee-nay VOO", "What other 'sacred monsters' would you imagine on the cover?"], ["Réponse (imprimée à l'envers au bas de la page) : Catherine Deneuve et Gérard Depardieu dans Le Dernier Métro de François Truffaut.", "ka-tuh-REEN duh-NUHV ay zhay-RAR duh-par-dee-UH dahn luh dair-nee-AY may-TRO", "Answer (printed upside down): Catherine Deneuve and Gérard Depardieu in François Truffaut's Le Dernier Métro."], ["Activité 7 : À vous ! Qui sont les monstres sacrés dans votre pays ?", "a VOO ! kee sohn lay MOHN-struh sa-KRAY dahn VOT-ruh pay-EE", "Your turn! Who are the 'sacred monsters' in your country?"], ["1. En petits groupes, choisissez un domaine (chanson ou cinéma) et faites la liste des artistes indispensables. Choisissez les artistes les plus intéressants pour une caricature et préparez la couverture du livre.", "… fet lah leest day zar-TEEST an-dees-pahn-SAH-bluh", "In small groups, choose a field (song or cinema) and list the essential artists. Choose the ones most interesting to caricature and design the book cover."], ["2. Pour chaque artiste, choisissez la chanson ou le film très connu(e) que vous allez citer dans son portrait.", "poor shak ar-TEEST, shwa-zee-SAY lah shahn-SOHN oo luh feelm tray ko-NEW", "For each artist, choose the well-known song or film to mention in their portrait."]], "note": "The two caricatures are of Catherine Deneuve and Gérard Depardieu — printed upside down at the foot of the page so you can check your guess after making it."}]}, {"id": "ae-d5-sexercer", "label": "Dossier 5 · S'exercer", "name": "Les corrigés", "summary": "Pages 112–113. All exercises with every item and every answer — chez/à, question forms, -er/-ir verbs, reciprocal reflexives, the passé récent and futur proche, telephone dialogue order, the imperative for advice, on, demonstratives and prepositions.", "art": null, "bookpages": ["p112", "p113"], "groups": [{"name": "Leçon 1 — Ex. 1 : chez et à", "items": [["Complétez avec chez ou à. Faites les modifications nécessaires.", "kohm-play-TAY a-vek SHAY oo A", "Complete with chez or à, making the necessary changes."], ["1. Je reste CHEZ MOI pendant les vacances.", "zhuh rest shay MWAH", "I'm staying home during the holidays."], ["2. Je rentre À LA maison vers 20 heures.", "zhuh RAHN-truh a lah may-ZOHN", "I get home around 8pm."], ["3. Je déteste aller CHEZ LE dentiste !", "zhuh day-TEST a-LAY shay luh dahn-TEEST", "I hate going to the dentist's!"], ["4. Je suis encore AU bureau.", "zhuh swee zahn-KOR oh bew-RO", "I'm still at the office."], ["5. Je passe mon week-end CHEZ LES amis de Martin, M. et Mme Leroux.", "zhuh pahss mohn week-END shay lay za-MEE", "I'm spending the weekend at Martin's friends' place."], ["6. Je vais rester À LA bibliothèque pour travailler.", "zhuh vay res-TAY a lah bee-blee-o-TEK", "I'm going to stay at the library to work."], ["7. Je vais AU supermarché.", "zhuh vay oh sew-pair-mar-SHAY", "I'm going to the supermarket."], ["8. J'ai rendez-vous CHEZ LE médecin à 18 heures.", "zhay rahn-day-VOO shay luh mayd-SAN", "I have an appointment at the doctor's at 6pm."]], "note": "<strong>chez</strong> always goes with a person (chez moi, chez le dentiste), <strong>à</strong> with a place (à la maison, au bureau, au supermarché)."}, {"name": "Leçon 1 — Ex. 2 : poser des questions", "items": [["Un lycéen a répondu au questionnaire d'un magazine sur les jeunes et Internet. Complétez le tableau avec les questions orales ou écrites manquantes.", "uhn lee-say-AN a ray-POHN-dew oh kes-tee-o-NAIR", "A student answered a magazine survey on young people and the internet. Complete the table with the missing questions."], ["Écrite : Quel âge avez-vous ? — Orale : Vous avez quel âge ? — Réponse : Seize ans.", "kel AHZH a-vay VOO", "What is your age? — Sixteen."], ["Écrite : Avez-vous un ordinateur ? — Orale : Vous avez un ordinateur ? / Est-ce que vous avez un ordinateur ? — Réponse : Oui.", "a-vay VOO uh nor-dee-na-TUR", "Do you have a computer? — Yes."], ["Écrite : Que faites-vous surtout sur cet ordinateur ? — Orale : Qu'est-ce que vous faites surtout sur cet ordinateur ? — Réponse : Je me connecte sur Facebook.", "kuh fet VOO sewr-TOO", "What do you mainly do on this computer? — I use Facebook."], ["Écrite : Avec qui communiquez-vous ? — Orale : Vous communiquez avec qui ? — Réponse : Avec des copains.", "a-vek kee ko-mew-nee-kay VOO", "Who do you communicate with? — Friends."], ["Écrite : Quand communiquez-vous sur Internet ? — Orale : Quand est-ce que vous surfez sur Internet ? — Réponse : Le soir.", "kahn es-kuh voo SEUR-fay", "When are you online? — In the evening."], ["Écrite : Où êtes-vous quand vous utilisez votre ordinateur ? — Orale : Vous êtes où quand vous utilisez votre ordinateur ? — Réponse : Dans ma chambre.", "voo zet OO kahn voo zew-tee-lee-ZAY", "Where are you when you use your computer? — In my room."]]}, {"name": "Leçon 1 — Ex. 3 : l'enquête sur le sport", "items": [["Lisez les réponses de l'enquête sur les Français et le sport.", "lee-ZAY lay ray-POHNSS duh lahn-KET", "Read the survey answers about the French and sport."], ["a) Trouvez les questions écrites/formelles. (Plusieurs réponses sont possibles.)", "troo-VAY lay kes-tee-OHN ay-KREET / for-MELL", "Find the written/formal questions."], ["1. Faites-vous du sport ? → Oui, je fais du football.", "fet VOO dew SPOR", "Do you play sport? — Yes, football."], ["2. Où jouez-vous ? → Dans un stade près de chez moi.", "oo zhoo-ay VOO", "Where do you play? — In a stadium near my home."], ["3. Quand jouez-vous ? → Je joue le mardi soir et le samedi matin.", "kahn zhoo-ay VOO", "When do you play? — Tuesday evenings and Saturday mornings."], ["4. Avec qui jouez-vous ? → Avec des amis, on a formé une équipe.", "a-vek kee zhoo-ay VOO", "Who do you play with? — With friends, we formed a team."], ["5. Comment vous sentez-vous après un match ? → Après un match, je suis fatigué, je rentre chez moi !", "ko-mahn voo sahn-tay VOO", "How do you feel after a match? — Tired, I go home!"], ["6. Pourquoi aimez-vous ce sport ? → J'aime ce sport parce que c'est un sport d'équipe.", "poor-KWAH ay-may VOO suh SPOR", "Why do you like this sport? — Because it's a team sport."], ["b) Transformez les questions écrites précédentes en questions orales/informelles. (Plusieurs formulations sont possibles.)", "trahns-for-MAY lay kes-tee-OHN ay-KREET pray-say-DAHNT", "Turn the previous written questions into oral/informal ones."]]}, {"name": "Leçon 1 — Ex. 4 : les verbes en -er et en -ir", "items": [["Conjuguez les verbes aux personnes indiquées.", "kohn-zhew-GAY lay vairb oh pair-SUN an-dee-KAY", "Conjugate the verbs in the persons given."], ["1. Choisir le menu (je) → je choisis le menu.", "zhuh shwa-ZEE luh muh-NEW", "I choose the menu."], ["2. Sortir faire les courses (vous) → vous sortez faire les courses.", "voo sor-TAY fair lay KOORSS", "You go out to do the shopping."], ["3. Préparer les sandwichs (Emma) → Emma prépare les sandwichs.", "em-mah pray-PAR lay sahn-DWEECH", "Emma prepares the sandwiches."], ["4. Finir de décorer la maison (Antoine) → Antoine finit de décorer la maison.", "ahn-TWAHN fee-NEE duh day-ko-RAY", "Antoine finishes decorating the house."], ["5. Servir les boissons (Maxime et Laure) → Maxime et Laure servent les boissons.", "mak-SEEM ay lor SAIRV lay bwa-SOHN", "Maxime and Laure serve the drinks."]]}, {"name": "Leçon 1 — Ex. 5 : compléter avec les verbes", "items": [["Complétez les phrases avec les verbes entre parenthèses.", "kohm-play-TAY lay FRAZ a-vek lay vairb ahn-truh pa-rahn-TEZ", "Complete with the bracketed verbs."], ["1. Nous RÉFLÉCHISSONS aux cadeaux, mais ce n'est pas facile : les enfants GRANDISSENT et leurs goûts CHANGENT !", "noo ray-flay-shee-SOHN … lay zahn-FAHN grahn-DEESS … lur GOO SHAHNZH", "We're thinking about presents, but it's not easy: the children are growing and their tastes are changing!"], ["2. Chaque année pour Noël, nous NOUS OFFRONS un petit voyage.", "shak a-NAY poor no-ELL, noo noo zo-FROHN", "Every year at Christmas, we treat ourselves to a little trip."], ["Nous CHOISISSONS une région différente tous les ans. En général, nous DORMONS chez l'habitant.", "noo shwa-zee-SOHN … noo dor-MOHN shay la-bee-TAHN", "We choose a different region every year. Usually we stay with locals."], ["Cette année, on PART une semaine en Alsace.", "set a-NAY, ohn PAR ewn suh-men ahn nal-ZASS", "This year we're going for a week in Alsace."], ["3. Chaque année, on ORGANISE le réveillon du jour de l'an chez nous.", "shak a-NAY, oh nor-ga-NEEZ luh ray-vay-YOHN dew zhoor duh LAHN", "Every year we host the New Year's Eve party."], ["On ENVOIE les invitations à nos amis, on PRÉPARE tout mais les invités PAIENT leur part.", "oh nahn-VWAH … oh pray-PAR too may lay zan-vee-TAY PAY lur PAR", "We send the invitations and prepare everything, but the guests pay their share."], ["En général, la fête FINIT tard, les invités PARTENT entre 5 et 6 heures du matin. Souvent, des amis DORMENT à la maison.", "… lah fet fee-NEE TAR … lay zan-vee-TAY PART … day za-mee DORM", "The party usually ends late, guests leave between 5 and 6am. Often friends sleep over."]]}, {"name": "Leçon 1 — Ex. 6 : les verbes pronominaux réciproques", "items": [["Complétez avec les verbes suivants : s'aimer – se téléphoner – s'offrir – s'envoyer – se souhaiter – se dire – se regarder.", "kohm-play-TAY a-vek lay vairb swee-VAHN", "Complete with these reciprocal reflexive verbs."], ["1. Ils S'AIMENT amoureusement et ils SE DISENT « je t'aime » cent fois par jour.", "eel SEM a-moo-ruz-MAHN … eel suh DEEZ", "They're deeply in love and tell each other 'I love you' a hundred times a day."], ["2. Vous VOUS OFFREZ des cadeaux à la Saint-Valentin ?", "voo voo zo-FRAY day ka-DO", "Do you give each other presents on Valentine's Day?"], ["3. Nous sommes très amoureux : nous NOUS REGARDONS vraiment !", "noo noo ruh-gar-DOHN vray-MAHN", "We're very much in love: we really look at each other!"], ["4. Quand elles ne sont pas ensemble, elles SE TÉLÉPHONENT deux ou trois fois par jour !", "el suh tay-lay-FON duh oo trwah FWAH", "When they're apart, they call each other two or three times a day!"], ["5. Ils S'ENVOIENT des mails pour communiquer.", "eel sahn-VWAH day MAIL", "They email each other to keep in touch."], ["6. Nous NOUS SOUHAITONS toujours nos anniversaires.", "noo noo soo-ay-TOHN too-ZHOOR", "We always wish each other happy birthday."]]}, {"name": "Leçon 2 — Ex. 7 : le passé récent et le futur proche", "items": [["Complétez avec le futur proche ou le passé récent.", "kohm-play-TAY a-vek luh few-TEUR PROSH oo luh pa-SAY ray-SAHN", "Complete with the futur proche or the passé récent."], ["1. J'adore ton projet ! Tu VAS RÉUSSIR, c'est sûr !", "tew va ray-ew-SEER, say SEUR", "I love your plan! You're going to succeed, for sure!"], ["2. Ils sont très fatigués : ils VIENNENT DE FAIRE le tour de l'Europe à vélo !", "eel vee-EN duh fair luh toor duh luh-ROP a vay-LO", "They're exhausted: they've just cycled round Europe!"], ["3. C'est décidé : on quitte la ville ; on VA S'INSTALLER à la campagne !", "ohn va san-sta-LAY a lah kahm-PAN-yuh", "It's decided: we're leaving the city; we're going to settle in the countryside!"], ["4. Nous sommes très heureux : nous VENONS DE GAGNER un voyage autour du monde !", "noo vuh-NOHN duh ga-NYAY uhn vwa-YAHZH oh-TOOR dew MOHND", "We're thrilled: we've just won a round-the-world trip!"], ["5. Finalement, qu'est-ce que vous décidez : vous ALLEZ RESTER ou vous ALLEZ PARTIR ?", "voo za-lay res-TAY oo voo za-lay par-TEER", "So what have you decided: are you going to stay or go?"], ["6. Vous avez de la chance, il VIENT D'ARRIVER, je vous le passe.", "eel vee-AN da-ree-VAY, zhuh voo luh PAHSS", "You're lucky, he's just arrived, I'll put him on."], ["7. Ne quittez pas, je VIENS D'APPELER Clara, elle est dans sa chambre.", "zhuh vee-AN da-play KLA-rah", "Hold on, I've just called Clara, she's in her room."]]}, {"name": "Leçon 2 — Ex. 8 : appeler et répondre au téléphone", "items": [["Mettez les répliques dans l'ordre.", "met-TAY lay ray-PLEEK dahn LOR-druh", "Put the lines in order."], ["f. Allô ?", "a-LO", "Hello?"], ["c. Salut Sandrine, c'est Paul.", "sa-LEW sahn-DREEN, say POL", "Hi Sandrine, it's Paul."], ["e. Oui, Paul, un instant, ne quitte pas… Écoute, je suis occupée, là.", "wee, pol, uh nan-STAHN, nuh keet PAH … zhuh swee zo-kew-PAY LAH", "Yes Paul, hold on, don't hang up… Listen, I'm busy right now."], ["a. Je te rappelle après le déjeuner, si tu veux ?", "zhuh tuh ra-PELL a-pray luh day-zhuh-NAY, see tew VUH", "I'll call you back after lunch, if you like?"], ["d. D'accord mais je n'ai pas le numéro.", "da-KOR may zhuh nay pah luh new-may-RO", "OK but I don't have the number."], ["b. C'est le 06 60 65 32 40. À cet après-midi !", "say luh zay-RO sees swa-sahnt sees-ahnt-SANK trahnt-duh ka-RAHNT", "It's 06 60 65 32 40. See you this afternoon!"], ["g. Oui, sur mon portable.", "wee, sewr mohn por-TAH-bluh", "Yes, on my mobile."]], "note": "The order is <strong>f – c – e – a – d – b – g</strong>."}, {"name": "Leçon 2 — Ex. 9 : les conversations téléphoniques", "items": [["Complétez les conversations téléphoniques.", "kohm-play-TAY lay kohn-vair-sa-see-OHN tay-lay-fo-NEEK", "Complete the phone conversations."], ["1. — Allô ! — Bonjour, MME MARCHAND, s'il vous plaît. — Désolé, Mme Marchand n'est pas là. — VOUS VOULEZ LAISSER UN MESSAGE ? — Bien sûr, je note.", "bohn-ZHOOR, ma-DAM mar-SHAHN, seel voo PLAY", "Hello. — Mrs Marchand, please. — Sorry, she's not here. — Would you like to leave a message? — Of course, I'm noting it."], ["2. — Allô, Institut Mérieux, j'écoute. — Bonjour, je voudrais parler à Mme Valas, s'il vous plaît. — C'EST DE LA PART DE QUI ? — Mme Lopez. — NE QUITTEZ PAS, je vous la passe.", "… say duh lah par duh KEE ? — ma-dam lo-PEZ. — nuh kee-TAY PAH", "Hello, Institut Mérieux. — I'd like to speak to Mrs Valas, please. — Who's calling? — Mrs Lopez. — Hold on, I'll put you through."]]}, {"name": "Leçon 2 — Ex. 10 : conseils à l'impératif, affirmatif", "items": [["Formulez des conseils aux voyageurs, à l'impératif. Faites les modifications nécessaires.", "for-mew-LAY day kohn-SAY oh vwa-ya-ZHUR, a lan-pay-ra-TEEF", "Give advice to travellers, in the imperative."], ["a) Utilisez la 2e personne du singulier. En voyage :", "ew-tee-lee-ZAY lah duh-zee-EM pair-SUN dew san-gew-lee-AY", "Use the tu form."], ["1. Être poli et curieux. → Sois poli et curieux.", "SWAH po-LEE ay kew-ree-UH", "Be polite and curious."], ["2. Avoir toujours ses papiers d'identité dans son sac. → Aie toujours tes papiers d'identité dans ton sac.", "AY too-ZHOOR tay pa-pee-AY dee-dahn-tee-TAY", "Always keep your ID papers in your bag."], ["3. Quand il fait chaud, se déplacer de préférence en début ou en fin de journée. → Déplace-toi de préférence en début ou en fin de journée.", "day-PLAHSS-TWAH duh pray-fay-RAHNSS", "When it's hot, travel preferably at the start or end of the day."], ["4. S'informer sur les logements chez l'habitant. → Informe-toi sur les logements chez l'habitant.", "an-FORM-TWAH sewr lay lozh-MAHN", "Find out about homestay accommodation."], ["5. S'habiller correctement pour visiter les lieux religieux. → Habille-toi correctement pour visiter les lieux religieux.", "a-BEE-yuh-TWAH kor-rek-tuh-MAHN", "Dress appropriately to visit religious sites."], ["6. Se faire plaisir. → Fais-toi plaisir.", "FAY-TWAH play-ZEER", "Treat yourself."], ["b) Donnez les mêmes conseils à la 2e personne du pluriel.", "do-NAY lay mem kohn-SAY a lah duh-zee-EM pair-SUN dew plew-ree-AYL", "Give the same advice in the vous form."], ["→ Soyez polis et curieux. Ayez toujours vos papiers d'identité dans votre sac. Déplacez-vous… Informez-vous… Habillez-vous… Faites-vous plaisir.", "swa-YAY po-LEE … ay-YAY too-ZHOOR VO pa-pee-AY", "the vous-form equivalents"]]}, {"name": "Leçon 2 — Ex. 11 : conseils à l'impératif, négatif", "items": [["Formulez les conseils suivants à l'impératif négatif. Utilisez la 2e personne du singulier puis la 2e personne du pluriel. En voyage :", "… a lan-pay-ra-TEEF nay-GA-teef", "Give the following as negative imperatives, tu then vous."], ["1. Ne pas se déplacer sans son guide en poche. → Ne te déplace pas sans ton guide en poche. / Ne vous déplacez pas sans votre guide en poche.", "nuh tuh day-PLAHSS PAH … nuh voo day-pla-SAY PAH", "Don't travel without your guidebook."], ["2. Ne pas avoir peur de communiquer avec les gens. → N'aie pas peur de communiquer avec les gens. / N'ayez pas peur de communiquer avec les gens.", "nay pah PUR … na-yay pah PUR", "Don't be afraid to talk to people."], ["3. Ne pas prendre de risques inutiles. → Ne prends pas de risques inutiles. / Ne prenez pas de risques inutiles.", "nuh prahn pah duh REESK … nuh pruh-NAY pah", "Don't take unnecessary risks."], ["4. Ne pas se baigner seul. → Ne te baigne pas seul. / Ne vous baignez pas seul.", "nuh tuh BEN-yuh pah SUL … nuh voo bay-NYAY pah", "Don't swim alone."], ["5. Ne pas s'endormir au soleil sur la plage. → Ne t'endors pas au soleil sur la plage. / Ne vous endormez pas au soleil sur la plage.", "nuh tahn-DOR pah … nuh voo zahn-dor-MAY pah", "Don't fall asleep in the sun on the beach."]]}, {"name": "Leçon 3 — Ex. 12 : titres de presse au passé composé", "items": [["Complétez ces titres de presse avec les verbes pronominaux suivants : se rencontrer – se revoir – se séparer – se déshabiller – se fian
