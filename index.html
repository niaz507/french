": [["J'ai faim.", "zhay FAN", "I'm hungry. — not je suis faim"], ["J'ai 25 ans.", "zhay van-sank AHN", "I'm 25. — not je suis 25"], ["J'ai froid.", "zhay FRWAH", "I'm cold. — not je suis froid"]]}]}, {"id": "gm-avoir", "label": "Le verbe", "name": "Avoir — to have", "art": "avoirtable", "summary": "The other verb you cannot do without. Present tense, the liaisons that carry the meaning, and the long list of things French 'has' where English 'is'.", "groups": [{"name": "Le présent", "cols": "two", "items": [["j'ai", "ZHAY", "I have"], ["tu as", "tew AH", "you have"], ["il a", "ee LAH", "he has"], ["elle a", "el LAH", "she has"], ["on a", "oh NAH", "one has / we have"], ["nous avons", "noo za-VOHN", "we have"], ["vous avez", "voo za-VAY", "you have"], ["ils ont", "eel ZOHN", "they have (m)"], ["elles ont", "el ZOHN", "they have (f)"]]}, {"name": "Les liaisons d'avoir", "note": "Every plural form of <em>avoir</em> starts with a vowel, so every one of them liaises: nou<strong>s a</strong>vons, vou<strong>s a</strong>vez, il<strong>s o</strong>nt — all with a <strong>z</strong>.", "items": [["nous avons", "noo za-VOHN", "we have"], ["vous avez", "voo za-VAY", "you have"], ["ils ont / elles ont", "eel ZOHN / el ZOHN", "they have"], ["il a un frère", "ee la uhn FRAIR", "he has a brother"], ["on a une question", "oh na ewn kes-tee-OHN", "we have a question"]]}, {"name": "Avoir pour l'âge et le corps", "cols": "two", "note": "These are all <strong>avoir</strong> in French and <strong>be</strong> in English. Learn them as a block.", "items": [["avoir … ans", "a-VWAHR … AHN", "to be … years old"], ["Quel âge avez-vous ? — J'ai trente ans.", "kel AHZH a-vay VOO — zhay trahnt AHN", "How old are you? — I'm thirty."], ["avoir faim", "a-VWAHR FAN", "to be hungry"], ["avoir soif", "a-VWAHR SWAHF", "to be thirsty"], ["avoir chaud", "a-VWAHR SHOW", "to be hot"], ["avoir froid", "a-VWAHR FRWAH", "to be cold"], ["avoir sommeil", "a-VWAHR so-MAY", "to be sleepy"], ["avoir peur", "a-VWAHR PUR", "to be afraid"], ["avoir mal à…", "a-VWAHR mal a", "to have a pain in…"], ["avoir raison", "a-VWAHR ray-ZOHN", "to be right"], ["avoir tort", "a-VWAHR TOR", "to be wrong"], ["avoir besoin de", "a-VWAHR buh-ZWAN duh", "to need"], ["avoir envie de", "a-VWAHR ahn-VEE duh", "to feel like"], ["avoir de la chance", "a-VWAHR duh lah SHAHNSS", "to be lucky"]]}, {"name": "La négation — et le piège du « de »", "note": "After a negative, <strong>un, une, des</strong> all collapse into <strong>de</strong> (or <strong>d'</strong>). <em>J'ai une voiture</em> → <em>Je n'ai <strong>pas de</strong> voiture</em>. This does not happen with <em>le, la, les</em>.", "items": [["J'ai un frère. → Je n'ai pas de frère.", "zhuh nay pah duh FRAIR", "un → de"], ["J'ai une voiture. → Je n'ai pas de voiture.", "zhuh nay pah duh vwa-TEWR", "une → de"], ["J'ai des amis ici. → Je n'ai pas d'amis ici.", "zhuh nay pah da-MEE ee-SEE", "des → d'"], ["Il n'a pas le temps.", "eel na pah luh TAHN", "le stays le"]]}, {"name": "Il y a — there is, there are", "note": "Built from <em>avoir</em> and completely fixed: <strong>il y a</strong> never changes for singular or plural.", "items": [["Il y a un musée.", "eel ya uhn mew-ZAY", "There is a museum."], ["Il y a des jardins.", "eel ya day zhar-DAN", "There are gardens."], ["Il n'y a pas de pharmacie.", "eel nya pah duh far-ma-SEE", "There is no pharmacy."], ["Qu'est-ce qu'il y a ?", "kes-keel YA", "What is there? / What's wrong?"], ["Il y a combien de places ?", "eel ya kohm-bee-AN duh PLAHSS", "How many seats are there?"]]}]}, {"id": "gm-poss", "label": "Les déterminants", "name": "L'adjectif possessif", "art": "possessifs", "summary": "mon, ma, mes… The rule that catches everyone: the word agrees with the thing owned, not with the owner.", "groups": [{"name": "Le tableau complet", "cols": "two", "note": "Read across: <strong>masculine · feminine · plural</strong>. The choice depends entirely on the <em>noun that follows</em>.", "items": [["mon frère · ma sœur · mes parents", "mohn FRAIR · ma SUR · may pa-RAHN", "my"], ["ton frère · ta sœur · tes parents", "tohn FRAIR · ta SUR · tay pa-RAHN", "your (familiar)"], ["son frère · sa sœur · ses parents", "sohn FRAIR · sa SUR · say pa-RAHN", "his / her / its"], ["notre frère · notre sœur · nos parents", "NOT-ruh · NOT-ruh · no pa-RAHN", "our"], ["votre frère · votre sœur · vos parents", "VOT-ruh · VOT-ruh · vo pa-RAHN", "your (polite / plural)"], ["leur frère · leur sœur · leurs parents", "lur FRAIR · lur SUR · lur pa-RAHN", "their"]]}, {"name": "Le point qui piège tout le monde", "note": "<strong>son</strong> and <strong>sa</strong> do NOT tell you the owner's gender. <em>son père</em> is <em>his father</em> or <em>her father</em> — French does not care. What decides is that <em>père</em> is masculine.<br><br>So a woman says <strong>son mari</strong> and a man says <strong>sa femme</strong>.", "items": [["Marie parle de son père.", "ma-REE parl duh sohn PAIR", "Marie talks about her father."], ["Paul parle de son père.", "pol parl duh sohn PAIR", "Paul talks about his father. — identical"], ["Marie parle de sa mère.", "ma-REE parl duh sa MAIR", "Marie talks about her mother."], ["Paul parle de sa mère.", "pol parl duh sa MAIR", "Paul talks about his mother. — identical"]]}, {"name": "Ma devient mon devant une voyelle", "note": "Before a feminine word starting with a vowel or silent h, <strong>ma → mon, ta → ton, sa → son</strong>. It is purely for the sound — the noun is still feminine.", "items": [["une amie → mon amie", "moh na-MEE", "my friend (f) — not ma amie"], ["une adresse → mon adresse", "moh na-DRESS", "my address"], ["une école → ton école", "toh nay-KOL", "your school"], ["une histoire → son histoire", "soh nees-TWAHR", "his / her story"]]}, {"name": "Notre, votre, leur — un seul mot au singulier", "note": "These three don't change for gender at all. Only the plural moves: <strong>nos, vos, leurs</strong>.", "cols": "two", "items": [["notre maison", "NOT-ruh may-ZOHN", "our house"], ["notre jardin", "NOT-ruh zhar-DAN", "our garden"], ["nos enfants", "no zahn-FAHN", "our children"], ["votre nom", "VOT-ruh NOHN", "your surname"], ["vos coordonnées", "vo ko-or-do-NAY", "your contact details"], ["leur fille", "lur FEE-yuh", "their daughter"], ["leurs amis", "lur za-MEE", "their friends"]]}, {"name": "En pratique", "items": [["Quel est votre nom ? — Mon nom est Martin.", "kel ay VOT-ruh NOHN — mohn nohn ay mar-TAN", "What's your surname? — My surname is Martin."], ["C'est ma sœur et son mari.", "say ma SUR ay sohn ma-REE", "This is my sister and her husband."], ["Voici mes parents et leurs amis.", "vwa-SEE may pa-RAHN ay lur za-MEE", "Here are my parents and their friends."], ["Mon adresse mail et mon numéro de téléphone.", "moh na-DRESS mail ay mohn new-may-RO duh tay-lay-FON", "My email address and my phone number."], ["Ta langue maternelle, c'est quoi ?", "ta lahng ma-tair-NELL, say KWAH", "What's your mother tongue?"]]}]}, {"id": "tn-present", "label": "Le temps", "name": "Le présent", "summary": "What is happening now, what is generally true, and what is about to happen. Three verb families, plus the irregulars you cannot avoid.", "art": null, "groups": [{"name": "Les trois groupes", "note": "French verbs fall into three families by their infinitive ending. The <strong>-er</strong> group is by far the biggest — around 90% of all verbs — and completely regular.", "cols": "two", "items": [["1er groupe : -er — parler, aimer, habiter", "par-LAY, ay-MAY, a-bee-TAY", "regular, the huge majority"], ["2e groupe : -ir — finir, choisir, réussir", "fee-NEER, shwa-ZEER, ray-ew-SEER", "regular, adds -iss- in the plural"], ["3e groupe : -re, -oir, irréguliers — prendre, voir, faire", "PRAHN-druh, VWAHR, FAIR", "irregular, learn one by one"]]}, {"name": "1er groupe — parler", "cols": "three", "items": [["je parle", "zhuh PARL", "I speak"], ["tu parles", "tew PARL", "you speak"], ["il parle", "eel PARL", "he speaks"], ["nous parlons", "noo par-LOHN", "we speak"], ["vous parlez", "voo par-LAY", "you speak"], ["ils parlent", "eel PARL", "they speak"]]}, {"name": "2e groupe — finir", "cols": "three", "note": "The giveaway is <strong>-iss-</strong> in the three plural forms.", "items": [["je finis", "zhuh fee-NEE", "I finish"], ["tu finis", "tew fee-NEE", "you finish"], ["il finit", "eel fee-NEE", "he finishes"], ["nous finissons", "noo fee-nee-SOHN", "we finish"], ["vous finissez", "voo fee-nee-SAY", "you finish"], ["ils finissent", "eel fee-NEESS", "they finish"]]}, {"name": "Les irréguliers indispensables", "cols": "two", "items": [["aller : je vais, tu vas, il va, nous allons, vous allez, ils vont", "zhuh VAY … eel VOHN", "to go"], ["faire : je fais, tu fais, il fait, nous faisons, vous faites, ils font", "zhuh FAY … noo fuh-ZOHN … eel FOHN", "to do, to make"], ["prendre : je prends, nous prenons, ils prennent", "zhuh PRAHN … eel PREN", "to take"], ["venir : je viens, nous venons, ils viennent", "zhuh vee-AN … eel vee-EN", "to come"], ["pouvoir : je peux, nous pouvons, ils peuvent", "zhuh PUH … eel PUV", "to be able to"], ["vouloir : je veux, nous voulons, ils veulent", "zhuh VUH … eel VUL", "to want"], ["devoir : je dois, nous devons, ils doivent", "zhuh DWAH … eel DWAHV", "to have to"], ["savoir : je sais, nous savons, ils savent", "zhuh SAY … eel SAHV", "to know"], ["voir : je vois, nous voyons, ils voient", "zhuh VWAH … eel VWAH", "to see"], ["dire : je dis, nous disons, vous dites, ils disent", "zhuh DEE … voo DEET", "to say"]]}, {"name": "À quoi sert le présent", "items": [["J'habite à Vancouver.", "zha-BEET a vahn-koo-VAIR", "a permanent situation"], ["Je travaille en ce moment.", "zhuh tra-VIGH ahn suh mo-MAHN", "happening right now"], ["Le train part à huit heures.", "luh tran par a wee TUR", "a timetabled future"], ["L'eau bout à cent degrés.", "lo boo a sahn duh-GRAY", "a general truth"], ["Je suis en train de manger.", "zhuh swee zahn tran duh mahn-ZHAY", "emphasising right now"]]}]}, {"id": "tn-passe-compose", "label": "Le temps", "name": "Le passé composé", "summary": "The everyday past tense. Two pieces: a helper verb in the present, plus the past participle — and the rule for which helper to use.", "art": null, "groups": [{"name": "La formule", "note": "<strong>avoir</strong> or <strong>être</strong> in the present + the <strong>participe passé</strong>. Most verbs take avoir.", "items": [["J'ai mangé.", "zhay mahn-ZHAY", "I ate / I have eaten."], ["Je suis allé.", "zhuh swee za-LAY", "I went."], ["Nous avons fini.", "noo za-vohn fee-NEE", "We finished."], ["Elle est partie.", "el ay par-TEE", "She left."]]}, {"name": "Les participes passés", "cols": "two", "items": [["-er → -é : parler → parlé", "par-LAY", "spoken"], ["-ir → -i : finir → fini", "fee-NEE", "finished"], ["-re → -u : vendre → vendu", "vahn-DEW", "sold"], ["être → été", "ay-TAY", "been"], ["avoir → eu", "EW", "had"], ["faire → fait", "FAY", "done"], ["prendre → pris", "PREE", "taken"], ["voir → vu", "VEW", "seen"], ["venir → venu", "vuh-NEW", "come"], ["mettre → mis", "MEE", "put"], ["écrire → écrit", "ay-KREE", "written"], ["lire → lu", "LEW", "read"], ["boire → bu", "BEW", "drunk"], ["pouvoir → pu", "PEW", "been able"], ["vouloir → voulu", "voo-LEW", "wanted"], ["dire → dit", "DEE", "said"]]}, {"name": "Les verbes avec être", "note": "A short, closed list — mostly verbs of coming and going, plus all reflexives. The classic memory aid is <strong>DR &amp; MRS VANDERTRAMP</strong>. With être, the participle <strong>agrees</strong> with the subject.", "cols": "two", "items": [["aller / venir", "a-LAY / vuh-NEER", "to go / to come"], ["arriver / partir", "a-ree-VAY / par-TEER", "to arrive / to leave"], ["entrer / sortir", "ahn-TRAY / sor-TEER", "to enter / to go out"], ["monter / descendre", "mohn-TAY / day-SAHN-druh", "to go up / to go down"], ["naître / mourir", "NET-ruh / moo-REER", "to be born / to die"], ["rester / tomber", "res-TAY / tohm-BAY", "to stay / to fall"], ["passer / retourner", "pa-SAY / ruh-toor-NAY", "to pass by / to return"], ["tous les verbes pronominaux", "too lay vairb pro-no-mee-NO", "all reflexive verbs"]]}, {"name": "L'accord avec être", "note": "Feminine adds <strong>-e</strong>, plural adds <strong>-s</strong>. With <em>avoir</em> there is no agreement with the subject at all.", "items": [["Il est allé.", "ee lay ta-LAY", "He went."], ["Elle est allée.", "el ay ta-LAY", "She went. — same sound"], ["Ils sont allés.", "eel sohn ta-LAY", "They went. (m)"], ["Elles sont allées.", "el sohn ta-LAY", "They went. (f)"], ["Elle s'est levée tôt.", "el say luh-VAY TOH", "She got up early. — reflexive"], ["Elle a mangé.", "el a mahn-ZHAY", "She ate. — avoir, no agreement"]]}, {"name": "La négation", "note": "The <strong>ne … pas</strong> wraps around the <em>helper</em>, not the participle.", "items": [["Je n'ai pas mangé.", "zhuh nay pah mahn-ZHAY", "I didn't eat."], ["Il n'est pas venu.", "eel nay pah vuh-NEW", "He didn't come."], ["Nous ne sommes pas sortis.", "noo nuh som pah sor-TEE", "We didn't go out."]]}]}, {"id": "tn-imparfait", "label": "Le temps", "name": "L'imparfait", "summary": "The other past. Used for description, habit and background — and the one tense with no exceptions in its endings.", "art": null, "groups": [{"name": "Comment le former", "note": "Take the <strong>nous</strong> form of the present, drop <strong>-ons</strong>, add the endings. This works for every verb in the language except <em>être</em>.", "cols": "two", "items": [["nous parlons → parl- → je parlais", "zhuh par-LAY", "I was speaking"], ["nous finissons → finiss- → je finissais", "zhuh fee-nee-SAY", "I was finishing"], ["nous prenons → pren- → je prenais", "zhuh pruh-NAY", "I was taking"], ["nous faisons → fais- → je faisais", "zhuh fuh-ZAY", "I was doing"], ["être → ét- → j'étais", "zhay-TAY", "I was — the one exception"]]}, {"name": "Les terminaisons", "cols": "three", "items": [["je parlais", "zhuh par-LAY", "-ais"], ["tu parlais", "tew par-LAY", "-ais"], ["il parlait", "eel par-LAY", "-ait"], ["nous parlions", "noo par-lee-OHN", "-ions"], ["vous parliez", "voo par-lee-AY", "-iez"], ["ils parlaient", "eel par-LAY", "-aient"]]}, {"name": "Imparfait ou passé composé ?", "note": "<strong>Imparfait</strong> = the setting, the habit, the ongoing. <strong>Passé composé</strong> = the event that happened once and moved the story on.", "items": [["Il faisait beau.", "eel fuh-ZAY BO", "The weather was fine. — description"], ["Je mangeais quand le téléphone a sonné.", "zhuh mahn-ZHAY kahn luh tay-lay-FON a so-NAY", "I was eating when the phone rang."], ["Quand j'étais petit, j'habitais à Dhaka.", "kahn zhay-TAY puh-TEE, zha-bee-TAY a da-KAH", "When I was small I lived in Dhaka. — habit"], ["Hier, j'ai visité le musée.", "ee-AIR, zhay vee-zee-TAY luh mew-ZAY", "Yesterday I visited the museum. — single event"], ["Elle était fatiguée alors elle est rentrée.", "el ay-TAY fa-tee-GAY a-LOR el ay rahn-TRAY", "She was tired so she went home. — both, in one sentence"]]}]}, {"id": "tn-plus-que-parfait", "label": "Le temps", "name": "Le plus-que-parfait", "summary": "The past before the past — what had already happened when something else took place.", "art": null, "groups": [{"name": "La formule", "note": "<strong>avoir</strong> or <strong>être</strong> in the <em>imparfait</em> + the past participle. Same helper rules as the passé composé.", "cols": "two", "items": [["j'avais mangé", "zha-VAY mahn-ZHAY", "I had eaten"], ["tu avais fini", "tew a-VAY fee-NEE", "you had finished"], ["il avait pris", "eel a-VAY PREE", "he had taken"], ["nous étions partis", "noo zay-tee-OHN par-TEE", "we had left"], ["vous étiez arrivés", "voo zay-tee-AY a-ree-VAY", "you had arrived"], ["elles étaient venues", "el zay-TAY vuh-NEW", "they had come"]]}, {"name": "En contexte", "items": [["Quand je suis arrivé, il était déjà parti.", "kahn zhuh swee za-ree-VAY, eel ay-TAY day-zha par-TEE", "When I arrived, he had already left."], ["J'avais oublié mon passeport.", "zha-vay zoo-blee-AY mohn pas-POR", "I had forgotten my passport."], ["Elle a dit qu'elle avait visité Paris.", "el a dee kel a-VAY vee-zee-TAY pa-REE", "She said she had visited Paris."], ["déjà / ne … jamais / avant", "day-ZHA / nuh … zha-MAY / a-VAHN", "already / never / before — its usual companions"]]}]}, {"id": "tn-futur-proche", "label": "Le temps", "name": "Le futur proche", "summary": "The easiest future in French, and the one people actually use in speech: going to do something.", "art": null, "groups": [{"name": "aller + infinitif", "cols": "two", "items": [["je vais manger", "zhuh vay mahn-ZHAY", "I'm going to eat"], ["tu vas partir", "tew va par-TEER", "you're going to leave"], ["il va arriver", "eel va a-ree-VAY", "he's going to arrive"], ["nous allons voir", "noo za-lohn VWAHR", "we're going to see"], ["vous allez comprendre", "voo za-lay kohm-PRAHN-druh", "you're going to understand"], ["ils vont commencer", "eel vohn ko-mahn-SAY", "they're going to start"]]}, {"name": "La négation et les expressions de temps", "items": [["Je ne vais pas sortir ce soir.", "zhuh nuh vay pah sor-TEER suh SWAHR", "I'm not going out tonight."], ["demain", "duh-MAN", "tomorrow"], ["ce soir", "suh SWAHR", "tonight"], ["la semaine prochaine", "lah suh-men pro-SHEN", "next week"], ["dans deux jours", "dahn duh ZHOOR", "in two days"], ["tout à l'heure", "too ta LUR", "later today"], ["bientôt", "bee-an-TO", "soon"]]}]}, {"id": "tn-futur-simple", "label": "Le temps", "name": "Le futur simple", "summary": "The written and more distant future. One set of endings for every verb — they are the present tense of avoir.", "art": null, "groups": [{"name": "Comment le former", "note": "Infinitive + endings. For <strong>-re</strong> verbs, drop the final <em>e</em> first. The endings are the same for every verb without exception: <strong>-ai, -as, -a, -ons, -ez, -ont</strong>.", "cols": "three", "items": [["je parlerai", "zhuh par-luh-RAY", "I will speak"], ["tu parleras", "tew par-luh-RAH", "you will speak"], ["il parlera", "eel par-luh-RAH", "he will speak"], ["nous parlerons", "noo par-luh-ROHN", "we will speak"], ["vous parlerez", "voo par-luh-RAY", "you will speak"], ["ils parleront", "eel par-luh-ROHN", "they will speak"], ["finir → je finirai", "zhuh fee-nee-RAY", "I will finish"], ["prendre → je prendrai", "zhuh prahn-DRAY", "I will take"], ["écrire → j'écrirai", "zhay-kree-RAY", "I will write"]]}, {"name": "Les radicaux irréguliers", "note": "A handful of very common verbs change their stem — but they still take the same endings.", "cols": "two", "items": [["être → je serai", "zhuh suh-RAY", "I will be"], ["avoir → j'aurai", "zho-RAY", "I will have"], ["aller → j'irai", "zhee-RAY", "I will go"], ["faire → je ferai", "zhuh fuh-RAY", "I will do"], ["venir → je viendrai", "zhuh vee-an-DRAY", "I will come"], ["voir → je verrai", "zhuh vay-RAY", "I will see"], ["pouvoir → je pourrai", "zhuh poo-RAY", "I will be able"], ["vouloir → je voudrai", "zhuh voo-DRAY", "I will want"], ["devoir → je devrai", "zhuh duh-VRAY", "I will have to"], ["savoir → je saurai", "zhuh so-RAY", "I will know"], ["il faut → il faudra", "eel fo-DRAH", "it will be necessary"], ["il y a → il y aura", "eel ee o-RAH", "there will be"]]}, {"name": "Proche ou simple ?", "items": [["Je vais partir dans cinq minutes.", "zhuh vay par-TEER", "near, certain, spoken"], ["Un jour, je partirai.", "uhn zhoor, zhuh par-tee-RAY", "distant, more formal"], ["Quand j'aurai le temps, je viendrai.", "kahn zho-RAY luh TAHN", "after quand, French uses the future where English uses the present"]]}]}, {"id": "tn-conditionnel", "label": "Le temps", "name": "Le conditionnel", "summary": "For politeness, wishes and hypotheticals — and the single most useful phrase for a beginner: je voudrais.", "art": null, "groups": [{"name": "Comment le former", "note": "The <strong>future stem</strong> plus the <strong>imparfait endings</strong>. If you know those two, you already know this one.", "cols": "three", "items": [["je parlerais", "zhuh par-luh-RAY", "I would speak"], ["tu parlerais", "tew par-luh-RAY", "you would speak"], ["il parlerait", "eel par-luh-RAY", "he would speak"], ["nous parlerions", "noo par-luh-ree-OHN", "we would speak"], ["vous parleriez", "voo par-luh-ree-AY", "you would speak"], ["ils parleraient", "eel par-luh-RAY", "they would speak"]]}, {"name": "La politesse — à apprendre tout de suite", "note": "This is why the conditional matters at A1: it turns a demand into a request.", "items": [["Je voudrais un café, s'il vous plaît.", "zhuh voo-DREH uhn ka-FAY", "I would like a coffee, please."], ["Je voudrais réserver une chambre.", "zhuh voo-DREH ray-zair-VAY ewn SHAHM-bruh", "I'd like to book a room."], ["Pourriez-vous m'aider ?", "poo-ree-ay VOO may-DAY", "Could you help me?"], ["Est-ce que vous auriez une table ?", "es-kuh voo zo-ree-AY ewn TAH-bluh", "Would you have a table?"], ["J'aimerais visiter Paris.", "zhem-RAY vee-zee-TAY pa-REE", "I would love to visit Paris."], ["Ce serait parfait.", "suh suh-RAY par-FAY", "That would be perfect."]]}, {"name": "Si + imparfait → conditionnel", "items": [["Si j'avais le temps, je viendrais.", "see zha-VAY luh TAHN, zhuh vee-an-DRAY", "If I had time, I would come."], ["Si j'étais riche, j'achèterais une maison.", "see zhay-TAY REESH, zha-shet-RAY ewn may-ZOHN", "If I were rich, I'd buy a house."], ["On pourrait aller au cinéma.", "ohn poo-RAY a-LAY oh see-nay-MAH", "We could go to the cinema."]]}]}, {"id": "tn-imperatif", "label": "Le mode", "name": "L'impératif", "summary": "Giving instructions, directions and advice — the form you meet constantly in exercise books and on street signs.", "art": null, "groups": [{"name": "Trois formes seulement", "note": "Built from the present tense with the subject pronoun removed. For <strong>-er</strong> verbs the <em>tu</em> form drops its <strong>-s</strong>.", "cols": "three", "items": [["Parle !", "PARL", "Speak! — tu"], ["Parlons !", "par-LOHN", "Let's speak! — nous"], ["Parlez !", "par-LAY", "Speak! — vous"], ["Va !", "VAH", "Go! — note: vas-y with y"], ["Allons !", "a-LOHN", "Let's go!"], ["Allez !", "a-LAY", "Go!"], ["Finis !", "fee-NEE", "Finish!"], ["Finissons !", "fee-nee-SOHN", "Let's finish!"], ["Finissez !", "fee-nee-SAY", "Finish!"]]}, {"name": "Les irréguliers", "cols": "two", "items": [["être → sois, soyons, soyez", "SWAH, swa-YOHN, swa-YAY", "be"], ["avoir → aie, ayons, ayez", "AY, ay-OHN, ay-YAY", "have"], ["savoir → sache, sachons, sachez", "SAHSH, sa-SHOHN, sa-SHAY", "know"], ["vouloir → veuillez", "vuh-YAY", "kindly (very formal)"]]}, {"name": "Dans la vie de tous les jours", "cols": "two", "items": [["Écoutez !", "ay-koo-TAY", "Listen!"], ["Répétez !", "ray-pay-TAY", "Repeat!"], ["Regardez !", "ruh-gar-DAY", "Look!"], ["Tournez à droite.", "toor-NAY a DRWAHT", "Turn right."], ["Prenez la première rue.", "pruh-NAY lah pruh-mee-AIR REW", "Take the first street."], ["Asseyez-vous.", "a-say-YAY VOO", "Sit down."], ["Ne fumez pas.", "nuh few-MAY PAH", "Don't smoke."], ["N'ayez pas peur.", "na-yay pah PUR", "Don't be afraid."], ["Excusez-moi.", "eks-kew-zay MWAH", "Excuse me."], ["Attendez !", "a-tahn-DAY", "Wait!"]]}]}, {"id": "tn-subjonctif", "label": "Le mode", "name": "Le subjonctif présent", "summary": "Not a tense but a mood — used after certain expressions of wish, emotion, doubt and necessity. Worth recognising early even if you use it later.", "art": null, "groups": [{"name": "Comment le former", "note": "Take the <strong>ils</strong> form of the present, drop <strong>-ent</strong>, add: <em>-e, -es, -e, -ions, -iez, -ent</em>. It almost always appears after <strong>que</strong>.", "cols": "three", "items": [["que je parle", "kuh zhuh PARL", "that I speak"], ["que tu parles", "kuh tew PARL", "that you speak"], ["qu'il parle", "keel PARL", "that he speaks"], ["que nous parlions", "kuh noo par-lee-OHN", "that we speak"], ["que vous parliez", "kuh voo par-lee-AY", "that you speak"], ["qu'ils parlent", "keel PARL", "that they speak"]]}, {"name": "Les irréguliers fréquents", "cols": "two", "items": [["être → que je sois", "kuh zhuh SWAH", "that I be"], ["avoir → que j'aie", "kuh ZHAY", "that I have"], ["aller → que j'aille", "kuh ZHIGH", "that I go"], ["faire → que je fasse", "kuh zhuh FAHSS", "that I do"], ["pouvoir → que je puisse", "kuh zhuh PWEESS", "that I can"], ["savoir → que je sache", "kuh zhuh SAHSH", "that I know"], ["vouloir → que je veuille", "kuh zhuh VUH-yuh", "that I want"], ["il faut → qu'il faille", "keel FIGH", "that it be necessary"]]}, {"name": "Après quelles expressions", "items": [["Il faut que je parte.", "eel fo kuh zhuh PART", "I have to leave."], ["Je veux que tu viennes.", "zhuh vuh kuh tew vee-EN", "I want you to come."], ["Il est important que vous compreniez.", "eel ay tan-por-TAHN kuh voo kohm-pruh-nee-AY", "It's important that you understand."], ["Je suis content que tu sois là.", "zhuh swee kohn-TAHN kuh tew swah LAH", "I'm glad you're here."], ["Bien qu'il soit tard…", "bee-an keel swah TAR", "Although it's late…"], ["avant que / pour que / jusqu'à ce que", "a-VAHN kuh / poor kuh / zhews-ka suh kuh", "before / so that / until"]]}]}]}, {"id": "alterego", "name": "Alter Ego A1", "short": "Alter Ego", "color": "#6B3FA0", "blurb": "The coursebook. Dossiers 0 to 2 are transcribed word by word with audio; every other page of the book is here to read, and all 207 CD tracks are at the end.", "lessons": [{"id": "ae-d0", "label": "Dossier 0", "name": "Découverte", "summary": "Pages 13–24, complete. Every instruction, every list, every drawing caption and every exercise item from Dossier 0.", "art": "alphabet", "bookpages": ["p013", "p014", "p015", "p016", "p017", "p018", "p019", "p020", "p021", "p022", "p023", "p024"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Dossier 0, in page order.", "tracks": [{"n": 1, "label": "p.15 act. 2 — l'initiation aux langues"}, {"n": 2, "label": n many languages."}, {"name": "Page 14 — Identifier une langue", "items": [["Identifier une langue", "ee-dahn-tee-fee-AY ewn LAHNG", "Identify a language"], ["Journée européenne des langues — 26 septembre", "zhoor-NAY uh-ro-pay-EN day LAHNG", "European Day of Languages — 26 September"], ["European Day of Languages — 26 September", "—", "the same title in English on the poster"], ["Activité 1 : Observez l'affiche de la Journée européenne des langues.", "ob-sair-VAY la-FEESH", "Look at the European Day of Languages poster."], ["…et identifiez le premier mot de la classe de français.", "ay ee-dahn-tee-fee-AY luh pruh-mee-AY MO duh lah klahss duh frahn-SAY", "…and identify the first word of the French class."], ["La réponse : Bonjour.", "bohn-ZHOOR", "The answer: Bonjour — it's at the bottom of the poster."], ["une affiche", "ew na-FEESH", "a poster"], ["une langue", "ewn LAHNG", "a language"], ["le premier mot", "luh pruh-mee-AY MO", "the first word"], ["la classe de français", "lah klahss duh frahn-SAY", "the French class"]], "note": "The poster is a blackboard covered in the word <em>hello</em> in some thirty European languages, with two web addresses at the foot: <code>http://www.coe.int/JEL</code> and <code>http://www.coe.int/EDL</code>. Beside it, a photo of a teacher introducing a student to the class, and a stack of dictionaries labelled ENGLISH, ITALIANO, DEUTSCH, PORTUGUÊS, FRANÇAIS, ESPAÑOL."}, {"name": "Page 14 — les salutations sur l'affiche", "items": [["Bonjour", "bohn-ZHOOR", "French"], ["Hello", "—", "English"], ["Guten Tag", "—", "German"], ["Buenos días", "—", "Spanish"], ["Buon giorno", "—", "Italian"], ["Bom dia", "—", "Portuguese"], ["Olá", "—", "Portuguese"], ["Dobrý den", "—", "Czech"], ["Dobrý deň", "—", "Slovak"], ["Dzień dobry", "—", "Polish"], ["Добрый день", "—", "Russian"], ["Доброго дня", "—", "Ukrainian"], ["Вітаю", "—", "Ukrainian"], ["Добар дан", "—", "Serbian"], ["Добар ден", "—", "Macedonian"], ["Dobar dan", "—", "Croatian"], ["Dober dan", "—", "Slovenian"], ["Bună ziua", "—", "Romanian"], ["Jó napot", "—", "Hungarian"], ["Labas", "—", "Lithuanian"], ["Labdien", "—", "Latvian"], ["Tere", "—", "Estonian"], ["Hei", "—", "Finnish"], ["Hej", "—", "Swedish / Danish"], ["God dag", "—", "Norwegian"], ["Góðan daginn", "—", "Icelandic"], ["Goedendag", "—", "Dutch"], ["Dia Duit", "—", "Irish"], ["Merhaba", "—", "Turkish"], ["Sabahınız xeyir olsun", "—", "Azerbaijani"], ["Γεια σου", "—", "Greek"], ["Bongu", "—", "Maltese"], ["Mirëdita", "—", "Albanian"], ["Բարի լույս", "—", "Armenian"], ["გამარჯობა", "—", "Georgian"], ["Bun di", "—", "Romansh"], ["Moien", "—", "Luxembourgish"]], "note": "Every greeting printed on the poster, with the language it belongs to. Only the French one — <strong>Bonjour</strong> — is the answer to activity 1.", "cols": "three"}, {"name": "Page 15 — Passeport pour les langues", "items": [["Passeport pour les langues", "pas-POR poor lay LAHNG", "Passport for languages"], ["Découvrez gratuitement plus de 30 langues", "day-koo-VRAY gra-tweet-MAHN plew duh trahnt LAHNG", "Discover more than 30 languages free of charge"], ["Initiation gratuite avec le passeport pour les langues !", "ee-nee-see-a-see-OHN gra-TWEET", "Free introductory session with the language passport!"], ["Activité 2 : La Journée européenne des langues organise une initiation aux langues.", "… or-ga-NEEZ ewn ee-nee-see-a-see-OHN oh LAHNG", "The European Day of Languages is running language taster sessions."], ["Regardez la liste des langues puis écoutez. Vous entendez quelles langues ?", "ruh-gar-DAY lah leest day LAHNG pwee zay-koo-TAY", "Look at the list of languages then listen. Which languages do you hear?"], ["Activité 3 : À vous ! Faites connaissance avec le groupe : dites bonjour et dites votre prénom.", "a VOO ! fet ko-nay-SAHNSS a-vek luh GROOP", "Your turn! Get to know the group: say hello and give your first name."], ["Exemple : Bonjour, je m'appelle Camille.", "bohn-ZHOOR, zhuh ma-PELL ka-MEE", "Example: Hello, my name is Camille."]]}, {"name": "Page 15 — les neuf langues et leurs instituts", "items": [["italien — Istituto italiano di cultura", "ee-tal-YAN", "Italian"], ["chinois — Centre culturel de Chine", "shee-NWAH", "Chinese"], ["polonais — Institut polonais", "po-lo-NAY", "Polish"], ["français — Alliance française", "frahn-SAY", "French"], ["arabe — Institut du monde arabe", "a-RAHB", "Arabic"], ["allemand — Goethe-Institut", "al-MAHN", "German"], ["portugais — Centro cultural do Brasil", "por-tew-GAY", "Portuguese"], ["japonais — Maison de la Culture du Japon", "zha-po-NAY", "Japanese"], ["anglais — British Council", "ahn-GLAY", "English"]], "note": "The leaflet pairs each language with the cultural institute running its taster session.", "cols": "two"}, {"name": "Page 15 — Se présenter : les trois dialogues", "items": [["Se présenter", "suh pray-zahn-TAY", "Introducing yourself"], ["Activité 4 : Écoutez. Associez les dialogues aux dessins.", "ay-koo-TAY. a-so-see-AY lay dee-a-LOG oh day-SAN", "Listen. Match the dialogues to the drawings."], ["Activité 5 : Lisez pour vérifier.", "lee-ZAY poor vay-ree-fee-AY", "Read to check."], ["1. — Comment tu t'appelles ? — Yoko. Et toi ?", "ko-mahn tew ta-PELL ? — yo-KO. ay TWAH", "1. What's your name? — Yoko. And you?"], ["2. — Je m'appelle Clémence, et vous ? — Je m'appelle James.", "zhuh ma-PELL klay-MAHNSS, ay VOO ? — zhuh ma-PELL djems", "2. My name is Clémence, and you? — My name is James."], ["3. — Vous vous appelez comment ? — Hans. — Épelez, s'il vous plaît. — H-A-N-S.", "voo voo za-play ko-MAHN ? — ahnss. — ay-play, seel voo PLAY", "3. What's your name? — Hans. — Spell it please. — H-A-N-S."]], "note": "<strong>Drawing a</strong> — a student arriving in a classroom, greeting another seated student: informal, so dialogue 1 with <em>tu</em>.<br><strong>Drawing b</strong> — a teacher at the blackboard writing a name, speaking to a student: dialogue 3, where the name has to be spelled out.<br><strong>Drawing c</strong> — two students side by side at a desk: dialogue 2.<br><br>Notice the pattern: <em>tu t'appelles</em> between classmates, <em>vous vous appelez</em> from the teacher."}, {"name": "Page 16 — L'alphabet : A comme Annie", "items": [["Épeler son nom, l'alphabet", "ay-play sohn NOHN, lal-fa-BAY", "Spelling your name, the alphabet"], ["Activité 6 : Écoutez l'alphabet associé à des prénoms français.", "ay-koo-TAY lal-fa-BAY a-so-see-AY a day pray-NOHN frahn-SAY", "Listen to the alphabet matched with French first names."], ["A comme Annie", "ah kom a-NEE", "A as in Annie"], ["B comme Béatrice", "bay kom bay-a-TREESS", "B as in Béatrice"], ["C comme Catherine", "say kom kat-REEN", "C as in Catherine"], ["D comme Daniel", "day kom da-nee-ELL", "D as in Daniel"], ["E comme Eugénie", "uh kom uh-zhay-NEE", "E as in Eugénie"], ["F comme Fabien", "eff kom fa-bee-AN", "F as in Fabien"], ["G comme Gérard", "zhay kom zhay-RAR", "G as in Gérard"], ["H comme Hugo", "ahsh kom ew-GO", "H as in Hugo"], ["I comme Igor", "ee kom ee-GOR", "I as in Igor"], ["J comme Julie", "zhee kom zhew-LEE", "J as in Julie"], ["K comme Karine", "kah kom ka-REEN", "K as in Karine"], ["L comme Laure", "ell kom LOR", "L as in Laure"], ["M comme Monique", "emm kom mo-NEEK", "M as in Monique"], ["N comme Noémie", "enn kom no-ay-MEE", "N as in Noémie"], ["O comme Ophélie", "o kom o-fay-LEE", "O as in Ophélie"], ["P comme Paul", "pay kom POL", "P as in Paul"], ["Q comme Quentin", "kew kom kahn-TAN", "Q as in Quentin"], ["R comme Renaud", "air kom ruh-NO", "R as in Renaud"], ["S comme Simone", "ess kom see-MUN", "S as in Simone"], ["T comme Thibaut", "tay kom tee-BO", "T as in Thibaut"], ["U comme Ulysse", "ew kom ew-LEESS", "U as in Ulysse"], ["V comme Véronique", "vay kom vay-ro-NEEK", "V as in Véronique"], ["W comme William", "doo-bluh-VAY kom weel-YAM", "W as in William"], ["X comme Xavier", "eeks kom za-vee-AY", "X as in Xavier"], ["Y comme Yves", "ee-GREK kom EEV", "Y as in Yves"], ["Z comme Zoé", "zed kom zo-AY", "Z as in Zoé"], ["20 consonnes et 6 voyelles : a, e, i, o, u, y", "van kohn-SUN ay see vwa-YELL", "20 consonants and 6 vowels: a, e, i, o, u, y"]], "note": "The three letter names that trip up English speakers: <strong>E</strong> is <em>uh</em> (not ee), <strong>G</strong> is <em>zhay</em> (not gee), <strong>W</strong> is <em>double-vé</em>, and <strong>Y</strong> is <em>i grec</em> — literally 'Greek i'.", "cols": "two"}, {"name": "Page 16 — activités 7, 8, 9 et les aide-mémoire", "items": [["Activité 7 : Écoutez et répondez.", "ay-koo-TAY ay ray-pohn-DAY", "Listen and answer."], ["1. Quel est le prénom ?", "kel ay luh pray-NOHN", "What is the first name?"], ["2. Comment ça s'écrit ? Complétez : …eorges", "ko-mahn sa say-KREE", "How is it written? Complete: G-eorges"], ["3. Que dit la personne pour expliquer ? … comme …", "kuh dee lah pair-SUN poor eks-plee-KAY", "What does the person say to explain? … as in …"], ["Activité 8 : Écoutez et écrivez les prénoms.", "ay-koo-TAY ay ay-kree-VAY lay pray-NOHN", "Listen and write the first names."], ["Activité 9 a) Épelez votre prénom, votre voisin(e) écrit.", "ay-play VOT-ruh pray-NOHN, VOT-ruh vwa-ZAN ay-KREE", "Spell your first name; your neighbour writes it."], ["b) Ensemble, vous faites la liste des prénoms de la classe.", "ahn-SAHM-bluh, voo fet lah leest day pray-NOHN duh lah KLAHSS", "Together, make the list of the class's first names."], ["Aide-mémoire — Pour comprendre un mot ou un prénom", "poor kohm-PRAHN-druh uhn MO oo uhn pray-NOHN", "To understand a word or a first name"], ["Comment ? / Pardon ?", "ko-MAHN / par-DOHN", "Sorry? / Pardon?"], ["Épelez, s'il vous plaît.", "ay-play, seel voo PLAY", "Spell it, please."], ["Comment ça s'écrit ?", "ko-mahn sa say-KREE", "How do you write that?"], ["Aide-mémoire — Se présenter, demander le nom ou le prénom", "suh pray-zahn-TAY, duh-mahn-DAY luh NOHN", "Introducing yourself, asking someone's name"], ["Je m'appelle…, et vous ? / et toi ?", "zhuh ma-PELL, ay VOO / ay TWAH", "My name is…, and you?"], ["Vous vous appelez comment ?", "voo voo za-play ko-MAHN", "What's your name? — neutral"], ["Comment vous vous appelez ?", "ko-mahn voo voo za-play", "What's your name? — neutral"], ["Comment vous appelez-vous ?", "ko-mahn voo za-play VOO", "What's your name? — formal, inverted"], ["Tu t'appelles comment ?", "tew ta-PELL ko-MAHN", "What's your name? — familiar"], ["Comment tu t'appelles ?", "ko-mahn tew ta-PELL", "What's your name? — familiar"], ["Comment t'appelles-tu ?", "ko-mahn ta-pell TEW", "What's your name? — familiar, inverted"]], "note": "Three ways to ask the same question, in rising order of formality: <strong>intonation</strong> (Tu t'appelles comment ?), <strong>question word first</strong> (Comment tu t'appelles ?), and <strong>inversion</strong> (Comment t'appelles-tu ?). All three appear here for both <em>tu</em> and <em>vous</em>."}, {"name": "Page 17 — Point Culture : prénoms et noms", "items": [["Point Culture — Prénoms et noms", "pray-NOHN ay NOHN", "First names and surnames"], ["A. Connaissez-vous les prénoms français ?", "ko-nay-say VOO lay pray-NOHN frahn-SAY", "Do you know French first names?"], ["Découvrez quelques prénoms classiques :", "day-koo-VRAY kel-kuh pray-NOHN kla-SEEK", "Discover some classic first names:"], ["Masculins : Louis, Paul, Pierre, Jean, Alexandre, François, Olivier, Antoine…", "loo-EE, POL, pee-AIR, ZHAHN, a-lek-SAHN-druh, frahn-SWAH, o-lee-vee-AY, ahn-TWAHN", "Classic male names"], ["Féminins : Marie, Anne, Jeanne, Louise, Marianne, Alice, Mathilde, Claire…", "ma-REE, ANN, ZHAN, loo-EEZ, ma-ree-ANN, a-LEESS, ma-TEELD, KLAIR", "Classic female names"], ["Et quelques prénoms actuels :", "ay kel-kuh pray-NOHN ak-tew-ELL", "And some current first names:"], ["Masculins : Enzo, Lucas, Hugo, Théo, Clément, Léo, Tom, Maxime, Raphaël…", "ahn-ZO, lew-KAH, ew-GO, tay-O, klay-MAHN, lay-O, TOM, mak-SEEM, ra-fa-ELL", "Current male names"], ["Féminins : Léa, Emma, Manon, Camille, Clara, Chloé, Anaïs, Océane, Romane…", "lay-AH, em-MAH, ma-NOHN, ka-MEE, kla-RAH, klo-AY, a-na-EESS, o-say-AN, ro-MAN", "Current female names"], ["Quels prénoms français aimez-vous ?", "kel pray-NOHN frahn-SAY ay-may VOO", "Which French first names do you like?"], ["B. Connaissez-vous les noms de famille français ?", "… lay nohn duh fa-MEE", "Do you know French surnames?"], ["Découvrez le palmarès des noms de famille français. Écoutez et écrivez les noms.", "day-koo-VRAY luh pal-ma-RESS", "Discover the ranking of French surnames. Listen and write them."], ["Quels autres noms de famille français connaissez-vous ?", "kel ZO-truh nohn duh fa-MEE", "What other French surnames do you know?"]], "note": "The audio (piste 9) gives the ten commonest French surnames. Only the first is printed: <strong>1. Martin</strong>. The rest are blanked to their initial — <strong>2. B_____ · 3. T_____ · 4. P____ · 5. R____ · 6. R______ · 7. D_____ · 8. D_____ · 9. M_____ · 10. L______</strong> — and are filled in from the recording. The photo is a sepia family portrait from the 1930s."}, {"name": "Page 17 — Dire quelle langue on parle", "items": [["Dire quelle langue on parle", "deer kel lahng ohn PARL", "Saying which language you speak"], ["Journée européenne des langues — Cocktail international — INVITATION", "ko-KTEL an-tair-na-see-o-NAL", "European Day of Languages — International cocktail — Invitation"], ["Activité 10 : Observez l'invitation au cocktail. Associez les mots et les langues.", "ob-sair-VAY lan-vee-ta-see-OHN oh ko-KTEL", "Look at the cocktail invitation. Match the words to the languages."], ["Activité 11 : Échangez. Vous parlez quelle(s) langue(s) ?", "ay-shahn-ZHAY. voo par-LAY kel LAHNG", "Talk together. Which language(s) do you speak?"], ["Je parle… Et toi ?", "zhuh PARL… ay TWAH", "I speak… And you?"]], "note": "The invitation says <em>welcome</em> in eight languages, each numbered. The completed table: <strong>français 1</strong> (Bienvenue) · <strong>espagnol 4</strong> (Bienvenido) · <strong>russe 3</strong> (Добро пожаловать) · <strong>anglais 5</strong> (Welcome) · <strong>chinois 8</strong> (欢迎) · <strong>vietnamien 6</strong> (Hân hạnh đón chào quý khách) · <strong>thaï 7</strong> (ยินดีต้อนรับ) · <strong>arabe 2</strong> (أهلا وسهلا بك)."}, {"name": "Page 18 — la liste des participants au cocktail", "items": [["Liste des participants", "leest day par-tee-see-PAHN", "List of participants"], ["Alexandra Rainer — grecque", "a-lek-SAHN-drah ray-NAIR — GREK", "Greek (f)"], ["Bjorn Lindgren — suédois", "bee-YORN — sway-DWAH", "Swedish (m)"], ["Isabelle Moreau — française", "ee-za-BELL mo-RO — frahn-SEZ", "French (f)"], ["Jee-Woon Park — coréen", "— ko-ray-AN", "Korean (m)"], ["José Gomes — portugais", "zho-ZAY gom — por-tew-GAY", "Portuguese (m)"], ["Karl Rainer — allemand", "karl ray-NAIR — al-MAHN", "German (m)"], ["Michal Kieczlovski — polonais", "— po-lo-NAY", "Polish (m)"], ["Natacha Muller — autrichienne", "na-ta-SHAH mew-LAIR — oh-tree-shee-EN", "Austrian (f)"], ["Pablo Dominguez — espagnol", "— es-pan-YOL", "Spanish (m)"], ["Paul Bouchard — canadien", "pol boo-SHAR — ka-na-dee-AN", "Canadian (m)"], ["Pierre Martin — français", "pee-AIR mar-TAN — frahn-SAY", "French (m)"], ["Saïd Chaibi — marocain", "sa-EED — ma-ro-KAN", "Moroccan (m)"], ["Serguei Ivanov — russe", "— REWSS", "Russian (m)"], ["Sofia Dmitrieva — russe", "so-fee-AH — REWSS", "Russian (f)"], ["Sofia Gonzalez — mexicaine", "so-fee-AH — mek-see-KEN", "Mexican (f)"], ["Tom Baker — américain", "— a-may-ree-KAN", "American (m)"], ["Wei Wang — chinoise", "— shee-NWAHZ", "Chinese (f)"]], "note": "Seventeen guests. Note that the nationality is written in the <strong>gender of the person</strong> — <em>grecque</em> and <em>autrichienne</em> for women, <em>suédois</em> and <em>allemand</em> for men. Two guests share the first name <strong>Sofia</strong>, which is what dialogue 1 turns on.", "cols": "two"}, {"name": "Page 18 — activités 12 et 13", "items": [["Faire connaissance, dire la nationalité", "fair ko-nay-SAHNSS, deer lah na-see-o-na-lee-TAY", "Getting acquainted, saying your nationality"], ["Activité 12 : Regardez ci-dessus la liste des participants au cocktail.", "ruh-gar-DAY see-duh-SEW lah LEEST", "Look at the list of cocktail guests above."], ["Puis observez les dessins et écoutez les dialogues.", "pwee zob-sair-VAY lay day-SAN", "Then look at the drawings and listen to the dialogues."], ["1. Trouvez les personnes sur la liste.", "troo-VAY lay pair-SUN sewr lah LEEST", "Find the people on the list."], ["2. Associez les dialogues aux dessins.", "a-so-see-AY lay dee-a-LOG oh day-SAN", "Match the dialogues to the drawings."], ["Activité 13 : Réécoutez les dialogues.", "ray-ay-koo-TAY", "Listen to the dialogues again."], ["Identifiez sur les dessins quelles personnes disent les phrases suivantes.", "ee-dahn-tee-fee-AY … kel pair-SUN DEEZ lay frahz swee-VAHNT", "Identify on the drawings who says the following sentences."], ["1. Vous vous appelez Sofia ? Moi aussi !", "voo voo za-play so-fee-AH ? mwah oh-SEE", "Your name is Sofia? Mine too!"], ["2. Je me présente : José Gomes.", "zhuh muh pray-ZAHNT", "Let me introduce myself: José Gomes."], ["3. Je m'appelle Paul Bouchard.", "zhuh ma-PELL pol boo-SHAR", "My name is Paul Bouchard."], ["4. Voici Isabelle Moreau. Elle est française.", "vwa-SEE ee-za-BELL mo-RO. el ay frahn-SEZ", "This is Isabelle Moreau. She's French."], ["5. Il s'appelle Karl Rainer.", "eel sa-PELL karl ray-NAIR", "His name is Karl Rainer."], ["6. Qui est-ce ?", "kee ESS", "Who is it?"], ["7. Natacha Muller, je suis autrichienne.", "na-ta-SHAH mew-LAIR, zhuh swee zoh-tree-shee-EN", "Natacha Muller, I'm Austrian."], ["8. Moi, je suis mexicaine.", "mwah, zhuh swee mek-see-KEN", "Me, I'm Mexican."]], "note": "Four drawings (a, b, c, d) show guests mingling at the cocktail with empty speech bubbles for you to fill. The eight sentences cover the four moves of meeting someone: <strong>introducing yourself</strong> (2, 3, 7), <strong>introducing a third person</strong> (4, 5), <strong>asking who someone is</strong> (6), and <strong>finding something in common</strong> (1, 8)."}, {"name": "Page 19 — Point Langue : les adjectifs de nationalité", "items": [["Les adjectifs de nationalité", "lay zad-zhek-TEEF duh na-see-o-na-lee-TAY", "Nationality adjectives"], ["a) Observez le tableau. Complétez la colonne Féminin.", "ob-sair-VAY luh ta-BLO. kohm-play-TAY lah ko-LUN fay-mee-NAN", "Look at the table. Complete the Feminine column."], ["français – française  (-ais → + -e)", "frahn-SAY – frahn-SEZ", "prononciation DIFFÉRENTE"], ["portugais – portugaise", "por-tew-GAY – por-tew-GEZ", "prononciation différente"], ["suédois – suédoise  (-ois → + -e)", "sway-DWAH – sway-DWAHZ", "prononciation différente"], ["chinois – chinoise", "shee-NWAH – shee-NWAHZ", "prononciation différente"], ["mexicain – mexicaine  (-ain → + -e)", "mek-see-KAN – mek-see-KEN", "prononciation différente"], ["américain – américaine", "a-may-ree-KAN – a-may-ree-KEN", "prononciation différente"], ["autrichien – autrichienne  (-ien → + -ne)", "oh-tree-shee-AN – oh-tree-shee-EN", "prononciation différente"], ["canadien – canadienne", "ka-na-dee-AN – ka-na-dee-EN", "prononciation différente"], ["coréen – coréenne  (-éen → + -ne)", "ko-ray-AN – ko-ray-EN", "prononciation différente"], ["allemand – allemande  (-and → + -e)", "al-MAHN – al-MAHND", "prononciation différente"], ["espagnol – espagnole  (-ol → + -e)", "es-pan-YOL – es-pan-YOL", "prononciation IDENTIQUE"], ["russe – russe  (-e → + rien)", "REWSS – REWSS", "prononciation identique"], ["Attention ! grec – grecque ; turc – turque", "GREK – GREK ; TEURK – TEURK", "irregular spellings, identical sound"], ["b) Prononciation identique ou différente pour le masculin et le féminin ? Écoutez et répondez.", "… ee-dahn-TEEK oo dee-fay-RAHNT", "Same or different pronunciation? Listen and answer."]], "note": "The pattern that decides everything: if the masculine ends in a <strong>silent consonant</strong>, adding <em>-e</em> wakes that consonant up and the two <strong>sound different</strong>. If the masculine already ends in a <strong>vowel sound</strong> (espagnol, russe), nothing changes and they <strong>sound identical</strong>.", "cols": "two"}, {"name": "Page 19 — Point Langue : se présenter, présenter quelqu'un", "items": [["Complétez avec s'appelle, est, êtes, m'appelle, suis ou t'appelles.", "kohm-play-TAY a-vek", "Complete with the right form."], ["S'appeler — indicatif présent", "sa-play", "To be called — present tense"], ["Je m'appelle Paul.", "zhuh ma-PELL pol", "My name is Paul."], ["Tu t'appelles comment ?", "tew ta-PELL ko-MAHN", "What's your name?"], ["Il s'appelle Karl Rainer.", "eel sa-PELL", "His name is Karl Rainer."], ["Elle s'appelle Isabelle.", "el sa-PELL", "Her name is Isabelle."], ["Nous nous appelons Pablo et Alexandra.", "noo noo za-play-OHN", "Our names are Pablo and Alexandra."], ["Vous vous appelez Sofia.", "voo voo za-play-AY", "Your name is Sofia."], ["Ils s'appellent M. et Mme Johnson.", "eel sa-PELL", "Their names are Mr and Mrs Johnson."], ["Elles s'appellent Alexandra et Barbara.", "el sa-PELL", "Their names are Alexandra and Barbara."], ["Être — indicatif présent", "EH-truh", "To be — present tense"], ["Je suis canadien.", "zhuh swee ka-na-dee-AN", "I'm Canadian."], ["Tu es belge.", "tew ay BELZH", "You're Belgian."], ["Il est allemand ?", "eel ay tal-MAHN", "Is he German?"], ["Elle est française.", "el ay frahn-SEZ", "She's French."], ["Nous sommes espagnols.", "noo som zes-pan-YOL", "We're Spanish."], ["Vous êtes russe ?", "voo ZET REWSS", "Are you Russian?"], ["Ils sont canadiens.", "eel sohn ka-na-dee-AN", "They're Canadian."], ["Elles sont espagnoles.", "el sohn tes-pan-YOL", "They're Spanish."]], "cols": "two"}, {"name": "Page 19 — activités 14 et 15", "items": [["Activité 14 Phonétique a) Écoutez.", "ay-koo-TAY", "Listen."], ["b) Lisez les phrases suivantes à voix haute.", "lee-ZAY lay frahz swee-VAHNT a vwah OT", "Read the following sentences aloud."], ["1. Clara, c'est italien.", "kla-RAH, set ee-tal-YAN", "Clara — that's Italian."], ["2. Ivan, c'est russe.", "ee-VAHN, say REWSS", "Ivan — that's Russian."], ["3. Yoko, c'est japonais.", "yo-KO, say zha-po-NAY", "Yoko — that's Japanese."], ["4. Bernardo, c'est espagnol.", "bair-nar-DO, say tes-pan-YOL", "Bernardo — that's Spanish."], ["5. Olof, c'est suédois.", "o-LOF, say sway-DWAH", "Olof — that's Swedish."], ["c) Trouvez la fin des prénoms et prononcez-les.", "troo-VAY lah fan day pray-NOHN", "Find the ends of the first names and say them."], ["So + fia = Sofia", "so-FEE-ah", "the pairs to join up"], ["Jo + sé = José", "zho-ZAY", "the pairs to join up"], ["Mi + chal = Michal", "mee-SHAL", "the pairs to join up"], ["Pa + blo = Pablo", "pa-BLO", "the pairs to join up"], ["Activité 15 : Jouez la scène. Vous êtes au cocktail international. Vous faites connaissance avec les personnes.", "zhoo-AY lah SEN", "Act out the scene. You're at the international cocktail party, getting to know people."]], "note": "Part c) is a joining exercise: the four beginnings <em>So · Jo · Mi · Pa</em> pair with the four endings <em>chal · blo · fia · sé</em> to make the guests' names from page 18."}, {"name": "Page 20 — Connaître les noms de pays", "items": [["Connaître les noms de pays", "ko-NET-ruh lay nohn duh pay-EE", "Knowing the names of countries"], ["Activité 16 a) Regardez la liste des participants au cocktail p. 18 et identifiez les pays représentés.", "… ee-dahn-tee-fee-AY lay pay-EE ruh-pray-zahn-TAY", "Look at the guest list and identify the countries represented."], ["l'Allemagne", "lal-MAHN-yuh", "Germany"], ["la Pologne", "lah po-LON-yuh", "Poland"], ["le Canada", "luh ka-na-DAH", "Canada"], ["le Maroc", "luh ma-ROK", "Morocco"], ["la Chine", "lah SHEEN", "China"], ["le Danemark", "luh dan-MARK", "Denmark"], ["l'Espagne", "les-PAN-yuh", "Spain"], ["la France", "lah FRAHNSS", "France"], ["les États-Unis", "lay zay-ta-zew-NEE", "the United States"], ["la Grèce", "lah GRESS", "Greece"], ["l'Italie", "lee-ta-LEE", "Italy"], ["le Portugal", "luh por-tew-GAL", "Portugal"], ["l'Iran", "lee-RAHN", "Iran"], ["le Japon", "luh zha-POHN", "Japan"], ["les Philippines", "lay fee-lee-PEEN", "the Philippines"], ["la Russie", "lah rew-SEE", "Russia"], ["la Suède", "lah sew-ED", "Sweden"], ["la Tunisie", "lah tew-nee-ZEE", "Tunisia"], ["le Mexique", "luh mek-SEEK", "Mexico"], ["la Corée", "lah ko-RAY", "Korea"], ["l'Autriche", "loh-TREESH", "Austria"], ["b) Dites quels continents sont représentés.", "deet kel kohn-tee-NAHN", "Say which continents are represented."], ["l'Afrique", "la-FREEK", "Africa"], ["l'Amérique", "la-may-REEK", "America"], ["l'Asie", "la-ZEE", "Asia"], ["l'Europe", "luh-ROP", "Europe"], ["l'Océanie", "lo-say-a-NEE", "Oceania"]], "note": "Twenty-one countries, drawn from the seventeen guests. The continents actually represented on that list are <strong>l'Europe, l'Amérique, l'Asie and l'Afrique</strong> — nobody comes from Oceania.", "cols": "two"}, {"name": "Page 20 — Point Langue : les articles définis et le genre des pays", "items": [["Les articles définis — Complétez avec le, la, l' ou les.", "lay zar-TEE-kluh day-fee-NEE", "The definite articles"], ["Masculin singulier : le Canada, le Japon, l'Iran", "luh ka-na-DAH, luh zha-POHN, lee-RAHN", "masculine singular"], ["Féminin singulier : la Chine, la France, l'Espagne", "lah SHEEN, lah FRAHNSS, les-PAN-yuh", "feminine singular"], ["Pluriel : les États-Unis, les Philippines", "lay zay-ta-zew-NEE, lay fee-lee-PEEN", "plural"], ["Le genre des noms de pays — Observez puis complétez la règle.", "luh ZHAHN-ruh day nohn duh pay-EE", "The gender of country names"], ["la Chine · la Grèce · la France · la Russie · l'Italie", "…", "feminine examples"], ["le Canada · le Danemark · le Japon · le Portugal · l'Iran", "…", "masculine examples"], ["les États-Unis · les Philippines", "…", "plural examples"], ["Les noms de pays qui se terminent par la lettre E sont féminins.", "… par lah let UH sohn fay-mee-NAN", "Countries ending in -e are feminine."], ["Les noms de pays qui se terminent par la lettre S sont pluriels.", "… sohn plew-ree-ELL", "Countries ending in -s are plural."], ["Exceptions : le Mexique, le Cambodge, le Zimbabwe, le Mozambique.", "ek-sep-see-OHN", "Four countries end in -e but are masculine."]], "note": "The rule to fill in: <strong>-e → féminin</strong>, <strong>-s → pluriel</strong>, everything else masculine — with those four exceptions. A world map on the page colours the continents."}, {"name": "Page 20 — activité 17 et les nombres 1–20", "items": [["Activité 17 : En petits groupes, trouvez des pays où les personnes parlent les langues suivantes.", "ahn puh-TEE GROOP, troo-VAY day pay-EE", "In small groups, find countries where these languages are spoken."], ["1. le portugais → le Portugal, le Brésil, l'Angola…", "luh por-tew-GAY", "Portuguese"], ["2. l'espagnol → l'Espagne, le Mexique, l'Argentine…", "les-pan-YOL", "Spanish"], ["3. l'anglais → le Royaume-Uni, les États-Unis, l'Australie…", "lahn-GLAY", "English"], ["4. le français → la France, le Canada, la Belgique, la Suisse, le Sénégal…", "luh frahn-SAY", "French"], ["5. l'arabe → le Maroc, la Tunisie, l'Égypte…", "la-RAHB", "Arabic"], ["6. l'allemand → l'Allemagne, l'Autriche, la Suisse…", "lal-MAHN", "German"], ["Identifier un nombre, compter", "ee-dahn-tee-fee-AY uhn NOHM-bruh, kohn-TAY", "Identifying a number, counting"], ["Activité 18 : Il y a combien de places ? Lisez les nombres, écoutez et répondez.", "eel ya kohm-bee-AN duh PLAHSS", "How many seats are there? Read the numbers, listen and answer."], ["1 un", "UHN", "one"], ["2 deux", "DUH", "two"], ["3 trois", "TWAH", "three"], ["4 quatre", "KAT-ruh", "four"], ["5 cinq", "SANK", "five"], ["6 six", "SEESS", "six"], ["7 sept", "SET", "seven"], ["8 huit", "WEET", "eight"], ["9 neuf", "NUHF", "nine"], ["10 dix", "DEESS", "ten"], ["11 onze", "ONZ", "eleven"], ["12 douze", "DOOZ", "twelve"], ["13 treize", "TREZ", "thirteen"], ["14 quatorze", "ka-TORZ", "fourteen"], ["15 quinze", "KANZ", "fifteen"], ["16 seize", "SEZ", "sixteen"], ["17 dix-sept", "dee-SET", "seventeen"], ["18 dix-huit", "dee-ZWEET", "eighteen"], ["19 dix-neuf", "deez-NUHF", "nineteen"], ["20 vingt", "VAN", "twenty"]], "note": "The drawing shows a crowd queuing outside <strong>HALL 1</strong> and <strong>SALLE 3</strong> — the recording tells you how many seats each room holds.", "cols": "three"}, {"name": "Page 21 — le tableau des nombres 0 à 69", "items": [["0 zéro", "zay-RO", "nought"], ["10 dix", "DEESS", "ten"], ["20 vingt", "VAN", "twenty"], ["30 trente", "TRAHNT", "thirty"], ["40 quarante", "ka-RAHNT", "forty"], ["50 cinquante", "san-KAHNT", "fifty"], ["60 soixante", "swa-SAHNT", "sixty"], ["21 vingt et un", "van-tay-UHN", "twenty-one — with et"], ["22 vingt-deux", "van-DUH", "twenty-two — with a hyphen"], ["31 trente et un", "trahn-tay-UHN", "thirty-one"], ["33 trente-trois", "trahnt-TWAH", "thirty-three"], ["41 quarante et un", "ka-rahn-tay-UHN", "forty-one"], ["44 quarante-quatre", "ka-rahnt-KAT-ruh", "forty-four"], ["51 cinquante et un", "san-kahn-tay-UHN", "fifty-one"], ["56 cinquante-six", "san-kahnt-SEESS", "fifty-six"], ["61 soixante et un", "swa-sahn-tay-UHN", "sixty-one"], ["69 soixante-neuf", "swa-sahnt-NUHF", "sixty-nine"]], "note": "The table runs 0–69 in seven columns. In the book the round tens and the -1 forms are printed in <strong>green</strong> (simple numbers) and the rest in <strong>red</strong> (compound numbers) — that colour coding is what activity 19 asks about.", "cols": "two"}, {"name": "Page 21 — activités 19, 20 et 21", "items": [["Activité 19 a) Observez le tableau et répondez.", "ob-sair-VAY luh ta-BLO", "Look at the table and answer."], ["1. Les nombres en vert sont simples ou composés ? → simples", "SAN-pluh", "The green numbers are simple."], ["2. Les nombres en rouge sont simples ou composés ? → composés", "kohm-po-ZAY", "The red numbers are compound."], ["b) Complétez avec et ou -.", "kohm-play-TAY a-vek ay oo tee-RAY", "Complete with et or a hyphen."], ["a. vingt et un", "van-tay-UHN", "21 — et"], ["b. vingt-deux", "van-DUH", "22 — hyphen"], ["c. trente et un", "trahn-tay-UHN", "31 — et"], ["d. cinquante-neuf", "san-kahnt-NUHF", "59 — hyphen"], ["e. trente-quatre", "trahnt-KAT-ruh", "34 — hyphen"], ["f. quarante et un", "ka-rahn-tay-UHN", "41 — et"], ["g. soixante et un", "swa-sahn-tay-UHN", "61 — et"], ["c) Écoutez pour vérifier.", "ay-koo-TAY poor vay-ree-fee-AY", "Listen to check."], ["d) Par deux, regardez le tableau et comptez de 23 à 35.", "par DUH … kohn-TAY", "In pairs, count from 23 to 35."], ["e) Complétez le tableau.", "kohm-play-TAY luh ta-BLO", "Fill in the table."], ["Activité 20 a) Écoutez et choisissez le nombre entendu.", "… shwa-zee-SAY luh NOHM-bruh ahn-TAHN-dew", "Listen and choose the number you hear."], ["a. 5 – 15 – 50", "sank / kanz / san-KAHNT", "the three-way traps"], ["b. 3 – 13 – 30", "twah / trez / TRAHNT", "…"], ["c. 7 – 17 – 27", "set / dee-SET / van-SET", "…"], ["d. 4 – 14 – 40", "katr / ka-TORZ / ka-RAHNT", "…"], ["e. 2 – 12 – 20", "duh / dooz / VAN", "…"], ["f. 6 – 16 – 60", "seess / sez / swa-SAHNT", "…"], ["g. 18 – 28 – 38", "dee-ZWEET / van-TWEET / trahnt-WEET", "…"], ["h. 11 – 21 – 31", "onz / van-tay-UHN / trahn-tay-UHN", "…"], ["b) Par deux, dites les nombres.", "par duh, deet lay NOHM-bruh", "In pairs, say the numbers."], ["Activité 21 : Écoutez et complétez la liste des stands de la Journée européenne des langues.", "… lah leest day STAHND", "Listen and complete the list of stands."], ["Exemple : Grèce → stand D15", "GRESS", "Greece → stand D15"], ["1. Pologne · 2. Espagne · 3. États-Unis · 4. Chine · 5. Autriche", "…", "stands 1–5"], ["6. Suède · 7. Japon · 8. Russie · 9. Canada · 10. Mexique", "…", "stands 6–10"]], "note": "Activity 20 drills the single hardest listening distinction for a beginner: <strong>5 / 15 / 50</strong> and its siblings. The photo shows a giant floor plan of the language fair with numbered stands."}, {"name": "Page 22 — D'un mot à l'autre : les mots internationaux", "items": [["D'un mot à l'autre…", "duhn mo a LO-truh", "From one word to another…"], ["Activité 1 : Observez ces mots français.", "ob-sair-VAY say mo frahn-SAY", "Look at these French words."], ["téléphone", "tay-lay-FON", "telephone"], ["film", "FEELM", "film"], ["hôtel", "o-TELL", "hotel"], ["liberté", "lee-bair-TAY", "liberty"], ["démocratie", "day-mo-kra-SEE", "democracy"], ["cliché", "klee-SHAY", "cliché"], ["philosophie", "fee-lo-zo-FEE", "philosophy"], ["musique", "mew-ZEEK", "music"], ["chocolat", "sho-ko-LAH", "chocolate"], ["architecture", "ar-shee-tek-TEWR", "architecture"], ["café", "ka-FAY", "coffee, café"], ["photographie", "fo-to-gra-FEE", "photography"], ["révolution", "ray-vo-lew-see-OHN", "revolution"], ["monument", "mo-new-MAHN", "monument"], ["international", "an-tair-na-see-o-NAL", "international"], ["appartement", "a-par-tuh-MAHN", "apartment"], ["océan", "o-say-AHN", "ocean"], ["1. Identifiez les mots qui sont identiques dans votre langue.", "ee-dahn-tee-fee-AY lay MO", "Identify the words that are the same in your language."], ["2. Citez des mots français qui existent dans votre langue.", "see-TAY day mo frahn-SAY", "Name French words that exist in your language."], ["3. Citez des mots français que vous aimez.", "… kuh voo zay-MAY", "Name French words you like."], ["Activité 2 : Écoutez les extraits et dites quels mots vous identifiez.", "ay-koo-TAY lay zeks-TRAH", "Listen to the extracts and say which words you recognise."]], "cols": "two"}, {"name": "Page 22 — les personnalités françaises", "items": [["Activité 3 : Quelles personnalités françaises connaissez-vous (littérature, mode, sport, cinéma, etc.) ?", "kel pair-so-na-lee-TAY frahn-SEZ", "Which French personalities do you know?"], ["En petits groupes, faites une liste. Comparez vos listes.", "ahn puh-TEE GROOP, fet ewn LEEST", "In small groups, make a list. Compare."], ["Activité 4 : Connaissez-vous les prénoms des personnalités suivantes ?", "ko-nay-say VOO lay pray-NOHN", "Do you know these people's first names?"], ["Exemple : A_______e Dumas = Alexandre Dumas", "a-lek-SAHN-druh dew-MAH", "the worked example"], ["Littérature : M_____l Proust = Marcel Proust", "mar-SELL PROOST", "Literature"], ["A_____t Camus = Albert Camus", "al-BAIR ka-MEW", "Literature"], ["S____e de Beauvoir = Simone de Beauvoir", "see-MUN duh bo-VWAHR", "Literature"], ["V____r Hugo = Victor Hugo", "veek-TOR ew-GO", "Literature — his portrait is on the page"], ["Mode : C________n Dior = Christian Dior", "krees-tee-AHN dee-OR", "Fashion"], ["G________e Chanel = Gabrielle Chanel", "ga-bree-ELL sha-NELL", "Fashion"], ["Y__s Saint Laurent = Yves Saint Laurent", "EEV san lo-RAHN", "Fashion"], ["J__n-P___l Gaultier = Jean-Paul Gaultier", "zhahn-pol go-tee-AY", "Fashion — his photo is on the page"], ["Sport : D___d Douillet (judo) = David Douillet", "da-VEED doo-YAY", "Sport"], ["M____l Platini (football) = Michel Platini", "mee-SHELL pla-tee-NEE", "Sport"], ["Z______e Zidane (football) = Zinédine Zidane", "zee-nay-DEEN zee-DAN", "Sport — his photo is on the page"], ["T__y Parker (basket-ball) = Tony Parker", "to-NEE par-KAIR", "Sport"], ["Cinéma : J______e Binoche = Juliette Binoche", "zhew-lee-ETT bee-NOSH", "Cinema — her photo is on the page"], ["A___n Delon = Alain Delon", "a-LAN duh-LOHN", "Cinema"], ["G_____d Depardieu = Gérard Depardieu", "zhay-RAR duh-par-dee-UH", "Cinema"], ["M____n Cotillard = Marion Cotillard", "ma-ree-OHN ko-tee-YAR", "Cinema"]], "cols": "two"}, {"name": "Page 22 — le message secret", "items": [["Activité 5 : Message secret.", "muh-SAHZH suh-KRAY", "Secret message."], ["a) Par deux, observez le code suivant. Puis écoutez le message codé et identifiez le mot.", "… luh kod swee-VAHN", "In pairs, look at the code. Then listen to the coded message and identify the word."], ["Exemple : 4 – 40 – 37 – 25 – 40 – 56 – 51 → bonjour", "bohn-ZHOOR", "the worked example"], ["A2 · B4 · C6 · D9 · E12 · F15 · G16 · H19 · I22 · J25 · K28 · L31 · M33", "…", "first half of the code"], ["N37 · O40 · P42 · Q49 · R51 · S53 · T55 · U56 · V58 · W60 · X62 · Y65 · Z69", "…", "second half of the code"], ["b) Par deux, écrivez deux mots français avec le code.", "ay-kree-VAY duh mo frahn-SAY", "In pairs, write two French words in the code."], ["Dites les messages codés, le groupe identifie les mots.", "deet lay muh-SAHZH ko-DAY", "Say the coded messages; the group identifies the words."]], "note": "Check the example against the table: 4=B, 40=O, 37=N, 25=J, 40=O, 56=U, 51=R → <strong>BONJOUR</strong>. The numbers are not sequential — they jump by 2 or 3 — so you have to read the grid rather than count."}, {"name": "Page 23 — La communication en classe", "items": [["La communication en classe", "lah ko-mew-nee-ka-see-OHN ahn KLAHSS", "Classroom language"], ["Activité 1 : Écoutez et dites où ces phrases sont prononcées.", "… oo say frahz sohn pro-nohn-SAY", "Listen and say where these sentences are spoken."], ["Activité 2 : Lisez et dites, pour chaque phrase, qui parle.", "… kee PARL", "Read and say who speaks each sentence."], ["le professeur", "luh pro-fay-SUR", "the teacher"], ["l'étudiant", "lay-tew-dee-AHN", "the student"], ["1. Écoutez le dialogue.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue. — professeur"], ["2. Répétez, s'il vous plaît.", "ray-pay-TAY, seel voo PLAY", "Repeat, please. — professeur"], ["3. Regardez la photo.", "ruh-gar-DAY lah fo-TO", "Look at the photo. — professeur"], ["4. Quelle est la différence entre tu et vous ?", "kel ay lah dee-fay-RAHNSS AHN-truh tew ay VOO", "What's the difference between tu and vous? — étudiant"], ["5. Écrivez la réponse.", "ay-kree-VAY lah ray-POHNSS", "Write the answer. — professeur"], ["6. Répétez la phrase.", "ray-pay-TAY lah FRAZ", "Repeat the sentence. — professeur"], ["7. Cochez la bonne réponse.", "ko-SHAY lah bun ray-POHNSS", "Tick the right answer. — professeur"], ["8. Soulignez les questions.", "soo-leen-YAY lay kes-tee-OHN", "Underline the questions. — professeur"], ["9. Comment ça se prononce ?", "ko-mahn sa suh pro-NONSS", "How is that pronounced? — étudiant"], ["10. Parlez plus fort !", "par-LAY plew FOR", "Speak louder! — either"], ["11. Ouvrez le livre.", "oo-VRAY luh LEE-vruh", "Open the book. — professeur"], ["12. Comment on dit house en français ?", "ko-mahn ohn dee … ahn frahn-SAY", "How do you say 'house' in French? — étudiant"], ["13. Fermez votre livre.", "fair-MAY VOT-ruh LEE-vruh", "Close your book. — professeur"], ["14. Comment ça s'écrit ?", "ko-mahn sa say-KREE", "How is that written? — étudiant"], ["15. Travaillez en groupe.", "tra-va-YAY ahn GROOP", "Work in groups. — professeur"], ["16. Travaillez par deux.", "tra-va-YAY par DUH", "Work in pairs. — professeur"], ["17. Je ne comprends pas.", "zhuh nuh kohm-PRAHN pah", "I don't understand. — étudiant"], ["18. Je ne sais pas.", "zhuh nuh say PAH", "I don't know. — étudiant"], ["19. C'est à quelle page ?", "set a kel PAHZH", "What page is it on? — étudiant"], ["Aide-mémoire — Les articles définis", "lay zar-TEE-kluh day-fee-NEE", "The definite articles"], ["le professeur, le livre", "luh pro-fay-SUR, luh LEE-vruh", "masculine"], ["la photo, la réponse", "lah fo-TO, lah ray-POHNSS", "feminine"], ["l'étudiant, l'étudiante", "lay-tew-dee-AHN, lay-tew-dee-AHNT", "before a vowel"], ["les étudiants, les réponses", "lay zay-tew-dee-AHN, lay ray-POHNSS", "plural"]], "note": "The dividing line: the teacher gives <strong>instructions in the imperative</strong> (écoutez, regardez, ouvrez, fermez, travaillez), the student <strong>asks questions or admits difficulty</strong> (comment… ?, je ne comprends pas, je ne sais pas). Only <em>Parlez plus fort !</em> could come from either."}, {"name": "Page 24 — S'exercer : les corrigés", "items": [["Ex. 1 — Identifiez et épelez les prénoms.", "ee-dahn-tee-fee-AY ay ay-play", "Identify and spell the first names."], ["1. féminin : R_M__E → Rose / Rosie", "ROZ", "the pattern R_M__E"], ["2. masculin : A__X____E → Alexandre", "a-lek-SAHN-druh", "A__X____E"], ["3. masculin : L_C_S → Lucas", "lew-KAH", "L_C_S"], ["4. féminin : M___A__E → Marianne", "ma-ree-ANN", "M___A__E"], ["5. masculin : O_I___R → Olivier", "o-lee-vee-AY", "O_I___R"], ["6. masculin : R__H__L → Raphaël", "ra-fa-ELL", "R__H__L"], ["7. féminin : E_M_ → Emma", "em-MAH", "E_M_"], ["8. masculin : M_X__E → Maxime", "mak-SEEM", "M_X__E"], ["Ex. 2 — Associez les questions et les réponses.", "a-so-see-AY", "Match the questions and answers."], ["1. Votre prénom, s'il vous plaît ? → b. Je m'appelle Karine.", "… zhuh ma-PELL ka-REEN", "1 → b"], ["2. Épelez, s'il vous plaît. → d. K-A-R-I-N-E.", "ay-play, seel voo PLAY", "2 → d"], ["3. Votre nationalité ? → f. Je suis autrichienne.", "… zhuh swee zoh-tree-shee-EN", "3 → f"], ["4. Vous parlez anglais ? → c. Oui, anglais, allemand et français.", "voo par-LAY ahn-GLAY", "4 → c"], ["5. Votre collègue est autrichienne, aussi ? → a. Non, elle est allemande.", "VOT-ruh ko-LEG", "5 → a"], ["6. Elle s'appelle comment ? → e. Elle s'appelle Ursula.", "el sa-PELL ko-MAHN", "6 → e"], ["Ex. 3 — Complétez la liste de nationalités.", "kohm-play-TAY lah leest", "Complete the nationality list."], ["M. Fabert français → Mlle Toussaint française", "frahn-SAY / frahn-SEZ", "given example"], ["M. Kangulu camerounais → Mme Kangulu camerounaise", "ka-muh-roo-NAY / ka-muh-roo-NEZ", "Cameroonian"], ["M. Bergman suédois → Mme Solderberg suédoise", "sway-DWAH / sway-DWAHZ", "Swedish"], ["M. Johnson américain → Mme Johnson américaine", "a-may-ree-KAN / a-may-ree-KEN", "American"], ["M. Wong chinois → Mlle Lee Ming chinoise", "shee-NWAH / shee-NWAHZ", "Chinese"], ["M. Tremblay canadien → Mlle Trace canadienne", "ka-na-dee-AN / ka-na-dee-EN", "Canadian"], ["M. Carrera espagnol → Mlle Del Rio espagnole", "es-pan-YOL", "Spanish"], ["M. Martins portugais → Mme Mendes portugaise", "por-tew-GAY / por-tew-GEZ", "Portuguese"], ["M. Lindley australien → Mme Lindley australienne", "os-tra-lee-AN / os-tra-lee-EN", "Australian"], ["M. Ibanez mexicain → Mlle Montes mexicaine", "mek-see-KAN / mek-see-KEN", "Mexican"], ["M. Muller allemand → Mme Muller allemande", "al-MAHN / al-MAHND", "German"], ["M. Costapoulos grec → Mlle Gravas grecque", "GREK", "Greek"], ["M. Chaïbi tunisien → Mme Chaïbi tunisienne", "tew-nee-zee-AN / tew-nee-zee-EN", "Tunisian"], ["M. Volgorof russe → Mme Volgorof russe", "REWSS", "Russian"]], "cols": "two"}, {"name": "Page 24 — S'exercer, exercices 4 à 10", "items": [["Ex. 4 — Donnez les nationalités.", "do-NAY lay na-see-o-na-lee-TAY", "Give the nationalities."], ["Exemple : John F. Kennedy est américain.", "a-may-ree-KAN", "the worked example"], ["1. Leonard de Vinci est italien.", "ee-tal-YAN", "Italian"], ["2. Napoléon est français.", "frahn-SAY", "French"], ["3. Agatha Christie est anglaise.", "ahn-GLEZ", "English"], ["4. Indira Gandhi est indienne.", "an-dee-EN", "Indian"], ["5. Salvador Dalí est espagnol.", "es-pan-YOL", "Spanish"], ["6. Albert Einstein est allemand.", "al-MAHN", "German"], ["Ex. 5 — Associez les éléments pour former des phrases.", "a-so-see-AY lay zay-lay-MAHN", "Match up to make sentences."], ["Je m'appelle Antoine.", "zhuh ma-PELL ahn-TWAHN", "Je + m'appelle"], ["Tu t'appelles Dimitri.", "tew ta-PELL", "Tu + t'appelles"], ["Il est russe.", "eel ay REWSS", "Il + est"], ["Elle s'appelle Anna.", "el sa-PELL", "Elle + s'appelle"], ["Je suis américaine.", "zhuh swee za-may-ree-KEN", "Je + suis"], ["Tu es français.", "tew ay frahn-SAY", "Tu + es"], ["Ex. 6 — Mettez les éléments des phrases dans l'ordre.", "met-TAY lay zay-lay-MAHN dahn LOR-druh", "Put the sentences in order."], ["Exemple → Ils s'appellent Matthias et Birgit, ils sont autrichiens.", "eel sa-PELL … eel sohn toh-tree-shee-AN", "the worked example"], ["1. → Vous êtes polonais ? Vous vous appelez Marek ?", "voo ZET po-lo-NAY", "sentence 1"], ["2. → Elles s'appellent Maria et Dolorès, elles sont espagnoles.", "el sa-PELL … el sohn tes-pan-YOL", "sentence 2"], ["3. → Nous nous appelons Antoine et Léa, nous sommes français.", "noo noo za-play-OHN … noo som frahn-SAY", "sentence 3"], ["Ex. 7 — Pour chaque capitale, dites le nom du pays.", "poor shak ka-pee-TAL", "For each capital, give the country."], ["Paris → la France", "lah FRAHNSS", "the worked example"], ["La Paz → la Bolivie", "lah bo-lee-VEE", "Bolivia"], ["Tokyo → le Japon", "luh zha-POHN", "Japan"], ["Copenhague → le Danemark", "luh dan-MARK", "Denmark"], ["Mexico → le Mexique", "luh mek-SEEK", "Mexico"], ["Dublin → l'Irlande", "leer-LAHND", "Ireland"], ["Washington → les États-Unis", "lay zay-ta-zew-NEE", "the USA"], ["Pékin → la Chine", "lah SHEEN", "China"], ["La Haye → les Pays-Bas", "lay pay-ee-BAH", "the Netherlands"], ["Ottawa → le Canada", "luh ka-na-DAH", "Canada"], ["Addis-Abeba → l'Éthiopie", "lay-tee-o-PEE", "Ethiopia"], ["Ex. 8 — Pour chaque nationalité, dites le nom du pays.", "…", "For each nationality, give the country."], ["chinois → la Chine", "lah SHEEN", "the worked example"], ["grec → la Grèce", "lah GRESS", "Greece"], ["russe → la Russie", "lah rew-SEE", "Russia"], ["portugais → le Portugal", "luh por-tew-GAL", "Portugal"], ["italien → l'Italie", "lee-ta-LEE", "Italy"], ["suédois → la Suède", "lah sew-ED", "Sweden"], ["iranien → l'Iran", "lee-RAHN", "Iran"], ["coréen → la Corée", "lah ko-RAY", "Korea"], ["autrichien → l'Autriche", "loh-TREESH", "Austria"], ["Ex. 9 — Écrivez le résultat en chiffres puis en lettres.", "… ahn SHEE-fruh pwee ahn LET-ruh", "Write the answer in figures then in words."], ["Exemple : 2 × 4 = 8 (huit) — Deux fois quatre égal huit.", "duh fwah katr ay-GAL WEET", "the worked example"], ["1. 3 × 5 = 15 (quinze)", "KANZ", "15"], ["2. 3 × 6 = 18 (dix-huit)", "dee-ZWEET", "18"], ["3. 3 × 7 = 21 (vingt et un)", "van-tay-UHN", "21"], ["4. 4 × 9 = 36 (trente-six)", "trahnt-SEESS", "36"], ["5. 5 × 9 = 45 (quarante-cinq)", "ka a-TEK", "Lesson 2: M for media library"], ["> Demander des informations", "duh-mahn-DAY day zan-for-ma-see-OHN", "Asking for information"], ["> Questionner sur l'identité", "kes-tee-o-NAY sewr lee-dahn-tee-TAY", "Asking about identity"], ["> Comprendre / Dire des coordonnées", "kohm-PRAHN-druh / deer day ko-or-do-NAY", "Understanding / giving contact details"], ["Leçon 3 : En direct de TV5", "ahn dee-REKT duh tay-vay-SANK", "Lesson 3: Live from TV5"], ["> Donner des informations personnelles", "do-NAY day zan-for-ma-see-OHN pair-so-NELL", "Giving personal information"], ["> Parler de ses passions et de ses rêves", "par-LAY duh say pa-see-OHN ay duh say REV", "Talking about your passions and dreams"], ["Carnet de voyage : La France en Europe", "kar-NAY duh vwa-YAHZH", "Travel notebook: France in Europe"], ["Vers le DELF A1", "vair luh DELF", "Towards the DELF A1"], ["Projet : Faire la carte d'identité du groupe", "pro-ZHAY : fair lah kart dee-dahn-tee-TAY dew GROOP", "Project: make the group's identity card"], ["Phonie-graphie → activités 1 à 3 p. 190", "fo-nee-gra-FEE", "Sound-and-spelling → activities 1–3, p.190"], ["Lexique thématique → p. 196-197", "lek-SEEK tay-ma-TEEK", "Thematic lexicon → pp.196-197"]], "note": "The cover photo shows two young men shaking hands against a yellow and magenta background — the handshake is the visual theme of the whole dossier."}, {"name": "Page 26 — Saluer : les cinq dessins", "items": [["Saluer", "sa-lew-AY", "Greeting"], ["Lucas à l'université", "lew-KAH a lew-nee-vair-see-TAY", "Lucas at the university"], ["Activité 1 : Regardez les dessins et identifiez chaque situation.", "ruh-gar-DAY lay day-SAN ay ee-dahn-tee-fee-AY shak see-tew-a-see-OHN", "Look at the drawings and identify each situation."], ["1. Où ?", "OO", "Where?"], ["à la cafétéria de l'université", "a lah ka-fay-tay-ree-AH", "in the university cafeteria — dessin c"], ["dans l'escalier", "dahn les-ka-lee-AY", "on the stairs — dessin b"], ["à l'accueil de l'université", "a la-KUH-yuh", "at the university reception — dessin a"], ["dans un couloir", "dahn zuhn koo-LWAHR", "in a corridor — dessin d"], ["2. Qui ?", "KEE", "Who?"], ["une jeune fille", "ewn zhuhn FEE-yuh", "a young girl"], ["un jeune homme", "uhn zhuh NOM", "a young man"], ["un monsieur", "uhn muh-SYUH", "a gentleman"], ["une dame", "ewn DAM", "a lady"], ["3. Quand ?", "KAHN", "When?"], ["le matin", "luh ma-TAN", "in the morning — 10 h 05, dessin b"], ["l'après-midi", "la-pray-mee-DEE", "in the afternoon — 13 h 00, dessins c and d"], ["le soir", "luh SWAHR", "in the evening — 18 h 30, dessin e"]], "note": "The five drawings follow Lucas through one day: <strong>a</strong> the reception desk (a man in a suit greets him formally), <strong>b</strong> the stairs at 10:05 (two students kiss on the cheek), <strong>c</strong> the cafeteria at 13:00 (he waves across the room), <strong>d</strong> a corridor by room S12 at 13:00 (an older woman with books), <strong>e</strong> a bus or tram at 18:30 (he waves goodbye)."}, {"name": "Page 26 — activités 2, 3 et 4", "items": [["Activité 2 : Écoutez les cinq dialogues. Associez les dialogues aux dessins.", "ay-koo-TAY lay sank dee-a-LOG", "Listen to the five dialogues. Match them to the drawings."], ["Exemple : Dialogue 1 → Dessin b", "dee-a-LOG uhn, day-SAN bay", "the worked example"], ["Activité 3 a) Réécoutez les dialogues et complétez.", "ray-ay-koo-TAY", "Listen again and complete."], ["1. Les personnes arrivent et se saluent. Dialogues n°s…", "lay pair-SUN a-REEV ay suh sa-LEW", "The people arrive and greet each other."], ["2. Les personnes partent et prennent congé. Dialogues n°s…", "lay pair-SUN PART ay pren kohn-ZHAY", "The people leave and say goodbye."], ["b) Réécoutez les dialogues et relevez les formules utilisées pour : 1. saluer ; 2. prendre congé.", "ruh-luh-VAY lay for-MEWL", "Note the phrases used to greet and to take leave."], ["Activité 4 Phonétique a) Écoutez et dites si les deux mots sont identiques ou différents.", "… ee-dahn-TEEK oo dee-fay-RAHN", "Listen and say whether the two words are the same or different."], ["b) Combien de fois entendez-vous le son [y] et le son [u] ? Écoutez et répondez.", "kohm-bee-AN duh FWAH ahn-tahn-day VOO luh SOHN", "How many times do you hear the sound [y] and the sound [u]?"], ["c) Écoutez puis lisez les phrases à voix haute.", "… a vwah OT", "Listen then read the sentences aloud."], ["1. Jules et Lou se saluent.", "zhewl ay LOO suh sa-LEW", "Jules and Lou greet each other."], ["2. Tu salues Lou.", "tew sa-LEW LOO", "You greet Lou."], ["3. Il étudie tous les jours.", "ee lay-tew-DEE too lay ZHOOR", "He studies every day."], ["4. Il est nouveau et russe.", "ee lay noo-VO ay REWSS", "He's new and Russian."]], "note": "The phonetics drill is the <strong>[y] / [u]</strong> pair — the <em>u</em> of <em>tu, Jules, étudie, russe</em> against the <em>ou</em> of <em>Lou, tous, jours, nouveau</em>. Sentences 1 and 2 deliberately put both in the same breath."}, {"name": "Page 26 — Aide-mémoire : les personnes et les moments", "items": [["Les personnes (Qui ?)", "lay pair-SUN", "People (Who?)"], ["un bébé", "uhn bay-BAY", "a baby"], ["un enfant", "uh nahn-FAHN", "a child"], ["un garçon", "uhn gar-SOHN", "a boy"], ["une fille", "ewn FEE-yuh", "a girl"], ["un jeune homme", "uhn zhuh NOM", "a young man"], ["une jeune fille", "ewn zhuhn FEE-yuh", "a young girl"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["un homme / un monsieur", "uh NOM / uhn muh-SYUH", "a man / a gentleman"], ["une femme / une dame", "ewn FAM / ewn DAM", "a woman / a lady"], ["NB : un (des) jeune(s) homme(s) + une (des) jeune(s) fille(s) = des jeunes (gens)", "day zhuhn (ZHAHN)", "together they are 'young people'"], ["Les moments de la journée (Quand ?)", "lay mo-MAHN duh lah zhoor-NAY", "Times of day (When?)"], ["le matin", "luh ma-TAN", "the morning"], ["l'après-midi", "la-pray-mee-DEE", "the afternoon"], ["le soir", "luh SWAHR", "the evening"], ["la nuit", "lah NWEE", "the night"]], "note": "The chart is arranged as an age ladder, from <em>un bébé</em> at the top down through <em>enfant</em> to the adult forms, with the male terms on the left and the female on the right.", "cols": "two"}, {"name": "Page 27 — les photos : formel ou informel", "items": [["Activité 5 : Observez sur les photos comment les personnes saluent en France.", "ob-sair-VAY sewr lay fo-TO", "Look at how people greet each other in France."], ["1. Pour chaque photo, identifiez le type de relation : formelle ou informelle ?", "… for-MELL oo an-for-MELL", "For each photo, is the relationship formal or informal?"], ["2. Comparez avec la manière de saluer dans votre pays (ou d'autres pays).", "kohm-pa-RAY a-vek lah ma-nee-AIR duh sa-lew-AY", "Compare with how people greet in your country."], ["Photo a : deux jeunes hommes se serrent la main → relation informelle", "… suh SAIR lah MAN", "two young men shake hands — informal"], ["Photo b : un homme et une femme en costume se serrent la main → relation formelle", "… ahn kos-TEWM", "two people in business dress shake hands — formal"], ["Photo c : deux jeunes femmes se font la bise → relation informelle", "… suh fohn lah BEEZ", "two young women kiss on the cheek — informal"], ["Photo d : deux adolescents se serrent la main autrement → relation informelle", "… oh-truh-MAHN", "two teenagers do a hand clasp — informal"]], "note": "Three gestures appear in the little drawings at the foot of the aide-mémoire: <strong>serrer la main</strong> (shake hands), <strong>faire la bise</strong> (kiss on the cheek) and <strong>faire un signe de la main</strong> (wave)."}, {"name": "Page 27 — Aide-mémoire : saluer et prendre congé", "items": [["Relation formelle — Saluer", "ruh-la-see-OHN for-MELL", "Formal — greeting"], ["Bonjour / Bonsoir, madame.", "bohn-ZHOOR / bohn-SWAHR, ma-DAM", "Hello / Good evening, madam."], ["Bonjour / Bonsoir, mademoiselle.", "… mad-mwa-ZELL", "…miss."], ["Bonjour / Bonsoir, monsieur.", "… muh-SYUH", "…si
