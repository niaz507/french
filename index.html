<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français — carnet d'étude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316233A'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-family='sans-serif' font-size='14' font-weight='700'%3EFr%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <button class="tbtn menubtn" id="menubtn" aria-label="Open menu">
    <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <a class="brand" href="#home" style="text-decoration:none">
    <span class="mk">Fr</span>
    <span class="brand-txt"><b>Carnet</b><span>d'étude</span></span>
  </a>

  <label class="searchbox">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search French or English…" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
  </label>

  <div class="topact">
    <select class="speed" id="speed" aria-label="Speech speed">
      <option value="0.6">0.6×</option>
      <option value="0.8" selected>0.8×</option>
      <option value="1">1×</option>
    </select>
    <label class="tbtn voicewrap" id="voicewrap" title="Choose the voice that reads French aloud">
      <span class="voicedot" id="voicedot"></span>
      <select class="voicepick" id="voicepick" aria-label="Narrator voice"></select>
    </label>
    <button class="tbtn" id="themebtn" title="Light / dark">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" stroke-linejoin="round"/></svg>
    </button>
    <button class="tbtn primary" id="practicebtn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7-4.5z"/></svg>
      <span class="lbl">Practise</span>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="side" id="side" aria-label="Contents">
    <button class="navhome" id="navhome">
      <svg class="ic" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 7l6-4.5L14 7v6.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
      Overview
    </button>
    <button class="navhome" id="navpath">
      <svg class="ic" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12h4l2-8h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Study path
    </button>
    <button class="navhome" id="navfav">
      <svg class="ic" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.6 4.3 13.5l.8-4.2L2 6.4l4.2-.5z" stroke-linejoin="round"/></svg>
      Saved words <span class="ct" id="favct" style="margin-left:auto;font-family:var(--mono);font-size:.64rem;opacity:.7"></span>
    </button>
    <div class="sidelabel">Course</div>
    <div id="tree"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="progress" id="progress"></div>

<div class="palette" id="palette" hidden>
  <div class="pbox">
    <div class="pin">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="opacity:.4"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>
      <input id="pq" type="text" placeholder="Jump to a lesson…" autocomplete="off" spellcheck="false">
      <span class="kbd">esc</span>
    </div>
    <div class="plist" id="plist"></div>
  </div>
</div>

<div class="shortcuts" id="shortcuts" hidden>
  <div class="box">
    <h4>Keyboard</h4>
    <div class="srow"><span>Jump to a lesson</span><span><span class="kbd">⌘</span> <span class="kbd">K</span></span></div>
    <div class="srow"><span>Search everything</span><span class="kbd">/</span></div>
    <div class="srow"><span>Next / previous lesson</span><span><span class="kbd">J</span> <span class="kbd">K</span></span></div>
    <div class="srow"><span>Start practice</span><span class="kbd">P</span></div>
    <div class="srow"><span>Light / dark</span><span class="kbd">D</span></div>
    <div class="srow"><span>This panel</span><span class="kbd">?</span></div>
    <div class="srow"><span>Close anything</span><span class="kbd">esc</span></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lbclose" id="lbclose" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
  <button class="lbnav prev" id="lbprev" aria-label="Previous page">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
  </button>
  <img id="lbimg" alt="">
  <button class="lbnav next" id="lbnext" aria-label="Next page">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
  </button>
  <div class="lbnum" id="lbnum"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Practice">
    <div class="phead">
      <h3 id="ptitle">Practise</h3>
      <button class="xbtn" id="pclose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<script src="data/alterego.js"></script>
<script src="data/cahier.js"></script>
<script src="data/grammaire.js"></script>
<script src="data/vocab-prog.js"></script>
<script src="data/verbs.js"></script>
<script src="data/grammar.js"></script>
<script src="data/pron.js"></script>
<script src="data/sons.js"></script>
<script src="data/nombres.js"></script>
<script src="data/vocab.js"></script>
<script src="data/audio.js"></script>
<script src="data/levels.js"></script>
<script src="data/path.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
