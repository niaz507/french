 duh lah MAIR", "The seaside stay is:"], ["du 13 au 18 mai / du 14 au 18 mai / du 14 au 19 mai / du 13 au 19 mai", "dew trez oh dee-ZWEET MAY", "the four options"], ["→ du 13 au 19 mai : le 14 elle écrit « hier, je suis restée au lit », donc elle est arrivée le 13 ; le 18 elle écrit « je dois rentrer demain », donc le 19.", "dew trez oh deez-nuhf MAY", "13 to 19 May — worked out from 'yesterday' on the 14th and 'tomorrow' on the 18th."], ["un séjour", "uhn say-ZHOOR", "a stay"], ["au bord de la mer", "oh bor duh lah MAIR", "at the seaside"]]}, {"name": "Page 90 — activités 7 et 8", "items": [["a) Relisez le document et complétez le tableau.", "ruh-lee-ZAY … ay kohm-play-TAY luh ta-BLO", "Reread the document and complete the table."], ["Myriam écrit le 14 mai — moments cités : hier, ce soir, ce matin, cet après-midi — jours : 13 mai, 14 mai", "… lay mo-MAHN see-TAY", "On 14 May she mentions yesterday (13th), this evening, this morning and this afternoon (all 14th)."], ["Myriam écrit le 16 mai — moments cités : aujourd'hui, hier matin, ce soir, ce matin — jours : 15 mai, 16 mai", "…", "On 16 May: today and this morning/evening (16th), yesterday morning (15th)."], ["Myriam écrit le 18 mai — moments cités : hier, aujourd'hui, ce matin, demain — jours : 17 mai, 18 mai, 19 mai", "…", "On 18 May: yesterday (17th), today and this morning (18th), tomorrow (19th)."], ["Activité 8 : Pour chaque moment (activité 7a), trouvez les informations que Myriam donne sur ses activités et sur les événements de la journée.", "poor shak mo-MAHN, troo-VAY lay zan-for-ma-see-OHN", "For each time, find what Myriam says about her activities and the day's events."]]}, {"name": "Page 90 — Point Langue : indiquer un moment spécifique", "items": [["Classez les expressions suivantes.", "kla-SAY lay zeks-pray-see-OHN swee-VAHNT", "Sort the following expressions."], ["ACTUEL — cette semaine", "set suh-MEN", "this week"], ["ce soir", "suh SWAHR", "this evening"], ["cet après-midi", "set a-pray-mee-DEE", "this afternoon"], ["ce matin", "suh ma-TAN", "this morning"], ["aujourd'hui", "oh-zhoor-DWEE", "today"], ["PASSÉ — la semaine dernière", "lah suh-MEN dair-nee-AIR", "last week"], ["l'année dernière", "la-NAY dair-nee-AIR", "last year"], ["hier", "ee-AIR", "yesterday"]], "note": "The pattern: <strong>ce / cet / cette</strong> + a time word points to <em>now</em>, while <strong>dernier / dernière</strong> after it points to the past. Note that <em>ce matin</em> and <em>ce soir</em> are 'current' even though the morning may already be over.", "cols": "two"}, {"name": "Page 91 — Point Langue : le passé composé", "items": [["a) Observez et complétez.", "ob-sair-VAY ay kohm-play-TAY", "Observe and complete."], ["J'ai marché sur la plage.", "zhay mar-SHAY sewr lah PLAHZH", "I walked on the beach."], ["Nous avons dansé.", "noo za-VOHN dahn-SAY", "We danced."], ["J'ai dormi jusqu'à 10 h 30.", "zhay dor-MEE zhews-KA", "I slept until 10.30."], ["J'ai pris le bus.", "zhay pree luh BEWSS", "I took the bus."], ["Je n'ai pas couru.", "zhuh nay pah koo-REW", "I didn't run."], ["Je n'ai pas fait les courses.", "zhuh nay pah fay lay KOORSS", "I didn't do the shopping."], ["Je suis restée au lit.", "zhuh swee res-TAY oh LEE", "I stayed in bed."], ["Je suis allée dans un petit resto.", "zhuh swee za-LAY dahn zuhn puh-tee res-TO", "I went to a little restaurant."], ["Ils sont arrivés hier.", "eel sohn ta-ree-VAY ee-AIR", "They arrived yesterday."], ["Je suis sortie de l'hôtel à 3 h 00.", "zhuh swee sor-TEE duh lo-TELL", "I left the hotel at 3."], ["Ils sont venus en vacances.", "eel sohn vuh-NEW ahn va-KAHNSS", "They came on holiday."]], "cols": "two"}, {"name": "Page 91 — la règle du passé composé", "items": [["Le verbe au passé composé a deux éléments :", "luh vairb oh pa-SAY kohm-po-ZAY a duh zay-lay-MAHN", "The passé composé has two parts:"], ["1. Le verbe AVOIR ou ÊTRE au présent.", "luh vairb a-VWAHR oo EH-truh oh pray-ZAHN", "avoir or être in the present."], ["2. Le participe passé, qui se termine par :", "luh par-tee-SEEP pa-SAY, kee suh tair-MEEN par", "The past participle, ending in:"], ["-É pour les verbes en -er : marcher → marché, danser → dansé", "ay", "-é for -er verbs"], ["-I pour certains verbes en -ir : dormir → dormi, finir → fini", "ee", "-i for certain -ir verbs"], ["-IS, ou -U, ou -T, pour d'autres verbes : prendre → pris, courir → couru, faire → fait", "ee / ew / ee", "-is, -u or -t for other verbs"], ["b) Quand le passé composé est formé avec ÊTRE, on ajoute -E au participe passé quand le sujet est FÉMININ", "… kahn luh sew-ZHAY ay fay-mee-NAN", "With être, add -e when the subject is feminine"], ["et on ajoute -S au participe passé quand le sujet est PLURIEL.", "… kahn luh sew-ZHAY ay plew-ree-ELL", "and add -s when the subject is plural."], ["Quand le passé composé est formé avec AVOIR, le participe passé ne change pas si le sujet est féminin ou pluriel.", "a-VWAHR … nuh shahnzh PAH", "With avoir, the participle does not change for a feminine or plural subject."], ["c) Observez la place de la négation : Je n'ai pas couru. / Je n'ai pas fait les courses.", "lah plahss duh lah nay-ga-see-OHN", "The negation wraps the helper verb."]], "note": "Everything hinges on the helper. With <strong>être</strong> the participle agrees like an adjective — <em>je suis restée</em>, <em>ils sont arrivés</em>. With <strong>avoir</strong> it never moves. And <strong>ne… pas</strong> goes around <em>avoir</em> or <em>être</em>, never around the participle."}, {"name": "Page 91 — activité 9 : phonétique", "items": [["a) Mots identiques ou différents ? Écoutez et répondez. Exemple : 1 → mots identiques", "mo zee-dahn-TEEK oo dee-fay-RAHN", "Same or different words? Listen and answer."], ["b) Quelle phrase entendez-vous ? Écoutez et répondez.", "kel FRAZ ahn-tahn-day VOO", "Which sentence do you hear?"], ["1. Je fais les courses. / J'ai fait les courses.", "zhuh fay lay KOORSS / zhay fay lay KOORSS", "present / past"], ["2. Je visite les musées. / J'ai visité les musées.", "zhuh vee-ZEET / zhay vee-zee-TAY", "present / past"], ["3. Je décide seule. / J'ai décidé seule.", "zhuh day-SEED / zhay day-see-DAY", "present / past"], ["4. Je ris toute seule. / J'ai ri toute seule.", "zhuh REE / zhay REE", "present / past"], ["5. Je finis le travail. / J'ai fini le travail.", "zhuh fee-NEE / zhay fee-NEE", "present / past"], ["6. Je dis oui. / J'ai dit oui.", "zhuh DEE / zhay DEE", "present / past"], ["7. J'aime ça. / J'ai aimé ça.", "ZHEM sa / zhay ay-MAY sa", "present / past"], ["8. J'écris une carte. / J'ai écrit une carte.", "zhay-KREE / zhay ay-KREE", "present / past"]], "note": "The whole difference is <strong>je</strong> against <strong>j'ai</strong>. In items 4, 5 and 6 the participle sounds identical to the present form — <em>je ris</em> / <em>j'ai ri</em> — so the auxiliary is the only clue you get."}, {"name": "Page 91 — activités 10, 11 et le projet", "items": [["Activité 10 a) En petits groupes, imaginez les événements chez Myriam pendant sa semaine de vacances. Choisissez un scénario optimiste ou pessimiste.", "… uhn say-na-ree-O op-tee-MEEST oo pay-see-MEEST", "In small groups, imagine what happened at Myriam's home during her week away."], ["b) Le 16 mai, un des enfants de Myriam envoie un mail à une personne de la famille ou à un(e) ami(e).", "… ahn-VWAH uhn MAIL", "On 16 May one of Myriam's children emails a relative or friend."], ["Écrivez le mail : en fonction de votre scénario optimiste ou pessimiste, racontez les événements depuis le départ de Myriam et précisez pourquoi vous écrivez.", "… duh-PWEE luh day-PAR duh mee-ree-AM", "Write the email: recount events since Myriam left and say why you're writing."], ["Activité 11 : Imaginez ! C'est le soir du 20 mai. De retour à la maison, Myriam raconte sa première journée dans son journal.", "… duh ruh-TOOR a lah may-ZOHN", "It's the evening of 20 May. Back home, Myriam writes up her first day."], ["20 mai, minuit — De retour à la maison… Aujourd'hui, …", "van MAY, mee-NWEE — duh ruh-TOOR a lah may-ZOHN", "the opening line she has already written"], ["Projet Dossier 4 — Tâche leçon 3 : Réaliser un reportage-photo sur la journée.", "ray-a-lee-ZAY uhn ruh-por-TAHZH fo-TO", "Task: produce a photo report on the day."]], "note": "Activity 11 is the payoff of the whole lesson — she said <em>tout change à la maison</em>, so her first day back has to be written in the <strong>passé composé</strong> and will show whether anything actually did."}, {"name": "Le vocabulaire de la leçon", "items": [["une bande dessinée (BD)", "ewn bahnd day-see-NAY", "a comic strip"], ["une vignette", "ewn veen-YETT", "a frame, a panel"], ["un journal intime", "uhn zhoor-NAL an-TEEM", "a private diary"], ["quotidien / quotidienne", "ko-tee-dee-AN / ko-tee-dee-EN", "daily"], ["une habitude", "ew na-bee-TEWD", "a habit"], ["la fréquence", "lah fray-KAHNSS", "frequency"], ["les tâches ménagères", "lay tahsh may-na-ZHAIR", "household chores"], ["le ménage", "luh may-NAHZH", "housework"], ["la vaisselle", "lah vay-SELL", "the washing-up"], ["les courses", "lay KOORSS", "the shopping"], ["courir", "koo-REER", "to run"], ["emmener", "ahm-NAY", "to take someone somewhere"], ["reprendre", "ruh-PRAHN-druh", "to collect, to pick up again"], ["rapporter", "ra-por-TAY", "to bring back"], ["un achat", "uh na-SHA", "a purchase"], ["le bonheur", "luh bo-NUR", "bliss, happiness"], ["la détente", "lah day-TAHNT", "relaxation"], ["la lecture", "lah lek-TEWR", "reading"], ["une plage", "ewn PLAHZH", "a beach"], ["un séjour", "uhn say-ZHOOR", "a stay"], ["rentrer", "rahn-TRAY", "to go home"], ["laisser un message", "lay-SAY uhn muh-SAHZH", "to leave a message"], ["décider", "day-see-DAY", "to decide"], ["à partir de demain", "a par-TEER duh duh-MAN", "from tomorrow"], ["de retour", "duh ruh-TOOR", "back, returned"], ["seul / seule", "SUL", "alone"], ["exceptionnel / habituel", "ek-sep-see-o-NELL / a-bee-tew-ELL", "exceptional / usual"]], "cols": "two"}]}, {"id": "ae-d4-carnet", "label": "Dossier 4 · Carnet de voyage", "name": "Il faut faire…", "summary": "Pages 92–93, complete. The Oai Star song and its video, the figures on sharing housework, three readers' accounts from Le Monde, and every household task pictogram named.", "art": null, "bookpages": ["p092", "p093"], "groups": [{"name": "Les enregistrements", "items": [], "note": "The two song extracts.", "tracks": [{"n": 121, "label": "p.92 act. 1 — le refrain de la chanson d'Oai Star"}, {"n": 122, "label": "p.92 act. 2 — un deuxième extrait"}]}, {"name": "Page 92 — la chanson d'Oai Star", "items": [["Carnet de voyage — Il faut faire…", "kar-NAY duh vwa-YAHZH — eel fo FAIR", "Travel notebook — You have to do…"], ["Activité 1 : Écoutez le refrain d'une chanson du groupe Oai Star.", "ay-koo-TAY luh ruh-FRAN dewn shahn-SOHN", "Listen to the chorus of a song by the group Oai Star."], ["1. Identifiez le thème de la chanson.", "ee-dahn-tee-fee-AY luh TEM", "Identify the theme of the song."], ["→ Le partage des tâches ménagères dans le couple.", "luh par-TAHZH day tahsh may-na-ZHAIR", "The sharing of household chores in a couple."], ["2. Regardez les cinq photos suivantes, extraites du clip vidéo de la chanson.", "… eks-TRAYT dew kleep vee-day-O", "Look at the five photos from the song's video."], ["Trouvez la photo qui illustre la phrase répétée dans le refrain.", "troo-VAY lah fo-TO kee ee-LEWS-truh lah frahz ray-pay-TAY", "Find the photo illustrating the repeated line of the chorus."], ["Activité 2 : Écoutez un deuxième extrait et trouvez la photo qui illustre cette partie de la chanson.", "… uhn duh-zee-EM eks-TRAH", "Listen to a second extract and find the matching photo."], ["un refrain", "uhn ruh-FRAN", "a chorus"], ["un clip vidéo", "uhn kleep vee-day-O", "a music video"], ["un extrait", "uh neks-TRAH", "an extract"]]}, {"name": "Page 92 — les cinq photos du clip", "items": [["Photo a : la jeune femme fait de la gymnastique par terre pendant que l'homme range le salon.", "… fay duh lah zheem-nas-TEEK par TAIR", "She exercises on the floor while he tidies the living room."], ["Photo b : l'homme écrit la liste des tâches sur un tableau noir.", "lom ay-KREE lah leest day TAHSH sewr uhn ta-BLO NWAHR", "The man writes the list of chores on a blackboard."], ["La liste au tableau : POUBELLES – COURSES – VAISSELLE – MÉNAGE – LESSIVE – ÉCOLE – ENFANT – BANQUE", "poo-BELL – KOORSS – vay-SELL – may-NAHZH – lay-SEEV – ay-KOL – ahn-FAHN – BAHNK", "bins, shopping, washing-up, cleaning, laundry, school, child, bank"], ["Photo c : une pile d'assiettes sales et des casseroles dans la cuisine.", "ewn peel da-see-ETT SAL ay day kas-ROL", "A pile of dirty plates and pans in the kitchen."], ["Photo d : la famille à table ; l'homme sert le repas, la femme est assise à l'écart.", "lah fa-MEE a TAH-bluh ; lom sair luh ruh-PAH", "The family at the table; the man serves the meal."], ["Photo e : l'homme, en chemise et cravate, passe l'aspirateur ou nettoie le sol.", "… pahss las-pee-ra-TUR oo nay-TWAH luh SOL", "The man, in shirt and tie, vacuums or cleans the floor."]], "note": "The list on the blackboard in photo <strong>b</strong> is the vocabulary of the whole Carnet — eight household jobs written up as a rota."}, {"name": "Page 93 — activités 3, 4 et 5", "items": [["Activité 3 a) D'après les extraits de la chanson et du clip vidéo, comment imaginez-vous la vie quotidienne de ce couple ?", "da-PRAY lay zeks-TRAH … ko-MAHN ee-ma-zhee-nay VOO", "From the song and video, how do you imagine this couple's daily life?"], ["b) Échangez ! Dites si cette situation est habituelle pour vous.", "ay-shahn-ZHAY ! … see set see-tew-a-see-OHN ay ta-bee-tew-ELL", "Say whether this situation is usual for you."], ["Activité 4 : Prenez connaissance des chiffres suivants et réagissez.", "pruh-NAY ko-nay-SAHNSS day SHEE-fruh", "Study the following figures and react."], ["Êtes-vous surpris par ces chiffres ? Correspondent-ils à la réalité dans votre pays ?", "et voo sewr-PREE par say SHEE-fruh", "Are you surprised? Do they match reality in your country?"], ["Activité 5 : Rêve ou réalité ?", "REV oo ray-a-lee-TAY", "Dream or reality?"], ["À la fin du clip, la jeune femme se réveille d'un rêve et fait la vaisselle.", "a lah fan dew KLEEP, lah zhuhn fam suh ray-VAY duhn REV", "At the end of the video the young woman wakes from a dream and does the washing-up."], ["Regardez ci-dessous l'image finale du clip et interprétez cette fin inattendue.", "… ay an-tair-pray-TAY set fan ee-na-tahn-DEW", "Look at the final image and interpret this unexpected ending."], ["Puis expliquez le titre de la chanson : Chéri(e).", "… luh TEE-truh duh lah shahn-SOHN : shay-REE", "Then explain the song's title: Chéri(e)."], ["une fin inattendue", "ewn fan ee-na-tahn-DEW", "an unexpected ending"]], "note": "The twist: everything you have watched — the man doing all the chores — was <strong>her dream</strong>. The final image shows her back at the sink while the family plays behind her. The title <em>Chéri(e)</em> works for either partner, which is the joke."}, {"name": "Page 93 — les chiffres sur le partage des tâches", "items": [["Quelques chiffres sur le partage des tâches domestiques dans les couples", "kel-kuh SHEE-fruh sewr luh par-TAHZH day tahsh do-mes-TEEK", "Some figures on the sharing of housework in couples"], ["Les tâches domestiques sont à l'origine de conflits pour 50 % des couples.", "… sohn ta lo-ree-ZHEEN duh kohn-FLEE poor san-KAHNT poor SAHN", "Housework causes conflict in 50% of couples."], ["Les femmes font 80 % des tâches.", "lay fam fohn kat-ruh-VAN poor sahn day TAHSH", "Women do 80% of the chores."], ["Partage équitable des tâches pour 15 % des couples.", "par-TAHZH ay-kee-TAH-bluh … kanz poor SAHN", "Equal sharing in 15% of couples."], ["Source : Ined", "ee-NED", "the National Institute for Demographic Studies"], ["* équitable = juste, équilibré", "ay-kee-TAH-bluh = ZHEWST, ay-kee-lee-BRAY", "equitable = fair, balanced"]]}, {"name": "Page 93 — l'article du Monde", "items": [["« Pour inciter mon homme à participer aux tâches, j'adopte la méthode des machos »", "poor an-see-TAY moh NOM a par-tee-see-PAY oh TAHSH", "'To get my man to help with the chores, I adopt the macho method'"], ["Nous avons demandé aux internautes du Monde.fr de témoigner de leurs difficultés", "noo za-vohn duh-mahn-DAY oh zan-tair-NOT … duh tay-mwa-NYAY", "We asked Le Monde's readers to tell us about their difficulties"], ["à avoir un partage équitable des tâches domestiques et parentales", "a a-VWAHR uhn par-TAHZH ay-kee-TAH-bluh", "in achieving a fair share of household and parenting tasks"], ["— encore assumées à 80 % par les femmes — dans leur couple.", "ahn-KOR a-sew-MAY a kat-ruh-VAN poor SAHN", "— still 80% shouldered by women — in their relationship."], ["Témoignages", "tay-mwa-NYAHZH", "Accounts"], ["D'après Le Monde, 8 mars 2011", "da-PRAY luh MOHND", "the source"]]}, {"name": "Page 93 — Témoignage 1 : Corinne", "items": [["« Nous pratiquons l'alternance chaque semaine », par Corinne", "noo pra-tee-KOHN lal-tair-NAHNSS shak suh-MEN", "'We alternate every week', by Corinne"], ["Depuis cinq ans, nous alternons la responsabilité de la maison.", "duh-PWEE sank AHN, noo zal-tair-NOHN lah res-pohn-sa-bee-lee-TAY", "For five years we've alternated responsibility for the house."], ["Chacun sa semaine.", "sha-KUHN sa suh-MEN", "Each of us takes a week."], ["La personne « en charge » (lui ou moi) s'occupe de tout organiser :", "lah pair-SUN ahn SHARZH … so-KEWP duh too tor-ga-nee-ZAY", "The person in charge organises everything:"], ["les menus, les courses, les déplacements des enfants, etc.", "lay muh-NEW, lay KOORSS, lay day-plahss-MAHN day zahn-FAHN", "the menus, the shopping, ferrying the children about, etc."], ["Sauf les poubelles et le recyclage (c'est lui) et le linge (c'est moi).", "SOF lay poo-BELL ay luh ruh-see-KLAHZH … ay luh LANZH", "Except the bins and recycling (that's him) and the laundry (that's me)."]]}, {"name": "Page 93 — Témoignage 2 : Une épouse privilégiée", "items": [["« Tout est fait par mon mari », par Une épouse privilégiée", "too tay fay par mohn ma-REE … ewn ay-POOZ pree-vee-lay-ZHAY", "'My husband does everything', by A privileged wife"], ["Mon témoignage est contraire à la « normale ».", "mohn tay-mwa-NYAHZH ay kohn-TRAIR a lah nor-MAL", "My account is the opposite of the norm."], ["À la maison, tout est fait par mon mari, sauf la cuisine et le nettoyage des sanitaires.", "… sof lah kwee-ZEEN ay luh nay-twa-YAHZH day sa-nee-TAIR", "At home my husband does everything except the cooking and cleaning the bathroom."], ["C'est notre accord : la personne la plus présente à la maison fait le plus.", "say NOT-ruh a-KOR : lah pair-SUN lah plew pray-ZAHNT", "That's our agreement: whoever is home most does most."], ["** les sanitaires = salle de bains + toilettes", "lay sa-nee-TAIR", "sanitaires = bathroom + toilet"]]}, {"name": "Page 93 — Témoignage 3 : Laure", "items": [["« J'adopte la méthode des machos : l'incompétence », par Laure", "zha-DOPT lah may-TOD day ma-CHO : lan-kohm-pay-TAHNSS", "'I adopt the macho method: incompetence', by Laure"], ["Pour inciter mon homme à participer aux tâches domestiques, j'adopte la méthode des machos :", "poor an-see-TAY moh NOM a par-tee-see-PAY", "To get my man to take part in the housework, I use the macho method:"], ["je suis absolument incompétente pour le repassage, le ménage ou la cuisine !", "zhuh swee zab-so-lew-MAHN an-kohm-pay-TAHNT poor luh ruh-pa-SAHZH", "I'm absolutely useless at ironing, cleaning or cooking!"], ["Il me reste assez à faire : vérifier les devoirs des enfants, organiser leurs différentes activités, etc.", "eel muh rest a-SAY a FAIR : vay-ree-fee-AY lay duh-VWAHR", "I still have plenty to do: checking the children's homework, organising their activities, etc."]], "note": "Three strategies, three tones: Corinne's <strong>weekly rota</strong>, the privileged wife's <strong>whoever-is-home-most</strong> rule, and Laure's tongue-in-cheek <strong>strategic incompetence</strong>."}, {"name": "Page 93 — les pictogrammes des tâches", "items": [["passer l'aspirateur", "pa-SAY las-pee-ra-TUR", "to vacuum"], ["faire la lessive", "fair lah lay-SEEV", "to do the washing"], ["mettre le linge dans la machine", "MET-ruh luh LANZH dahn lah ma-SHEEN", "to put the laundry in the machine"], ["donner le bain / s'occuper du bébé", "do-NAY luh BAN", "to bath the baby"], ["laver le sol", "la-VAY luh SOL", "to wash the floor"], ["étendre le linge", "ay-TAHN-druh luh LANZH", "to hang out the washing"], ["repasser", "ruh-pa-SAY", "to iron"], ["sortir les poubelles", "sor-TEER lay poo-BELL", "to take out the bins"], ["nettoyer les vitres", "nay-twa-YAY lay VEE-truh", "to clean the windows"], ["arroser les plantes", "a-ro-ZAY lay PLAHNT", "to water the plants"], ["faire le ménage", "fair luh may-NAHZH", "to do the housework"]], "note": "The blue pictograms across the top of page 93 — the household tasks with no captions in the book.", "cols": "two"}, {"name": "Page 93 — activité 6", "items": [["Lisez l'article suivant et échangez.", "lee-ZAY lar-TEE-kluh swee-VAHN ay ay-shahn-ZHAY", "Read the article and discuss."], ["1. Quelle(s) tâche(s) domestique(s) faites-vous sans problème ? Quelle(s) tâche(s) détestez-vous ?", "kel tahsh do-mes-TEEK fet VOO sahn pro-BLEM", "Which chores do you do happily? Which do you hate?"], ["2. Comment se fait le partage des tâches dans votre famille ?", "ko-MAHN suh fay luh par-TAHZH day TAHSH", "How are the chores shared in your family?"]]}, {"name": "Le vocabulaire du carnet", "items": [["les tâches domestiques / ménagères", "lay tahsh do-mes-TEEK / may-na-ZHAIR", "household chores"], ["le partage", "luh par-TAHZH", "the sharing"], ["partager", "par-ta-ZHAY", "to share"], ["équitable", "ay-kee-TAH-bluh", "fair, equitable"], ["l'alternance", "lal-tair-NAHNSS", "alternation"], ["alterner", "al-tair-NAY", "to alternate"], ["être en charge", "EH-truh ahn SHARZH", "to be in charge"], ["s'occuper de", "so-kew-PAY duh", "to take care of"], ["un conflit", "uhn kohn-FLEE", "a conflict"], ["un accord", "uh na-KOR", "an agreement"], ["inciter", "an-see-TAY", "to encourage, to prompt"], ["l'incompétence", "lan-kohm-pay-TAHNSS", "incompetence"], ["incompétent / incompétente", "an-kohm-pay-TAHN / -TAHNT", "incompetent"], ["les poubelles", "lay poo-BELL", "the bins"], ["le recyclage", "luh ruh-see-KLAHZH", "recycling"], ["le linge", "luh LANZH", "the laundry"], ["la lessive", "lah lay-SEEV", "the washing"], ["le repassage", "luh ruh-pa-SAHZH", "ironing"], ["le nettoyage", "luh nay-twa-YAHZH", "cleaning"], ["les sanitaires", "lay sa-nee-TAIR", "bathroom and toilet"], ["un menu", "uhn muh-NEW", "a menu"], ["les déplacements", "lay day-plahss-MAHN", "the running around, journeys"], ["un témoignage", "uhn tay-mwa-NYAHZH", "an account, a testimony"], ["un internaute", "uh nan-tair-NOT", "an internet user"], ["une épouse", "ew nay-POOZ", "a wife"], ["privilégié / privilégiée", "pree-vee-lay-ZHAY", "privileged"], ["vérifier les devoirs", "vay-ree-fee-AY lay duh-VWAHR", "to check the homework"]], "cols": "two"}]}, {"id": "ae-d4-sexercer", "label": "Dossier 4 · S'exercer", "name": "Les corrigés", "summary": "Pages 94–95, complete. All eighteen exercises with every item and every answer — telling the time, devoir and il faut, reflexive verbs, opening hours, the scrambled dialogue, on, pouvoir and vouloir, the imperative, the futur proche, frequency and the passé composé.", "art": null, "bookpages": ["p094", "p095"], "groups": [{"name": "Leçon 1 — Ex. 1 : l'heure de la conversation", "items": [["Regardez l'heure officielle puis complétez avec l'heure utilisée dans la conversation.", "… lur ew-tee-lee-ZAY dahn lah kohn-vair-sa-see-OHN", "Give the conversational form of each official time."], ["Exemple : 16 h 15 → Il est quatre heures et quart, j'ai rendez-vous avec mon banquier à la demie.", "eel ay katr ur ay KAR … a lah duh-MEE", "the worked example"], ["1. 8 h 40 → Il est neuf heures moins vingt, tu es en retard.", "eel ay nuh vur mwan VAN", "twenty to nine — you're late"], ["2. 10 h 45 → Il est onze heures moins le quart, vous voulez une pause café ?", "eel ay ohn zur mwan luh KAR", "quarter to eleven — coffee break?"], ["3. 12 h 30 → Il est midi et demie ! À table, les enfants !", "eel ay mee-DEE ay duh-MEE", "half past twelve — to the table, children!"], ["4. 13 h 55 → Il est deux heures moins cinq, mon train part bientôt !", "eel ay duh zur mwan SANK", "five to two — my train leaves soon"], ["5. 20 h 15 → Il est huit heures et quart ! Oh non ! Le magasin est déjà fermé !", "eel ay wee tur ay KAR", "quarter past eight — the shop is already shut"], ["6. 0 heure → Il est minuit, les derniers clients du restaurant partent.", "eel ay mee-NWEE", "midnight — the last diners are leaving"]]}, {"name": "Leçon 1 — Ex. 2 : devoir et il faut", "items": [["Exprimez des obligations avec devoir et il faut.", "eks-pree-MAY day zo-blee-ga-see-OHN", "Express obligations with devoir and il faut."], ["Exemple : Être chez le coiffeur avant 18 heures (tu) → Tu dois être chez le coiffeur avant 18 heures. / Il faut être chez le coiffeur avant 18 heures.", "tew dwah ZEH-truh … eel fo TEH-truh", "the worked example"], ["1. Poster les lettres (elle) → Elle doit poster les lettres. / Il faut poster les lettres.", "el dwah pos-TAY lay LET-ruh", "to post the letters"], ["2. Travailler jusqu'à 22 heures le jeudi (ils) → Ils doivent travailler jusqu'à 22 heures le jeudi.", "eel DWAHV tra-va-YAY", "to work until 10pm on Thursdays"], ["3. Réserver une table au restaurant pour ce soir (nous) → Nous devons réserver une table au restaurant pour ce soir.", "noo duh-VOHN ray-zair-VAY", "to book a table for tonight"], ["4. Aller à la poste avant la fermeture (vous) → Vous devez aller à la poste avant la fermeture.", "voo duh-VAY a-LAY", "to go to the post office before closing"], ["5. Passer à la banque aujourd'hui (je) → Je dois passer à la banque aujourd'hui.", "zhuh dwah pa-SAY", "to call at the bank today"], ["6. Fermer le magasin le dimanche (il) → Il doit fermer le magasin le dimanche.", "eel dwah fair-MAY", "to close the shop on Sundays"]]}, {"name": "Leçon 1 — Ex. 3 : les verbes pronominaux", "items": [["Complétez au présent avec : se lever – se coucher – se reposer – s'endormir – se réveiller – se préparer.", "kohm-play-TAY oh pray-ZAHN", "Complete in the present."], ["1. Elle dort beaucoup : le soir, elle SE COUCHE à 22 h et le matin elle SE LÈVE à 8 h.", "el suh KOOSH … el suh LEV", "She goes to bed at 10 and gets up at 8."], ["2. Les petits SE REPOSENT toujours après le déjeuner parce qu'ils sont fatigués.", "lay puh-TEE suh ruh-POZ", "The little ones always rest after lunch."], ["3. Nous NOUS COUCHONS à minuit et nous NOUS LEVONS à 5 h 30, c'est dur !", "noo noo koo-SHOHN … noo noo luh-VOHN", "We go to bed at midnight and get up at 5.30 — it's hard!"], ["4. Vous VOUS PRÉPAREZ avant ou après votre petit déjeuner ?", "voo voo pray-pa-RAY", "Do you get ready before or after breakfast?"]]}, {"name": "Leçon 1 — Ex. 4 : choisir le verbe", "items": [["Choisissez le verbe qui convient et mettez ce verbe au présent.", "shwa-zee-SAY luh vairb kee kohn-vee-AN", "Choose the right verb and put it in the present."], ["1. Il est très fatigué : il S'ENDORT souvent devant la télé.", "eel sahn-DOR soo-VAHN", "He often falls asleep in front of the TV."], ["2. Avant de faire un achat important, je M'INFORME sur les prix.", "zhuh man-FORM sewr lay PREE", "Before an important purchase I find out about prices."], ["3. Nos enfants SE COUCHENT vers 21 heures, après le dîner, c'est la règle !", "no zahn-FAHN suh KOOSH", "Our children go to bed around 9, after dinner — that's the rule!"], ["4. Vous VOUS CONNECTEZ souvent à Facebook ?", "voo voo ko-nek-TAY", "Do you often log on to Facebook?"], ["5. Le dimanche, nous restons au lit, nous lisons et nous NOUS LEVONS à 11 heures !", "noo noo luh-VOHN a ohn ZUR", "On Sundays we stay in bed, read and get up at 11!"]]}, {"name": "Leçon 1 — Ex. 5 : questions et réponses", "items": [["Complétez les questions avec les verbes donnés puis répondez aux questions.", "kohm-play-TAY lay kes-tee-OHN", "Complete the questions then answer them."], ["1. — Papa, tu TE RASES souvent ? — Oui, je ME RASE tous les matins.", "tew tuh RAHZ … zhuh muh RAHZ", "Dad, do you shave often? — Yes, every morning."], ["2. — Les enfants S'HABILLENT seuls ? — Non, ils NE S'HABILLENT PAS seuls.", "eel sa-BEE … eel nuh sa-BEE PAH", "Do the children dress themselves? — No, they don't."], ["3. — Vous VOUS LAVEZ avant ou après le petit déjeuner ? — Nous NOUS LAVONS après le petit déjeuner.", "voo voo la-VAY … noo noo la-VOHN", "Do you wash before or after breakfast? — After."], ["4. — Elle SE DOUCHE le soir ? — Non, elle NE SE DOUCHE PAS, elle prend un bain.", "el suh DOOSH … el nuh suh doosh PAH", "Does she shower in the evening? — No, she takes a bath."]], "note": "Note where the negation goes with a reflexive: <strong>ne</strong> comes before the pronoun and <strong>pas</strong> after the verb — <em>ils ne s'habillent pas</em>."}, {"name": "Leçon 1 — Ex. 6 : indiquer les horaires", "items": [["Complétez avec à – vers – de… à – jusqu'à.", "kohm-play-TAY a-vek", "Complete with à, vers, de… à, jusqu'à."], ["Messages publics", "muh-SAHZH pew-BLEEK", "Public announcements"], ["1. Nos bureaux sont ouverts JUSQU'À 17 h.", "zhews-KA dee-set UR", "Our offices are open until 5pm."], ["2. Les employés travaillent DE 9 h À 17 h.", "duh nuh vur a dee-set UR", "Staff work from 9 to 5."], ["3. Le magasin ouvre ses portes À 10 h.", "a dee ZUR", "The shop opens at 10."], ["Petits messages entre amis", "puh-TEE muh-SAHZH ahn-truh za-MEE", "Notes between friends"], ["4. Je te téléphone VERS 13 h.", "vair trayz UR", "I'll ring you around 1."], ["5. J'ai mon cours de piano DE 14 h À 16 h et je passe chez toi après.", "duh ka-TORZ ur a sez UR", "I have my piano lesson from 2 to 4 and I'll call round after."], ["6. Appelle-moi À 21 h précises.", "a van-tay-uh nur pray-SEEZ", "Call me at 9 sharp."], ["7. Les invités arrivent VERS 20 h, n'oublie pas !", "vair van TUR", "The guests arrive around 8, don't forget!"]], "note": "The four are precise: <strong>à</strong> = exactly at, <strong>vers</strong> = approximately, <strong>de… à</strong> = a span, <strong>jusqu'à</strong> = up to a limit. Note <em>21 h précises</em> — 'nine sharp'."}, {"name": "Leçon 2 — Ex. 7 : l'ordre du dialogue", "items": [["Retrouvez l'ordre du dialogue.", "ruh-troo-VAY LOR-druh dew dee-a-LOG", "Find the order of the dialogue."], ["8. Lui : On sort vendredi ?", "ohn sor vahn-druh-DEE", "Shall we go out on Friday?"], ["10. Elle : Ah, vendredi, ce n'est pas possible, je suis déjà invitée ; mais samedi je suis libre !", "… suh nay pah po-SEE-bluh, zhuh swee day-ZHA an-vee-TAY", "Friday's not possible, I'm already invited; but Saturday I'm free!"], ["1. Lui : Bien ! On peut aller au ciné si tu veux ?", "bee-AN ! ohn puh a-LAY oh see-NAY", "Fine! We could go to the cinema if you like?"], ["2. Elle : Ah non, trois films dans la semaine, ça fait beaucoup !", "a NOHN, trwah feelm dahn lah suh-MEN", "Oh no, three films in one week is a lot!"], ["9. Lui : Alors pourquoi pas une soirée dans une boîte de jazz ?", "a-LOR poor-kwah pah ewn swa-RAY dahn zewn bwaht duh JAZZ", "Then why not an evening at a jazz club?"], ["4. Elle : Oui, c'est parfait, j'adore le jazz.", "wee, say par-FAY, zha-DOR luh JAZZ", "Yes, perfect, I love jazz."], ["5. Lui : On se retrouve samedi à 21 heures au Blue Note ?", "ohn suh ruh-TROOV sam-DEE a van-tay-uh NUR", "Shall we meet Saturday at 9 at the Blue Note?"], ["6. Elle : D'accord, mais c'est où exactement ?", "da-KOR, may say too eg-zak-tuh-MAHN", "OK, but where exactly is it?"], ["3. Lui : Attends, je vérifie… 15 rue du Havre, près du théâtre Mazarin.", "a-TAHN, zhuh vay-ree-FEE", "Hang on, let me check… 15 rue du Havre, near the Mazarin theatre."], ["7. Elle : D'accord. À samedi alors !", "da-KOR. a sam-DEE a-LOR", "OK. See you Saturday then!"]], "note": "The order is <strong>8 – 10 – 1 – 2 – 9 – 4 – 5 – 6 – 3 – 7</strong>."}, {"name": "Leçon 2 — Ex. 8 : le pronom on", "items": [["Transformez le dialogue suivant avec le pronom on.", "trahns-for-MAY … a-vek luh pro-NOHN ohn", "Rewrite the dialogue using on."], ["— Qu'est-ce que vous faites le week-end ?", "kes-kuh voo fet luh week-END", "What do you do at the weekend?"], ["— Quand ON EST libres, ON SORT avec des amis.", "kahn oh nay LEE-bruh, ohn SOR", "When we're free we go out with friends."], ["ON A rendez-vous au centre-ville.", "oh na rahn-day-VOO", "We meet in the town centre."], ["ON VA dans un bar sympa, puis ON DÎNE dans un petit resto", "ohn va dahn zuhn bar san-PAH, pwee zohn DEEN", "We go to a nice bar, then have dinner in a little restaurant"], ["et ON PASSE le reste de la soirée en boîte.", "ay ohn PAHSS luh rest duh lah swa-RAY ahn BWAHT", "and spend the rest of the evening clubbing."], ["ON RENTRE à la maison vers 6 heures du matin, fatigués mais contents !", "ohn RAHN-truh a lah may-ZOHN vair see zur dew ma-TAN", "We get home around 6 in the morning, tired but happy!"]], "note": "Notice that the adjectives stay <strong>plural</strong> — <em>on est libres</em>, <em>fatigués mais contents</em> — because <em>on</em> means <em>nous</em> here even though the verb is singular."}, {"name": "Leçon 2 — Ex. 9 : pouvoir et vouloir", "items": [["Complétez avec le verbe pouvoir ou vouloir.", "kohm-play-TAY a-vek luh vairb", "Complete with pouvoir or vouloir."], ["1. — Nous avons des amis à dîner ce soir, tu PEUX venir si tu VEUX. — C'est gentil, mais ce soir, je ne PEUX pas, c'est dommage !", "tew PUH vuh-NEER see tew VUH … zhuh nuh puh PAH", "You can come if you want. — That's kind, but I can't tonight."], ["2. — Les Martin viennent samedi ou pas ? — Oui, oui, ils VEULENT bien venir mais ils ne PEUVENT pas être là avant 21 heures.", "eel VUL bee-AN … eel nuh PUV pah", "They'd like to come but can't be there before 9."], ["3. — Nous VOULONS faire une petite fête pour l'anniversaire de Julie, dimanche. — Super et on PEUT t'aider si tu VEUX.", "noo voo-LOHN … ohn puh tay-DAY", "We want to throw a little party. — Great, and we can help if you like."], ["— Oui, c'est sympa, je VEUX bien ! Alors vous POUVEZ apporter le champagne, si vous VOULEZ.", "zhuh vuh bee-AN … voo poo-VAY", "Yes, that's nice, I'd love that! So you can bring the champagne if you like."]]}, {"name": "Leçon 2 — Ex. 10 : l'impératif", "items": [["Mettez les verbes entre parenthèses à l'impératif.", "met-TAY lay VAIRB … a lan-pay-ra-TEEF", "Put the bracketed verbs in the imperative."], ["1. Madame, Votre chat est chez moi. VENEZ le reprendre, je rentre à 18 heures. Votre voisine", "vuh-NAY luh ruh-PRAHN-druh", "Come and collect him, I'm home at 6. — vous form"], ["2. Mon amour, PRENDS un taxi et VIENS tout de suite. Je t'attends !", "PRAHN uhn tak-SEE ay vee-AN too duh SWEET", "Take a taxi and come at once. I'm waiting! — tu form"], ["3. Monsieur, Pour venir chez nous, TRAVERSEZ la cour, PRENEZ l'escalier B et MONTEZ au 3e étage. M. et Mme Régnier", "tra-vair-SAY lah KOOR, pruh-NAY les-ka-lee-AY BAY ay mohn-TAY", "Cross the courtyard, take staircase B and go up to the third floor. — vous form"], ["4. Salut Flo ! PENSE à la fête chez Arthur samedi, mais avant PASSE chez moi à 18 heures. N'OUBLIE PAS le cadeau pour Arthur ! Élodie", "PAHNSS a lah FET … PAHSS shay MWAH … noo-blee PAH", "Remember the party, but come round first. Don't forget the present! — tu form, -er verbs drop the -s"], ["5. Chers amis, VENEZ nous voir dimanche dans notre nouvelle maison. AMENEZ les enfants ! Nathalie et Gilles", "vuh-NAY noo VWAHR … am-NAY lay zahn-FAHN", "Come and see us on Sunday. Bring the children! — vous form"]], "note": "The register decides the form: <em>Madame</em>, <em>Monsieur</em> and <em>Chers amis</em> take <strong>vous</strong>; <em>Mon amour</em> and <em>Salut Flo</em> take <strong>tu</strong>. And in 4, <em>penser</em> and <em>passer</em> lose their -s."}, {"name": "Leçon 2 — Ex. 11 : le futur proche", "items": [["Mettez les verbes au futur proche.", "met-TAY lay vairb oh few-TEWR PROSH", "Put the verbs in the near future."], ["— Nous ALLONS FÊTER nos 10 ans de mariage le samedi 15 juin. Mon frère Maxime et sa femme VONT VENIR du Canada pour l'occasion !", "noo za-lohn fay-TAY … vohn vuh-NEER", "We're going to celebrate our 10th anniversary. My brother and his wife are coming from Canada!"], ["— Vous ALLEZ INVITER aussi des amis ?", "voo za-lay zan-vee-TAY", "Are you going to invite friends too?"], ["— Oui, on VA INVITER aussi quelques amis proches.", "ohn va an-vee-TAY", "Yes, we're going to invite a few close friends."], ["— Quel est le programme de la soirée ?", "kel ay luh pro-GRAM", "What's the plan for the evening?"], ["— Je VAIS ORGANISER un cocktail au champagne.", "zhuh vay zor-ga-nee-ZAY", "I'm going to organise a champagne cocktail."], ["— Tu VAS ACHETER une nouvelle robe ?", "tew va zash-TAY", "Are you going to buy a new dress?"], ["— Non, c'est super, je N'AI PAS besoin de chercher une robe : mon amie styliste crée un modèle spécialement pour moi !", "zhuh nay PAH buh-ZWAN", "No, it's great, I don't need to look for a dress: my stylist friend is making one specially for me!"]]}, {"name": "Leçon 3 — Ex. 12 : la lettre de Lucas", "items": [["Complétez les expressions indiquant la fréquence ou la régularité dans la lettre de Lucas, pensionnaire dans une école.", "kohm-play-TAY lay zeks-pray-see-OHN", "Complete the frequency expressions in Lucas's letter."], ["Chère maman,", "shair ma-MAHN", "Dear mum,"], ["Je me lève TOUS LES matins à 6 h 30 et après le petit déjeuner, je reste en ÉTUDE dans ma chambre jusqu'à 8 heures.", "too lay ma-TAN … ahn ay-TEWD", "I get up every morning at 6.30 and after breakfast I have study time in my room until 8."], ["Nous avons cours TOUS LES matin de 8 h 30 à 11 h 30.", "too lay ma-TAN", "We have classes every morning from 8.30 to 11.30."], ["Je déjeune CHAQUE jour à la cantine avec mes camarades.", "shak ZHOOR a lah kahn-TEEN", "I have lunch every day in the canteen with my classmates."], ["Après le repas, nous avons une heure libre : D'HABITUDE je lis ou bien je m'amuse avec mes copains.", "da-bee-TEWD", "After the meal we have a free hour: usually I read or mess about with my mates."], ["Puis CHAQUE après-midi nous travaillons jusqu'à 18 heures.", "shak a-pray-mee-DEE", "Then every afternoon we work until 6."], ["Après le dîner, on regarde la télé, mais moi, SOUVENT je suis trop fatigué et je me couche tôt.", "soo-VAHN", "After dinner we watch TV, but I'm often too tired and go to bed early."], ["Je t'embrasse, Lucas", "zhuh tahm-BRAHSS", "Love, Lucas"], ["un pensionnaire", "uhn pahn-see-o-NAIR", "a boarder"], ["une cantine", "ewn kahn-TEEN", "a canteen"], ["un camarade", "uhn ka-ma-RAHD", "a classmate"]]}, {"name": "Leçon 3 — Ex. 13 : remplacer les verbes", "items": [["Remplacez les verbes soulignés par les verbes corrects. Choisissez dans la liste ci-dessous.", "rahm-pla-SAY lay VAIRB soo-leen-YAY", "Replace the underlined verbs with the correct ones."], ["La liste : s'endormir – faire les courses – récupérer – se coucher – se doucher – prendre le petit déjeuner", "…", "the six verbs to choose from"], ["1. Tous les soirs, je me lève à minuit. → je ME COUCHE à minuit.", "zhuh muh KOOSH", "Every evening I go to bed at midnight."], ["2. Le matin, je dîne à 7 heures : pain et café. → je PRENDS LE PETIT DÉJEUNER à 7 heures.", "zhuh prahn luh puh-tee day-zhuh-NAY", "In the morning I have breakfast at 7."], ["3. Après le travail, ils font le ménage au supermarché. → ils FONT LES COURSES au supermarché.", "eel fohn lay KOORSS", "After work they do the shopping at the supermarket."], ["4. Le matin, elle s'endort dans la salle de bains. → elle SE DOUCHE dans la salle de bains.", "el suh DOOSH", "In the morning she showers in the bathroom."], ["5. À 17 heures, elle emmène les enfants à l'école. → elle RÉCUPÈRE les enfants à l'école.", "el ray-kew-PAIR", "At 5 she collects the children from school."], ["6. Le soir, elle regarde la télé et, souvent, elle se réveille. → elle S'ENDORT.", "el sahn-DOR", "In the evening she watches TV and often falls asleep."]], "note": "<strong>récupérer</strong> is a useful synonym here for <em>aller chercher</em> or <em>reprendre</em> — to collect someone."}, {"name": "Leçon 3 — Ex. 14 et 15 : moment spécifique ou habitude", "items": [["Ex. 14 — Moment spécifique ou habitude ? Complétez avec l'expression correcte.", "mo-MAHN spay-see-FEEK oo a-bee-TEWD", "Specific moment or habit? Choose the right expression."], ["1. LE SOIR, je m'endors toujours avant minuit.", "luh SWAHR", "Every evening — habit."], ["2. CET APRÈS-MIDI, ma sœur est allée chercher ses enfants à l'école, comme d'habitude.", "set a-pray-mee-DEE", "This afternoon — a specific moment."], ["3. CE MATIN, j'ai un rendez-vous chez le dentiste à 9 heures.", "suh ma-TAN", "This morning — specific."], ["4. LE WEEK-END, je fais du sport avec des amis mais CE WEEK-END, j'ai été malade et je suis resté chez moi.", "luh week-END … suh week-END", "At weekends — habit; this weekend — specific."], ["Ex. 15 — Moment actuel ou passé ? Choisissez l'expression correcte.", "mo-MAHN ak-tew-ELL oo pa-SAY", "Current or past moment?"], ["1. L'ANNÉE DERNIÈRE, nous sommes allés en vacances en Italie et CETTE ANNÉE nous retournons à Venise.", "la-NAY dair-nee-AIR … set a-NAY", "Last year… and this year…"], ["2. Nouveau programme : CETTE SEMAINE, les enfants partent en vacances avec leur père.", "set suh-MEN", "This week — current."], ["3. CETTE SEMAINE, ça va, mais LA SEMAINE DERNIÈRE, je n'ai pas dormi pendant plusieurs nuits.", "set suh-MEN … lah suh-MEN dair-nee-AIR", "This week… but last week…"]]}, {"name": "Leçon 3 — Ex. 16 : la semaine de M. Catastrophe", "items": [["Complétez avec les verbes au passé composé.", "kohm-play-TAY a-vek lay vairb oh pa-SAY kohm-po-ZAY", "Complete in the passé composé."], ["La semaine de M. Catastrophe", "lah suh-MEN duh muh-syuh ka-tas-TROF", "Mr Disaster's week"], ["Lundi, M. Catastrophe EST ARRIVÉ en retard au travail.", "ay ta-ree-VAY ahn ruh-TAR", "Monday, he arrived late for work. — être"], ["Mardi, il A EU un accident de voiture.", "ee la EW uh nak-see-DAHN", "Tuesday, he had a car accident. — avoir, participle eu"], ["Mercredi, ses enfants ONT CASSÉ l'ordinateur.", "say zahn-FAHN ohn ka-SAY", "Wednesday, his children broke the computer."], ["Jeudi, sa mère EST ENTRÉE à l'hôpital.", "sa mair ay tahn-TRAY", "Thursday, his mother went into hospital. — être + feminine -e"], ["Vendredi, il A PERDU son travail.", "ee la pair-DEW", "Friday, he lost his job."], ["Dimanche, sa femme EST PARTIE.", "sa fam ay par-TEE", "Sunday, his wife left. — être + feminine -e"], ["Imaginez la semaine de Mme Chance. Lundi, elle…", "ee-ma-zhee-NAY lah suh-MEN duh ma-DAM SHAHNSS", "Now imagine Mrs Lucky's week."]], "note": "Four of the six take <strong>avoir</strong>; <em>arriver, entrer</em> and <em>partir</em> take <strong>être</strong> — and the two with feminine subjects add <strong>-e</strong>."}, {"name": "Leçon 3 — Ex. 17 : raconter des histoires", "items": [["Racontez des histoires avec les verbes suivants. Attention à la chronologie !", "ra-kohn-TAY day zees-TWAHR … a-tahn-see-OHN a lah kro-no-lo-ZHEE", "Tell the stories with these verbs. Watch the chronology!"], ["Exemple : Clara a préparé le petit déjeuner, puis elle a emmené les enfants à l'école. Elle a fait les courses et elle a repris les enfants à l'école.", "kla-RAH a pray-pa-RAY … pwee ze la ahm-NAY", "the worked example"], ["1. Nous : visiter un appartement – lire les petites annonces – acheter le journal – déménager", "→ Nous avons acheté le journal, nous avons lu les petites annonces, nous avons visité un appartement et nous avons déménagé.", "We bought the paper, read the small ads, viewed a flat and moved."], ["2. Elle : courir – quitter la maison – rater le bus – ne pas travailler – rentrer à la maison", "→ Elle a quitté la maison, elle a couru, elle a raté le bus, elle n'a pas travaillé et elle est rentrée à la maison.", "She left home, ran, missed the bus, didn't work and went home."], ["3. Il : danser – rencontrer Simone – aller dans une agence matrimoniale – tomber amoureux", "→ Il est allé dans une agence matrimoniale, il a rencontré Simone, ils ont dansé et il est tombé amoureux.", "He went to a dating agency, met Simone, they danced and he fell in love."], ["4. Les enfants : prendre un bain – manger un gâteau – rentrer de l'école – faire les devoirs", "→ Les enfants sont rentrés de l'école, ils ont mangé un gâteau, ils ont fait les devoirs et ils ont pris un bain.", "The children came home, ate a cake, did their homework and had a bath."]], "note": "The trap is that the verbs are given <strong>out of order</strong> — you have to work out the logical sequence before writing."}, {"name": "Leçon 3 — Ex. 18 : imaginez ce qui s'est passé", "items": [["Imaginez ce qui s'est passé.", "ee-ma-zhee-NAY suh kee say pa-SAY", "Imagine what happened."], ["Exemple : D'habitude, le soir, je regarde la télévision, mais hier je n'ai pas regardé la télévision, j'ai dîné avec des amis.", "… may zee-AIR zhuh nay pah ruh-gar-DAY", "the worked example"], ["1. Chaque matin, je pars travailler en voiture, mais hier… → je n'ai pas pris la voiture, j'ai pris le métro.", "zhuh nay pah pree lah vwa-TEWR", "…I didn't take the car, I took the metro."], ["2. Tous les matins, j'arrive au bureau vers 9 heures, mais hier… → je suis arrivé à 11 heures.", "zhuh swee za-ree-VAY a ohn ZUR", "…I arrived at 11."], ["3. D'habitude, je pars en vacances au mois d'août, mais l'année dernière… → je suis parti en juillet.", "zhuh swee par-TEE ahn zhwee-YAY", "…I went in July."], ["4. D'habitude, ma femme cuisine très bien, mais hier soir… → elle a préparé un plat immangeable !", "el a pray-pa-RAY uhn PLAH", "…she cooked something inedible!"], ["5. En général, je fais la sieste après le déjeuner, mais hier… → je n'ai pas fait la sieste, j'ai travaillé.", "zhuh nay pah fay lah see-EST", "…I didn't have a nap, I worked."]], "note": "Each sentence sets a habit in the <strong>present</strong> then breaks it in the <strong>passé composé</strong> — exactly the contrast the whole lesson is built on."}]}, {"id": "ae-d4-delf", "label": "Dossier 4 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 96, complete. Maman's note with all six questions answered and every drawing identified, plus the box-office role play and the three show posters.", "art": null, "bookpages": ["p096"], "groups": [{"name": "Page 96 — Compréhension des écrits (7 points)", "items": [["Compréhension des écrits — 7 points", "lah kohm-pray-ahn-see-OHN day zay-KREE", "Reading comprehension — 7 points"], ["Lisez le message puis répondez aux questions.", "lee-ZAY luh muh-SAHZH pwee ray-pohn-DAY", "Read the message then answer the questions."], ["Mes chéris,", "may shay-REE", "My darlings,"], ["Je vais travailler tard aujourd'hui, mangez sans moi.", "zhuh vay tra-va-YAY TAR oh-zhoor-DWEE, mahn-ZHAY sahn MWAH", "I'm going to work late today, eat without me."], ["Olivier, prépare le dîner. Jeanne, fais la vaisselle.", "o-lee-vee-AY, pray-PAR luh dee-NAY. ZHAN, fay lah vay-SELL", "Olivier, make dinner. Jeanne, do the washing-up."], ["Après, il y a votre série préférée !", "a-PRAY, eel ee a VOT-ruh say-REE pray-fay-RAY", "Afterwards, your favourite series is on!"], ["Je rentre vers 22 heures.", "zhuh RAHN-truh vair van-duh ZUR", "I'll be home around 10."], ["Bonne soirée !", "bun swa-RAY", "Have a good evening!"], ["Bisous, Maman", "bee-ZOO, ma-MAHN", "Kisses, Mum"]]}, {"name": "Page 96 — les six questions et leurs réponses", "items": [["1. C'est un message : a. familial / b. professionnel / c. amical → A. FAMILIAL", "fa-mee-lee-AL", "A family message — 'Mes chéris', signed Maman."], ["2. Quelle est la relation entre Olivier et Jeanne ? → Ils sont frère et sœur.", "eel sohn frair ay SUR", "They're brother and sister — both children of the writer."], ["3. Ce message est pour : a. le matin / b. l'après-midi / c. le soir → C. LE SOIR", "luh SWAHR", "The evening — dinner, the series, and she's back at 10."], ["4. Aujourd'hui, Olivier et Jeanne dînent : a. avec leur père / b. seuls / c. avec leur mère → B. SEULS", "SUL", "Alone — 'mangez sans moi'."], ["5. Quelles instructions donne le message ? (2 réponses) → C. préparer le dîner (faire la cuisine) et E. faire la vaisselle.", "… duh ray-POHNSS", "Two instructions: make dinner and do the washing-up."], ["dessin a : une fille qui fait ses devoirs", "ewn FEE kee fay say duh-VWAHR", "a girl doing homework"], ["dessin b : un garçon qui fait les courses", "uhn gar-SOHN kee fay lay KOORSS", "a boy doing the shopping"], ["dessin c : quelqu'un qui fait la cuisine", "kel-KUHN kee fay lah kwee-ZEEN", "someone cooking — ANSWER"], ["dessin d : un garçon qui passe l'aspirateur", "… kee pahss las-pee-ra-TUR", "a boy vacuuming"], ["dessin e : une fille qui fait la vaisselle", "… kee fay lah vay-SELL", "a girl washing up — ANSWER"], ["dessin f : une fille qui met la table", "… kee may lah TAH-bluh", "a girl laying the table"], ["6. Olivier et Jeanne peuvent : a. aller sur Internet / b. voir des amis / c. regarder la télévision → C. REGARDER LA TÉLÉVISION", "ruh-gar-DAY lah tay-lay-vee-zee-OHN", "Watch television — 'il y a votre série préférée'."]]}, {"name": "Page 96 — Production orale (13 points)", "items": [["Production orale — 13 points", "lah pro-dewk-see-OHN o-RAL", "Oral production — 13 points"], ["Dialogue simulé", "dee-a-LOG see-mew-LAY", "Role play"], ["Vous êtes à l'accueil d'une salle de spectacle.", "voo zet a la-KUH-yuh dewn sal duh spek-TAH-kluh", "You're at the box office of a theatre."], ["Vous parlez avec un(e) employé(e) de la salle.", "voo par-LAY a-vek uh nahm-plwa-YAY", "You speak with a member of staff."], ["Choisissez un spectacle. Demandez le jour, l'heure et le prix.", "shwa-zee-SAY uhn spek-TAH-kluh. duh-mahn-DAY luh ZHOOR, LUR ay luh PREE", "Choose a show. Ask the day, the time and the price."], ["Réservez pour vous et vos amis et payez.", "ray-zair-VAY poor VOO ay vo za-MEE ay pay-YAY", "Book for yourself and your friends, and pay."], ["Jouez la scène à deux.", "zhoo-AY lah sen a DUH", "Act out the scene in pairs."]]}, {"name": "Page 96 — les trois affiches de spectacle", "items": [["CONCOURS D'HUMOUR — La grande finale", "kohn-KOOR dew-MOOR — lah grahnd fee-NAL", "COMEDY COMPETITION — The grand final"], ["Vous notez les candidats ! — EN MAI", "voo no-TAY lay kahn-dee-DAH — ahn MAY", "You score the contestants! — In May"], ["Naturellement — spectacle de danse contemporaine", "na-tew-rell-MAHN — spek-TAH-kluh duh dahnss kohn-tahm-po-REN", "Naturally — a contemporary dance show"], ["MAI-JUIN — compagnie de la lune", "may-ZHWAN — kohm-pa-NYEE duh lah LEWN", "May–June — the Lune company"], ["Jeunes talents du rock — EN JUIN", "zhuhn ta-LAHN dew ROK — ahn ZHWAN", "Young rock talents — In June"], ["1 journée, 5 groupes, 5 concerts", "ewn zhoor-NAY, sank GROOP, sank kohn-SAIR", "1 day, 5 bands, 5 concerts"]], "note": "Three shows to choose between: a <strong>comedy contest</strong>, a <strong>contemporary dance</strong> piece and a <strong>rock festival</strong> — one in May, one across May–June, one in June."}, {"name": "Le vocabulaire de l'examen", "items": [["la compréhension des écrits", "lah kohm-pray-ahn-see-OHN day zay-KREE", "reading comprehension"], ["la production orale", "lah pro-dewk-see-OHN o-RAL", "oral production"], ["un dialogue simulé", "uhn dee-a-LOG see-mew-LAY", "a role play"], ["une salle de spectacle", "ewn sal duh spek-TAH-kluh", "a theatre, a venue"], ["l'accueil", "la-KUH-yuh", "reception, the box office"], ["un spectacle", "uhn spek-TAH-kluh", "a show"], ["réserver", "ray-zair-VAY", "to book"], ["payer", "pay-YAY", "to pay"], ["un concours", "uhn kohn-KOOR", "a competition"], ["l'humour", "lew-MOOR", "humour"], ["une finale", "ewn fee-NAL", "a final"], ["la danse contemporaine", "lah dahnss kohn-tahm-po-REN", "contemporary dance"], ["une compagnie", "ewn kohm-pa-NYEE", "a company, a troupe"], ["un concert", "uhn kohn-SAIR", "a concert"], ["mettre la table", "MET-ruh lah TAH-bluh", "to lay the table"]], "cols": "two"}]}, {"id": "ae-d5l1", "label": "Dossier 5 · Leçon 1", "name": "Jour de fête", "summary": "Pages 97–101, complete. The festivals questionnaire, the three registers of question, six accounts matched to their photos and festivals, ten French festivals with their dates and rituals, and the -er/-ir verb families.", "art": null, "bookpages": ["p097", "p098", "p099", "p100", "p101"], "groups": [{"name": "Les enregistrements", "items": [], "note": "The 🎧 icons in Leçon 1, pages 98–99.", "tracks": [{"n": 126, "label": "p.98 act. 2 & 3 — l'enquêtrice interroge deux personnes"}, {"n": 127, "label": "p.99 act. 4 — phonétique, quelle partie est accentuée ?"}, {"n": 128, "label": "p.99 act. 4 — écoutez et répétez"}]}, {"name": "Page 97 — la page d'ouverture du dossier", "items": [["Dossier 5 — Temps forts", "tahn FOR", "Dossier 5 — High points"], ["Leçon 1 : Jour de fête", "zhoor duh FET", "Lesson 1: A day of celebration"], ["> Comprendre un questionnaire d'enquête", "kohm-PRAHN-druh uhn kes-tee-o-NAIR dahn-KET", "Understanding a survey questionnaire"], ["> Parler des rituels de fêtes", "par-LAY day ree-tew-ELL duh FET", "Talking about festival rituals"], ["Leçon 2 : Grande nouvelle !", "grahnd noo-VELL", "Lesson 2: Big news!"], ["> Téléphoner", "tay-lay-fo-NAY", "Telephoning"], ["> Donner des conseils", "do-NAY day kohn-SAY", "Giving advice"], ["Leçon 3 : Vie privée, vie publique", "vee pree-VAY, vee pew-BLEEK", "Lesson 3: Private life, public life"], ["> Évoquer des faits passés", "ay-vo-KAY day fay pa-SAY", "Referring to past events"], ["> Décrire physiquement une personne", "day-KREER fee-zeek-MAHN ewn pair-SUN", "Describing someone physically"], ["Carnet de voyage : Monstres sacrés", "kar-NAY duh vwa-YAHZH : MOHN-struh sa-KRAY", "Travel notebook: Sacred monsters"], ["Épreuve DELF A1", "ay-PRUV DELF", "DELF A1 exam paper"], ["Projet : Réaliser un reportage sur une flash mob", "ray-a-lee-ZAY uhn ruh-por-TAHZH", "Project: produce a report on a flash mob"], ["Phonie-graphie → activités 1 à 3 p. 192-193", "fo-nee-gra-FEE", "Sound-and-spelling"], ["Lexique thématique → p. 199-200", "lek-SEEK tay-ma-TEEK", "Thematic lexicon"]], "note": "The opener shows a night-time street festival with strings of lights, and a Christmas tree with coloured baubles — the two poles of the dossier, public celebration and family ritual. Note that from Dossier 5 the level marker changes to <strong>A2.1</strong>."}, {"name": "Page 98 — le questionnaire : Les Français et les fêtes", "items": [["Jour de fête", "zhoor duh FET", "A day of celebration"], ["Comprendre un questionnaire d'enquête", "kohm-PRAHN-druh uhn kes-tee-o-NAIR dahn-KET", "Understanding a survey questionnaire"], ["ENQUÊTE — LES FRANÇAIS ET LES FÊTES", "ahn-KET — lay frahn-SAY ay lay FET", "SURVEY — The French and festivals"], ["1. Quelle est votre fête préférée ?", "kel ay VOT-ruh fet pray-fay-RAY", "Which is your favourite festival?"], ["le réveillon du Nouvel An / la Saint-Sylvestre", "luh ray-vay-YOHN dew noo-vel AHN / lah san-seel-VES-truh", "New Year's Eve"], ["la Saint-Valentin", "lah san-va-lahn-TAN", "Valentine's Day"], ["Pâques", "PAHK", "Easter"], ["Noël", "no-ELL", "Christmas"], ["autre", "OH-truh", "other"], ["2. Où célébrez-vous cette fête en général ?", "oo say-lay-bray VOO set FET", "Where do you generally celebrate it?"], ["à la maison", "a lah may-ZOHN", "at home"], ["chez des amis", "shay day za-MEE", "at friends' houses"], ["chez une personne de votre famille", "shay ewn pair-SUN duh VOT-ruh fa-MEE", "at a relative's"], ["au restaurant", "oh res-to-RAHN", "at a restaurant"], ["à l'étranger", "a lay-trahn-ZHAY", "abroad"], ["3. Avec qui passez-vous cette fête ?", "a-vek KEE pa-say VOO", "Who do you spend it with?"], ["avec des amis", "a-vek day za-MEE", "with friends"], ["seul(e)", "SUL", "alone"], ["avec une/des personne(s) de votre famille", "a-vek ewn pair-SUN duh VOT-ruh fa-MEE", "with a relative or relatives"], ["4. Pourquoi aimez-vous spécialement cette fête ?", "poor-KWAH ay-may VOO spay-see-al-MAHN", "Why do you particularly like this festival?"], ["5. Que faites-vous à cette occasion ? Y a-t-il un rituel spécial ?", "kuh fet VOO a set o-ka-zee-OHN ? ee a TEEL uhn ree-tew-ELL spay-see-AL", "What do you do on the occasion? Is there a special ritual?"]], "cols": "two"}, {"name": "Page 98 — activités 1, 2 et 3", "items": [["Activité 1 : Observez le document et répondez.", "ob-sair-VAY luh do-kew-MAHN", "Look at the document and answer."], ["1. C'est : une publicité / un questionnaire d'enquête / un article de journal / le résultat d'une enquête", "say", "This is:"], ["→ un questionnaire d'enquête.", "uhn kes-tee-o-NAIR dahn-KET", "a survey questionnaire"], ["2. Quel est le thème ? → Les Français et les fêtes : la fête préférée, le lieu, les personnes, les raisons et les rituels.", "kel ay luh TEM", "What is the theme?"], ["Activité 2 : L'enquêtrice interroge deux personnes.", "lahn-kay-TREESS an-tay-ROZH duh pair-SUN", "The interviewer questions two people."], ["Écoutez les dialogues et notez les réponses aux questions 1 à 4 du questionnaire.", "… ay no-TAY lay ray-POHNSS", "Listen and note the answers to questions 1 to 4."], ["Activité 3 : Réécoutez les dialogues. Repérez pour chaque question du questionnaire comment l'enquêtrice demande les informations.", "ruh-pay-RAY … ko-MAHN lahn-kay-TREESS duh-MAHND", "Note how the interviewer asks for each piece of information."], ["une enquêtrice / un enquêteur", "ewn ahn-kay-TREESS / uh nahn-kay-TUR", "an interviewer"], ["interroger", "an-tay-ro-ZHAY", "to question, to interview"]]}, {"name": "Page 98 — Aide-mémoire : indiquer le domicile", "items": [["Mes amis viennent chez moi.", "may za-MEE vee-EN shay MWAH", "My friends come to my place."], ["Je vais chez mes amis.", "zhuh vay shay may za-MEE", "I'm going to my friends'."], ["Attention ! Je vais chez le médecin / le dentiste / le coiffeur.", "zhuh vay shay luh mayd-SAN / luh dahn-TEEST / luh kwa-FUR", "I'm going to the doctor's / the dentist's / the hairdresser's."]], "note": "<strong>chez</strong> is used with a <em>person</em>, never a place: <em>chez moi</em>, <em>chez le médecin</em> — but <em>à la maison</em>, <em>au restaurant</em>. It's the equivalent of English's possessive 's — 'at the doctor's'."}, {"name": "Page 99 — Point Langue : poser des questions, les six exemples", "items": [["a) Observez et répondez.", "ob-sair-VAY ay ray-pohn-DAY", "Observe and answer."], ["Questionnaire : Quelle est votre fête préférée ? → Dialogues : Quelle est votre fête préférée ?", "kel ay VOT-ruh fet pray-fay-RAY", "Identical in both — see rule c."], ["Questionnaire : Où passez-vous cette fête ? → Vous passez cette fête où ? / Où est-ce que vous passez cette fête ?", "oo pa-say VOO … voo pa-SAY set fet OO … oo es-kuh voo pa-SAY", "Where do you spend this festival?"], ["Questionnaire : Avec qui passez-vous cette fête ? → Vous passez cette fête avec qui ? / Avec qui est-ce que vous passez cette fête ?", "a-vek KEE pa-say VOO … a-vek kee es-kuh", "Who with?"], ["Questionnaire : Pourquoi aimez-vous cette fête ? → Pourquoi vous aimez cette fête ? / Pourquoi est-ce que vous aimez cette fête ?", "poor-KWAH ay-may VOO … poor-kwah es-kuh", "Why?"], ["Questionnaire : Que faites-vous à cette occasion ? → Vous faites quoi à cette occasion ? / Qu'est-ce que vous faites à cette occasion ?", "kuh fet VOO … voo fet KWAH … kes-kuh voo FET", "What do you do?"], ["Questionnaire : Y a-t-il un rituel spécial ? → Il y a un rituel spécial ? / Est-ce qu'il y a un rituel spécial ?", "ee a TEEL … eel ee a … es-KEEL ee a", "Is there a special ritual?"]], "note": "Note the crucial change of form: <strong>que</strong> at the start becomes <strong>quoi</strong> at the end — <em>Que faites-vous ?</em> but <em>Vous faites quoi ?</em>", "cols": "two"}, {"name": "Page 99 — les trois registres de question", "items": [["À l'écrit ou en situation formelle, le mot interrogatif est : AU DÉBUT DE LA PHRASE.", "oh day-BEW duh lah FRAZ", "In writing or formally, the question word comes at the start."], ["À l'oral ou en situation informelle, le mot interrogatif est : CELA DÉPEND, AU DÉBUT OU À LA FIN.", "suh-LAH day-PAHN", "In speech or informally, it can be at the start or the end."], ["b) Questions ouvertes — à l'écrit / en situation formelle : MOT INTERROGATIF + VERBE + SUJET ?", "mo an-tay-ro-ga-TEEF plew VAIRB plew sew-ZHAY", "Open questions, formal: question word + verb + subject."], ["Exemple : Où passez-vous cette fête ?", "oo pa-say VOO", "the inversion form"], ["Questions ouvertes — à l'oral / en situation informelle : MOT INTERROGATIF + EST-CE QUE + SUJET + VERBE ?", "… plew es-kuh plew sew-ZHAY plew VAIRB", "Open questions, informal, form 1."], ["…ou SUJET + VERBE + MOT INTERROGATIF ?", "sew-ZHAY plew vairb plew mo an-tay-ro-ga-TEEF", "Open questions, informal, form 2."], ["Questions fermées (réponse oui/non) — à l'écrit / formelle : VERBE + SUJET ?", "VAIRB plew sew-ZHAY", "Closed questions, formal: verb + subject."], ["Exemple : Y a-t-il un rituel spécial ?", "ee a TEEL", "the inversion form"], ["Questions fermées — à l'oral / informelle : SUJET + VERBE ? (intonation montante)", "sew-ZHAY plew VAIRB … an-to-na-see-OHN mohn-TAHNT", "Closed questions, informal: subject + verb with rising intonation."], ["…ou EST-CE QUE + SUJET + VERBE ?", "es-kuh plew sew-ZHAY plew VAIRB", "or est-ce que + subject + verb."], ["c) Vrai ou faux ? Pour les questions qui commencent par Quel(le) est ? / Quel(le)s sont, il y a une seule formulation à l'oral et à l'écrit. → VRAI", "ewn sul for-mew-la-see-OHN", "TRUE — there's only one form for these, spoken or written."]], "note": "Three levels of formality for the same question: <strong>Où passez-vous… ?</strong> (formal, inversion) · <strong>Où est-ce que vous passez… ?</strong> (neutral) · <strong>Vous passez… où ?</strong> (casual speech)."}, {"name": "Page 99 — activités 4 et 5", "items": [["Activité 4 Phonétique a) Écoutez et répondez. Quelle partie de la question est accentuée ?", "kel par-TEE duh lah kes-tee-OHN ay tak-sahn-tew-AY", "Which part of the question is stressed?"], ["b) Réécoutez et choisissez la réponse correcte. L'accentuation avec intonation montante se fait :", "lak-sahn-tew-a-see-OHN a-vek an-to-na-see-OHN mohn-TAHNT", "The stress with rising intonation falls:"], ["toujours à la fin de la question / toujours au début de la question / toujours sur le mot interrogatif", "too-ZHOOR a lah FAN duh lah kes-tee-OHN", "always at the end / always at the start / always on the question word"], ["→ toujours sur le mot interrogatif.", "too-ZHOOR sewr luh mo an-tay-ro-ga-TEEF", "always on the question word"], ["c) Écoutez et répétez.", "ay-koo-TAY ay ray-pay-TAY", "Listen and repeat."], ["Activité 5 : En petits groupes, vous préparez une enquête pour la nouvelle édition de Francoscopie.", "ahn puh-TEE GROOP, voo pray-pa-RAY ewn ahn-KET", "In small groups, prepare a survey for the new edition of Francoscopie."], ["1. Choisissez un thème pour votre enquête : Les Français et les vacances – Les Français et les rythmes de vie – Les Français et les voyages – …", "shwa-zee-SAY uhn TEM", "Choose a theme for your survey."], ["2. Rédigez le questionnaire.", "ray-dee-ZHAY luh kes-tee-o-NAIR", "Draft the questionnaire."], ["FRANCOSCOPIE — Gérard Mermet — Tout sur les Français", "frahn-ko-sko-PEE — zhay-RAR mair-MAY", "the reference book pictured"], ["l'individu · la famille · la société · le travail · l'argent · les loisirs — LAROUSSE", "lan-dee-vee-DEW · lah fa-MEE · lah so-see-ay-TAY · luh tra-VIGH · lar-ZHAHN · lay lwa-ZEER", "its six sections, listed on the cover"]], "note": "<em>Francoscopie</em> is a real book — a periodically updated survey of French society, and the source of many of the statistics used in this coursebook."}, {"name": "Page 100 — l'article de Modes de vie", "items": [["Parler des rituels de fêtes", "par-LAY day ree-tew-ELL duh FET", "Talking about festival rituals"], ["Modes de vie n° 18 — Dossier : Les fêtes dans le monde", "mod duh VEE — lay FET dahn luh MOHND", "Lifestyles no. 18 — Feature: Festivals around the world"], ["Les Français et les fêtes — Vive la tradition !", "VEEV lah tra-dee-see-OHN", "The French and festivals — Long live tradition!"], ["À l'approche des fêtes de fin d'année, notre magazine a fait une enquête.", "a la-PROSH day fet duh fan da-NAY", "As the end-of-year festivities approach, our magazine ran a survey."], ["Les Français aiment les fêtes et respectent la tradition ! Quelques témoignages.", "… ay res-PEKT lah tra-dee-see-OHN", "The French love festivals and respect tradition! Some accounts."], ["Activité 6 : Écoutez la suite de l'enquête sur « Les Français et les fêtes » et notez la réponse de chaque personne à la question 5.", "ay-koo-TAY lah SWEET duh lahn-KET", "Listen to the rest of the survey and note each person's answer to question 5."], ["Activité 7 : Lisez l'article du magazine Modes de vie et répondez.", "lee-ZAY lar-TEE-kluh", "Read the magazine article and answer."], ["1. Quel est le lien avec les deux témoignages entendus ?", "kel ay luh lee-AN", "What's the link with the two recorded accounts?"], ["2. À quelle période de l'année est-ce que l'article est publié ?", "a kel pay-ree-OD duh la-NAY", "At what time of year is the article published?"], ["→ À l'approche des fêtes de fin d'année, donc en novembre ou décembre.", "… ahn no-VAHM-bruh oo day-SAHM-bruh", "Just before the end-of-year holidays — November or December."], ["3. Que représentent les photos ?", "kuh ruh-pray-ZAHNT lay fo-TO", "What do the photos show?"], ["Activité 8 : Relisez l'article et associez chaque témoignage à une photo. Citez la fête concernée.", "… ay a-so-see-AY shak tay-mwa-NYAHZH a ewn fo-TO", "Match each account to a photo and name the festival."]]}, {"name": "Page 100 — les six témoignages", "items": [["Marc, 50 ans, Nancy : « J'aime cette jolie tradition du 1er mai : on offre du muguet à sa famille et ses amis.", "… lah tra-dee-see-OHN dew pruh-mee-AY MAY : oh NO-fruh dew mew-GAY", "I love this pretty 1 May tradition: you give lily of the valley to family and friends."], ["Et c'est une fête “sérieuse” aussi, les syndicats de travailleurs défilent. »", "lay san-dee-KAH duh tra-va-YUR day-FEEL", "And it's a 'serious' festival too — the trade unions march."], ["→ photo e : le muguet, « Je porte bonheur » — la fête du Travail, le 1er mai.", "luh mew-GAY … zhuh port bo-NUR", "photo e — May Day"], ["Assia, 25 ans, Grenoble : « Avec mon chéri, on sort le soir, on choisit un bon restaurant. Et on s'offre des petits cadeaux. »", "a-vek mohn shay-REE, ohn sor luh SWAHR … ohn SO-fruh day puh-TEE ka-DO", "With my sweetheart we go out in the evening, choose a good restaurant. And we give each other little presents."], ["→ photo c : « Bonne Saint-Valentin », un gâteau en forme de cœur — la Saint-Valentin, le 14 février.", "bun san-va-lahn-TAN", "photo c — Valentine's Day"], ["Paula, 41 ans, Paris : « J'adore le 14 juillet ! Le feu d'artifice de la tour Eiffel est toujours magnifique,", "zha-DOR luh ka-TORZ zhwee-YAY ! luh fuh dar-tee-FEESS", "I love the 14th of July! The Eiffel Tower fireworks are always magnificent,"], ["et après il y a les bals des pompiers. Une super ambiance ! »", "… lay bal day pohm-pee-AY. ewn sew-pair ahn-bee-AHNSS", "and afterwards there are the firemen's balls. A great atmosphere!"], ["→ photo f : la foule et les lumières — la fête Nationale, le 14 juillet.", "lah fet na-see-o-NAL", "photo f — Bastille Day"], ["Maël, 20 ans, Rennes : « À minuit, on s'embrasse sous le gui, on trinque avec du champagne,", "a mee-NWEE, ohn sahm-BRAHSS soo luh GEE, ohn TRANK", "At midnight we kiss under the mistletoe, we clink glasses with champagne,"], ["les gens se souhaitent une bonne année… »", "lay zhahn suh soo-ETT ewn bun a-NAY", "people wish each other a happy new year…"], ["→ photo d : le gui, « Bonne année » — la Saint-Sylvestre et le Nouvel An, le 31 décembre et le 1er janvier.", "luh GEE, bun a-NAY", "photo d — New Year"], ["Paul, 65 ans, Saint-Émilion : « À Pâques, toute la famille est réunie, mes petits-enfants cherchent les œufs en chocolat cachés dans le jardin. »", "a PAHK, toot lah fa-MEE ay ray-ew-NEE … lay zuh ahn sho-ko-LAH ka-SHAY", "At Easter the whole family gets together, my grandchildren hunt for chocolate eggs hidden in the garden."], ["→ photo b : « joyeuses pâques », un panier d'œufs — Pâques, en mars ou en avril.", "zhwa-YUHZ PAHK", "photo b — Easter"], ["Léa, 6 ans, Bordeaux : « À la maison, on décore le sapin ! Le jour de Noël, on ouvre les cadeaux", "a lah may-ZOHN, ohn day-KOR luh sa-PAN ! … oh NOO-vruh lay ka-DO", "At home we decorate the tree! On Christmas Day we open the presents"], ["et il y a toujours un bon repas avec toute la famille ; on mange plein de chocolats ! »", "… ohn mahnzh plan duh sho-ko-LAH", "and there's always a good meal with the whole family; we eat loads of chocolate!"], ["→ photo a : « Joyeux Noël », le sapin décoré — Noël, le 25 décembre.", "zhwa-YUH no-ELL", "photo a — Christmas"]], "note": "Six accounts, six photos, six festivals — the answers to activity 8 in full: <strong>Marc→e, Assia→c, Paula→f, Maël→d, Paul→b, Léa→a</strong>."}, {"name": "Page 100 — Point Culture : quelques fêtes et traditions", "items": [["A. Associez les dates et les fêtes.", "a-so-see-AY lay DAT ay lay FET", "Match the dates to the festivals."], ["le 31 décembre et le 1er janvier → la Saint-Sylvestre et le Nouvel An", "lah san-seel-VES-truh ay luh noo-vel AHN", "New Year's Eve and New Year's Day"], ["le 6 janvier → l'Épiphanie ou « Fête des rois »", "lay-pee-fa-NEE oo fet day RWAH", "Epiphany, or Kings' Day"], ["le 2 février (40 jours après Noël) → la Chandeleur", "lah shahn-duh-LUR", "Candlemas"], ["le 14 février → la Saint-Valentin", "lah san-va-lahn-TAN", "Valentine's Day"], ["en février ou en mars (40 jours avant Pâques) → Mardi gras", "mar-DEE GRAH", "Shrove Tuesday"], ["en mars ou en avril (entre le 22 mars et le 25 avril) → Pâques", "PAHK", "Easter"], ["le 1er mai → la fête du Travail", "lah fet dew tra-VIGH", "Labour Day"], ["le dernier dimanche de mai → la fête des Mères", "lah fet day MAIR", "Mother's Day"], ["le 14 juillet → la fête Nationale", "lah fet na-see-o-NAL", "Bastille Day"], ["le 25 décembre → Noël", "no-ELL", "Christmas"]], "cols": "two"}, {"name": "Page 100 — Point Culture : les rituels", "items": [["B. Dites à quelles fêtes correspondent les traditions et rituels suivants.", "… kel FET ko-res-POHND", "Say which festivals these traditions belong to."], ["Les enfants se déguisent. Dans certaines villes, il y a un grand carnaval (Dunkerque, Nice). → MARDI GRAS", "lay zahn-FAHN suh day-GEEZ … uhn grahn kar-na-VAL", "Children dress up; some cities hold a big carnival."], ["On prépare des crêpes. → LA CHANDELEUR", "ohn pray-PAR day KREP", "People make pancakes."], ["On offre un cadeau à sa maman. → LA FÊTE DES MÈRES", "oh NO-fruh uhn ka-DO a sa ma-MAHN", "You give your mother a present."], ["On partage la galette des rois ; la personne qui trouve la fève est le roi ou la reine. → L'ÉPIPHANIE", "ohn par-TAHZH lah ga-LETT day RWAH … lah FEV ay luh RWAH oo lah REN", "People share the kings' cake; whoever finds the charm is king or queen."], ["C. Dites si ces dix fêtes existent dans votre pays et si elles sont à la même date.", "… a lah mem DAT", "Say whether these ten festivals exist in your country and on the same date."], ["se déguiser", "suh day-gee-ZAY", "to dress up in costume"], ["une crêpe", "ewn KREP", "a pancake"], ["la galette des rois", "lah ga-LETT day RWAH", "the kings' cake"], ["une fève", "ewn FEV", "the charm hidden in the cake"]]}, {"name": "Page 101 — Point Langue : les verbes en -er et en -ir", "items": [["a) Observez les phrases suivantes extraites des témoignages et trouvez les infinitifs des verbes.", "… ay troo-VAY lay zan-fee-nee-TEEF", "Find the infinitives of the verbs."], ["On danse, on s'amuse. → danser, s'amuser", "dahn-SAY, sa-mew-ZAY", "to dance, to have fun"], ["J'envoie des textos aux amis. → envoyer", "ahn-vwa-YAY", "to send"], ["On ouvre les cadeaux. → ouvrir", "oo-VREER", "to open"], ["J'aime cette tradition. → aimer", "ay-MAY", "to like"], ["On s'offre des cadeaux. → s'offrir", "so-FREER", "to give each other"], ["On sort le soir. → sortir", "sor-TEER", "to go out"], ["On choisit un bon restaurant. → choisir", "shwa-ZEER", "to choose"], ["b) Rappel : les verbes réguliers en -er ont une base identique pour toutes les personnes. C'est la base de l'infinitif. → danser, aimer, s'amuser", "ewn bahz ee-dahn-TEEK", "regular -er verbs keep one stem throughout"], ["Les verbes en -yer ont deux bases : une base avec -y pour « nous » et « vous » et une base avec -i pour les autres personnes. → payer, envoyer", "… duh BAHZ", "-yer verbs have two stems: y for nous/vous, i elsewhere"], ["Certains verbes en -ir sont conjugués comme des verbes réguliers en -er : la base de l'infinitif + les terminaisons e, es, e, ons, ez, ent. → ouvrir, offrir, découvrir", "… lay tair-mee-nay-ZOHN", "some -ir verbs conjugate like -er verbs"]], "note": "<strong>ouvrir</strong> and <strong>offrir</strong> look like -ir verbs but behave like -er ones: <em>j'ouvre, tu ouvres, il ouvre</em> — not <em>j'ouvris</em>."}, {"name": "Page 101 — les conjugaisons : choisir et sortir", "items": [["c) Conjuguez découvrir et payer au présent.", "kohn-zhew-GAY … oh pray-ZAHN", "Conjugate découvrir and payer."], ["découvrir : je découvre, tu découvres, il découvre, nous découvrons, vous découvrez, ils découvrent", "zhuh day-KOO-vruh … noo day-koo-VROHN", "to discover — like an -er verb"], ["payer : je paie, tu paies, il paie, nous payons, vous payez, ils paient", "zhuh PAY … noo pay-YOHN … eel PAY", "to pay — two stems"], ["CHOISIR : je choisis", "zhuh shwa-ZEE", "I choose"], ["tu choisis", "tew shwa-ZEE", "you choose"], ["il / elle choisit", "eel shwa-ZEE", "he / she chooses"], ["nous choisissons", "noo shwa-zee-SOHN", "we choose"], ["vous choisissez", "voo shwa-zee-SAY", "you choose"], ["ils / elles choisissent", "eel shwa-ZEESS", "they choose"], ["* comme choisir : finir, réfléchir, réussir, grandir", "fee-NEER, ray-flay-SHEER, ray-ew-SEER, grahn-DEER", "to finish, to think, to succeed, to grow"], ["SORTIR : je sors", "zhuh SOR", "I go out"], ["tu sors", "tew SOR", "you go out"], ["il / elle sort", "eel SOR", "he / she goes out"], ["nous sortons", "noo sor-TOHN", "we go out"], ["vous sortez", "voo sor-TAY", "you go out"], ["ils / elles sortent", "eel SORT", "they go out"], ["** comme sortir : partir, dormir, servir", "par-TEER, dor-MEER, sair-VEER", "to leave, to sleep, to serve"]], "note": "Two families of -ir verb. <strong>choisir</strong> adds <em>-iss-</em> in the plural; <strong>sortir</strong> instead <em>drops</em> its final stem consonant in the singular — <em>je sors</em>, not <em>je sorts</em>.", "cols": "two"}, {"name": "Page 101 — Aide-mémoire : l'action réciproque et on", "items": [["Les verbes pronominaux pour exprimer une action réciproque", "… ewn ak-see-OHN ray-see-PROK", "Reflexive verbs for a reciprocal action"], ["On s'offre des cadeaux. = J'offre des cadeaux à mon chéri, mon chéri m'offre des cadeaux.", "oh NO-fruh day ka-DO", "We give each other presents."], ["On s'embrasse sous le gui.", "ohn sahm-BRAHSS soo luh GEE", "We kiss each other under the mistletoe."], ["Les gens se souhaitent une bonne année.", "lay zhahn suh soo-ETT ewn bun a-NAY", "People wish each other a happy new year."], ["Le pronom on a valeur générale", "luh pro-NOHN ohn a va-LUR zhay-nay-RAL", "The pronoun on with a general meaning"], ["On offre du muguet. = Les gens offrent du muguet.", "oh NO-fruh dew mew-GAY", "People give lily of the valley."]], "note": "Two different jobs for the same pronoun: here <strong>on</strong> means <em>people in general</em>, not <em>nous</em>. And the reflexive is <strong>reciprocal</strong> — each to the other, not to oneself."}, {"name": "Page 101 — activités 9, 10 et le projet", "items": [["Activité 9 : Faites une enquête dans la classe. Quelle est votre fête préférée ? Pourquoi ? Quels rituels correspondent à cette fête ?", "fet ewn ahn-KET dahn lah KLAHSS", "Run a survey in the class."], ["Utilisez le questionnaire p. 98.", "ew-tee-lee-ZAY luh kes-tee-o-NAIR", "Use the questionnaire on p.98."], ["Activité 10 : Vous présentez une fête importante de votre pays pour le dossier du magazine Modes de vie.", "voo pray-zahn-TAY ewn fet an-por-TAHNT", "Present an important festival from your country for the magazine feature."], ["En petits groupes, préparez les informations à donner : le nom de la fête, la date, les rituels.", "… luh NOHN duh lah FET, lah DAT, lay ree-tew-ELL", "Prepare the name, the date and the rituals."], ["Choisissez une photo pour illustrer votre présentation.", "shwa-zee-SAY ewn fo-TO", "Choose a photo to illustrate it."], ["Projet Dossier 5 — Tâche leçon 1 : Imaginer une flash mob.", "ee-ma-zhee-NAY ewn flash MOB", "Task: invent a flash mob."]]}, {"name": "Le vocabulaire de la leçon", "items": [["une fête", "ewn FET", "a festival, a party"], ["une enquête", "ew nahn-KET", "a survey"], ["un questionnaire", "uhn kes-tee-o-NAIR", "a questionnaire"], ["un rituel", "uhn ree-tew-ELL", "a ritual"], ["une tradition", "ewn tra-dee-see-OHN", "a tradition"], ["célébrer", "say-lay-BRAY", "to celebrate"], ["le réveillon", "luh ray-vay-YOHN", "the New Year's Eve or Christmas Eve feast"], ["le Nouvel An", "luh noo-vel AHN", "New Year"], ["la Saint-Sylvestre", "lah san-seel-VES-truh", "New Year's Eve"], ["Pâques", "PAHK", "Easter"], ["Noël", "no-ELL", "Christmas"], ["le muguet", "luh mew-GAY", "lily of the valley"], ["le gui", "luh GEE", "mistletoe"], ["le sapin", "luh sa-PAN", "the Christmas tree"], ["un œuf en chocolat", "uh nuhf ahn sho-ko-LAH", "a chocolate egg"], ["un feu d'artifice", "uhn fuh dar-tee-FEESS", "fireworks"], ["un bal", "uhn BAL", "a dance, a ball"], ["un pompier", "uhn pohm-pee-AY", "a firefighter"], ["l'ambiance", "lahn-bee-AHNSS", "the atmosphere"], ["un syndicat", "uhn san-dee-KAH", "a trade union"], ["défiler", "day-fee-LAY", "to march, to parade"], ["trinquer", "tran-KAY", "to clink glasses"], ["s'embrasser", "sahm-bra-SAY", "to kiss"], ["se souhaiter", "suh soo-ay-TAY", "to wish each other"], ["offrir", "o-FREER", "to give (as a gift)"], ["décorer", "day-ko-RAY", "to decorate"], ["se déguiser", "suh day-gee-ZAY", "to dress up"], ["être réuni", "EH-truh ray-ew-NEE", "to be gathered together"], ["caché / cachée", "ka-SHAY", "hidden"], ["le domicile", "luh do-mee-SEEL", "the home address"]], "cols": "two"}]}, {"id": "ae-d5l2", "label": "Dossier 5 · Leçon 2", "name": "Grande nouvelle !", "summary": "Pages 102–105, complete. Yann's Mybook page and phone calls, the passé récent against the futur proche, the full telephone phrasebook, the routard.com advice page and forum, and the imperative of reflexive verbs.", "art": null, "bookpages": ["p102", "p103", "p104", "p105"], "groups": [{"name": "Les enregistrements", "items": [], "note": "The 🎧 icons in Leçon 2, pages 102–103.", "tracks": [{"n": 130, "label": "p.102 act. 2 & 3 — la conversation téléphonique de Yann"}, {"n": 131, "label": "p.103 act. 4 & 5 — les appels téléphoniques"}, {"n": 132, "label": "p.103 act. 6 — phonétique, mots identiques ou différents ?"}, {"n": 133, "label": "p.103 act. 6 — repérez la phrase entendue"}]}, {"name": "Page 102 — la page Mybook de Yann Lequérec", "items": [["Grande nouvelle !", "grahnd noo-VELL", "Big news!"], ["Téléphoner", "tay-lay-fo-NAY", "Telephoning"], ["Mybook — Recherche", "ruh-SHAIRSH", "the social network and its search box"], ["Yann Lequérec", "YAN luh
