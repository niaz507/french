r."], ["Vous allez bien ?", "voo za-lay bee-AN", "Are you well?"], ["Comment allez-vous ?", "ko-mahn ta-lay VOO", "How are you?"], ["Relation informelle — Saluer", "ruh-la-see-OHN an-for-MELL", "Informal — greeting"], ["Bonjour ! / Salut !", "bohn-ZHOOR / sa-LEW", "Hello! / Hi!"], ["Tu vas bien ?", "tew va bee-AN", "You OK?"], ["Ça va ?", "sa VA", "How's it going?"], ["Prendre congé — formel : Au revoir, madame.", "PRAHN-druh kohn-ZHAY … oh ruh-VWAHR", "Taking leave — formal"], ["Prendre congé — informel : Au revoir ! / Salut ! / Ciao !", "… sa-LEW / CHAO", "Taking leave — informal"], ["Bonne journée ! / Bonne soirée !", "bun zhoor-NAY / bun swa-RAY", "Have a good day! / Have a good evening!"], ["Bon week-end !", "bohn week-END", "Have a good weekend!"], ["À demain ! / À lundi !", "a duh-MAN / a luhn-DEE", "See you tomorrow! / See you Monday!"], ["Serrer la main.", "say-RAY lah MAN", "To shake hands."], ["Faire la bise.", "fair lah BEEZ", "To kiss on the cheek."], ["Faire un signe de la main.", "fair uhn SEEN-yuh duh lah MAN", "To wave."]], "note": "<strong>Salut</strong> is the one word that works both coming and going. The middle column — <em>Bonne journée, Bon week-end, À demain</em> — sits between formal and informal because it works in either.", "cols": "two"}, {"name": "Page 27 — Point Culture : l'usage de tu et de vous", "items": [["Repérez l'usage de tu et de vous dans les dialogues (activité 2) et complétez.", "ruh-pay-RAY lew-ZAHZH", "Spot how tu and vous are used in the dialogues and complete."], ["J'utilise TU pour parler à une personne dans une relation informelle (amicale, familiale, etc.).", "zhew-tee-LEEZ tew poor par-LAY", "I use tu to speak to one person informally — a friend, family."], ["J'utilise VOUS pour parler à une personne dans une relation formelle (commerciale, professionnelle ou hiérarchique, etc.) ;", "… for-MELL", "I use vous for one person in a formal relationship."], ["…à deux personnes ou plus, dans une relation formelle ou informelle.", "a duh pair-SUN oo PLEWSS", "…and for two or more people, formal or informal."]], "note": "The point that catches English speakers: <strong>vous</strong> is doing two jobs at once. It is the polite singular <em>and</em> the plural of any register — so a group of close friends is still <em>vous</em>."}, {"name": "Page 27 — activités 6 et 7", "items": [["Activité 6 Phonétique a) Écoutez et dites si la voix monte ou descend.", "… see lah vwah MOHNT oo day-SAHN", "Listen and say whether the voice rises or falls."], ["b) Question ou affirmation ? Écoutez et répondez.", "kes-tee-OHN oo a-feer-ma-see-OHN", "Question or statement? Listen and answer."], ["Exemple : À demain ? → question", "a duh-MAN", "rising voice = question"], ["À demain. → affirmation", "a duh-MAN", "falling voice = statement"], ["c) Réécoutez et répétez.", "ray-ay-koo-TAY ay ray-pay-TAY", "Listen again and repeat."], ["d) Lisez les phrases suivantes :", "lee-ZAY lay FRAZ", "Read the following sentences:"], ["1. Elle est française. / Elle est française ?", "el ay frahn-SEZ", "statement ↘ / question ↗"], ["2. Il est mexicain ? / Il est mexicain.", "ee lay mek-see-KAN", "question ↗ / statement ↘"], ["3. Ça va ? / Ça va.", "sa VA", "question ↗ / statement ↘"], ["Activité 7 : Jouez la scène. En petits groupes, imaginez trois situations différentes : quand ? type de relation ? saluer ou prendre congé ? Jouez les scènes devant la classe.", "zhoo-AY lah SEN", "Act out the scene."]], "note": "This is the single cheapest question form in French: change nothing, just let your voice rise at the end."}, {"name": "Page 28 — Se présenter : le site Interlingua", "items": [["Se présenter", "suh pray-zahn-TAY", "Introducing yourself"], ["www.interlingua.com", "…", "the website in the activity"], ["Interlingua — Apprendre et pratiquer les langues avec une communauté mondiale", "a-PRAHN-druh ay pra-tee-KAY lay LAHNG a-vek ewn ko-mew-noh-TAY mohn-dee-AL", "Learn and practise languages with a worldwide community"], ["9 millions de personnes — 38 langues", "nuhf meel-YOHN duh pair-SUN — trahnt-wee LAHNG", "9 million people — 38 languages"], ["Inscription gratuite !", "an-skreep-see-OHN gra-TWEET", "Free registration!"], ["Votre langue maternelle : chinois", "VOT-ruh lahng ma-tair-NELL", "Your mother tongue: Chinese"], ["Autre langue : anglais", "OH-truh LAHNG", "Other language: English"], ["Vous apprenez : français", "voo za-pruh-NAY", "You are learning: French"], ["Votre âge : vous avez 20-30 ans", "VOT-ruh AHZH", "Your age: you are 20–30"], ["Votre adresse e-mail : pm23@gmail.com", "VOT-ruh a-DRESS", "Your email address"], ["Votre mot de passe", "VOT-ruh mo duh PAHSS", "Your password"], ["Confirmez votre mot de passe", "kohn-feer-MAY", "Confirm your password"], ["E-mail / Mot de passe / Se connecter", "suh ko-nek-TAY", "Email / Password / Log in"]]}, {"name": "Page 28 — activité 8 : vrai ou faux", "items": [["1. Interlingua est une école de langues. → FAUX", "ewn ay-KOL duh LAHNG", "It's a community website, not a school."], ["2. Les personnes utilisent Interlingua pour apprendre une langue étrangère. → VRAI", "… ewn lahng ay-trahn-ZHAIR", "True — that's the whole purpose."], ["3. C'est possible de pratiquer 45 langues avec Interlingua. → FAUX : 38 langues.", "… ka-rahnt-SANK LAHNG", "False — the site says 38."], ["4. L'inscription à Interlingua est gratuite. → VRAI", "lan-skreep-see-OHN … gra-TWEET", "True — 'Inscription gratuite !'"]]}, {"name": "Page 28 — le profil de Roberto Sanchez", "items": [["Nom : Roberto Sanchez — Âge : 23 ans", "ro-BAIR-to sahn-CHEZ", "Name and age"], ["Je suis mexicain, j'ai 23 ans.", "zhuh swee mek-see-KAN, zhay van-TWAH zahn", "I'm Mexican, I'm 23."], ["J'étudie le commerce international et, le samedi, j'apprends le chinois dans une école de langues.", "zhay-tew-DEE luh ko-MAIRSS an-tair-na-see-o-NAL … zha-PRAHN luh shee-NWAH", "I study international business and on Saturdays I learn Chinese at a language school."], ["Je suis bilingue : je parle espagnol et français.", "zhuh swee bee-LANG", "I'm bilingual: I speak Spanish and French."], ["Je ne parle pas bien anglais.", "zhuh nuh parl pah bee-a nahn-GLAY", "I don't speak English well."], ["Je voudrais : communiquer avec les gens ☑", "zhuh voo-DREH ko-mew-nee-KAY a-vek lay ZHAHN", "I'd like to: communicate with people"], ["Vos contacts : Ming (Chine), Sven (Norvège)", "vo kohn-TAKT", "His contacts"]]}, {"name": "Page 28 — le profil de Ming Pei", "items": [["Nom : Ming Pei — Âge : 26 ans", "meeng PAY", "Name and age"], ["J'ai 26 ans, je suis chinoise.", "zhay van-see zahn, zhuh swee shee-NWAHZ", "I'm 26, I'm Chinese."], ["J'étudie l'économie.", "zhay-tew-DEE lay-ko-no-MEE", "I study economics."], ["Je parle chinois et anglais ; j'apprends le français.", "zhuh parl shee-NWAH ay ahn-GLAY", "I speak Chinese and English; I'm learning French."], ["J'étudie à l'université tous les jours mais je n'ai pas cours les mardis et jeudis après-midi ;", "… too lay ZHOOR may zhuh nay pah KOOR", "I study at university every day but I have no classes on Tuesday and Thursday afternoons;"], ["je ne travaille pas le week-end.", "zhuh nuh tra-VIGH pah luh week-END", "I don't work at the weekend."], ["Je cherche des personnes pour communiquer en anglais et en français, en direct sur Interlingua.", "zhuh SHAIRSH day pair-SUN … ahn dee-REKT", "I'm looking for people to talk with in English and French, live on Interlingua."], ["Je voudrais : aider les autres à apprendre ma langue ☑ / communiquer avec les gens ☑", "ay-DAY lay ZO-truh", "I'd like to help others learn my language, and communicate with people"], ["Vos contacts : Roberto (Mexique)", "…", "Her contact"]]}, {"name": "Page 28 — le profil de Sven Kristiansen", "items": [["Nom : Sven Kristiansen — Âge : 23 ans", "sven krees-tee-AHN-sen", "Name and age"], ["Ma nationalité : je suis norvégien.", "ma na-see-o-na-lee-TAY : zhuh swee nor-vay-zhee-AN", "My nationality: I'm Norwegian."], ["Mon âge : 23 ans.", "moh NAHZH", "My age: 23."], ["Mes études : les langues et la littérature.", "may zay-TEWD : lay LAHNG ay lah lee-tay-ra-TEWR", "My studies: languages and literature."], ["Je parle norvégien, anglais, allemand et français ; j'apprends l'espagnol.", "zhuh parl nor-vay-zhee-AN …", "I speak Norwegian, English, German and French; I'm learning Spanish."], ["J'étudie le matin, je n'ai pas cours l'après-midi.", "zhay-tew-DEE luh ma-TAN", "I study in the morning, I have no classes in the afternoon."], ["À bientôt sur Interlingua !", "a bee-an-TO", "See you soon on Interlingua!"], ["Je voudrais : aider les autres à apprendre ma langue ☑ / communiquer avec les gens ☑", "…", "What he'd like"], ["Vos contacts : Roberto (Mexique)", "…", "His contact"]]}, {"name": "Page 28 — activité 9 : les réponses", "items": [["1. Identifiez le profil qui correspond à l'inscription sur la page d'accueil.", "… lah pahzh da-KUH-yuh", "Which profile matches the registration form?"], ["→ C'est Ming Pei : langue maternelle chinois, autre langue anglais, apprend le français, 20-30 ans.", "say meeng PAY", "The form says Chinese / English / learning French / aged 20-30 — that is Ming."], ["2. Dites pourquoi Roberto communique avec Ming et Sven.", "poor-KWAH ro-BAIR-to ko-mew-NEEK", "Why does Roberto talk to Ming and Sven?"], ["→ Roberto apprend le chinois et Ming est chinoise ; il veut communiquer avec les gens, et Sven aussi.", "…", "He's learning Chinese and Ming is Chinese; both he and Sven want to communicate."], ["3. Dites qui vous voulez contacter (Roberto, Ming ou Sven ?) sur Interlingua. Justifiez.", "… zhews-tee-fee-AY", "Say who you'd contact and why."]]}, {"name": "Page 29 — activité 10 : associez les informations", "items": [["Associez les informations aux personnes : Roberto – Ming – Sven.", "a-so-see-AY lay zan-for-ma-see-OHN", "Match the information to the people."], ["1. Ils ont 23 ans. → Roberto et Sven", "eel zohn van-TWAH zahn", "They are 23."], ["2. Il étudie les langues. → Sven", "ee lay-tew-DEE lay LAHNG", "He studies languages."], ["3. Ils ne sont pas français. → Roberto, Ming et Sven", "eel nuh sohn pah frahn-SAY", "They are not French — all three."], ["4. Elle a cours à l'université tous les matins. → Ming", "el a koor a lew-nee-vair-see-TAY", "She has class at university every morning."], ["5. Ils n'ont pas cours le mardi après-midi. → Ming et Sven", "eel nohn pah KOOR", "They have no class on Tuesday afternoon."]]}, {"name": "Page 29 — Point Langue : le verbe avoir", "items": [["Complétez avec ont, ai, avez, a.", "kohm-play-TAY", "Complete with ont, ai, avez, a."], ["j'ai", "ZHAY", "I have"], ["tu as", "tew AH", "you have"], ["il / elle a", "ee LAH", "he / she has"], ["nous avons", "noo za-VOHN", "we have"], ["vous avez", "voo za-VAY", "you have"], ["ils / elles ont", "eel ZOHN", "they have"]], "cols": "three"}, {"name": "Page 29 — Point Langue : la négation ne… pas", "items": [["a) Observez.", "ob-sair-VAY", "Observe."], ["Je ne parle pas bien anglais.", "zhuh nuh parl pah bee-a nahn-GLAY", "I don't speak English well."], ["Je n'ai pas cours le mardi.", "zhuh nay pah KOOR luh mar-DEE", "I don't have class on Tuesday."], ["Je ne travaille pas le week-end.", "zhuh nuh tra-VIGH pah luh week-END", "I don't work at the weekend."], ["Ils ne sont pas français.", "eel nuh sohn pah frahn-SAY", "They aren't French."], ["b) Répondez : Ne ou n' se place AVANT le verbe.", "a-VAHN luh VAIRB", "ne / n' goes before the verb."], ["Pas se place APRÈS le verbe.", "a-PRAY luh VAIRB", "pas goes after the verb."], ["Ne devient n' devant une voyelle.", "nuh duh-vee-AN enn", "ne becomes n' before a vowel."]], "note": "The verb is sandwiched: <strong>ne</strong> + verb + <strong>pas</strong>. In speech the <em>ne</em> is very often dropped — <em>je parle pas anglais</em> — but you must write it."}, {"name": "Page 29 — Aide-mémoire : jours, âge, possessifs", "items": [["Les jours de la semaine", "lay zhoor duh lah suh-MEN", "The days of the week"], ["lundi", "luhn-DEE", "Monday"], ["mardi", "mar-DEE", "Tuesday"], ["mercredi", "mair-kruh-DEE", "Wednesday"], ["jeudi", "zhuh-DEE", "Thursday"], ["vendredi", "vahn-druh-DEE", "Friday"], ["samedi", "sam-DEE", "Saturday"], ["dimanche", "dee-MAHNSH", "Sunday"], ["Dire l'âge : J'ai 23 ans.", "zhay van-TWAH zahn", "Saying your age: I'm 23."], ["Ils ont 23 ans.", "eel zohn van-TWAH zahn", "They are 23."], ["L'adjectif possessif : mon nom, ma nationalité, mes études", "mohn NOHN, ma na-see-o-na-lee-TAY, may zay-TEWD", "my name, my nationality, my studies"], ["votre langue, votre âge, votre profil, vos contacts", "VOT-ruh LAHNG … vo kohn-TAKT", "your language, age, profile, contacts"]], "note": "French says <strong>j'ai 23 ans</strong> — literally <em>I have 23 years</em> — and the word <em>ans</em> can never be dropped the way English drops 'years old'.", "cols": "two"}, {"name": "Page 29 — activités 11 à 14", "items": [["Activité 11 Phonétique a) Écoutez et répétez.", "ay-koo-TAY ay ray-pay-TAY", "Listen and repeat."], ["b) [z] + ans ou [t] + ans ? Écoutez et répondez.", "… oo …", "Is it a z-liaison or a t-liaison before 'ans'?"], ["deux ans → [z]", "duh ZAHN", "2 → z sound"], ["trois ans → [z]", "trwah ZAHN", "3 → z sound"], ["six ans → [z]", "see ZAHN", "6 → z sound"], ["dix ans → [z]", "dee ZAHN", "10 → z sound"], ["vingt ans → [t]", "van TAHN", "20 → t sound"], ["cent ans → [t]", "sahn TAHN", "100 → t sound"], ["Activité 12 : En petits groupes, dites votre âge. Calculez la moyenne d'âge du groupe d'étudiants.", "… lah mwa-YEN DAHZH", "In small groups, give your age. Work out the group's average age."], ["Activité 13 a) Retrouvez dans la liste suivante les matières étudiées par Roberto, Ming et Sven.", "lay ma-tee-AIR ay-tew-dee-AY", "Find the subjects studied by Roberto, Ming and Sven."], ["les sciences politiques", "lay see-AHNSS po-lee-TEEK", "political science"], ["le commerce international → Roberto", "luh ko-MAIRSS an-tair-na-see-o-NAL", "international business"], ["la littérature → Sven", "lah lee-tay-ra-TEWR", "literature"], ["l'architecture", "lar-shee-tek-TEWR", "architecture"], ["la médecine", "lah mayd-SEEN", "medicine"], ["les langues → Sven", "lay LAHNG", "languages"], ["l'économie → Ming", "lay-ko-no-MEE", "economics"], ["b) Et vous, quelles matières étudiez-vous ? Quelle est votre matière préférée / spécialité ?", "kel ma-tee-AIR ay-tew-dee-ay VOO", "And you, what subjects do you study?"], ["Activité 14 a) Vous faites votre inscription sur Interlingua. Complétez votre profil.", "voo fet VOT-ruh an-skreep-see-OHN", "Register on Interlingua. Fill in your profile."], ["Précisez votre nom, votre âge, votre/vos langue(s), vos études.", "pray-see-ZAY", "Give your name, age, languages and studies."], ["Dites pourquoi vous utilisez Interlingua.", "deet poor-KWAH", "Say why you use Interlingua."], ["b) Regardez les profils Interlingua des autres étudiants et sélectionnez vos contacts. Justifiez.", "say-lek-see-o-NAY vo kohn-TAKT", "Look at the other students' profiles and choose your contacts."], ["Projet Dossier 1 — Pour faire la carte d'identité du groupe, vous allez : Tâche leçon 1 — Faire le trombinoscope du groupe.", "luh trohm-bee-no-SKOP", "Project: make the group's photo-board."]], "note": "Three options are offered on every profile: <em>apprendre une langue</em>, <em>aider les autres à apprendre ma langue</em>, <em>communiquer avec les gens</em>. A <strong>trombinoscope</strong> is the French word for a photo-board of faces and names."}], "bookpages": ["p025", "p026", "p027", "p028", "p029"]}, {"id": "ae-d1l2", "label": "Dossier 1 · Leçon 2", "name": "M comme médiathèque", "summary": "Pages 30–33, complete. Registering at the media library: asking politely, the indefinite article, quel in all four forms, the months, 70/80/90, French dialling codes, email addresses and punctuation.", "art": "quel", "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 2, in page order.", "tracks": [{"n": 34, "label": "p.30 act. 1 & 2 — le dialogue à la médiathèque"}, {"n": 35, "label": "p.30 act. 1 & 2 — le dialogue à la médiathèque"}, {"n": 36, "label": "p.31 act. 4, 5 & 6 — le formulaire de Diane"}, {"n": 37, "label": "p.31 act. 4, 5 & 6 — les questions de l'employé"}, {"n": 38, "label": "p.32 act. 8 — la prononciation de 70, 80, 90"}, {"n": 39, "label": "p.32 act. 9 — continuez à compter"}, {"n": 40, "label": "p.32 act. 10 — phonétique, la liaison"}, {"n": 41, "label": "p.32 act. 11 — notez les numéros de téléphone"}, {"n": 42, "label": "p.33 act. 12 — phonétique, dans quel ordre ?"}, {"n": 43, "label": "p.33 act. 14 — les adresses mail"}]}, {"name": "Page 30 — Demander des informations", "items": [["M comme médiathèque", "em kom may-dee-a-TEK", "M for media library"], ["Demander des informations", "duh-mahn-DAY day zan-for-ma-see-OHN", "Asking for information"], ["Activité 1 : Écoutez le dialogue et choisissez les réponses correctes.", "… shwa-zee-SAY lay ray-POHNSS ko-REKT", "Listen to the dialogue and choose the correct answers."], ["1. Où ? dans un magasin / dans une médiathèque / dans un bureau", "dahn zuhn ma-ga-ZAN / dahn zewn may-dee-a-TEK / dahn zuhn bew-RO", "Where? → dans une médiathèque"], ["2. Qui parle ? une cliente / une étudiante / une employée", "ewn klee-AHNT / ewn ay-tew-dee-AHNT / ewn ahm-plwa-YAY", "Who's speaking? → une étudiante"], ["3. À qui ? un employé / un étudiant / un vendeur", "uh nahm-plwa-YAY / uh nay-tew-dee-AHN / uhn vahn-DUR", "To whom? → un employé"], ["4. Pourquoi ? pour une inscription / pour un travail / pour un achat", "poor ew nan-skreep-see-OHN / poor uhn tra-VIGH / poor uh na-SHA", "Why? → pour une inscription"]], "note": "The photo shows four students at a media-library counter, one seated behind it. The answers follow from the setting: a student registering with an employee."}, {"name": "Page 30 — Aide-mémoire : demander poliment et le prix", "items": [["Demander poliment", "duh-mahn-DAY po-lee-MAHN", "Asking politely"], ["Je voudrais des informations, s'il vous plaît.", "zhuh voo-DREH day zan-for-ma-see-OHN, seel voo PLAY", "I'd like some information, please."], ["Demander le prix de quelque chose", "duh-mahn-DAY luh PREE duh kel-kuh SHOZ", "Asking the price of something"], ["Combien ça coûte ?", "kohm-bee-AN sa KOOT", "How much does it cost?"], ["Ça coûte combien ?", "sa koot kohm-bee-AN", "How much is it?"]], "note": "<strong>Je voudrais</strong> is the conditional of <em>vouloir</em>. It is the single most useful politeness formula in French — <em>je veux</em> (I want) sounds abrupt to the point of rudeness in a shop or an office."}, {"name": "Page 30 — activité 2 : les documents demandés", "items": [["Réécoutez le dialogue et dites quels documents ou éléments sont demandés.", "… kel do-kew-MAHN oo ay-lay-MAHN sohn duh-mahn-DAY", "Listen again and say which documents or items are asked for."], ["a. un billet de 20 euros", "uhn bee-YAY duh van tuh-RO", "a 20-euro note — the fee"], ["b. une photo", "ewn fo-TO", "a photo — a passport-style headshot"], ["c. une carte d'étudiant", "ewn kart day-tew-dee-AHN", "a student card"], ["Université de Strasbourg — carte étudiant", "ew-nee-vair-see-TAY duh straz-BOOR", "University of Strasbourg — student card"], ["Nom : Martinez — Prénom : Diane — Niveau : Licence", "nohn / pray-NOHN / nee-VO : lee-SAHNSS", "Surname / first name / level: Bachelor's"], ["d. un passeport", "uhn pas-POR", "a passport"], ["Union européenne — République française", "ew-nee-OHN uh-ro-pay-EN — ray-pew-BLEEK frahn-SEZ", "European Union — French Republic"]], "note": "Four items are pictured; the recording tells you which are actually required. Note that the student card already gives us the name <strong>Diane Martinez</strong>, which reappears on the registration form on page 31."}, {"name": "Page 30 — Point Langue : l'article indéfini", "items": [["Complétez avec un, une ou des.", "kohm-play-TAY a-vek", "Complete with un, une or des."], ["Masculin singulier : un formulaire d'inscription", "uhn for-mew-LAIR dan-skreep-see-OHN", "a registration form"], ["Féminin singulier : une pièce d'identité", "ewn pee-ESS dee-dahn-tee-TAY", "a piece of ID"], ["Masculin pluriel : des étudiants", "day zay-tew-dee-AHN", "students"], ["Féminin pluriel : des photos", "day fo-TO", "photos"]], "note": "<strong>des</strong> is the plural of both <em>un</em> and <em>une</em> — French has one plural indefinite article where English simply has none (<em>students</em>, not <em>some students</em>)."}, {"name": "Page 31 — Questionner sur l'identité : le formulaire", "items": [["Questionner sur l'identité", "kes-tee-o-NAY sewr lee-dahn-tee-TAY", "Asking about identity"], ["Médiathèque de la Ville et de la Communauté urbaine de Strasbourg", "may-dee-a-TEK duh lah VEEL ay duh lah ko-mew-noh-TAY ewr-BEN", "Media library of the City and Urban Community of Strasbourg"], ["Strasbourg.eu", "straz-BOOR", "the website address"], ["FORMULAIRE D'INSCRIPTION", "for-mew-LAIR dan-skreep-see-OHN", "REGISTRATION FORM"], ["Nom : MARTINEZ", "NOHN", "Surname"], ["Prénom : Diane", "pray-NOHN", "First name"], ["Date de naissance : … février 1995", "dat duh nay-SAHNSS", "Date of birth: February 1995"], ["Nationalité : française", "na-see-o-na-lee-TAY", "Nationality: French"], ["Adresse : … rue du Jura, Strasbourg", "a-DRESS", "Address: rue du Jura, Strasbourg"], ["Téléphone : … 29 18", "tay-lay-FON", "Telephone"]], "note": "The form is deliberately half-hidden under a spilled cup of coffee — that is the exercise. You reconstruct the missing fields from the recording."}, {"name": "Page 31 — activités 3, 4, 5", "items": [["Activité 3 : Lisez le formulaire et trouvez l'ordre des informations suivantes.", "… troo-VAY LOR-druh", "Read the form and find the order of the following information."], ["le nom de famille", "luh nohn duh fa-MEE", "the surname — 1st"], ["le prénom", "luh pray-NOHN", "the first name — 2nd"], ["la date de naissance", "lah dat duh nay-SAHNSS", "the date of birth — 3rd"], ["la nationalité", "lah na-see-o-na-lee-TAY", "the nationality — 4th"], ["l'adresse", "la-DRESS", "the address — 5th"], ["le numéro de téléphone", "luh new-may-RO duh tay-lay-FON", "the phone number — 6th"], ["Activité 4 : Écoutez le dialogue pour vérifier vos réponses.", "… poor vay-ree-fee-AY", "Listen to the dialogue to check your answers."], ["Activité 5 : Réécoutez le dialogue et complétez les informations de la fiche.", "… kohm-play-TAY lay zan-for-ma-see-OHN duh lah FEESH", "Listen again and complete the form."]]}, {"name": "Page 31 — activité 6 : les questions de l'employé", "items": [["Réécoutez le dialogue et retrouvez les questions de l'employé.", "ruh-troo-VAY lay kes-tee-OHN duh lahm-plwa-YAY", "Find the employee's questions."], ["Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO duh tay-lay-FON", "What's your phone number?"], ["Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "What's your date of birth?"], ["Quelle est votre adresse mail ?", "kel ay VOT-ruh a-DRESS mail", "What's your email address?"], ["Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO", "What are your phone numbers?"], ["Quelle est votre adresse ?", "kel ay VOT-ruh a-DRESS", "What's your address?"], ["Quelles sont vos coordonnées ?", "kel sohn vo ko-or-do-NAY", "What are your contact details?"]], "note": "All six are given as checkboxes; you tick the ones actually heard. Notice that every single one uses a form of <strong>quel</strong> — that is the point the Point Langue then formalises."}, {"name": "Page 31 — Point Langue : l'adjectif interrogatif quel", "items": [["a) Observez.", "ob-sair-VAY", "Observe."], ["Pour demander LE numéro de téléphone : Quel est votre numéro de téléphone ?", "KEL", "masculine singular → quel"], ["Pour demander LA date de naissance : Quelle est votre date de naissance ?", "KEL", "feminine singular → quelle"], ["Pour demander LES coordonnées : Quelles sont vos coordonnées ?", "KEL", "feminine plural → quelles"], ["b) Complétez et justifiez votre réponse.", "kohm-play-TAY ay zhews-tee-fee-AY", "Complete and justify."], ["1. Quel est votre nom ?", "kel ay VOT-ruh NOHN", "le nom is masculine singular → quel"], ["2. Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "la nationalité is feminine singular → quelle"], ["3. Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO", "les numéros is masculine plural → quels"]], "note": "Four spellings — <strong>quel · quelle · quels · quelles</strong> — and every one of them is pronounced <strong>kel</strong>. The spelling agrees with the noun that follows; the sound never changes."}, {"name": "Page 31 — Aide-mémoire : les mois de l'année", "items": [["janvier", "zhahn-vee-AY", "January"], ["février", "fay-vree-AY", "February"], ["mars", "MARSS", "March"], ["avril", "a-VREEL", "April"], ["mai", "MAY", "May"], ["juin", "ZHWAN", "June"], ["juillet", "zhwee-YAY", "July"], ["août", "OOT", "August"], ["septembre", "sep-TAHM-bruh", "September"], ["octobre", "ok-TO-bruh", "October"], ["novembre", "no-VAHM-bruh", "November"], ["décembre", "day-SAHM-bruh", "December"], ["Activité 7 : Échangez vos dates d'anniversaire et formez des groupes de personnes nées le même mois.", "ay-shahn-ZHAY vo dat da-nee-vair-SAIR", "Swap birthdays and group people born in the same month."]], "note": "Months are never capitalised in French. <strong>août</strong> is the odd one: most speakers say <em>OOT</em>, some say <em>a-OOT</em>.", "cols": "three"}, {"name": "Page 32 — activité 8 : 70, 80, 90", "items": [["Comprendre / Dire des coordonnées", "kohm-PRAHN-druh / deer day ko-or-do-NAY", "Understanding / giving contact details"], ["a) Écoutez la prononciation des nombres 70, 80 et 90.", "… lah pro-nohn-see-a-see-OHN", "Listen to how 70, 80 and 90 are pronounced."], ["b) Associez : 70 = soixante-dix", "swa-sahnt-DEESS", "70 = sixty-ten"], ["80 = quatre-vingts", "kat-ruh-VAN", "80 = four-twenties"], ["90 = quatre-vingt-dix", "kat-ruh-van-DEESS", "90 = four-twenties-ten"], ["c) Dites quelle est l'opération réalisée pour ces trois nombres : =, -, x ou : ?", "kel ay lo-pay-ra-see-OHN", "Say which operation makes each number."], ["Exemple : soixante-dix = soixante + dix (70)", "swa-SAHNT plew DEESS", "addition: 60 + 10"], ["quatre-vingts = quatre × vingt (80)", "katr fwah VAN", "multiplication: 4 × 20"], ["quatre-vingt-dix = quatre × vingt + dix (90)", "…", "multiplication then addition: 4 × 20 + 10"]], "note": "This is the arithmetic that makes French numbers famously awkward. Belgium and Switzerland avoid it with <em>septante</em> (70) and <em>nonante</em> (90), but France does not."}, {"name": "Page 32 — activités 9, 10 et l'aide-mémoire", "items": [["Activité 9 a) Écoutez et continuez à compter à chaque signal sonore.", "… a shak seen-YAL so-NOR", "Listen and carry on counting at each beep."], ["b) Est-ce que le mot « et » est utilisé pour former les nombres suivants ?", "es-kuh luh mo AY ay ew-tee-lee-ZAY", "Is the word 'et' used to form these numbers?"], ["71 = soixante et onze → OUI", "swa-sahnt-ay-ONZ", "71 — yes, with et"], ["72 = soixante-douze → NON", "swa-sahnt-DOOZ", "72 — no"], ["81 = quatre-vingt-un → NON", "kat-ruh-van-UHN", "81 — no et, unlike 21/31/41"], ["82 = quatre-vingt-deux → NON", "kat-ruh-van-DUH", "82 — no"], ["91 = quatre-vingt-onze → NON", "kat-ruh-van-ONZ", "91 — no"], ["92 = quatre-vingt-douze → NON", "kat-ruh-van-DOOZ", "92 — no"], ["Activité 10 Phonétique a) Vrai ou faux ?", "vray oo FO", "True or false?"], ["1. On fait toujours la liaison après vingt. → VRAI", "ohn fay too-ZHOOR lah lee-ay-ZOHN", "True: vingt-et-un, vingt-huit — the t is heard."], ["2. On ne fait pas la liaison après et. → VRAI", "ohn nuh fay pah lah lee-ay-ZOHN a-PRAY ay", "True: in 'vingt et un' there is no link after et."], ["b) Réécoutez l'enregistrement et répétez les nombres.", "ray-ay-koo-TAY lahn-ruh-zheestruh-MAHN", "Listen again and repeat the numbers."], ["Aide-mémoire — Les nombres : 100 → cent", "SAHN", "a hundred"], ["1 000 → mille", "MEEL", "a thousand"], ["1 000 000 → un million", "uhn meel-YOHN", "a million"]], "note": "The <strong>et</strong> rule in full: it appears only in <em>21, 31, 41, 51, 61</em> and <em>71</em>. Never in 81 or 91, and never with any other digit."}, {"name": "Page 32 — Point Culture : les numéros de téléphone", "items": [["Les numéros de téléphone", "lay new-may-RO duh tay-lay-FON", "Telephone numbers"], ["A. Observez les deux cartes de visite. Regardez les numéros de téléphone et la carte des indicatifs téléphoniques de France Telecom.", "… day kart duh vee-ZEET … lay zan-dee-ka-TEEF", "Look at the two business cards and the map of dialling codes."], ["Yacine Bellini — 16 rue Saint-Benoît, 75006 Paris", "ya-SEEN bay-lee-NEE", "first business card"], ["Domicile : 01 45 48 20 31", "do-mee-SEEL", "home number — 01 = Paris"], ["Portable : 06 40 08 85 96", "por-TAH-bluh", "mobile"], ["e-mail : yacine.bellini@yahoo.fr", "…", "his email"], ["Nathalie Roux, photographe — 1 quai de la Pêcherie, 69001 Lyon", "na-ta-LEE ROO, fo-to-GRAF", "second business card"], ["Tél : 04 78 80 59 01", "…", "landline — 04 = southeast"], ["Portable : 07 78 80 91 92", "…", "mobile"], ["e-mail : nroux@gmail.com", "…", "her email"], ["01 → Paris / Île-de-France", "zay-RO UHN", "the yellow zone on the map"], ["02 → le Nord-Ouest (Brest)", "zay-RO DUH", "the blue zone"], ["03 → le Nord-Est (Lille)", "zay-RO TWAH", "the red zone"], ["04 → le Sud-Est (Lyon, Marseille)", "zay-RO KATR", "the green zone"], ["05 → le Sud-Ouest (Bordeaux)", "zay-RO SANK", "the orange zone"], ["B. Complétez les numéros de téléphone suivants.", "kohm-play-TAY", "Complete these phone numbers."], ["M. Broutier à Marseille : 04 49 45 48 20", "… a mar-SAY", "Marseille is southeast → 04"], ["Mlle Moreira à Bordeaux : 05 56 91 00 69", "… a bor-DO", "Bordeaux is southwest → 05"], ["M. Billot à Lille : 03 20 88 31 21", "… a LEEL", "Lille is northeast → 03"], ["le portable de Clément Bailly : 06 10 11 53 51", "… luh por-TAH-bluh", "mobiles start 06 or 07"], ["C. Tous les numéros de téléphone français ont 10 chiffres.", "… ohn dee SHEE-fruh", "All French numbers have 10 digits."], ["Les numéros de portable commencent par 06 ou par 07.", "… ko-MAHNSS par", "Mobiles start 06 or 07."], ["08 : numéros à tarifs spéciaux", "zay-RO WEET", "special-rate numbers"], ["09 : opérateurs autres que France Telecom", "zay-RO NUHF", "other operators"]], "cols": "two"}, {"name": "Page 33 — activités 11, 12, 13", "items": [["Activité 11 : Écoutez et notez les numéros de téléphone.", "… ay no-TAY", "Listen and write down the phone numbers."], ["Activité 12 Phonétique : Écoutez les nombres et dites dans quel ordre vous les entendez.", "… dahn kel OR-druh", "Listen and say in which order you hear the numbers."], ["Exemple : 87 – 7 – 77 – 76 → 7 (2) · 77 (3) · 76 (4) · 87 (1)", "…", "the worked example: you number them by order heard"], ["Série 1 : 67 – 76 – 75 – 65", "swa-sahnt-SET / swa-sahnt-SEZ / swa-sahnt-KANZ / swa-sahnt-SANK", "the four to order"], ["Série 2 : 62 – 72 – 61 – 71", "swa-sahnt-DUH / swa-sahnt-DOOZ / swa-sahnt-ay-UHN / swa-sahnt-ay-ONZ", "the four to order"], ["Série 3 : 96 – 87 – 93 – 73", "kat-ruh-van-SEZ / kat-ruh-van-SET / kat-ruh-van-TREZ / swa-sahnt-TREZ", "the four to order"], ["Série 4 : 15 – 5 – 55 – 65", "kanz / sank / san-kahnt-SANK / swa-sahnt-SANK", "the four to order"], ["Activité 13 : Par groupes de quatre, vous échangez vos numéros de téléphone.", "par groop duh KATR", "In groups of four, swap phone numbers."]], "note": "Every series is built from near-identical sounds — 67/76, 62/72, 61/71 — so the exercise trains the ear on exactly the pairs that get confused on the phone."}, {"name": "Page 33 — activité 14 : les adresses mail", "items": [["Regardez et écoutez les adresses mail.", "ruh-gar-DAY ay ay-koo-TAY lay za-DRESS mail", "Look at and listen to the email addresses."], ["1. yacine.bellini@yahoo.fr", "ya-SEEN POINT bay-lee-NEE a-ro-BAHZ ya-HOO POINT eff-air", "yacine dot bellini at yahoo dot fr"], ["2. nroux@gmail.com", "enn-ROO a-ro-BAHZ zhay-mail POINT kom", "nroux at gmail dot com"], ["3. lina-meunier@free.fr", "lee-NAH tee-RAY muh-nee-AY a-ro-BAHZ FREE POINT eff-air", "lina hyphen meunier at free dot fr"], ["4. paul_martini@hotmail.fr", "POL tee-ray BAH mar-tee-NEE a-ro-BAHZ ot-mail POINT eff-air", "paul underscore martini at hotmail dot fr"]], "note": "The four providers pictured are <strong>Windows Live Hotmail, Gmail, Yahoo!</strong> and <strong>free</strong> — free.fr being a French internet provider you won't meet elsewhere."}, {"name": "Page 33 — Aide-mémoire : signes et ponctuation", "items": [["- tiret", "tee-RAY", "hyphen"], ["_ tiret bas", "tee-ray BAH", "underscore"], ["/ slash", "SLASH", "slash"], ["@ arobase", "a-ro-BAHZ", "at sign"], [". point", "PWAN", "dot, full stop"], [", virgule", "veer-GEWL", "comma"], [": deux points", "duh PWAN", "colon"], ["; point-virgule", "pwan-veer-GEWL", "semicolon"], ["? point d'interrogation", "pwan dan-tay-ro-ga-see-OHN", "question mark"], ["! point d'exclamation", "pwan deks-kla-ma-see-OHN", "exclamation mark"], ["( ) parenthèses", "pa-rahn-TEZ", "brackets"]], "note": "<strong>arobase</strong> is the one to memorise — you cannot give a French speaker your email address without it.", "cols": "two"}, {"name": "Page 33 — activités 15 et 16, et le projet", "items": [["Activité 15 : Par groupes de trois, échangez et écrivez vos adresses mail.", "par groop duh TWAH", "In groups of three, swap and write your email addresses."], ["Activité 16 : Jouez la scène à deux.", "zhoo-AY lah sen a DUH", "Act out the scene in pairs."], ["Au forum des associations, vous faites une inscription pour une activité culturelle, artistique ou sportive.", "oh fo-ROM day za-so-see-a-see-OHN", "At the clubs fair you sign up for a cultural, artistic or sporting activity."], ["L'employé(e) pose des questions et complète le formulaire d'inscription.", "lahm-plwa-YAY poz day kes-tee-OHN", "The employee asks questions and fills in the form."], ["Forum des associations — samedi 9 septembre, 10 h – 19 h, au parc Jules Verne", "fo-ROM day za-so-see-a-see-OHN", "the poster: Clubs fair, Saturday 9 September, 10am–7pm, Jules Verne park"], ["FORMULAIRE D'INSCRIPTION — Activité :", "ak-tee-vee-TAY", "Registration form — Activity:"], ["Nom : / Prénom : / Date de naissance : / Nationalité :", "…", "the form fields"], ["Adresse : / Numéro(s) de téléphone : / Adresse mail :", "…", "the remaining fields"], ["Projet Dossier 1 — Tâche leçon 2 : Faire le carnet d'adresses du groupe et situer les personnes dans la ville.", "luh kar-NAY da-DRESS", "Task: make the group's address book and place people in the city."]], "note": "The poster's icons show what's on offer at a French <em>forum des associations</em>: music, photography, cycling, ballet, martial arts, theatre, calligraphy, piano, cinema, tennis, running, football and English classes."}], "bookpages": ["p030", "p031", "p032", "p033"]}, {"id": "ae-d1l3", "label": "Dossier 1 · Leçon 3", "name": "En direct de TV5", "summary": "Pages 34–37, complete. The TV5 competition: the entry form, prepositions with country names, nine world monuments, the francophonie figures, passions and dreams, -ER verbs and the être/avoir split.", "art": "prepos", "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 3, in page order.", "tracks": [{"n": 44, "label": "p.34 act. 2 — l'émission de TV5 MONDE"}, {"n": 45, "label": "p.35 Point Langue — réécoutez les candidats"}, {"n": 46, "label": "p.36 act. 5 — les quatre candidats"}, {"n": 47, "label": "p.36 act. 5 — les quatre candidats"}, {"n": 48, "label": "p.37 act. d — même prononciation ou non ?"}, {"n": 49, "label": "p.37 act. 8 — le tirage au sort"}, {"n": 50, "label": "p.37 act. 8 — qui gagne le concours ?"}, {"n": 51, "label": "p.37 act. 9 — phonétique, [s] ou [z]"}, {"n": 52, "label": "p.37 act. 9 — indiquez les liaisons"}, {"n": 53, "label": "p.37 act. 9 — réécoutez et répétez"}]}, {"name": "Page 34 — l'annonce du jeu-concours", "items": [["En direct de TV5", "ahn dee-REKT duh tay-vay-SANK", "Live from TV5"], ["Donner des informations personnelles", "do-NAY day zan-for-ma-see-OHN pair-so-NELL", "Giving personal information"], ["TV5MONDE — PARIS", "tay-vay-sank-MOHND", "the channel logo and the Paris stamp"], ["JEU-CONCOURS « PARIS… MON RÊVE ! »", "zhuh-kohn-KOOR : pa-REE, mohn REV", "PRIZE COMPETITION — 'Paris… my dream!'"], ["Allez à Paris pour réaliser votre rêve !", "a-LAY a pa-REE poor ray-a-lee-ZAY VOT-ruh REV", "Go to Paris to make your dream come true!"], ["L'émission « Rêve et réalité » et Air Vacances offrent un voyage à Paris pour deux personnes.", "lay-mee-see-OHN rev ay ray-a-lee-TAY … o-fruh uhn vwa-YAHZH", "The programme 'Dream and reality' and Air Vacances are offering a trip to Paris for two."], ["Participer au concours, c'est simple !", "par-tee-see-PAY oh kohn-KOOR, say SAN-pluh", "Entering the competition is simple!"], ["Vous complétez et vous envoyez le bulletin de participation à TV5 MONDE.", "voo kohm-play-TAY ay voo zahn-vwa-YAY luh bewl-TAN duh par-tee-see-pa-see-OHN", "You fill in and send the entry form to TV5 MONDE."], ["Tirage au sort le 15 janvier.", "tee-RAHZH oh SOR luh kanz zhahn-vee-AY", "Prize draw on 15 January."], ["Vous gagnez ? Nous réalisons votre rêve !", "voo ga-NYAY ? noo ray-a-lee-ZOHN VOT-ruh REV", "You win? We make your dream happen!"]]}, {"name": "Page 34 — le bulletin de participation", "items": [["Nom :", "NOHN", "Surname"], ["Prénom :", "pray-NOHN", "First name"], ["Adresse :", "a-DRESS", "Address"], ["Ville :", "VEEL", "Town"], ["Pays :", "pay-EE", "Country"], ["N° de téléphone :", "new-may-RO duh tay-lay-FON", "Phone number"], ["Mail :", "MAIL", "Email"], ["Profession :", "pro-fay-see-OHN", "Occupation"], ["Âge :", "AHZH", "Age"], ["Mon rêve :", "mohn REV", "My dream:"]], "note": "The form is drawn with a dotted line and a pair of scissors down the side — you cut it out and post it. Note the order: personal details first, then the free-text dream at the bottom with six ruled lines.", "cols": "two"}, {"name": "Page 34 — activités 1 et 2", "items": [["Activité 1 : Observez le document et choisissez la réponse correcte. C'est :", "ob-sair-VAY luh do-kew-MAHN", "Look at the document and choose the correct answer. It is:"], ["1. une publicité pour un voyage.", "ewn pew-blee-see-TAY poor uhn vwa-YAHZH", "an advert for a trip"], ["2. une annonce pour un jeu-concours. → LA BONNE RÉPONSE", "ew na-NOHNSS poor uhn zhuh-kohn-KOOR", "an announcement for a competition — the correct answer"], ["3. une carte d'invitation à une émission de TV5 MONDE.", "ewn kart dan-vee-ta-see-OHN", "an invitation card to a TV5 programme"], ["Activité 2 : Écoutez l'émission de TV5 MONDE.", "ay-koo-TAY lay-mee-see-OHN", "Listen to the TV5 MONDE programme."], ["1. Dites où est le présentateur du jeu-concours.", "deet oo ay luh pray-zahn-ta-TUR", "Say where the competition presenter is."], ["2. Repérez les informations personnelles pour chaque finaliste.", "ruh-pay-RAY lay zan-for-ma-see-OHN", "Note the personal information for each finalist."], ["Le tableau à compléter : Issa · Nora · Tom · Céline", "ee-SAH · no-RAH · TOM · say-LEEN", "the four finalists"], ["Les colonnes : Âge — Profession — Ville / Pays", "AHZH — pro-fay-see-OHN — VEEL / pay-EE", "Age — Occupation — Town / Country"]], "note": "The drawing shows a TV studio: a presenter with cue cards, four contestants on a screen behind him, and a lottery ball machine on a stand — the <em>tirage au sort</em> that decides the winner in activity 8."}, {"name": "Page 35 — Point Langue : prépositions + noms de pays", "items": [["Les prépositions + noms de pays pour indiquer le pays de naissance/domicile", "lay pray-po-zee-see-OHN plew nohn duh pay-EE", "Prepositions + country names, for birthplace and residence"], ["a) Réécoutez les candidats et complétez.", "ray-ay-koo-TAY lay kahn-dee-DAH", "Listen to the candidates again and complete."], ["La Tunisie → en Tunisie", "ahn tew-nee-ZEE", "feminine → en"], ["L'Italie → en Italie", "ah nee-ta-LEE", "starts with a vowel → en"], ["Le Sénégal → au Sénégal", "oh say-nay-GAL", "masculine → au"], ["Le Canada → au Canada", "oh ka-na-DAH", "masculine → au"], ["Les États-Unis → aux États-Unis", "oh zay-ta-zew-NEE", "plural → aux"], ["Madagascar → à Madagascar", "a ma-da-gas-KAR", "no article → à"], ["Les trois verbes : J'habite / Je suis né(e) / Je vis", "zha-BEET / zhuh swee NAY / zhuh VEE", "I live / I was born / I live"], ["b) On utilise EN pour un nom de pays féminin et pour un pays commençant par une voyelle ;", "ahn", "the rule for en"], ["…AU pour un nom de pays masculin ;", "oh", "the rule for au"], ["…AUX pour un nom de pays pluriel.", "oh", "the rule for aux"], ["Pour certains pays, on utilise à, comme pour les villes.", "a", "Some countries take à, like cities."], ["Madagascar → J'habite à Madagascar.", "zha-BEET a ma-da-gas-KAR", "I live in Madagascar."], ["Singapour → Je suis né à Singapour.", "zhuh swee nay a san-ga-POOR", "I was born in Singapore."]], "note": "The countries taking <strong>à</strong> are the ones that have no article of their own — island states and city-states: Madagascar, Singapour, Cuba, Haïti, Monaco."}, {"name": "Page 35 — activité 3 : les neuf sites et monuments", "items": [["Dites où sont les sites ou monuments suivants : dans quel pays et, quand c'est possible, dans quelle ville.", "deet oo sohn lay SEET oo mo-new-MAHN", "Say where these sites are: which country, and where possible which city."], ["Exemple : La 5e Avenue est aux États-Unis, à New York. → photo g", "lah san-kee-EM av-NEW", "the worked example"], ["1. la 5e Avenue → aux États-Unis, à New York (photo g)", "… oh zay-ta-zew-NEE", "Fifth Avenue"], ["2. la Cité interdite → en Chine, à Pékin (photo f)", "lah see-TAY an-tair-DEET … ahn SHEEN", "the Forbidden City"], ["3. Big Ben → en Angleterre, à Londres (photo a)", "… ah nahn-gluh-TAIR, a LOHN-druh", "Big Ben"], ["4. la mosquée Hassan-II → au Maroc, à Casablanca (photo i)", "lah mos-KAY … oh ma-ROK", "the Hassan II mosque"], ["5. le Colisée → en Italie, à Rome (photo b)", "luh ko-lee-ZAY … ah nee-ta-LEE", "the Colosseum"], ["6. le Parthénon → en Grèce, à Athènes (photo h)", "luh par-tay-NOHN … ahn GRESS", "the Parthenon"], ["7. le Mont-Saint-Michel → en France (photo c)", "luh mohn-san-mee-SHELL … ahn FRAHNSS", "Mont-Saint-Michel"], ["8. le Kilimandjaro → en Tanzanie (photo d)", "luh kee-lee-mahn-dja-RO … ahn tahn-za-NEE", "Kilimanjaro"], ["9. Copacabana → au Brésil, à Rio de Janeiro (photo e)", "… oh bray-ZEEL", "Copacabana"], ["Activité 4 : Par deux, choisissez trois sites ou monuments. Pour chaque site, dites le nom et la classe devine dans quel pays il est.", "… lah klahss duh-VEEN", "In pairs, choose three sites; the class guesses the country."], ["Exemple : le Taj Mahal → en Inde", "luh tazh ma-AL → ah NAND", "Example: the Taj Mahal → in India"]], "cols": "two"}, {"name": "Page 35 — Point Culture : la francophonie", "items": [["La francophonie", "lah frahn-ko-fo-NEE", "The French-speaking world"], ["Issa, Nora, Tom et Céline ne sont pas français, mais ils parlent français.", "… nuh sohn pah frahn-SAY, may zeel parl frahn-SAY", "The four finalists aren't French, but they speak French."], ["Pour comprendre pourquoi, observez la carte p. 12.", "poor kohm-PRAHN-druh poor-KWAH", "To understand why, look at the map on p.12."], ["Plus de 200 millions de personnes sont francophones.", "plew duh duh sahn meel-YOHN … sohn frahn-ko-FON", "More than 200 million people are French-speaking."], ["Le français est la première langue de 80 millions de personnes.", "… lah pruh-mee-AIR LAHNG", "French is the first language of 80 million people."], ["Le français est la troisième langue sur Internet (après l'anglais et l'allemand).", "… lah trwa-zee-EM lahng sewr an-tair-NET", "French is the third language on the internet."], ["Le français est en 11e position des 6 000 langues parlées dans le monde.", "… ahn ohn-zee-EM po-zee-see-OHN", "French is 11th of the world's 6,000 languages."], ["83 millions de personnes apprennent le français (en 2e position après l'anglais).", "kat-ruh-van-TWAH meel-YOHN … a-PREN", "83 million people are learning French, second only to English."], ["Il y a 900 000 professeurs de français dans le monde.", "eel ya nuhf sahn meel pro-fay-SUR", "There are 900,000 teachers of French worldwide."]]}, {"name": "Page 36 — Parler de ses passions et de ses rêves", "items": [["Parler de ses passions et de ses rêves", "par-LAY duh say pa-see-OHN ay duh say REV", "Talking about your passions and your dreams"], ["Activité 5 a) Réécoutez les quatre candidats et associez une photo à chacun.", "… a-so-see-AY ewn fo-TO a sha-KUHN", "Listen again and match a photo to each candidate."], ["1. La Fête de la musique", "lah fet duh lah mew-ZEEK", "the Music Festival, 21 June"], ["2. Le feu d'artifice de la tour Eiffel", "luh fuh dar-tee-FEESS duh lah toor ay-FELL", "the Eiffel Tower fireworks"], ["3. Le Louvre", "luh LOO-vruh", "the Louvre"], ["4. L'arrivée du Tour de France", "la-ree-VAY dew toor duh FRAHNSS", "the finish of the Tour de France"], ["b) Identifiez la passion de chaque candidat.", "ee-dahn-tee-fee-AY lah pa-see-OHN", "Identify each candidate's passion."], ["Issa → la musique", "ee-SAH → lah mew-ZEEK", "music"], ["Nora → le cyclisme", "no-RAH → luh see-KLEEZ-muh", "cycling"], ["Tom → la peinture", "TOM → lah pan-TEWR", "painting"]], "note": "Three passions are listed for four candidates — the fourth, Céline, is the one you have to work out from the recording."}, {"name": "Page 36 — activité 6 : les deux réponses écrites", "items": [["Lisez la réponse de deux des candidats et dites qui écrit.", "lee-ZAY lah ray-POHNSS … ay deet kee ay-KREE", "Read two candidates' answers and say who wrote them."], ["Texte a — Mon rêve : Je rêve d'aller à Paris pour la Fête de la musique le 21 juin, avec ma copine.", "zhuh rev da-LAY a pa-REE", "I dream of going to Paris for the Music Festival on 21 June, with my girlfriend."], ["Comme moi, elle joue de la guitare et nous adorons la musique, toutes les musiques !", "kom MWAH, el zhoo duh lah gee-TAR", "Like me she plays guitar and we love music, all kinds of music!"], ["→ C'est Issa : sa passion, c'est la musique.", "say ee-SAH", "This is Issa — his passion is music."], ["Texte b — Mon rêve : Ma passion, c'est le cyclisme.", "ma pa-see-OHN, say luh see-KLEEZ-muh", "My passion is cycling."], ["Mon rêve, c'est de voir les coureurs du Tour quand ils arrivent sur les Champs-Élysées !", "… lay koo-RUR dew TOOR … sewr lay shahn-zay-lee-ZAY", "My dream is to see the Tour riders arrive on the Champs-Élysées!"], ["→ C'est Nora : sa passion, c'est le cyclisme.", "say no-RAH", "This is Nora — her passion is cycling."]]}, {"name": "Page 36 — activité 7 et l'aide-mémoire", "items": [["Lisez les formules suivantes. Trouvez dans les textes de l'activité 6 des formules équivalentes.", "troo-VAY … day for-MEWL ay-kee-va-LAHNT", "Find equivalent phrases in the texts."], ["1. J'ai une passion : le cyclisme. ↔ Ma passion, c'est le cyclisme.", "zhay ewn pa-see-OHN ↔ ma pa-see-OHN, say", "the two ways to state a passion"], ["2. J'ai un rêve : aller à Paris pour la Fête de la musique. ↔ Je rêve d'aller à Paris pour la Fête de la musique.", "zhay uhn REV ↔ zhuh rev da-LAY", "the two ways to state a dream"], ["Exprimer une passion", "eks-pree-MAY ewn pa-see-OHN", "Expressing a passion"], ["J'ai une passion : le cyclisme.", "zhay ewn pa-see-OHN", "I have a passion: cycling."], ["Ma passion, c'est le cyclisme.", "ma pa-see-OHN, say luh see-KLEEZ-muh", "My passion is cycling."], ["J'adore le cyclisme.", "zha-DOR luh see-KLEEZ-muh", "I love cycling."], ["Exprimer un rêve", "eks-pree-MAY uhn REV", "Expressing a dream"], ["J'ai un rêve : visiter Paris.", "zhay uhn REV", "I have a dream: to visit Paris."], ["Mon rêve ? Visiter Paris.", "mohn REV", "My dream? To visit Paris."], ["Je rêve de visiter Paris.", "zhuh rev duh vee-zee-TAY", "I dream of visiting Paris."], ["Mon rêve, c'est de visiter Paris.", "mohn rev, say duh vee-zee-TAY", "My dream is to visit Paris."]], "note": "Watch the little grammar shift: after <strong>je rêve</strong> and <strong>mon rêve, c'est</strong> you need <strong>de</strong> before the infinitive; after <strong>j'ai un rêve :</strong> and <strong>mon rêve ?</strong> you don't."}, {"name": "Page 37 — Point Langue : le présent des verbes en -er", "items": [["a) Relisez les réponses des deux candidats et observez la conjugaison des verbes rêver, jouer, adorer et arriver. Complétez les terminaisons.", "… lay tair-mee-nay-ZOHN", "Complete the endings."], ["je rêve", "zhuh REV", "-e"], ["tu rêves", "tew REV", "-es"], ["il / elle rêve", "eel REV", "-e"], ["nous rêvons", "noo ray-VOHN", "-ons"], ["vous rêvez", "voo ray-VAY", "-ez"], ["ils / elles rêvent", "eel REV", "-ent"], ["b) Observez la première partie du verbe (la base).", "lah BAHZ", "Look at the first part of the verb — the stem."], ["Pour le verbe rêver : la base est identique pour toutes les personnes → rêv-", "ee-dahn-TEEK poor toot lay pair-SUN", "For rêver the stem is the same throughout."], ["Identifiez la base pour le présent dans les verbes arriver, travailler, jouer.", "…", "arriv- · travaill- · jou-"], ["c) Conjuguez le verbe adorer : j'adore, tu adores, il adore, nous adorons, vous adorez, ils adorent.", "zha-DOR … noo za-do-ROHN … eel za-DOR", "Conjugate adorer."], ["d) Écoutez et dites si les verbes ont la même prononciation ou non.", "… lah mem pro-nohn-see-a-see-OHN", "Say whether the verbs sound the same."], ["1. il travaille – ils travaillent → MÊME prononciation", "eel tra-VIGH", "identical"], ["2. je rêve – nous rêvons → prononciation DIFFÉRENTE", "zhuh REV / noo ray-VOHN", "different"], ["3. vous rêvez – ils rêvent → prononciation DIFFÉRENTE", "voo ray-VAY / eel REV", "different"], ["4. tu adores – il adore → MÊME prononciation", "tew a-DOR / eel a-DOR", "identical"], ["e) Observez et répondez : je rêve, tu rêves, il rêve, ils rêvent", "zhuh rev, tew rev, eel rev, eel REV", "the four forms"], ["1. s'écrivent : de manière DIFFÉRENTE.", "say-KREEV", "They are written differently."], ["2. se prononcent : de la MÊME manière.", "suh pro-NOHNSS", "They are pronounced the same."]], "note": "This is the central insight of the whole lesson: four of the six present-tense forms are <strong>spelled differently but sound identical</strong>. Only <em>nous</em> and <em>vous</em> can be heard as different.", "cols": "two"}, {"name": "Page 37 — activités 8 et 9", "items": [["Activité 8 : Écoutez le tirage au sort et dites qui gagne le concours.", "… kee GAN-yuh luh kohn-KOOR", "Listen to the draw and say who wins the competition."], ["Activité 9 Phonétique a) Lisez et écoutez : Ils sont. / Ils ont.", "eel SOHN / eel ZOHN", "the crucial pair"], ["b) [s] ou [z] ? Écoutez et répondez.", "ess oo zed", "Is it an s or a z sound?"], ["c) Écoutez et indiquez les liaisons comme dans l'exemple.", "… lay lee-ay-ZOHN", "Mark the liaisons as in the example."], ["Exemple : Ils_ont deux passions.", "eel ZOHN duh pa-see-OHN", "They have two passions. — liaison marked"], ["1. Vous êtes canadien.", "voo ZET ka-na-dee-AN", "liaison: vous_êtes"], ["2. Nous allons tirer au sort.", "noo za-LOHN tee-RAY oh SOR", "liaison: nous_allons"], ["3. Ils ont un rêve.", "eel zohn tuhn REV", "liaisons: ils_ont, ont_un"], ["4. Nous avons quatre finalistes.", "noo za-VOHN katr fee-na-LEEST", "liaison: nous_avons"], ["5. Ils arrivent sur les Champs-Élysées.", "eel za-REEV sewr lay shahn-zay-lee-ZAY", "liaison: ils_arrivent"], ["6. Ils habitent aux États-Unis.", "eel za-BEET oh zay-ta-zew-NEE", "liaisons: ils_habitent, aux_États"], ["d) Réécoutez et répétez les phrases.", "ray-ay-koo-TAY ay ray-pay-TAY", "Listen again and repeat."]], "note": "<strong>Ils sont</strong> versus <strong>ils ont</strong> is the pair that changes meaning — <em>they are</em> against <em>they have</em>. Everything hangs on one consonant."}, {"name": "Page 37 — Point Langue : être et avoir, et le projet", "items": [["Complétez avec être ou avoir au présent de l'indicatif.", "kohm-play-TAY a-vek EH-truh oo a-VWAHR", "Complete with être or avoir."], ["Je suis architecte.", "zhuh swee zar-shee-TEKT", "être + profession"], ["Je suis marocain.", "zhuh swee ma-ro-KAN", "être + nationality"], ["Il est jeune.", "ee lay ZHUHN", "être + adjective"], ["Il est étudiant.", "ee lay tay-tew-dee-AHN", "être + status"], ["Ils sont au Canada.", "eel sohn toh ka-na-DAH", "être + place"], ["J'ai une passion.", "zhay ewn pa-see-OHN", "avoir + a thing you possess"], ["Il a dix-neuf ans.", "ee la deez-nuh VAHN", "avoir + age"], ["Ils ont un rêve.", "eel zohn tuhn REV", "avoir + a dream"], ["Activité 10 : Échangez en petits groupes.", "ay-shahn-ZHAY ahn puh-TEE GROOP", "Talk in small groups."], ["Dites dans quels pays vous rêvez de vivre pendant quelques mois et justifiez.", "… voo ray-VAY duh VEE-vruh pahn-DAHN kel-kuh MWAH", "Say which countries you dream of living in for a few months, and why."], ["Faites une liste commune pour le groupe, puis comparez avec les listes des autres groupes.", "fet ewn leest ko-MEWN", "Make a shared list, then compare with other groups."], ["Projet Dossier 1 — Tâche leçon 3 : Représenter le « profil international » du groupe.", "ruh-pray-zahn-TAY luh pro-FEEL an-tair-na-see-o-NAL", "Task: represent the group's 'international profile'."]], "note": "The dividing line: <strong>être</strong> for what you <em>are</em> — job, nationality, age-group adjective, location. <strong>avoir</strong> for what you <em>have</em> — a passion, a dream, and your age in years."}], "bookpages": ["p034", "p035", "p036", "p037"]}, {"id": "ae-d1-carnet", "label": "Dossier 1 · Carnet de voyage", "name": "La France en Europe", "summary": "Pages 38–39, complete. France's neighbours and seas, fourteen European symbols with their countries and categories, and France in six numbers.", "art": null, "bookpages": ["p038", "p039"], "groups": [{"name": "Page 38 — l'Hexagone", "items": [["Carnet de voyage — La France en Europe", "kar-NAY duh vwa-YAHZH", "Travel notebook — France in Europe"], ["Activité 1 : « L'Hexagone » est un autre nom pour « la France ».", "lek-sa-GON ay tuh-NOH-truh nohn poor lah FRAHNSS", "'The Hexagon' is another name for France."], ["Repérez la France sur la carte d'Europe.", "ruh-pay-RAY lah FRAHNSS sewr lah kart duh-ROP", "Find France on the map of Europe."], ["un hexagone", "uh nek-sa-GON", "a hexagon"]], "note": "A teal hexagon is printed beside the map, labelled <em>un hexagone</em>. France gets the nickname because its outline has roughly six straight sides — three coastal, three inland."}, {"name": "Page 38 — activité 2 : testez vos connaissances", "items": [["Testez vos connaissances en géographie.", "tes-TAY vo ko-nay-SAHNSS ahn zhay-o-gra-FEE", "Test your geography knowledge."], ["a) Par équipes de quatre. Trouvez dans la liste suivante les pays voisins de la France puis montrez les pays sur la carte.", "par ay-KEEP duh KATR … lay pay-EE vwa-ZAN", "In teams of four, find France's neighbours in the list, then point them out on the map."], ["b) Quels pays voisins de la France sont francophones ?", "kel pay-EE vwa-ZAN … sohn frahn-ko-FON", "Which of France's neighbours are French-speaking?"], ["c) Trouvez dans la liste suivante et montrez sur la carte les mers qui entourent la France.", "… lay MAIR kee ahn-TOOR lah FRAHNSS", "Find and point out the seas surrounding France."], ["d) Dites ce que représentent les pays de couleur verte.", "deet suh kuh ruh-pray-ZAHNT lay pay-EE duh koo-LUR VAIRT", "Say what the green countries represent."]]}, {"name": "Page 38 — la liste des pays", "items": [["l'Allemagne — VOISIN ✓", "lal-MAHN-yuh", "Germany — a neighbour"], ["la Belgique — VOISIN ✓ et FRANCOPHONE", "lah bel-ZHEEK", "Belgium — neighbour and French-speaking"], ["l'Espagne — VOISIN ✓", "les-PAN-yuh", "Spain — a neighbour"], ["l'Irlande — pas voisin ✗", "leer-LAHND", "Ireland — not a neighbour"], ["le Luxembourg — VOISIN ✓ et FRANCOPHONE", "luh lewk-sahm-BOOR", "Luxembourg — neighbour and French-speaking"], ["l'Italie — VOISIN ✓", "lee-ta-LEE", "Italy — a neighbour"], ["la Pologne — pas voisin ✗", "lah po-LON-yuh", "Poland — not a neighbour"], ["le Portugal — pas voisin ✗", "luh por-tew-GAL", "Portugal — not a neighbour"], ["la Suède — pas voisin ✗", "lah sew-ED", "Sweden — not a neighbour"], ["la Suisse — VOISIN ✓ et FRANCOPHONE", "lah SWEESS", "Switzerland — neighbour and French-speaking"], ["les Pays-Bas — pas voisin ✗", "lay pay-ee-BAH", "the Netherlands — not a neighbour"], ["l'Autriche — pas voisin ✗", "loh-TREESH", "Austria — not a neighbour"]], "note": "Six of the twelve listed countries border France. France also borders <strong>Monaco</strong> and <strong>Andorre</strong>, which aren't in the list. The three francophone neighbours are <strong>la Belgique, la Suisse, le Luxembourg</strong> — Monaco too, in fact.", "cols": "two"}, {"name": "Page 38 — les mers, et la couleur verte", "items": [["la mer du Nord — ✓ entoure la France", "lah mair dew NOR", "the North Sea"], ["la mer Méditerranée — ✓ entoure la France", "lah mair may-dee-tay-ra-NAY", "the Mediterranean"], ["l'océan Pacifique — ✗", "lo-say-AHN pa-see-FEEK", "the Pacific — no"], ["l'océan Atlantique — ✓ entoure la France", "lo-say-AHN at-lahn-TEEK", "the Atlantic"], ["la mer Noire — ✗", "lah mair NWAHR", "the Black Sea — no"], ["la Manche", "lah MAHNSH", "the Channel — also borders France, though not listed"], ["d) Les pays de couleur verte sont les pays de l'Union européenne.", "lay pay-EE duh koo-LUR VAIRT … duh lew-nee-OHN uh-ro-pay-EN", "The green countries are the European Union members."]]}, {"name": "Page 39 — activité 3 : quelques symboles", "items": [["Quelques symboles", "kel-kuh san-BOL", "Some symbols"], ["a) Observez les photos et dites quels pays d'Europe sont représentés.", "… kel pay-EE duh-ROP sohn ruh-pray-zahn-TAY", "Look at the photos and say which European countries are represented."], ["Attention ! Un pays est représenté trois fois.", "a-tahn-see-OHN ! uhn pay-EE ay ruh-pray-zahn-TAY trwah FWAH", "Careful! One country appears three times."], ["Exemple : La mode, c'est la France.", "lah MOD, say lah FRAHNSS", "Example: fashion is France."], ["b) Associez chaque symbole à une catégorie.", "a-so-see-AY shak san-BOL a ewn ka-tay-go-REE", "Match each symbol to a category."], ["spécialités / gastronomie", "spay-see-a-lee-TAY / gas-tro-no-MEE", "specialities / food"], ["technologie", "tek-no-lo-ZHEE", "technology"], ["événements / culture", "ay-vayn-MAHN / kewl-TEWR", "events / culture"], ["personnages célèbres", "pair-so-NAHZH say-LEB-ruh", "famous figures"]]}, {"name": "Page 39 — les quatorze symboles", "items": [["1. la mode → la France · événements/culture", "lah MOD", "fashion"], ["2. la Saint-Patrick → l'Irlande · événements/culture", "lah san-pa-TREEK", "St Patrick's Day"], ["3. le TGV → la France · technologie", "luh tay-zhay-VAY", "the high-speed train"], ["4. le carnaval → l'Italie · événements/culture", "luh kar-na-VAL", "the Venice carnival"], ["5. Mozart → l'Autriche · personnages célèbres", "mo-ZAR", "Mozart"], ["6. 1789 → la France · événements/culture", "meel set sahn kat-ruh-van-NUHF", "the French Revolution"], ["7. Vermeer → les Pays-Bas · personnages célèbres", "vair-MEER", "Vermeer, 'Girl with a Pearl Earring'"], ["8. Volkswagen → l'Allemagne · technologie", "volks-va-GEN", "Volkswagen"], ["9. les moules-frites → la Belgique · spécialités/gastronomie", "lay mool-FREET", "mussels and chips"], ["10. une montre → la Suisse · technologie", "ewn MOHN-truh", "a watch"], ["11. Vasco de Gama → le Portugal · personnages célèbres", "vas-KO duh ga-MAH", "Vasco da Gama"], ["12. la paella → l'Espagne · spécialités/gastronomie", "lah pa-ay-LAH", "paella"], ["13. l'heure du thé → le Royaume-Uni · événements/culture", "lur dew TAY", "teatime"], ["14. Kafka → la République tchèque · personnages célèbres", "kaf-KAH", "Kafka"]], "note": "The country appearing <strong>three times</strong> is <strong>la France</strong> — la mode (1), le TGV (3) and 1789 (6).", "cols": "two"}, {"name": "Page 39 — activité 4 : à vous !", "items": [["À vous ! Dessinez des symboles pour représenter la France.", "a VOO ! day-see-NAY day san-BOL", "Your turn! Draw symbols to represent France."], ["Choisissez des symboles correspondant aux catégories ci-dessous.", "shwa-zee-SAY … oh ka-tay-go-REE see-duh-SOO", "Choose symbols matching the categories below."], ["Comparez avec les symboles de vos voisin(e)s.", "kohm-pa-RAY a-vek", "Compare with your neighbours' symbols."], ["monuments", "mo-new-MAHN", "monuments"], ["spécialités / gastronomie", "spay-see-a-lee-TAY", "specialities / food"], ["technologie", "tek-no-lo-ZHEE", "technology"], ["événements / culture", "ay-vayn-MAHN / kewl-TEWR", "events / culture"], ["histoire", "ees-TWAHR", "history"], ["personnes célèbres", "pair-SUN say-LEB-ruh", "famous people"]], "cols": "two"}, {"name": "Page 39 — activité 5 : la France en chiffres", "items": [["La France en chiffres", "lah frahnss ahn SHEE-fruh", "France in figures"], ["Complétez les informations sur la France avec les nombres suivants : 2,2 – 12 – 66 – 533 965 – 22 – 9", "kohm-play-TAY", "Complete with these numbers."], ["les habitants : 66 millions", "lay za-bee-TAHN : swa-sahnt-sees meel-YOHN", "inhabitants: 66 million"], ["la superficie : 533 965 kilomètres carré (km²)", "lah sew-pair-fee-SEE : sank sahn trahnt-trwah meel nuhf sahn swa-sahnt-sank", "area: 533,965 km²"], ["les régions : 22", "lay ray-zhee-OHN : van-DUH", "regions: 22"], ["le salaire minimum : 9 €/heure", "luh sa-LAIR mee-nee-MOM : nuh vuh-RO duh LUR", "minimum wage: €9 an hour"], ["le nombre d'habitants à Paris : 2,2 millions", "… duh veer-gewl duh meel-YOHN", "people in Paris: 2.2 million"], ["le nombre d'habitants dans le grand Paris (Paris + banlieue) : 12 millions", "… dahn luh grahn pa-REE … bahn-lee-UH", "greater Paris: 12 million"]], "note": "The French decimal separator is a <strong>comma</strong>, so <strong>2,2</strong> is read <em>deux virgule deux</em> — two point two."}, {"name": "Le vocabulaire du carnet", "items": [["un pays voisin", "uhn pay-EE vwa-ZAN", "a neighbouring country"], ["entourer", "ahn-too-RAY", "to surround"], ["une mer / un océan", "ewn MAIR / uh no-say-AHN", "a sea / an ocean"], ["francophone", "frahn-ko-FON", "French-speaking"], ["l'Union européenne", "lew-nee-OHN uh-ro-pay-EN", "the European Union"], ["un symbole", "uhn san-BOL", "a symbol"], ["représenter", "ruh-pray-zahn-TAY", "to represent"], ["une catégorie", "ewn ka-tay-go-REE", "a category"], ["dessiner", "day-see-NAY", "to draw"], ["les habitants", "lay za-bee-TAHN", "the inhabitants"], ["la superficie", "lah sew-pair-fee-SEE", "the surface area"], ["une région", "ewn ray-zhee-OHN", "a region"], ["le salaire minimum", "luh sa-LAIR mee-nee-MOM", "the minimum wage"], ["la banlieue", "lah bahn-lee-UH", "the suburbs"], ["les connaissances", "lay ko-nay-SAHNSS", "knowledge"], ["la géographie", "lah zhay-o-gra-FEE", "geography"]], "cols": "two"}]}, {"id": "ae-d1-sexercer", "label": "Dossier 1 · S'exercer", "name": "Les corrigés", "summary": "Pages 40–41, complete. All eighteen exercises with every item and every answer — people, greetings, tu/vous, avoir, negation, possessives, articles, quel, numbers, distances, phone numbers, prepositions, -ER verbs, être and avoir.", "art": null, "groups": [{"name": "Leçon 1 — Ex. 1 : les personnes", "items": [["Associez les étiquettes et les dessins. (Attention ! Plusieurs réponses sont parfois possibles.)", "a-so-see-AY lay zay-TEE-ket ay lay day-SAN", "Match the labels to the drawings. Several answers are sometimes possible."], ["un homme", "uh NOM", "a man"], ["une fille", "ewn FEE-yuh", "a girl"], ["un jeune homme", "uhn zhuh NOM", "a young man"], ["une femme", "ewn FAM", "a woman"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["une dame", "ewn DAM", "a lady"], ["un monsieur", "uhn muh-SYUH", "a gentleman"], ["un bébé", "uhn bay-BAY", "a baby"], ["un enfant", "uh nahn-FAHN", "a child"], ["un garçon", "uhn gar-SOHN", "a boy"], ["une jeune fille", "ewn zhuhn FEE-yuh", "a young girl"]], "note": "Eight drawings, lettered a to h: <strong>a</strong> a baby in a high chair → un bébé, un enfant · <strong>b</strong> a young girl with long hair → une fille, une jeune fille · <strong>c</strong> a girl with pigtails and glasses → une fille, un enfant · <strong>d</strong> an older man with a beard → un homme, un monsieur · <strong>e</strong> a woman → une femme, une dame · <strong>f</strong> a man in a shirt → un homme, un jeune homme · <strong>g</strong> a young woman in a hat → une jeune femme, une femme · <strong>h</strong> a baby with a bottle → un bébé, un enfant.", "cols": "two"}, {"name": "Leçon 1 — Ex. 2 : saluer", "items": [["Complétez les dialogues avec les formules suivantes.", "kohm-play-TAY lay dee-a-LOG", "Complete the dialogues with these phrases."], ["1. — Bonjour ! Tu vas bien ? — Oui, et toi ?", "bohn-ZHOOR ! tew va bee-AN ?", "informal greeting"], ["2. — Bonjour, madame. — Bonjour, mademoiselle. Comment allez-vous ? — Très bien, et vous ?", "… tray bee-AN, ay VOO", "formal exchange"], ["3. — Bonjour, monsieur. — Bonjour mademoiselle, vous allez bien ? — Bien, merci.", "… voo za-lay bee-AN", "formal exchange"], ["4. — Salut ! Tu vas bien ? — Super, et toi ?", "sa-LEW ! … sew-PAIR, ay TWAH", "informal exchange"]], "note": "The four phrases to place are: <em>Très bien, et vous ? / Salut ! / Tu vas bien ? / Bonjour mademoiselle, vous allez bien ?</em> — each used once."}, {"name": "Leçon 1 — Ex. 3 : tu ou vous", "items": [["1. — Bonjour, monsieur, comment allez-VOUS ? — Bien, merci.", "ko-mahn ta-lay VOO", "formal, one person → vous"], ["2. — Bonjour, TU vas bien ? — Oui, et toi ?", "tew va bee-AN", "informal, one person → tu"], ["3. — Salut les filles ! VOUS allez bien ? — Oui, ça va !", "voo za-lay bee-AN", "informal but plural → vous"]]}, {"name": "Leçon 1 — Ex. 4 : le verbe avoir", "items": [["Complétez avec : avons – ont – a – ai – avez – as", "kohm-play-TAY a-vek", "Complete with these forms."], ["1. — Tu AS quel âge ? — J'AI dix-huit ans.", "tew a kel AHZH ? — zhay dee-zwee TAHN", "How old are you? — I'm eighteen."], ["2. — Vous AVEZ des contacts ? — Oui, nous AVONS des contacts anglophones et francophones.", "voo za-VAY … noo za-VOHN", "Do you have contacts? — Yes, English- and French-speaking ones."], ["3. — Tu AS des amis à l'université ? — Oui, j'AI deux amis d'origine mexicaine mais ils ONT la nationalité française.", "… eel ZOHN lah na-see-o-na-lee-TAY", "…they have French nationality."], ["4. — Rachida A vingt-deux ans comme toi ? — Non, elle A vingt ans.", "ra-shee-DAH a van-DUH zahn", "Is Rachida 22 like you? — No, she's 20."], ["5. — Tu N'AS PAS cours, aujourd'hui ? — Non. C'est bien, j'AI le temps d'aller au cinéma !", "tew na pah KOOR … zhay luh TAHN", "No class today? — No. Good, I've time for the cinema!"]]}, {"name": "Leçon 1 — Ex. 5 : la négation ne… pas", "items": [["Continuez la question, comme dans l'exemple.", "kohn-tee-NEW-ay lah kes-tee-OHN", "Continue the question, as in the example."], ["Exemple : Tu parles anglais ou tu ne parles pas anglais ?", "tew parl ahn-GLAY oo tew nuh parl pah zahn-GLAY", "the worked example"], ["1. Elle étudie l'économie ou elle n'étudie pas l'économie ?", "el ay-tew-DEE lay-ko-no-MEE oo el nay-tew-DEE pah", "Does she study economics or not?"], ["2. Nous travaillons le matin ou nous ne travaillons pas le matin ?", "noo tra-va-YOHN luh ma-TAN", "Do we work mornings or not?"], ["3. Ils sont français ou ils ne sont pas français ?", "eel sohn frahn-SAY oo eel nuh sohn pah", "Are they French or not?"], ["4. Je travaille le mardi ou je ne travaille pas le mardi ?", "zhuh tra-VIGH luh mar-DEE", "Do I work Tuesdays or not?"], ["5. Tu es étudiant ou tu n'es pas étudiant ?", "tew ay zay-tew-dee-AHN oo tew nay pah", "Are you a student or not?"], ["6. Vous avez 20 ans ou vous n'avez pas 20 ans ?", "voo za-VAY van TAHN oo voo na-VAY pah", "Are you 20 or not?"]]}, {"name": "Leçon 1 — Ex. 6 : l'adjectif possessif", "items": [["Complétez avec mon, ma, mes, votre, vos.", "kohm-play-TAY a-vek", "Complete with the possessives."], ["1. Votre profil : VOTRE nom, VOTRE âge, VOS coordonnées, VOTRE nationalité, VOTRE langue maternelle, VOS études.", "VOT-ruh … VO ko-or-do-NAY", "Your profile: name, age, contact details, nationality, mother tongue, studies."], ["2. Votre connexion : VOTRE adresse mail — VOTRE mot de passe.", "VOT-ruh a-DRESS mail", "Your login: email address, password."], ["3. Mon profil : MON nom : Lorenzo Lentati — MON âge : 35 ans — MA langue maternelle : italien — MES études : architecture.", "mohn … ma … may zay-TEWD", "My profile."]], "note": "The choice follows the <strong>noun</strong>: <em>ma langue</em> because langue is feminine, <em>mes études</em> because études is plural, and <em>mon âge</em> because âge starts with a vowel even though it's masculine."}, {"name": "Leçon 2 — Ex. 7 : l'article indéfini", "items": [["Complétez avec un, une ou des.", "kohm-play-TAY", "Complete with un, une or des."], ["L'étudiante demande DES informations pour UNE inscription dans UNE médiathèque et elle complète UN formulaire.", "lay-tew-dee-AHNT duh-MAHND day zan-for-ma-see-OHN", "The student asks for information about registering at a media library and fills in a form."], ["L'employé demande UNE photo et UNE pièce d'identité : UN passeport ou UNE carte d'identité.", "lahm-plwa-YAY duh-MAHND ewn fo-TO", "The employee asks for a photo and ID: a passport or an identity card."]]}, {"name": "Leçon 2 — Ex. 8 : l'adjectif interrogatif quel", "items": [["Mettez les réponses à la place qui convient.", "met-TAY lay ray-POHNSS a lah plahss kee kohn-vee-AN", "Put the answers in the right place."], ["— Bonjour, c'est pour une inscription, s'il vous plaît.", "bohn-ZHOOR, say poor ew nan-skreep-see-OHN", "Hello, it's to register, please."], ["— Quel est votre nom ? — Bourdier.", "kel ay VOT-ruh NOHN", "What's your surname? — Bourdier."], ["— Quel est votre prénom ? — Sandra.", "kel ay VOT-ruh pray-NOHN", "What's your first name? — Sandra."], ["— Vous habitez à quelle adresse ? — 20 rue Marie Curie, 54000 Nancy.", "voo za-bee-TAY a kel a-DRESS", "What address do you live at?"], ["— Quelle langue étudiez-vous ? — L'espagnol.", "kel lahng ay-tew-dee-ay VOO", "Which language are you studying? — Spanish."], ["— Les cours d'espagnol, c'est le mercredi ou le vendredi à 18 heures. Quel jour préférez-vous ? — Le vendredi.", "kel zhoor pray-fay-ray VOO", "Which day do you prefer? — Friday."]]}, {"name": "Leçon 2 — Ex. 9 : écrire les questions du formulaire", "items": [["Lisez le formulaire d'inscription. Écrivez les questions qui correspondent aux informations communiquées.", "lee-ZAY luh for-mew-LAIR … ay-kree-VAY lay kes-tee-OHN", "Read the form. Write the questions matching the information given."], ["Nom : Bertholet → Quel est votre nom ?", "kel ay VOT-ruh NOHN", "surname"], ["Prénom : Maxime → Quel est votre prénom ?", "kel ay VOT-ruh pray-NOHN", "first name"], ["Date de naissance : 10 juin 1991 → Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "date of birth"], ["Nationalité : française → Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "nationality"], ["Adresse : 59 rue Savary, 86000 Poitiers → Quelle est votre adresse ?", "kel ay VOT-ruh a-DRESS", "address"], ["Tél. domicile : 05 42 48 82 90 → Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO", "home phone"], ["Tél. portable : 07 18 88 98 76 → Quel est votre numéro de portable ?", "… duh por-TAH-bluh", "mobile"]]}, {"name": "Les nombres — Ex. 10 : les opérations", "items": [["Donnez oralement le résultat des opérations.", "do-NAY o-ral-MAHN luh ray-zewl-TAH", "Give the results aloud."], ["Exemple : 45 + 45 = 90 (quatre-vingt-dix)", "kat-ruh-van-DEESS", "the worked example"], ["1. 70 + 1 = 71 (soixante et onze)", "swa-sahnt-ay-ONZ", "71"], ["2. 100 + 80 = 180 (cent quatre-vingts)", "sahn kat-ruh-VAN", "180"], ["3. 95 − 10 = 85 (quatre-vingt-cinq)", "kat-ruh-van-SANK", "85"], ["4. 1 000 + 2 000 = 3 000 (trois mille)", "twah MEEL", "3000"], ["5. 100 − 1 = 99 (quatre-vingt-dix-neuf)", "kat-ruh-van-deez-NUHF", "99"], ["6. 66 + 10 = 76 (soixante-seize)", "swa-sahnt-SEZ", "76"], ["7. 300 + 50 + 15 + 9 = 374 (trois cent soixante-quatorze)", "twah sahn swa-sahnt-ka-TORZ", "374"], ["8. 63 + 10 = 73 (soixante-treize)", "swa-sahnt-TREZ", "73"]]}, {"name": "Les nombres — Ex. 11 : les distances depuis Paris", "items": [["Par deux, lisez les distances en kilomètres entre Paris et quelques capitales européennes.", "par DUH, lee-ZAY lay dees-TAHNSS", "In pairs, read out the distances."], ["1. Paris – Bruxelles : 293 km (deux cent quatre-vingt-treize)", "duh sahn kat-ruh-van-TREZ", "Brussels"], ["2. Paris – Madrid : 1 243 km (mille deux cent quarante-trois)", "meel duh sahn ka-rahnt-TWAH", "Madrid"], ["3. Paris – Prague : 1 005 km (mille cinq)", "meel SANK", "Prague"], ["4. Paris – Varsovie : 1 587 km (mille cinq cent quatre-vingt-sept)", "meel sank sahn kat-ruh-van-SET", "Warsaw"], ["5. Paris – Rome : 1 362 km (mille trois cent soixante-deux)", "meel twah sahn swa-sahnt-DUH", "Rome"], ["6. Paris – Dublin : 846 km (huit cent quarante-six)", "wee sahn ka-rahnt-SEESS", "Dublin"]]}, {"name": "Les numéros — Ex. 12 : lire à voix haute", "items": [["Lisez les numéros de téléphone suivants.", "lee-ZAY lay new-may-RO", "Read these phone numbers aloud."], ["1. 01 42 84 90 00", "zay-RO uhn, ka-rahnt-DUH, kat-ruh-van-KATR, kat-ruh-van-DEESS, zay-RO zay-RO", "Paris landline"], ["2. 01 61 19 28 91", "zay-RO uhn, swa-sahnt-ay-UHN, deez-NUHF, van-TWEET, kat-ruh-van-ONZ", "Paris landline"], ["3. 06 04 78 29 81", "zay-RO sees, zay-RO katr, swa-sahnt-dee-ZWEET, van-NUHF, kat-ruh-van-UHN", "mobile"], ["4. 03 46 49 73 79", "zay-RO twah, ka-rahnt-SEESS, ka-rahnt-NUHF, swa-sahnt-TREZ, swa-sahnt-deez-NUHF", "northeast landline"], ["5. 06 19 21 44 94", "zay-RO sees, deez-NUHF, van-tay-UHN, ka-rahnt-KATR, kat-ruh-van-ka-TORZ", "mobile"], ["6. 02 48 80 93 84", "zay-RO duh, ka-rahnt-WEET, kat-ruh-VAN, kat-ruh-van-TREZ, kat-ruh-van-KATR", "northwest landline"]], "note": "French phone numbers are always read in <strong>pairs</strong>, never digit by digit."}, {"name": "Leçon 3 — Ex. 13 : choisir la préposition", "items": [["J'ai des amis du monde entier !", "zhay day za-MEE dew mohnd ahn-tee-AY", "I have friends from all over the world!"], ["1. David est américain, il est né AUX États-Unis.", "… eel ay nay oh zay-ta-zew-NEE", "plural → aux"], ["2. Ling est née à Pékin, EN Chine. Elle est mariée avec un Français et elle vit EN France.", "… ahn SHEEN … ahn FRAHNSS", "feminine → en"], ["3. Angelica habite EN Angleterre mais elle est née AU Canada.", "… ah nahn-gluh-TAIR … oh ka-na-DAH", "vowel → en; masculine → au"], ["4. Abdel travaille six mois EN Suisse et six mois AU Maroc.", "… ahn SWEESS … oh ma-ROK", "feminine → en; masculine → au"], ["5. Anna est polonaise, elle est née à Varsovie, EN Pologne, mais elle habite AUX Pays-Bas.", "… ahn po-LON-yuh … oh pay-ee-BAH", "feminine → en; plural → aux"]]}, {"name": "Leçon 3 — Ex. 14 : l'interview de Tom au présent", "items": [["Lisez l'interview. Mettez les verbes au présent.", "lee-ZAY lan-tair-VEW", "Read the interview. Put the verbs in the present."], ["Le présentateur : Tom, bonjour. Comme les autres candidats, vous DÉSIREZ aller à Paris, n'est-ce pas ?", "voo day-zee-RAY a-LAY a pa-REE", "Like the other contestants, you want to go to Paris, don't you?"], ["Tom : Oui, je RÊVE de voir Paris.", "zhuh REV duh vwahr pa-REE", "Yes, I dream of seeing Paris."], ["J'AIME la langue et la culture françaises et j'ADORE la musique.", "ZHEM … zha-DOR lah mew-ZEEK", "I love the French language and culture, and I adore music."], ["Je DÉSIRE assister à la Fête de la musique le 21 juin.", "zhuh day-ZEER a-sees-TAY", "I want to attend the Music Festival on 21 June."], ["Le présentateur : Vous TRAVAILLEZ, vous êtes musicien professionnel ?", "voo tra-va-YAY", "Do you work — are you a professional musician?"], ["Tom : Avec des amis, nous FORMONS un groupe de rock, nous JOUONS dans un bar mais nous TRAVAILLONS le week-end seulement.", "noo for-MOHN … noo zhoo-OHN … noo tra-va-YOHN", "With friends we form a rock band, we play in a bar but we only work weekends."]]}, {"name": "Leçon 3 — Ex. 15 : changer de personne", "items": [["Transformez les phrases comme dans l'exemple.", "trahns-for-MAY lay FRAZ", "Transform the sentences as in the example."], ["Exemple : Je parle français. (nous) → Nous parlons français.", "noo par-LOHN frahn-SAY", "the worked example"], ["1. Il habite à Tokyo. (ils) → Ils habitent à Tokyo.", "eel za-BEET a to-kee-O", "They live in Tokyo."], ["2. Tu travailles où ? (vous) → Vous travaillez où ?", "voo tra-va-YAY OO", "Where do you work?"], ["3. Elle étudie l'économie. (elles) → Elles étudient l'économie.", "el zay-TEW-dee lay-ko-no-MEE", "They study economics."], ["4. J'arrive lundi. (nous) → Nous arrivons lundi.", "noo za-ree-VOHN luhn-DEE", "We arrive Monday."], ["5. Elles visitent Barcelone. (elle) → Elle visite Barcelone.", "el vee-ZEET bar-suh-LUN", "She's visiting Barcelona."], ["6. Vous regardez le film ? (tu) → Tu regardes le film ?", "tew ruh-GARD luh FEELM", "Are you watching the film?"], ["7. Nous adorons la musique ! (je) → J'adore la musique !", "zha-DOR lah mew-ZEEK", "I love music!"], ["8. Ils parlent trois langues. (il) → Il parle trois langues.", "eel parl twah LAHNG", "He speaks three languages."]]}, {"name": "Leçon 3 — Ex. 16 : arriver, habiter, participer, rêver", "items": [["Complétez les phrases avec les verbes qui conviennent.", "kohm-play-TAY … kee kohn-vee-EN", "Complete with the right verbs."], ["1. — Vous PARTICIPEZ à l'émission ? — Oui, je PARTICIPE au jeu.", "voo par-tee-see-PAY … zhuh par-tee-SEEP", "Are you taking part in the show? — Yes, in the game."], ["2. — Vous HABITEZ où ? — Nous HABITONS à Dakar.", "voo za-bee-TAY OO … noo za-bee-TOHN", "Where do you live? — In Dakar."], ["3. — Vous RÊVEZ de visiter Paris ? — Oui, je RÊVE de visiter le musée d'Orsay.", "voo ray-VAY … zhuh REV", "Do you dream of visiting Paris? — Yes, the Musée d'Orsay."], ["4. — Vous ARRIVEZ quand à Paris ? — Nous ARRIVONS le 23 septembre.", "voo za-ree-VAY KAHN … noo za-ree-VOHN", "When do you arrive? — On 23 September."]]}, {"name": "Les verbes — Ex. 17 : être et avoir à la cafétéria", "items": [["Complétez le dialogue avec les verbes avoir ou être au présent.", "kohm-play-TAY luh dee-a-LOG", "Complete with avoir or être."], ["— Bonjour, Marta. Ça va ?", "bohn-ZHOOR, mar-TAH. sa VA", "Hello Marta. How are you?"], ["— Ça va bien. Je SUIS très contente ; j'AI de nouveaux amis : Marion et Vincent.", "zhuh swee tray kohn-TAHNT ; zhay duh noo-VO za-MEE", "I'm fine. I'm very happy; I have new friends."], ["Ils SONT français et ils SONT étudiants en architecture comme moi.", "eel sohn frahn-SAY … ah nar-shee-tek-TEWR", "They're French and architecture students like me."], ["Ils SONT mariés et ils ONT un bébé : il A six mois !", "eel sohn ma-ree-AY ay eel zohn tuhn bay-BAY", "They're married and have a baby: he's six months old!"]], "note": "Six of the eight blanks are <em>être</em>; only <em>j'ai de nouveaux amis</em>, <em>ils ont un bébé</em> and <em>il a six mois</em> take <em>avoir</em> — possession and age."}, {"name": "Les verbes — Ex. 18 : reformuler les questions", "items": [["Reformulez les questions. Utilisez être ou avoir. Au secrétariat de l'université.", "ruh-for-mew-LAY lay kes-tee-OHN", "Rephrase the questions using être or avoir."], ["1. — Votre nom ? → Quel est votre nom ? — José Esteves.", "kel ay VOT-ruh NOHN", "Your name?"], ["2. — Date de naissance ? → Quelle est votre date de naissance ? — Le
