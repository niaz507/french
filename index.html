 26 avril 1995.", "kel ay VOT-ruh dat duh nay-SAHNSS", "Date of birth?"], ["3. — Étudiant à Paris ? → Vous êtes étudiant à Paris ? — Oui.", "voo ZET ay-tew-dee-AHN", "Student in Paris?"], ["4. — Une pièce d'identité, s'il vous plaît ? → Vous avez une pièce d'identité ? — Voilà ma carte d'identité.", "voo za-VAY ewn pee-ESS", "Proof of identity?"], ["5. — Libre le lundi ? → Vous êtes libre le lundi ? — Oui.", "voo ZET LEE-bruh luh luhn-DEE", "Free on Monday?"], ["6. — Un numéro de portable ? → Vous avez un numéro de portable ? — 07 29 92 36 75.", "voo za-VAY uhn new-may-RO", "A mobile number?"]]}], "bookpages": ["p040", "p041"]}, {"id": "ae-d1-delf", "label": "Dossier 1 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 42, complete. The listening paper's five questions and every field of the Hachette competition form.", "art": null, "groups": [{"name": "Compréhension de l'oral — 10 points", "items": [], "note": "Piste 54. <strong>Lisez les questions. Écoutez le document deux fois puis répondez.</strong> The answers come from the recording, so what follows is the question language rather than invented answers.", "tracks": [{"n": 54, "label": "p.42 — Vers le DELF A1, compréhension de l'oral"}]}, {"name": "Les cinq questions", "items": [["1. Maria téléphone pour des cours : a. de français / b. d'anglais / c. de portugais.", "ma-ree-AH tay-lay-FON poor day KOOR", "Maria is calling about lessons in: French / English / Portuguese."], ["2. Quelle est la profession de Maria ?", "kel ay lah pro-fay-see-OHN duh ma-ree-AH", "What is Maria's job?"], ["3. Elle est libre quel jour ?", "el ay LEE-bruh kel ZHOOR", "Which day is she free?"], ["4. Elle est libre à quel moment ? a. le matin / b. l'après-midi / c. le soir", "el ay LEE-bruh a kel mo-MAHN", "What time of day is she free?"], ["5. Quel est le numéro de téléphone de Maria ?", "kel ay luh new-may-RO duh tay-lay-FON", "What is Maria's phone number?"]], "note": "Every question uses something from this dossier: <em>quel/quelle</em>, the days, the times of day, professions and phone numbers."}, {"name": "Production écrite — 10 points", "items": [["Complétez le formulaire pour gagner un dictionnaire.", "kohm-play-TAY luh for-mew-LAIR poor ga-NYAY uhn deek-see-o-NAIR", "Fill in the form to win a dictionary."], ["Jeu concours Hachette", "zhuh kohn-KOOR a-SHET", "Hachette prize competition"], ["Dictionnaires à gagner", "deek-see-o-NAIR a ga-NYAY", "Dictionaries to be won"], ["Tirage au sort à la fin du mois", "tee-RAHZH oh SOR a lah fan dew MWAH", "Prize draw at the end of the month"], ["Nom :", "NOHN", "Surname"], ["Prénom :", "pray-NOHN", "First name"], ["Date de naissance :", "dat duh nay-SAHNSS", "Date of birth"], ["Nationalité :", "na-see-o-na-lee-TAY", "Nationality"], ["Adresse :", "a-DRESS", "Address"], ["Pays :", "pay-EE", "Country"], ["Numéro de téléphone :", "new-may-RO duh tay-lay-FON", "Phone number"], ["Mail :", "MAIL", "Email"], ["École / Université :", "ay-KOL / ew-nee-vair-see-TAY", "School / University"], ["hachette", "a-SHET", "the publisher's logo at the foot of the form"]], "note": "Ten fields for ten points. Everything asked for has appeared in Dossier 1 — this is the dossier's own checklist turned into an exam task.", "cols": "two"}, {"name": "Le vocabulaire de l'examen", "items": [["la compréhension de l'oral", "lah kohm-pray-ahn-see-OHN duh lo-RAL", "listening comprehension"], ["la production écrite", "lah pro-dewk-see-OHN ay-KREET", "written production"], ["10 points", "dee PWAN", "10 points"], ["un document", "uhn do-kew-MAHN", "a document, a recording"], ["deux fois", "duh FWAH", "twice"], ["répondre", "ray-POHN-druh", "to answer"], ["être libre", "EH-truh LEE-bruh", "to be free, available"], ["un cours", "uhn KOOR", "a lesson, a class"], ["un dictionnaire", "uhn deek-see-o-NAIR", "a dictionary"], ["gagner", "ga-NYAY", "to win"]], "cols": "two"}], "bookpages": ["p042"]}, {"id": "ae-d2l1", "label": "Dossier 2 · Leçon 1", "name": "C'est ma ville", "summary": "Pages 43–47, complete. Pontoise: the poster, the Île-de-France map, the leaflet's eleven places, the town magazine, the whole street plan, prepositions of place and the contracted article.", "art": "prepolieu", "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 1, in page order.", "tracks": [{"n": 59, "label": "p.45 act. 4 & 5 — l'interview du journaliste"}, {"n": 60, "label": "p.45 act. 4 & 5 — l'interview du journaliste"}, {"n": 61, "label": "p.45 act. 6 — phonétique, un musée / un endroit"}, {"n": 62, "label": "p.45 act. 6 — écoutez et répétez"}, {"n": 63, "label": "p.45 act. 6 — une rivière / une épicerie"}, {"n": 64, "label": "p.45 act. 6 — écoutez et répétez"}, {"n": 65, "label": "p.47 act. 11 — vérifier les informations sur le plan"}, {"n": 66, "label": "p.47 act. 11 — écoutez et justifiez"}]}, {"name": "Page 43 — la page d'ouverture du dossier", "items": [["Dossier 2 — Ici, ailleurs", "ee-SEE, a-YUR", "Dossier 2 — Here, elsewhere"], ["Leçon 1 : C'est ma ville", "say ma VEEL", "Lesson 1: This is my town"], ["> Parler de sa ville", "par-LAY duh sa VEEL", "Talking about your town"], ["> Localiser", "lo-ka-lee-ZAY", "Locating things"], ["Leçon 2 : Passer une nuit…", "pa-SAY ewn NWEE", "Lesson 2: Spending a night…"], ["> S'informer sur l'hébergement", "san-for-MAY sewr lay-bairzh-MAHN", "Finding out about accommodation"], ["> Indiquer un itinéraire", "an-dee-KAY uh nee-tee-nay-RAIR", "Giving directions"], ["Leçon 3 : Bons baisers de…", "bohn bay-ZAY duh", "Lesson 3: Greetings from…"], ["> Écrire une carte postale", "ay-KREER ewn kart pos-TAL", "Writing a postcard"], ["> Indiquer la provenance, la destination", "an-dee-KAY lah prov-NAHNSS, lah des-tee-na-see-OHN", "Saying where you're coming from and going to"], ["Carnet de voyage : Paris, hier et aujourd'hui", "ee-AIR ay oh-zhoor-DWEE", "Travel notebook: Paris, yesterday and today"], ["Vers le DELF A1", "vair luh DELF", "Towards the DELF A1"], ["Projet : Faire découvrir votre ville", "fair day-koo-VREER VOT-ruh VEEL", "Project: introduce your town"], ["Phonie-graphie → activités 1 à 7 p. 190-191", "fo-nee-gra-FEE", "Sound-and-spelling → activities 1–7"], ["Lexique thématique → p. 197-198", "lek-SEEK tay-ma-TEEK", "Thematic lexicon"]], "note": "The opener photographs the Statue of Liberty against the Empire State Building, and the eye-covered facade of the Institut du monde arabe in Paris — <em>ici</em> and <em>ailleurs</em>, here and elsewhere."}, {"name": "Page 44 — l'affiche de Pontoise", "items": [["C'est ma ville", "say ma VEEL", "This is my town"], ["Parler de sa ville", "par-LAY duh sa VEEL", "Talking about your town"], ["Bienvenue à Pontoise", "bee-an-vuh-NEW a pohn-TWAHZ", "Welcome to Pontoise"], ["« Ville d'art et d'histoire » à 30 km de Paris", "VEEL dar ay dees-TWAHR a trahnt kee-lo-MET-ruh duh pa-REE", "'Town of art and history', 30 km from Paris"], ["VILLES ET PAYS D'ART ET D'HISTOIRE", "veel ay pay-EE dar ay dees-TWAHR", "the official national label, shown as a logo"], ["VILLE DE PONTOISE", "veel duh pohn-TWAHZ", "the town's coat of arms"]], "note": "The poster is a strip of six numbered photographs: <strong>1</strong> a flower garden, <strong>2</strong> the glass front of L'Apostrophe theatre, <strong>3</strong> a painted landscape, <strong>4</strong> a cathedral tower, <strong>5</strong> a terraced garden, <strong>6</strong> the town above the river with a bridge."}, {"name": "Page 44 — activité 1", "items": [["Observez l'affiche de la ville de Pontoise.", "ob-sair-VAY la-FEESH", "Look at the town's poster."], ["1. Regardez les photos et faites des hypothèses. À Pontoise, il y a :", "… fet day zee-po-TEZ", "Look at the photos and make guesses. In Pontoise there is:"], ["un musée ✓", "uhn mew-ZAY", "a museum — two, in fact"], ["une université ✓", "ew new-nee-vair-see-TAY", "a university — Cergy-Pontoise"], ["un théâtre ✓", "uhn tay-AH-truh", "a theatre — L'Apostrophe"], ["une rivière ✓", "ewn ree-vee-AIR", "a river — l'Oise"], ["un château — seulement les remparts de l'ancien château", "uhn sha-TO", "a castle — only the ramparts remain"], ["une cathédrale ✓", "ewn ka-tay-DRAL", "a cathedral — Saint-Maclou"], ["un pont ✓", "uhn POHN", "a bridge"], ["des jardins ✓", "day zhar-DAN", "gardens — two of them"], ["2. Dites quelles autres informations l'affiche donne sur la ville.", "deet kel ZO-truh zan-for-ma-see-OHN", "Say what other information the poster gives."], ["→ le nom de la ville, le label « Ville d'art et d'histoire », la distance de Paris (30 km), le blason", "luh bla-ZOHN", "the name, the label, the distance, the coat of arms"]]}, {"name": "Page 44 — Point Culture : Pontoise en Île-de-France", "items": [["Pontoise, une ville de l'Île-de-France", "pohn-TWAHZ, ewn veel duh leel-duh-FRAHNSS", "Pontoise, a town of the Île-de-France"], ["A. Observez la carte de la région Île-de-France et choisissez l'information correcte.", "ob-sair-VAY lah kart duh lah ray-zhee-OHN", "Look at the map and choose the correct information."], ["La région Île-de-France est composée de : Paris (ville et département)", "… ay kohm-po-ZAY duh", "The Île-de-France is made up of: Paris, both city and département"], ["+ les 3 départements de la proche banlieue (en orange)", "lay TWAH day-par-tuh-MAHN duh lah prosh bahn-lee-UH", "+ the 3 inner-suburb départements, in orange"], ["+ les 4 départements de la grande banlieue (en jaune)", "lay KATR … duh lah grahnd bahn-lee-UH", "+ the 4 outer-suburb départements, in yellow"], ["Pontoise se trouve en grande banlieue.", "pohn-TWAHZ suh troov ahn grahnd bahn-lee-UH", "Pontoise is in the outer suburbs."], ["95 Val d'Oise — Pontoise", "kat-ruh-van-KANZ val DWAHZ", "the département Pontoise belongs to"], ["78 Yvelines — Versailles", "swa-sahnt-dee-ZWEET eev-LEEN", "outer suburb"], ["91 Essonne — Évry", "kat-ruh-van-ONZ ay-SUN", "outer suburb"], ["77 Seine-et-Marne — Melun", "swa-sahnt-dee-SET sen-ay-MARN", "outer suburb"], ["92 Hauts-de-Seine — Nanterre", "kat-ruh-van-DOOZ o-duh-SEN", "inner suburb, orange"], ["93 Seine-Saint-Denis — Bobigny", "kat-ruh-van-TREZ sen-san-duh-NEE", "inner suburb, orange"], ["94 Val-de-Marne — Créteil", "kat-ruh-van-ka-TORZ val-duh-MARN", "inner suburb, orange"], ["B. Observez sur l'affiche le blason de Pontoise : il y a un pont et une rivière.", "luh bla-ZOHN … uhn POHN ay ewn ree-vee-AIR", "Look at the coat of arms: there's a bridge and a river."], ["Trouvez le nom de la rivière dans le nom de la ville : PONT + OISE", "PONT plew ZWAHZ", "Find the river hidden in the town's name: PONT-OISE"]], "note": "The riddle answers itself once you see it: <strong>Pontoise = pont + Oise</strong>, the bridge over the river Oise, which is exactly what the coat of arms shows.", "cols": "two"}, {"name": "Page 45 — le dépliant : Votre ville, d'hier à aujourd'hui", "items": [["Découvrir Pontoise — VILLE DE PONTOISE", "day-koo-VREER pohn-TWAHZ", "Discover Pontoise — the leaflet cover"], ["Votre ville, d'hier à aujourd'hui", "VOT-ruh veel, dee-AIR a oh-zhoor-DWEE", "Your town, from yesterday to today"], ["la cathédrale Saint-Maclou", "lah ka-tay-DRAL san-ma-KLOO", "Saint-Maclou cathedral"], ["l'Oise et les remparts", "LWAHZ ay lay rahm-PAR", "the Oise and the ramparts"], ["le musée Camille Pissarro", "luh mew-ZAY ka-MEE pee-sa-RO", "the Camille Pissarro museum"], ["l'université de Cergy-Pontoise", "lew-nee-vair-see-TAY duh sair-ZHEE pohn-TWAHZ", "Cergy-Pontoise university"], ["le musée Tavet-Delacour", "luh mew-ZAY ta-VAY duh-la-KOOR", "the Tavet-Delacour museum"], ["le jardin de la Ville", "luh zhar-DAN duh lah VEEL", "the town garden"], ["le jardin des Cinq Sens", "luh zhar-DAN day sank SAHNSS", "the Garden of the Five Senses"], ["le théâtre de L'Apostrophe", "luh tay-AH-truh duh la-pos-TROF", "L'Apostrophe theatre"], ["le cinéma Royal Utopia", "luh see-nay-MAH rwa-YAL ew-to-PYA", "the Royal Utopia cinema"], ["le complexe sportif des Louvrais", "luh kohm-PLEX spor-TEEF day loo-VRAY", "the Louvrais sports complex"], ["les marchés", "lay mar-SHAY", "the markets"]], "cols": "two"}, {"name": "Page 45 — activités 2 et 3", "items": [["Activité 2 a) Lisez le dépliant et trouvez dans la liste quels lieux sont présentés sur les photos.", "lee-ZAY luh day-plee-AHN", "Read the leaflet and find which places appear in the photos."], ["b) Classez les lieux de la ville dans les deux catégories suivantes : art et histoire – vie quotidienne.", "kla-SAY lay lee-UH", "Sort the places into: art and history / daily life."], ["Art et histoire : la cathédrale Saint-Maclou, l'Oise et les remparts, le musée Camille Pissarro, le musée Tavet-Delacour, le jardin de la Ville, le jardin des Cinq Sens", "lar ay lees-TWAHR", "the heritage side"], ["Vie quotidienne : l'université, le théâtre de L'Apostrophe, le cinéma Royal Utopia, le complexe sportif des Louvrais, les marchés", "lah vee ko-tee-dee-EN", "the everyday side"], ["Activité 3 a) Relisez le dépliant et trouvez les légendes des photos de l'affiche p. 44.", "… lay lay-ZHAHND day fo-TO", "Find the captions for the poster photos on p.44."], ["Exemple : photo 5 → le jardin des Cinq Sens", "luh zhar-DAN day sank SAHNSS", "the worked example"], ["photo 1 → le jardin de la Ville", "luh zhar-DAN duh lah VEEL", "photo 1"], ["photo 2 → le théâtre de L'Apostrophe", "luh tay-AH-truh duh la-pos-TROF", "photo 2 — the glass building signed L'apostrophe"], ["photo 3 → le musée Camille Pissarro", "luh mew-ZAY ka-MEE pee-sa-RO", "photo 3 — the painted landscape"], ["photo 4 → la cathédrale Saint-Maclou", "lah ka-tay-DRAL", "photo 4"], ["photo 6 → l'Oise et les remparts", "LWAHZ ay lay rahm-PAR", "photo 6 — the river and the bridge"], ["b) Dites quels lieux sont intéressants pour vous à Pontoise.", "deet kel lee-UH sohn tan-tay-ray-SAHN", "Say which places interest you in Pontoise."]]}, {"name": "Page 45 — activités 4 et 5", "items": [["Activité 4 : Écoutez l'enregistrement et identifiez la situation : qui parle ? de quoi ?", "… kee PARL ? duh KWAH", "Listen and identify the situation: who's speaking? about what?"], ["Activité 5 : Réécoutez.", "ray-ay-koo-TAY", "Listen again."], ["1. Relevez les questions du journaliste.", "ruh-luh-VAY lay kes-tee-OHN dew zhoor-na-LEEST", "Note the journalist's questions."], ["2. Trouvez sur le dépliant les lieux cités par les personnes.", "troo-VAY … lay lee-UH see-TAY", "Find on the leaflet the places the people mention."], ["3. Relevez les explications des personnes.", "ruh-luh-VAY lay zeks-plee-ka-see-OHN", "Note the people's explanations."]]}, {"name": "Page 45 — Aide-mémoire : demander et donner une explication", "items": [["Pourquoi aimez-vous ce lieu ?", "poor-KWAH ay-may VOO suh lee-UH", "Why do you like this place?"], ["Parce que j'adore la peinture.", "pars kuh zha-DOR lah pan-TEWR", "Because I love painting."], ["Parce qu'il y a des spectacles intéressants.", "pars keel ee a day spek-TAH-kluh an-tay-ray-SAHN", "Because there are interesting shows."]], "note": "<strong>parce que</strong> becomes <strong>parce qu'</strong> before a vowel — <em>parce qu'il y a</em>. It always answers <em>pourquoi</em>."}, {"name": "Page 45 — Point Langue : articles définis et indéfinis", "items": [["Les articles définis et indéfinis pour nommer des lieux dans la ville", "… poor no-MAY day lee-UH dahn lah VEEL", "Definite and indefinite articles for naming places in town"], ["a) Observez. À Pontoise, il y a un musée. → C'est le musée Camille Pissarro.", "eel ee a uhn mew-ZAY → say luh mew-ZAY", "There's a museum → It's the Camille Pissarro museum."], ["il y a une cathédrale. → C'est la cathédrale Saint-Maclou.", "… ewn ka-tay-DRAL → say lah", "There's a cathedral → It's Saint-Maclou cathedral."], ["il y a une université. → C'est l'université de Cergy-Pontoise.", "… ew new-nee-vair-see-TAY", "There's a university → It's Cergy-Pontoise university."], ["il y a une rivière. → C'est l'Oise.", "… ewn ree-vee-AIR → say LWAHZ", "There's a river → It's the Oise."], ["il y a des remparts. → Ce sont les remparts de l'ancien château.", "… day rahm-PAR → suh sohn lay rahm-PAR", "There are ramparts → They're the old castle's ramparts."], ["b) On utilise les articles indéfinis un, une, des pour donner une information NON SPÉCIFIQUE.", "nohn spay-see-FEEK", "Indefinite articles give non-specific information."], ["On utilise les articles définis le, la, l', les pour donner une information SPÉCIFIQUE.", "spay-see-FEEK", "Definite articles give specific information."]], "note": "Notice the two ways of identifying: <strong>C'est</strong> for a singular, <strong>Ce sont</strong> for a plural."}, {"name": "Page 45 — activités 6 et 7", "items": [["Activité 6 Phonétique a) Écoutez et lisez.", "ay-koo-TAY ay lee-ZAY", "Listen and read."], ["1. un musée", "uhn mew-ZAY", "nasal uhn, no liaison"], ["2. un endroit", "uh nahn-DRWAH", "liaison: the n carries over"], ["b) Écoutez et répétez.", "ay-koo-TAY ay ray-pay-TAY", "Listen and repeat."], ["c) Écoutez et lisez.", "ay-koo-TAY ay lee-ZAY", "Listen and read."], ["1. une rivière", "ewn ree-vee-AIR", "clear ewn"], ["2. une épicerie", "ew nay-pee-SREE", "liaison: the n carries over"], ["d) Écoutez et répétez.", "ay-koo-TAY ay ray-pay-TAY", "Listen and repeat."], ["Activité 7 : En petits groupes, dites quel est votre lieu préféré dans votre ville et dites pourquoi.", "… VOT-ruh lee-UH pray-fay-RAY", "In small groups, say your favourite place in your town and why."], ["Mon lieu préféré, c'est…", "mohn lee-UH pray-fay-RAY, say", "My favourite place is…"]], "note": "The drill contrasts a word starting with a consonant against one starting with a vowel — the liaison appears only in the second of each pair."}, {"name": "Page 46 — Pontoise infos, le magazine", "items": [["Localiser", "lo-ka-lee-ZAY", "Locating"], ["Pontoise infos n° 91", "pohn-TWAHZ an-FO", "the town magazine, issue 91"], ["Vivre et sortir à Pontoise", "VEE-vruh ay sor-TEER a pohn-TWAHZ", "Living and going out in Pontoise"], ["p. 5 Zoom sur : Les Journées du Patrimoine", "zoom sewr lay zhoor-NAY dew pa-tree-MWAHN", "Focus on: Heritage Days"], ["p. 13 Culture & Loisirs", "kewl-TEWR ay lwa-ZEER", "Culture & Leisure"], ["p. 21 Service Public", "sair-VEESS pew-BLEEK", "Public Services"], ["La vie dans les quartiers", "lah vee dahn lay kar-tee-AY", "Life in the neighbourhoods"], ["Les bonnes adresses des Pontoisiens", "lay bun za-DRESS day pohn-twa-zee-AN", "The locals' recommended places"], ["Les adresses de Mélanie dans le centre-ville", "lay za-DRESS duh may-la-NEE dahn luh sahn-truh-VEEL", "Mélanie's addresses in the town centre"]]}, {"name": "Page 46 — les quatre bonnes adresses de Mélanie", "items": [["1. Le restaurant L'Audience : « un bon restaurant traditionnel »", "luh res-to-RAHN lo-dee-AHNSS", "the restaurant, with her opinion"], ["sur la place de l'Hôtel de Ville, en face de la mairie, à côté de la pharmacie", "sewr lah plahss duh lo-TELL duh VEEL, ahn fahss duh lah may-REE, a ko-TAY duh lah far-ma-SEE", "on the town hall square, opposite the town hall, next to the pharmacy"], ["2. Le cinéma Royal Utopia : « une programmation intéressante »", "luh see-nay-MAH rwa-YAL ew-to-PYA", "the cinema, with her opinion"], ["dans la rue Alexandre Prachay, à gauche de la bibliothèque Guillaume-Apollinaire", "dahn lah rew a-lek-SAHN-druh pra-SHAY, a GOSH duh lah bee-blee-o-TEK", "on rue Alexandre Prachay, left of the Guillaume-Apollinaire library"], ["3. Le marché du centre : « des commerçants sympathiques »", "luh mar-SHAY dew SAHN-truh", "the market, with her opinion"], ["dans la rue de l'Hôtel de Ville et sur la place, le samedi matin", "dahn lah rew duh lo-TELL duh VEEL ay sewr lah PLAHSS, luh sam-DEE ma-TAN", "on rue de l'Hôtel de Ville and on the square, Saturday mornings"], ["4. L'épicerie fine L'Arbre blanc : « des produits de qualité et une galerie d'art ! »", "lay-pee-SREE FEEN LAR-bruh BLAHN", "the delicatessen, with her opinion"], ["dans la rue Alexandre Prachay, près du cinéma", "dahn lah rew … pray dew see-nay-MAH", "on rue Alexandre Prachay, near the cinema"]]}, {"name": "Page 46 — activités 8 et 9, et le plan", "items": [["Activité 8 : Lisez cette page du magazine de la ville de Pontoise et répondez.", "lee-ZAY set pahzh dew ma-ga-ZEEN", "Read this page of the town magazine and answer."], ["1. Qui est Mélanie ? → C'est une habitante de Pontoise, une Pontoisienne.", "kee ay may-la-NEE", "Who is Mélanie? A local resident."], ["2. Les bonnes adresses de Mélanie concernent quels types de lieux ? → un restaurant, un cinéma, un marché, une épicerie : des commerces et des loisirs.", "kel teep duh lee-UH", "What kinds of places? Shops and leisure."], ["3. Le magazine donne quels types d'informations pour chaque lieu ? → le nom, une appréciation entre guillemets, et la localisation.", "kel teep dan-for-ma-see-OHN", "What information for each? The name, an opinion in quotes, and the location."], ["Activité 9 : Relisez la page de magazine et regardez le plan. Situez les « bonnes adresses » de Mélanie sur le plan.", "see-tew-AY lay bun za-DRESS sewr luh PLAHN", "Place Mélanie's addresses on the map."]]}, {"name": "Page 46 — tous les lieux du plan", "items": [["le musée Tavet", "luh mew-ZAY ta-VAY", "the Tavet museum"], ["la poste", "lah POST", "the post office"], ["la boulangerie", "lah boo-lahn-ZHREE", "the bakery"], ["la banque", "lah BAHNK", "the bank"], ["l'église Sainte-Anne", "lay-GLEEZ sant-ANN", "Sainte-Anne church"], ["l'Hôtel de Ville", "lo-TELL duh VEEL", "the town hall"], ["la place de l'Hôtel de Ville", "lah plahss duh lo-TELL duh VEEL", "the town hall square"], ["le supermarché", "luh sew-pair-mar-SHAY", "the supermarket"], ["l'école primaire", "lay-KOL pree-MAIR", "the primary school"], ["l'école maternelle", "lay-KOL ma-tair-NELL", "the nursery school"], ["la pharmacie", "lah far-ma-SEE", "the pharmacy"], ["le parking", "luh par-KEENG", "the car park"], ["la bibliothèque municipale", "lah bee-blee-o-TEK mew-nee-see-PAL", "the municipal library"], ["l'Oise", "LWAHZ", "the river"], ["la place des Moineaux", "lah plahss day mwa-NO", "a square on the map"], ["le boulevard Jean Jaurès", "luh bool-VAR zhahn zho-RESS", "the main boulevard"], ["la rue Victor Hugo", "lah rew veek-TOR ew-GO", "a street on the map"], ["la rue Alexandre Prachay", "lah rew a-lek-SAHN-druh pra-SHAY", "where the cinema and the delicatessen are"], ["la rue de l'Hôtel de Ville", "lah rew duh lo-TELL duh VEEL", "where the market is"], ["le quai du Pothuis", "luh kay dew po-TWEE", "the quay along the Oise"], ["la rue Marcel Rousier", "lah rew mar-SELL roo-zee-AY", "a street on the map"], ["la rue de la Harengerie", "lah rew duh lah a-rahn-ZHREE", "a street on the map"], ["la rue Pierre Butin", "lah rew pee-AIR bew-TAN", "by the library"], ["la rue de la Croix du Bourg", "lah rew duh lah krwah dew BOOR", "a street on the map"], ["la rue du Château", "lah rew dew sha-TO", "a street on the map"], ["la rue de la Roche", "lah rew duh lah ROSH", "a street on the map"], ["la rue de l'Ordre", "lah rew duh LOR-druh", "a street on the map"], ["l'impasse Tavet", "lan-PAHSS ta-VAY", "a dead-end by the museum"]], "note": "Everything printed on the street plan, so you can follow the directions exercises without the book open.", "cols": "two"}, {"name": "Page 47 — activité 10 : vrai ou faux", "items": [["Vrai ou faux ? Regardez le plan p. 46 et l'aide-mémoire et vérifiez les informations suivantes.", "vray oo FO", "True or false? Check against the map and the aide-mémoire."], ["1. Le musée Tavet est en face de la poste.", "luh mew-ZAY ta-VAY et ahn fahss duh lah POST", "The Tavet museum is opposite the post office."], ["2. Il y a une boulangerie à droite de la banque.", "eel ee a ewn boo-lahn-ZHREE a DRWAHT duh lah BAHNK", "There's a bakery to the right of the bank."], ["3. Sur la place, il y a une pharmacie derrière le restaurant L'Audience. → FAUX", "… dair-ee-AIR luh res-to-RAHN", "FALSE — the magazine says L'Audience is à côté de la pharmacie, next to it."], ["4. La banque est près de l'église Sainte-Anne.", "lah BAHNK ay pray duh lay-GLEEZ sant-ANN", "The bank is near Sainte-Anne church."], ["5. L'épicerie fine L'Arbre blanc est dans la rue Alexandre Prachay, à côté du parking. → FAUX", "… a ko-TAY dew par-KEENG", "FALSE — the magazine places it près du cinéma, near the cinema."]], "note": "Two can be settled from the magazine text alone — <strong>3 and 5 are false</strong>. The other three need the street plan, which is reproduced in full above."}, {"name": "Page 47 — Aide-mémoire : les prépositions de lieu", "items": [["Les prépositions de lieu (Où ?)", "lay pray-po-zee-see-OHN duh lee-UH", "Prepositions of place (Where?)"], ["dans", "DAHN", "in — the apple inside the jar"], ["près de ≠ loin de", "pray duh ≠ lwan duh", "near ≠ far from"], ["devant ≠ derrière", "duh-VAHN ≠ dair-ee-AIR", "in front of ≠ behind"], ["en face de", "ahn fahss duh", "opposite"], ["à côté de", "a ko-TAY duh", "next to"], ["sur ≠ sous", "SEWR ≠ SOO", "on ≠ under"], ["à gauche de ≠ à droite de", "a GOSH duh ≠ a DRWAHT duh", "to the left of ≠ to the right of"]], "note": "The book draws each one with a red apple and a blue jar — the apple inside, on top, underneath, in front, behind, beside. Every preposition here except <em>dans</em>, <em>sur</em> and <em>sous</em> is followed by <strong>de</strong>, which is why the contracted article comes next.", "cols": "two"}, {"name": "Page 47 — activité 11 et Point Langue : l'article contracté", "items": [["Activité 11 : Écoutez et regardez le plan. Dites si les informations sont correctes. Justifiez.", "… deet see lay zan-for-ma-see-OHN sohn ko-REKT", "Listen and check the information against the map. Justify."], ["a) Repérez dans l'aide-mémoire les expressions avec de.", "ruh-pay-RAY … lay zeks-pray-see-OHN a-vek duh", "Find the expressions with de in the aide-mémoire."], ["b) Observez ces expressions sur la page de Pontoise infos p. 46 et dans la transcription de l'activité 11, p. 217.", "ob-sair-VAY say zeks-pray-see-OHN", "Look at these expressions in the magazine and in the transcript."], ["c) Complétez avec des, de la, du, de l'.", "kohm-play-TAY a-vek", "Complete with des, de la, du, de l'."], ["la banque → près DE LA banque", "pray duh lah BAHNK", "feminine → de la"], ["le restaurant → à côté DU restaurant", "a ko-TAY dew res-to-RAHN", "masculine → du (de + le)"], ["l'hôtel de ville → à droite DE L'hôtel de ville", "a DRWAHT duh lo-TELL duh VEEL", "before a vowel → de l'"], ["les écoles → loin DES écoles", "lwan day zay-KOL", "plural → des (de + les)"]], "note": "Only two forms actually contract: <strong>de + le = du</strong> and <strong>de + les = des</strong>. <em>de la</em> and <em>de l'</em> stay exactly as they are. Saying <em>près de le restaurant</em> is simply not French."}, {"name": "Page 47 — Point Langue : les lieux de la ville", "items": [["Classez les lieux de la ville dans les catégories suivantes : administrations – culture – commerces – nature – éducation – autres", "kla-SAY lay lee-UH duh lah VEEL", "Sort the town's places into these categories."], ["l'hôtel de ville (= la mairie) — administrations", "lo-TELL duh VEEL (lah may-REE)", "the town hall"], ["la poste — administrations", "lah POST", "the post office"], ["la boulangerie — commerces", "lah boo-lahn-ZHREE", "the bakery"], ["le cinéma — culture", "luh see-nay-MAH", "the cinema"], ["la cathédrale — culture", "lah ka-tay-DRAL", "the cathedral"], ["le théâtre — culture", "luh tay-AH-truh", "the theatre"], ["le restaurant — commerces", "luh res-to-RAHN", "the restaurant"], ["le marché — commerces", "luh mar-SHAY", "the market"], ["le musée — culture", "luh mew-ZAY", "the museum"], ["l'église — culture", "lay-GLEEZ", "the church"], ["l'école — éducation", "lay-KOL", "the school"], ["le jardin — nature", "luh zhar-DAN", "the garden"], ["la rivière — nature", "lah ree-vee-AIR", "the river"], ["la bibliothèque — culture", "lah bee-blee-o-TEK", "the library"], ["l'hôpital — autres", "lo-pee-TAL", "the hospital"], ["l'épicerie — commerces", "lay-pee-SREE", "the grocer's"], ["l'université — éducation", "lew-nee-vair-see-TAY", "the university"], ["le supermarché — commerces", "luh sew-pair-mar-SHAY", "the supermarket"], ["la pharmacie — commerces", "lah far-ma-SEE", "the pharmacy"]], "cols": "two"}, {"name": "Page 47 — activités 12, 13 et le projet", "items": [["Activité 12 : Vous participez au forum de citemag.com.", "voo par-tee-see-PAY oh fo-ROM", "You take part in the citemag.com forum."], ["Participez à notre forum sur la ville !", "par-tee-see-PAY a NOT-ruh fo-ROM sewr lah VEEL", "Take part in our forum about the town!"], ["Avez-vous un endroit préféré dans votre ville ?", "a-vay VOO uh nahn-DRWAH pray-fay-RAY", "Do you have a favourite spot in your town?"], ["Dites quel endroit vous préférez, indiquez où il se trouve et expliquez pourquoi vous l'aimez.", "… an-dee-KAY oo eel suh TROOV … eks-plee-KAY poor-KWAH", "Say which place you prefer, where it is, and why you like it."], ["Activité 13 : En petits groupes, vous réalisez une photo-souvenir.", "… ewn fo-to-soo-vuh-NEER", "In small groups, take a group photo."], ["1. Imaginez la photo. Combien de personnes ? Qui ? Quel type de photo : classique ou originale ?", "kohm-bee-AN duh pair-SUN", "Imagine the photo. How many people? Who? What kind: classic or original?"], ["2. Réalisez votre photo de groupe. Indiquez à chaque personne où se placer.", "… oo suh pla-SAY", "Take the photo. Tell each person where to stand."], ["Projet Dossier 2 — Tâche leçon 1 : Sélectionner des lieux d'intérêt dans votre quartier.", "say-lek-see-o-NAY day lee-UH dan-tay-RAY", "Task: select places of interest in your neighbourhood."]], "note": "Activity 13 is the practical use of the whole lesson: you have to tell people where to stand using <em>à côté de, devant, derrière, à gauche de</em>."}], "bookpages": ["p043", "p044", "p045", "p046", "p047"]}, {"id": "ae-d2l2", "label": "Dossier 2 · Leçon 2", "name": "Passer une nuit…", "summary": "Pages 48–51, complete. The Annecy hostel website, Lucie's booking email, hotel categories, the nine-step walking route with every street named, ordinals, three irregular verbs and à pied versus en voiture.", "art": "itineraire", "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 2, in page order.", "tracks": [{"n": 67, "label": "p.48 act. 2 & 4 — le dialogue à l'auberge"}, {"n": 68, "label": "p.48 act. 2 & 4 — le dialogue à l'auberge"}, {"n": 69, "label": "p.49 act. 6 — les demandes à la réception"}, {"n": 70, "label": "p.49 act. 6 — vérifiez vos réponses"}, {"n": 71, "label": "p.49 act. 7 — phonétique, l'intonation"}, {"n": 72, "label": "p.49 act. 7 — le mot accentué"}, {"n": 73, "label": "p.49 act. 7 — transformez en questions"}, {"n": 74, "label": "p.50 act. 11 — Lucie ne trouve pas l'auberge"}, {"n": 75, "label": "p.50 act. 11 — l'itinéraire de l'employé"}, {"n": 76, "label": "p.51 act. 12 — où va Lucie ?"}, {"n": 77, "label": "p.51 act. 12 — suivez les itinéraires"}]}, {"name": "Page 48 — le site de la FUAJ", "items": [["Passer une nuit…", "pa-SAY ewn NWEE", "Spending a night…"], ["S'informer sur l'hébergement", "san-for-MAY sewr lay-bairzh-MAHN", "Finding out about accommodation"], ["http://www.fuaj/Auberges/Annecy.org", "…", "the web address in the browser bar"], ["FUAJ — Fédération unie des auberges de jeunesse", "fay-day-ra-see-OHN ew-NEE day zo-BAIRZH duh zhuh-NESS", "the French youth hostel federation"], ["HOSTELLING INTERNATIONAL — HI-FRANCE", "…", "the international network logo"], ["Accueil > Auberges en France > Rhône-Alpes > Annecy", "a-KUH-yuh > o-BAIRZH ahn FRAHNSS", "the breadcrumb trail: Home > Hostels in France > Rhône-Alpes > Annecy"], ["Auberge de jeunesse d'Annecy", "o-BAIRZH duh zhuh-NESS da-nuh-SEE", "Annecy youth hostel"]]}, {"name": "Page 48 — les coordonnées et l'ouverture", "items": [["> Coordonnées", "ko-or-do-NAY", "Contact details"], ["4 route du Semnoz", "katr root dew sem-NOZ", "the street address"], ["74000 Annecy", "swa-sahnt-ka-TORZ meel, a-nuh-SEE", "postcode 74000 — the 74 is Haute-Savoie"], ["(33)(0)4 50 45 33 19", "… zay-RO katr …", "the landline, with the international code 33"], ["(33)(0)4 50 72 77 52", "…", "the second number"], ["annecy@fuaj.org", "a-nuh-SEE a-ro-BAHZ few-AZH POINT org", "the email address"], ["> Ouverture", "oo-vair-TEWR", "Opening"], ["17/01 – 30/11", "dee-SET zhahn-vee-AY oh trahnt no-VAHM-bruh", "open 17 January to 30 November"], ["Auberge : 24h/24", "o-BAIRZH : van-katr UR sewr van-KATR", "Hostel: open 24 hours a day"], ["Accueil : 7h-23h", "a-KUH-yuh : set UR a van-trwa ZUR", "Reception: 7am to 11pm"]], "note": "The 04 dialling code confirms the southeast, matching Annecy in the Alps. The page also carries a row of pictogram icons for the facilities, a wheelchair-access symbol, and a rating of three small figures."}, {"name": "Page 48 — activité 1", "items": [["Observez cette page du site de la Fédération des auberges de jeunesse.", "ob-sair-VAY set pahzh dew SEET", "Look at this page from the youth hostel federation's site."], ["1. Dites si les informations suivantes sont données.", "deet see lay zan-for-ma-see-OHN sohn do-NAY", "Say whether the following information is given."], ["dates d'ouverture de l'auberge → OUI (17/01 – 30/11)", "dat doo-vair-TEWR", "opening dates — yes"], ["activités → NON", "ak-tee-vee-TAY", "activities — no"], ["horaires d'ouverture → OUI (24h/24 ; accueil 7h-23h)", "o-RAIR doo-vair-TEWR", "opening hours — yes"], ["services et équipements → OUI (les symboles en bas de page)", "sair-VEESS ay zay-keep-MAHN", "services and facilities — yes, via the icons"], ["tarifs et conditions de réservation → NON", "ta-REEF ay kohn-dee-see-OHN duh ray-zair-va-see-OHN", "rates and booking conditions — no"], ["coordonnées → OUI (adresse, téléphone, mail)", "ko-or-do-NAY", "contact details — yes"], ["2. Observez les symboles en bas de la page. Dites quelle est la différence entre un hôtel et une auberge de jeunesse.", "… lah dee-fay-RAHNSS AHN-truh", "Say what the difference is between a hotel and a youth hostel."], ["→ Une auberge de jeunesse a des chambres collectives, une cuisine à disposition et une carte d'adhérent obligatoire ; c'est moins cher qu'un hôtel.", "ewn kart da-day-RAHN o-blee-ga-TWAHR", "Shared rooms, a kitchen you can use, compulsory membership card, and cheaper."]]}, {"name": "Page 48 — activités 2 et 3 : les six questions", "items": [["Activité 2 : Écoutez le dialogue et identifiez la situation.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue and identify the situation."], ["Activité 3 : Lisez les questions suivantes et faites des hypothèses. Qui pose chaque question : Lucie ou l'employé de l'auberge ?", "kee poz shak kes-tee-OHN", "Who asks each question: Lucie or the hostel employee?"], ["1. Est-ce que vous avez de la place pour samedi prochain ? → LUCIE", "es-kuh voo za-VAY duh lah PLAHSS poor sam-DEE pro-SHAN", "Do you have room for next Saturday?"], ["2. Vous voulez rester combien de temps ? → L'EMPLOYÉ", "voo voo-LAY res-TAY kohm-bee-AN duh TAHN", "How long do you want to stay?"], ["3. Quel est le prix ? → LUCIE", "kel ay luh PREE", "What's the price?"], ["4. Le petit déjeuner est inclus ? → LUCIE", "luh puh-tee day-zhuh-NAY et an-KLEW", "Is breakfast included?"], ["5. Est-ce qu'il y a une salle de bains dans la chambre ? → LUCIE", "es-keel ee a ewn sal duh BAN", "Is there a bathroom in the room?"], ["6. Vous avez la carte d'adhérent ? → L'EMPLOYÉ", "voo za-VAY lah kart da-day-RAHN", "Do you have the membership card?"]], "note": "The logic: the <strong>customer</strong> asks about availability, price, breakfast and facilities; the <strong>employee</strong> asks about length of stay and membership."}, {"name": "Page 48 — le mail de Lucie à Nora", "items": [["De : luciedurel@hotmail.com", "duh", "From:"], ["À : norachoukri@gmail.com", "a", "To:"], ["Objet : réservation", "ob-ZHAY : ray-zair-va-see-OHN", "Subject: booking"], ["Nora,", "no-RAH", "Nora,"], ["La réservation à l'auberge de jeunesse, c'est ok :", "lah ray-zair-va-see-OHN a lo-BAIRZH duh zhuh-NESS", "The hostel booking is done:"], ["- réservation pour 3 nuits, à partir du samedi 16.", "poor trwah NWEE, a par-TEER dew sam-DEE SEZ", "booking for 3 nights, from Saturday the 16th"], ["- chambre à 6 lits ; lavabo dans la chambre, douche et toilettes à l'étage.", "SHAHM-bruh a see LEE ; la-va-BO … doosh ay twa-LETT a lay-TAHZH", "6-bed room; washbasin in the room, shower and toilets on the landing"], ["- 21 € 80 par jour et par personne, petit déjeuner et draps inclus dans le prix.", "van-tay-uh nuh-RO katr-VAN, par ZHOOR ay par pair-SUN", "€21.80 per day per person, breakfast and sheets included"], ["La carte d'adhérent à la FUAJ est obligatoire !", "lah kart da-day-RAHN … ay to-blee-ga-TWAHR", "The FUAJ membership card is compulsory!"], ["Tu achètes les billets de train ? La gare SNCF est à 2 kilomètres de l'auberge.", "tew a-SHET lay bee-YAY duh TRAN … lah gar es-en-say-EFF", "Are you buying the train tickets? The station is 2 km from the hostel."], ["Bises, Lucie", "BEEZ", "Kisses, Lucie"]], "note": "Activity 4 asks you to spot the <strong>errors</strong> in this email by checking it against the recording — Lucie has written down some details wrongly."}, {"name": "Page 49 — Point Langue : poser des questions pour s'informer", "items": [["a) Observez.", "ob-sair-VAY", "Observe."], ["— Vous avez la carte d'adhérent ? — Oui. / Non.", "voo za-VAY lah kart da-day-RAHN", "intonation question"], ["— Est-ce que vous avez la carte d'adhérent ? — Oui. / Non.", "es-kuh voo za-VAY", "est-ce que question"], ["b) Relisez les questions de l'activité 3 et trouvez d'autres exemples de questions de ce type.", "… troo-VAY DO-truh zeg-ZAHM-pluh", "Find other examples of this kind of question in activity 3."], ["Questions par intonation : Vous voulez rester combien de temps ? · Quel est le prix ? · Le petit déjeuner est inclus ? · Vous avez la carte d'adhérent ?", "…", "the intonation ones"], ["Questions avec est-ce que : Est-ce que vous avez de la place ? · Est-ce qu'il y a une salle de bains ?", "es-kuh / es-KEEL", "the est-ce que ones"]], "note": "Both get the same answer — <em>oui</em> or <em>non</em>. <strong>Est-ce que</strong> is slightly more careful; plain intonation is what you hear most in speech."}, {"name": "Page 49 — Aide-mémoire : remercier et réagir", "items": [["Merci. / Merci beaucoup.", "mair-SEE / mair-SEE bo-KOO", "Thank you. / Thanks very much."], ["Je vous remercie.", "zhuh voo ruh-mair-SEE", "I thank you. — more formal"], ["De rien.", "duh ree-AN", "You're welcome. / It's nothing."], ["Je vous en prie.", "zhuh voo zahn PREE", "You're welcome. — more formal"]]}, {"name": "Page 49 — activité 5 : les demandes à la réception", "items": [["Lisez les demandes d'information suivantes à la réception de différents hôtels.", "lee-ZAY lay duh-MAHND dan-for-ma-see-OHN", "Read these requests made at different hotel receptions."], ["Dites où elles sont posées : dans une auberge – dans un hôtel de luxe – les deux sont possibles.", "deet oo el sohn po-ZAY", "Say where each is asked: a hostel, a luxury hotel, or either."], ["1. Est-ce que vous avez des chambres doubles ? → LES DEUX", "es-kuh voo za-VAY day SHAHM-bruh DOO-bluh", "Do you have double rooms? — either"], ["2. La suite bleue est libre pour le week-end ? → HÔTEL DE LUXE", "lah sweet BLUH ay LEE-bruh", "Is the blue suite free? — luxury hotel"], ["3. C'est possible de faire la cuisine ? → AUBERGE", "say po-SEE-bluh duh fair lah kwee-ZEEN", "Can I cook? — hostel"], ["4. Vous acceptez les animaux ? → LES DEUX", "voo zak-sep-TAY lay za-nee-MO", "Do you accept pets? — either"], ["5. Est-ce que les chambres sont mixtes ? → AUBERGE", "es-kuh lay SHAHM-bruh sohn MEEKST", "Are the rooms mixed? — hostel"], ["6. Quelle est la différence entre les chambres à 300 euros et les chambres à 400 euros ? → HÔTEL DE LUXE", "kel ay lah dee-fay-RAHNSS", "What's the difference between the €300 and €400 rooms? — luxury hotel"], ["Activité 6 : Écoutez les dialogues et vérifiez vos réponses de l'activité 5.", "… vay-ree-fee-AY vo ray-POHNSS", "Listen and check your answers."]], "note": "The giveaways: a <em>suite</em> and a €400 room belong to a luxury hotel; cooking for yourself and mixed dormitories belong to a hostel."}, {"name": "Page 49 — Point Culture : les types d'hébergement", "items": [["En France, les hôtels sont classés en catégories, à partir de critères de confort, d'hygiène et de services :", "… sohn kla-SAY ahn ka-tay-go-REE … kree-TAIR duh kohn-FOR, dee-zhee-EN ay duh sair-VEESS", "French hotels are graded on comfort, hygiene and service:"], ["de 1 étoile (*) pour les hôtels simples", "duh ew nay-TWAHL poor lay zo-TELL SAN-pluh", "from 1 star for simple hotels"], ["à 5 étoiles (*****) pour les hôtels de grand luxe.", "a sank ay-TWAHL … duh grahn LEWKS", "to 5 stars for luxury hotels"], ["Il y a d'autres types d'hébergement : auberges de jeunesse, chambres d'hôtes…", "… o-BAIRZH duh zhuh-NESS, SHAHM-bruh DOTE", "Other types: youth hostels, bed and breakfasts…"]]}, {"name": "Page 49 — activités 7, 8 et 9", "items": [["Activité 7 Phonétique a) Écoutez, repérez les questions puis répondez. L'intonation est montante ou descendante ?", "lan-to-na-see-OHN ay mohn-TAHNT oo day-sahn-DAHNT", "Is the intonation rising or falling?"], ["b) Écoutez et indiquez quel mot ou groupe de mots est accentué.", "… kel mo … ay ak-sahn-tew-AY", "Say which word or group of words is stressed."], ["c) Écoutez. Transformez les affirmations en questions avec est-ce que, puis sans est-ce que.", "trahns-for-MAY lay za-feer-ma-see-OHN ahn kes-tee-OHN", "Turn the statements into questions, with and then without est-ce que."], ["Activité 8 a) Regardez les photos et identifiez l'auberge de jeunesse – l'hôtel 2 étoiles – l'hôtel de luxe.", "… ee-dahn-tee-fee-AY", "Look at the photos and identify each."], ["photo a : une enseigne HOTEL ** → l'hôtel 2 étoiles", "ew nahn-SEN-yuh", "photo a: a two-star hotel sign"], ["photo b : une façade avec des drapeaux → l'hôtel de luxe", "ewn fa-SAHD a-vek day dra-PO", "photo b: a grand facade with flags — the luxury hotel"], ["photo c : un portier en uniforme → l'hôtel de luxe", "uhn por-tee-AY ah new-nee-FORM", "photo c: a doorman in uniform"], ["b) Échangez en petits groupes : dites quel type d'hébergement vous préférez et pourquoi.", "ay-shahn-ZHAY", "Say which type of accommodation you prefer and why."], ["Je préfère les hôtels de catégorie moyenne (** ou ***) parce que…", "zhuh pray-FAIR lay zo-TELL duh ka-tay-go-REE mwa-YEN", "I prefer mid-range hotels because…"], ["Activité 9 : À deux, choisissez un des hébergements de l'activité 8 et jouez la scène.", "a DUH, shwa-zee-SAY", "In pairs, choose one and act out the scene."], ["Vous arrivez à la réception et vous parlez avec le/la réceptionniste.", "voo za-ree-VAY a lah ray-sep-see-OHN", "You arrive at reception and speak to the receptionist."], ["Vous demandez des informations puis vous réservez.", "voo duh-mahn-DAY … pwee voo ray-zair-VAY", "You ask for information then book."], ["Les informations suivantes sont nécessaires : les dates et le nombre de nuits ; le nombre de personnes ; le prix de la chambre ; le confort de la chambre.", "lay dat ay luh NOHM-bruh duh NWEE", "the four things you must cover"]]}, {"name": "Page 49 — la fiche de réservation", "items": [["FICHE DE RÉSERVATION", "feesh duh ray-zair-va-see-OHN", "BOOKING FORM"], ["Nom :", "NOHN", "Surname"], ["Prénom :", "pray-NOHN", "First name"], ["Adresse :", "a-DRESS", "Address"], ["Téléphone :", "tay-lay-FON", "Telephone"], ["E-mail :", "ay-MAIL", "Email"], ["Date d'arrivée :", "dat da-ree-VAY", "Arrival date"], ["Date de départ :", "dat duh day-PAR", "Departure date"], ["Nombre de nuits :", "NOHM-bruh duh NWEE", "Number of nights"], ["Type de chambre :", "teep duh SHAHM-bruh", "Room type"]], "cols": "two"}, {"name": "Page 50 — Infos pratiques : le site", "items": [["Indiquer un itinéraire", "an-dee-KAY uh nee-tee-nay-RAIR", "Giving directions"], ["http://www.fuaj/Auberges/Annecy/Infos.org", "…", "the web address"], ["Accueil > Auberges en France > Rhône-Alpes > Annecy > Infos pratiques", "… an-FO pra-TEEK", "Home > Hostels in France > Rhône-Alpes > Annecy > Practical information"], ["Pour aller à pied de la gare à l'auberge :", "poor a-LAY a pee-AY duh lah GAR a lo-BAIRZH", "To walk from the station to the hostel:"]]}, {"name": "Page 50 — l'itinéraire complet, étape par étape", "items": [["- aller tout droit face à la gare, rue des Glières", "a-LAY too DRWAH fahss a lah GAR, rew day glee-AIR", "go straight ahead facing the station, rue des Glières"], ["- tourner à gauche, rue Royale", "toor-NAY a GOSH, rew rwa-YAL", "turn left, rue Royale"], ["- après la rue Carnot, la rue Royale change de nom : continuer tout droit rue du Pâquier", "a-PRAY lah rew kar-NO … kohn-tee-new-AY too DRWAH rew dew pa-kee-AY", "after rue Carnot, rue Royale changes name: carry straight on into rue du Pâquier"], ["- tourner à droite, quai Eustache Chappuis ; le lac d'Annecy est à votre gauche", "toor-NAY a DRWAHT, kay uh-STAHSH sha-PWEE ; luh lak da-nuh-SEE", "turn right along quai Eustache Chappuis; Lake Annecy is on your left"], ["- prendre le pont de la Halle pour traverser la rivière ; vous arrivez place aux Bois", "PRAHN-druh luh pohn duh lah AL poor tra-vair-SAY lah ree-vee-AIR", "take the Halle bridge across the river; you arrive at place aux Bois"], ["- aller vers la gauche, prendre la rue des Marquisats", "a-LAY vair lah GOSH, PRAHN-druh lah rew day mar-kee-ZAH", "head left, take rue des Marquisats"], ["- à l'hôtel de police, tourner à droite et monter l'avenue du Trésum", "a lo-TELL duh po-LEESS, toor-NAY a DRWAHT ay mohn-TAY lav-NEW dew tray-ZOM", "at the police station, turn right and go up avenue du Trésum"], ["- tourner à gauche, boulevard de la Corniche", "toor-NAY a GOSH, bool-VAR duh lah kor-NEESH", "turn left, boulevard de la Corniche"], ["- prendre le chemin du Belvédère à droite", "PRAHN-druh luh shuh-MAN dew bel-vay-DAIR a DRWAHT", "take chemin du Belvédère on the right"], ["L'auberge se trouve route du Semnoz, sur la gauche.", "lo-BAIRZH suh TROOV root dew sem-NOZ, sewr lah GOSH", "The hostel is on route du Semnoz, on the left."]], "note": "Nine steps in order. Notice the pattern: every instruction is an <strong>infinitive</strong> — <em>aller, tourner, continuer, prendre, monter</em> — because this is written instruction, not speech."}, {"name": "Page 50 — les lieux du plan d'Annecy", "items": [["la Gare SNCF", "lah gar es-en-say-EFF", "the railway station — the starting point"], ["le Théâtre de l'Échange", "luh tay-AH-truh duh lay-SHAHNZH", "a theatre on the map"], ["le Centre Bonlieu — Office de tourisme", "luh sahn-truh bohn-lee-UH — o-FEESS duh too-REEZ-muh", "the cultural centre and tourist office"], ["la Poste", "lah POST", "the post office"], ["la cathédrale St-Pierre", "lah ka-tay-DRAL san-pee-AIR", "Saint-Pierre cathedral"], ["le lac d'Annecy", "luh lak da-nuh-SEE", "Lake Annecy"], ["le pont de la Halle", "luh pohn duh lah AL", "the Halle bridge"], ["la place aux Bois", "lah plahss oh BWAH", "a square on the route"], ["le Musée-Château", "luh mew-zay-sha-TO", "the castle museum"], ["la place du Château", "lah plahss dew sha-TO", "the castle square"], ["l'Hôtel de Police", "lo-TELL duh po-LEESS", "the police station"], ["la clinique", "lah klee-NEEK", "the clinic"], ["l'Auberge de jeunesse", "lo-BAIRZH duh zhuh-NESS", "the youth hostel — the destination"], ["la rue des Glières", "lah rew day glee-AIR", "first street of the route"], ["la rue Royale", "lah rew rwa-YAL", "second street"], ["la rue Carnot", "lah rew kar-NO", "where the name changes"], ["la rue du Pâquier", "lah rew dew pa-kee-AY", "the continuation"], ["le quai Eustache Chappuis", "luh kay uh-STAHSH sha-PWEE", "the lakeside quay"], ["la rue des Marquisats", "lah rew day mar-kee-ZAH", "after the bridge"], ["l'avenue du Trésum", "lav-NEW dew tray-ZOM", "the climb"], ["le boulevard de la Corniche", "luh bool-VAR duh lah kor-NEESH", "near the top"], ["le chemin du Belvédère", "luh shuh-MAN dew bel-vay-DAIR", "the last turning"], ["la route du Semnoz", "lah root dew sem-NOZ", "the hostel's road"], ["la rue Sommeiller", "lah rew so-may-YAY", "another street on the map"], ["la rue Vaugelas", "lah rew vo-zhuh-LAH", "another street on the map"], ["l'avenue de Crêt du Maure", "lav-NEW duh kray dew MOR", "another street on the map"]], "note": "Everything printed on the Annecy street plan, so you can trace the route without the book.", "cols": "two"}, {"name": "Page 50 — activités 10 et 11", "items": [["Activité 10 : Vous aidez Lucie à préparer son voyage à Annecy.", "voo zay-DAY lew-SEE a pray-pa-RAY", "You're helping Lucie prepare her trip to Annecy."], ["Lisez les indications pour aller de la gare à l'auberge et tracez l'itinéraire indiqué.", "… ay tra-SAY lee-tee-nay-RAIR", "Read the directions and trace the route."], ["Activité 11 : Lucie est à Annecy mais elle ne trouve pas l'auberge.", "… may zel nuh troov pah lo-BAIRZH", "Lucie is in Annecy but can't find the hostel."], ["Écoutez l'enregistrement, regardez le plan et répondez.", "… ay ray-pohn-DAY", "Listen, look at the map and answer."], ["1. Où est-elle ?", "oo ay TELL", "Where is she?"], ["2. Quel est l'itinéraire indiqué par l'employé de l'auberge ?", "kel ay lee-tee-nay-RAIR an-dee-KAY", "What route does the hostel employee give?"]], "note": "The photo shows a young woman with a backpack holding a map and shrugging — lost."}, {"name": "Page 50 — Aide-mémoire : indiquer un itinéraire", "items": [["(oral ou écrit) Vous allez vers la gauche.", "voo za-LAY vair lah GOSH", "You head to the left. — spoken or written"], ["(oral ou écrit) Vous tournez à droite.", "voo toor-NAY a DRWAHT", "You turn right. — spoken or written"], ["(à l'écrit seulement) Aller vers la gauche.", "a-LAY vair lah GOSH", "Head left. — written only"], ["(à l'écrit seulement) Tourner à droite.", "toor-NAY a DRWAHT", "Turn right. — written only"]], "note": "Two registers for the same instruction. Spoken directions use <strong>vous</strong>; written ones — signs, websites, printed routes — use the bare <strong>infinitive</strong>."}, {"name": "Page 50 — Aide-mémoire : les nombres ordinaux", "items": [["premier / première", "pruh-mee-AY / pruh-mee-AIR", "first"], ["deuxième", "duh-zee-EM", "second"], ["troisième", "trwa-zee-EM", "third"], ["quatrième", "ka-tree-EM", "fourth"], ["cinquième", "san-kee-EM", "fifth"], ["sixième", "see-zee-EM", "sixth"], ["septième", "set-YEM", "seventh"], ["huitième", "wee-tee-EM", "eighth"], ["neuvième", "nuh-vee-EM", "ninth"], ["dixième", "dee-zee-EM", "tenth"]], "note": "All formed by adding <strong>-ième</strong> to the number, with two adjustments: <em>quatre</em> drops its e, and <em>cinq</em> gains a u. Only <strong>premier</strong> has a separate feminine form.", "cols": "three"}, {"name": "Page 51 — Point Langue : indiquer un itinéraire", "items": [["Associez les dessins et les formules.", "a-so-see-AY lay day-SAN ay lay for-MEWL", "Match the drawings to the phrases."], ["prendre la rue…", "PRAHN-druh lah REW", "take … street"], ["prendre la deuxième (rue) à gauche", "PRAHN-druh lah duh-zee-EM a GOSH", "take the second street on the left"], ["aller / tourner à gauche", "a-LAY / toor-NAY a GOSH", "go / turn left"], ["aller / continuer tout droit", "a-LAY / kohn-tee-new-AY too DRWAH", "go / carry straight on"], ["aller / tourner à droite", "a-LAY / toor-NAY a DRWAHT", "go / turn right"], ["traverser la rue", "tra-vair-SAY lah REW", "cross the street"]], "note": "Six stick-figure drawings, numbered 1 to 6: <strong>1</strong> a figure at a pedestrian crossing with a traffic light → traverser la rue · <strong>2</strong> a figure with an arrow curving right → tourner à droite · <strong>3</strong> a figure with an arrow curving left → tourner à gauche · <strong>4</strong> a figure with a straight arrow → continuer tout droit · <strong>5</strong> a figure entering a road → prendre la rue · <strong>6</strong> a figure taking the second turning → prendre la deuxième à gauche."}, {"name": "Page 51 — activités 12 et 13", "items": [["Activité 12 : Où va Lucie ? Écoutez et suivez les itinéraires sur le plan p. 50.", "oo va lew-SEE ? … ay swee-VAY lay zee-tee-nay-RAIR", "Where is Lucie going? Listen and follow the routes on the map."], ["Le point de départ est toujours la gare.", "luh pwan duh day-PAR ay too-ZHOOR lah GAR", "The starting point is always the station."], ["Activité 13 : Par deux, trouvez sur le plan un autre itinéraire pour aller de la gare à l'auberge de jeunesse.", "par DUH, troo-VAY … uh NO-truh ee-tee-nay-RAIR", "In pairs, find another route from the station to the hostel."], ["Indiquez votre itinéraire au groupe.", "an-dee-KAY VOT-ruh ee-tee-nay-RAIR oh GROOP", "Give your route to the group."]]}, {"name": "Page 51 — Aide-mémoire : descendre, prendre, aller", "items": [["je descends", "zhuh day-SAHN", "I go down / get off"], ["tu descends", "tew day-SAHN", "you go down"], ["il / elle descend", "eel day-SAHN", "he / she goes down"], ["nous descendons", "noo day-sahn-DOHN", "we go down"], ["vous descendez", "voo day-sahn-DAY", "you go down"], ["ils / elles descendent", "eel day-SAHND", "they go down"], ["je prends", "zhuh PRAHN", "I take"], ["tu prends", "tew PRAHN", "you take"], ["il / elle prend", "eel PRAHN", "he / she takes"], ["nous prenons", "noo pruh-NOHN", "we take"], ["vous prenez", "voo pruh-NAY", "you take"], ["ils / elles prennent", "eel PREN", "they take"], ["je vais", "zhuh VAY", "I go"], ["tu vas", "tew VAH", "you go"], ["il / elle va", "eel VAH", "he / she goes"], ["nous allons", "noo za-LOHN", "we go"], ["vous allez", "voo za-LAY", "you go"], ["ils / elles vont", "eel VOHN", "they go"]], "note": "Three of the most irregular and most necessary verbs for directions. Note that <em>descendre</em> and <em>prendre</em> both hide their d in the singular — <em>je prends</em> sounds like <em>prahn</em>, with no d at all.", "cols": "three"}, {"name": "Page 51 — NB : les compléments", "items": [["prendre la rue Danton / l'avenue Raspail", "PRAHN-druh lah rew dahn-TOHN / lav-NEW ras-PIGH", "take rue Danton / avenue Raspail"], ["prendre le métro / la voiture / le train / l'avion", "PRAHN-druh luh may-TRO / lah vwa-TEWR / luh TRAN / la-vee-OHN", "take the metro / the car / the train / the plane"], ["aller à pied", "a-LAY a pee-AY", "to go on foot"], ["aller à vélo", "a-LAY a vay-LO", "to go by bike"], ["aller en voiture", "a-LAY ahn vwa-TEWR", "to go by car"], ["aller en train", "a-LAY ahn TRAN", "to go by train"], ["aller en avion", "a-LAY ah na-vee-OHN", "to go by plane"], ["aller en bus", "a-LAY ahn BEWSS", "to go by bus"]], "note": "The split to memorise: <strong>à</strong> for things you sit <em>on</em> or use your own body for — <em>à pied, à vélo</em>. <strong>en</strong> for things you get <em>inside</em> — <em>en voiture, en train, en avion, en bus</em>.", "cols": "two"}, {"name": "Page 51 — activité 14 et le projet", "items": [["Dans un mail à un ami, vous indiquez votre adresse et l'itinéraire pour venir chez vous à partir de la gare ou de chez lui.", "… lee-tee-nay-RAIR poor vuh-NEER shay VOO", "In an email to a friend, give your address and the route to your place."], ["Vous envoyez aussi le plan correspondant à l'itinéraire.", "voo zahn-vwa-YAY oh-SEE luh PLAHN", "You also send the matching map."], ["Objet : samedi soir", "ob-ZHAY : sam-DEE SWAHR", "Subject: Saturday evening"], ["Pièces jointes : plan.pdf", "pee-ESS ZHWANT", "Attachments: plan.pdf"], ["Salut !", "sa-LEW", "Hi!"], ["Confirmation pour samedi : dîner à 20 h.", "kohn-feer-ma-see-OHN poor sam-DEE : dee-NAY a van TUR", "Confirming Saturday: dinner at 8pm."], ["Mon adresse :", "moh na-DRESS", "My address:"], ["Pour venir, tu…", "poor vuh-NEER, tew", "To get here, you…"], ["À samedi !", "a sam-DEE", "See you Saturday!"], ["PS : voir le plan en pièce jointe", "voo-AR luh plahn ahn pee-ESS ZHWANT", "PS: see the attached map"], ["Projet Dossier 2 — Tâche leçon 2 : Élaborer un itinéraire de balade.", "ay-la-bo-RAY uh nee-tee-nay-RAIR duh ba-LAHD", "Task: work out a walking route."]], "note": "Note the register: this email uses <strong>tu</strong> (<em>Pour venir, tu…</em>), unlike the website's infinitives."}], "bookpages": ["p048", "p049", "p050", "p051"]}, {"id": "ae-d2l3", "label": "Dossier 2 · Leçon 3", "name": "Bons baisers de…", "summary": "Pages 52–55. Writing a postcard — the greetings and sign-offs, describing a place, the weather, and saying which country something comes from or goes to.", "art": "provenance", "groups": [{"name": "Les enregistrements", "items": [], "note": "Every 🎧 icon in Leçon 3, in page order.", "tracks": [{"n": 78, "label": "p.54 act. 5 — qui parle ? la provenance de la lettre"}, {"n": 79, "label": "p.54 act. 5 — choisissez le timbre"}, {"n": 80, "label": "p.55 act. 7 — phonétique, écoutez et répétez"}, {"n": 81, "label": "p.55 act. 8 — phonétique, la syllabe accentuée"}, {"n": 82, "label": "p.55 act. 8 — comptez les syllabes"}, {"n": 83, "label": "p.55 act. 9 — les messages téléphoniques"}, {"n": 84, "label": "p.55 act. 9 — le sentiment de chaque personne"}]}, {"name": "Page 52 — activités 1 et 2", "items": [["Bons baisers de…", "bohn bay-ZAY duh", "Greetings from…"], ["Écrire une carte postale", "ay-KREER ewn kart pos-TAL", "Writing a postcard"], ["Activité 1 : Lisez les trois cartes postales et indiquez pour chacune :", "… ay an-dee-KAY poor sha-KEWN", "Read the three postcards and for each one say:"], ["1. qui écrit (l'expéditeur) ;", "kee ay-KREE (leks-pay-dee-TUR)", "who writes — the sender"], ["2. à qui (le destinataire) ;", "a KEE (luh des-tee-na-TAIR)", "to whom — the addressee"], ["3. le type de relation (amicale, familiale ou professionnelle).", "luh teep duh ruh-la-see-OHN (a-mee-KAL, fa-mee-lee-AL oo pro-fay-see-o-NELL)", "the type of relationship: friendly, family or professional"], ["Activité 2 : Associez les cartes postales aux photos correspondantes. Justifiez vos réponses.", "a-so-see-AY lay kart pos-TAL oh fo-TO", "Match the postcards to the photos. Justify your answers."]], "note": "The photos are numbered around the page: <strong>1</strong> the Statue of Liberty and the Manhattan skyline, <strong>2</strong> Rio with the Sugarloaf, <strong>3</strong> a Venice canal with a gondola, <strong>4</strong> the Sphinx and a pyramid, <strong>5</strong> the Great Wall of China."}, {"name": "Page 52 — carte a : Annie, devant les pyramides", "items": [["Chère maman,", "shair ma-MAHN", "Dear mum,"], ["Je suis aujourd'hui devant les pyramides.", "zhuh swee zoh-zhoor-DWEE duh-VAHN lay pee-ra-MEED", "Today I'm in front of the pyramids."], ["C'est extraordinaire !", "set eks-tra-or-dee-NAIR", "It's extraordinary!"], ["Mais il fait très chaud dans ce pays : 36 °C !", "may zeel fay tray SHOW dahn suh pay-EE : trahnt-see duh-GRAY", "But it's very hot in this country: 36°C!"], ["Demain, je fais du shopping dans un souk.", "duh-MAN, zhuh fay dew sho-PEENG dahn zuhn SOOK", "Tomorrow I'm going shopping in a souk."], ["Je te téléphone à mon retour.", "zhuh tuh tay-lay-FON a mohn ruh-TOOR", "I'll phone you when I get back."], ["Bisous, Annie", "bee-ZOO", "Kisses, Annie"], ["Mme Pascale ADAM, 105 rue du Théâtre, 35000 Rennes, France", "ma-DAM pas-KAL a-DAHM", "the address side"]], "note": "<strong>Expéditeur :</strong> Annie · <strong>Destinataire :</strong> Mme Pascale Adam · <strong>Relation :</strong> familiale — <em>Chère maman</em> and the informal <em>je te téléphone</em>. The photo is <strong>4</strong>, the pyramids — Egypt."}, {"name": "Page 52 — carte b : Catherine, à New York", "items": [["Salut les filles !", "sa-LEW lay FEE-yuh", "Hi girls!"], ["Imaginez l'avenue la plus chic du monde…", "ee-ma-zhee-NAY lav-NEW lah plew SHEEK dew MOHND", "Imagine the smartest avenue in the world…"], ["Imaginez les restaurants : toutes les cuisines du monde !", "… lay res-to-RAHN : toot lay kwee-ZEEN dew MOHND", "Imagine the restaurants: every cuisine in the world!"], ["Imaginez l'architecture…", "ee-ma-zhee-NAY lar-shee-tek-TEWR", "Imagine the architecture…"], ["J'adore cette ville !", "zha-DOR set VEEL", "I love this city!"], ["Je marche beaucoup, je visite les musées, je me promène dans Central Park…", "zhuh marsh bo-KOO … zhuh muh pro-MEN", "I walk a lot, I visit the museums, I stroll in Central Park…"], ["Tout à l'heure, je visite Chinatown !", "too ta LUR, zhuh vee-ZEET", "Later on I'm visiting Chinatown!"], ["À bientôt au bureau, avec les photos.", "a bee-an-TO oh bew-RO", "See you soon at the office, with the photos."], ["Bises, Catherine", "BEEZ", "Kisses, Catherine"], ["Telsa informatique, Service comptabilité, 10 rue Diderot, 94300 Vincennes, France", "… sair-VEESS kohn-ta-bee-lee-TAY", "the address side: a company accounts department"]], "note": "<strong>Expéditeur :</strong> Catherine · <strong>Destinataire :</strong> her colleagues at Telsa informatique · <strong>Relation :</strong> professionnelle, though written warmly — she's writing to <em>les filles</em> at work. The photo is <strong>1</strong>, New York."}, {"name": "Page 52 — carte c : Monique, au Brésil", "items": [["Cher Max,", "shair maks", "Dear Max,"], ["Deuxième ville dans cet immense pays.", "duh-zee-EM veel dahn set ee-MAHNSS pay-EE", "Second city in this immense country."], ["Hier l'Amazonie, aujourd'hui une magnifique plage.", "ee-AIR la-ma-zo-NEE, oh-zhoor-DWEE ewn ma-nyee-FEEK PLAHZH", "Yesterday the Amazon, today a magnificent beach."], ["C'est un pays de contrastes ! Et il fait beau…", "set uhn pay-EE duh kohn-TRAST ! ay eel fay BO", "It's a country of contrasts! And the weather's fine…"], ["Le carnaval commence demain.", "luh kar-na-VAL ko-MAHNSS duh-MAN", "The carnival starts tomorrow."], ["Quatre jours de samba non-stop !", "katr zhoor duh sahm-BAH nohn-STOP", "Four days of non-stop samba!"], ["Je t'embrasse, Monique", "zhuh tahm-BRAHSS", "Love, Monique"], ["M. Max GUERY, 20 rue de la Gare, 21000 Dijon, France", "muh-SYUH maks gay-REE", "the address side"]], "note": "<strong>Expéditeur :</strong> Monique · <strong>Destinataire :</strong> M. Max Guery · <strong>Relation :</strong> amicale — <em>Cher Max… Je t'embrasse</em>. The photo is <strong>2</strong>, Rio de Janeiro."}, {"name": "Page 53 — activité 3 : les quatre types d'information", "items": [["Relisez les cartes postales et repérez les informations sur :", "… ay ruh-pay-RAY lay zan-for-ma-see-OHN sewr", "Reread the postcards and note the information about:"], ["1. le lieu ;", "luh lee-UH", "the place — devant les pyramides, cette ville, deuxième ville…"], ["2. les activités ;", "lay zak-tee-vee-TAY", "the activities — je fais du shopping, je marche, je visite…"], ["3. les impressions ;", "lay zan-pray-see-OHN", "the impressions — c'est extraordinaire, j'adore cette ville…"], ["4. le temps (la météo).", "luh TAHN (lah may-tay-O)", "the weather — il fait très chaud, il fait beau"]]}, {"name": "Page 53 — activité 4 : les quatre extraits", "items": [["a) Lisez ces quatre extraits de cartes postales.", "lee-ZAY say katr eks-TRAH", "Read these four postcard extracts."], ["1. Je vois ces merveilleuses montagnes de ma fenêtre. Il fait très beau mais il fait froid !", "zhuh vwah say mair-vay-YUHZ mohn-TAN-yuh duh ma fuh-NET-ruh", "I can see these wonderful mountains from my window. Lovely weather but cold!"], ["2. Je me baigne tous les jours sur cette belle plage. Je pense à vous.", "zhuh muh BEN-yuh too lay ZHOOR sewr set bell PLAHZH", "I swim every day on this beautiful beach. I'm thinking of you."], ["3. J'habite au centre-ville dans cet hôtel très moderne. Ma chambre est au 33e étage. La nuit, je vois les lumières de la ville, c'est magnifique !", "… oh trahnt-trwa-zee-EM ay-TAHZH … lay lew-mee-AIR", "I'm staying in the centre in this very modern hotel. My room is on the 33rd floor. At night I see the city lights — magnificent!"], ["4. C'est un endroit extraordinaire : ce château est très beau et son parc aussi ! Je passe des vacances merveilleuses !", "set uh nahn-DRWAH eks-tra-or-dee-NAIR", "It's an extraordinary place: this castle is beautiful and its park too! I'm having a wonderful holiday!"], ["b) Choisissez le symbole correspondant à chaque carte. Justifiez votre réponse.", "shwa-zee-SAY luh san-BOL", "Choose the matching symbol for each card."], ["Symbole 1 : un parasol → extrait 2 (la plage)", "uhn pa-ra-SOL", "the beach umbrella → extract 2"], ["Symbole 2 : une montagne et un soleil → extrait 1 (les montagnes)", "ewn mohn-TAN-yuh ay uhn so-LAY", "the mountain and sun → extract 1"], ["Symbole 3 : un château → extrait 4 (le château)", "uhn sha-TO", "the castle → extract 4"], ["Symbole 4 : un lit → extrait 3 (l'hôtel)", "uhn LEE", "the bed → extract 3"]], "note": "The four pictograms are the standard French tourist symbols: beach, mountain, historic monument, and accommodation."}, {"name": "Page 53 — Point Langue : les adjectifs démonstratifs", "items": [["Les adjectifs démonstratifs pour désigner quelque chose", "… poor day-zee-NYAY kel-kuh SHOZ", "Demonstrative adjectives, for pointing something out"], ["Complétez avec les formes présentes dans les cartes postales et dans les textes de l'activité 4.", "kohm-play-TAY a-vek lay FORM", "Complete with the forms found in the postcards."], ["Singulier masculin : CE pays", "suh pay-EE", "this country"], ["Singulier masculin devant une voyelle : CET hôtel", "set o-TELL", "this hotel"], ["Singulier féminin : CETTE plage", "set PLAHZH", "this beach"], ["Singulier féminin : CETTE ville", "set VEEL", "this city"], ["Pluriel masculin : CES châteaux", "say sha-TO", "these castles"], ["Pluriel féminin : CES montagnes", "say mohn-TAN-yuh", "these mountains"]], "note": "Four spellings, three sounds: <strong>ce</strong> is <em>suh</em>, <strong>cet</strong> and <strong>cette</strong> are both <em>set</em>, and <strong>ces</strong> is <em>say</em>. So masculine and feminine are indistinguishable by ear before a vowel — <em>cet hôtel</em> and <em>cette école</em> sound the same shape."}, {"name": "Page 53 — Point Langue : écrire à ses amis, sa famille", "items": [["a) Retrouvez dans les trois cartes les formules pour commencer et pour terminer.", "… poor ko-mahn-SAY ay poor tair-mee-NAY", "Find the opening and closing formulas in the three cards."], ["Pour commencer, dans les cartes : Chère maman · Salut les filles ! · Cher Max", "shair ma-MAHN · sa-LEW lay FEE-yuh · shair maks", "the three openings used"], ["Pour terminer, dans les cartes : Bisous · Bises · Je t'embrasse", "bee-ZOO · BEEZ · zhuh tahm-BRAHSS", "the three closings used"], ["b) Complétez votre liste avec les formules suivantes.", "kohm-play-TAY VOT-ruh LEEST", "Add these to your list."], ["Chers amis — pour commencer", "shair za-MEE", "Dear friends — an opening"], ["Amicalement — pour terminer", "a-mee-kal-MAHN", "Best wishes — a closing"], ["Coucou — pour commencer", "koo-KOO", "Hi there — an opening"], ["Ma chère Sonia — pour commencer", "ma shair so-NYA", "My dear Sonia — an opening"], ["Amitiés — pour terminer", "a-mee-tee-AY", "Kind regards — a closing"], ["Mon cher Paul — pour commencer", "mohn shair pol", "My dear Paul — an opening"]], "note": "Note the agreement on <em>cher</em>: <strong>cher</strong> Max, <strong>chère</strong> maman, <strong>chers</strong> amis, <strong>ma chère</strong> Sonia."}, {"name": "Page 53 — Aide-mémoire : impressions, activités, météo", "items": [["Donner ses impressions sur un lieu", "do-NAY say zan-pray-see-OHN sewr uhn lee-UH", "Giving your impressions of a place"], ["C'est (un endroit) extraordinaire / magnifique / génial !", "set uh nahn-DRWAH eks-tra-or-dee-NAIR / ma-nyee-FEEK / zhay-nee-AL", "It's an extraordinary / magnificent / brilliant place!"], ["C'est un pays de contrastes !", "set uhn pay-EE duh kohn-TRAST", "It's a country of contrasts!"], ["J'adore cette ville !", "zha-DOR set VEEL", "I love this city!"], ["Je passe des vacances merveilleuses !", "zhuh pahss day va-KAHNSS mair-vay-YUHZ", "I'm having a wonderful holiday!"], ["Parler de ses activités de vacances", "par-LAY duh say zak-tee-vee-TAY duh va-KAHNSS", "Talking about holiday activities"], ["Je marche.", "zhuh MARSH", "I walk."], ["Je visite des musées / la ville.", "zhuh vee-ZEET day mew-ZAY", "I visit museums / the city."], ["Je me promène dans les parcs / la ville.", "zhuh muh pro-MEN dahn lay PARK", "I stroll in the parks / the city."], ["Je fais du shopping.", "zhuh fay dew sho-PEENG", "I go shopping."], ["Je me baigne.", "zhuh muh BEN-yuh", "I swim / bathe."], ["Dire le temps qu'il fait", "deer luh tahn keel FAY", "Saying what the weather is like"], ["Il fait beau. / Il fait mauvais.", "eel fay BO / eel fay mo-VAY", "The weather is fine. / The weather is bad."], ["Il fait chaud. / Il fait froid.", "eel fay SHOW / eel fay FRWAH", "It's hot. / It's cold."]], "note": "Weather in French is always <strong>il fait</strong> — literally <em>it makes</em>. Never <em>il est chaud</em> for the weather.", "cols": "two"}], "bookpages": [52, 53, 54, 55]}, {"id": "ae-d2-carnet", "label": "Dossier 2 · Carnet de voyage", "name": "Paris, hier et aujourd'hui", "summary": "Pages 56–57. A photo board of modern Parisian landmarks, and the city as the most visited in the world.", "art": null, "groups": [{"name": "Les consignes", "items": [["Regardez ce panneau de photos et répondez.", "ruh-gar-DAY suh pa-NO duh fo-TO ay ray-pohn-DAY", "Look at this photo board and answer."], ["Reconnaissez-vous ces lieux parisiens ?", "ruh-ko-nay-say VOO say lee-UH pa-ree-zee-AN", "Do you recognise these Parisian places?"], ["Paris est la première ville touristique dans le monde.", "pa-REE ay lah pruh-mee-AIR veel too-rees-TEEK dahn luh MOHND", "Paris is the most visited city in the world."], ["En petits groupes, dites quels lieux de Paris vous connaissez.", "ahn puh-TEE GROOP, deet kel lee-UH duh pa-REE voo ko-nay-SAY", "In small groups, say which places in Paris you know."], ["Ces lieux sont-ils sur le plan p. 57 ?", "say lee-UH sohn TEEL sewr luh PLAHN", "Are these places on the map on p.57?"]]}, {"name": "Le vocabulaire du carnet", "cols": "two", "items": [["un panneau", "uhn pa-NO", "a board, panel"], ["un lieu parisien", "uhn lee-UH pa-ree-zee-AN", "a Parisian place"], ["reconnaître", "ruh-ko-NET-ruh", "to recognise"], ["touristique", "too-rees-TEEK", "touristic, visited"], ["hier et aujourd'hui", "ee-AIR ay oh-zhoor-DWEE", "yesterday and today"], ["l'architecture moderne", "lar-shee-tek-TEWR mo-DAIRN", "modern architecture"]]}], "bookpages": [56, 57]}, {"id": "ae-d2-sexercer", "label": "Dossier 2 · S'exercer", "name": "Les corrigés", "summary": "Pages 58–59. All sixteen practice exercises for Dossier 2 — articles, explanations, prepositions of place, contracted articles, questions, directions, demonstratives and country prepositions.", "art": null, "groups": [{"name": "Ex. 1 — article défini ou indéfini", "note": "Definite when the thing is identified, indefinite when it's introduced for the first time.", "items": [["1. Les villes de Melun et d'Evry se trouvent dans la banlieue de Paris.", "… dahn lah bahn-lee-UH duh pa-REE", "identified suburb → la"], ["2. Pissarro est un peintre.", "… uhn PAN-truh", "introducing a job → un"], ["3. Le jardin des Cinq Sens est dans le centre-ville.", "… luh zhar-DAN … luh sahn-truh-VEEL", "both identified → le"], ["4. À Pontoise, il y a des musées.", "… day mew-ZAY", "non-specific plural → des"], ["5. Le théâtre de Pontoise s'appelle L'Apostrophe.", "… luh tay-AH-truh", "identified → le"], ["6. Il y a une rivière qui passe à Pontoise : l'Oise.", "… ewn ree-vee-AIR … LWAHZ", "first mention → une, then named → l'"], ["7. Pontoise est à 30 km de la capitale de la France.", "… duh lah ka-pee-TAL duh lah FRAHNSS", "identified → la"]]}, {"name": "Ex. 3 — pourquoi ? parce que…", "note": "Answers: <strong>1→d, 2→f, 3→a, 4→b, 5→c, 6→e</strong>.", "items": [["Pourquoi habitez-vous à Pontoise ? — Parce que je suis étudiant à l'université de Cergy-Pontoise.", "poor-KWAH a-bee-tay VOO … pars kuh zhuh swee zay-tew-dee-AHN", "Why do you live in Pontoise? — Because I'm a student at the university."], ["Pourquoi êtes-vous au théâtre de L'Apostrophe, ce soir ? — Parce que j'adore les spectacles de danse.", "… pars kuh zha-DOR lay spek-TAH-kluh duh DAHNSS", "Why are you at the theatre tonight? — Because I love dance shows."], ["Pourquoi photographiez-vous la cathédrale ? — Parce qu'elle a une belle architecture.", "… pars kel a ewn bell ar-shee-tek-TEWR", "Why are you photographing the cathedral? — Because it has beautiful architecture."], ["Pourquoi aimez-vous Pissarro ? — Parce que c'est un peintre impressionniste.", "… pars kuh set uhn PAN-truh an-pray-see-o-NEEST", "Why do you like Pissarro? — Because he's an impressionist painter."], ["Pourquoi y a-t-il un pont sur le blason de la ville ? — Parce que la ville se trouve sur la rivière Oise.", "… pars kuh lah VEEL suh troov sewr lah ree-vee-AIR", "Why is there a bridge on the coat of arms? — Because the town is on the Oise."], ["Pourquoi visitez-vous les remparts ? — Parce que j'aime les lieux historiques.", "… pars kuh zhem lay lee-UH ees-to-REEK", "Why are you visiting the ramparts? — Because I like historic places."]]}, {"name": "Ex. 4 — les prépositions de lieu", "note": "Alice's weekend photos: <strong>1.</strong> Promenade <em>derrière</em> les remparts · <strong>2.</strong> Pique-nique <em>sous</em> un arbre · <strong>3.</strong> Nous trois, <em>devant</em> la cathédrale Saint-Maclou · <strong>4.</strong> Betty au marché, <em>à côté d'</em>un commerçant (Léa est <em>sur</em> le monsieur !).", "items": [["Promenade derrière les remparts.", "prom-NAHD dair-ee-AIR lay rahm-PAR", "A walk behind the ramparts."], ["Pique-nique sous un arbre.", "peek-NEEK soo zuh NAR-bruh", "Picnic under a tree."], ["Nous trois, devant la cathédrale Saint-Maclou.", "noo TWAH, duh-VAHN lah ka-tay-DRAL", "The three of us in front of the cathedral."], ["Betty au marché, à côté d'un commerçant.", "be-TEE oh mar-SHAY, a ko-TAY duhn ko-mair-SAHN", "Betty at the market, next to a trader."]]}, {"name": "Ex. 5 — chassez l'intrus", "note": "<strong>1.</strong> le restaurant (the others are culture) · <strong>2.</strong> la rivière (the others are places you enter) · <strong>3.</strong> le marché (the others are education) · <strong>4.</strong> l'hôpital (the others are food shops) · <strong>5.</strong> la pharmacie (the others are public services).", "items": [["le cinéma – le théâtre – le restaurant – le musée", "… luh res-to-RAHN …", "the odd one out is le restaurant"], ["le jardin – l'église – la rivière", "… lah ree-vee-AIR", "the odd one out is la rivière"], ["le marché – l'école – l'université", "luh mar-SHAY …", "the odd one out is le marché"], ["l'épicerie – la boulangerie – l'hôpital", "… lo-pee-TAL", "the odd one out is l'hôpital"], ["la pharmacie – la mairie – la poste", "lah far-ma-SEE …", "the odd one out is la pharmacie"]]}, {"name": "Ex. 6 — l'article contracté", "note": "de + le = <strong>du</strong> · de + les = <strong>des</strong> · <em>de la</em> and <em>de l'</em> stay as they are.", "items": [["1. La poste est en face de l'église.", "lah POST et ahn fahss duh lay-GLEEZ", "The post office is opposite the church."], ["2. Le restaurant est à droite du supermarché.", "… a DRWAHT dew sew-pair-mar-SHAY", "The restaurant is to the right of the supermarket."], ["3. Le jardin est à côté des remparts.", "… a ko-TAY day rahm-PAR", "The garden is next to the ramparts."], ["4. La banque est à gauche du cinéma.", "… a GOSH dew see-nay-MAH", "The bank is to the left of the cinema."], ["5. L'université est loin du centre-ville.", "… lwan dew sahn-truh-VEEL", "The university is far from the town centre."], ["6. Le marché est près du théâtre.", "… pray dew tay-AH-truh", "The market is near the theatre."]]}, {"name": "Ex. 7 — le dialogue à l'hôtel dans l'ordre", "note": "Correct order: <strong>c, h, a, d, g, j, e, b, k, f, i</strong>.", "items": [["Hôtel du lac, bonjour !", "o-TELL dew LAK, bohn-ZHOOR", "Hôtel du Lac, good morning!"], ["Bonjour, madame, je voudrais une chambre pour ce soir. C'est possible ?", "… zhuh voo-DREH ewn SHAHM-bruh poor suh SWAHR", "Hello, I'd like a room for tonight. Is that possible?"], ["Oui. Pour combien de personnes ?", "wee. poor kohm-bee-AN duh pair-SUN", "Yes. For how many people?"], ["Une personne. Vous avez une chambre avec salle de bains ?", "ewn pair-SUN. voo za-VAY ewn SHAHM-bruh a-vek sal duh BAN", "One person. Do you have a room with a bathroom?"], ["Ah non, désolée, monsieur, nous avons seulement une chambre avec douche à vous proposer.", "a NOHN, day-zo-LAY … sul-MAHN ewn SHAHM-bruh a-vek DOOSH", "Oh no, sorry, we only have a room with a shower."], ["Vous acceptez les chiens ?", "voo zak-sep-TAY lay shee-AN", "Do you accept dogs?"], ["Oui, mais les petits chiens seulement.", "wee, may lay puh-TEE shee-AN sul-MAHN", "Yes, but only small dogs."], ["Quel est le prix de la chambre ?", "kel ay luh PREE duh lah SHAHM-bruh", "What's the price of the room?"], ["26 euros, petit déjeuner inclus.", "van-sees uh-RO, puh-tee day-zhuh-NAY an-KLEW", "€26, breakfast included."], ["Bien, je prends la chambre. C'est loin de la gare ?", "bee-AN, zhuh prahn lah SHAHM-bruh. say lwan duh lah GAR", "Fine, I'll take it. Is it far from the station?"], ["Non, c'est tout près. Nous sommes à cinq minutes de la gare.", "nohn, say too PRAY. noo som a sank mee-NEWT", "No, it's very close. We're five minutes from the station."]]}, {"name": "Ex. 8 — trouvez la question", "note": "Each answer implies its question.", "items": [["Non, je ne travaille pas à l'auberge de jeunesse. → Est-ce que vous travaillez à l'auberge de jeunesse ?", "es-kuh voo tra-va-YAY a lo-BAIRZH duh zhuh-NESS", "Do you work at the youth hostel?"], ["Oui, il y a une salle de bains à l'étage. → Est-ce qu'il y a une salle de bains à l'étage ?", "es-keel ee a ewn sal duh BAN a lay-TAHZH", "Is there a bathroom on the landing?"], ["Oui, mon ami a une carte d'adhérent. → Est-ce que ton ami a une carte d'adhérent ?", "es-kuh toh na-MEE a ewn kart da-day-RAHN", "Does your friend have a membership card?"], ["Non, je ne téléphone pas pour une réservation. → Est-ce que vous téléphonez pour une réservation ?", "es-kuh voo tay-lay-fo-NAY poor ewn ray-zair-va-see-OHN", "Are you calling about a booking?"], ["Non, nous ne réservons pas la chambre. → Est-ce que vous réservez la chambre ?", "es-kuh voo ray-zair-VAY lah SHAHM-bruh", "Are you booking the room?"], ["Oui, j'ai une chambre libre pour samedi. → Est-ce que vous avez une chambre libre pour samedi ?", "es-kuh voo za-VAY ewn SHAHM-bruh LEE-bruh poor sam-DEE", "Do you have a room free for Saturday?"]]}, {"name": "Ex. 9 — les questions du couple à Annecy", "items": [["Est-ce que c'est un hôtel 5 étoiles ?", "es-kuh set uh no-TELL sank ay-TWAHL", "Is it a 5-star hotel?"], ["Est-ce qu'il est loin de la gare ?", "es-keel ay lwan duh lah GAR", "Is it far from the station?"], ["Quel est le prix de la chambre ?", "kel ay luh PREE duh lah SHAHM-bruh", "What's the price of the room?"], ["Est-ce que vous avez des chambres avec vue ?", "es-kuh voo za-VAY day SHAHM-bruh a-vek VEW", "Do you have rooms with a view?"], ["Quel est le nom de l'hôtel ?", "kel ay luh NOHN duh lo-TELL", "What's the name of the hotel?"], ["Quel jour est-ce que vous arrivez ?", "kel ZHOOR es-kuh voo za-ree-VAY", "What day do you arrive?"]]}, {"name": "Ex. 10 — associez les éléments", "cols": "two", "note": "Several answers work. Natural pairings below.", "items": [["Vous tournez à gauche.", "voo toor-NAY a GOSH", "You turn left."], ["Vous allez tout droit.", "voo za-LAY too DRWAH", "You go straight ahead."], ["Vous traversez la place.", "voo tra-vair-SAY lah PLAHSS", "You cross the square."], ["Vous prenez la 1re à droite.", "voo pruh-NAY lah pruh-mee-AIR a DRWAHT", "You take the first on the right."], ["Vous descendez le boulevard Martin.",
