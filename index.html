n-gluh-TAIR", "Mexico v England"], ["Finale : L'Espagne contre les Pays-Bas.", "les-PAN-yuh KOHN-truh lay pay-ee-BAH", "Spain v the Netherlands"], ["Finale : Le Maroc contre la Belgique.", "luh ma-ROK KOHN-truh lah bel-ZHEEK", "Morocco v Belgium"], ["Finale : La Corée contre le Venezuela.", "lah ko-RAY KOHN-truh luh vay-nay-zew-ay-LAH", "Korea v Venezuela"], ["Finale : L'Irlande contre les États-Unis.", "leer-LAHND KOHN-truh lay zay-ta-zew-NEE", "Ireland v the USA"], ["Finale : L'Argentine contre le Mozambique.", "lar-zhahn-TEEN KOHN-truh luh mo-zahm-BEEK", "Argentina v Mozambique"]]}, {"name": "Ex. 7 — quels pays sont représentés ?", "note": "Go from the nationality back to the country, with its article.", "items": [["André : canadien → le Canada", "luh ka-na-DAH", "the example"], ["Farida : marocaine → le Maroc", "luh ma-ROK", "Morocco"], ["Gene : philippin → les Philippines", "lay fee-lee-PEEN", "the Philippines"], ["Keiko : japonaise → le Japon", "luh zha-POHN", "Japan"], ["Keyvan : iranien → l'Iran", "lee-RAHN", "Iran"], ["Melina : grecque → la Grèce", "lah GRESS", "Greece"], ["Soren : danois → le Danemark", "luh dan-MARK", "Denmark"], ["Maria : italienne → l'Italie", "lee-ta-LEE", "Italy"]]}, {"name": "Ex. 8 — je, tu, il, nous, vous, ils", "items": [["— Bonjour, je m'appelle Marco Ferrero, je suis italien. Et vous ? Vous êtes ?", "bohn-ZHOOR, zhuh ma-PELL … zhuh swee zee-tal-YAN. ay VOO ? voo ZET", "Hello, my name is Marco Ferrero, I'm Italian. And you?"], ["— Moi, je m'appelle Sonia Pages, je suis espagnole. Et voici mes collègues, monsieur et madame Da Silva. Ils sont brésiliens.", "mwah, zhuh ma-PELL … zhuh swee zes-pan-YOL … eel sohn bray-zeel-YAN", "My name is Sonia Pages, I'm Spanish. And here are my colleagues — they're Brazilian."], ["— Ah, vous êtes brésiliens ! Alors vous parlez portugais !", "a, voo ZET bray-zeel-YAN ! a-LOR voo par-LAY por-tew-GAY", "Ah, you're Brazilian! So you speak Portuguese!"], ["— Tu t'appelles Helena, c'est ça ?", "tew ta-PELL ay-lay-NAH, say SAH", "Your name is Helena, is that right?"], ["— Non, je m'appelle Tania. Et voici Helena. Nous sommes russes.", "nohn, zhuh ma-PELL ta-NYA … noo som REWSS", "No, my name is Tania. This is Helena. We're Russian."], ["Et Boris aussi, il est russe comme nous.", "ay bo-REESS oh-SEE, eel ay REWSS kom NOO", "And Boris too, he's Russian like us."]]}, {"name": "Ex. 9 — être ou s'appeler", "items": [["— Bonjour, je m'appelle Elena Gravas, je suis grecque. Et vous ?", "zhuh ma-PELL … zhuh swee GREK", "Hello, my name is Elena Gravas, I'm Greek. And you?"], ["— Moi, je suis japonaise. Je m'appelle Yoko Mitsuko.", "zhuh swee zha-po-NEZ. zhuh ma-PELL", "I'm Japanese. My name is Yoko Mitsuko."], ["— Nous, nous sommes belges. Nous nous appelons Paul et Martin.", "noo, noo som BELZH. noo noo za-play-OHN", "We're Belgian. We're called Paul and Martin."], ["— Et Marc et Laurence sont belges aussi ? — Non, ils sont suisses.", "… sohn BELZH oh-SEE ? — nohn, eel sohn SWEESS", "And are Marc and Laurence Belgian too? — No, they're Swiss."], ["— Qui est-ce ? — C'est le pilote de l'Airbus A380. Il s'appelle Thierry Morand, il est français.", "kee ESS ? — say luh pee-LOT … eel sa-PELL … eel ay frahn-SAY", "Who's that? — The Airbus A380 pilot. His name is Thierry Morand, he's French."], ["— Je suis américaine, et toi, tu es française ? — Oui, je suis française.", "zhuh swee za-may-ree-KEN, ay TWAH, tew ay frahn-SEZ ?", "I'm American, and you, are you French? — Yes, I am."]]}, {"name": "Ex. 10 — cochez la phrase correcte", "note": "Answers: <strong>1-b</strong> (spelling out a name is the letters themselves) · <strong>2-c</strong> (<em>je suis anglais</em> states nationality; <em>je parle anglais</em> is a language) · <strong>3-b</strong>.", "items": [["Pour épeler le prénom : E-L-I-S-A-B-E-T-H.", "uh, ell, ee, ess, ah, bay, uh, tay, ash", "To spell the first name — ✓ b"], ["Pour dire la nationalité : Je suis anglais.", "zhuh swee zahn-GLAY", "To say your nationality — ✓ c"], ["Pour demander le nom : Vous vous appelez comment ?", "voo voo za-play ko-MAHN", "To ask someone's name — ✓ b"]]}, {"name": "Ex. 11 — qui parle dans la classe ?", "note": "<strong>Le professeur :</strong> 1, 4, 6, 7 — all commands. <strong>Les étudiants :</strong> 2, 3, 8, 9, 10 — questions and admissions. <strong>Les deux :</strong> 5, since either can ask how a word is pronounced.", "items": [["Écoutez le dialogue.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue. — le professeur"], ["Comment on dit travel en français ?", "ko-mahn ohn DEE … ahn frahn-SAY", "How do you say travel in French? — les étudiants"], ["Comment ça s'écrit ?", "ko-mahn sa say-KREE", "How is it spelled? — les étudiants"], ["Travaillez par deux.", "tra-va-YAY par DUH", "Work in pairs. — le professeur"], ["Comment ça se prononce ?", "ko-mahn sa suh pro-NONSS", "How is it pronounced? — les deux"], ["Soulignez les questions.", "soo-leen-YAY lay kes-tee-OHN", "Underline the questions. — le professeur"], ["Répétez la phrase.", "ray-pay-TAY lah FRAZ", "Repeat the sentence. — le professeur"], ["Je ne comprends pas.", "zhuh nuh kohm-PRAHN pah", "I don't understand. — les étudiants"], ["C'est à quelle page ?", "set a kel PAHZH", "What page is it? — les étudiants"], ["Je ne sais pas.", "zhuh nuh say PAH", "I don't know. — les étudiants"]]}, {"name": "Le vocabulaire du dossier", "cols": "two", "items": [["une langue", "ewn LAHNG", "a language"], ["un diplomate", "uhn dee-plo-MAT", "a diplomat"], ["un passager", "uhn pa-sa-ZHAY", "a passenger"], ["un vol", "uhn VOL", "a flight"], ["l'embarquement", "lahm-bar-kuh-MAHN", "boarding"], ["une porte", "ewn PORT", "a gate, a door"], ["le total", "luh to-TAL", "the total"], ["en chiffres", "ahn SHEE-fruh", "in figures"], ["en lettres", "ahn LET-ruh", "in words"], ["une finale", "ewn fee-NAL", "a final (match)"], ["contre", "KOHN-truh", "against"], ["un cours de français", "uhn koor duh frahn-SAY", "a French course"], ["débutant / débutante", "day-bew-TAHN / day-bew-TAHNT", "beginner"], ["un collègue", "uhn ko-LEG", "a colleague"], ["un pilote", "uhn pee-LOT", "a pilot"], ["une fiche", "ewn FEESH", "a form, a card"], ["épeler", "ay-play-AY", "to spell out"], ["cocher", "ko-SHAY", "to tick"], ["compléter", "kohm-play-TAY", "to fill in"], ["c'est ça ?", "say SAH", "is that right?"], ["alors", "a-LOR", "so, then"], ["aussi", "oh-SEE", "too, also"], ["comme nous", "kom NOO", "like us"]]}]}, {"id": "ca-2", "label": "Dossier 1 · Leçon 2", "name": "M comme médiathèque", "summary": "Pages 12–15. Pages are here; the transcription is still to come.", "art": null, "groups": [{"name": "Pages 12–15", "items": [], "pages": ["c012", "c013", "c014", "c015"], "note": "Pages are here. The word-by-word transcription is still to come — Dossier 0 above shows the finished format."}]}, {"id": "ca-3", "label": "Dossier 1 · Leçon 3", "name": "En direct de TV5", "summary": "Pages 16–19. Pages are here; the transcription is still to come.", "art": null, "groups": [{"name": "Pages 16–19", "items": [], "pages": ["c016", "c017", "c018", "c019"], "note": "Pages are here. The word-by-word transcription is still to come — Dossier 0 above shows the finished format."}]}, {"id": "ca-4", "label": "Dossier 2 · Leçon 1", "name": "C'est ma ville", "summary": "Pages 20–23. Pages are here; the transcription is still to come.", "art": null, "groups": [{"name": "Pages 20–23", "items": [], "pages": ["c020", "c021", "c022", "c023"], "note": "Pages are here. The word-by-word transcription is still to come — Dossier 0 above shows the finished format."}]}, {"id": "ca-5", "label": "Dossier 2 · Leçon 2", "name": "Passer une nuit…", "summary": "Pages 24–27. Pages are here; the transcription is still to come.", "art": null, "groups": [{"name": "Pages 24–27", "items": [], "pages": ["c024", "c025", "c026", "c027"], "note": "Pages are here. The word-by-word transcription is still to come — Dossier 0 above shows the finished format."}]}, {"id": "ca-6", "label": "Dossier 2 · Leçon 3", "name": "Bons baisers de…", "summary": "Pages 28–31. Pages are here; the transcription is still to come.", "art": null, "groups": [{"name": "Pages 28–31", "items": [], "pages": ["c028", "c029", "c030", "c031"], "note": "Pages are here. The word-by-word transcription is still to come — Dossier 0 above shows the finished format."}]}]}, {"id": "grammaire", "name": "Grammaire Progressive", "short": "Grammaire", "color": "#3F8F63", "blurb": "Grammaire Progressive du Français A0–A1, chapters 1 to 14 — the explanation page, the exercises, and the book pages themselves.", "lessons": [{"id": "gr-1", "label": "Chapitre 1", "name": "Vous êtes japonais ?", "summary": "La présentation. Je suis + name, nationality, job — and why French drops the article before a profession.", "art": null, "groups": [{"name": "La présentation", "note": "Two rules this chapter rests on. <strong>Always use je suis or je m'appelle</strong> — never a bare name. And <strong>no article before a profession</strong>: <em>je suis médecin</em>, never <em>je suis un médecin</em>. That one catches every English speaker.", "items": [["Bonjour, je suis Kenji Takashi.", "bohn-ZHOOR, zhuh swee", "Hello, I'm Kenji Takashi."], ["Je m'appelle Kenji Takashi.", "zhuh ma-PELL", "My name is Kenji Takashi."], ["Vous êtes japonais ? — Oui, je suis japonais.", "voo-ZET zha-po-NAY", "Are you Japanese? — Yes, I am."], ["Vous êtes médecin ? — Non, je suis chimiste.", "voo-ZET mayd-SAN — nohn, zhuh swee shee-MEEST", "Are you a doctor? — No, I'm a chemist."], ["Je suis français. Je suis professeur.", "zhuh swee frahn-SAY. zhuh swee pro-fess-UR", "I'm French. I'm a teacher."], ["Jean, vous êtes professeur ou étudiant ?", "zhahn, voo-ZET pro-fess-UR oo zay-tew-dee-AHN", "Jean, are you a teacher or a student?"], ["Kenji, vous êtes médecin ou chimiste ?", "voo-ZET mayd-SAN oo shee-MEEST", "Kenji, are you a doctor or a chemist?"], ["Bip, vous êtes astronaute ou professeur ?", "voo-ZET zas-tro-NOTE oo pro-fess-UR", "Bip, are you an astronaut or a teacher?"]]}], "bookpages": ["g008", "g009"]}, {"id": "gr-2", "label": "Chapitre 2", "name": "Il est grand. Elle est grande.", "summary": "Masculine to feminine. Add -e and the silent consonant wakes up — that's how you hear gender.", "art": "agreement", "groups": [{"name": "Masculin → féminin", "cols": "two", "note": "<strong>Féminin = masculin + -e.</strong> The point of that -e: a silent final consonant becomes audible, so you can <em>hear</em> the gender. Words already ending in -e (jeune, russe, calme) don't change.", "items": [["français → française", "frahn-SAY → frahn-SEZ", "French"], ["portugais → portugaise", "por-tew-GAY → por-tew-GEZ", "Portuguese"], ["suédois → suédoise", "sway-DWAH → sway-DWAZ", "Swedish"], ["chinois → chinoise", "shee-NWAH → shee-NWAZ", "Chinese"], ["mexicain → mexicaine", "mek-see-KAN → mek-see-KEN", "Mexican"], ["américain → américaine", "a-may-ree-KAN → a-may-ree-KEN", "American"], ["autrichien → autrichienne", "oh-tree-shee-AN → oh-tree-shee-EN", "Austrian"], ["canadien → canadienne", "ka-na-dee-AN → ka-na-dee-EN", "Canadian"], ["coréen → coréenne", "ko-ray-AN → ko-ray-EN", "Korean"], ["allemand → allemande", "al-MAHN → al-MAHND", "German"], ["espagnol → espagnole", "es-pan-YOL → es-pan-YOL", "Spanish"], ["russe → russe", "rewss → rewss", "Russian — identical"], ["grec → grecque", "grek → grek", "Greek — irregular"], ["turc → turque", "tewrk → tewrk", "Turkish — irregular"], ["étudiant → étudiante", "ay-tew-dee-AHN → ay-tew-dee-AHNT", "student"], ["grand → grande", "GRAHN → GRAHND", "tall"], ["blond → blonde", "BLOHN → BLOHND", "blond"], ["marié → mariée", "ma-ree-AY → ma-ree-AY", "married"], ["petit → petite", "puh-TEE → puh-TEET", "small"], ["vert → verte", "VAIR → VAIRT", "green"], ["amusant → amusante", "a-mew-ZAHN → a-mew-ZAHNT", "funny"], ["intelligent → intelligente", "an-tel-ee-ZHAHN → an-tel-ee-ZHAHNT", "intelligent"], ["souriant → souriante", "soo-ree-AHN → soo-ree-AHNT", "smiling"], ["jeune → jeune", "ZHUHN → ZHUHN", "young — no change"]]}, {"name": "Les autres terminaisons", "cols": "two", "note": "<strong>-on → -onne</strong> · <strong>-er → -ère</strong> · <strong>-eur / -eux → -euse</strong> · <strong>-teur → -trice</strong> for most professions.<br><br>One exception: <strong>chanteur → chanteuse</strong>, not chantrice. And some jobs never change: <strong>professeur, médecin, écrivain, auteur</strong> stay identical — though professeure, écrivaine and auteure are increasingly used.", "items": [["bon → bonne", "bohn → bun", "good"], ["breton → bretonne", "bruh-TOHN → bruh-TUN", "Breton"], ["mignon → mignonne", "meen-YOHN → meen-YUN", "cute"], ["étranger → étrangère", "ay-trahn-ZHAY → ay-trahn-ZHAIR", "foreign"], ["boulanger → boulangère", "boo-lahn-ZHAY → boo-lahn-ZHAIR", "baker"], ["infirmier → infirmière", "an-feer-mee-AY → an-feer-mee-AIR", "nurse"], ["poissonnier → poissonnière", "pwa-son-YAY → pwa-son-YAIR", "fishmonger"], ["serveur → serveuse", "sair-VUR → sair-VUZ", "waiter"], ["danseur → danseuse", "dahn-SUR → dahn-SUHZ", "dancer"], ["menteur → menteuse", "mahn-TUR → mahn-TUZ", "liar"], ["heureux → heureuse", "uh-RUH → uh-RUZ", "happy"], ["acteur → actrice", "ak-TUR → ak-TREESS", "actor"], ["instituteur → institutrice", "an-stee-tew-TUR → an-stee-tew-TREESS", "primary teacher"], ["présentateur → présentatrice", "pray-zahn-ta-TUR → pray-zahn-ta-TREESS", "presenter"], ["chanteur → chanteuse", "shahn-TUR → shahn-TUHZ", "singer — the exception"], ["professeur → professeur", "pro-fess-UR", "teacher — unchanged"], ["médecin → médecin", "mayd-SAN", "doctor — unchanged"], ["beau → belle", "BO → BELL", "beautiful"], ["gros → grosse", "GRO → GROSS", "big / fat"], ["vieux → vieille", "vee-UH → vee-AY-yuh", "old"], ["gentil → gentille", "zhahn-TEE → zhahn-TEE-yuh", "kind"], ["blanc → blanche", "BLAHN → BLAHNSH", "white"]]}], "bookpages": ["g010", "g011", "g012", "g013"]}, {"id": "gr-3", "label": "Chapitre 3", "name": "Ils sont grands.", "summary": "Singular to plural — add -s, unless the word already ends in -s or -x.", "art": null, "groups": [{"name": "Singulier → pluriel", "cols": "two", "note": "<strong>Pluriel = singulier + -s.</strong> But a masculine word already ending in <strong>-s</strong> or <strong>-x</strong> doesn't change at all. One irregular: <em>beau → beaux</em>.<br><br>And when a group is mixed, the masculine plural always wins — one man among ten women still makes it <strong>ils</strong>.", "items": [["il est blond → ils sont blonds", "eel ay BLOHN → eel sohn BLOHN", "he is / they are blond"], ["elle est blonde → elles sont blondes", "el ay BLOHND → el sohn BLOHND", "she is / they are blonde"], ["il est étudiant → ils sont étudiants", "eel et ay-tew-dee-AHN → eel sohn tay-tew-dee-AHN", "student(s)"], ["il est français → ils sont français", "eel ay frahn-SAY → eel sohn frahn-SAY", "French — no change"], ["il est vieux → ils sont vieux", "eel ay vee-UH → eel sohn vee-UH", "old — no change"], ["il est beau → ils sont beaux", "eel ay BO → eel sohn BO", "handsome — irregular"], ["Ils sont américains.", "eel sohn ta-may-ree-KAN", "They're American."], ["Elles sont brésiliennes.", "el sohn bray-zeel-YEN", "They're Brazilian. (fem.)"], ["Elles sont danseuses.", "el sohn dahn-SUHZ", "They're dancers. (fem.)"], ["Ils sont gentils.", "eel sohn zhahn-TEE", "They're kind."], ["Elles sont gentilles.", "el sohn zhahn-TEE-yuh", "They're kind. (fem.)"], ["Elles sont célibataires.", "el sohn say-lee-ba-TAIR", "They're single. (fem.)"]]}], "bookpages": ["g014", "g015"]}, {"id": "gr-4", "label": "Chapitre 4", "name": "Je suis, tu es, il est…", "summary": "Être in full, the tu/vous decision, and the two very different jobs of on.", "art": null, "groups": [{"name": "Être, tu/vous, on", "note": "<strong>vous</strong> does two jobs: polite singular, and plural of any register. <strong>tu</strong> is familiar singular only.<br><br><strong>on</strong> also does two: casual 'we' (<em>Jean et moi, on est fatigués</em>) and general 'people' (<em>Quand on est enrhumé, on est fatigué</em>). It always conjugates like <em>il</em>.", "items": [["Vous êtes prêt, monsieur Meyer ?", "voo-ZET PREH, muh-syuh may-AIR", "Are you ready, Mr Meyer? (polite)"], ["Tu es prêt, papa ?", "tew ay PREH, pa-PAH", "Are you ready, dad? (familiar)"], ["Vous êtes prêts ? (messieurs)", "voo-ZET PREH", "Are you ready? (several men)"], ["Vous êtes prêtes ? (mesdames)", "voo-ZET PRET", "Are you ready? (several women)"], ["Jean et moi, on est enrhumés.", "zhahn ay mwah, oh-nay tahn-rew-MAY", "Jean and I have colds. (on = nous)"], ["Quand on est enrhumé, on est fatigué.", "kahn oh-nay tahn-rew-MAY, oh-nay fa-tee-GAY", "When you have a cold, you're tired. (on = people)"], ["Nous sommes contents d'être à Paris.", "noo sum kohn-TAHN detr a pa-REE", "We're happy to be in Paris."], ["Nous sommes désolés d'être en retard.", "noo sum day-zo-LAY detr ahn ruh-TAR", "We're sorry to be late."], ["Quand on est en vacances, on est content.", "kahn oh-nay ahn va-KAHNSS, oh-nay kohn-TAHN", "When you're on holiday, you're happy."], ["Quand on est en retard, on est pressé.", "kahn oh-nay ahn ruh-TAR, oh-nay press-AY", "When you're late, you're in a hurry."]]}], "bookpages": ["g016", "g017"]}, {"id": "gr-5", "label": "Chapitre 5", "name": "Est-ce que… ? Non, je ne suis pas…", "summary": "Three ways to ask a yes/no question, and where pas goes.", "art": "nepas", "groups": [{"name": "Poser une question", "note": "Three ways to ask the same yes/no question: rising intonation alone, or <strong>est-ce que</strong> on the front. Both are normal in speech — est-ce que is the safer default while you're building confidence, because it signals 'question' from word one.", "items": [["Vous êtes japonais.", "voo-ZET zha-po-NAY", "You're Japanese. (statement, falling tone)"], ["Vous êtes japonais ?", "voo-ZET zha-po-NAY", "Are you Japanese? (rising tone)"], ["Est-ce que vous êtes japonais ?", "es-kuh voo-ZET zha-po-NAY", "Are you Japanese? (with est-ce que)"], ["Est-ce que Jean est français ?", "es-kuh zhahn ay frahn-SAY", "Is Jean French?"], ["Est-ce que vous êtes étudiant ?", "es-kuh voo-ZET zay-tew-dee-AHN", "Are you a student?"], ["Est-ce que tu es marié ?", "es-kuh tew ay ma-ree-AY", "Are you married?"], ["Est-ce que Marco est blond ?", "es-kuh mar-KO ay BLOHN", "Is Marco blond?"]]}, {"name": "La négation ne… pas", "cols": "two", "items": [["Je ne suis pas content.", "zhuh nuh swee pah kohn-TAHN", "I'm not happy."], ["Elle n'est pas riche.", "el nay pah REESH", "She's not rich."], ["Ils ne sont pas italiens.", "eel nuh sohn pah zee-tal-YAN", "They're not Italian."], ["Je ne suis pas brun.", "zhuh nuh swee pah BRUHN", "I'm not dark-haired."], ["Je ne suis pas français.", "zhuh nuh swee pah frahn-SAY", "I'm not French."], ["Je ne suis pas professeur.", "zhuh nuh swee pah pro-fess-UR", "I'm not a teacher."], ["Le lit n'est pas confortable.", "luh LEE nay pah kohn-for-TAHB-luh", "The bed isn't comfortable."], ["L'eau n'est pas chaude.", "lo nay pah SHOWD", "The water isn't hot."], ["Les chambres ne sont pas chères.", "lay SHAHM-bruh nuh sohn pah SHAIR", "The rooms aren't expensive."], ["Non, il n'est pas blond. Il est brun.", "nohn, eel nay pah BLOHN. eel ay BRUHN", "No, he's not blond. He's dark-haired."]]}], "bookpages": ["g018", "g019"]}, {"id": "gr-6", "label": "Chapitre 6", "name": "Je parle, je regarde, j'aime…", "summary": "Regular -ER verbs — the biggest verb family in French, and the one that never lets you down.", "art": null, "groups": [{"name": "Les verbes en -ER", "cols": "two", "note": "<strong>Drop -er, add -e.</strong> That final -e is silent — <em>je parle</em> is said zhuh PARL. And <strong>je → j'</strong> before a vowel or silent h.<br><br>This is the biggest verb family in French. Almost every new verb you meet will follow it.", "items": [["parler → je parle", "zhuh PARL", "to speak → I speak"], ["regarder → je regarde", "zhuh ruh-GARD", "to watch → I watch"], ["manger → je mange", "zhuh MAHNZH", "to eat → I eat"], ["travailler → je travaille", "zhuh tra-VIGH", "to work → I work"], ["téléphoner → je téléphone", "zhuh tay-lay-FON", "to call → I call"], ["écouter → j'écoute", "zhay-KOOT", "to listen → I listen"], ["aimer → j'aime", "zhem", "to love → I love"], ["habiter → j'habite", "zha-BEET", "to live → I live"], ["étudier → j'étudie", "zhay-tew-DEE", "to study → I study"], ["commencer → je commence", "zhuh ko-MAHNSS", "to start → I start"], ["terminer → je termine", "zhuh tair-MEEN", "to finish → I finish"], ["dîner → je dîne", "zhuh DEEN", "to have dinner → I have dinner"]]}, {"name": "Une journée — le modèle", "items": [["Je travaille dans une banque.", "zhuh tra-vigh dahn zewn BAHNK", "I work in a bank."], ["Le matin, je commence à 9 heures.", "luh ma-TAN, zhuh ko-MAHNSS a nuh-VUR", "In the morning I start at 9."], ["Le soir, je termine à 18 heures.", "luh SWAHR, zhuh tair-MEEN a dee-zwee-TUR", "In the evening I finish at 6."], ["À midi, je mange à la cafétéria avec mes collègues.", "a mee-DEE, zhuh MAHNZH a lah ka-fay-tay-REE-a a-vek may ko-LEG", "At noon I eat in the cafeteria with my colleagues."], ["Le soir, je dîne chez moi.", "luh SWAHR, zhuh DEEN shay MWAH", "In the evening I have dinner at home."], ["Après le repas, je regarde la télévision ou j'écoute la radio.", "a-PRAY luh ruh-PAH, zhuh ruh-GARD lah tay-lay-vee-zee-OHN oo zhay-KOOT lah ra-dee-O", "After the meal I watch TV or listen to the radio."], ["J'aime le sport et la musique.", "zhem luh SPOR ay lah mew-ZEEK", "I like sport and music."], ["J'habite à Paris.", "zha-BEET a pa-REE", "I live in Paris."], ["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["J'étudie l'anglais.", "zhay-tew-DEE lahn-GLAY", "I'm studying English."]]}], "bookpages": ["g020", "g021"]}, {"id": "gr-7", "label": "Chapitre 7", "name": "Je parle, tu parles, il parle…", "summary": "Pages 22–23. The full present tense of -ER verbs, the two endings you can actually hear, on as a general subject, and a revision of questions and negation.", "art": "erverbs", "bookpages": ["g022", "g023"], "groups": [{"name": "Parler — les six personnes", "cols": "two", "items": [["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["Tu parles anglais.", "tew parl ahn-GLAY", "You speak English."], ["Il / Elle / On parle russe.", "eel / el / ohn parl REWSS", "He / She / One speaks Russian."], ["Nous parlons italien.", "noo par-LOHN ee-tal-YAN", "We speak Italian."], ["Vous parlez chinois.", "voo par-LAY shee-NWAH", "You speak Chinese."], ["Ils / Elles parlent allemand.", "eel / el parl al-MAHN", "They speak German."]]}, {"name": "Les finales muettes — ce que vous n'entendez pas", "note": "<strong>Four of the six forms sound identical.</strong> The endings <code>-e</code>, <code>-es</code> and <code>-ent</code> are all silent, so <em>je parle</em>, <em>tu parles</em>, <em>il parle</em> and <em>ils parlent</em> are one single sound: <strong>parl</strong>. Only the spelling tells them apart.", "cols": "two", "items": [["Je parle", "zhuh PARL", "silent -e"], ["Tu parles", "tew PARL", "silent -es"], ["Il / Elle / On parle", "eel PARL", "silent -e"], ["Ils / Elles parlent", "eel PARL", "silent -ent"], ["J'aime", "ZHEM", "silent -e"], ["Tu aimes", "tew EM", "silent -es"], ["Il / Elle / On aime", "eel EM", "silent -e"], ["Ils / Elles aiment", "eel ZEM", "silent -ent, with liaison"]]}, {"name": "Les finales sonores — ce que vous entendez", "note": "Only <strong>-ons</strong> and <strong>-ez</strong> are pronounced. Those two forms are the only ones your ear can pick out.", "cols": "two", "items": [["Vous parlez", "voo par-LAY", "audible -ez"], ["Nous parlons", "noo par-LOHN", "audible -ons"], ["Vous aimez", "voo zay-MAY", "audible -ez, with liaison"], ["Nous aimons", "noo zay-MOHN", "audible -ons, with liaison"]]}, {"name": "« On » — rappel", "note": "Two jobs, and the sentence tells you which. With named people it means <strong>nous</strong>; on its own it means <strong>people in general</strong>.", "items": [["Igor et moi, on parle russe.", "ee-GOR ay MWAH, ohn parl REWSS", "Igor and I speak Russian. — on = nous"], ["En Russie, on parle russe.", "ahn rew-SEE, ohn parl REWSS", "In Russia they speak Russian. — on = en général"]]}, {"name": "L'interrogation et la négation — révision", "cols": "two", "items": [["Vous parlez anglais ?", "voo par-LAY ahn-GLAY", "Do you speak English?"], ["Non, je ne parle pas anglais.", "nohn, zhuh nuh parl pah zahn-GLAY", "No, I don't speak English."], ["Vous habitez en France ?", "voo za-bee-TAY ahn FRAHNSS", "Do you live in France?"], ["Non, je n'habite pas en France.", "nohn, zhuh na-BEET pah zahn FRAHNSS", "No, I don't live in France."], ["Est-ce que Marie travaille ?", "es-kuh ma-REE tra-VIGH", "Does Marie work?"], ["Non, elle ne travaille pas.", "nohn, el nuh tra-VIGH PAH", "No, she doesn't work."], ["Est-ce que Paul et Max étudient ?", "es-kuh pol ay maks ay-TEW-dee", "Do Paul and Max study?"], ["Non, ils n'étudient pas.", "nohn, eel nay-TEW-dee PAH", "No, they don't study."]]}, {"name": "Ex. 1 — moi, ma sœur, mes parents", "note": "The verb endings for <em>je</em> and <em>elle</em> are both silent, so they sound identical — only the spelling changes.", "items": [["J'habite dans le centre. / Elle habite en banlieue.", "zha-BEET dahn luh SAHN-truh / el a-BEET ahn bahn-lee-UH", "I live in the centre. / She lives in the suburbs."], ["Je travaille dans une banque. / Elle travaille dans une librairie.", "zhuh tra-VIGH dahn zewn BAHNK / el tra-VIGH dahn zewn lee-bray-REE", "I work in a bank. / She works in a bookshop."], ["Je commence à 9 heures. / Elle commence à 10 heures.", "zhuh ko-MAHNSS a nuh VUR / el ko-MAHNSS a dee ZUR", "I start at 9. / She starts at 10."], ["Je termine à 17 heures. / Elle termine à 19 heures.", "zhuh tair-MEEN a dee-set UR / el tair-MEEN a deez-nuh VUR", "I finish at 5pm. / She finishes at 7pm."], ["Je dîne à 20 heures. / Elle dîne à 21 heures.", "zhuh DEEN a van TUR / el DEEN a van-tay-uh NUR", "I have dinner at 8pm. / She dines at 9pm."], ["Mes parents habitent en banlieue, ils travaillent dans une école.", "may pa-RAHN a-BEET ahn bahn-lee-UH, eel tra-VIGH dahn zewn ay-KOL", "A model third text, in the ils form."]]}, {"name": "Ex. 2 — répondre avec « on »", "items": [["Qu'est-ce qu'on fait dans une discothèque ? — On danse.", "kes-koh FAY dahn zewn dees-ko-TEK ? — ohn DAHNSS", "What do you do in a nightclub? — You dance."], ["… dans une piscine ? — On nage.", "… dahn zewn pee-SEEN ? — ohn NAHZH", "… in a swimming pool? — You swim."], ["… dans une cabine téléphonique ? — On téléphone.", "… dahn zewn ka-BEEN tay-lay-fo-NEEK ? — ohn tay-lay-FON", "… in a phone box? — You make a call."], ["… dans un restaurant ? — On mange.", "… dahn zuhn res-to-RAHN ? — ohn MAHNZH", "… in a restaurant? — You eat."]]}, {"name": "Ex. 3 — conjuguez les verbes", "cols": "two", "items": [["Je travaille. Vous travaillez. Nous travaillons.", "zhuh tra-VIGH. voo tra-va-YAY. noo tra-va-YOHN", "travailler — to work"], ["Elle danse. Vous dansez. Nous dansons.", "el DAHNSS. voo dahn-SAY. noo dahn-SOHN", "danser — to dance"], ["On fume. Vous fumez. Nous fumons.", "ohn FEWM. voo few-MAY. noo few-MOHN", "fumer — to smoke"], ["Tu téléphones. Vous téléphonez. Nous téléphonons.", "tew tay-lay-FON. voo tay-lay-fo-NAY. noo tay-lay-fo-NOHN", "téléphoner — to phone"], ["Ils dînent. Vous dînez. Nous dînons.", "eel DEEN. voo dee-NAY. noo dee-NOHN", "dîner — to have dinner"]]}, {"name": "Ex. 4 — question et réponse négative", "items": [["Tu fumes ? — Non, je ne fume pas.", "tew FEWM ? — nohn, zhuh nuh fewm PAH", "Do you smoke? — No, I don't."], ["Tu danses ? — Non, je ne danse pas.", "tew DAHNSS ? — nohn, zhuh nuh dahnss PAH", "Do you dance? — No, I don't."], ["Tu parles espagnol ? — Non, je ne parle pas espagnol.", "tew parl es-pan-YOL ? — nohn, zhuh nuh parl pah zes-pan-YOL", "Do you speak Spanish? — No, I don't."], ["Tu aimes le rock ? — Non, je n'aime pas le rock.", "tew em luh ROK ? — nohn, zhuh nem pah luh ROK", "Do you like rock? — No, I don't."]]}, {"name": "Ex. 5 — corriger d'après le texte", "note": "The six statements at the top are the facts; each question contradicts one of them, so you answer in the negative and then give the true version.", "items": [["Les enfants jouent dans leur chambre.", "lay zahn-FAHN ZHOO dahn lur SHAHM-bruh", "The children play in their bedroom."], ["Le grand-père regarde un match à la télé.", "luh grahn-PAIR ruh-GARD uhn MATCH a lah tay-LAY", "Grandad is watching a match on TV."], ["La grand-mère téléphone à sa sœur.", "lah grahn-MAIR tay-lay-FON a sa SUR", "Grandma is phoning her sister."], ["La baby-sitter étudie le français.", "lah ba-bee-see-TAIR ay-TEW-dee luh frahn-SAY", "The babysitter is studying French."], ["Les parents dînent au restaurant.", "lay pa-RAHN DEEN oh res-to-RAHN", "The parents are dining out."], ["Le chat mange sur le balcon.", "luh SHA mahnzh sewr luh bal-KOHN", "The cat is eating on the balcony."], ["Les enfants jouent dans le salon ? — Non, ils ne jouent pas dans le salon. Ils jouent dans leur chambre.", "… nohn, eel nuh zhoo pah dahn luh sa-LOHN", "Do the children play in the living room? — No, in their bedroom."], ["La baby-sitter regarde la télévision ? — Non, elle ne regarde pas la télévision. Elle étudie le français.", "… el nuh ruh-gard pah lah tay-lay-vee-zee-OHN", "Is the babysitter watching TV? — No, she's studying French."], ["Le grand-père écoute la radio ? — Non, il n'écoute pas la radio. Il regarde un match à la télé.", "… eel nay-KOOT pah lah ra-dee-O", "Is grandad listening to the radio? — No, he's watching a match."]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["une banque", "ewn BAHNK", "a bank"], ["une librairie", "ewn lee-bray-REE", "a bookshop"], ["la banlieue", "lah bahn-lee-UH", "the suburbs"], ["le centre", "luh SAHN-truh", "the centre"], ["commencer", "ko-mahn-SAY", "to begin"], ["terminer", "tair-mee-NAY", "to finish"], ["dîner", "dee-NAY", "to dine"], ["nager", "na-ZHAY", "to swim"], ["fumer", "few-MAY", "to smoke"], ["jouer", "zhoo-AY", "to play"], ["une discothèque", "ewn dees-ko-TEK", "a nightclub"], ["une piscine", "ewn pee-SEEN", "a swimming pool"], ["une cabine téléphonique", "ewn ka-BEEN tay-lay-fo-NEEK", "a phone box"], ["le salon", "luh sa-LOHN", "the living room"], ["le balcon", "luh bal-KOHN", "the balcony"], ["un match", "uhn MATCH", "a match"], ["une baby-sitter", "ewn ba-bee-see-TAIR", "a babysitter"], ["le chat", "luh SHA", "the cat"]]}]}, {"id": "gr-8", "label": "Chapitre 8", "name": "J'achète, vous achetez. Je préfère, vous préférez.", "summary": "Pages 24–25. The -ER verbs that shift their spelling: accents that appear and vanish, doubled consonants, and the -ger and -cer verbs that protect their soft sound.", "art": "particularites", "bookpages": ["g024", "g025"], "groups": [{"name": "Le dialogue de la page", "items": [["Vous préférez les noires ou les blanches ?", "voo pray-fay-RAY lay NWAHR oo lay BLAHNSH", "Do you prefer the black ones or the white ones?"], ["Je préfère les blanches.", "zhuh pray-FAIR lay BLAHNSH", "I prefer the white ones."]]}, {"name": "Accent grave — préférer", "note": "<strong>The rule behind it:</strong> the ending is silent in four forms, so the vowel before it has to carry the sound and takes an <strong>accent grave (è)</strong>. In <em>nous</em> and <em>vous</em> the ending is pronounced, so the <strong>é</strong> stays.<br><br>Same pattern: <em>espérer, répéter, compléter</em>.", "cols": "two", "items": [["Je préfère", "zhuh pray-FAIR", "è — ending silent"], ["Tu préfères", "tew pray-FAIR", "è"], ["Il préfère", "eel pray-FAIR", "è"], ["Ils préfèrent", "eel pray-FAIR", "è"], ["Nous préférons", "noo pray-fay-ROHN", "é — ending audible"], ["Vous préférez", "voo pray-fay-RAY", "é — ending audible"], ["espérer", "es-pay-RAY", "to hope"], ["répéter", "ray-pay-TAY", "to repeat"], ["compléter", "kohm-play-TAY", "to complete"]]}, {"name": "Accent grave — acheter", "note": "Here the infinitive has <strong>no accent at all</strong>; the è appears only where the ending falls silent. Same pattern: <em>mener, amener, emmener, enlever, peser</em>.", "cols": "two", "items": [["J'achète", "zha-SHET", "è"], ["Tu achètes", "tew a-SHET", "è"], ["Il achète", "eel a-SHET", "è"], ["Ils achètent", "eel za-SHET", "è"], ["Nous achetons", "noo zash-TOHN", "plain e"], ["Vous achetez", "voo zash-TAY", "plain e"], ["mener", "muh-NAY", "to lead"], ["amener", "am-NAY", "to bring (a person)"], ["emmener", "ahm-NAY", "to take (a person) along"], ["enlever", "ahn-luh-VAY", "to remove"], ["peser", "puh-ZAY", "to weigh"]]}, {"name": "Consonne doublée — jeter, appeler", "note": "Instead of an accent, these double the consonant to keep the vowel open — <strong>tt</strong> and <strong>ll</strong> where the ending is silent, single letter where it is heard.", "cols": "two", "items": [["Je jette", "zhuh ZHET", "tt"], ["Tu jettes", "tew ZHET", "tt"], ["Il jette", "eel ZHET", "tt"], ["Ils jettent", "eel ZHET", "tt"], ["Nous jetons", "noo zhuh-TOHN", "single t"], ["Vous jetez", "voo zhuh-TAY", "single t"], ["J'appelle", "zha-PELL", "ll"], ["Tu appelles", "tew a-PELL", "ll"], ["Il appelle", "eel a-PELL", "ll"], ["Ils appellent", "eel za-PELL", "ll"], ["Nous appelons", "noo za-play-OHN", "single l"], ["Vous appelez", "voo za-play-AY", "single l"]]}, {"name": "Verbes en -ayer et -oyer", "cols": "two", "items": [["Je paie / je paye", "zhuh PAY", "I pay — both spellings allowed"], ["Vous payez", "voo pay-YAY", "you pay"], ["J'envoie", "zhahn-VWAH", "I send"], ["Vous envoyez", "voo zahn-vwa-YAY", "you send"]]}, {"name": "Verbes en -ger et -cer — la finale -ons", "note": "Before the <strong>-ons</strong> ending, <em>g</em> and <em>c</em> would harden. French keeps them soft by adding a silent <strong>e</strong> after g, and a <strong>cédille</strong> under c.", "cols": "two", "items": [["Je mange / Nous mangeons", "zhuh MAHNZH / noo mahn-ZHOHN", "g + e + ons"], ["Je voyage / Nous voyageons", "zhuh vwa-YAHZH / noo vwa-ya-ZHOHN", "g + e + ons"], ["changer / nous changeons", "shahn-ZHAY / noo shahn-ZHOHN", "to change"], ["nager / nous nageons", "na-ZHAY / noo na-ZHOHN", "to swim"], ["partager / nous partageons", "par-ta-ZHAY / noo par-ta-ZHOHN", "to share"], ["Je commence / Nous commençons", "zhuh ko-MAHNSS / noo ko-mahn-SOHN", "ç + ons"], ["J'avance / Nous avançons", "zha-VAHNSS / noo za-vahn-SOHN", "ç + ons"]]}, {"name": "Ex. 1 — préférences", "items": [["Vous préférez les pâtes ou le riz ? — Je préfère le riz.", "voo pray-fay-RAY lay PAHT oo luh REE ? — zhuh pray-FAIR luh REE", "Do you prefer pasta or rice? — I prefer rice."], ["Vous préférez le printemps ou l'automne ? — Je préfère le printemps.", "… luh pran-TAHN oo lo-TUN", "Spring or autumn?"], ["Vous préférez le vin blanc ou le vin rouge ? — Je préfère le vin rouge.", "… luh van BLAHN oo luh van ROOZH", "White wine or red?"]]}, {"name": "Ex. 2 — mettre les accents", "note": "Accent only where the ending is silent. Nos 5, 6, 7, 8 and 9 are <em>nous</em> or <em>vous</em> forms, so they keep the plain vowel.", "cols": "two", "items": [["1. J'achète un livre.", "zha-SHET uhn LEE-vruh", "è"], ["2. Tu amènes des amis.", "tew a-MEN day za-MEE", "è"], ["3. Je préfère les blondes.", "zhuh pray-FAIR lay BLOHND", "è"], ["4. Elle répète la leçon.", "el ray-PET lah luh-SOHN", "è"], ["5. Vous préférez les brunes.", "voo pray-fay-RAY lay BREWN", "no change"], ["6. Nous enlevons nos chaussures.", "noo zahn-luh-VOHN no sho-SEWR", "no change"], ["7. Vous répétez les phrases.", "voo ray-pay-TAY lay FRAZ", "no change"], ["8. Nous complétons la leçon.", "noo kohm-play-TOHN lah luh-SOHN", "no change"], ["9. Nous achetons un livre.", "noo zash-TOHN uhn LEE-vruh", "no change"], ["10. Il pèse 100 kilos.", "eel PEZ sahn kee-LO", "è"], ["11. On répète les phrases.", "ohn ray-PET lay FRAZ", "è"], ["12. Ils préfèrent les rousses.", "eel pray-FAIR lay ROOSS", "è"]]}, {"name": "Ex. 3 — complétez", "items": [["1. J'appelle Londres. Vous appelez Prague. Ils appellent Rio.", "zha-PELL … voo za-play-AY … eel za-PELL", "appeler"], ["2. Il achète une veste. Elle achète une robe. Nous achetons un pull.", "eel a-SHET … noo zash-TOHN", "acheter"], ["3. Tu appelles ta sœur. Nous appelons nos amis. Vous appelez vos parents.", "tew a-PELL … noo za-play-OHN … voo za-play-AY", "appeler"], ["4. Vous mangez une glace. Elle mange des frites. Nous mangeons un sandwich.", "voo mahn-ZHAY … noo mahn-ZHOHN", "manger"], ["5. Vous voyagez en avion. Ils voyagent en train. Nous voyageons en car.", "voo vwa-ya-ZHAY … noo vwa-ya-ZHOHN", "voyager"]]}, {"name": "Ex. 4 — Bip et Zaza racontent", "note": "The whole text moved from <em>je</em> to <em>nous</em> — which is where the -ger spelling changes show up.", "items": [["Nous visitons de nombreuses planètes.", "noo vee-zee-TOHN duh nohm-BRUHZ pla-NET", "We visit many planets."], ["Nous voyageons en astronef.", "noo vwa-ya-ZHOHN ah nas-tro-NEF", "We travel by spaceship. — note the e"], ["Quand nous arrivons dans un nouveau pays, nous achetons un dictionnaire et nous étudions la langue.", "kahn noo za-ree-VOHN … noo zash-TOHN … noo zay-tew-dee-OHN", "When we arrive in a new country we buy a dictionary and study the language."], ["Nous posons des questions.", "noo po-ZOHN day kes-tee-OHN", "We ask questions."], ["Nous goûtons la nourriture. Nous comparons.", "noo goo-TOHN lah noo-ree-TEWR. noo kohm-pa-ROHN", "We taste the food. We compare."], ["De temps en temps, nous appelons Mars.", "duh tahn zahn TAHN, noo za-play-OHN MARSS", "From time to time we call Mars."], ["Nous aimons beaucoup la France. Nous espérons revenir un jour.", "noo zay-MOHN bo-KOO lah FRAHNSS. noo zes-pay-ROHN ruh-vuh-NEER uhn ZHOOR", "We love France. We hope to come back one day."]]}, {"name": "Ex. 5 — énumérez les activités", "items": [["Au marché, je regarde, je compare et j'achète.", "oh mar-SHAY, zhuh ruh-GARD, zhuh kohm-PAR ay zha-SHET", "At the market I look, compare and buy."], ["À l'école maternelle, les enfants dansent, chantent et jouent.", "a lay-KOL ma-tair-NELL, lay zahn-FAHN DAHNSS, SHAHNT ay ZHOO", "At nursery school the children dance, sing and play."], ["Dans la classe de langue, nous parlons, nous écoutons et nous répétons.", "dahn lah klahss duh LAHNG, noo par-LOHN, noo zay-koo-TOHN ay noo ray-pay-TOHN", "In the language class we speak, listen and repeat."], ["Dans notre société de consommation, on achète, on jette et on achète.", "dahn NOT-ruh so-see-ay-TAY duh kohn-so-ma-see-OHN, ohn a-SHET, ohn ZHET ay ohn a-SHET", "In our consumer society we buy, throw away and buy again."]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["préférer", "pray-fay-RAY", "to prefer"], ["acheter", "ash-TAY", "to buy"], ["jeter", "zhuh-TAY", "to throw away"], ["appeler", "ap-LAY", "to call"], ["payer", "pay-YAY", "to pay"], ["envoyer", "ahn-vwa-YAY", "to send"], ["voyager", "vwa-ya-ZHAY", "to travel"], ["goûter", "goo-TAY", "to taste"], ["comparer", "kohm-pa-RAY", "to compare"], ["poser une question", "po-ZAY ewn kes-tee-OHN", "to ask a question"], ["une veste", "ewn VEST", "a jacket"], ["une robe", "ewn ROB", "a dress"], ["un pull", "uhn PEWL", "a jumper"], ["des chaussures", "day sho-SEWR", "shoes"], ["les pâtes", "lay PAHT", "pasta"], ["le riz", "luh REE", "rice"], ["une glace", "ewn GLAHSS", "an ice cream"], ["des frites", "day FREET", "chips"], ["le printemps", "luh pran-TAHN", "spring"], ["l'automne", "lo-TUN", "autumn"], ["le vin blanc / rouge", "luh van BLAHN / ROOZH", "white / red wine"], ["une planète", "ewn pla-NET", "a planet"], ["un astronef", "uh nas-tro-NEF", "a spaceship"], ["la nourriture", "lah noo-ree-TEWR", "food"], ["un dictionnaire", "uhn deek-see-o-NAIR", "a dictionary"], ["l'école maternelle", "lay-KOL ma-tair-NELL", "nursery school"], ["la société de consommation", "lah so-see-ay-TAY duh kohn-so-ma-see-OHN", "consumer society"], ["blond / brun / roux", "BLOHN / BRUHN / ROO", "blond / brown-haired / red-haired"]]}]}, {"id": "gr-9", "label": "Chapitre 9", "name": "Je me lave. Je me regarde.", "summary": "Pages 26–27. Reflexive verbs — when the subject is also the object, and the little pronoun that has to sit in front of the verb.", "art": "reflexif", "bookpages": ["g026", "g027"], "groups": [{"name": "La différence en images", "note": "When the subject is <strong>also the object</strong> of the verb, French uses a reflexive pronoun. <em>me</em> means <em>moi-même</em> — myself.", "cols": "two", "items": [["Je lave ma voiture.", "zhuh LAHV ma vwa-TEWR", "I wash my car. — object is the car"], ["Je me lave.", "zhuh muh LAHV", "I wash myself."], ["Je regarde la télé.", "zhuh ruh-GARD lah tay-LAY", "I watch TV. — object is the TV"], ["Je me regarde.", "zhuh muh ruh-GARD", "I look at myself."]]}, {"name": "Se laver — les pronoms réfléchis", "cols": "two", "note": "The pronoun always goes <strong>in front of the verb</strong>, never after it.", "items": [["Je me lave", "zhuh muh LAHV", "I wash (myself)"], ["Tu te laves", "tew tuh LAHV", "you wash"], ["Il / Elle / On se lave", "eel suh LAHV", "he / she washes"], ["Nous nous lavons", "noo noo la-VOHN", "we wash"], ["Vous vous lavez", "voo voo la-VAY", "you wash"], ["Ils / Elles se lavent", "eel suh LAHV", "they wash"]]}, {"name": "À ne pas dire", "note": "✓ Dites : <strong>Je me regarde.</strong> &nbsp;✗ Ne dites pas : <s>Je regarde moi.</s>", "items": [["Je me regarde.", "zhuh muh ruh-GARD", "I look at myself. — correct"]]}, {"name": "Élision et liaison", "note": "<strong>me → m'</strong>, <strong>te → t'</strong>, <strong>se → s'</strong> before a vowel or a silent h. And in <em>nous nous</em> / <em>vous vous</em> the second word links with a <strong>z</strong> sound.", "cols": "two", "items": [["Je m'appelle", "zhuh ma-PELL", "I'm called"], ["Tu t'habilles", "tew ta-BEE-yuh", "you get dressed"], ["Il s'ennuie", "eel sahn-NWEE", "he is bored"], ["Nous nous amusons", "noo noo za-mew-ZOHN", "we enjoy ourselves — liaison z"], ["Vous vous ennuyez", "voo voo zahn-nwee-YAY", "you are bored — liaison z"]]}, {"name": "Ex. 1 — le modèle", "items": [["Le lundi, je me lève à sept heures et demie et je me couche à dix heures.", "luh luhn-DEE, zhuh muh LEV a set UR ay duh-MEE ay zhuh muh KOOSH a dee ZUR", "On Mondays I get up at 7.30 and go to bed at 10."], ["Le samedi, je me lève à neuf heures et je me couche à minuit.", "luh sam-DEE … a nuh VUR … a mee-NWEE", "On Saturdays I get up at 9 and go to bed at midnight."], ["Le dimanche, je me lève à onze heures.", "luh dee-MAHNSH, zhuh muh LEV a ohn ZUR", "On Sundays I get up at 11."]]}, {"name": "Ex. 2 — les habitudes de Bruno et de ses parents", "items": [["En semaine, il se lève à sept heures.", "ahn suh-MEN, eel suh LEV a set UR", "During the week he gets up at 7."], ["En vacances, il se lève à onze heures.", "ahn va-KAHNSS, eel suh LEV a ohn ZUR", "On holiday he gets up at 11."], ["Ses parents se lèvent à six heures et ils se couchent tôt.", "say pa-RAHN suh LEV a see ZUR ay eel suh KOOSH TOH", "His parents get up at 6 and go to bed early."]]}, {"name": "Ex. 3 — quand on est…", "items": [["Quand on est fatigué, on se repose.", "kahn ohn ay fa-tee-GAY, ohn suh ruh-POZ", "When you're tired, you rest."], ["Quand on a sommeil, on se couche.", "kahn ohn a so-MAY, ohn suh KOOSH", "When you're sleepy, you go to bed."], ["Quand on est sale, on se lave.", "kahn ohn ay SAL, ohn suh LAHV", "When you're dirty, you wash."], ["Quand on est mouillé, on se sèche.", "kahn ohn ay moo-YAY, ohn suh SESH", "When you're wet, you dry off."], ["Quand il fait beau, on se promène.", "kahn teel fay BO, ohn suh pro-MEN", "When the weather's fine, you go for a walk."], ["Quand on est pressé, on se dépêche.", "kahn ohn ay press-AY, ohn suh day-PESH", "When you're in a hurry, you hurry."]]}, {"name": "Ex. 4 — se lever et se coucher", "items": [["Vous vous levez à quelle heure, le matin ? — Le matin, nous nous levons à sept heures.", "voo voo luh-VAY a kel UR … noo noo luh-VOHN", "What time do you get up in the morning?"], ["Vous vous couchez à quelle heure, le soir ? — Le soir, nous nous couchons à onze heures.", "voo voo koo-SHAY … noo noo koo-SHOHN", "What time do you go to bed at night?"], ["Vous vous levez à quelle heure, le dimanche ? — Le dimanche, nous nous levons à dix heures.", "… luh dee-MAHNSH …", "What time do you get up on Sundays?"], ["Vous vous couchez à quelle heure, en vacances ? — En vacances, nous nous couchons très tard.", "… ahn va-KAHNSS … treh TAR", "What time do you go to bed on holiday?"]]}, {"name": "Ex. 5 — les verbes et les lieux", "cols": "two", "items": [["Dans la salle de bains, je me douche, je me lave, je me rase, je me maquille.", "dahn lah sal duh BAN, zhuh muh DOOSH, zhuh muh LAHV, zhuh muh RAHZ, zhuh muh ma-KEE", "In the bathroom: shower, wash, shave, put on make-up."], ["Dans la rue, je me promène, je me dépêche.", "dahn lah REW, zhuh muh pro-MEN, zhuh muh day-PESH", "In the street: stroll, hurry."], ["Dans le jardin, je me repose, je m'amuse.", "dahn luh zhar-DAN, zhuh muh ruh-POZ, zhuh ma-MEWZ", "In the garden: rest, have fun."], ["Dans la chambre, je m'habille, je me déshabille, je me couche, je me parfume.", "dahn lah SHAHM-bruh, zhuh ma-BEE, zhuh muh day-za-BEE, zhuh muh KOOSH, zhuh muh par-FEWM", "In the bedroom: dress, undress, go to bed, put on perfume."]]}, {"name": "Les verbes pronominaux — la liste", "cols": "two", "items": [["se laver", "suh la-VAY", "to wash oneself"], ["se doucher", "suh doo-SHAY", "to shower"], ["se raser", "suh ra-ZAY", "to shave"], ["se maquiller", "suh ma-kee-YAY", "to put on make-up"], ["se parfumer", "suh par-few-MAY", "to put on perfume"], ["se sécher", "suh say-SHAY", "to dry oneself"], ["s'habiller", "sa-bee-YAY", "to get dressed"], ["se déshabiller", "suh day-za-bee-YAY", "to get undressed"], ["se lever", "suh luh-VAY", "to get up"], ["se coucher", "suh koo-SHAY", "to go to bed"], ["se reposer", "suh ruh-po-ZAY", "to rest"], ["se promener", "suh prom-NAY", "to go for a walk"], ["s'amuser", "sa-mew-ZAY", "to have fun"], ["s'ennuyer", "sahn-nwee-YAY", "to be bored"], ["se dépêcher", "suh day-pay-SHAY", "to hurry"], ["s'appeler", "sap-LAY", "to be called"]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["fatigué / fatiguée", "fa-tee-GAY", "tired"], ["avoir sommeil", "a-VWAHR so-MAY", "to be sleepy"], ["sale", "SAL", "dirty"], ["mouillé / mouillée", "moo-YAY", "wet"], ["pressé / pressée", "press-AY", "in a hurry"], ["tôt", "TOH", "early"], ["tard", "TAR", "late"], ["minuit", "mee-NWEE", "midnight"], ["en semaine", "ahn suh-MEN", "during the week"], ["en vacances", "ahn va-KAHNSS", "on holiday"], ["la salle de bains", "lah sal duh BAN", "the bathroom"], ["la chambre", "lah SHAHM-bruh", "the bedroom"], ["le jardin", "luh zhar-DAN", "the garden"], ["une habitude", "ew na-bee-TEWD", "a habit"]]}]}, {"id": "gr-recap1", "label": "Récapitulatif", "name": "Exercices récapitulatifs · Bilan n° 1", "summary": "Pages 28–29. Revision after chapters 1–9  Pages are here; the word-by-word transcription is still to come.", "art": null, "bookpages": ["g028", "g029"], "groups": [{"name": "Les pages du livre", "items": [], "pages": ["g028", "g029"], "note": "Every line of this chapter will be transcribed with pronunciation and meaning, the same as chapters 1–9."}]}, {"id": "gr-10", "label": "Chapitre 10", "name": "Un homme, une femme. Un arbre, une route.", "summary": "Pages 30–33. Le nom et l'article · Masculin et féminin des noms  Pages are here; the word-by-word transcription is still to come.", "art": null, "bookpages": ["g030", "g031", "g032", "g033"], "groups": [{"name": "Les pages du livre", "items": [], "pages": ["g030", "g031", "g032", "g033"], "note": "Every line of this chapter will be transcribed with pronunciation and meaning, the same as chapters 1–9."}]}, {"id": "gr-11", "label": "Chapitre 11", "name": "Des arbres, des fleurs, des oiseaux", "summary": "Pages 34–35. Singulier et pluriel mmary": "Greeting, introducing, welcoming, apologising, thanking, congratulating, wishing.", "art": "bise", "groups": [{"name": "Dire bonjour", "items": [["Bonjour, madame / monsieur.", "bohn-ZHOOR, ma-DAM / muh-SYUH", "Hello — during the day."], ["Bonsoir, madame.", "bohn-SWAHR, ma-DAM", "Good evening."], ["Bonjour, ma chère Mathilde !", "bohn-ZHOOR, ma SHAIR", "Hello, my dear Mathilde!"], ["Bonjour, Bénédicte, comment vas-tu ?", "ko-mahn va-TEW", "Hello Bénédicte, how are you?"], ["Bien, merci, et toi ?", "bee-AN, mair-SEE, ay TWAH", "Fine thanks, and you?"], ["Ça va bien, merci.", "sa va bee-AN, mair-SEE", "I'm doing well, thanks."], ["Salut, Mathilde, ça va ?", "sa-LEW, sa VA", "Hi Mathilde, you good?"], ["Tiens, salut ! Ça va, merci, et toi ?", "tee-AN, sa-LEW", "Oh hey! Good thanks, you?"]]}, {"name": "Dire au revoir", "items": [["Au revoir, Diane, à bientôt !", "oh ruh-VWAHR, a bee-an-TO", "Goodbye Diane, see you soon!"], ["Salut, Simon ! À tout à l'heure !", "sa-LEW, a too ta LUR", "Bye Simon! See you in a bit!"], ["Bonsoir, Raphaël, à lundi !", "bohn-SWAHR, a luhn-DEE", "Goodnight Raphaël, see you Monday!"]]}, {"name": "Présenter quelqu'un", "items": [["Je vous présente Florence Dusapin.", "zhuh voo pray-ZAHNT", "Let me introduce Florence Dusapin."], ["Bonjour, madame, enchanté.", "bohn-ZHOOR, ma-DAM, ahn-shahn-TAY", "Hello madam, delighted. (said by a man)"], ["Enchantée, monsieur.", "ahn-shahn-TAY, muh-SYUH", "Delighted. (said by a woman)"], ["Nicolas, est-ce que tu connais ma copine Émilie ?", "es-kuh tew ko-NAY ma ko-PEEN", "Nicolas, do you know my friend Émilie?"], ["Non, pas encore. Bonjour, Émilie.", "nohn, pa zahn-KOR", "No, not yet. Hello, Émilie."]]}, {"name": "Accueillir", "items": [["Entrez, je vous en prie !", "ahn-TRAY, zhuh voo zahn PREE", "Come in, please!"], ["Je peux prendre votre manteau ?", "zhuh puh PRAHN-druh VOT-ruh mahn-TO", "May I take your coat?"], ["Ça me fait plaisir de vous voir !", "sa muh fay play-ZEER duh voo VWAHR", "Lovely to see you!"], ["Asseyez-vous, je vous en prie !", "a-say-yay VOO, zhuh voo zahn PREE", "Please sit down."], ["Je suis content de te voir ! Assieds-toi, je t'en prie !", "zhuh swee kohn-TAHN duh tuh VWAHR", "Glad to see you! Sit down. (familiar)"]]}, {"name": "S'excuser", "items": [["Oh, pardon, madame. Je suis désolé !", "oh, par-DOHN, ma-DAM. zhuh swee day-zo-LAY", "Oh, sorry madam. My apologies!"], ["Ce n'est rien, monsieur !", "suh nay ree-AN", "It's nothing, sir!"], ["Excusez-moi, je suis désolée d'être en retard !", "eks-kew-zay MWAH", "Excuse me, I'm sorry I'm late!"], ["Je vous en prie, ce n'est pas grave.", "zhuh voo zahn PREE, suh nay pah GRAHV", "Not at all, it's fine."]]}, {"name": "Demander et remercier", "items": [["Pardon, madame, vous pouvez me dire où est la poste, s'il vous plaît ?", "par-DOHN … voo poo-VAY muh DEER oo ay lah POST", "Excuse me, could you tell me where the post office is?"], ["C'est au bout de la rue, à droite.", "set oh boo duh lah REW, a DRWAHT", "It's at the end of the street, on the right."], ["Je vous remercie, madame.", "zhuh voo ruh-mair-SEE", "Thank you, madam."], ["Je vous en prie, monsieur.", "zhuh voo zahn PREE", "You're welcome, sir."], ["Tu peux me prêter un euro, s'il te plaît ?", "tew puh muh pray-TAY uhn UR-oh", "Can you lend me a euro, please?"], ["Oui, bien sûr ! Voilà !", "wee, bee-AN SEWR ! vwa-LAH", "Yes of course! Here you go!"], ["Merci beaucoup !", "mair-SEE bo-KOO", "Thanks a lot!"], ["De rien !", "duh ree-AN", "You're welcome!"]]}, {"name": "Féliciter et plaindre", "items": [["Félicitations ! Toutes mes félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Je suis vraiment content pour toi !", "zhuh swee vray-MAHN kohn-TAHN poor TWAH", "I'm really happy for you!"], ["Bravo !", "bra-VO", "Well done!"], ["Tous mes vœux de bonheur !", "too may vuh duh bo-NUR", "Wishing you every happiness! (a wedding)"], ["Oh, mon pauvre Marc ! Tu n'as pas de chance !", "oh, mohn PO-vruh … tew na pah duh SHAHNSS", "Oh, poor Marc! Tough luck!"], ["C'est terrible, c'est affreux, ce n'est pas possible !", "say tair-EE-bluh, set a-FRUH", "That's terrible, that's awful, that can't be!"], ["Je suis désolé pour vous.", "zhuh swee day-zo-LAY poor VOO", "I'm so sorry for you."]]}, {"name": "Souhaiter", "cols": "two", "items": [["Bonne journée !", "bun zhoor-NAY", "Have a good day!"], ["Bonne après-midi !", "bun a-pray-mee-DEE", "Have a good afternoon!"], ["Bonne soirée !", "bun swa-RAY", "Have a good evening!"], ["Bonne nuit ! Dors bien !", "bun NWEE ! dor bee-AN", "Good night, sleep well!"], ["Bon week-end !", "bohn week-END", "Have a good weekend!"], ["Bonnes vacances ! Repose-toi bien !", "bun va-KAHNSS ! ruh-poz-twah bee-AN", "Enjoy your holiday, rest well!"], ["Bon voyage !", "bohn vwa-YAHZH", "Have a good trip!"], ["Bon appétit !", "bohn a-pay-TEE", "Enjoy your meal!"], ["Bon anniversaire ! Joyeux anniversaire !", "bun a-nee-vair-SAIR", "Happy birthday!"], ["Bonne chance !", "bun SHAHNSS", "Good luck!"], ["Joyeux Noël !", "zhwa-YUH no-ELL", "Merry Christmas!"], ["Bonne année ! Tous mes vœux !", "bun a-NAY ! too may VUH", "Happy New Year!"]]}], "bookpages": ["v006", "v007", "v008", "v009", "v010", "v011", "v012", "v013"]}, {"id": "vp-2", "label": "Unité 2", "name": "La famille, les périodes de la vie", "summary": "Every relative from grand-père to belle-sœur, plus the stages of a life and how to talk about age.", "art": "tree", "groups": [{"name": "La famille", "cols": "two", "items": [["le mari", "luh ma-REE", "husband"], ["la femme", "lah FAM", "wife / woman"], ["les parents", "lay pa-RAHN", "parents"], ["les enfants", "lay zahn-FAHN", "children"], ["le fils", "luh FEESS", "son"], ["la fille", "lah FEE-yuh", "daughter / girl"], ["le frère", "luh FRAIR", "brother"], ["la sœur", "lah SUR", "sister"], ["le beau-père", "luh bo-PAIR", "father-in-law / stepfather"], ["la belle-mère", "lah bell-MAIR", "mother-in-law / stepmother"], ["la belle-fille", "lah bell-FEE-yuh", "daughter-in-law"], ["le gendre", "luh ZHAHN-druh", "son-in-law"], ["le beau-frère", "luh bo-FRAIR", "brother-in-law"], ["la belle-sœur", "lah bell-SUR", "sister-in-law"], ["les beaux-parents", "lay bo-pa-RAHN", "parents-in-law"], ["les grands-parents", "lay grahn-pa-RAHN", "grandparents"], ["le grand-père", "luh grahn-PAIR", "grandfather"], ["la grand-mère", "lah grahn-MAIR", "grandmother"], ["les petits-enfants", "lay puh-tee-zahn-FAHN", "grandchildren"], ["le petit-fils", "luh puh-tee-FEESS", "grandson"], ["la petite-fille", "lah puh-teet-FEE-yuh", "granddaughter"], ["l'oncle", "LON-kluh", "uncle"], ["la tante", "lah TAHNT", "aunt"], ["le neveu", "luh nuh-VUH", "nephew"], ["la nièce", "lah nee-ESS", "niece"], ["le cousin", "luh koo-ZAN", "cousin (m)"], ["la cousine", "lah koo-ZEEN", "cousin (f)"]]}, {"name": "Les noms familiers", "cols": "three", "items": [["maman", "ma-MAHN", "mum"], ["papa", "pa-PAH", "dad"], ["papi", "pa-PEE", "grandpa"], ["mamie", "ma-MEE", "grandma"], ["tonton", "tohn-TOHN", "uncle (childish)"], ["tatie", "ta-TEE", "auntie"]]}, {"name": "Les périodes de la vie", "cols": "two", "note": "<strong>bébé</strong> is always masculine, even for a girl. <strong>personne</strong> is always feminine, even for a man.<br><br>Careful with <strong>la petite-fille</strong> (granddaughter) versus <strong>une petite fille</strong> (a little girl) — the hyphen and article change everything. And <strong>vieux</strong> sounds blunt; <strong>âgé</strong> is the polite word.", "items": [["un bébé — de 0 à 2 ans", "uhn bay-BAY", "a baby"], ["un enfant — de 2 à 11 ans", "uhn nahn-FAHN", "a child"], ["un adolescent — de 12 à 18 ans", "uhn na-do-lay-SAHN", "a teenager"], ["un adulte — après 18 ans", "uhn na-DEWLT", "an adult"], ["une personne âgée", "ewn pair-SUN a-ZHAY", "an elderly person"], ["un petit garçon / une petite fille", "uhn puh-tee gar-SOHN / ewn puh-teet FEE-yuh", "a little boy / girl"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["J'ai passé mon enfance en Bretagne.", "zhay pa-SAY moh nahn-FAHNSS", "I spent my childhood in Brittany."], ["Il a eu une adolescence heureuse.", "eel a ew ewn a-do-lay-SAHNSS uh-RUHZ", "He had a happy adolescence."], ["Quel âge ont Véronique et Denis ?", "kel AHZH ohn", "How old are Véronique and Denis?"], ["Véronique a 5 ans de moins que Denis.", "… san kahn duh MWAN kuh", "Véronique is 5 years younger than Denis."], ["Denis a 5 ans de plus que sa femme.", "… san kahn duh PLEWSS kuh", "Denis is 5 years older than his wife."], ["Les enfants grandissent.", "lay zahn-FAHN grahn-DEESS", "Children grow."]]}, {"name": "La vie et la mort", "items": [["Aude est née le 28 septembre 1960.", "ohd ay NAY luh van-weet sep-TAHM-bruh", "Aude was born 28 September 1960."], ["Sa date de naissance est le 28/09/60.", "sa dat duh nay-SAHNSS", "Her date of birth is 28/09/60."], ["Elle a son anniversaire le 28 septembre.", "el a soh na-nee-vair-SAIR", "Her birthday is 28 September."], ["Il a perdu sa femme : elle est morte le 10 mai.", "eel a pair-DEW sa FAM : el ay MORT", "He lost his wife: she died on 10 May."], ["Elle est décédée.", "el ay day-say-DAY", "She passed away."]]}], "bookpages": ["v014", "v015", "v016", "v017"]}, {"id": "vp-3", "label": "Unité 3", "name": "L'amour, les émotions", "summary": "Meeting, falling in love, marrying, separating — and the intensity ladder of the verb aimer.", "art": "aimer", "groups": [{"name": "L'amour", "items": [["Il tombe amoureux de Mathilde.", "eel tohnb a-moo-RUH duh", "He falls in love with Mathilde."], ["Elle tombe amoureuse.", "el tohnb a-moo-RUHZ", "She falls in love."], ["Ils s'embrassent.", "eel sahm-BRAHSS", "They kiss."], ["Je t'aime.", "zhuh TEM", "I love you."], ["Ils commencent une relation.", "eel ko-MAHNSS ewn ruh-la-see-OHN", "They start a relationship."], ["Il est célibataire, il vit seul.", "eel ay say-lee-ba-TAIR, eel vee SUL", "He's single, he lives alone."], ["Ils vivent ensemble.", "eel VEEV ahn-SAHM-bluh", "They live together."], ["Il sort avec Mathilde.", "eel sor a-vek", "He's going out with Mathilde."], ["Ils sont amoureux. C'est la passion !", "eel sohn ta-moo-RUH. say lah pa-see-OHN", "They're in love. It's passion!"], ["Ils décident de se marier.", "eel day-SEED duh suh ma-ree-AY", "They decide to get married."], ["un mariage civil / un mariage religieux", "uhn ma-ree-AHZH see-VEEL / ruh-lee-zhee-UH", "a civil / religious wedding"], ["Ils vont à la mairie.", "eel vohn a lah may-REE", "They go to the town hall."], ["une belle robe de mariée", "ewn bell rob duh ma-ree-AY", "a beautiful wedding dress"], ["Ils vivent en couple depuis cinq ans.", "eel veev ahn KOO-pluh duh-PWEE sank ahn", "They've been a couple for five years."]]}, {"name": "Après le mariage", "note": "In France only the <strong>mariage civil</strong> at the mairie has legal force. For an unmarried partner you say <strong>mon ami(e)</strong>, or casually <strong>mon copain / ma copine</strong>. Married, it's <strong>mon mari / ma femme</strong>.", "items": [["Ils vont avoir un enfant.", "eel vohn ta-VWAHR uhn nahn-FAHN", "They're going to have a baby."], ["Ils ont divorcé.", "eel zohn dee-vor-SAY", "They got divorced."], ["Elle a demandé le divorce.", "el a duh-mahn-DAY luh dee-VORSS", "She asked for the divorce."], ["Elle a quitté Gabriel il y a six mois.", "el a kee-TAY … eel ee a see MWAH", "She left Gabriel six months ago."], ["La séparation doit être difficile.", "lah say-pa-ra-see-OHN dwah tet-ruh dee-fee-SEEL", "The separation must be hard."], ["Il est libre, maintenant.", "eel ay LEE-bruh, man-tuh-NAHN", "He's free now."], ["On se disputait beaucoup.", "ohn suh dees-pew-TAY bo-KOO", "We argued a lot."], ["Elle était très jalouse.", "el ay-TAY tray zha-LOOZ", "She was very jealous."], ["Est-ce que tu voudrais te remarier ?", "es-kuh tew voo-DREH tuh ruh-ma-ree-AY", "Would you want to remarry?"]]}, {"name": "Le verbe aimer — l'échelle", "note": "The intensity ladder, and it matters: <strong>j'aime bien</strong> = a friend · <strong>j'aime beaucoup</strong> = a close friend · <strong>j'aime</strong> alone = your romantic partner · <strong>j'adore</strong> = for things.<br><br>Say bare <em>j'aime</em> about a friend and it sounds like a declaration you didn't mean to make.", "items": [["Grégoire aime bien Carine.", "gray-GWAHR em bee-AN", "Grégoire likes Carine — they're friends."], ["Grégoire aime beaucoup Dora.", "gray-GWAHR em bo-KOO", "Grégoire is very fond of Dora."], ["Grégoire aime Juliette.", "gray-GWAHR EM", "Grégoire loves Juliette — romantically."], ["Juliette est la femme de sa vie !", "zhew-lee-ETT ay lah fam duh sa VEE", "Juliette is the love of his life!"], ["J'aime bien le chocolat.", "zhem bee-AN luh sho-ko-LAH", "I quite like chocolate."], ["J'aime beaucoup le chocolat.", "zhem bo-KOO luh sho-ko-LAH", "I really like chocolate."], ["J'adore le chocolat !", "zha-DOR luh sho-ko-LAH", "I love chocolate!"]]}, {"name": "Quelques émotions", "items": [["La joie — les enfants sont joyeux, ils rient.", "lah ZHWAH — zhwa-YUH, eel REE", "Joy — the children are joyful, they laugh."], ["La fierté — les parents sont fiers de leurs enfants.", "lah fee-air-TAY — fee-AIR", "Pride — the parents are proud of their children."], ["La tristesse — elle est très malheureuse, elle pleure.", "lah trees-TESS — mal-uh-RUHZ, el PLUR", "Sadness — she's very unhappy, she cries."], ["Elle a beaucoup de chagrin.", "el a bo-KOO duh sha-GRAN", "She's deeply grieving."], ["La colère — sa mère est furieuse contre lui.", "lah ko-LAIR — few-ree-UHZ", "Anger — his mother is furious with him."], ["Elle est en colère contre lui.", "el et ahn ko-LAIR kohn-truh LWEE", "She's angry with him."], ["La peur — il a eu très peur.", "lah PUR — eel a ew tray PUR", "Fear — he was very frightened."], ["La surprise — il est surpris, étonné.", "lah sewr-PREEZ — sewr-PREE, ay-to-NAY", "Surprise — he's surprised, astonished."], ["une bonne surprise / une mauvaise surprise", "ewn bun sewr-PREEZ / ewn mo-VEZ sewr-PREEZ", "a good / bad    INDEXES
   ══════════════════════════════════════════════ */
const LESSONS=[], FLAT=[];
DATA.forEach(sec=>{
  sec.count=0;
  sec.lessons.forEach(les=>{
    les.section=sec;
    les.count=les.groups.reduce((a,g)=>a+(g.items?g.items.length:0)+(g.pages?g.pages.length:0)+(g.tracks?g.tracks.length:0),0);
    sec.count+=les.count;
    LESSONS.push(les);
    les.groups.forEach(g=>(g.items||[]).forEach(it=>{
      FLAT.push({it,les,group:g.name,key:it[0]+'|'+(it[2]||'')});
    }));
  });
});
const lessonById=id=>LESSONS.find(l=>l.id===id);
const TOTAL=FLAT.length;

/* ══════════════════════════════════════════════
   FAVOURITES
   ══════════════════════════════════════════════ */
let done=new Set();
try{const d=localStorage.getItem('carnet-done'); if(d) done=new Set(JSON.parse(d));}catch(e){}
function saveDone(){try{localStorage.setItem('carnet-done',JSON.stringify([...done]));}catch(e){}}

let favs=new Set();
try{ const raw=localStorage.getItem('carnet-favs'); if(raw) favs=new Set(JSON.parse(raw)); }catch(e){}
function saveFavs(){ try{ localStorage.setItem('carnet-favs',JSON.stringify([...favs])); }catch(e){} }
function toggleFav(key){
  favs.has(key)?favs.delete(key):favs.add(key);
  saveFavs(); updateFavCount();
}
function updateFavCount(){
  const el=document.getElementById('favct');
  el.textContent=favs.size?favs.size:'';
}
updateFavCount();

/* ══════════════════════════════════════════════
   SPEECH
   ══════════════════════════════════════════════ */
let voice=null, rate=0.8, speakingEl=null, queue=null, queueBtn=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  voice=vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;
  const dot=document.getElementById('voicedot'), lbl=document.getElementById('voicelbl');
  if(voice){ dot.classList.remove('bad'); lbl.textContent=voice.name.replace(/\s*\(.*\)/,'').slice(0,16); }
  else { dot.classList.add('bad'); lbl.textContent='No FR voice'; }
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged',pickVoice);
  pickVoice(); setTimeout(pickVoice,700);
}
document.getElementById('voicebtn').addEventListener('click',()=>{
  alert(voice
    ? "Speaking with: "+voice.name
    : "No French voice is installed, so playback will use an English accent.\n\niPhone: Settings → Accessibility → Spoken Content → Voices → Français\nAndroid: Settings → Text-to-speech → install French\nWindows: Settings → Time & language → Speech → Add voices");
});
document.getElementById('speed').addEventListener('change',e=>{rate=parseFloat(e.target.value)});

function stopSpeech(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  queue=null;
  if(queueBtn){queueBtn.classList.remove('on');queueBtn.querySelector('.t').textContent='Play all';queueBtn=null;}
  document.querySelectorAll('.item.speaking').forEach(e=>e.classList.remove('speaking'));
  speakingEl=null;
}
function speak(text,el,onend){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.item.speaking').forEach(e=>e.classList.remove('speaking'));
  const clean=text.replace(/\s*[—–]\s*/g,', ').replace(/\s*→\s*/g,', ');
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='fr-FR'; if(voice) u.voice=voice; u.rate=rate;
  if(el){el.classList.add('speaking'); speakingEl=el;}
  u.onend=()=>{ if(el) el.classList.remove('speaking'); if(onend) onend(); };
  u.onerror=()=>{ if(el) el.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}
function playGroup(btn,items,tiles){
  if(queueBtn===btn){stopSpeech();return;}
  stopSpeech();
  queueBtn=btn; btn.classList.add('on'); btn.querySelector('.t').textContent='Stop';
  queue=0;
  (function step(){
    if(queue===null||queue>=items.length){stopSpeech();return;}
    const i=queue, el=tiles[i];
    el.scrollIntoView({block:'nearest',behavior:'smooth'});
    speak(items[i][0],el,()=>{ if(queue!==null){queue=i+1;step();} });
  })();
}


/* ══════════════════════════════════════════════
   MEDIA PATHS — works whether files sit in
   pages/ + audio/ folders or flat beside index.html
   ══════════════════════════════════════════════ */
let FLATMEDIA=false;
const pageName=p=>(typeof p==='string'?p:'p'+String(p).padStart(3,'0'))+'.jpg';
const trackName=n=>'piste_'+String(n).padStart(3,'0')+'.mp3';
const pageSrc =p=>(FLATMEDIA?'':'pages/')+pageName(p);
const trackSrc=n=>(FLATMEDIA?'':'audio/')+trackName(n);
/* per-element rescue: if the folder path 404s, retry flat */
function rescueImg(img,p){
  img.addEventListener('error',function h(){
    img.removeEventListener('error',h);
    if(img.getAttribute('src').indexOf('pages/')===0){FLATMEDIA=true;img.src=pageName(p);}
    else img.dispatchEvent(new Event('failed'));
  });
}
function rescueAudio(au,n){
  au.addEventListener('error',function h(){
    au.removeEventListener('error',h);
    if(au.getAttribute('src').indexOf('audio/')===0){FLATMEDIA=true;au.src=trackName(n);}
  });
}

/* ══════════════════════════════════════════════
   RENDER HELPERS
   ══════════════════════════════════════════════ */
const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t,q){
  if(!q) return esc(t);
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
const STAR='<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.8l1.85 3.95 4.15.55-3.05 2.9.78 4.2L8 11.4 4.27 13.4l.78-4.2L2 6.3l4.15-.55z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const STAR_O='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.8l1.85 3.95 4.15.55-3.05 2.9.78 4.2L8 11.4 4.27 13.4l.78-4.2L2 6.3l4.15-.55z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

function makeItem(it,q){
  const [fr,ph,en]=it, key=fr+'|'+(en||'');
  const b=document.createElement('button');
  b.className='item'; b.type='button'; b.setAttribute('aria-label',fr);
  b.innerHTML=(en?'<span class="en">'+hl(en,q)+'</span>':'')+
    '<span class="fr">'+hl(fr,q)+'</span>'+
    '<span class="ph">'+esc(ph)+'</span>';
  const fav=document.createElement('span');
  fav.className='fav'+(favs.has(key)?' on':'');
  fav.setAttribute('role','button'); fav.tabIndex=0;
  fav.setAttribute('aria-label','Save this word');
  fav.innerHTML=favs.has(key)?STAR:STAR_O;
  const flip=e=>{
    e.stopPropagation(); e.preventDefault();
    toggleFav(key);
    const on=favs.has(key);
    fav.classList.toggle('on',on);
    fav.innerHTML=on?STAR:STAR_O;
  };
  fav.addEventListener('click',flip);
  fav.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')flip(e)});
  b.appendChild(fav);
  b.addEventListener('click',()=>{
    if(speakingEl===b && speechSynthesis.speaking){stopSpeech();return;}
    stopSpeech(); speak(fr,b);
  });
  return b;
}

function renderGroups(host,groups,q){
  groups.forEach((g,gi)=>{
    const wrap=document.createElement('section');
    wrap.className='group'; wrap.id='g'+gi;
    const isPages = !!(g.pages && g.pages.length);
    const isTracks = !!(g.tracks && g.tracks.length);
    const isEmpty = !isPages && !isTracks && !(g.items && g.items.length);

    const h=document.createElement('div');
    h.className='ghead';
    h.innerHTML='<h3>'+esc(g.name)+'</h3>';
    const right=document.createElement('div'); right.className='right';
    right.innerHTML='<span class="gct">'+(isPages?g.pages.length+' p.':isTracks?g.tracks.length+' pistes':(g.items?g.items.length:0))+'</span>';
    let pb=null;
    if(!isPages && !isTracks && !isEmpty){
      pb=document.createElement('button');
      pb.className='playall';
      pb.innerHTML='<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span class="t">Play all</span>';
      right.appendChild(pb);
    }
    h.appendChild(right); wrap.appendChild(h);
    if(g.note){const n=document.createElement('div');n.className='note';n.innerHTML=g.note;wrap.appendChild(n);}

    if(g.dict){
      const box=document.createElement('div');
      box.className='dico';
      box.innerHTML=
        '<div class="dsearch"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>'+
        '<input id="dq" type="search" placeholder="Type a French or English word…" autocomplete="off" spellcheck="false">'+
        '<button class="dclear" id="dclear" hidden aria-label="Clear">&times;</button></div>'+
        '<div class="dmeta" id="dmeta"></div><div class="dlist" id="dlist"></div>';
      wrap.appendChild(box);
      setTimeout(()=>initDico(),0);
      host.appendChild(wrap);
      return;
    }
    if(isTracks){
      const list=document.createElement('div'); list.className='tracklist';
      g.tracks.forEach(t=>{
        const row=document.createElement('div'); row.className='track';

        row.innerHTML='<span class="tn">'+String(t.n).padStart(3,'0')+'</span>'+
          '<span class="tmeta">'+(t.label?esc(t.label):'<em>not yet matched</em>')+'</span>';
        const au=document.createElement('audio');
        au.controls=true; au.preload='none'; au.src=trackSrc(t.n); rescueAudio(au,t.n);
        au.addEventListener('play',()=>{
          stopSpeech();
          document.querySelectorAll('audio').forEach(a=>{if(a!==au)a.pause();});
        });
        au.addEventListener('error',()=>{row.classList.add('broken');});
        row.appendChild(au);
        list.appendChild(row);
      });
      wrap.appendChild(list);
    } else if(isPages){
      const grid=document.createElement('div'); grid.className='pagegrid';
      g.pages.forEach(p=>{
        const b=document.createElement('button');
        b.className='pagecard'; b.type='button';
        b.setAttribute('aria-label','Page '+p);
        b.innerHTML='<span class="ph-wrap"><img loading="lazy" src="'+pageSrc(p)+'" alt="Page '+p+'"></span><span class="pn">'+p+'</span>';
        const img=b.querySelector('img');
        rescueImg(img,p);
        img.addEventListener('failed',()=>{
          b.classList.add('broken');
          b.querySelector('.ph-wrap').innerHTML='<span class="brokenmsg">image<br>not loaded</span>';
        });
        b.addEventListener('click',()=>openLightbox(g.pages,g.pages.indexOf(p)));
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
    } else if(isEmpty){
      const e=document.createElement('div');
      e.className='note'; e.style.opacity='.8';
      e.textContent='Nothing here yet.';
      wrap.appendChild(e);
    } else {
      const box=document.createElement('div'); box.className='items '+(g.cols||'');
      const tiles=g.items.map(it=>{const t=makeItem(it,q);box.appendChild(t);return t;});
      wrap.appendChild(box);
      if(pb) pb.addEventListener('click',()=>playGroup(pb,g.items,tiles));
    }
    host.appendChild(wrap);
  });
}

/* ── lightbox for book pages ── */
let lbPages=[], lbIdx=0;
function openLightbox(pages,i){
  lbPages=pages; lbIdx=i;
  const lb=document.getElementById('lightbox');
  lb.hidden=false; document.body.style.overflow='hidden';
  paintLightbox();
}
function paintLightbox(){
  const p=lbPages[lbIdx];
  const li=document.getElementById('lbimg');
  li.src=pageSrc(p);
  li.onerror=()=>{ if(li.getAttribute('src').indexOf('pages/')===0){FLATMEDIA=true;li.src=pageName(p);} };
  document.getElementById('lbnum').textContent='Page '+p+'  ·  '+(lbIdx+1)+' / '+lbPages.length;
}
function closeLightbox(){
  document.getElementById('lightbox').hidden=true;
  document.body.style.overflow='';
}
function lbMove(d){
  lbIdx=(lbIdx+d+lbPages.length)%lbPages.length;
  paintLightbox();
}

function spy(nav){
  const groups=[...main.querySelectorAll('.group')];
  if(!groups.length||!nav.parentNode) return;
  const chips=[...nav.querySelectorAll('.gchip')];
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const i=groups.indexOf(e.target);
        chips.forEach((c,ci)=>c.classList.toggle('on',ci===i));
      }
    });
  },{rootMargin:'-100px 0px -70% 0px'});
  groups.forEach(g=>io.observe(g));
}

function startDeck(){
  let pool=scopePool().filter(r=>r.it[2]);
  if(pDir==='en') pool=pool.filter(r=>r.it[2]);
  if(!pool.length){ pool=scopePool(); }
  pDeck=[...pool].sort(()=>Math.random()-0.5).slice(0,20);
  pIdx=0; pDone=0; pRevealed=false;
  renderCard();
}
function renderCard(){
  if(pIdx>=pDeck.length){ renderDone(); return; }
  const r=pDeck[pIdx], [fr,ph,en]=r.it;
  document.getElementById('ptitle').textContent='Card '+(pIdx+1)+' of '+pDeck.length;
  const pct=Math.round((pIdx/pDeck.length)*100);
  const promptTxt = pDir==='fr' ? fr : (en||fr);
  pbody.innerHTML=
    '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="pcount"><span>'+esc(r.les.label)+' · '+esc(r.group)+'</span><span>'+pDone+' done</span></div>'+
    '<div class="flash" id="flash">'+
      '<div class="prompt">'+esc(promptTxt)+'</div>'+
      (pRevealed
        ? '<div class="divider"></div>'+
          (pDir==='fr'
            ? '<div class="ansph">'+esc(ph)+'</div><div class="anseng">'+esc(en||'')+'</div>'
            : '<div class="ansfr">'+esc(fr)+'</div><div class="ansph">'+esc(ph)+'</div>')
        : '<div class="sub">'+(pDir==='fr'?'What does it mean?':'How do you say it?')+'</div>')+
    '</div>'+
    (pRevealed
      ? '<div class="prow"><button class="again" id="pagain">Show again later</button><button class="know" id="pknow">Got it</button></div>'
      : '<div class="prow"><button class="tbtn" id="phear" style="flex:none;justify-content:center">Hear it</button><button class="go" id="preveal">Show answer</button></div>');

  if(pRevealed){
    document.getElementById('pagain').addEventListener('click',()=>{
      pDeck.push(pDeck[pIdx]); pIdx++; pRevealed=false; renderCard();
    });
    document.getElementById('pknow').addEventListener('click',()=>{
      pDone++; pIdx++; pRevealed=false; renderCard();
    });
    speak(fr,null);
  } else {
    document.getElementById('preveal').addEventListener('click',()=>{pRevealed=true;renderCard();});
    document.getElementById('phear').addEventListener('click',()=>speak(fr,null));
    if(pDir==='fr') speak(fr,null);
  }
}

   DICTIONNAIRE
   ══════════════════════════════════════════════ */
let DICO=null;
function buildDico(){
  if(DICO) return DICO;
  const seen=new Map();
  FLAT.forEach(r=>{
    const [fr,ph,en]=r.it;
    const key=fr.toLowerCase()+'|'+(en||'').toLowerCase();
    if(seen.has(key)){ seen.get(key).where.add(r.les.label); return; }
    seen.set(key,{fr,ph,en:en||'',where:new Set([r.les.label]),color:r.les.section.color});
  });
  const strip=s=>s.toLowerCase()
    .replace(/^(le |la |les |l'|un |une |des |je |j'|tu |il |elle |nous |vous |ils )/,'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  DICO=[...seen.values()].sort((a,b)=>strip(a.fr).localeCompare(strip(b.fr),'fr'));
  return DICO;
}
function initDico(){
  const inp=document.getElementById('dq'); if(!inp) return;
  const clr=document.getElementById('dclear');
  const paint=q=>{
    const all=buildDico();
    const t=q.trim().toLowerCase();
    const rows=t? all.filter(d=>d.fr.toLowerCase().includes(t)||d.en.toLowerCase().includes(t)||d.ph.toLowerCase().includes(t)) : all;
    document.getElementById('dmeta').textContent=
      rows.length+' word'+(rows.length===1?'':'s')+(t?' matching “'+q.trim()+'”':' in total');
    const list=document.getElementById('dlist');
    list.innerHTML='';
    rows.slice(0,600).forEach(d=>{
      const b=document.createElement('button');
      b.className='dentry'; b.type='button';
      b.style.setProperty('--dc',d.color);
      b.innerHTML='<span class="dfr">'+hl(d.fr,t)+'</span>'+
                  '<span class="dph">'+esc(d.ph)+'</span>'+
                  '<span class="den">'+hl(d.en,t)+'</span>'+
                  '<span class="dwh">'+esc([...d.where].slice(0,2).join(' · '))+'</span>';
      b.addEventListener('click',()=>{
        if(speakingEl===b && speechSynthesis.speaking){stopSpeech();return;}
        stopSpeech(); speak(d.fr,b);
      });
      list.appendChild(b);
    });
    if(rows.length>600){
      const n=document.createElement('div'); n.className='dmore';
      n.textContent='Showing the first 600 — keep typing to narrow it down.';
      list.appendChild(n);
    }
  };
  let t; inp.addEventListener('input',()=>{clr.hidden=!inp.value;clearTimeout(t);t=setTimeout(()=>paint(inp.value),120);});
  clr.addEventListener('click',()=>{inp.value='';clr.hidden=true;paint('');inp.focus();});
  paint('');
}
