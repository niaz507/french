cer – se marier – se connaître.", "kohm-play-TAY say TEE-truh duh PRESS", "Complete these (invented) press headlines with the reflexive verbs given."], ["1. Vanessa et le prince Henri SE SONT REVUS après un an de séparation.", "suh sohn ruh-VEW a-pray uh nan duh say-pa-ra-see-OHN", "Vanessa and Prince Henri saw each other again after a year apart."], ["2. Gina Lopez S'EST FIANCÉE avec un riche producteur de cinéma le 15 avril.", "set fee-ahn-SAY a-vek uhn reesh pro-dewk-TUR", "Gina Lopez got engaged to a rich film producer on 15 April."], ["3. Scandale à l'hôtel Hilton : Déborah Moore S'EST DÉSHABILLÉE en public !", "say day-za-bee-YAY ahn pew-BLEEK", "Scandal at the Hilton: Déborah Moore undressed in public!"], ["4. Nicolas Kilman et Tonia Croze SE SONT SÉPARÉS après deux ans de mariage.", "suh sohn say-pa-RAY a-pray duh zahn duh ma-ree-AHZH", "Nicolas Kilman and Tonia Croze split after two years of marriage."], ["5. Eleonore Martins S'EST MARIÉE avec un industriel américain.", "set ma-ree-AY a-vek uh nan-dew-stree-ELL a-may-ree-KAN", "Eleonore Martins married an American industrialist."], ["6. Arthur et Estelle SE SONT RENCONTRÉS pendant un concert de rock.", "suh sohn rahn-kohn-TRAY pahn-DAHN uhn kohn-SAIR duh ROK", "Arthur and Estelle met at a rock concert."]], "note": "These headlines are invented for the exercise, in the style of gossip-magazine press — not quotations from a real publication."}, {"name": "Leçon 3 — Ex. 13 : l'ordre des actions hier", "items": [["Dites dans quel ordre vous avez fait les actions suivantes, hier.", "deet dahn kel OR-druh voo za-vay fay lay zak-see-OHN swee-VAHNT, ee-AIR", "Say in what order you did the following actions yesterday."], ["Exemple : D'abord je me suis réveillée à 7 heures, puis je…", "da-BOR zhuh muh swee ray-vay-YAY a set UR, pwee zhuh", "the worked example"], ["se doucher – s'habiller – s'endormir – se déshabiller – se raser/se maquiller – se réveiller – se coucher – se coiffer – se lever", "suh doo-SHAY – sa-bee-YAY – sahn-dor-MEER – suh day-za-bee-YAY – suh ra-ZAY / suh ma-kee-YAY – suh ray-vay-YAY – suh koo-SHAY – suh kwa-FAY – suh luh-VAY", "to shower, get dressed, fall asleep, undress, shave/put on make-up, wake up, go to bed, do one's hair, get up"]]}, {"name": "Leçon 3 — Ex. 14 : le passé composé à la forme négative", "items": [["Complétez avec les verbes suivants à la forme négative : se déplacer – se maquiller – se saluer – se réveiller – se rencontrer – se marier – se revoir – se tourner.", "kohm-play-TAY … a lah form nay-ga-TEEV", "Complete with these verbs in the negative."], ["1. Il a reçu une invitation, mais IL NE S'EST PAS DÉPLACÉ.", "eel nuh say pah day-pla-SAY", "He got an invitation but didn't go."], ["2. Je suis en retard : JE NE ME SUIS PAS RÉVEILLÉ(E) ce matin !", "zhuh nuh muh swee pah ray-vay-YAY", "I'm late: I didn't wake up this morning!"], ["3. L'information est inexacte : nous NE NOUS SOMMES PAS RENCONTRÉS pour la 1re fois en 1996 mais en 1998.", "noo nuh noo som pah rahn-kohn-TRAY", "The information is wrong: we didn't meet for the first time in 1996, but in 1998."], ["4. Tu chantes très bien, pourquoi est-ce que tu NE T'ES PAS TOURNÉ(E) vers la chanson ?", "tew nuh tay pah toor-NAY vair lah shahn-SOHN", "You sing so well, why didn't you go into singing?"], ["5. Ils ne se parlent plus et ils NE SE SONT PAS SALUÉS à la soirée !", "eel nuh suh sohn pah sa-lew-AY", "They don't speak any more and didn't even greet each other at the party!"], ["6. Elle est moins jolie aujourd'hui, ELLE NE S'EST PAS MAQUILLÉE ce matin.", "el nuh say pah ma-kee-YAY", "She looks less pretty today, she didn't put on make-up this morning."], ["7. Pourquoi est-ce que vous NE VOUS ÊTES PAS MARIÉS à l'église, mais seulement à la mairie ?", "voo nuh voo zet pah ma-ree-AY a lay-GLEEZ", "Why didn't you marry in church, only at the town hall?"], ["8. On NE S'EST PAS REVUS après les vacances, mais on se téléphone de temps en temps.", "ohn nuh say pah ruh-VEW a-pray lay va-KAHNSS", "We haven't seen each other since the holidays, but we call sometimes."]]}, {"name": "Leçon 3 — Ex. 15 : décrire physiquement", "items": [["Complétez les descriptions avec les mots suivants. Faites les accords nécessaires.", "kohm-play-TAY lay des-kreep-see-OHN a-vek lay mo swee-VAHN", "Complete the descriptions with the words given, making agreements."], ["Les mots : yeux – est – roux – taille – allure – a – brun", "…", "the seven words to place"], ["1. Elle est de TAILLE moyenne.", "tigh mwa-YEN", "She's of average height."], ["2. Il a les cheveux ROUX.", "lay shuh-vuh ROO", "He has red hair."], ["3. Il EST brun.", "eel ay BRUHN", "He's dark-haired."], ["4. Elle a les YEUX marron.", "lay zyuh ma-ROHN", "She has brown eyes."], ["5. Elle A l'air fatigué.", "a lair fa-tee-GAY", "She looks tired."], ["6. Elle est ROUSSE.", "ROOSS", "She's a redhead."], ["7. Il a une ALLURE sportive.", "ewn a-LEUR spor-TEEV", "He has a sporty look."]]}, {"name": "Leçon 3 — Ex. 16 : évoquer des ressemblances", "items": [["Reformulez. (Plusieurs réponses sont parfois possibles.)", "ruh-for-mew-LAY", "Reformulate."], ["Exemple : Elle a les cheveux frisés comme son frère. → Ils ont les mêmes cheveux frisés.", "eel zohn lay mem shuh-vuh free-ZAY", "the worked example"], ["1. Avec ses yeux bleus, il ressemble à sa mère. → Il a les mêmes yeux bleus que sa mère.", "eel a lay mem zyuh BLUH kuh sa MAIR", "With his blue eyes, he looks like his mother."], ["2. Le père est grand et sa fille aussi. → Elle a la même taille que son père.", "el a lah mem tigh kuh sohn PAIR", "The father is tall and so is his daughter."], ["3. Ils se ressemblent vraiment. → Ils ont beaucoup de points communs / le même visage.", "eel zohn bo-KOO duh pwan ko-MUHN", "They really look alike."], ["4. Le frère et la sœur ont la peau très blanche. → Ils ont la même peau très blanche.", "eel zohn lah mem PO tray BLAHNSH", "The brother and sister both have very pale skin."], ["5. Elle est rousse comme son frère. → Ils ont les mêmes cheveux roux.", "eel zohn lay mem shuh-vuh ROO", "She's a redhead like her brother."]]}, {"name": "Leçon 3 — Ex. 17 : identifier quelqu'un", "items": [["Complétez avec c'est, il est, elle est, il a, elle a. Puis identifiez chaque célébrité.", "kohm-play-TAY a-vek SAY, ee-LAY, el-LAY, ee-LAH, el-LAH", "Complete then identify each celebrity."], ["1. C'EST une jeune femme timide, ELLE A les cheveux longs et raides comme sa mère. Comme elle, ELLE EST actrice et chanteuse.", "… el a lay shuh-vuh LOHN ay RED", "A shy young woman with long straight hair like her mother; like her, an actress and singer. — Charlotte Gainsbourg"], ["2. ELLE A plus de 60 ans, C'EST une actrice, ELLE EST très célèbre, ELLE EST blonde.", "el a plew duh swa-SAHNT AHN", "Over 60, an actress, very famous, blonde. — Catherine Deneuve"], ["3. C'EST le fils d'un chanteur, IL EST lui-même chanteur. IL A le regard de son père et, comme lui, IL EST beaucoup de charme.", "say luh feess duhn shahn-TUR, ee-lay lwee-mem shahn-TUR", "The son of a singer, himself a singer. Has his father's look and, like him, plenty of charm. — Thomas Dutronc"], ["4. C'EST un chanteur comme son père, IL A entre 45 et 50 ans, C'EST une demi-sœur, ELLE EST actrice.", "say uhn shahn-TUR kom sohn PAIR, ee-la ahn-truh ka-rahnt-SANK ay san-KAHNT AHN", "A singer like his father, between 45 and 50 — David Hallyday, whose half-sister is an actress"], ["5. C'EST un bébé né le 20 mai 2011, C'EST le fils d'un acteur et d'une actrice française, IL A le sourire de sa jolie maman.", "say uhn bay-BAY nay luh van MAY duh meel ohnz", "A baby born on 20 May 2011, son of an actor and a French actress, with his pretty mum's smile. — little Marcel, son of Guillaume Canet and Marion Cotillard"]], "note": "Five celebrity riddles built from the lesson's own material, using <em>c'est</em> for identifying and <em>il/elle est</em> for professions and adjectives, exactly as the Point Langue on p.109 sets out."}]}, {"id": "ae-d5-delf", "label": "Dossier 5 · Épreuve DELF A1", "name": "L'examen", "summary": "Page 114, complete. Both listening exercises with all their options, the actor casting form, and the party-invitation writing task.", "art": null, "bookpages": ["p114"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Two listening exercises, tracks 138 and 139.", "tracks": [{"n": 138, "label": "p.114 exercice 1 — compréhension de l'oral (12 points)"}, {"n": 139, "label": "p.114 exercice 2 — compréhension de l'oral (13 points)"}]}, {"name": "Page 114 — Compréhension de l'oral, exercice 1 (12 points)", "items": [["Épreuve DELF A1", "ay-PRUV DELF", "DELF A1 exam paper"], ["Compréhension de l'oral — 25 points", "kohm-pray-ahn-see-OHN duh lo-RAL", "Listening comprehension — 25 points"], ["Exercice 1 — 12 points", "eg-zair-SEESS UHN", "Exercise 1"], ["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN … duh FWAH", "Read the questions. Listen twice then answer."], ["1. L'homme et la femme : a. sont amis. b. ne se connaissent pas. c. sont collègues. (1,5 point)", "lom ay lah fam sohn ta-MEE", "The man and woman are: friends / strangers / colleagues."], ["2. Quelle est la profession de l'homme ? (1,5 point)", "kel ay lah pro-fay-see-OHN duh LOM", "What is the man's profession?"], ["3. La femme part en vacances quel mois ? (1,5 point)", "lah fam par ahn va-KAHNSS kel MWAH", "Which month is the woman going on holiday?"], ["4. Pendant l'année, elle habite où ? (1,5 point)", "pahn-DAHN la-NAY, el a-BEET OO", "Where does she live during the year?"], ["5. Pour les vacances, elle va souvent : a. à la montagne. b. à la mer. c. à la campagne. (1,5 point)", "poor lay va-KAHNSS, el va soo-VAHN", "For holidays she often goes to: mountains / seaside / countryside."], ["6. Elle est : a. célibataire. b. mariée sans enfant. c. mère de famille. (1,5 point)", "el ay say-lee-ba-TAIR", "She is: single / married without children / a mother."], ["7. Elle est allée dans quels pays ? (3 points)", "el ay ta-LAY dahn kel pay-EE", "Which countries has she visited?"]]}, {"name": "Page 114 — Compréhension de l'oral, exercice 2 (13 points)", "items": [["Exercice 2 — 13 points", "eg-zair-SEESS DUH", "Exercise 2"], ["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN", "Read the questions. Listen twice then answer."], ["1. L'animateur radio : a. présente le programme télévisé de la journée. b. propose une sélection d'émissions de télévision pour la soirée. c. annonce le programme télévisé de la semaine. (2 points)", "la-nee-ma-TUR ra-dee-O", "The radio presenter is: giving the day's TV listings / suggesting evening viewing / announcing the week's schedule."], ["2. Il parle de quelles chaînes ? Choisissez. (4 points)", "eel parl duh kel SHEN", "Which channels does he mention? Choose."], ["a. TF1 · b. France 2 · c. France 3 · d. Canal + · e. TV5 Monde · f. M6 · g. Arte", "…", "the seven channel options to choose from"], ["3. Prête-moi ta main est un film : a. romantique. b. comique. c. dramatique. (2 points)", "pret-mwah ta MAN … uhn feelm ro-mahn-TEEK", "'Prête-moi ta main' is a film that is: romantic / comic / dramatic."], ["4. L'animateur cite combien de comédiens ? (1,5 point)", "la-nee-ma-TUR seet kohm-bee-AN duh ko-may-dee-AN", "How many actors does the presenter name?"], ["5. L'émission Théma commence : a. avant le film. b. à la même heure que le film. c. après le film. (2 points)", "lay-mee-see-OHN tay-MAH ko-MAHNSS", "The programme Théma starts: before / at the same time as / after the film."], ["6. Quel est le thème de l'émission Théma ? (1,5 point)", "kel ay luh TEM duh lay-mee-see-OHN tay-MAH", "What is the theme of the programme Théma?"]], "note": "Prête-moi ta main is a real 2006 French romantic comedy; it's named here only as the subject of an exam question, not quoted from."}, {"name": "Page 114 — Production écrite, exercice 1 (10 points)", "items": [["Production écrite — 25 points", "pro-dewk-see-OHN ay-KREET", "Written production — 25 points"], ["Exercice 1 — 10 points", "eg-zair-SEESS UHN", "Exercise 1"], ["Vous voulez être comédien(ne), complétez le formulaire.", "voo voo-lay ZET ko-may-dee-AN (EN)", "You want to be an actor; fill in the form."], ["Recherche comédiens/comédiennes pour petits rôles dans un film.", "ruh-SHAIRSH ko-may-dee-AN … poor puh-tee ROL dahn zuhn FEELM", "Actors wanted for small roles in a film."], ["Complétez et envoyez le formulaire à : FILMS & CO, 13 rue de la Grande Comédie, 75018 Paris", "kohm-play-TAY ay ahn-vwa-YAY luh for-mew-LAIR", "Complete and send the form to: FILMS & CO, 13 rue de la Grande Comédie, 75018 Paris"], ["Nom : / Prénom :", "NOHN / pray-NOHN", "Surname / First name"], ["Sexe : / Âge :", "SEKS / AHZH", "Sex / Age"], ["Profession : / Ville :", "pro-fay-see-OHN / VEEL", "Occupation / Town"], ["Mail :", "MAIL", "Email"], ["Tél. :", "tay-lay-FON", "Phone"], ["Brève description (yeux, cheveux, taille) :", "brev des-kreep-see-OHN (zyuh, shuh-VUH, TIGH)", "Brief description (eyes, hair, height)"]], "cols": "two"}, {"name": "Page 114 — Production écrite, exercice 2 (15 points)", "items": [["Exercice 2 — 15 points", "eg-zair-SEESS DUH", "Exercise 2"], ["Vous organisez une fête. Écrivez un mail pour inviter vos amis :", "voo zor-ga-nee-ZAY ewn FET. ay-kree-VAY uh mail poor an-vee-TAY vo za-MEE", "You're throwing a party. Write an email inviting your friends:"], ["expliquez où, quand et pour quelle occasion vous organisez cette fête.", "eks-plee-KAY oo, kahn ay poor kel o-ka-zee-OHN", "explain where, when and for what occasion."], ["Demandez une réponse à votre invitation.", "duh-mahn-DAY ewn ray-POHNSS a VOT-ruh an-vee-ta-see-OHN", "Ask for a reply to your invitation."], ["40 à 50 mots", "ka-RAHNT a san-KAHNT MO", "40 to 50 words"]], "note": "This final task draws on the whole dossier: the invitation formulas from Leçon 2, the imperative for instructions, and the vocabulary of celebrating from Leçon 1."}, {"name": "Le vo hing in the main book.", "lessons": [{"id": "ca-d0", "label": "Dossier 0", "name": "Découverte", "summary": "Pages 4–7. Languages, nationalities, numbers, the gender of countries, être and s'appeler, and classroom language — with every exercise worked through.", "art": null, "bookpages": ["c004", "c005", "c006", "c007"], "groups": [{"name": "Les enregistrements", "items": [], "note": "Cahier audio, tracks 1 and 2.", "tracks": [{"n": 1, "label": "Cahier p.4 act. 3 — le numéro des portes"}, {"n": 2, "label": "Cahier p.7 act. 12 — les fiches des étudiants"}]}, {"name": "Ex. 1 — dans quelle langue ?", "note": "The word <em>voyage</em> in six languages. You answer with <strong>C'est écrit en…</strong>", "items": [["Exemple : voyage → C'est écrit en français.", "set ay-KREE ahn frahn-SAY", "It's written in French."], ["1. travel → C'est écrit en anglais.", "… ah nahn-GLAY", "English"], ["2. viagem → C'est écrit en portugais.", "… ahn por-tew-GAY", "Portuguese"], ["3. viaggio → C'est écrit en italien.", "… ah nee-tal-YAN", "Italian"], ["4. путешествие → C'est écrit en russe.", "… ahn REWSS", "Russian"], ["5. سفر → C'est écrit en arabe.", "… ah na-RAHB", "Arabic"], ["6. 旅行 → C'est écrit en chinois.", "… ahn shee-NWAH", "Chinese"]]}, {"name": "Ex. 2 — la nationalité de chaque diplomate", "note": "All masculine here, because <em>un diplomate</em> is masculine.", "items": [["Exemple : MAROC → C'est un diplomate marocain.", "set uhn dee-plo-MAT ma-ro-KAN", "Moroccan"], ["1. ALLEMAGNE → C'est un diplomate allemand.", "… al-MAHN", "German"], ["2. CHINE → C'est un diplomate chinois.", "… shee-NWAH", "Chinese"], ["3. ESPAGNE → C'est un diplomate espagnol.", "… es-pan-YOL", "Spanish"], ["4. ITALIE → C'est un diplomate italien.", "… ee-tal-YAN", "Italian"]]}, {"name": "Ex. 3 — le numéro des portes", "note": "An audio exercise — piste 1. The gate numbers come from the recording; the phrase pattern is here so you can write your answers in.", "items": [["Exemple : Amsterdam : embarquement porte 15.", "ahm-bark-MAHN port kanz", "Amsterdam: boarding gate 15."], ["Chicago : embarquement porte…", "shee-ka-GO : ahm-bark-MAHN PORT", "boarding gate"], ["Sydney / Lyon / Kyoto / Londres / Dubaï", "seed-NAY / lee-OHN / kee-o-TO / LOHN-druh / doo-ba-EE", "the six destinations"], ["l'embarquement", "lahm-bark-MAHN", "boarding"], ["une porte", "ewn PORT", "a gate, a door"]]}, {"name": "Ex. 4 — le total en chiffres et en lettres", "note": "Add up, then write the number out. The example: 20 + 20 + 10 + 3 = 53 (cinquante-trois euros).", "items": [["1. 5 + 5 + 8 = 18 € — dix-huit euros", "dee-zweet uh-RO", "18"], ["2. 20 + 10 + 5 = 35 € — trente-cinq euros", "trahnt-sank uh-RO", "35"], ["3. 20 + 10 + 10 + 2 = 42 € — quarante-deux euros", "ka-rahnt-duh zuh-RO", "42"], ["4. 20 + 20 + 20 + 5 + 2 = 67 € — soixante-sept euros", "swa-sahnt-set uh-RO", "67"], ["5. 24 + 17 + 9 + 1 = 51 € — cinquante et un euros", "sank-ahnt-ay-uh nuh-RO", "51"]]}, {"name": "Ex. 5 — la nationalité des passagers", "note": "Vol AF 1426, New York–Paris. <strong>mademoiselle</strong> and <strong>madame</strong> take the feminine form, <strong>monsieur</strong> the masculine.", "cols": "two", "items": [["mademoiselle Patricia Trace → canadienne", "ka-na-dee-EN", "Canadian (f)"], ["monsieur Franz Muller → autrichien", "oh-tree-shee-AN", "Austrian (m)"], ["monsieur Michal Kieslowski → polonais", "po-lo-NAY", "Polish (m)"], ["madame Sofia Volgorof → russe", "REWSS", "Russian (f) — no change"], ["monsieur Mathias Lorenz → allemand", "al-MAHN", "German (m)"], ["mademoiselle Suzy Parker → américaine", "a-may-ree-KEN", "American (f)"], ["madame Pierrette Legrand → française", "frahn-SEZ", "French (f)"], ["monsieur Yong Qiu → chinois", "shee-NWAH", "Chinese (m)"]]}, {"name": "Ex. 6 — le genre des noms de pays", "note": "Finale results, completed with <em>le, la, l'</em> or <em>les</em>.", "items": [["Exemple : Finale : L'Italie contre la France.", "lee-ta-LEE KOHN-truh lah FRAHNSS", "Italy against France"], ["1. Le Mexique contre l'Angleterre.", "luh mek-SEEK KOHN-truh lahn-gluh-TAIR", "Mexico v England"], ["2. L'Espagne contre les Pays-Bas.", "les-PAN-yuh KOHN-truh lay pay-ee-BAH", "Spain v the Netherlands"], ["3. Le Maroc contre la Belgique.", "luh ma-ROK KOHN-truh lah bel-ZHEEK", "Morocco v Belgium"], ["4. La Corée contre le Venezuela.", "lah ko-RAY KOHN-truh luh vay-nay-zew-ay-LAH", "Korea v Venezuela"], ["5. L'Irlande contre les États-Unis.", "leer-LAHND KOHN-truh lay zay-ta-zew-NEE", "Ireland v the USA"], ["6. L'Argentine contre le Mozambique.", "lar-zhahn-TEEN KOHN-truh luh mo-zahm-BEEK", "Argentina v Mozambique"], ["contre", "KOHN-truh", "against"]]}, {"name": "Ex. 7 — quels pays sont représentés ?", "note": "From a nationality back to the country name, with its article.", "items": [["Exemple : André : canadien → le Canada", "luh ka-na-DAH", "Canada"], ["1. Farida : marocaine → le Maroc", "luh ma-ROK", "Morocco"], ["2. Gene : philippin → les Philippines", "lay fee-lee-PEEN", "the Philippines"], ["3. Keiko : japonaise → le Japon", "luh zha-POHN", "Japan"], ["4. Keyvan : iranien → l'Iran", "lee-RAHN", "Iran"], ["5. Melina : grecque → la Grèce", "lah GRESS", "Greece"], ["6. Soren : danois → le Danemark", "luh dan-MARK", "Denmark"], ["7. Maria : italienne → l'Italie", "lee-ta-LEE", "Italy"], ["Cours de français — débutants", "koor duh frahn-SAY — day-bew-TAHN", "French course — beginners"]]}, {"name": "Ex. 8 — je, tu, il, nous, vous, ils", "note": "Dialogue 1 and 2 completed in full.", "items": [["— Bonjour, je m'appelle Marco Ferrero, je suis italien. Et vous ? Vous êtes ?", "zhuh ma-PELL … zhuh swee zee-tal-YAN … voo ZET", "Hello, my name is Marco Ferrero, I'm Italian. And you?"], ["— Moi, je m'appelle Sonia Pages, je suis espagnole. Et voici mes collègues, monsieur et madame Da Silva. Ils sont brésiliens.", "… zhuh swee zes-pan-YOL … eel sohn bray-zeel-YAN", "Me, I'm Sonia Pages, I'm Spanish. And here are my colleagues — they're Brazilian."], ["— Ah, vous êtes brésiliens ! Alors vous parlez portugais !", "a, voo ZET bray-zeel-YAN ! a-LOR voo par-LAY por-tew-GAY", "Ah, you're Brazilian! So you speak Portuguese!"], ["— Tu t'appelles Helena, c'est ça ?", "tew ta-PELL ay-lay-NAH, say SA", "Your name is Helena, is that right?"], ["— Non, je m'appelle Tania. Et voici Helena. Nous sommes russes. Et Boris aussi, il est russe comme nous.", "… noo som REWSS … eel ay REWSS kom NOO", "No, I'm Tania. This is Helena. We're Russian. Boris too — he's Russian like us."]]}, {"name": "Ex. 9 — être ou s'appeler", "note": "Watch which one each blank needs: a <strong>name</strong> takes <em>s'appeler</em>, a <strong>nationality</strong> takes <em>être</em>.", "items": [["1. — Bonjour, je m'appelle Elena Gravas, je suis grecque. Et vous ?", "zhuh ma-PELL … zhuh swee GREK", "I'm Elena Gravas, I'm Greek."], ["— Moi, je suis japonaise. Je m'appelle Yoko Mitsuko.", "zhuh swee zha-po-NEZ. zhuh ma-PELL", "I'm Japanese. My name is Yoko Mitsuko."], ["2. — Nous, nous sommes belges. Nous nous appelons Paul et Martin.", "noo som BELZH. noo noo za-play-OHN", "We're Belgian. Our names are Paul and Martin."], ["— Et Marc et Laurence sont belges aussi ? — Non, ils sont suisses.", "… sohn BELZH oh-SEE ? — nohn, eel sohn SWEESS", "And are Marc and Laurence Belgian too? — No, they're Swiss."], ["3. — Qui est-ce ? — C'est le pilote de l'Airbus A380. Il s'appelle Thierry Morand, il est français.", "kee ESS ? … eel sa-PELL … eel ay frahn-SAY", "Who is it? — The pilot of the A380. His name is Thierry Morand, he's French."], ["4. — Je suis américaine, et toi, tu es française ? — Oui, je suis française.", "zhuh swee za-may-ree-KEN … tew ay frahn-SEZ", "I'm American, and you, are you French? — Yes, I am."]]}, {"name": "Ex. 10 — cochez la phrase correcte", "note": "<strong>1 → b</strong> (spelling out a first name is the letters, not the name) · <strong>2 → c</strong> (<em>je parle anglais</em> is a language, <em>je suis anglais</em> is a nationality) · <strong>3 → b</strong> (that's the one that actually asks the name).", "items": [["Pour épeler le prénom : E-L-I-S-A-B-E-T-H.", "ay-play luh pray-NOHN", "To spell out the first name."], ["Pour dire la nationalité : Je suis anglais.", "poor deer lah na-see-o-na-lee-TAY", "To say your nationality."], ["Pour demander le nom : Vous vous appelez comment ?", "poor duh-mahn-DAY luh NOHN", "To ask someone's name."]]}, {"name": "Ex. 11 — qui parle dans la classe ?", "note": "<strong>Le professeur :</strong> 1, 4, 6, 7 — these are instructions. <strong>Les étudiants :</strong> 2, 3, 5, 8, 9, 10 — questions and admissions. Some, like <em>Comment ça s'écrit ?</em>, can come from either side.", "cols": "two", "items": [["Écoutez le dialogue.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue. — professeur"], ["Comment on dit travel en français ?", "ko-mahn ohn DEE … ahn frahn-SAY", "How do you say 'travel' in French? — étudiant"], ["Comment ça s'écrit ?", "ko-mahn sa say-KREE", "How is it spelled? — either"], ["Travaillez par deux.", "tra-va-YAY par DUH", "Work in pairs. — professeur"], ["Comment ça se prononce ?", "ko-mahn sa suh pro-NONSS", "How is it pronounced? — étudiant"], ["Soulignez les questions.", "soo-leen-YAY lay kes-tee-OHN", "Underline the questions. — professeur"], ["Répétez la phrase.", "ray-pay-TAY lah FRAZ", "Repeat the sentence. — professeur"], ["Je ne comprends pas.", "zhuh nuh kohm-PRAHN pah", "I don't understand. — étudiant"], ["C'est à quelle page ?", "set a kel PAHZH", "What page is it? — étudiant"], ["Je ne sais pas.", "zhuh nuh say PAH", "I don't know. — étudiant"]]}, {"name": "Ex. 12 — En situation : l'identité", "note": "Audio, piste 2. You fill in three student cards from the recording.", "items": [["Écoutez et complétez les fiches des étudiants.", "ay-koo-TAY ay kohm-play-TAY lay FEESH day zay-tew-dee-AHN", "Listen and fill in the student cards."], ["une fiche", "ewn FEESH", "a card, a form"], ["Prénom :", "pray-NOHN", "First name:"], ["Nationalité :", "na-see-o-na-lee-TAY", "Nationality:"]]}, {"name": "Le vocabulaire du cahier", "cols": "two", "items": [["du côté du lexique", "dew ko-TAY dew lek-SEEK", "the vocabulary side"], ["du côté de la grammaire", "dew ko-TAY duh lah gra-MAIR", "the grammar side"], ["du côté de la communication", "dew ko-TAY duh lah ko-mew-nee-ka-see-OHN", "the communication side"], ["en situation", "ahn see-tew-a-see-OHN", "in context"], ["un diplomate", "uhn dee-plo-MAT", "a diplomat"], ["un passager", "uhn pa-sa-ZHAY", "a passenger"], ["un vol", "uhn VOL", "a flight"], ["un pilote", "uhn pee-LOT", "a pilot"], ["un collègue", "uhn ko-LEG", "a colleague"], ["un débutant", "uhn day-bew-TAHN", "a beginner"], ["une finale", "ewn fee-NAL", "a final (sport)"], ["en chiffres / en lettres", "ahn SHEE-fruh / ahn LET-ruh", "in figures / in words"], ["le total", "luh to-TAL", "the total"], ["cocher", "ko-SHAY", "to tick"], ["compléter", "kohm-play-TAY", "to fill in"], ["observer", "ob-sair-VAY", "to look at"], ["c'est ça ?", "say SA", "is that right?"], ["alors", "a-LOR", "so, then"], ["comme nous", "kom NOO", "like us"], ["aussi", "oh-SEE", "too, also"]]}]}, {"id": "ca-d1-companion", "label": "Dossier 1 — Companion", "name": "Vocabulaire & grammaire", "summary": "A theme-by-theme companion to Cahier Dossier 1 (Leçons 1–3) — vocabulary, grammar points and communication patterns explained in original wording, not transcribed from the workbook's exercises.", "art": null, "bookpages": null, "groups": [{"name": "Vocabulaire — les personnes et l'identité", "items": [["une dame", "ewn DAM", "a lady"], ["un monsieur", "uhn muh-SYUH", "a gentleman"], ["un homme / une femme", "uh NOM / ewn FAM", "a man / a woman"], ["une fille / un garçon", "ewn FEE-yuh / uhn gar-SOHN", "a girl / a boy"], ["un jeune homme / une jeune fille", "uhn zhuh NOM / ewn zhuhn FEE-yuh", "a young man / a young woman"], ["une pièce d'identité", "ewn pee-ess dee-dahn-tee-TAY", "a piece of ID"], ["une carte nationale d'identité", "ewn kart na-see-o-NAL dee-dahn-tee-TAY", "a national ID card"], ["un formulaire d'inscription", "uhn for-mew-LAIR dan-skreep-see-OHN", "a registration form"], ["les coordonnées", "lay ko-or-do-NAY", "contact details"], ["le nom de famille / le prénom", "luh nohn duh fa-MEE / luh pray-NOHN", "surname / first name"], ["la date de naissance", "lah dat duh nay-SAHNSS", "date of birth"], ["la nationalité", "lah na-see-o-na-lee-TAY", "nationality"], ["l'adresse mail", "la-DRESS mail", "email address"], ["le numéro de portable", "luh new-may-RO duh por-TAH-bluh", "mobile number"], ["les langues parlées", "lay lahng par-LAY", "languages spoken"]], "cols": "two"}, {"name": "Grammaire — les pronoms, l'identité et être/avoir", "items": [["Je, tu, vous — le bon pronom selon la relation.", "zhuh, tew, VOO", "I, you (familiar), you (polite/plural) — chosen by relationship"], ["Je me présente : je m'appelle… — the formula for introducing yourself.", "zhuh muh pray-ZAHNT", "Let me introduce myself…"], ["mon / ma / mes (informal, 'my') vs votre / vos (formal, 'your').", "mohn/ma/may … VOT-ruh/vo", "the possessive pair used throughout this lesson"], ["Être : je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.", "zhuh SWEE … eel SOHN", "the full present tense"], ["Avoir : j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.", "ZHAY … eel ZOHN", "the full present tense"], ["Ne… pas wraps the verb: je ne suis pas, elle n'a pas.", "nuh … pah", "the negation frame"]], "note": "A pattern worth noticing in this lesson: être + nationality/profession has no article (je suis étudiant), but avoir + age always needs 'ans' (j'ai vingt ans). My own examples: <em>Je suis architecte, j'ai trente ans.</em> — <em>Nous ne sommes pas étrangers, nous sommes français.</em>"}, {"name": "Vocabulaire — objets, prix et mois", "items": [["un ordinateur (portable)", "uh nor-dee-na-TUR (por-TAH-bluh)", "a (laptop) computer"], ["un appareil photo", "uh na-pa-RAY fo-TO", "a camera"], ["une veste", "ewn VEST", "a jacket"], ["une moto", "ewn mo-TO", "a motorbike"], ["un téléviseur / une télé", "uhn tay-lay-vee-ZUR / ewn tay-LAY", "a television"], ["une armoire", "ewn ar-MWAHR", "a wardrobe"], ["une étiquette (de prix)", "ewn ay-tee-KETT (duh PREE)", "a price tag"], ["janvier, février, mars, avril, mai, juin", "zhahn-vee-AY, fay-vree-AY, MARSS, a-VREEL, MAY, ZHWAN", "the first six months"], ["juillet, août, septembre, octobre, novembre, décembre", "zhwee-YAY, OOT, sep-TAHM-bruh, ok-TO-bruh, no-VAHM-bruh, day-SAHM-bruh", "the last six months"]], "note": "Prices in this lesson are read as whole numbers of euros plus centimes, e.g. <em>quatre-vingt-trois euros, vingt-cinq</em> for 83,25 €.", "cols": "two"}, {"name": "Grammaire — l'article indéfini et l'adjectif interrogatif quel", "items": [["un / une / des — the indefinite article agrees with the noun's gender and number.", "UHN / EWN / DAY", "a / a / some"], ["My own examples: un formulaire, une carte, des photos — un étudiant, une université, des livres.", "uhn for-mew-LAIR, ewn kart, day fo-TO", "a form, a card, photos"], ["Quel / quelle / quels / quelles — all four spellings are pronounced 'kel'; the spelling follows the noun.", "KEL", "which / what"], ["Quel est votre nom ? · Quelle est votre nationalité ? · Quels sont vos numéros ? · Quelles sont vos coordonnées ?", "kel ay VOT-ruh nohn … kel sohn vo new-may-RO", "the four question forms in this lesson"]], "note": "This is the same rule covered in the main coursebook's Leçon 2, revisited here with a registration-form and phone-directory context instead."}, {"name": "Communication — donner son numéro et ses coordonnées", "items": [["Quel est votre numéro de téléphone ? → C'est le… / Mon numéro est le…", "kel ay VOT-ruh new-may-RO … say luh … / mohn new-may-RO ay luh", "the standard question-and-answer pattern"], ["French landline area codes: 01 Paris/Île-de-France, 02 northwest, 03 northeast, 04 southeast, 05 southwest.", "zay-RO UHN … zay-RO SANK", "the five regional prefixes, reused here with a new set of cities (Lille, Bordeaux, Nice, Brest)"], ["Spelling an email aloud needs arobase (@), point (.), tiret (-), tiret bas (_).", "a-ro-BAHZ, PWAN, tee-RAY, tee-ray-BAH", "the punctuation words needed to dictate an address"]]}, {"name": "Vocabulaire — événements et sites célèbres", "items": [["la tour Eiffel", "lah toor ay-FELL", "the Eiffel Tower"], ["le musée du Louvre", "luh mew-ZAY dew LOO-vruh", "the Louvre museum"], ["la fête de la Musique", "lah fet duh lah mew-ZEEK", "the Music Festival (21 June)"], ["la fête du 14 juillet / le feu d'artifice", "lah fet dew ka-TORZ zhwee-YAY / luh fuh dar-tee-FEESS", "Bastille Day / the fireworks"], ["un site célèbre", "uhn seet say-LEB-ruh", "a famous site"]]}, {"name": "Grammaire — pays, verbes en -er, être/avoir en contexte", "items": [["Country prepositions revisited: né à New York, en/au/aux + country of residence.", "nay a … ahn/oh/oh zay", "born in a city, living in a country"], ["My own examples following the pattern: Steve est né aux États-Unis mais il vit en France. — Maria est née en Pologne, elle habite en Espagne.", "stev ay nay oh zay-ta-zew-NEE … ma-REE-a ay nay ahn po-LON-yuh", "American-born Steve lives in France; Polish-born Maria lives in Spain"], ["-ER verbs for talking about passions: adorer, aimer, désirer, jouer (de), rêver (de), travailler, habiter, étudier.", "a-do-RAY, ay-MAY, day-zee-RAY, zhoo-AY (duh), REV (duh)", "the verb family this lesson draws on"], ["Être and avoir together build a full self-introduction: je suis…, j'ai…, j'habite…, je travaille…", "zhuh swee … zhay … zha-BEET … zhuh tra-VIGH", "the pattern for describing someone fully"]]}, {"name": "Communication — passions, rêves et se présenter en ligne", "items": [["Exprimer une passion : j'adore… / je joue de… / mon métier, c'est ma passion.", "zha-DOR … zhuh zhoo duh … mohn may-tee-AY, say ma pa-see-OHN", "loving something, playing an instrument, a job as a passion"], ["Exprimer un rêve : je rêve de + infinitif / mon rêve, c'est de + infinitif.", "zhuh REV duh … mohn rev, say duh", "I dream of… / my dream is to…"], ["Structuring a self-introduction message for a dating/contacts site: 1) who you are, 2) your studies and passions, 3) what you're looking for.", "…", "the three-part structure this lesson's model message follows"], ["Bonjour, je me présente… / À bientôt.", "bohn-ZHOOR, zhuh muh pray-ZAHNT … a bee-an-TOH", "standard opening and closing for this kind of message"]]}]}]}, {"id": "grammaire", "name": "Grammaire Progressive", "short": "Grammaire", "color": "#3F8F63", "blurb": "Grammaire Progressive du Français A0–A1, chapters 1 to 14 — the explanation page, the exercises, and the book pages themselves.", "lessons": [{"id": "gr-1", "label": "Chapitre 1", "name": "Vous êtes japonais ?", "summary": "La présentation. Je suis + name, nationality, job — and why French drops the article before a profession.", "art": null, "groups": [{"name": "La présentation", "note": "Two rules this chapter rests on. <strong>Always use je suis or je m'appelle</strong> — never a bare name. And <strong>no article before a profession</strong>: <em>je suis médecin</em>, never <em>je suis un médecin</em>. That one catches every English speaker.", "items": [["Bonjour, je suis Kenji Takashi.", "bohn-ZHOOR, zhuh swee", "Hello, I'm Kenji Takashi."], ["Je m'appelle Kenji Takashi.", "zhuh ma-PELL", "My name is Kenji Takashi."], ["Vous êtes japonais ? — Oui, je suis japonais.", "voo-ZET zha-po-NAY", "Are you Japanese? — Yes, I am."], ["Vous êtes médecin ? — Non, je suis chimiste.", "voo-ZET mayd-SAN — nohn, zhuh swee shee-MEEST", "Are you a doctor? — No, I'm a chemist."], ["Je suis français. Je suis professeur.", "zhuh swee frahn-SAY. zhuh swee pro-fess-UR", "I'm French. I'm a teacher."], ["Jean, vous êtes professeur ou étudiant ?", "zhahn, voo-ZET pro-fess-UR oo zay-tew-dee-AHN", "Jean, are you a teacher or a student?"], ["Kenji, vous êtes médecin ou chimiste ?", "voo-ZET mayd-SAN oo shee-MEEST", "Kenji, are you a doctor or a chemist?"], ["Bip, vous êtes astronaute ou professeur ?", "voo-ZET zas-tro-NOTE oo pro-fess-UR", "Bip, are you an astronaut or a teacher?"]]}], "bookpages": ["g008", "g009"]}, {"id": "gr-2", "label": "Chapitre 2", "name": "Il est grand. Elle est grande.", "summary": "Masculine to feminine. Add -e and the silent consonant wakes up — that's how you hear gender.", "art": "agreement", "groups": [{"name": "Masculin → féminin", "cols": "two", "note": "<strong>Féminin = masculin + -e.</strong> The point of that -e: a silent final consonant becomes audible, so you can <em>hear</em> the gender. Words already ending in -e (jeune, russe, calme) don't change.", "items": [["français → française", "frahn-SAY → frahn-SEZ", "French"], ["portugais → portugaise", "por-tew-GAY → por-tew-GEZ", "Portuguese"], ["suédois → suédoise", "sway-DWAH → sway-DWAZ", "Swedish"], ["chinois → chinoise", "shee-NWAH → shee-NWAZ", "Chinese"], ["mexicain → mexicaine", "mek-see-KAN → mek-see-KEN", "Mexican"], ["américain → américaine", "a-may-ree-KAN → a-may-ree-KEN", "American"], ["autrichien → autrichienne", "oh-tree-shee-AN → oh-tree-shee-EN", "Austrian"], ["canadien → canadienne", "ka-na-dee-AN → ka-na-dee-EN", "Canadian"], ["coréen → coréenne", "ko-ray-AN → ko-ray-EN", "Korean"], ["allemand → allemande", "al-MAHN → al-MAHND", "German"], ["espagnol → espagnole", "es-pan-YOL → es-pan-YOL", "Spanish"], ["russe → russe", "rewss → rewss", "Russian — identical"], ["grec → grecque", "grek → grek", "Greek — irregular"], ["turc → turque", "tewrk → tewrk", "Turkish — irregular"], ["étudiant → étudiante", "ay-tew-dee-AHN → ay-tew-dee-AHNT", "student"], ["grand → grande", "GRAHN → GRAHND", "tall"], ["blond → blonde", "BLOHN → BLOHND", "blond"], ["marié → mariée", "ma-ree-AY → ma-ree-AY", "married"], ["petit → petite", "puh-TEE → puh-TEET", "small"], ["vert → verte", "VAIR → VAIRT", "green"], ["amusant → amusante", "a-mew-ZAHN → a-mew-ZAHNT", "funny"], ["intelligent → intelligente", "an-tel-ee-ZHAHN → an-tel-ee-ZHAHNT", "intelligent"], ["souriant → souriante", "soo-ree-AHN → soo-ree-AHNT", "smiling"], ["jeune → jeune", "ZHUHN → ZHUHN", "young — no change"]]}, {"name": "Les autres terminaisons", "cols": "two", "note": "<strong>-on → -onne</strong> · <strong>-er → -ère</strong> · <strong>-eur / -eux → -euse</strong> · <strong>-teur → -trice</strong> for most professions.<br><br>One exception: <strong>chanteur → chanteuse</strong>, not chantrice. And some jobs never change: <strong>professeur, médecin, écrivain, auteur</strong> stay identical — though professeure, écrivaine and auteure are increasingly used.", "items": [["bon → bonne", "bohn → bun", "good"], ["breton → bretonne", "bruh-TOHN → bruh-TUN", "Breton"], ["mignon → mignonne", "meen-YOHN → meen-YUN", "cute"], ["étranger → étrangère", "ay-trahn-ZHAY → ay-trahn-ZHAIR", "foreign"], ["boulanger → boulangère", "boo-lahn-ZHAY → boo-lahn-ZHAIR", "baker"], ["infirmier → infirmière", "an-feer-mee-AY → an-feer-mee-AIR", "nurse"], ["poissonnier → poissonnière", "pwa-son-YAY → pwa-son-YAIR", "fishmonger"], ["serveur → serveuse", "sair-VUR → sair-VUZ", "waiter"], ["danseur → danseuse", "dahn-SUR → dahn-SUHZ", "dancer"], ["menteur → menteuse", "mahn-TUR → mahn-TUZ", "liar"], ["heureux → heureuse", "uh-RUH → uh-RUZ", "happy"], ["acteur → actrice", "ak-TUR → ak-TREESS", "actor"], ["instituteur → institutrice", "an-stee-tew-TUR → an-stee-tew-TREESS", "primary teacher"], ["présentateur → présentatrice", "pray-zahn-ta-TUR → pray-zahn-ta-TREESS", "presenter"], ["chanteur → chanteuse", "shahn-TUR → shahn-TUHZ", "singer — the exception"], ["professeur → professeur", "pro-fess-UR", "teacher — unchanged"], ["médecin → médecin", "mayd-SAN", "doctor — unchanged"], ["beau → belle", "BO → BELL", "beautiful"], ["gros → grosse", "GRO → GROSS", "big / fat"], ["vieux → vieille", "vee-UH → vee-AY-yuh", "old"], ["gentil → gentille", "zhahn-TEE → zhahn-TEE-yuh", "kind"], ["blanc → blanche", "BLAHN → BLAHNSH", "white"]]}], "bookpages": ["g010", "g011", "g012", "g013"]}, {"id": "gr-3", "label": "Chapitre 3", "name": "Ils sont grands.", "summary": "Singular to plural — add -s, unless the word already ends in -s or -x.", "art": null, "groups": [{"name": "Singulier → pluriel", "cols": "two", "note": "<strong>Pluriel = singulier + -s.</strong> But a masculine word already ending in <strong>-s</strong> or <strong>-x</strong> doesn't change at all. One irregular: <em>beau → beaux</em>.<br><br>And when a group is mixed, the masculine plural always wins — one man among ten women still makes it <strong>ils</strong>.", "items": [["il est blond → ils sont blonds", "eel ay BLOHN → eel sohn BLOHN", "he is / they are blond"], ["elle est blonde → elles sont blondes", "el ay BLOHND → el sohn BLOHND", "she is / they are blonde"], ["il est étudiant → ils sont étudiants", "eel et ay-tew-dee-AHN → eel sohn tay-tew-dee-AHN", "student(s)"], ["il est français → ils sont français", "eel ay frahn-SAY → eel sohn frahn-SAY", "French — no change"], ["il est vieux → ils sont vieux", "eel ay vee-UH → eel sohn vee-UH", "old — no change"], ["il est beau → ils sont beaux", "eel ay BO → eel sohn BO", "handsome — irregular"], ["Ils sont américains.", "eel sohn ta-may-ree-KAN", "They're American."], ["Elles sont brésiliennes.", "el sohn bray-zeel-YEN", "They're Brazilian. (fem.)"], ["Elles sont danseuses.", "el sohn dahn-SUHZ", "They're dancers. (fem.)"], ["Ils sont gentils.", "eel sohn zhahn-TEE", "They're kind."], ["Elles sont gentilles.", "el sohn zhahn-TEE-yuh", "They're kind. (fem.)"], ["Elles sont célibataires.", "el sohn say-lee-ba-TAIR", "They're single. (fem.)"]]}], "bookpages": ["g014", "g015"]}, {"id": "gr-4", "label": "Chapitre 4", "name": "Je suis, tu es, il est…", "summary": "Être in full, the tu/vous decision, and the two very different jobs of on.", "art": null, "groups": [{"name": "Être, tu/vous, on", "note": "<strong>vous</strong> does two jobs: polite singular, and plural of any register. <strong>tu</strong> is familiar singular only.<br><br><strong>on</strong> also does two: casual 'we' (<em>Jean et moi, on est fatigués</em>) and general 'people' (<em>Quand on est enrhumé, on est fatigué</em>). It always conjugates like <em>il</em>.", "items": [["Vous êtes prêt, monsieur Meyer ?", "voo-ZET PREH, muh-syuh may-AIR", "Are you ready, Mr Meyer? (polite)"], ["Tu es prêt, papa ?", "tew ay PREH, pa-PAH", "Are you ready, dad? (familiar)"], ["Vous êtes prêts ? (messieurs)", "voo-ZET PREH", "Are you ready? (several men)"], ["Vous êtes prêtes ? (mesdames)", "voo-ZET PRET", "Are you ready? (several women)"], ["Jean et moi, on est enrhumés.", "zhahn ay mwah, oh-nay tahn-rew-MAY", "Jean and I have colds. (on = nous)"], ["Quand on est enrhumé, on est fatigué.", "kahn oh-nay tahn-rew-MAY, oh-nay fa-tee-GAY", "When you have a cold, you're tired. (on = people)"], ["Nous sommes contents d'être à Paris.", "noo sum kohn-TAHN detr a pa-REE", "We're happy to be in Paris."], ["Nous sommes désolés d'être en retard.", "noo sum day-zo-LAY detr ahn ruh-TAR", "We're sorry to be late."], ["Quand on est en vacances, on est content.", "kahn oh-nay ahn va-KAHNSS, oh-nay kohn-TAHN", "When you're on holiday, you're happy."], ["Quand on est en retard, on est pressé.", "kahn oh-nay ahn ruh-TAR, oh-nay press-AY", "When you're late, you're in a hurry."]]}], "bookpages": ["g016", "g017"]}, {"id": "gr-5", "label": "Chapitre 5", "name": "Est-ce que… ? Non, je ne suis pas…", "summary": "Three ways to ask a yes/no question, and where pas goes.", "art": "nepas", "groups": [{"name": "Poser une question", "note": "Three ways to ask the same yes/no question: rising intonation alone, or <strong>est-ce que</strong> on the front. Both are normal in speech — est-ce que is the safer default while you're building confidence, because it signals 'question' from word one.", "items": [["Vous êtes japonais.", "voo-ZET zha-po-NAY", "You're Japanese. (statement, falling tone)"], ["Vous êtes japonais ?", "voo-ZET zha-po-NAY", "Are you Japanese? (rising tone)"], ["Est-ce que vous êtes japonais ?", "es-kuh voo-ZET zha-po-NAY", "Are you Japanese? (with est-ce que)"], ["Est-ce que Jean est français ?", "es-kuh zhahn ay frahn-SAY", "Is Jean French?"], ["Est-ce que vous êtes étudiant ?", "es-kuh voo-ZET zay-tew-dee-AHN", "Are you a student?"], ["Est-ce que tu es marié ?", "es-kuh tew ay ma-ree-AY", "Are you married?"], ["Est-ce que Marco est blond ?", "es-kuh mar-KO ay BLOHN", "Is Marco blond?"]]}, {"name": "La négation ne… pas", "cols": "two", "items": [["Je ne suis pas content.", "zhuh nuh swee pah kohn-TAHN", "I'm not happy."], ["Elle n'est pas riche.", "el nay pah REESH", "She's not rich."], ["Ils ne sont pas italiens.", "eel nuh sohn pah zee-tal-YAN", "They're not Italian."], ["Je ne suis pas brun.", "zhuh nuh swee pah BRUHN", "I'm not dark-haired."], ["Je ne suis pas français.", "zhuh nuh swee pah frahn-SAY", "I'm not French."], ["Je ne suis pas professeur.", "zhuh nuh swee pah pro-fess-UR", "I'm not a teacher."], ["Le lit n'est pas confortable.", "luh LEE nay pah kohn-for-TAHB-luh", "The bed isn't comfortable."], ["L'eau n'est pas chaude.", "lo nay pah SHOWD", "The water isn't hot."], ["Les chambres ne sont pas chères.", "lay SHAHM-bruh nuh sohn pah SHAIR", "The rooms aren't expensive."], ["Non, il n'est pas blond. Il est brun.", "nohn, eel nay pah BLOHN. eel ay BRUHN", "No, he's not blond. He's dark-haired."]]}], "bookpages": ["g018", "g019"]}, {"id": "gr-6", "label": "Chapitre 6", "name": "Je parle, je regarde, j'aime…", "summary": "Regular -ER verbs — the biggest verb family in French, and the one that never lets you down.", "art": null, "groups": [{"name": "Les verbes en -ER", "cols": "two", "note": "<strong>Drop -er, add -e.</strong> That final -e is silent — <em>je parle</em> is said zhuh PARL. And <strong>je → j'</strong> before a vowel or silent h.<br><br>This is the biggest verb family in French. Almost every new verb you meet will follow it.", "items": [["parler → je parle", "zhuh PARL", "to speak → I speak"], ["regarder → je regarde", "zhuh ruh-GARD", "to watch → I watch"], ["manger → je mange", "zhuh MAHNZH", "to eat → I eat"], ["travailler → je travaille", "zhuh tra-VIGH", "to work → I work"], ["téléphoner → je téléphone", "zhuh tay-lay-FON", "to call → I call"], ["écouter → j'écoute", "zhay-KOOT", "to listen → I listen"], ["aimer → j'aime", "zhem", "to love → I love"], ["habiter → j'habite", "zha-BEET", "to live → I live"], ["étudier → j'étudie", "zhay-tew-DEE", "to study → I study"], ["commencer → je commence", "zhuh ko-MAHNSS", "to start → I start"], ["terminer → je termine", "zhuh tair-MEEN", "to finish → I finish"], ["dîner → je dîne", "zhuh DEEN", "to have dinner → I have dinner"]]}, {"name": "Une journée — le modèle", "items": [["Je travaille dans une banque.", "zhuh tra-vigh dahn zewn BAHNK", "I work in a bank."], ["Le matin, je commence à 9 heures.", "luh ma-TAN, zhuh ko-MAHNSS a nuh-VUR", "In the morning I start at 9."], ["Le soir, je termine à 18 heures.", "luh SWAHR, zhuh tair-MEEN a dee-zwee-TUR", "In the evening I finish at 6."], ["À midi, je mange à la cafétéria avec mes collègues.", "a mee-DEE, zhuh MAHNZH a lah ka-fay-tay-REE-a a-vek may ko-LEG", "At noon I eat in the cafeteria with my colleagues."], ["Le soir, je dîne chez moi.", "luh SWAHR, zhuh DEEN shay MWAH", "In the evening I have dinner at home."], ["Après le repas, je regarde la télévision ou j'écoute la radio.", "a-PRAY luh ruh-PAH, zhuh ruh-GARD lah tay-lay-vee-zee-OHN oo zhay-KOOT lah ra-dee-O", "After the meal I watch TV or listen to the radio."], ["J'aime le sport et la musique.", "zhem luh SPOR ay lah mew-ZEEK", "I like sport and music."], ["J'habite à Paris.", "zha-BEET a pa-REE", "I live in Paris."], ["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["J'étudie l'anglais.", "zhay-tew-DEE lahn-GLAY", "I'm studying English."]]}], "bookpages": ["g020", "g021"]}, {"id": "gr-7", "label": "Chapitre 7", "name": "Je parle, tu parles, il parle…", "summary": "Pages 22–23. The full present tense of -ER verbs, the two endings you can actually hear, on as a general subject, and a revision of questions and negation.", "art": "erverbs", "bookpages": ["g022", "g023"], "groups": [{"name": "Parler — les six personnes", "cols": "two", "items": [["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["Tu parles anglais.", "tew parl ahn-GLAY", "You speak English."], ["Il / Elle / On parle russe.", "eel / el / ohn parl REWSS", "He / She / One speaks Russian."], ["Nous parlons italien.", "noo par-LOHN ee-tal-YAN", "We speak Italian."], ["Vous parlez chinois.", "voo par-LAY shee-NWAH", "You speak Chinese."], ["Ils / Elles parlent allemand.", "eel / el parl al-MAHN", "They speak German."]]}, {"name": "Les finales muettes — ce que vous n'entendez pas", "note": "<strong>Four of the six forms sound identical.</strong> The endings <code>-e</code>, <code>-es</code> and <code>-ent</code> are all silent, so <em>je parle</em>, <em>tu parles</em>, <em>il parle</em> and <em>ils parlent</em> are one single sound: <strong>parl</strong>. Only the spelling tells them apart.", "cols": "two", "items": [["Je parle", "zhuh PARL", "silent -e"], ["Tu parles", "tew PARL", "silent -es"], ["Il / Elle / On parle", "eel PARL", "silent -e"], ["Ils / Elles parlent", "eel PARL", "silent -ent"], ["J'aime", "ZHEM", "silent -e"], ["Tu aimes", "tew EM", "silent -es"], ["Il / Elle / On aime", "eel EM", "silent -e"], ["Ils / Elles aiment", "eel ZEM", "silent -ent, with liaison"]]}, {"name": "Les finales sonores — ce que vous entendez", "note": "Only <strong>-ons</strong> and <strong>-ez</strong> are pronounced. Those two forms are the only ones your ear can pick out.", "cols": "two", "items": [["Vous parlez", "voo par-LAY", "audible -ez"], ["Nous parlons", "noo par-LOHN", "audible -ons"], ["Vous aimez", "voo zay-MAY", "audible -ez, with liaison"], ["Nous aimons", "noo zay-MOHN", "audible -ons, with liaison"]]}, {"name": "« On » — rappel", "note": "Two jobs, and the sentence tells you which. With named people it means <strong>nous</strong>; on its own it means <strong>people in general</strong>.", "items": [["Igor et moi, on parle russe.", "ee-GOR ay MWAH, ohn parl REWSS", "Igor and I speak Russian. — on = nous"], ["En Russie, on parle russe.", "ahn rew-SEE, ohn parl REWSS", "In Russia they speak Russian. — on = en général"]]}, {"name": "L'interrogation et la négation — révision", "cols": "two", "items": [["Vous parlez anglais ?", "voo par-LAY ahn-GLAY", "Do you speak English?"], ["Non, je ne parle pas anglais.", "nohn, zhuh nuh parl pah zahn-GLAY", "No, I don't speak English."], ["Vous habitez en France ?", "voo za-bee-TAY ahn FRAHNSS", "Do you live in France?"], ["Non, je n'habite pas en France.", "nohn, zhuh na-BEET pah zahn FRAHNSS", "No, I don't live in France."], ["Est-ce que Marie travaille ?", "es-kuh ma-REE tra-VIGH", "Does Marie work?"], ["Non, elle ne travaille pas.", "nohn, el nuh tra-VIGH PAH", "No, she doesn't work."], ["Est-ce que Paul et Max étudient ?", "es-kuh pol ay maks ay-TEW-dee", "Do Paul and Max study?"], ["Non, ils n'étudient pas.", "nohn, eel nay-TEW-dee PAH", "No, they don't study."]]}, {"name": "Ex. 1 — moi, ma sœur, mes parents", "note": "The verb endings for <em>je</em> and <em>elle</em> are both silent, so they sound identical — only the spelling changes.", "items": [["J'habite dans le centre. / Elle habite en banlieue.", "zha-BEET dahn luh SAHN-truh / el a-BEET ahn bahn-lee-UH", "I live in the centre. / She lives in the suburbs."], ["Je travaille dans une banque. / Elle travaille dans une librairie.", "zhuh tra-VIGH dahn zewn BAHNK / el tra-VIGH dahn zewn lee-bray-REE", "I work in a bank. / She works in a bookshop."], ["Je commence à 9 heures. / Elle commence à 10 heures.", "zhuh ko-MAHNSS a nuh VUR / el ko-MAHNSS a dee ZUR", "I start at 9. / She starts at 10."], ["Je termine à 17 heures. / Elle termine à 19 heures.", "zhuh tair-MEEN a dee-set UR / el tair-MEEN a deez-nuh VUR", "I finish at 5pm. / She finishes at 7pm."], ["Je dîne à 20 heures. / Elle dîne à 21 heures.", "zhuh DEEN a van TUR / el DEEN a van-tay-uh NUR", "I have dinner at 8pm. / She dines at 9pm."], ["Mes parents habitent en banlieue, ils travaillent dans une école.", "may pa-RAHN a-BEET ahn bahn-lee-UH, eel tra-VIGH dahn zewn ay-KOL", "A model third text, in the ils form."]]}, {"name": "Ex. 2 — répondre avec « on »", "items": [["Qu'est-ce qu'on fait dans une discothèque ? — On danse.", "kes-koh FAY dahn zewn dees-ko-TEK ? — ohn DAHNSS", "What do you do in a nightclub? — You dance."], ["… dans une piscine ? — On nage.", "… dahn zewn pee-SEEN ? — ohn NAHZH", "… in a swimming pool? — You swim."], ["… dans une cabine téléphonique ? — On téléphone.", "… dahn zewn ka-BEEN tay-lay-fo-NEEK ? — ohn tay-lay-FON", "… in a phone box? — You make a call."], ["… dans un restaurant ? — On mange.", "… dahn zuhn res-to-RAHN ? — ohn MAHNZH", "… in a restaurant? — You eat."]]}, {"name": "Ex. 3 — conjuguez les verbes", "cols": "two", "items": [["Je travaille. Vous travaillez. Nous travaillons.", "zhuh tra-VIGH. voo tra-va-YAY. noo tra-va-YOHN", "travailler — to work"], ["Elle danse. Vous dansez. Nous dansons.", "el DAHNSS. voo dahn-SAY. noo dahn-SOHN", "danser — to dance"], ["On fume. Vous fumez. Nous fumons.", "ohn FEWM. voo few-MAY. noo few-MOHN", "fumer — to smoke"], ["Tu téléphones. Vous téléphonez. Nous téléphonons.", "tew tay-lay-FON. voo tay-lay-fo-NAY. noo tay-lay-fo-NOHN", "téléphoner — to phone"], ["Ils dînent. Vous dînez. Nous dînons.", "eel DEEN. voo dee-NAY. noo dee-NOHN", "dîner — to have dinner"]]}, {"name": "Ex. 4 — question et réponse négative", "items": [["Tu fumes ? — Non, je ne fume pas.", "tew FEWM ? — nohn, zhuh nuh fewm PAH", "Do you smoke? — No, I don't."], ["Tu danses ? — Non, je ne danse pas.", "tew DAHNSS ? — nohn, zhuh nuh dahnss PAH", "Do you dance? — No, I don't."], ["Tu parles espagnol ? — Non, je ne parle pas espagnol.", "tew parl es-pan-YOL ? — nohn, zhuh nuh parl pah zes-pan-YOL", "Do you speak Spanish? — No, I don't."], ["Tu aimes le rock ? — Non, je n'aime pas le rock.", "tew em luh ROK ? — nohn, zhuh nem pah luh ROK", "Do you like rock? — No, I don't."]]}, {"name": "Ex. 5 — corriger d'après le texte", "note": "The six statements at the top are the facts; each question contradicts one of them, so you answer in the negative and then give the true version.", "items": [["Les enfants jouent dans leur chambre.", "lay zahn-FAHN ZHOO dahn lur SHAHM-bruh", "The children play in their bedroom."], ["Le grand-père regarde un match à la télé.", "luh grahn-PAIR ruh-GARD uhn MATCH a lah tay-LAY", "Grandad is watching a match on TV."], ["La grand-mère téléphone à sa sœur.", "lah grahn-MAIR tay-lay-FON a sa SUR", "Grandma is phoning her sister."], ["La baby-sitter étudie le français.", "lah ba-bee-see-TAIR ay-TEW-dee luh frahn-SAY", "The babysitter is studying French."], ["Les parents dînent au restaurant.", "lay pa-RAHN DEEN oh res-to-RAHN", "The parents are dining out."], ["Le chat mange sur le balcon.", "luh SHA mahnzh sewr luh bal-KOHN", "The cat is eating on the balcony."], ["Les enfants jouent dans le salon ? — Non, ils ne jouent pas dans le salon. Ils jouent dans leur chambre.", "… nohn, eel nuh zhoo pah dahn luh sa-LOHN", "Do the children play in the living room? — No, in their bedroom."], ["La baby-sitter regarde la télévision ? — Non, elle ne regarde pas la télévision. Elle étudie le français.", "… el nuh ruh-gard pah lah tay-lay-vee-zee-OHN", "Is the babysitter watching TV? — No, she's studying French."], ["Le grand-père écoute la radio ? — Non, il n'écoute pas la radio. Il regarde un match à la télé.", "… eel nay-KOOT pah lah ra-dee-O", "Is grandad listening to the radio? — No, he's watching a match."]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["une banque", "ewn BAHNK", "a bank"], ["une librairie", "ewn lee-bray-REE", "a bookshop"], ["la banlieue", "lah bahn-lee-UH", "the suburbs"], ["le centre", "luh SAHN-truh", "the centre"], ["commencer", "ko-mahn-SAY", "to begin"], ["terminer", "tair-mee-NAY", "to finish"], ["dîner", "dee-NAY", "to dine"], ["nager", "na-ZHAY", "to swim"], ["fumer", "few-MAY", "to smoke"], ["jouer", "zhoo-AY", "to play"], ["une discothèque", "ewn dees-ko-TEK", "a nightclub"], ["une piscine", "ewn pee-SEEN", "a swimming pool"], ["une cabine téléphonique", "ewn ka-BEEN tay-lay-fo-NEEK", "a phone box"], ["le salon", "luh sa-LOHN", "the living room"], ["le balcon", "luh bal-KOHN", "the balcony"], ["un match", "uhn MATCH", "a match"], ["une baby-sitter", "ewn ba-bee-see-TAIR", "a babysitter"], ["le chat", "luh SHA", "the cat"]]}]}, {"id": "gr-8", "label": "Chapitre 8", "name": "J'achète, vous achetez. Je préfère, vous préférez.", "summary": "Pages 24–25. The -ER verbs that shift their spelling: accents that appear and vanish, doubled consonants, and the -ger and -cer verbs that protect their soft sound.", "art": "particularites", "bookpages": ["g024", "g025"], "groups": [{"name": "Le dialogue de la page", "items": [["Vous préférez les noires ou les blanches ?", "voo pray-fay-RAY lay NWAHR oo lay BLAHNSH", "Do you prefer the black ones or the white ones?"], ["Je préfère les blanches.", "zhuh pray-FAIR lay BLAHNSH", "I prefer the white ones."]]}, {"name": "Accent grave — préférer", "note": "<strong>The rule behind it:</strong> the ending is silent in four forms, so the vowel before it has to carry the sound and takes an <strong>accent grave (è)</strong>. In <em>nous</em> and <em>vous</em> the ending is pronounced, so the <strong>é</strong> stays.<br><br>Same pattern: <em>espérer, répéter, compléter</em>.", "cols": "two", "items": [["Je préfère", "zhuh pray-FAIR", "è — ending silent"], ["Tu préfères", "tew pray-FAIR", "è"], ["Il préfère", "eel pray-FAIR", "è"], ["Ils préfèrent", "eel pray-FAIR", "è"], ["Nous préférons", "noo pray-fay-ROHN", "é — ending audible"], ["Vous préférez", "voo pray-fay-RAY", "é — ending audible"], ["espérer", "es-pay-RAY", "to hope"], ["répéter", "ray-pay-TAY", "to repeat"], ["compléter", "kohm-play-TAY", "to complete"]]}, {"name": "Accent grave — acheter", "note": "Here the infinitive has <strong>no accent at all</strong>; the è appears only where the ending falls silent. Same pattern: <em>mener, amener, emmener, enlever, peser</em>.", "cols": "two", "items": [["J'achète", "zha-SHET", "è"], ["Tu achètes", "tew a-SHET", "è"], ["Il achète", "eel a-SHET", "è"], ["Ils achètent", "eel za-SHET", "è"], ["Nous achetons", "noo zash-TOHN", "plain e"], ["Vous achetez", "voo zash-TAY", "plain e"], ["mener", "muh-NAY", "to lead"], ["amener", "am-NAY", "to bring (a person)"], ["emmener", "ahm-NAY", "to take (a person) along"], ["enlever", "ahn-luh-VAY", "to remove"], ["peser", "puh-ZAY", "to weigh"]]}, {"name": "Consonne doublée — jeter, appeler", "note": "Instead of an accent, these double the consonant to keep the vowel open — <strong>tt</strong> and <strong>ll</strong> where the ending is silent, single letter where it is heard.", "cols": "two", "items": [["Je jette", "zhuh ZHET", "tt"], ["Tu jettes", "tew ZHET", "tt"], ["Il jette", "eel ZHET", "tt"], ["Ils jettent", "eel ZHET", "tt"], ["Nous jetons", "noo zhuh-TOHN", "single t"], ["Vous jetez", "voo zhuh-TAY", "single t"], ["J'appelle", "zha-PELL", "ll"], ["Tu appelles", "tew a-PELL", "ll"], ["Il appelle", "eel a-PELL", "ll"], ["Ils appellent", "eel za-PELL", "ll"], ["Nous appelons", "noo za-play-OHN", "single l"], ["Vous appelez", "voo za-play-AY", "single l"]]}, {"name": "Verbes en -ayer et -oyer", "cols": "two", "items": [["Je paie / je paye", "zhuh PAY", "I pay — both spellings allowed"], ["Vous payez", "voo pay-YAY", "you pay"], ["J'envoie", "zhahn-VWAH", "I send"], ["Vous envoyez", "voo zahn-vwa-YAY", "you send"]]}, {"name": "Verbes en -ger et -cer — la finale -ons", "note": "Before the <strong>-ons</strong> ending, <em>g</em> and <em>c</em> would harden. French keeps them soft by adding a silent <strong>e</strong> after g, and a <strong>cédille</strong> under c.", "cols": "two", "items": [["Je mange / Nous mangeons", "zhuh MAHNZH / noo mahn-ZHOHN", "g + e + ons"], ["Je voyage / Nous voyageons", "zhuh vwa-YAHZH / noo vwa-ya-ZHOHN", "g + e + ons"], ["changer / nous changeons", "shahn-ZHAY / noo shahn-ZHOHN", "to change"], ["nager / nous nageons", "na-ZHAY / noo na-ZHOHN", "to swim"], ["partager / nous partageons", "par-ta-ZHAY / noo par-ta-ZHOHN", "to share"], ["Je commence / Nous commençons", "zhuh ko-MAHNSS / noo ko-mahn-SOHN", "ç + ons"], ["J'avance / Nous avançons", "zha-VAHNSS / noo za-vahn-SOHN", "ç + ons"]]}, {"name": "Ex. 1 — préférences", "items": [["Vous préférez les pâtes ou le riz ? — Je préfère le riz.", "voo pray-fay-RAY lay PAHT oo luh REE ? — zhuh pray-FAIR luh REE", "Do you prefer pasta or rice? — I prefer rice."], ["Vous préférez le printemps ou l'automne ? — Je préfère le printemps.", "… luh pran-TAHN oo lo-TUN", "Spring or autumn?"], ["Vous préférez le vin blanc ou le vin rouge ? — Je préfère le vin rouge.", "… luh van BLAHN oo luh van ROOZH", "White wine or red?"]]}, {"name": "Ex. 2 — mettre les accents", "note": "Accent only where the ending is silent. Nos 5, 6, 7, 8 and 9 are <em>nous</em> or <em>vous</em> forms, so they keep the plain vowel.", "cols": "two", "items": [["1. J'achète un livre.", "zha-SHET uhn LEE-vruh", "è"], ["2. Tu amènes des amis.", "tew a-MEN day za-MEE", "è"], ["3. Je préfère les blondes.", "zhuh pray-FAIR lay BLOHND", "è"], ["4. Elle répète la leçon.", "el ray-PET lah luh-SOHN", "è"], ["5. Vous préférez les brunes.", "voo pray-fay-RAY lay BREWN", "no change"], ["6. Nous enlevons nos chaussures.", "noo zahn-luh-VOHN no sho-SEWR", "no change"], ["7. Vous répétez les phrases.", "voo ray-pay-TAY lay FRAZ", "no change"], ["8. Nous complétons la leçon.", "noo kohm-play-TOHN lah luh-SOHN", "no change"], ["9. Nous achetons un livre.", "noo zash-TOHN uhn LEE-vruh", "no change"], ["10. Il pèse 100 kilos.", "eel PEZ sahn kee-LO", "è"], ["11. On répète les phrases.", "ohn ray-PET lay FRAZ", "è"], ["12. Ils préfèrent les rousses.", "eel pray-FAIR lay ROOSS", "è"]]}, {"name": "Ex. 3 — complétez", "items": [["1. J'appelle Londres. Vous appelez Prague. Ils appellent Rio.", "zha-PELL … voo za-play-AY … eel za-PELL", "appeler"], ["2. Il achète une veste. Elle achète une robe. Nous achetons un pull.", "eel a-SHET … noo zash-TOHN", "acheter"], ["3. Tu appelles ta sœur. Nous appelons nos amis. Vous appelez vos parents.", "tew a-PELL … noo za-play-OHN … voo za-play-AY", "appeler"], ["4. Vous mangez une glace. Elle mange des frites. Nous mangeons un sandwich.", "voo mahn-ZHAY … noo mahn-ZHOHN", "manger"], ["5. Vous voyagez en avion. Ils voyagent en train. Nous voyageons en car.", "voo vwa-ya-ZHAY … noo vwa-ya-ZHOHN", "voyager"]]}, {"name": "Ex. 4 — Bip et Zaza racontent", "note": "The whole text moved from <em>je</em> to <em>nous</em> — which is where the -ger spelling changes show up.", "items": [["Nous visitons de nombreuses planètes.", "noo vee-zee-TOHN duh nohm-BRUHZ pla-NET", "We visit many planets."], ["Nous voyageons en astronef.", "noo vwa-ya-ZHOHN ah nas-tro-NEF", "We travel by spaceship. — note the e"], ["Quand nous arrivons dans un nouveau pays, nous achetons un dictionnaire et nous étudions la langue.", "kahn noo za-ree-VOHN … noo zash-TOHN … noo zay-tew-dee-OHN", "When we arrive in a new country we buy a dictionary and study the language."], ["Nous posons des questions.", "noo po-ZOHN day kes-tee-OHN", "We ask questions."], ["Nous goûtons la nourriture. Nous comparons.", "noo goo-TOHN lah noo-ree-TEWR. noo kohm-pa-ROHN", "We taste the food. We compare."], ["De temps en temps, nous appelons Mars.", "duh tahn zahn TAHN, noo za-play-OHN MARSS", "From time to time we call Mars."], ["Nous aimons beaucoup la France. Nous espérons revenir un jour.", "noo zay-MOHN bo-KOO lah FRAHNSS. noo zes-pay-ROHN ruh-vuh-NEER uhn ZHOOR", "We love France. We hope to come back one day."]]}, {"name": "Ex. 5 — énumérez les activités", "items": [["Au marché, je regarde, je compare et j'achète.", "oh mar-SHAY, zhuh ruh-GARD, zhuh kohm-PAR ay zha-SHET", "At the market I look, compare and buy."], ["À l'école maternelle, les enfants dansent, chantent et jouent.", "a lay-KOL ma-tair-NELL, lay zahn-FAHN DAHNSS, SHAHNT ay ZHOO", "At nursery school the children dance, sing and play."], ["Dans la classe de langue, nous parlons, nous écoutons et nous répétons.", "dahn lah klahss duh LAHNG, noo par-LOHN, noo zay-koo-TOHN ay noo ray-pay-TOHN", "In the language class we speak, listen and repeat."], ["Dans notre société de consommation, on achète, on jette et on achète.", "dahn NOT-ruh so-see-ay-TAY duh kohn-so-ma-see-OHN, ohn a-SHET, ohn ZHET ay ohn a-SHET", "In our consumer society we buy, throw away and buy again."]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["préférer", "pray-fay-RAY", "to prefer"], ["acheter", "ash-TAY", "to buy"], ["jeter", "zhuh-TAY", "to throw away"], ["appeler", "ap-LAY", "to call"], ["payer", "pay-YAY", "to pay"], ["envoyer", "ahn-vwa-YAY", "to send"], ["voyager", "vwa-ya-ZHAY", "to travel"], ["goûter", "goo-TAY", "to taste"], ["comparer", "kohm-pa-RAY", "to compare"], ["poser une question", "po-ZAY ewn kes-tee-OHN", "to ask a question"], ["une veste", "ewn VEST", "a jacket"], ["une robe", "ewn ROB", "a dress"], ["un pull", "uhn PEWL", "a jumper"], ["des chaussures", "day sho-SEWR", "shoes"], ["les pâtes", "lay PAHT", "pasta"], ["le riz", "luh REE", "rice"], ["une glace", "ewn GLAHSS", "an ice cream"], ["des frites", "day FREET", "chips"], ["le printemps", "luh pran-TAHN", "spring"], ["l'automne", "lo-TUN", "autumn"], ["le vin blanc / rouge", "luh van BLAHN / ROOZH", "white / red wine"], ["une planète", "ewn pla-NET", "a planet"], ["un astronef", "uh nas-tro-NEF", "a spaceship"], ["la nourriture", "lah noo-ree-TEWR", "food"], ["un dictionnaire", "uhn deek-see-o-NAIR", "a dictionary"], ["l'école maternelle", "lay-KOL ma-tair-NELL", "nursery school"], ["la société de consommation", "lah so-see-ay-TAY duh kohn-so-ma-see-OHN", "consumer society"], ["blond / brun / roux", "BLOHN / BRUHN / ROO", "blond / brown-haired / red-haired"]]}]}, {"id": "gr-9", "label": "Chapitre 9", "name": "Je me lave. Je me regarde.", "summary": "Pages 26–27. Reflexive verbs — when the subject is also the object, and the little pronoun that has to sit in front of the verb.", "art": "reflexif", "bookpages": ["g026", "g027"], "groups": [{"name": "La différence en images", "note": "When the subject is <strong>also the object</strong> of the verb, French uses a reflexive pronoun. <em>me</em> means <em>moi-même</em> — myself.", "cols": "two", "items": [["Je lave ma voiture.", "zhuh LAHV ma vwa-TEWR", "I wash my car. — object is the car"], ["Je me lave.", "zhuh muh LAHV", "I wash myself."], ["Je regarde la télé.", "zhuh ruh-GARD lah tay-LAY", "I watch TV. — object is the TV"], ["Je me regarde.", "zhuh muh ruh-GARD", "I look at myself."]]}, {"name": "Se laver — les pronoms réfléchis", "cols": "two", "note": "The pronoun always goes <strong>in front of the verb</strong>, never after it.", "items": [["Je me lave", "zhuh muh LAHV", "I wash (myself)"], ["Tu te laves", "tew tuh LAHV", "you wash"], ["Il / Elle / On se lave", "eel suh LAHV", "he / she washes"], ["Nous nous lavons", "noo noo la-VOHN", "we wash"], ["Vous vous lavez", "voo voo la-VAY", "you wash"], ["Ils / Elles se lavent", "eel suh LAHV", "they wash"]]}, {"name": "À ne pas dire", "note": "✓ Dites : <strong>Je me regarde.</strong> &nbsp;✗ Ne dites pas : <s>Je regarde moi.</s>", "items": [["Je me regarde.", "zhuh muh ruh-GARD", "I look at myself. — correct"]]}, {"name": "Élision et liaison", "note": "<strong>me → m'</strong>, <strong>te → t'</strong>, <strong>se → s'</strong> before a vowel or a silent h. And in <em>nous nous</em> / <em>vous vous</em> the second word links with a <strong>z</strong> sound.", "cols": "two", "items": [["Je m'appelle", "zhuh ma-PELL", "I'm called"], ["Tu t'habilles", "tew ta-BEE-yuh", "you get dressed"], ["Il s'ennuie", "eel sahn-NWEE", "he is bored"], ["Nous nous amusons", "noo noo za-mew-ZOHN", "we enjoy ourselves — liaison z"], ["Vous vous ennuyez", "voo voo zahn-nwee-YAY", "you are bored — liaison z"]]}, {"name": "Ex. 1 — le modèle", "items": [["Le lundi, je me lève à sept heures et demie et je me couche à dix heures.", "luh luhn-DEE, zhuh muh LEV a set UR ay duh-MEE ay zhuh muh KOOSH a dee ZUR", "On Mondays I get up at 7.30 and go to bed at 10."], ["Le samedi, je me lève à neuf heures et je me couche à minuit.", "luh sam-DEE … a nuh VUR … a mee-NWEE", "On Saturdays I get up at 9 and go to bed at midnight."], ["Le dimanche, je me lève à onze heures.", "luh dee-MAHNSH, zhuh muh LEV a ohn ZUR", "On Sundays I get up at 11."]]}, {"name": "Ex. 2 — les habitudes de Bruno et de ses parents", "items": [["En semaine, il se lève à sept heures.", "ahn suh-MEN, eel suh LEV a set UR", "During the week he gets up at 7."], ["En vacances, il se lève à onze heures.", "ahn va-KAHNSS, eel suh LEV a ohn ZUR", "On holiday he gets up at 11."], ["Ses parents se lèvent à six heures et ils se couchent tôt.", "say pa-RAHN suh LEV a see ZUR ay eel suh KOOSH TOH", "His parents get up at 6 and go to bed early."]]}, {"name": "Ex. 3 — quand on est…", "items": [["Quand on est fatigué, on se repose.", "kahn ohn ay fa-tee-GAY, ohn suh ruh-POZ", "When you're tired, you rest."], ["Quand on a sommeil, on se couche.", "kahn ohn a so-MAY, ohn suh KOOSH", "When you're sleepy, you go to bed."], ["Quand on est sale, on se lave.", "kahn ohn ay SAL, ohn suh LAHV", "When you're dirty, you wash."], ["Quand on est mouillé, on se sèche.", "kahn ohn ay moo-YAY, ohn suh SESH", "When you're wet, you dry off."], ["Quand il fait beau, on se promène.", "kahn teel fay BO, ohn suh pro-MEN", "When the weather's fine, you go for a walk."], ["Quand on est pressé, on se dépêche.", "kahn ohn ay press-AY, ohn suh day-PESH", "When you're in a hurry, you hurry."]]}, {"name": "Ex. 4 — se lever et se coucher", "items": [["Vous vous levez à quelle heure, le matin ? — Le matin, nous nous levons à sept heures.", "voo voo luh-VAY a kel UR … noo noo luh-VOHN", "What time do you get up in the morning?"], ["Vous vous couchez à quelle heure, le soir ? — Le soir, nous nous couchons à onze heures.", "voo voo koo-SHAY … noo noo koo-SHOHN", "What time do you go to bed at night?"], ["Vous vous levez à quelle heure, le dimanche ? — Le dimanche, nous nous levons à dix heures.", "… luh dee-MAHNSH …", "What time do you get up on Sundays?"], ["Vous vous couchez à quelle heure, en vacances ? — En vacances, nous nous couchons très tard.", "… ahn va-KAHNSS … treh TAR", "What time do you go to bed on holiday?"]]}, {"name": "Ex. 5 — les verbes et les lieux", "cols": "two", "items": [["Dans la salle de bains, je me douche, je me lave, je me rase, je me maquille.", "dahn lah sal duh BAN, zhuh muh DOOSH, zhuh muh LAHV, zhuh muh RAHZ, zhuh muh ma-KEE", "In the bathroom: shower, wash, shave, put on make-up."], ["Dans la rue, je me promène, je me dépêche.", "dahn lah REW, zhuh muh pro-MEN, zhuh muh day-PESH", "In the street: stroll, hurry."], ["Dans le jardin, je me repose, je m'amuse.", "dahn luh zhar-DAN, zhuh muh ruh-POZ, zhuh ma-MEWZ", "In the garden: rest, have fun."], ["Dans la chambre, je m'habille, je me déshabille, je me couche, je me parfume.", "dahn lah SHAHM-bruh, zhuh ma-BEE, zhuh muh day-za-BEE, zhuh muh KOOSH, zhuh muh par-FEWM", "In the bedroom: dress, undress, go to bed, put on perfume."]]}, {"name": "Les verbes pronominaux — la liste", "cols": "two", "items": [["se laver", "suh la-VAY", "to wash oneself"], ["se doucher", "suh doo-SHAY", "to shower"], ["se raser", "suh ra-ZAY", "to shave"], ["se maquiller", "suh ma-kee-YAY", "to put on make-up"], ["se parfumer", "suh par-few-MAY", "to put on perfume"], ["se sécher", "suh say-SHAY", "to dry oneself"], ["s'habiller", "sa-bee-YAY", "to get dressed"], ["se déshabiller", "suh day-za-bee-YAY", "to get undressed"], ["se lever", "suh luh-VAY", "to get up"], ["se coucher", "suh koo-SHAY", "to go to bed"], ["se reposer", "suh ruh-po-ZAY", "to rest"], ["se promener", "suh prom-NAY", "to go for a walk"], ["s'amuser", "sa-mew-ZAY", "to have fun"], ["s'ennuyer", "sahn-nwee-YAY", "to be bored"], ["se dépêcher", "suh day-pay-SHAY", "to hurry"], ["s'appeler", "sap-LAY", "to be called"]]}, {"name": "Le vocabulaire du chapitre", "cols": "two", "items": [["fatigué / fatiguée", "fa-tee-GAY", "tired"], ["avoir sommeil", "a-VWAHR so-MAY", "to be sleepy"], ["sale", "SAL", "dirty"], ["mouillé / mouillée", "moo-YAY", "wet"], ["pressé / pressée", "press-AY", "in a hurry"], ["tôt", "TOH", "early"], ["tard", "TAR", "late"], ["minuit", "mee-NWEE", "midnight"], ["en semaine", "ahn suh-MEN", "during the week"], ["en vacances", "ahn va-KAHNSS", "on holiday"], ["la salle de bains", "lah sal duh BAN", "the bathroom"], ["la chambre", "lah SHAHM-bruh", "the bedroom"], ["le jardin", "luh zhar-DAN", "the garden"], ["une habitude", "ew na-bee-TEWD", "a habit"]]}]}, {"id": "gr-recap1", "label": "Récapitulatif", "name": "Exercices récapitulatifs · Bilan n° 1", "summary": "Pages 28–29. Revision after chapters 1–9  Pages are here; the word-by-word transcription is still to come.", "art": null, "bookpages": ["g028", "g029"], "groups": [{"name": "Les pages du livre", "items": [], "pages": ["g028", "g029"], "note": "Every line of this chapter will be transcribed with pronunciation and meaning, the same as chapters 1–9."}]}, {"id": "gr-10", "label": "Chapitre 10", "name": "Un homme, une femme. Un arbre, une route.", "summary": "Pages 30–33. Le nom et l'article · Masculin et féminin des noms  Pages are here; the word-by-word transcription is still to come.", "art": null, "bookpages": ["g030", "g031", "g032", "g033"], "groups": [{"name": "Les pages du livre", "items": [], "pages": ["g030", "g031", "g032", "g033"], "note": "Every line of this chapter will be transcribed with pronunciation and meaning, the same as cha A1, units 1 to 7 — the vocabulary pages and their exercises.", "lessons": [{"id": "vp-1", "label": "Unité 1", "name": "Les usages, la politesse", "summary": "Greeting, introducing, welcoming, apologising, thanking, congratulating, wishing.", "art": "bise", "groups": [{"name": "Dire bonjour", "items": [["Bonjour, madame / monsieur.", "bohn-ZHOOR, ma-DAM / muh-SYUH", "Hello — during the day."], ["Bonsoir, madame.", "bohn-SWAHR, ma-DAM", "Good evening."], ["Bonjour, ma chère Mathilde !", "bohn-ZHOOR, ma SHAIR", "Hello, my dear Mathilde!"], ["Bonjour, Bénédicte, comment vas-tu ?", "ko-mahn va-TEW", "Hello Bénédicte, how are you?"], ["Bien, merci, et toi ?", "bee-AN, mair-SEE, ay TWAH", "Fine thanks, and you?"], ["Ça va bien, merci.", "sa va bee-AN, mair-SEE", "I'm doing well, thanks."], ["Salut, Mathilde, ça va ?", "sa-LEW, sa VA", "Hi Mathilde, you good?"], ["Tiens, salut ! Ça va, merci, et toi ?", "tee-AN, sa-LEW", "Oh hey! Good thanks, you?"]]}, {"name": "Dire au revoir", "items": [["Au revoir, Diane, à bientôt !", "oh ruh-VWAHR, a bee-an-TO", "Goodbye Diane, see you soon!"], ["Salut, Simon ! À tout à l'heure !", "sa-LEW, a too ta LUR", "Bye Simon! See you in a bit!"], ["Bonsoir, Raphaël, à lundi !", "bohn-SWAHR, a luhn-DEE", "Goodnight Raphaël, see you Monday!"]]}, {"name": "Présenter quelqu'un", "items": [["Je vous présente Florence Dusapin.", "zhuh voo pray-ZAHNT", "Let me introduce Florence Dusapin."], ["Bonjour, madame, enchanté.", "bohn-ZHOOR, ma-DAM, ahn-shahn-TAY", "Hello madam, delighted. (said by a man)"], ["Enchantée, monsieur.", "ahn-shahn-TAY, muh-SYUH", "Delighted. (said by a woman)"], ["Nicolas, est-ce que tu connais ma copine Émilie ?", "es-kuh tew ko-NAY ma ko-PEEN", "Nicolas, do you know my friend Émilie?"], ["Non, pas encore. Bonjour, Émilie.", "nohn, pa zahn-KOR", "No, not yet. Hello, Émilie."]]}, {"name": "Accueillir", "items": [["Entrez, je vous en prie !", "ahn-TRAY, zhuh voo zahn PREE", "Come in, please!"], ["Je peux prendre votre manteau ?", "zhuh puh PRAHN-druh VOT-ruh mahn-TO", "May I take your coat?"], ["Ça me fait plaisir de vous voir !", "sa muh fay play-ZEER duh voo VWAHR", "Lovely to see you!"], ["Asseyez-vous, je vous en prie !", "a-say-yay VOO, zhuh voo zahn PREE", "Please sit down."], ["Je suis content de te voir ! Assieds-toi, je t'en prie !", "zhuh swee kohn-TAHN duh tuh VWAHR", "Glad to see you! Sit down. (familiar)"]]}, {"name": "S'excuser", "items": [["Oh, pardon, madame. Je suis désolé !", "oh, par-DOHN, ma-DAM. zhuh swee day-zo-LAY", "Oh, sorry madam. My apologies!"], ["Ce n'est rien, monsieur !", "suh nay ree-AN", "It's nothing, sir!"], ["Excusez-moi, je suis désolée d'être en retard !", "eks-kew-zay MWAH", "Excuse me, I'm sorry I'm late!"], ["Je vous en prie, ce n'est pas grave.", "zhuh voo zahn PREE, suh nay pah GRAHV", "Not at all, it's fine."]]}, {"name": "Demander et remercier", "items": [["Pardon, madame, vous pouvez me dire où est la poste, s'il vous plaît ?", "par-DOHN … voo poo-VAY muh DEER oo ay lah POST", "Excuse me, could you tell me where the post office is?"], ["C'est au bout de la rue, à droite.", "set oh boo duh lah REW, a DRWAHT", "It's at the end of the street, on the right."], ["Je vous remercie, madame.", "zhuh voo ruh-mair-SEE", "Thank you, madam."], ["Je vous en prie, monsieur.", "zhuh voo zahn PREE", "You're welcome, sir."], ["Tu peux me prêter un euro, s'il te plaît ?", "tew puh muh pray-TAY uhn UR-oh", "Can you lend me a euro, please?"], ["Oui, bien sûr ! Voilà !", "wee, bee-AN SEWR ! vwa-LAH", "Yes of course! Here you go!"], ["Merci beaucoup !", "mair-SEE bo-KOO", "Thanks a lot!"], ["De rien !", "duh ree-AN", "You're welcome!"]]}, {"name": "Féliciter et plaindre", "items": [["Félicitations ! Toutes mes félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Je suis vraiment content pour toi !", "zhuh swee vray-MAHN kohn-TAHN poor TWAH", "I'm really happy for you!"], ["Bravo !", "bra-VO", "Well done!"], ["Tous mes vœux de bonheur !", "too may vuh duh
