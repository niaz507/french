<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français — carnet d'étude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3EF;
  --card:#FFFFFF;
  --ink:#16233A;
  --ink-2:#55607A;
  --ink-3:#8E96A6;
  --rule:rgba(22,35,58,.13);
  --rule-2:rgba(22,35,58,.07);
  --line:#16233A;
  --star:#E0A200;
  --display:"Bricolage Grotesque","Helvetica Neue",sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --top:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2.5px solid var(--line);outline-offset:2px;border-radius:4px}
::selection{background:rgba(22,35,58,.14)}

/* ══════════ TOP BAR ══════════ */
.top{
  position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;
  background:rgba(244,243,239,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mk{
  width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem;
}
.brand b{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:-3px}
.brand-txt{display:block}

.searchbox{
  flex:1;max-width:460px;display:flex;align-items:center;gap:9px;
  background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:7px 11px;
  transition:border-color .15s,box-shadow .15s;
}
.searchbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,35,58,.07)}
.searchbox input{flex:1;border:0;background:none;font:inherit;font-size:.9rem;outline:none;min-width:0}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox svg{flex:none;opacity:.4}
.kbd{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);border:1px solid var(--rule);
  border-radius:4px;padding:1px 5px;flex:none}

.topact{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.tbtn{
  display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:8px;
  padding:7px 12px;font-size:.83rem;font-weight:500;transition:all .15s;white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink)}
.tbtn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn.primary:hover{opacity:.88}
.speed{
  font-family:var(--mono);font-size:.72rem;border:1.5px solid var(--rule);border-radius:8px;
  padding:7px 6px;background:var(--card);color:var(--ink-2);
}
.menubtn{display:none}
.voicedot{width:7px;height:7px;border-radius:50%;background:#3F8F63;flex:none}
.voicedot.bad{background:#C4562F}

/* ══════════ SHELL ══════════ */
.shell{display:flex;padding-top:var(--top);min-height:100vh}

/* ══════════ SIDEBAR ══════════ */
.side{
  width:274px;flex:none;border-right:1px solid var(--rule);
  position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;
  padding:16px 12px 40px;
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
.sidelabel{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);padding:0 10px;margin:6px 0 8px;
}
.navhome{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--ink-2);
}
.navhome:hover{background:var(--rule-2);color:var(--ink)}
.navhome.on{background:var(--ink);color:#fff}
.navhome .ic{opacity:.6}
.navhome.on .ic{opacity:1}

.sec{margin-bottom:3px}
.sechead{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--ink);
  transition:background .13s;
}
.sechead:hover{background:var(--rule-2)}
.sechead .dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.sechead .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead .ct{font-family:var(--mono);font-size:.64rem;color:var(--ink-3);font-weight:400}
.sechead .chev{transition:transform .2s;opacity:.45;flex:none}
.sec.open .sechead .chev{transform:rotate(90deg)}

.lessons{display:none;padding:2px 0 8px 19px;margin-left:5px;border-left:2px solid var(--rule-2)}
.sec.open .lessons{display:block}
.les{
  display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;
  font-size:.85rem;color:var(--ink-2);line-height:1.35;transition:background .13s,color .13s;
}
.les:hover{background:var(--rule-2);color:var(--ink)}
.les.on{background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--ink);font-weight:600}
.les .lb{
  display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--sc);filter:saturate(.9) brightness(.82);margin-bottom:1px;
}
.les.on .lb{font-weight:500}

/* ══════════ MAIN ══════════ */
.main{flex:1;min-width:0;padding:0 30px 90px;max-width:1000px}

/* home */
.home-hero{padding:44px 0 30px;border-bottom:1px solid var(--rule);margin-bottom:30px}
.home-hero h1{
  font-family:var(--display);font-weight:800;font-size:clamp(2rem,5.4vw,3.1rem);
  line-height:1;margin:0 0 14px;letter-spacing:-.025em;max-width:16ch;
}
.home-hero p{margin:0;color:var(--ink-2);max-width:56ch;font-size:.98rem;line-height:1.6}
.figures{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.fig b{font-family:var(--display);font-size:1.55rem;font-weight:800;display:block;line-height:1}
.fig span{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.scard{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s,border-color .16s;
}
.scard:hover{transform:translateY(-2px);box-shadow:0 8px 22px -14px rgba(22,35,58,.4);border-color:color-mix(in srgb,var(--sc) 45%,var(--rule))}
.scard .bar{height:4px;background:var(--sc)}
.scard .body{padding:16px 17px 8px}
.scard h3{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0 0 5px;letter-spacing:-.015em}
.scard .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.scard p{margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.55}
.scard ul{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--rule-2)}
.scard li{border-bottom:1px solid var(--rule-2)}
.scard li:last-child{border-bottom:0}
.scard li button{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:9px 17px;
  font-size:.85rem;color:var(--ink-2);transition:background .12s,color .12s;
}
.scard li button:hover{background:var(--rule-2);color:var(--ink)}
.scard li .lb{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);filter:brightness(.8);flex:none;min-width:76px}
.scard li .n{flex:1;min-width:0}
.scard li .c{font-family:var(--mono);font-size:.62rem;color:var(--ink-3)}

/* lesson view */
.crumb{
  display:flex;align-items:center;gap:7px;padding:22px 0 0;
  font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  flex-wrap:wrap;
}
.crumb button{color:var(--ink-3);transition:color .13s}
.crumb button:hover{color:var(--ink)}
.crumb .cur{color:var(--sc);filter:brightness(.8)}

.lhead{padding:12px 0 22px;border-bottom:2px solid var(--sc);margin-bottom:8px}
.ltag{
  display:inline-block;font-family:var(--mono);font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;
  background:var(--sc);color:#fff;padding:4px 10px;border-radius:4px;margin-bottom:11px;
}
.lhead h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4.2vw,2.35rem);line-height:1.03;margin:0 0 9px;letter-spacing:-.025em}
.lhead p{margin:0;color:var(--ink-2);font-size:.94rem;max-width:60ch;line-height:1.6}

.lnav{
  position:sticky;top:var(--top);z-index:30;background:var(--paper);
  padding:11px 0;margin-bottom:14px;border-bottom:1px solid var(--rule);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
}
.lnav::-webkit-scrollbar{display:none}
.gchip{
  flex:none;border:1.5px solid var(--rule);border-radius:99px;padding:5px 13px;
  font-size:.79rem;color:var(--ink-2);white-space:nowrap;transition:all .13s;
}
.gchip:hover{border-color:var(--sc);color:var(--ink)}
.gchip.on{background:var(--sc);border-color:var(--sc);color:#fff}

.art{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:20px;margin:0 0 24px;overflow:hidden;
}
.art svg{display:block;width:100%;height:auto;max-width:620px;margin:0 auto}
.art figcaption{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);text-align:center;margin-top:14px;
}

.group{margin-bottom:34px;scroll-margin-top:calc(var(--top) + 60px)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.ghead h3{font-family:var(--display);font-weight:600;font-size:1.04rem;margin:0;letter-spacing:-.012em}
.ghead .right{display:flex;align-items:center;gap:10px}
.gct{font-family:var(--mono);font-size:.64rem;color:var(--ink-3)}
.playall{
  display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:99px;
  padding:4px 12px 4px 9px;font-family:var(--mono);font-size:.65rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);transition:all .13s;
}
.playall:hover{border-color:var(--sc);color:var(--ink)}
.playall.on{background:var(--sc);border-color:var(--sc);color:#fff}

.note{
  background:color-mix(in srgb,var(--sc) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--sc) 26%,transparent);
  border-radius:10px;padding:13px 16px;margin:0 0 14px;
  font-size:.87rem;line-height:1.62;color:var(--ink-2);
}
.note strong{color:var(--ink);font-weight:600}
.note em{font-style:normal;font-weight:500;color:var(--ink)}
.note code{font-family:var(--mono);font-size:.93em;background:rgba(22,35,58,.06);padding:1px 5px;border-radius:4px}

.items{display:grid;gap:7px}
.items.two{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.items.three{grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}

.item{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:11px 38px 11px 13px;
  transition:border-color .14s,box-shadow .14s,transform .14s;
}
.item:hover{border-color:color-mix(in srgb,var(--sc) 50%,var(--rule));transform:translateY(-1px)}
.item.speaking{border-color:var(--sc);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 20%,transparent)}
.item .en{display:block;font-size:.735rem;color:var(--ink-3);line-height:1.35;margin-bottom:2px}
.item .fr{display:block;font-size:1rem;font-weight:600;line-height:1.32;letter-spacing:-.005em}
.item .ph{display:block;font-family:var(--mono);font-size:.745rem;line-height:1.4;margin-top:2px;
  color:var(--sc);filter:saturate(.8) brightness(.7)}
.item mark{background:color-mix(in srgb,var(--sc) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.fav{
  position:absolute;top:7px;right:6px;width:26px;height:26px;border-radius:6px;
  display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .13s,color .13s;
}
.item:hover .fav,.fav:focus-visible,.fav.on{opacity:1}
.fav:hover{color:var(--star)}
.fav.on{color:var(--star)}

/* search results */
.rmeta{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:24px 0 16px}
.rgroup{margin-bottom:24px}
.rpath{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.63rem;
  letter-spacing:.09em;text-transform:uppercase;color:#fff;background:var(--sc);
  padding:3px 9px;border-radius:4px;margin-bottom:9px;
}
.empty{padding:50px 0;max-width:44ch;color:var(--ink-2);line-height:1.6;font-size:.94rem}
.empty b{display:block;font-family:var(--display);font-size:1.2rem;color:var(--ink);margin-bottom:7px}

/* ══════════ PRACTICE ══════════ */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(22,35,58,.55);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;
}
.overlay[hidden]{display:none}
.panel{
  background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow-y:auto;
  box-shadow:0 30px 70px -20px rgba(22,35,58,.5);
}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
.phead h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.02em}
.xbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.xbtn:hover{background:var(--rule-2);color:var(--ink)}
.pbody{padding:16px 20px 20px}
.optrow{margin-bottom:14px}
.optrow .lab{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1.5px solid var(--rule);border-radius:99px;padding:6px 13px;font-size:.83rem;color:var(--ink-2);transition:all .13s}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt:disabled{opacity:.35;cursor:not-allowed}

.pbar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.pcount{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;justify-content:space-between}
.flash{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:26px 20px;
  text-align:center;min-height:172px;display:flex;flex-direction:column;justify-content:center;gap:10px;
}
.flash .prompt{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;letter-spacing:-.02em}
.flash .sub{font-size:.85rem;color:var(--ink-3)}
.flash .ansfr{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.25}
.flash .ansph{font-family:var(--mono);font-size:.82rem;color:var(--ink-2)}
.flash .anseng{font-size:.9rem;color:var(--ink-2)}
.divider{height:1px;background:var(--rule);margin:4px 0}
.prow{display:flex;gap:8px;margin-top:14px}
.prow button{flex:1;border-radius:9px;padding:11px;font-size:.88rem;font-weight:600;border:1.5px solid var(--rule)}
.prow button:hover{border-color:var(--ink)}
.prow .go{background:var(--ink);border-color:var(--ink);color:#fff}
.prow .again{color:#B3542F;border-color:rgba(179,84,47,.3)}
.prow .again:hover{border-color:#B3542F}
.prow .know{color:#2F7A55;border-color:rgba(47,122,85,.3)}
.prow .know:hover{border-color:#2F7A55}
.pdone{text-align:center;padding:26px 8px}
.pdone b{font-family:var(--display);font-size:1.5rem;display:block;margin-bottom:8px}
.pdone p{color:var(--ink-2);font-size:.9rem;margin:0 0 18px}


/* ── dark theme ── */
html[data-theme="dark"]{
  --paper:#12151C;--card:#1A1F29;--ink:#E8EBF0;--ink-2:#A3ACBD;--ink-3:#6F7A8D;
  --rule:rgba(232,235,240,.14);--rule-2:rgba(232,235,240,.07);
}
html[data-theme="dark"] .plaque,html[data-theme="dark"] .navhome.on,
html[data-theme="dark"] .tbtn.primary{background:#2A3242}
html[data-theme="dark"] .item,html[data-theme="dark"] .scard,
html[data-theme="dark"] .track,html[data-theme="dark"] .dentry{box-shadow:0 1px 2px rgba(0,0,0,.25)}
html[data-theme="dark"] .pagecard img,html[data-theme="dark"] .thumb img{filter:brightness(.92)}
html{transition:none}
body,.top,.side,.item,.scard,.track,.dentry,.note,.tbtn{transition:background-color .25s,color .25s,border-color .25s}

/* ── polish ── */
.item,.scard,.track,.dentry,.pagecard .ph-wrap{will-change:transform}
.item:active,.dentry:active{transform:translateY(0) scale(.995)}
.tbtn:active,.playall:active,.gchip:active{transform:scale(.97)}
.item.speaking .fr::after{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--sc);margin-left:7px;vertical-align:middle;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.lhead h2{background:linear-gradient(180deg,var(--ink) 60%,color-mix(in srgb,var(--ink) 72%,var(--sc)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sechead .dot{box-shadow:0 0 0 0 color-mix(in srgb,var(--sc) 60%,transparent)}
.main>*{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
.main>*:nth-child(2){animation-delay:.03s}.main>*:nth-child(3){animation-delay:.06s}
.main>*:nth-child(4){animation-delay:.09s}.main>*:nth-child(n+5){animation-delay:.11s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}



/* ═══════════ HOME — hero ═══════════ */
.hero2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr);gap:44px;align-items:center;
  padding:12px 0 42px;border-bottom:1px solid var(--rule);margin-bottom:34px}
.eyebrow{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
.hero2 h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.4vw,3.15rem);
  line-height:1.03;letter-spacing:-.035em;margin:0 0 16px;max-width:16ch}
.hero2 p{color:var(--ink-2);font-size:1.02rem;line-height:1.6;max-width:46ch;margin:0 0 26px}
.hero2-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn-solid,.btn-ghost{border-radius:99px;padding:12px 24px;font-size:.92rem;font-weight:600;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.btn-solid{background:var(--ink);color:var(--paper);box-shadow:var(--shadow-md)}
.btn-solid:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-ghost{border:1.5px solid var(--rule);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

.hero2-r{display:flex;flex-direction:column;align-items:center;gap:20px}
.ring{position:relative;width:168px;height:168px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .rbg{stroke:var(--rule)}
.ring .rfg{stroke:var(--ink);transition:stroke-dasharray .9s var(--ease)}
.rmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rmid b{font-family:var(--display);font-size:2.1rem;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.rmid b i{font-size:1rem;font-style:normal;color:var(--ink-3);margin-left:1px}
.rmid span{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.minis{display:flex;gap:22px}
.mini{text-align:center}
.mini b{display:block;font-family:var(--display);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.mini span{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* resume */
.resume{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l g" "n g" "s g";
  gap:2px 16px;width:100%;text-align:left;align-items:center;
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--sc);
  border-radius:12px;padding:16px 18px;margin-bottom:38px;box-shadow:var(--shadow-sm);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.resume:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.resume .rl{grid-area:l;font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.resume .rn{grid-area:n;font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.resume .rs{grid-area:s;font-size:.8rem;color:var(--ink-3)}
.resume svg{grid-area:g;color:var(--ink-3)}

.seclabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:14px}

/* shelf of books */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.book{display:grid;grid-template-columns:5px 1fr auto;align-items:stretch;text-align:left;gap:0;
  background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
  box-shadow:var(--shadow-sm)}
.book:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--sc) 45%,transparent)}
.book .spine{background:var(--sc)}
.bmain{padding:17px 16px 15px;min-width:0;display:flex;flex-direction:column;gap:7px}
.btitle{font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.bblurb{font-size:.83rem;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bmeta{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.bbar{height:3px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:3px}
.bbar i{display:block;height:100%;background:var(--sc);border-radius:2px;transition:width .7s var(--ease)}
.bgo{display:grid;place-items:center;padding:0 15px;color:var(--ink-3);transition:transform .2s var(--ease),color .2s var(--ease)}
.book:hover .bgo{color:var(--sc);transform:translateX(3px)}

/* ═══════════ SECTION PAGE ═══════════ */
.shead{padding-bottom:22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.shead h2{font-family:var(--display);font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:800;
  letter-spacing:-.032em;line-height:1.05;margin:0 0 12px}
.shead p{color:var(--ink-2);font-size:.98rem;line-height:1.6;max-width:62ch;margin:0 0 16px}
.sstats{display:flex;gap:18px;flex-wrap:wrap}
.sstats span{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sstats span+span{padding-left:18px;border-left:1px solid var(--rule)}

.lgrid{display:flex;flex-direction:column;gap:9px}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px 17px;
  transition:transform .17s var(--ease),box-shadow .17s var(--ease),border-color .17s var(--ease);
  box-shadow:var(--shadow-sm)}
.lcard:hover{transform:translateX(3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--sc) 42%,transparent)}
.lnum{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.lmain{min-width:0;display:flex;flex-direction:column;gap:5px}
.llab{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--sc);
  filter:saturate(.85) brightness(.85)}
.lname{font-family:var(--display);font-size:1.08rem;font-weight:700;letter-spacing:-.018em;line-height:1.2}
.lsum{font-size:.83rem;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.lchips i{font-style:normal;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;
  border:1px solid var(--rule);border-radius:5px;padding:2px 7px;color:var(--ink-3)}
.lchips i.au{border-color:color-mix(in srgb,#B4532F 40%,transparent);color:#B4532F}
.lchips i.pg{border-color:color-mix(in srgb,#2E7D8C 40%,transparent);color:#2E7D8C}
.lcard.done{border-color:color-mix(in srgb,#2F7A55 40%,transparent)}
.ldone{color:#2F7A55;font-weight:700;font-size:.95rem;padding-top:2px}

/* sidebar chevron becomes its own hit area */
.sechead .chev{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  color:var(--ink-3);transition:transform .22s var(--ease),background .16s var(--ease)}
.sechead .chev:hover{background:var(--rule-2);color:var(--ink)}
.sec.open .sechead .chev{transform:rotate(90deg)}

@media (max-width:900px){
  .hero2{grid-template-columns:1fr;gap:30px;padding-bottom:32px}
  .hero2-r{flex-direction:row;justify-content:flex-start;gap:26px;flex-wrap:wrap}
  .ring{width:118px;height:118px}
  .rmid b{font-size:1.5rem}
  .shelf{grid-template-columns:1fr}
  .lcard{grid-template-columns:auto 1fr;gap:12px}
}

/* ─────────── refinement pass ─────────── */
:root{
  --shadow-sm:0 1px 2px rgba(22,35,58,.05),0 1px 3px rgba(22,35,58,.04);
  --shadow-md:0 4px 12px -4px rgba(22,35,58,.12),0 2px 4px rgba(22,35,58,.05);
  --shadow-lg:0 18px 40px -18px rgba(22,35,58,.28);
  --ease:cubic-bezier(.22,.68,.32,1);
}
html[data-theme="dark"]{
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px -4px rgba(0,0,0,.45);
  --shadow-lg:0 18px 44px -18px rgba(0,0,0,.6);
}

/* reading progress */
.progress{position:fixed;top:0;left:0;height:2px;z-index:60;
  background:linear-gradient(90deg,var(--sc),color-mix(in srgb,var(--sc) 45%,var(--ink)));
  width:0;transition:width .1s linear;border-radius:0 2px 2px 0}

/* cards */
.item,.track,.dentry{box-shadow:var(--shadow-sm)}
.item:hover,.track:hover,.dentry:hover{box-shadow:var(--shadow-md)}
.scard{box-shadow:var(--shadow-sm);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.item{position:relative;overflow:hidden}
.item::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sc);
  transform:scaleY(0);transform-origin:bottom;transition:transform .22s var(--ease)}
.item:hover::after,.item.speaking::after{transform:scaleY(1);transform-origin:top}

/* group headings */
.ghead{position:relative}
.ghead h3{letter-spacing:-.012em}
.group{scroll-margin-top:calc(var(--top) + 58px)}
.group+.group{margin-top:34px}

/* chips */
.gchip{transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease)}
.gchip.on{box-shadow:var(--shadow-sm)}

/* sidebar */
.les{position:relative;transition:background .16s var(--ease),color .16s var(--ease),padding-left .16s var(--ease)}
.les:hover{padding-left:20px}
.les.on{padding-left:20px}
.les.on::before{content:'';position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:2px;background:var(--sc)}
.sechead{transition:background .16s var(--ease)}
.sechead .dot{transition:transform .2s var(--ease)}
.sechead:hover .dot{transform:scale(1.35)}

/* top bar */
.top{backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  background:color-mix(in srgb,var(--paper) 82%,transparent)}
.top.scrolled{box-shadow:0 1px 0 var(--rule),0 6px 18px -14px rgba(22,35,58,.35)}
.tbtn{transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease)}

/* search field */
.searchwrap{transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.searchwrap:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 14%,transparent)}

/* headings */
.lhead h2{letter-spacing:-.03em;line-height:1.02}
.hero h1{letter-spacing:-.035em}

/* stat numbers tick in */
.stat b{font-variant-numeric:tabular-nums}

/* keyboard hint bar */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;
  border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;background:var(--card);
  font-family:var(--mono);font-size:.63rem;color:var(--ink-3)}
.shortcuts{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:20px;
  background:rgba(16,22,34,.5);backdrop-filter:blur(3px)}
.shortcuts[hidden]{display:none}
.shortcuts .box{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:24px 26px;
  max-width:420px;width:100%;box-shadow:var(--shadow-lg);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.shortcuts h4{font-family:var(--display);font-size:1.1rem;font-weight:800;margin:0 0 16px;letter-spacing:-.02em}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:.86rem;color:var(--ink-2)}
.srow+.srow{border-top:1px solid var(--rule-2)}

/* jump palette */
.palette{position:fixed;inset:0;z-index:97;display:flex;justify-content:center;align-items:flex-start;
  padding:12vh 18px 20px;background:rgba(16,22,34,.46);backdrop-filter:blur(3px)}
.palette[hidden]{display:none}
.pbox{background:var(--paper);border:1px solid var(--rule);border-radius:14px;width:min(560px,100%);
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s var(--ease)}
.pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.pin input{flex:1;border:0;background:none;font:inherit;font-size:1.02rem;color:var(--ink);outline:none;min-width:0}
.plist{max-height:min(52vh,420px);overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;
  font-size:.9rem;color:var(--ink-2)}
.pitem .pdot{width:7px;height:7px;border-radius:50%;flex:none}
.pitem strong{color:var(--ink);font-weight:600}
.pitem .psec{margin-left:auto;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);flex:none}
.pitem.sel,.pitem:hover{background:var(--rule-2)}
.pitem.sel{box-shadow:inset 0 0 0 1.5px var(--rule)}
.pempty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:.86rem}

/* focus ring */
:focus-visible{outline:2.5px solid var(--sc);outline-offset:3px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* dictionnaire */
.dico{margin-top:2px}
.dsearch{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--rule);
  border-radius:10px;padding:11px 14px;position:sticky;top:calc(var(--top) + 4px);z-index:20}
.dsearch:focus-within{border-color:var(--sc)}
.dsearch svg{flex:none;opacity:.45}
.dsearch input{flex:1;border:0;background:none;font:inherit;font-size:1rem;outline:none;min-width:0}
.dclear{color:var(--ink-3);font-size:1.3rem;line-height:1;padding:0 4px}
.dmeta{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 2px 10px}
.dlist{display:grid;gap:6px}
.dentry{display:grid;grid-template-columns:1fr;gap:1px;text-align:left;background:var(--card);
  border:1px solid var(--rule);border-left:3px solid var(--dc);border-radius:8px;padding:9px 12px;
  transition:transform .13s,border-color .13s}
.dentry:hover{transform:translateY(-1px);border-color:var(--dc)}
.dentry.speaking{box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 20%,transparent)}
.dfr{font-size:1rem;font-weight:600;line-height:1.3}
.dph{font-family:var(--mono);font-size:.75rem;color:var(--dc);filter:saturate(.8) brightness(.72)}
.den{font-size:.82rem;color:var(--ink-2);line-height:1.35}
.dwh{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.dentry mark{background:color-mix(in srgb,var(--dc) 30%,transparent);border-radius:2px;padding:0 1px}
.dmore{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);padding:14px 2px}
@media(min-width:720px){
  .dentry{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.1fr) 130px;
    align-items:baseline;gap:14px}
  .dwh{margin-top:0;text-align:right}
}

/* page strip + progress */
.pagestrip{display:flex;gap:9px;align-items:center;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.pagestrip::-webkit-scrollbar{display:none}
.striplab{flex:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);writing-mode:vertical-rl;transform:rotate(180deg);padding:2px 0}
.thumb{flex:none;background:none;border:0;padding:0;position:relative;width:64px}
.thumb img{width:100%;aspect-ratio:606/800;object-fit:cover;object-position:top;display:block;
  border:1px solid var(--rule);border-radius:5px;background:var(--card);transition:border-color .15s,transform .15s}
.thumb:hover img{border-color:var(--sc);transform:translateY(-2px)}
.thumb span{position:absolute;bottom:3px;right:4px;font-family:var(--mono);font-size:.58rem;
  background:rgba(22,35,58,.82);color:#fff;border-radius:3px;padding:1px 4px}
.thumb.broken img{visibility:hidden}
.donebar{margin-top:30px}
.donebtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:99px;
  padding:9px 18px;font-size:.86rem;font-weight:600;color:var(--ink-2);transition:all .15s}
.donebtn:hover{border-color:var(--sc);color:var(--ink)}
.donebtn.on{background:var(--sc);border-color:var(--sc);color:#fff}
.les .tick{float:right;color:#3F8F63;font-weight:700;font-size:.8rem}
.les.on .tick{color:inherit}

/* audio tracks */
.tracklist{display:flex;flex-direction:column;gap:8px}
.track{
  display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;
  background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:9px 12px;
}
.track .tn{
  font-family:var(--mono);font-size:.78rem;color:#fff;background:var(--sc);
  border-radius:5px;padding:3px 0;text-align:center;font-weight:500;
}
.track .tmeta{font-size:.82rem;color:var(--ink-2);line-height:1.35;min-width:0}
.track .tmeta em{color:var(--ink-3);font-style:normal;font-family:var(--mono);font-size:.74rem}
.track audio{grid-column:1 / -1;width:100%;height:34px;margin-top:2px}
.track.broken{opacity:.5}
@media (min-width:760px){
  .track{grid-template-columns:44px minmax(0,1fr) 300px;gap:12px}
  .track audio{grid-column:3;margin-top:0}
}

/* page gallery */
.pagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.pagecard{
  display:block;background:none;border:0;padding:0;text-align:center;
}
.pagecard .ph-wrap{
  display:block;background:var(--card);border:1px solid var(--rule);border-radius:6px;
  overflow:hidden;aspect-ratio:606/800;position:relative;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.pagecard:hover .ph-wrap{border-color:var(--sc);transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(22,35,58,.5)}
.pagecard img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pagecard .pn{
  display:block;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);margin-top:5px;
}
.pagecard.broken .ph-wrap{display:grid;place-items:center;background:var(--rule-2)}
.brokenmsg{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);line-height:1.5}

/* lightbox */
.lightbox{
  position:fixed;inset:0;z-index:95;background:rgba(16,22,34,.94);
  display:flex;align-items:center;justify-content:center;padding:38px 58px;
}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.7);background:#fff}
.lbclose{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;color:rgba(255,255,255,.75)}
.lbclose:hover{background:rgba(255,255,255,.12);color:#fff}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:10px;
  display:grid;place-items:center;color:rgba(255,255,255,.7)}
.lbnav:hover{background:rgba(255,255,255,.12);color:#fff}
.lbnav.prev{left:8px}.lbnav.next{right:8px}
.lbnum{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:rgba(255,255,255,.65)}
@media (max-width:600px){
  .lightbox{padding:52px 10px 42px}
  .lbnav{width:38px;height:52px}
  .pagegrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(22,35,58,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ══════════ RESPONSIVE ══════════ */
@media (max-width:1080px){ .main{padding:0 22px 80px} }
@media (max-width:860px){
  .menubtn{display:flex}
  .brand-txt{display:none}
  .kbd{display:none}
  .side{
    position:fixed;top:0;left:0;height:100vh;width:290px;z-index:80;background:var(--paper);
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    padding-top:16px;box-shadow:6px 0 30px -10px rgba(22,35,58,.3);
  }
  .side.on{transform:none}
  .main{padding:0 18px 80px}
  .speed{display:none}
  .tbtn .lbl{display:none}
  .tbtn{padding:7px 10px}
  .items.two,.items.three{grid-template-columns:1fr}
  .home-hero{padding:32px 0 24px}
}
@media (max-width:460px){
  .items.three{grid-template-columns:repeat(2,1fr)}
  .items.three .item{padding:9px 10px}
  .items.three .fr{font-size:.92rem}
  .items.three .fav{display:none}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>

<body>

<header class="top">
  <button class="tbtn menubtn" id="menubtn" aria-label="Open menu">
    <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <a class="brand" href="#home" style="text-decoration:none">
    <span class="mk">Fr</span>
    <span class="brand-txt"><b>Carnet</b><span>d'étude</span></span>
  </a>

  <label class="searchbox">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>

 "ew", "no English equivalent — say ee, then round your lips"], ["é — été, café, parler", "ay", "closed e, no glide at the end"], ["è / ê — père, fête, très", "eh", "open e, as in bed"], ["o fermé — mot, beau, eau", "oh", "closed o, lips tight"], ["o ouvert — porte, homme, école", "o", "open o, as in got"], ["eu fermé — deux, peu, bleu", "uh", "lips rounded, tongue forward"], ["eu ouvert — sœur, heure, fleur", "ur", "more open, as in fur without the r"], ["e muet — le, je, petit", "uh", "the weak e, often dropped in speech"]]}, {"name": "u contre ou — la paire qui compte", "note": "This pair changes meanings: <strong>tu</strong> (you) vs <strong>tout</strong> (everything) · <strong>dessus</strong> (on top) vs <strong>dessous</strong> (underneath) · <strong>rue</strong> (street) vs <strong>roue</strong> (wheel).<br><br><strong>How to make u:</strong> say <em>ee</em>. Hold the tongue exactly there. Now round your lips as if whistling. That is <em>u</em>.", "items": [["tu / tout", "tew / too", "you / everything"], ["rue / roue", "rew / roo", "street / wheel"], ["dessus / dessous", "duh-SEW / duh-SOO", "above / below"], ["pur / pour", "pewr / poor", "pure / for"], ["vu / vous", "vew / voo", "seen / you"]]}, {"name": "Les voyelles nasales", "note": "Air goes through the nose and the consonant is <strong>not</strong> pronounced — <em>bon</em> is not bonn. There are three, plus a fourth that most speakers now merge with the second.", "cols": "two", "items": [["an / am / en / em — grand, France, enfant", "ahn", "mouth open"], ["in / im / ain / ein / yn — vin, pain, main", "an", "mouth spread"], ["on / om — bon, nom, pont", "ohn", "lips rounded"], ["un / um — un, brun, lundi", "uhn", "merging with 'in' for most speakers"], ["ien — bien, rien, italien", "ee-AN", "the i is heard first"], ["oin — loin, point, besoin", "WAN", "w then the nasal"]]}, {"name": "Quand la nasale disparaît", "note": "A nasal stops being nasal when the n or m is <strong>doubled</strong> or followed by  gomme, légume", "g", "hard g"], ["ge / gi — âge, gilet, manger", "zh", "soft g"], ["nous mangeons", "noo mahn-ZHOHN", "the e keeps g soft before -ons"], ["nous commençons", "noo ko-mahn-SOHN", "the ç keeps c soft before -ons"]]}, {"name": "s entre deux voyelles", "note": "A single <strong>s</strong> between two vowels sounds like <strong>z</strong>. Double <strong>ss</strong> keeps the s sound. This is a real meaning-changer.", "items": [["poison / poisson", "pwa-ZOHN / pwa-SOHN", "poison / fish"], ["désert / dessert", "day-ZAIR / day-SAIR", "desert / dessert"], ["cousin / coussin", "koo-ZAN / koo-SAN", "cousin / cushion"], ["maison", "may-ZOHN", "house — single s, z sound"], ["classe", "KLAHSS", "class — double s, s sound"]]}]}, {"id": "pr-muettes", "label": "Les règles", "name": "Les lettres muettes", "summary": "The silent letters — which final consonants you drop, the one you never say, and why the feminine -e brings the consonant back to life.", "art": null, "groups": [{"name": "La règle générale", "note": "Final consonants are usually <strong>silent</strong>. The classic memory aid is <strong>C-R-F-L</strong> — <em>careful</em> — those four are the ones that are often <em>pronounced</em>: <em>ave<b>c</b>, bonjou<b>r</b>, neu<b>f</b>, il<b>s</b> parlen<b>t</b>… no — hôte<b>l</b></em>.", "cols": "two", "items": [["français", "frahn-SAY", "final s silent"], ["petit", "puh-TEE", "final t silent"], ["grand", "GRAHN", "final d silent"], ["nez", "NAY", "final z silent"], ["beaucoup", "bo-KOO", "final p silent"], ["avec", "a-VEK", "final c pronounced"], ["bonjour", "bohn-ZHOOR", "final r pronounced"], ["neuf", "NUHF", "final f pronounced"], ["hôtel", "o-TELL", "final l pronounced"]]}, {"name": "Le -e final et le féminin", "note": "Adding <strong>-e</strong> makes the consonant before it audible. This is the entire acoustic basis of gender in French.", "cols": "two", "items": [["petit → petite", "puh-TEE → puh-TEET", "t wakes up"], ["grand → grande", "GRAHN → GRAHND", "d wakes up"], ["français → française", "frahn-SAY → frahn-SEZ", "s wakes up as z"], ["étudiant → étudiante", "ay-tew-dee-AHN → ay-tew-dee-AHNT", "t wakes up"], ["vert → verte", "VAIR → VAIRT", "t wakes up"]]}, {"name": "Les terminaisons de verbe", "note": "<strong>-e, -es, -ent</strong> are all silent, so four of the six present-tense forms of an -er verb sound identical.", "items": [["je parle · tu parles · il parle · ils parlent", "parl", "all four identical"], ["nous parlons", "par-LOHN", "-ons is heard"], ["vous parlez", "par-LAY", "-ez is heard"], ["ils mangent", "eel MAHNZH", "-ent silent, never 'ent'"]]}, {"name": "Le h et le e muet", "note": "<strong>h</strong> is never pronounced. But there are two kinds: <em>h muet</em> allows elision (l'hôtel), while <em>h aspiré</em> blocks it (le héros, le hall) — you still don't say the h, you just can't contract.", "items": [["l'hôtel / l'homme / l'heure", "lo-TELL / LOM / LUR", "h muet — elision happens"], ["le héros / le hall / la Hollande", "luh ay-RO / luh OL", "h aspiré — no elision"], ["je ne sais pas → j'sais pas", "zhuh nuh say PAH → shay PAH", "the e muet drops in fast speech"], ["petit → p'tit", "puh-TEE → PTEE", "very common in speech"]]}]}, {"id": "pr-liaison", "label": "Les règles", "name": "La liaison et l'enchaînement", "summary": "When a silent final consonant jumps onto the next word — when you must do it, when you must not, and the sound each letter takes.", "art": null, "groups": [{"name": "Comment ça marche", "note": "When a word ending in a silent consonant is followed by a word starting with a <strong>vowel or silent h</strong>, that consonant is pronounced and attaches to the next word.", "cols": "two", "items": [["s → z : les amis", "lay za-MEE", "the friends"], ["s → z : vous êtes", "voo ZET", "you are"], ["x → z : deux enfants", "duh zahn-FAHN", "two children"], ["t : c'est un ami", "say tuh na-MEE", "he's a friend"], ["t : petit ami", "puh-tee ta-MEE", "boyfriend"], ["n : un homme", "uh NOM", "a man"], ["n : mon amie", "moh na-MEE", "my friend (f)"], ["d → t : un grand homme", "uhn grahn TOM", "a great man"], ["f → v : neuf ans", "nuh VAHN", "nine years"]]}, {"name": "Les liaisons obligatoires", "cols": "two", "items": [["article + nom : les enfants", "lay zahn-FAHN", "after a determiner"], ["adjectif + nom : petits enfants", "puh-tee zahn-FAHN", "adjective before noun"], ["pronom + verbe : nous avons", "noo za-VOHN", "subject pronoun + verb"], ["verbe + pronom : ont-ils", "ohn TEEL", "in inversion"], ["après est : c'est ici", "say tee-SEE", "after est"], ["après en, dans, chez, sous : en avion", "ah na-vee-OHN", "after short prepositions"], ["après très, bien, plus : très intéressant", "tray zan-tay-ray-SAHN", "after these adverbs"]]}, {"name": "Les liaisons interdites", "note": "Never link after <strong>et</strong>, before <strong>h aspiré</strong>, after a singular noun, or before <em>oui</em> and <em>onze</em>.", "items": [["et // une amie", "ay ewn a-MEE", "never after et"], ["les // héros", "lay ay-RO", "h aspiré blocks it"], ["un enfant // intelligent", "uh nahn-FAHN an-tay-lee-ZHAHN", "not after a singular noun"], ["les // onze élèves", "lay ohnz ay-LEV", "onze blocks liaison"], ["mais // oui", "may WEE", "oui blocks liaison"]]}, {"name": "La liaison qui change le sens", "note": "Sometimes the liaison carries the entire meaning of the sentence.", "items": [["ils sont / ils ont", "eel SOHN / eel ZOHN", "they are / they have"], ["elles sont / elles ont", "el SOHN / el ZOHN", "they are / they have"], ["c'est / c'est un", "SAY / say TUHN", "it is / it's a"]]}, {"name": "L'enchaînement", "note": "Different from liaison: here the final consonant is <strong>already pronounced</strong> and simply slides onto the next word. This is why spoken French sounds like one continuous stream.", "items": [["il arrive", "ee-la-REEV", "the l slides across"], ["une amie", "ew-na-MEE", "the n slides across"], ["quelle heure est-il ?", "kel UR ay-TEEL", "what time is it?"], ["avec elle", "a-ve-KELL", "with her"]]}]}, {"id": "pr-rythme", "label": "Les règles", "name": "L'accent et le rythme", "summary": "Where the stress falls, why French sounds flat to English ears, and how intonation alone turns a statement into a question.", "art": null, "groups": [{"name": "L'accent tonique", "note": "French does <strong>not</strong> stress inside words the way English does. The stress lands on the <strong>last syllable of the group</strong>, and every other syllable gets roughly equal length. That is why French sounds even, almost machine-like, compared to English.", "items": [["un restaurant", "uhn res-to-RAHN", "stress on the last syllable"], ["un restaurant japonais", "uhn res-to-rahn zha-po-NAY", "stress moves to the end of the group"], ["C'est un très bon restaurant japonais.", "say tuhn tray bohn res-to-rahn zha-po-NAY", "one stress, right at the end"], ["Bonjour, madame.", "bohn-zhoor ma-DAM", "the group ends on madame"]]}, {"name": "Les groupes rythmiques", "note": "French is spoken in <strong>breath groups</strong>, not word by word. Inside a group the words run together with liaison and enchaînement, and only the final syllable is lengthened.", "items": [["Je m'appelle Marie. / Je suis française.", "zhuh ma-pell ma-REE / zhuh swee frahn-SEZ", "two groups, two stresses"], ["Il habite à Paris avec sa famille.", "ee-la-beet a pa-REE / a-vek sa fa-MEE", "two groups"], ["Vous avez une chambre pour ce soir ?", "voo za-vay ewn SHAHM-bruh / poor suh SWAHR", "two groups"]]}, {"name": "L'intonation", "note": "Rising at the end = question. Falling = statement. In French this alone is enough — you need no other change.", "items": [["Vous êtes français. ↘", "voo ZET frahn-SAY", "statement, voice falls"], ["Vous êtes français ? ↗", "voo ZET frahn-SAY", "question, voice rises"], ["Ça va. ↘", "sa VA", "I'm fine."], ["Ça va ? ↗", "sa VA", "How are you?"], ["C'est magnifique ! ↘", "say ma-nyee-FEEK", "exclamation, strong fall"]]}, {"name": "Conseils de prononciation", "note": "Four habits that make the biggest difference for an English speaker.", "items": [["Ne diphtonguez pas les voyelles.", "nuh dee-tohn-gay pah lay vwa-YELL", "Keep vowels pure — French é does not glide into 'ay-ee'."], ["Ne soufflez pas les p, t, k.", "nuh soo-flay pah lay pay tay kah", "No puff of air after p, t, k — hold your hand to your mouth and check."], ["Gardez le rythme égal.", "gar-day luh reetm ay-GAL", "Give each syllable the same length, stress only the last."], ["Liez les mots.", "lee-ay lay MO", "Run the words together — French has no gaps between words."]]}]}, {"id": "pr-alphabet", "label": "Les règles", "name": "Sons et orthographe", "summary": "The letter combinations that always make the same sound — read these and you can pronounce a French word you have never seen.", "art": null, "groups": [{"name": "Les groupes de voyelles", "cols": "two", "items": [["ai / ei — mais, neige, treize", "eh", "open e"], ["au / eau — au, beau, eau", "oh", "closed o"], ["ou — bonjour, vous", "oo", "as in soon"], ["oi — trois, moi, boire", "wah", "w + a"], ["eu / œu — deux, sœur, cœur", "uh", "rounded, tongue forward"], ["ai + n — pain, main, bain", "an", "nasal"], ["ui — huit, lui, cuisine", "wee", "French u then ee"], ["ay — pays, crayon", "ay-ee", "two sounds"]]}, {"name": "Les groupes de consonnes", "cols": "two", "items": [["ch — chat, chercher", "sh", "never ch as in church"], ["ph — photo, téléphone", "f", "f"], ["th — thé, théâtre", "t", "the h is ignored"], ["gn — montagne, espagnol", "ny", "as in canyon"], ["qu — qui, quatre", "k", "never kw"], ["ss — poisson, classe", "s", "hard s between vowels"], ["ti + on — nation, attention", "see-OHN", "t becomes s"], ["x — six, dix", "ss", "at the end: sees, dees"], ["x — deuxième, exemple", "z / gz", "between vowels"]]}, {"name": "Les accents et ce qu'ils font", "note": "Only <strong>é, è, ê</strong> change the sound. The accents on a, i, o, u are historical and change nothing you can hear — except <strong>ç</strong>, which changes c to s.", "cols": "two", "items": [["é — accent aigu : été, café", "ay", "closed e"], ["è — accent grave : père, très", "eh", "open e"], ["ê — circonflexe : fête, être", "eh", "open e, often marks a lost s"], ["à / ù — grave : à, où", "no change", "distinguishes words only"], ["â / î / ô / û — circonflexe : âge, île", "no real change", "often marks a lost s: hôpital ← hospital"], ["ë / ï — tréma : Noël, naïf", "split", "the two vowels are said separately"], ["ç — cédille : ça, français", "s", "keeps c soft before a, o, u"]]}]}, {"id": "pr-x-pr-1", "label": "Complément", "name": "Les lettres muettes", "summary": "French writes far more than it says. The letters you leave out — and the moments they wake up.", "art": null, "groups": [{"name": "La consonne finale est muette", "items": [["français", "frahn-SAY", "final s silent"], ["petit", "puh-TEE", "final t silent"], ["grand", "GRAHN", "final d silent"], ["beaucoup", "bo-KOO", "final p silent"], ["tabac", "ta-BAH", "final c silent"], ["nez", "NAY", "final z silent"], ["chez", "SHAY", "final z silent"], ["trop", "TRO", "final p silent"], ["deux", "DUH", "final x silent"], ["Paris", "pa-REE", "final s silent"]], "cols": "two", "note": "The default: a consonant at the end of a word is <strong>not pronounced</strong>."}, {"name": "CaReFuL — les consonnes qui se prononcent", "items": [["avec", "a-VEK", "c is heard"], ["par", "PAR", "r is heard"], ["actif", "ak-TEEF", "f is heard"], ["il", "EEL", "l is heard"], ["hiver", "ee-VAIR", "r is heard"], ["sportif", "spor-TEEF", "f is heard"], ["bonjour", "bohn-ZHOOR", "r is heard"], ["seul", "SUL", "l is heard"]], "cols": "two", "note": "The exceptions spell out <strong>C-a-R-e-F-u-L</strong>: final <strong>c, r, f, l</strong> are usually pronounced. But not in <em>-er</em> verb endings (parler → par-LAY), and not in <em>blanc</em> or <em>estomac</em>."}, {"name": "Le e final est muet", "items": [["une table", "ewn TAH-bluh", "the final e is barely there"], ["il parle", "eel PARL", "silent e"], ["grande", "GRAHND", "e silent, but d now heard"], ["quatre", "KAT-ruh", "the e supports the tr"], ["madame", "ma-DAM", "silent e"]], "cols": "two", "note": "A final <strong>-e</strong> is silent — but it makes the consonant before it audible. That is the whole masculine/feminine sound difference."}, {"name": "Le h ne se prononce jamais", "items": [["l'hôtel", "lo-TELL", "h muet — elision happens"], ["j'habite", "zha-BEET", "h muet"], ["l'homme", "LUM", "h muet"], ["le héros", "luh ay-RO", "h aspiré — no elision"], ["les haricots", "lay a-ree-KO", "h aspiré — no liaison"]], "cols": "two", "note": "<strong>H is never a sound.</strong> But there are two kinds: <em>h muet</em> lets elision and liaison happen, <em>h aspiré</em> blocks them. Nothing in the spelling tells you which — it is learnt with the word."}, {"name": "Les terminaisons verbales muettes", "items": [["je parle / ils parlent", "zhuh PARL / eel PARL", "-e and -ent both silent"], ["tu parles", "tew PARL", "-es silent"], ["ils aiment", "eel ZEM", "-ent silent"], ["elles arrivent", "el za-REEV", "-ent silent"]], "cols": "two", "note": "<strong>-ent</strong> on a verb is completely silent, which is why four of the six present-tense forms sound identical."}]}, {"id": "pr-x-pr-2", "label": "Complément", "name": "Les voyelles et les groupes de lettres", "summary": "Which letters make which sound, including the two vowels English does not have.", "art": null, "groups": [{"name": "Les deux voyelles difficiles", "items": [["tu, une, rue, salut", "tew, ewn, rew, sa-LEW", "the u sound"], ["vous, nous, jour, beaucoup", "voo, noo, zhoor, bo-KOO", "the ou sound"], ["dessus / dessous", "duh-SEW / duh-SOO", "above / below"], ["tu / tout", "TEW / TOO", "you / everything"], ["rue / roue", "REW / ROO", "street / wheel"]], "cols": "two", "note": "<strong>u</strong> has no English equivalent: say <em>ee</em> and, without moving your tongue, round your lips as if whistling. <strong>ou</strong> is plain <em>oo</em>. Confusing them changes the word."}, {"name": "Les accents", "items": [["é — accent aigu", "ay", "l'été, café, préféré"], ["è — accent grave", "eh", "le père, très, j'achète"], ["ê — accent circonflexe", "eh", "la fête, être, la tête"], ["ë — tréma", "eh", "Noël (no-ELL), naïf (na-EEF)"], ["ç — cédille", "ss", "le garçon, français, ça"], ["à / ù", "ah / ew", "only distinguish words, no sound change"]], "cols": "two", "note": "The <strong>tréma</strong> means 'say this vowel separately'. The <strong>cédille</strong> keeps c soft before a, o, u."}]}, {"id": "pr-x-pr-3", "label": "Complément", "name": "Les voyelles nasales", "summary": "The sound that makes French sound French — air through the nose, and an n you never pronounce.", "art": null, "groups": [{"name": "Les nasales", "items": [["an / am / en / em → ahn", "ahn", "France, enfant, comment, temps"], ["in / im / ain / ein / aim → an", "an", "vin, important, pain, plein, faim"], ["on / om → ohn", "ohn", "bonjour, nom, prénom, ils sont"], ["un / um → uhn", "uhn", "un, brun, lundi, parfum"], ["ien → yan", "yan", "bien, italien, il vient"], ["oin → wan", "wan", "loin, le point, moins"]], "cols": "two", "note": "A nasal happens when a vowel is followed by <strong>n</strong> or <strong>m</strong> closing the syllable. The n or m itself is <strong>never pronounced</strong> — the air goes through the nose. Many speakers now merge <em>un</em> into <em>in</em>."}]}, {"id": "pr-x-pr-4", "label": "Complément", "name": "Les consonnes particulières", "summary": "The letters that behave differently from English: c, g, s, ch, gn, qu, th, ph and the famous r.", "art": null, "groups": [{"name": "c et g : durs ou doux", "items": [["c + a, o, u → k", "k", "le café, comment, la cuisine"], ["c + e, i, y → s", "ss", "c'est, le cinéma, le cycle"], ["ç → s", "ss", "le garçon, français, nous commençons"], ["g + a, o, u → g dur", "g", "la gare, le gâteau"], ["g + e, i, y → zh", "zh", "le genre, gentil, la gymnastique"], ["ge devant a, o → zh", "zh", "nous mangeons, nous voyageons"]], "cols": "two", "note": "This is exactly why <em>nous commençons</em> needs a cédille and <em>nous mangeons</em> keeps its e — to protect the soft sound before -ons."}, {"name": "s, ss, ch, gn, qu, th, ph", "items": [["s entre deux voyelles → z", "z", "la maison (may-ZOHN), la chose, désolé"], ["ss → s", "ss", "aussi, la classe, le dessert"], ["ch → sh", "sh", "le chat, chinois, chercher"], ["gn → ny", "ny", "l'Espagne, espagnol, la montagne"], ["qu → k", "k", "quatre, quel, la musique, qui"], ["th → t", "t", "le théâtre, Thomas"], ["ph → f", "f", "la photo, le téléphone, la philosophie"]], "cols": "two", "note": "One s between two vowels says <strong>z</strong>; a double ss says <strong>s</strong>. That is the entire difference between <em>le poisson</em> (fish) and <em>le poison</em> (poison)."}, {"name": "Le r français", "items": [["Paris", "pa-REE", "from the back of the throat"], ["rouge", "ROOZH", "not an English r, not a rolled r"], ["merci", "mair-SEE", "softer between vowels"], ["bonjour", "bohn-ZHOOR", "final r is pronounced"], ["parler", "par-LAY", "but -er on a verb is just ay"]], "cols": "two", "note": "The French <strong>r</strong> is made at the back of the throat, close to a soft gargle. Start from the sound in the Scottish <em>loch</em> and add voice."}]}, {"id": "pr-x-pr-5", "label": "Complément", "name": "La liaison et l'élision", "summary": "How French glues words together — the silent consonant that returns, and the vowel that gets dropped.", "art": null, "groups": [{"name": "La liaison obligatoire", "items": [["vous êtes", "voo ZET", "s → z"], ["nous avons", "noo za-VOHN", "s → z"], ["ils ont", "eel ZOHN", "s → z"], ["les enfants", "lay zahn-FAHN", "s → z"], ["des amis", "day za-MEE", "s → z"], ["un grand homme", "uhn grahn TOM", "d → t"], ["il est étudiant", "eel ay tay-tew-dee-AHN", "t links"], ["deux heures", "duh ZUR", "x → z"], ["mon ami", "moh na-MEE", "n links"], ["très intéressant", "tray zan-tay-ray-SAHN", "s → z"], ["chez elle", "shay ZELL", "z → z"], ["quand il arrive", "kahn teel a-REEV", "d → t"]], "cols": "two", "note": "A silent final consonant <strong>comes back</strong> before a vowel — and it changes sound: <strong>s</strong> and <strong>x</strong> become <strong>z</strong>, <strong>d</strong> becomes <strong>t</strong>."}, {"name": "La liaison interdite", "items": [["et | il est arrivé", "ay | eel", "never after et"], ["les | héros", "lay | ay-RO", "h aspiré blocks it"], ["Paris | est belle", "pa-REE | ay bell", "not after a proper name"], ["comment allez-vous ?", "ko-mahn ta-lay VOO", "but this fixed phrase does link"]], "cols": "two", "note": "Never link after <strong>et</strong>, never before an <em>h aspiré</em>, and normally not after a singular noun or a name."}, {"name": "L'élision", "items": [["je + aime → j'aime", "ZHEM", "je → j'"], ["ne + est → n'est", "NAY", "ne → n'"], ["le + hôtel → l'hôtel", "lo-TELL", "le → l'"], ["la + université → l'université", "lew-nee-vair-see-TAY", "la → l'"], ["de + Italie → d'Italie", "dee-ta-LEE", "de → d'"], ["que + est-ce → qu'est-ce", "KESS", "que → qu'"], ["me + appelle → je m'appelle", "zhuh ma-PELL", "me → m'"], ["si + il → s'il vous plaît", "seel voo PLEH", "si → s'"]], "cols": "two", "note": "Short words ending in a vowel <strong>drop it</strong> before another vowel: je, me, te, se, le, la, de, ne, que, ce. <em>si</em> elides only before <em>il / ils</em>."}]}, {"id": "pr-x-pr-6", "label": "Complément", "name": "L'accent, le rythme et l'intonation", "summary": "Where the stress falls, why every syllable is the same length, and how your voice signals a question.", "art": null, "groups": [{"name": "L'accent tombe à la fin", "items": [["le restaurant", "luh res-to-RAHN", "stress on the last syllable"], ["la télévision", "lah tay-lay-vee-zee-OHN", "stress on the last syllable"], ["c'est intéressant", "set an-tay-ray-SAHN", "stress at the end of the group"], ["je voudrais un café", "zhuh voo-dreh zuhn ka-FAY", "one stress, right at the end"]], "cols": "two", "note": "French stresses the <strong>last syllable of a word group</strong>, not each word. English stresses every word individually — that is the single biggest giveaway of an English accent."}, {"name": "Des syllabes égales", "items": [["im-por-tant", "an-por-TAHN", "three even beats"], ["ma-de-moi-selle", "mad-mwa-ZELL", "even beats, no weak vowels"], ["a-mé-ri-cain", "a-may-ree-KAN", "even beats"]], "cols": "two", "note": "French has no weak 'uh' vowels the way English does in <em>tele-vi-shun</em>. Every syllable is about the same length; only the last is stretched."}, {"name": "Le e qui disparaît", "items": [["je ne sais pas → j'sais pas", "shay PAH", "dropped in fast speech"], ["il y a → y'a", "YAH", "very common spoken form"], ["tu es → t'es", "TAY", "informal"], ["petite", "puh-TEET", "the first e barely sounds"]], "cols": "two", "note": "In everyday speech many <strong>e</strong> sounds simply vanish. Recognising this is what makes fast French suddenly understandable."}]}]}, {"id": "nombres", "name": "Nombres", "short": "Nombres", "color": "#B5478F", "blurb": "Zero to a hundred one at a time, then hundreds, thousands, years and phone numbers — with the arithmetic hiding inside 70, 80 and 90.", "lessons": [{"id": "num-100", "label": "Leçon 1", "name": "Compter de 0 à 100", "summary": "Every number one by one, plus the et-versus-hyphen rule that trips up most learners.", "art": "seventy", "groups": [{"name": "Les règles", "note": "<strong>et</strong> appears only before <code>un</code> — vingt et un, trente et un, quarante et un, cinquante et un, soixante et un — and at <strong>71</strong> (soixante et onze). Everything else takes a hyphen: vingt-deux, quatre-vingt-un, quatre-vingt-onze.<br><br><strong>70 is 'sixty-ten'</strong> and <strong>80 is 'four twenties'</strong>. Belgium and Switzerland use the far easier <em>septante</em> and <em>nonante</em>, but standard French does not.<br><br><strong>cent</strong> takes an -s when multiplied and nothing follows: <em>deux cents</em>, but <em>deux cent cinquante</em>. <strong>mille</strong> never changes.", "items": [["vingt et un", "van-tay-UHN", "21 — with et"], ["vingt-deux", "van-DUH", "22 — with a hyphen"], ["soixante et onze", "swa-sahnt-ay-ONZ", "71 — the only et above 61"], ["quatre-vingt-un", "kat-ruh-van-UHN", "81 — no et"], ["quatre-vingt-onze", "kat-ruh-van-ONZ", "91 — no et"], ["deux cents", "duh SAHN", "200 — cent takes -s"], ["deux cent cinquante", "duh sahn sank-AHNT", "250 — cent loses the -s"], ["mille", "meel", "1000 — never takes -s"]]}, {"name": "0 à 20", "cols": "three", "items": [["zéro", "zay-RO", "0"], ["un", "uhn", "1"], ["deux", "duh", "2"], ["trois", "twah", "3"], ["quatre", "KAT-ruh", "4"], ["cinq", "sank", "5"], ["six", "sees", "6"], ["sept", "set", "7"], ["huit", "weet", "8"], ["neuf", "nuhf", "9"], ["dix", "dees", "10"], ["onze", "onz", "11"], ["douze", "dooz", "12"], ["treize", "trez", "13"], ["quatorze", "ka-TORZ", "14"], ["quinze", "kanz", "15"], ["seize", "sez", "16"], ["dix-sept", "dee-SET", "17"], ["dix-huit", "dee-ZWEET", "18"], ["dix-neuf", "deez-NUHF", "19"], ["vingt", "van", "20"]]}, {"name": "21 à 40", "cols": "three", "items": [["vingt et un", "van-tay-UHN", "21"], ["vingt-deux", "van-DUH", "22"], ["vingt-trois", "van-TWAH", "23"], ["vingt-quatre", "van-KAT-ruh", "24"], ["vingt-cinq", "van-SANK", "25"], ["vingt-six", "van-SEES", "26"], ["vingt-sept", "van-SET", "27"], ["vingt-huit", "van-WEET", "28"], ["vingt-neuf", "van-NUHF", "29"], ["trente", "trahnt", "30"], ["trente et un", "trahnt-ay-UHN", "31"], ["trente-deux", "trahnt-DUH", "32"], ["trente-trois", "trahnt-TWAH", "33"], ["trente-quatre", "trahnt-KAT-ruh", "34"], ["trente-cinq", "trahnt-SANK", "35"], ["trente-six", "trahnt-SEES", "36"], ["trente-sept", "trahnt-SET", "37"], ["trente-huit", "trahnt-WEET", "38"], ["trente-neuf", "trahnt-NUHF", "39"], ["quarante", "ka-R
