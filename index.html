<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français — carnet d'étude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3EF;
  --card:#FFFFFF;
  --ink:#16233A;
  --ink-2:#55607A;
  --ink-3:#8E96A6;
  --rule:rgba(22,35,58,.13);
  --rule-2:rgba(22,35,58,.07);
  --line:#16233A;
  --star:#E0A200;
  --display:"Bricolage Grotesque","Helvetica Neue",sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --top:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2.5px solid var(--line);outline-offset:2px;border-radius:4px}
::selection{background:rgba(22,35,58,.14)}

/* ══════════ TOP BAR ══════════ */
.top{
  position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;
  background:rgba(244,243,239,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mk{
  width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem;
}
.brand b{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:-3px}
.brand-txt{display:block}

.searchbox{
  flex:1;max-width:460px;display:flex;align-items:center;gap:9px;
  background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:7px 11px;
  transition:border-color .15s,box-shadow .15s;
}
.searchbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,35,58,.07)}
.searchbox input{flex:1;border:0;background:none;font:inherit;font-size:.9rem;outline:none;min-width:0}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox svg{flex:none;opacity:.4}
.kbd{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);border:1px solid var(--rule);
  border-radius:4px;padding:1px 5px;flex:none}

.topact{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.tbtn{
  display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:8px;
  padding:7px 12px;font-size:.83rem;font-weight:500;transition:all .15s;white-space:nowrap;
}
.tbtn:hover{border-color:var(--ink)}
.tbtn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn.primary:hover{opacity:.88}
.speed{
  font-family:var(--mono);font-size:.72rem;border:1.5px solid var(--rule);border-radius:8px;
  padding:7px 6px;background:var(--card);color:var(--ink-2);
}
.menubtn{display:none}
.voicedot{width:7px;height:7px;border-radius:50%;background:#3F8F63;flex:none}
.voicedot.bad{background:#C4562F}

/* ══════════ SHELL ══════════ */
.shell{display:flex;padding-top:var(--top);min-height:100vh}

/* ══════════ SIDEBAR ══════════ */
.side{
  width:274px;flex:none;border-right:1px solid var(--rule);
  position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;
  padding:16px 12px 40px;
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
.sidelabel{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);padding:0 10px;margin:6px 0 8px;
}
.navhome{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--ink-2);
}
.navhome:hover{background:var(--rule-2);color:var(--ink)}
.navhome.on{background:var(--ink);color:#fff}
.navhome .ic{opacity:.6}
.navhome.on .ic{opacity:1}

.sec{margin-bottom:3px}
.sechead{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--ink);
  transition:background .13s;
}
.sechead:hover{background:var(--rule-2)}
.sechead .dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.sechead .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead .ct{font-family:var(--mono);font-size:.64rem;color:var(--ink-3);font-weight:400}
.sechead .chev{transition:transform .2s;opacity:.45;flex:none}
.sec.open .sechead .chev{transform:rotate(90deg)}

.lessons{display:none;padding:2px 0 8px 19px;margin-left:5px;border-left:2px solid var(--rule-2)}
.sec.open .lessons{display:block}
.les{
  display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;
  font-size:.85rem;color:var(--ink-2);line-height:1.35;transition:background .13s,color .13s;
}
.les:hover{background:var(--rule-2);color:var(--ink)}
.les.on{background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--ink);font-weight:600}
.les .lb{
  display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--sc);filter:saturate(.9) brightness(.82);margin-bottom:1px;
}
.les.on .lb{font-weight:500}

/* ══════════ MAIN ══════════ */
.main{flex:1;min-width:0;padding:0 30px 90px;max-width:1000px}

/* home */
.home-hero{padding:44px 0 30px;border-bottom:1px solid var(--rule);margin-bottom:30px}
.home-hero h1{
  font-family:var(--display);font-weight:800;font-size:clamp(2rem,5.4vw,3.1rem);
  line-height:1;margin:0 0 14px;letter-spacing:-.025em;max-width:16ch;
}
.home-hero p{margin:0;color:var(--ink-2);max-width:56ch;font-size:.98rem;line-height:1.6}
.figures{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.fig b{font-family:var(--display);font-size:1.55rem;font-weight:800;display:block;line-height:1}
.fig span{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.scard{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s,border-color .16s;
}
.scard:hover{transform:translateY(-2px);box-shadow:0 8px 22px -14px rgba(22,35,58,.4);border-color:color-mix(in srgb,var(--sc) 45%,var(--rule))}
.scard .bar{height:4px;background:var(--sc)}
.scard .body{padding:16px 17px 8px}
.scard h3{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0 0 5px;letter-spacing:-.015em}
.scard .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.scard p{margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.55}
.scard ul{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--rule-2)}
.scard li{border-bottom:1px solid var(--rule-2)}
.scard li:last-child{border-bottom:0}
.scard li button{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:9px 17px;
  font-size:.85rem;color:var(--ink-2);transition:background .12s,color .12s;
}
.scard li button:hover{background:var(--rule-2);color:var(--ink)}
.scard li .lb{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);filter:brightness(.8);flex:none;min-width:76px}
.scard li .n{flex:1;min-width:0}
.scard li .c{font-family:var(--mono);font-size:.62rem;color:var(--ink-3)}

/* lesson view */
.crumb{
  display:flex;align-items:center;gap:7px;padding:22px 0 0;
  font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  flex-wrap:wrap;
}
.crumb button{color:var(--ink-3);transition:color .13s}
.crumb button:hover{color:var(--ink)}
.crumb .cur{color:var(--sc);filter:brightness(.8)}

.lhead{padding:12px 0 22px;border-bottom:2px solid var(--sc);margin-bottom:8px}
.ltag{
  display:inline-block;font-family:var(--mono);font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;
  background:var(--sc);color:#fff;padding:4px 10px;border-radius:4px;margin-bottom:11px;
}
.lhead h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4.2vw,2.35rem);line-height:1.03;margin:0 0 9px;letter-spacing:-.025em}
.lhead p{margin:0;color:var(--ink-2);font-size:.94rem;max-width:60ch;line-height:1.6}

.lnav{
  position:sticky;top:var(--top);z-index:30;background:var(--paper);
  padding:11px 0;margin-bottom:14px;border-bottom:1px solid var(--rule);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
}
.lnav::-webkit-scrollbar{display:none}
.gchip{
  flex:none;border:1.5px solid var(--rule);border-radius:99px;padding:5px 13px;
  font-size:.79rem;color:var(--ink-2);white-space:nowrap;transition:all .13s;
}
.gchip:hover{border-color:var(--sc);color:var(--ink)}
.gchip.on{background:var(--sc);border-color:var(--sc);color:#fff}

.art{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:20px;margin:0 0 24px;overflow:hidden;
}
.art svg{display:block;width:100%;height:auto;max-width:620px;margin:0 auto}
.art figcaption{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);text-align:center;margin-top:14px;
}

.group{margin-bottom:34px;scroll-margin-top:calc(var(--top) + 60px)}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.ghead h3{font-family:var(--display);font-weight:600;font-size:1.04rem;margin:0;letter-spacing:-.012em}
.ghead .right{display:flex;align-items:center;gap:10px}
.gct{font-family:var(--mono);font-size:.64rem;color:var(--ink-3)}
.playall{
  display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:99px;
  padding:4px 12px 4px 9px;font-family:var(--mono);font-size:.65rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);transition:all .13s;
}
.playall:hover{border-color:var(--sc);color:var(--ink)}
.playall.on{background:var(--sc);border-color:var(--sc);color:#fff}

.note{
  background:color-mix(in srgb,var(--sc) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--sc) 26%,transparent);
  border-radius:10px;padding:13px 16px;margin:0 0 14px;
  font-size:.87rem;line-height:1.62;color:var(--ink-2);
}
.note strong{color:var(--ink);font-weight:600}
.note em{font-style:normal;font-weight:500;color:var(--ink)}
.note code{font-family:var(--mono);font-size:.93em;background:rgba(22,35,58,.06);padding:1px 5px;border-radius:4px}

.items{display:grid;gap:7px}
.items.two{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.items.three{grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}

.item{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:11px 38px 11px 13px;
  transition:border-color .14s,box-shadow .14s,transform .14s;
}
.item:hover{border-color:color-mix(in srgb,var(--sc) 50%,var(--rule));transform:translateY(-1px)}
.item.speaking{border-color:var(--sc);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 20%,transparent)}
.item .en{display:block;font-size:.735rem;color:var(--ink-3);line-height:1.35;margin-bottom:2px}
.item .fr{display:block;font-size:1rem;font-weight:600;line-height:1.32;letter-spacing:-.005em}
.item .ph{display:block;font-family:var(--mono);font-size:.745rem;line-height:1.4;margin-top:2px;
  color:var(--sc);filter:saturate(.8) brightness(.7)}
.item mark{background:color-mix(in srgb,var(--sc) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.fav{
  position:absolute;top:7px;right:6px;width:26px;height:26px;border-radius:6px;
  display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .13s,color .13s;
}
.item:hover .fav,.fav:focus-visible,.fav.on{opacity:1}
.fav:hover{color:var(--star)}
.fav.on{color:var(--star)}

/* search results */
.rmeta{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:24px 0 16px}
.rgroup{margin-bottom:24px}
.rpath{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.63rem;
  letter-spacing:.09em;text-transform:uppercase;color:#fff;background:var(--sc);
  padding:3px 9px;border-radius:4px;margin-bottom:9px;
}
.empty{padding:50px 0;max-width:44ch;color:var(--ink-2);line-height:1.6;font-size:.94rem}
.empty b{display:block;font-family:var(--display);font-size:1.2rem;color:var(--ink);margin-bottom:7px}

/* ══════════ PRACTICE ══════════ */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(22,35,58,.55);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;
}
.overlay[hidden]{display:none}
.panel{
  background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow-y:auto;
  box-shadow:0 30px 70px -20px rgba(22,35,58,.5);
}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
.phead h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.02em}
.xbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.xbtn:hover{background:var(--rule-2);color:var(--ink)}
.pbody{padding:16px 20px 20px}
.optrow{margin-bottom:14px}
.optrow .lab{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1.5px solid var(--rule);border-radius:99px;padding:6px 13px;font-size:.83rem;color:var(--ink-2);transition:all .13s}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt:disabled{opacity:.35;cursor:not-allowed}

.pbar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.pcount{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;justify-content:space-between}
.flash{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:26px 20px;
  text-align:center;min-height:172px;display:flex;flex-direction:column;justify-content:center;gap:10px;
}
.flash .prompt{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;letter-spacing:-.02em}
.flash .sub{font-size:.85rem;color:var(--ink-3)}
.flash .ansfr{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.25}
.flash .ansph{font-family:var(--mono);font-size:.82rem;color:var(--ink-2)}
.flash .anseng{font-size:.9rem;color:var(--ink-2)}
.divider{height:1px;background:var(--rule);margin:4px 0}
.prow{display:flex;gap:8px;margin-top:14px}
.prow button{flex:1;border-radius:9px;padding:11px;font-size:.88rem;font-weight:600;border:1.5px solid var(--rule)}
.prow button:hover{border-color:var(--ink)}
.prow .go{background:var(--ink);border-color:var(--ink);color:#fff}
.prow .again{color:#B3542F;border-color:rgba(179,84,47,.3)}
.prow .again:hover{border-color:#B3542F}
.prow .know{color:#2F7A55;border-color:rgba(47,122,85,.3)}
.prow .know:hover{border-color:#2F7A55}
.pdone{text-align:center;padding:26px 8px}
.pdone b{font-family:var(--display);font-size:1.5rem;display:block;margin-bottom:8px}
.pdone p{color:var(--ink-2);font-size:.9rem;margin:0 0 18px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(22,35,58,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ══════════ RESPONSIVE ══════════ */
@media (max-width:1080px){ .main{padding:0 22px 80px} }
@media (max-width:860px){
  .menubtn{display:flex}
  .brand-txt{display:none}
  .kbd{display:none}
  .side{
    position:fixed;top:0;left:0;height:100vh;width:290px;z-index:80;background:var(--paper);
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    padding-top:16px;box-shadow:6px 0 30px -10px rgba(22,35,58,.3);
  }
  .side.on{transform:none}
  .main{padding:0 18px 80px}
  .speed{display:none}
  .tbtn .lbl{display:none}
  .tbtn{padding:7px 10px}
  .items.two,.items.three{grid-template-columns:1fr}
  .home-hero{padding:32px 0 24px}
}
@media (max-width:460px){
  .items.three{grid-template-columns:repeat(2,1fr)}
  .items.three .item{padding:9px 10px}
  .items.three .fr{font-size:.92rem}
  .items.three .fav{display:none}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn menubtn" id="menubtn" aria-label="Open menu">
    <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <a class="brand" href="#home" style="text-decoration:none">
    <span class="mk">Fr</span>
    <span class="brand-txt"><b>Carnet</b><span>d'étude</span></span>
  </a>

  <label class="searchbox">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search French or English…" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
  </label>

  <div class="topact">
    <select class="speed" id="speed" aria-label="Speech speed">
      <option value="0.6">0.6×</option>
      <option value="0.8" selected>0.8×</option>
      <option value="1">1×</option>
    </select>
    <button class="tbtn" id="voicebtn" title="French voice status">
      <span class="voicedot" id="voicedot"></span><span class="lbl" id="voicelbl">Voice</span>
    </button>
    <button class="tbtn primary" id="practicebtn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7-4.5z"/></svg>
      <span class="lbl">Practise</span>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="side" id="side" aria-label="Contents">
    <button class="navhome" id="navhome">
      <svg class="ic" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 7l6-4.5L14 7v6.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
      Overview
    </button>

ante, zéro huit, quatre-vingt-cinq, quatre-vingt-seize ». Mobiles start with <strong>06</strong> or <strong>07</strong>. Landlines: 01 Paris, 02 northwest, 03 northeast, 04 southeast, 05 southwest.", "items": [["zéro un quarante-cinq quarante-huit vingt trente et un", "01 45 48 20 31", "A Paris landline"], ["zéro six quarante zéro huit quatre-vingt-cinq quatre-vingt-seize", "06 40 08 85 96", "A mobile"], ["zéro quatre soixante-dix-huit quatre-vingts cinquante-neuf zéro un", "04 78 80 59 01", "A Lyon landline"], ["Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO duh tay-lay-FON", "What's your phone number?"]]}]}]}, {"id": "alterego", "name": "Alter Ego A1", "short": "Alter Ego", "color": "#6B3FA0", "blurb": "The main coursebook. Dossier 0 gets you introducing yourself; Dossier 1 takes you into real conversations, forms and phone numbers.", "lessons": [{"id": "ae-d0", "label": "Dossier 0", "name": "Découverte", "summary": "Pages 14–24. Saying your name, spelling it, nationalities, countries, and every phrase your teacher will use in class.", "art": "presenter", "groups": [{"name": "Se présenter — les dialogues", "items": [["Comment tu t'appelles ?", "ko-MAHN tew ta-PELL", "What's your name? (informal)"], ["Yoko. Et toi ?", "yo-KO. ay TWAH", "Yoko. And you?"], ["Je m'appelle Clémence, et vous ?", "zhuh ma-PELL klay-MAHNSS, ay VOO", "My name is Clémence, and you?"], ["Je m'appelle James.", "zhuh ma-PELL", "My name is James."], ["Vous vous appelez comment ?", "voo voo za-play ko-MAHN", "What's your name? (polite)"], ["Épelez, s'il vous plaît.", "ay-play, seel voo PLEH", "Spell it, please."], ["Comment vous appelez-vous ?", "ko-mahn voo za-play-VOO", "What's your name? (formal inversion)"], ["Enchanté / Enchantée", "ahn-shahn-TAY", "Pleased to meet you"]]}, {"name": "S'appeler — indicatif présent", "cols": "two", "items": [["Je m'appelle Paul.", "zhuh ma-PELL pol", "My name is Paul."], ["Tu t'appelles comment ?", "tew ta-pell ko-MAHN", "What are you called?"], ["Il s'appelle Karl Rainer.", "eel sa-PELL karl RAY-nair", "His name is Karl Rainer."], ["Elle s'appelle Isabelle.", "el sa-PELL ee-za-BELL", "Her name is Isabelle."], ["Nous nous appelons Pablo et Alexandra.", "noo noo za-play-OHN", "We're called Pablo and Alexandra."], ["Vous vous appelez Sofia.", "voo voo za-play so-FEE-a", "Your name is Sofia."], ["Ils s'appellent M. et Mme Johnson.", "eel sa-PELL", "They're called Mr and Mrs Johnson."], ["Elles s'appellent Alexandra et Barbara.", "el sa-PELL", "Their names are Alexandra and Barbara."]]}, {"name": "Être — indicatif présent", "cols": "two", "items": [["Je suis canadien.", "zhuh swee ka-na-dee-AN", "I'm Canadian."], ["Tu es belge.", "tew ay BELZH", "You're Belgian."], ["Il est allemand ?", "eel ay tal-MAHN", "Is he German?"], ["Elle est française.", "el ay frahn-SEZ", "She's French."], ["Nous sommes espagnols.", "noo som es-pan-YOL", "We're Spanish."], ["Vous êtes russe ?", "voo-ZET rewss", "Are you Russian?"], ["Ils sont canadiens.", "eel sohn ka-na-dee-AN", "They're Canadian."], ["Elles sont espagnoles.", "el sohn es-pan-YOL", "They're Spanish. (fem.)"]]}, {"name": "Faire connaissance — au cocktail", "items": [["Vous vous appelez Sofia ? Moi aussi !", "voo voo za-play so-FEE-a ? mwah oh-SEE", "Your name's Sofia? Mine too!"], ["Je me présente : José Gomes.", "zhuh muh pray-ZAHNT", "Let me introduce myself: José Gomes."], ["Je m'appelle Paul Bouchard.", "zhuh ma-PELL pol boo-SHAR", "My name is Paul Bouchard."], ["Voici Isabelle Moreau. Elle est française.", "vwa-SEE ee-za-BELL mo-RO. el ay frahn-SEZ", "This is Isabelle Moreau. She's French."], ["Il s'appelle Karl Rainer.", "eel sa-PELL karl RAY-nair", "His name is Karl Rainer."], ["Qui est-ce ?", "kee ESS", "Who is it?"], ["Natacha Muller, je suis autrichienne.", "zhuh swee zoh-tree-shee-EN", "Natacha Muller, I'm Austrian."], ["Moi, je suis mexicaine.", "mwah, zhuh swee mek-see-KEN", "Me, I'm Mexican."]]}, {"name": "Les articles définis", "cols": "two", "note": "<strong>le</strong> masculine · <strong>la</strong> feminine · <strong>l'</strong> before a vowel or silent h · <strong>les</strong> plural.", "items": [["le professeur", "luh pro-fess-UR", "the teacher"], ["le livre", "luh LEEV-ruh", "the book"], ["la photo", "lah fo-TO", "the photo"], ["la réponse", "lah ray-PONSS", "the answer"], ["l'étudiant", "lay-tew-dee-AHN", "the student (m)"], ["l'étudiante", "lay-tew-dee-AHNT", "the student (f)"], ["les étudiants", "lay zay-tew-dee-AHN", "the students"], ["les réponses", "lay ray-PONSS", "the answers"]]}, {"name": "Le genre des noms de pays", "note": "Country names ending in <strong>-e</strong> are usually feminine (la Chine, la France, l'Italie). Ending in <strong>-s</strong> → plural (les États-Unis, les Philippines). Everything else is masculine (le Canada, le Japon, l'Iran).<br><br><strong>Four exceptions</strong> end in -e but stay masculine: le Mexique, le Cambodge, le Zimbabwe, le Mozambique.", "items": [["Les noms de pays qui se terminent par la lettre E sont féminins.", "lay nom duh pay-EE kee suh tair-MEEN par lah let-ruh uh sohn fay-mee-NAN", "Countries ending in -e are feminine"], ["Les noms de pays qui se terminent par la lettre S sont pluriels.", "… sohn plew-ree-ELL", "Countries ending in -s are plural"]]}, {"name": "La communication en classe — le professeur", "items": [["Écoutez le dialogue.", "ay-koo-TAY luh dee-a-LOG", "Listen to the dialogue."], ["Répétez, s'il vous plaît.", "ray-pay-TAY, seel voo PLEH", "Repeat, please."], ["Regardez la photo.", "ruh-gar-DAY lah fo-TO", "Look at the picture."], ["Écrivez la réponse.", "ay-kree-VAY lah ray-PONSS", "Write the answer."], ["Répétez la phrase.", "ray-pay-TAY lah FRAZ", "Repeat the sentence."], ["Cochez la bonne réponse.", "ko-SHAY lah bun ray-PONSS", "Tick the correct answer."], ["Soulignez les questions.", "soo-leen-YAY lay kes-tee-OHN", "Underline the questions."], ["Parlez plus fort !", "par-LAY plew FOR", "Speak louder!"], ["Ouvrez le livre.", "oo- is.", "zhuh nuh parl pah bee-AN nahn-GLAY", "I don't speak English well."], ["Je n'ai pas cours le mardi.", "zhuh nay pah koor luh mar-DEE", "I don't have class on Tuesdays."], ["Je ne travaille pas le week-end.", "zhuh nuh tra-vigh pah luh week-END", "I don't work weekends."], ["Ils ne sont pas français.", "eel nuh sohn pah frahn-SAY", "They're not French."]]}]}, {"id": "ae-d1l2", "label": "Dossier 1 · Leçon 2", "name": "M comme médiathèque", "summary": "Pages 30–33. Asking politely, filling in a form, and reading an email address out loud.", "art": "quel", "groups": [{"name": "Demander poliment", "items": [["Je voudrais des informations, s'il vous plaît.", "zhuh voo-DREH day zan-for-ma-see-OHN, seel voo PLEH", "I'd like some information, please."], ["Combien ça coûte ?", "kohm-bee-AN sa KOOT", "How much does it cost?"], ["Ça coûte combien ?", "sa koot kohm-bee-AN", "How much is it? (casual order)"]]}, {"name": "L'article indéfini", "cols": "two", "items": [["un formulaire d'inscription", "uhn for-mew-LAIR dan-skreep-see-OHN", "a registration form (m sing.)"], ["une pièce d'identité", "ewn pee-ESS dee-dahn-tee-TAY", "an ID document (f sing.)"], ["des étudiants", "day zay-tew-dee-AHN", "students (m plur.)"], ["des photos", "day fo-TO", "photos (f plur.)"]]}, {"name": "L'adjectif interrogatif quel", "note": "<strong>quel</strong> agrees with the noun that follows: quel (m sing.) · quelle (f sing.) · quels (m plur.) · quelles (f plur.). All four sound identical — kel.", "items": [["Quel est votre nom ?", "kel ay VOT-ruh NOHN", "What's your surname?"], ["Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO duh tay-lay-FON", "What's your phone number?"], ["Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "What's your nationality?"], ["Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "What's your date of birth?"], ["Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO duh tay-lay-FON", "What are your phone numbers?"], ["Quelles sont vos coordonnées ?", "kel sohn vo ko-or-do-NAY", "What are your contact details?"]]}, {"name": "Lire une adresse mail", "cols": "two", "items": [["Yacine point Bellini arobase yahoo point fr", "ya-SEEN pwan bel-LEE-nee a-ro-BAHZ", "yacine.bellini@yahoo.fr"], ["N Roux arobase gmail point com", "enn roo a-ro-BAHZ zhee-mail pwan kom", "nroux@gmail.com"], ["Lina tiret Meunier arobase free point fr", "lee-NAH tee-REH muh-nee-AY", "lina-meunier@free.fr"], ["Paul tiret bas Martini arobase hotmail point fr", "pol tee-reh BAH mar-tee-NEE", "paul_martini@hotmail.fr"]]}, {"name": "Signes et ponctuation", "cols": "three", "items": [["un tiret", "uhn tee-REH", "a dash"], ["un tiret bas", "uhn tee-reh BAH", "an underscore"], ["un slash", "uhn slash", "a slash"], ["une arobase", "ewn a-ro-BAHZ", "an at sign"], ["un point", "uhn PWAN", "a period"], ["une virgule", "ewn veer-GEWL", "a comma"], ["deux points", "duh PWAN", "a colon"], ["un point-virgule", "uhn pwan-veer-GEWL", "a semicolon"], ["un point d'interrogation", "uhn pwan dan-tair-o-ga-see-OHN", "a question mark"], ["un point d'exclamation", "uhn pwan dek-skla-ma-see-OHN", "an exclamation mark"], ["des parenthèses", "day pa-rahn-TEZ", "parentheses"]]}]}]}, {"id": "grammaire", "name": "Grammaire Progressive", "short": "Grammaire", "color": "#3F8F63", "blurb": "Six chapters that build the skeleton: introducing yourself, making adjectives agree in all four forms, être, questions, negation, and your first verb family.", "lessons": [{"id": "gr-1", "label": "Chapitre 1", "name": "Vous êtes japonais ?", "summary": "La présentation. Je suis + name, nationality, job — and why French drops the article before a profession.", "art": null, "groups": [{"name": "La présentation", "note": "Two rules this chapter rests on. <strong>Always use je suis or je m'appelle</strong> — never a bare name. And <strong>no article before a profession</strong>: <em>je suis médecin</em>, never <em>je suis un médecin</em>. That one catches every English speaker.", "items": [["Bonjour, je suis Kenji Takashi.", "bohn-ZHOOR, zhuh swee", "Hello, I'm Kenji Takashi."], ["Je m'appelle Kenji Takashi.", "zhuh ma-PELL", "My name is Kenji Takashi."], ["Vous êtes japonais ? — Oui, je suis japonais.", "voo-ZET zha-po-NAY", "Are you Japanese? — Yes, I am."], ["Vous êtes médecin ? — Non, je suis chimiste.", "voo-ZET mayd-SAN — nohn, zhuh swee shee-MEEST", "Are you a doctor? — No, I'm a chemist."], ["Je suis français. Je suis professeur.", "zhuh swee frahn-SAY. zhuh swee pro-fess-UR", "I'm French. I'm a teacher."], ["Jean, vous êtes professeur ou étudiant ?", "zhahn, voo-ZET pro-fess-UR oo zay-tew-dee-AHN", "Jean, are you a teacher or a student?"], ["Kenji, vous êtes médecin ou chimiste ?", "voo-ZET mayd-SAN oo shee-MEEST", "Kenji, are you a doctor or a chemist?"], ["Bip, vous êtes astronaute ou professeur ?", "voo-ZET zas-tro-NOTE oo pro-fess-UR", "Bip, are you an astronaut or a teacher?"]]}]}, {"id": "gr-2", "label": "Chapitre 2", "name": "Il est grand. Elle est grande.", "summary": "Masculine to feminine. Add -e and the silent consonant wakes up — that's how you hear gender.", "art": "agreement", "groups": [{"name": "Masculin → féminin", "cols": "two", "note": "<strong>Féminin = masculin + -e.</strong> The point of that -e: a silent final consonant becomes audible, so you can <em>hear</em> the gender. Words already ending in -e (jeune, russe, calme) don't change.", "items": [["français → française", "frahn-SAY → frahn-SEZ", "French"], ["portugais → portugaise", "por-tew-GAY → por-tew-GEZ", "Portuguese"], ["suédois → suédoise", "sway-DWAH → sway-DWAZ", "Swedish"], ["chinois → chinoise", "shee-NWAH → shee-NWAZ", "Chinese"], ["mexicain → mexicaine", "mek-see-KAN → mek-see-KEN", "Mexican"], ["américain → américaine", "a-may-ree-KAN → a-may-ree-KEN", "American"], ["autrichien → autrichienne", "oh-tree-shee-AN → oh-tree-shee-EN", "Austrian"], ["canadien → canadienne", "ka-na-dee-AN → ka-na-dee-EN", "Canadian"], ["coréen → coréenne", "ko-ray-AN → ko-ray-EN", "Korean"], ["allemand → allemande", "al-MAHN → al-MAHND", "German"], ["espagnol → espagnole", "es-pan-YOL → es-pan-YOL", "Spanish"], ["russe → russe", "rewss → rewss", "Russian — identical"], ["grec → grecque", "grek → grek", "Greek — irregular"], ["turc → turque", "tewrk → tewrk", "Turkish — irregular"], ["étudiant → étudiante", "ay-tew-dee-AHN → ay-tew-dee-AHNT", "student"], ["grand → grande", "GRAHN → GRAHND", "tall"], ["blond → blonde", "BLOHN → BLOHND", "blond"], ["marié → mariée", "ma-ree-AY → ma-ree-AY", "married"], ["petit → petite", "puh-TEE → puh-TEET", "small"], ["vert → verte", "VAIR → VAIRT", "green"], ["amusant → amusante", "a-mew-ZAHN → a-mew-ZAHNT", "funny"], ["intelligent → intelligente", "an-tel-ee-ZHAHN → an-tel-ee-ZHAHNT", "intelligent"], ["souriant → souriante", "soo-ree-AHN → soo-ree-AHNT", "smiling"], ["jeune → jeune", "ZHUHN → ZHUHN", "young — no change"]]}, {"name": "Les autres terminaisons", "cols": "two", "note": "<strong>-on → -onne</strong> · <strong>-er → -ère</strong> · <strong>-eur / -eux → -euse</strong> · <strong>-teur → -trice</strong> for most professions.<br><br>One exception: <strong>chanteur → chanteuse</strong>, not chantrice. And some jobs never change: <strong>professeur, médecin, écrivain, auteur</strong> stay identical — though professeure, écrivaine and auteure are increasingly used.", "items": [["bon → bonne", "bohn → bun", "good"], ["breton → bretonne", "bruh-TOHN → bruh-TUN", "Breton"], ["mignon → mignonne", "meen-YOHN → meen-YUN", "cute"], ["étranger → étrangère", "ay-trahn-ZHAY → ay-trahn-ZHAIR", "foreign"], ["boulanger → boulangère", "boo-lahn-ZHAY → boo-lahn-ZHAIR", "baker"], ["infirmier → infirmière", "an-feer-mee-AY → an-feer-mee-AIR", "nurse"], ["poissonnier → poissonnière", "pwa-son-YAY → pwa-son-YAIR", "fishmonger"], ["serveur → serveuse", "sair-VUR → sair-VUZ", "waiter"], ["danseur → danseuse", "dahn-SUR → dahn-SUHZ", "dancer"], ["menteur → menteuse", "mahn-TUR → mahn-TUZ", "liar"], ["heureux → heureuse", "uh-RUH → uh-RUZ", "happy"], ["acteur → actrice", "ak-TUR → ak-TREESS", "actor"], ["instituteur → institutrice", "an-stee-tew-TUR → an-stee-tew-TREESS", "primary teacher"], ["présentateur → présentatrice", "pray-zahn-ta-TUR → pray-zahn-ta-TREESS", "presenter"], ["chanteur → chanteuse", "shahn-TUR → shahn-TUHZ", "singer — the exception"], ["professeur → professeur", "pro-fess-UR", "teacher — unchanged"], ["médecin → médecin", "mayd-SAN", "doctor — unchanged"], ["beau → belle", "BO → BELL", "beautiful"], ["gros → grosse", "GRO → GROSS", "big / fat"], ["vieux → vieille", "vee-UH → vee-AY-yuh", "old"], ["gentil → gentille", "zhahn-TEE → zhahn-TEE-yuh", "kind"], ["blanc → blanche", "BLAHN → BLAHNSH", "white"]]}]}, {"id": "gr-3", "label": "Chapitre 3", "name": "Ils sont grands.", "summary": "Singular to plural — add -s, unless the word already ends in -s or -x.", "art": null, "groups": [{"name": "Singulier → pluriel", "cols": "two", "note": "<strong>Pluriel = singulier + -s.</strong> But a masculine word already ending in <strong>-s</strong> or <strong>-x</strong> doesn't change at all. One irregular: <em>beau → beaux</em>.<br><br>And when a group is mixed, the masculine plural always wins — one man among ten women still makes it <strong>ils</strong>.", "items": [["il est blond → ils sont blonds", "eel ay BLOHN → eel sohn BLOHN", "he is / they are blond"], ["elle est blonde → elles sont blondes", "el ay BLOHND → el sohn BLOHND", "she is / they are blonde"], ["il est étudiant → ils sont étudiants", "eel et ay-tew-dee-AHN → eel sohn tay-tew-dee-AHN", "student(s)"], ["il est français → ils sont français", "eel ay frahn-SAY → eel sohn frahn-SAY", "French — no change"], ["il est vieux → ils sont vieux", "eel ay vee-UH → eel sohn vee-UH", "old — no change"], ["il est beau → ils sont beaux", "eel ay BO → eel sohn BO", "handsome — irregular"], ["Ils sont américains.", "eel sohn ta-may-ree-KAN", "They're American."], ["Elles sont brésiliennes.", "el sohn bray-zeel-YEN", "They're Brazilian. (fem.)"], ["Elles sont danseuses.", "el sohn dahn-SUHZ", "They're dancers. (fem.)"], ["Ils sont gentils.", "eel sohn zhahn-TEE", "They're kind."], ["Elles sont gentilles.", "el sohn zhahn-TEE-yuh", "They're kind. (fem.)"], ["Elles sont célibataires.", "el sohn say-lee-ba-TAIR", "They're single. (fem.)"]]}]}, {"id": "gr-4", "label": "Chapitre 4", "name": "Je suis, tu es, il est…", "summary": "Être in full, the tu/vous decision, and the two very different jobs of on.", "art": null, "groups": [{"name": "Être, tu/vous, on", "note": "<strong>vous</strong> does two jobs: polite singular, and plural of any register. <strong>tu</strong> is familiar singular only.<br><br><strong>on</strong> also does two: casual 'we' (<em>Jean et moi, on est fatigués</em>) and general 'people' (<em>Quand on est enrhumé, on est fatigué</em>). It always conjugates like <em>il</em>.", "items": [["Vous êtes prêt, monsieur Meyer ?", "voo-ZET PREH, muh-syuh may-AIR", "Are you ready, Mr Meyer? (polite)"], ["Tu es prêt, papa ?", "tew ay PREH, pa-PAH", "Are you ready, dad? (familiar)"], ["Vous êtes prêts ? (messieurs)", "voo-ZET PREH", "Are you ready? (several men)"], ["Vous êtes prêtes ? (mesdames)", "voo-ZET PRET", "Are you ready? (several women)"], ["Jean et moi, on est enrhumés.", "zhahn ay mwah, oh-nay tahn-rew-MAY", "Jean and I have colds. (on = nous)"], ["Quand on est enrhumé, on est fatigué.", "kahn oh-nay tahn-rew-MAY, oh-nay fa-tee-GAY", "When you have a cold, you're tired. (on = people)"], ["Nous sommes contents d'être à Paris.", "noo sum kohn-TAHN detr a pa-REE", "We're happy to be in Paris."], ["Nous sommes désolés d'être en retard.", "noo sum day-zo-LAY detr ahn ruh-TAR", "We're sorry to be late."], ["Quand on est en vacances, on est content.", "kahn oh-nay ahn va-KAHNSS, oh-nay kohn-TAHN", "When you're on holiday, you're happy."], ["Quand on est en retard, on est pressé.", "kahn oh-nay ahn ruh-TAR, oh-nay press-AY", "When you're late, you're in a hurry."]]}]}, {"id": "gr-5", "label": "Chapitre 5", "name": "Est-ce que… ? Non, je ne suis pas…", "summary": "Three ways to ask a yes/no question, and where pas goes.", "art": "nepas", "groups": [{"name": "Poser une question", "note": "Three ways to ask the same yes/no question: rising intonation alone, or <strong>est-ce que</strong> on the front. Both are normal in speech — est-ce que is the safer default while you're building confidence, because it signals 'question' from word one.", "items": [["Vous êtes japonais.", "voo-ZET zha-po-NAY", "You're Japanese. (statement, falling tone)"], ["Vous êtes japonais ?", "voo-ZET zha-po-NAY", "Are you Japanese? (rising tone)"], ["Est-ce que vous êtes japonais ?", "es-kuh voo-ZET zha-po-NAY", "Are you Japanese? (with est-ce que)"], ["Est-ce que Jean est français ?", "es-kuh zhahn ay frahn-SAY", "Is Jean French?"], ["Est-ce que vous êtes étudiant ?", "es-kuh voo-ZET zay-tew-dee-AHN", "Are you a student?"], ["Est-ce que tu es marié ?", "es-kuh tew ay ma-ree-AY", "Are you married?"], ["Est-ce que Marco est blond ?", "es-kuh mar-KO ay BLOHN", "Is Marco blond?"]]}, {"name": "La négation ne… pas", "cols": "two", "items": [["Je ne suis pas content.", "zhuh nuh swee pah kohn-TAHN", "I'm not happy."], ["Elle n'est pas riche.", "el nay pah REESH", "She's not rich."], ["Ils ne sont pas italiens.", "eel nuh sohn pah zee-tal-YAN", "They're not Italian."], ["Je ne suis pas brun.", "zhuh nuh swee pah BRUHN", "I'm not dark-haired."], ["Je ne suis pas français.", "zhuh nuh swee pah frahn-SAY", "I'm not French."], ["Je ne suis pas professeur.", "zhuh nuh swee pah pro-fess-UR", "I'm not a teacher."], ["Le lit n'est pas confortable.", "luh LEE nay pah kohn-for-TAHB-luh", "The bed isn't comfortable."], ["L'eau n'est pas chaude.", "lo nay pah SHOWD", "The water isn't hot."], ["Les chambres ne sont pas chères.", "lay SHAHM-bruh nuh sohn pah SHAIR", "The rooms aren't expensive."], ["Non, il n'est pas blond. Il est brun.", "nohn, eel nay pah BLOHN. eel ay BRUHN", "No, he's not blond. He's dark-haired."]]}]}, {"id": "gr-6", "label": "Chapitre 6", "name": "Je parle, je regarde, j'aime…", "summary": "Regular -ER verbs — the biggest verb family in French, and the one that never lets you down.", "art": null, "groups": [{"name": "Les verbes en -ER", "cols": "two", "note": "<strong>Drop -er, add -e.</strong> That final -e is silent — <em>je parle</em> is said zhuh PARL. And <strong>je → j'</strong> before a vowel or silent h.<br><br>This is the biggest verb family in French. Almost every new verb you meet will follow it.", "items": [["parler → je parle", "zhuh PARL", "to speak → I speak"], ["regarder → je regarde", "zhuh ruh-GARD", "to watch → I watch"], ["manger → je mange", "zhuh MAHNZH", "to eat → I eat"], ["travailler → je travaille", "zhuh tra-VIGH", "to work → I work"], ["téléphoner → je téléphone", "zhuh tay-lay-FON", "to call → I call"], ["écouter → j'écoute", "zhay-KOOT", "to listen → I listen"], ["aimer → j'aime", "zhem", "to love → I love"], ["habiter → j'habite", "zha-BEET", "to live → I live"], ["étudier → j'étudie", "zhay-tew-DEE", "to study → I study"], ["commencer → je commence", "zhuh ko-MAHNSS", "to start → I start"], ["terminer → je termine", "zhuh tair-MEEN", "to finish → I finish"], ["dîner → je dîne", "zhuh DEEN", "to have dinner → I have dinner"]]}, {"name": "Une journée — le modèle", "items": [["Je travaille dans une banque.", "zhuh tra-vigh dahn zewn BAHNK", "I work in a bank."], ["Le matin, je commence à 9 heures.", "luh ma-TAN, zhuh ko-MAHNSS a nuh-VUR", "In the morning I start at 9."], ["Le soir, je termine à 18 heures.", "luh SWAHR, zhuh tair-MEEN a dee-zwee-TUR", "In the evening I finish at 6."], ["À midi, je mange à la cafétéria avec mes collègues.", "a mee-DEE, zhuh MAHNZH a lah ka-fay-tay-REE-a a-vek may ko-LEG", "At noon I eat in the cafeteria with my colleagues."], ["Le soir, je dîne chez moi.", "luh SWAHR, zhuh DEEN shay MWAH", "In the evening I have dinner at home."], ["Après le repas, je regarde la télévision ou j'écoute la radio.", "a-PRAY luh ruh-PAH, zhuh ruh-GARD lah tay-lay-vee-zee-OHN oo zhay-KOOT lah ra-dee-O", "After the meal I watch TV or listen to the radio."], ["J'aime le sport et la musique.", "zhem luh SPOR ay lah mew-ZEEK", "I like sport and music."], ["J'habite à Paris.", "zha-BEET a pa-REE", "I live in Paris."], ["Je parle français.", "zhuh parl frahn-SAY", "I speak French."], ["J'étudie l'anglais.", "zhay-tew-DEE lahn-GLAY", "I'm studying English."]]}]}]}, {"id": "vocab-prog", "name": "Vocabulaire Progressif", "short": "Vocab. Prog.", "color": "#8C5A2B", "blurb": "Three units of social French: the politeness rituals, the whole family tree with life stages, and the vocabulary of love and feeling.", "lessons": [{"id": "vp-1", "label": "Unité 1", "name": "Les usages, la politesse", "summary": "Greeting, introducing, welcoming, apologising, thanking, congratulating, wishing.", "art": "bise", "groups": [{"name": "Dire bonjour", "items": [["Bonjour, madame / monsieur.", "bohn-ZHOOR, ma-DAM / muh-SYUH", "Hello — during the day."], ["Bonsoir, madame.", "bohn-SWAHR, ma-DAM", "Good evening."], ["Bonjour, ma chère Mathilde !", "bohn-ZHOOR, ma SHAIR", "Hello, my dear Mathilde!"], ["Bonjour, Bénédicte, comment vas-tu ?", "ko-mahn va-TEW", "Hello Bénédicte, how are you?"], ["Bien, merci, et toi ?", "bee-AN, mair-SEE, ay TWAH", "Fine thanks, and you?"], ["Ça va bien, merci.", "sa va bee-AN, mair-SEE", "I'm doing well, thanks."], ["Salut, Mathilde, ça va ?", "sa-LEW, sa VA", "Hi Mathilde, you good?"], ["Tiens, salut ! Ça va, merci, et toi ?", "tee-AN, sa-LEW", "Oh hey! Good thanks, you?"]]}, {"name": "Dire au revoir", "items": [["Au revoir, Diane, à bientôt !", "oh ruh-VWAHR, a bee-an-TO", "Goodbye Diane, see you soon!"], ["Salut, Simon ! À tout à l'heure !", "sa-LEW, a too ta LUR", "Bye Simon! See you in a bit!"], ["Bonsoir, Raphaël, à lundi !", "bohn-SWAHR, a luhn-DEE", "Goodnight Raphaël, see you Monday!"]]}, {"name": "Présenter quelqu'un", "items": [["Je vous présente Florence Dusapin.", "zhuh voo pray-ZAHNT", "Let me introduce Florence Dusapin."], ["Bonjour, madame, enchanté.", "bohn-ZHOOR, ma-DAM, ahn-shahn-TAY", "Hello madam, delighted. (said by a man)"], ["Enchantée, monsieur.", "ahn-shahn-TAY, muh-SYUH", "Delighted. (said by a woman)"], ["Nicolas, est-ce que tu connais ma copine Émilie ?", "es-kuh tew ko-NAY ma ko-PEEN", "Nicolas, do you know my friend Émilie?"], ["Non, pas encore. Bonjour, Émilie.", "nohn, pa zahn-KOR", "No, not yet. Hello, Émilie."]]}, {"name": "Accueillir", "items": [["Entrez, je vous en prie !", "ahn-TRAY, zhuh voo zahn PREE", "Come in, please!"], ["Je peux prendre votre manteau ?", "zhuh puh PRAHN-druh VOT-ruh mahn-TO", "May I take your coat?"], ["Ça me fait plaisir de vous voir !", "sa muh fay play-ZEER duh voo VWAHR", "Lovely to see you!"], ["Asseyez-vous, je vous en prie !", "a-say-yay VOO, zhuh voo zahn PREE", "Please sit down."], ["Je suis content de te voir ! Assieds-toi, je t'en prie !", "zhuh swee kohn-TAHN duh tuh VWAHR", "Glad to see you! Sit down. (familiar)"]]}, {"name": "S'excuser", "items": [["Oh, pardon, madame. Je suis désolé !", "oh, par-DOHN, ma-DAM. zhuh swee day-zo-LAY", "Oh, sorry madam. My apologies!"], ["Ce n'est rien, monsieur !", "suh nay ree-AN", "It's nothing, sir!"], ["Excusez-moi, je suis désolée d'être en retard !", "eks-kew-zay MWAH", "Excuse me, I'm sorry I'm late!"], ["Je vous en prie, ce n'est pas grave.", "zhuh voo zahn PREE, suh nay pah GRAHV", "Not at all, it's fine."]]}, {"name": "Demander et remercier", "items": [["Pardon, madame, vous pouvez me dire où est la poste, s'il vous plaît ?", "par-DOHN … voo poo-VAY muh DEER oo ay lah POST", "Excuse me, could you tell me where the post office is?"], ["C'est au bout de la rue, à droite.", "set oh boo duh lah REW, a DRWAHT", "It's at the end of the street, on the right."], ["Je vous remercie, madame.", "zhuh voo ruh-mair-SEE", "Thank you, madam."], ["Je vous en prie, monsieur.", "zhuh voo zahn PREE", "You're welcome, sir."], ["Tu peux me prêter un euro, s'il te plaît ?", "tew puh muh pray-TAY uhn UR-oh", "Can you lend me a euro, please?"], ["Oui, bien sûr ! Voilà !", "wee, bee-AN SEWR ! vwa-LAH", "Yes of course! Here you go!"], ["Merci beaucoup !", "mair-SEE bo-KOO", "Thanks a lot!"], ["De rien !", "duh ree-AN", "You're welcome!"]]}, {"name": "Féliciter et plaindre", "items": [["Félicitations ! Toutes mes félicitations !", "fay-lee-see-ta-see-OHN", "Congratulations!"], ["Je suis vraiment content pour toi !", "zhuh swee vray-MAHN kohn-TAHN poor TWAH", "I'm really happy for you!"], ["Bravo !", "bra-VO", "Well done!"], ["Tous mes vœux de bonheur !", "too may vuh duh bo-NUR", "Wishing you every happiness! (a wedding)"], ["Oh, mon pauvre Marc ! Tu n'as pas de chance !", "oh, mohn PO-vruh … tew na pah duh SHAHNSS", "Oh, poor Marc! Tough luck!"], ["C'est terrible, c'est affreux, ce n'est pas possible !", "say tair-EE-bluh, set a-FRUH", "That's terrible, that's awful, that can't be!"], ["Je suis désolé pour vous.", "zhuh swee day-zo-LAY poor VOO", "I'm so sorry for you."]]}, {"name": "Souhaiter", "cols": "two", "items": [["Bonne journée !", "bun zhoor-NAY", "Have a good day!"], ["Bonne après-midi !", "bun a-pray-mee-DEE", "Have a good afternoon!"], ["Bonne soirée !", "bun swa-RAY", "Have a good evening!"], ["Bonne nuit ! Dors bien !", "bun NWEE ! dor bee-AN", "Good night, sleep well!"], ["Bon week-end !", "bohn week-END", "Have a good weekend!"], ["Bonnes vacances ! Repose-toi bien !", "bun va-KAHNSS ! ruh-poz-twah bee-AN", "Enjoy your holiday, rest well!"], ["Bon voyage !", "bohn vwa-YAHZH", "Have a good trip!"], ["Bon appétit !", "bohn a-pay-TEE", "Enjoy your meal!"], ["Bon anniversaire ! Joyeux anniversaire !", "bun a-nee-vair-SAIR", "Happy birthday!"], ["Bonne chance !", "bun SHAHNSS", "Good luck!"], ["Joyeux Noël !", "zhwa-YUH no-ELL", "Merry Christmas!"], ["Bonne année ! Tous mes vœux !", "bun a-NAY ! too may VUH", "Happy New Year!"]]}]}, {"id": "vp-2", "label": "Unité 2", "name": "La famille, les périodes de la vie", "summary": "Every relative from grand-père to belle-sœur, plus the stages of a life and how to talk about age.", "art": "tree", "groups": [{"name": "La famille", "cols": "two", "items": [["le mari", "luh ma-REE", "husband"], ["la femme", "lah FAM", "wife / woman"], ["les parents", "lay pa-RAHN", "parents"], ["les enfants", "lay zahn-FAHN", "children"], ["le fils", "luh FEESS", "son"], ["la fille", "lah FEE-yuh", "daughter / girl"], ["le frère", "luh FRAIR", "brother"], ["la sœur", "lah SUR", "sister"], ["le beau-père", "luh bo-PAIR", "father-in-law / stepfather"], ["la belle-mère", "lah bell-MAIR", "mother-in-law / stepmother"], ["la belle-fille", "lah bell-FEE-yuh", "daughter-in-law"], ["le gendre", "luh ZHAHN-druh", "son-in-law"], ["le beau-frère", "luh bo-FRAIR", "brother-in-law"], ["la belle-sœur", "lah bell-SUR", "sister-in-law"], ["les beaux-parents", "lay bo-pa-RAHN", "parents-in-law"], ["les grands-parents", "lay grahn-pa-RAHN", "grandparents"], ["le grand-père", "luh grahn-PAIR", "grandfather"], ["la grand-mère", "lah grahn-MAIR", "grandmother"], ["les petits-enfants", "lay puh-tee-zahn-FAHN", "grandchildren"], ["le petit-fils", "luh puh-tee-FEESS", "grandson"], ["la petite-fille", "lah puh-teet-FEE-yuh", "granddaughter"], ["l'oncle", "LON-kluh", "uncle"], ["la tante", "lah TAHNT", "aunt"], ["le neveu", "luh nuh-VUH", "nephew"], ["la nièce", "lah nee-ESS", "niece"], ["le cousin", "luh koo-ZAN", "cousin (m)"], ["la cousine", "lah koo-ZEEN", "cousin (f)"]]}, {"name": "Les noms familiers", "cols": "three", "items": [["maman", "ma-MAHN", "mum"], ["papa", "pa-PAH", "dad"], ["papi", "pa-PEE", "grandpa"], ["mamie", "ma-MEE", "grandma"], ["tonton", "tohn-TOHN", "uncle (childish)"], ["tatie", "ta-TEE", "auntie"]]}, {"name": "Les périodes de la vie", "cols": "two", "note": "<strong>bébé</strong> is always masculine, even for a girl. <strong>personne</strong> is always feminine, even for a man.<br><br>Careful with <strong>la petite-fille</strong> (granddaughter) versus <strong>une petite fille</strong> (a little girl) — the hyphen and article change everything. And <strong>vieux</strong> sounds blunt; <strong>âgé</strong> is the polite word.", "items": [["un bébé — de 0 à 2 ans", "uhn bay-BAY", "a baby"], ["un enfant — de 2 à 11 ans", "uhn nahn-FAHN", "a child"], ["un adolescent — de 12 à 18 ans", "uhn na-do-lay-SAHN", "a teenager"], ["un adulte — après 18 ans", "uhn na-DEWLT", "an adult"], ["une personne âgée", "ewn pair-SUN a-ZHAY", "an elderly person"], ["un petit garçon / une petite fille", "uhn puh-tee gar-SOHN / ewn puh-teet FEE-yuh", "a little boy / girl"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["J'ai passé mon enfance en Bretagne.", "zhay pa-SAY moh nahn-FAHNSS", "I spent my childhood in Brittany."], ["Il a eu une adolescence heureuse.", "eel a ew ewn a-do-lay-SAHNSS uh-RUHZ", "He had a happy adolescence."], ["Quel âge ont Véronique et Denis ?", "kel AHZH ohn", "How old are Véronique and Denis?"], ["Véronique a 5 ans de moins que Denis.", "… san kahn duh MWAN kuh", "Véronique is 5 years younger than Denis."], ["Denis a 5 ans de plus que sa femme.", "… san kahn duh PLEWSS kuh", "Denis is 5 years older than his wife."], ["Les enfants grandissent.", "lay zahn-FAHN grahn-DEESS", "Children grow."]]}, {"name": "La vie et la mort", "items": [["Aude est née le 28 septembre 1960.", "ohd ay NAY luh van-weet sep-TAHM-bruh", "Aude was born 28 September 1960."], ["Sa date de naissance est le 28/09/60.", "sa dat duh nay-SAHNSS", "Her date of birth is 28/09/60."], ["Elle a son anniversaire le 28 septembre.", "el a soh na-nee-vair-SAIR", "Her birthday is 28 September."], ["Il a perdu sa femme : elle est morte le 10 mai.", "eel a pair-DEW sa FAM : el ay MORT", "He lost his wife: she died on 10 May."], ["Elle est décédée.", "el ay day-say-DAY", "She passed away."]]}]}, {"id": "vp-3", "label": "Unité 3", "name": "L'amour, les émotions", };

/* ══════════════════════════════════════════════
   INDEXES
   ══════════════════════════════════════════════ */
const LESSONS=[], FLAT=[];
DATA.forEach(sec=>{
  sec.count=0;
  sec.lessons.forEach(les=>{
    les.section=sec;
    les.count=les.groups.reduce((a,g)=>a+g.items.length,0);
    sec.count+=les.count;
    LESSONS.push(les);
    les.groups.forEach(g=>g.items.forEach(it=>{
      FLAT.push({it,les,group:g.name,key:it[0]+'|'+(it[2]||'')});
    }));
  });
});
const lessonById=id=>LESSONS.find(l=>l.id===id);
const TOTAL=FLAT.length;

/* ══════════════════════════════════════════════
   FAVOURITES
   ══════════════════════════════════════════════ */
let favs=new Set();
try{ const raw=localStorage.getItem('carnet-favs'); if(raw) favs=new Set(JSON.parse(raw)); }catch(e){}
function saveFavs(){ try{ localStorage.setItem('carnet-favs',JSON.stringify([...favs])); }catch(e){} }
function toggleFav(key){
  favs.has(key)?favs.delete(key):favs.add(key);
  saveFavs(); updateFavCount();
}
function updateFavCount(){
  const el=document.getElementById('favct');
  el.textContent=favs.size?favs.size:'';
}
updateFavCount();

/* ══════════════════════════════════════════════
   SPEECH
   ══════════════════════════════════════════════ */
let voice=null, rate=0.8, speakingEl=null, queue=null, queueBtn=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  voice=vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;
  const dot=document.getElementById('voicedot'), lbl=document.getElementById('voicelbl');
  if(voice){ dot.classList.remove('bad'); lbl.textContent=voice.name.replace(/\s*\(.*\)/,'').slice(0,16); }
  else { dot.classList.add('bad'); lbl.textContent='No FR voice'; }
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged',pickVoice);
  pickVoice(); setTimeout(pickVoice,700);
}
document.getElementById('voicebtn').addEventListener('click',()=>{
  alert(voice
    ? "Speaking with: "+voice.name
    : "No French voice is installed, so playback will use an English accent.\n\niPhone: Settings → Accessibility → Spoken Content → Voices → Français\nAndroid: Settings → Text-to-speech → install French\nWindows: Settings → Time & language → Speech → Add voices");
});
document.getElementById('speed').addEventListener('change',e=>{rate=parseFloat(e.target.value)});

function stopSpeech(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  queue=null;
  if(queueBtn){queueBtn.classList.remove('on');queueBtn.querySelector('.t').textContent='Play all';queueBtn=null;}
  document.querySelectorAll('.item.speaking').forEach(e=>e.classList.remove('speaking'));
  speakingEl=null;
}
function speak(text,el,onend){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.item.speaking').forEach(e=>e.classList.remove('speaking'));
  const clean=text.replace(/\s*[—–]\s*/g,', ').replace(/\s*→\s*/g,', ');
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='fr-FR'; if(voice) u.voice=voice; u.rate=rate;
  if(el){el.classList.add('speaking'); speakingEl=el;}
  u.onend=()=>{ if(el) el.classList.remove('speaking'); if(onend) onend(); };
  u.onerror=()=>{ if(el) el.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}
function playGroup(btn,items,tiles){
  if(queueBtn===btn){stopSpeech();return;}
  stopSpeech();
  queueBtn=btn; btn.classList.add('on'); btn.querySelector('.t').textContent='Stop';
  queue=0;
  (function step(){
    if(queue===null||queue>=items.length){stopSpeech();return;}
    const i=queue, el=tiles[i];
    el.scrollIntoView({block:'nearest',behavior:'smooth'});
    speak(items[i][0],el,()=>{ if(queue!==null){queue=i+1;step();} });
  })();
}

/* ══════════════════════════════════════════════
   RENDER HELPERS
   ══════════════════════════════════════════════ */
const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t,q){
  if(!q) return esc(t);
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
const STAR='<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.8l1.85 3.95 4.15.55-3.05 2.9.78 4.2L8 11.4 4.27 13.4l.78-4.2L2 6.3l4.15-.55z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const STAR_O='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.8l1.85 3.95 4.15.55-3.05 2.9.78 4.2L8 11.4 4.27 13.4l.78-4.2L2 6.3l4.15-.55z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

function makeItem(it,q){
  const [fr,ph,en]=it, key=fr+'|'+(en||'');
  const b=document.createElement('button');
  b.className='item'; b.type='button'; b.setAttribute('aria-label',fr);
  b.innerHTML=(en?'<span class="en">'+hl(en,q)+'</span>':'')+
    '<span class="fr">'+hl(fr,q)+'</span>'+
    '<span class="ph">'+esc(ph)+'</span>';
  const fav=document.createElement('span');
  fav.className='fav'+(favs.has(key)?' on':'');
  fav.setAttribute('role','button'); fav.tabIndex=0;
  fav.setAttribute('aria-label','Save this word');
  fav.innerHTML=favs.has(key)?STAR:STAR_O;
  const flip=e=>{
    e.stopPropagation(); e.preventDefault();
    toggleFav(key);
    const on=favs.has(key);
    fav.classList.toggle('on',on);
    fav.innerHTML=on?STAR:STAR_O;
  };
  fav.addEventListener('click',flip);
  fav.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')flip(e)});
  b.appendChild(fav);
  b.addEventListener('click',()=>{
    if(speakingEl===b && speechSynthesis.speaking){stopSpeech();return;}
    stopSpeech(); speak(fr,b);
  });
  return b;
}

function renderGroups(host,groups,q){
  groups.forEach((g,gi)=>{
    const wrap=document.createElement('section');
    wrap.className='group'; wrap.id='g'+gi;
    const h=document.createElement('div');
    h.className='ghead';
    h.innerHTML='<h3>'+esc(g.name)+'</h3>';
    const right=document.createElement('div'); right.className='right';
    right.innerHTML='<span class="gct">'+g.items.length+'</span>';
    const pb=document.createElement('button');
    pb.className='playall';
    pb.innerHTML='<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span class="t">Play all</span>';
    right.appendChild(pb); h.appendChild(right); wrap.appendChild(h);
    if(g.note){const n=document.createElement('div');n.className='note';n.innerHTML=g.note;wrap.appendChild(n);}
    const box=document.createElement('div'); box.className='items '+(g.cols||'');
    const tiles=g.items.map(it=>{const t=makeItem(it,q);box.appendChild(t);return t;});
    wrap.appendChild(box);
    pb.addEventListener('click',()=>playGroup(pb,g.items,tiles));
    host.appendChild(wrap);
  });
}

/* ══════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════ */
function viewHome(){
  stopSpeech();
  main.style.setProperty('--sc','#16233A');
  main.innerHTML='';
  const hero=document.createElement('div');
  hero.className='home-hero';
  hero.innerHTML=
    '<h1>Everything from the course, in one place.</h1>'+
    '<p>Six sections, twenty-one lessons, every phrase we have worked through — with the pronunciation written out and a French voice on every line. Pick a lesson from the left, search across all of it, or hit Practise to drill yourself.</p>'+
    '<div class="figures">'+
      '<div class="fig"><b>'+TOTAL+'</b><span>phrases</span></div>'+
      '<div class="fig"><b>'+LESSONS.length+'</b><span>lessons</span></div>'+
      '<div class="fig"><b>'+DATA.length+'</b><span>sections</span></div>'+
      '<div class="fig"><b>'+favs.size+'</b><span>saved</span></div>'+
    '</div>';
  main.appendChild(hero);

  const grid=document.createElement('div'); grid.className='cards';
  DATA.forEach(sec=>{
    const c=document.createElement('article');
    c.className='scard'; c.style.setProperty('--sc',sec.color);
    let lis='';
    sec.lessons.forEach(les=>{
      lis+='<li><button data-les="'+les.id+'"><span class="lb">'+esc(les.label)+'</span>'+
           '<span class="n">'+esc(les.name)+'</span><span class="c">'+les.count+'</span></button></li>';
    });
    c.innerHTML='<div class="bar"></div><div class="body">'+
      '<div class="meta">'+sec.lessons.length+' lessons · '+sec.count+' phrases</div>'+
      '<h3>'+esc(sec.name)+'</h3><p>'+esc(sec.blurb)+'</p></div><ul>'+lis+'</ul>';
    c.querySelectorAll('[data-les]').forEach(b=>
      b.addEventListener('click',()=>{location.hash='l/'+b.dataset.les;}));
    grid.appendChild(c);
  });
  main.appendChild(grid);
  setActive(null);
  window.scrollTo(0,0);
}

function viewLesson(id){
  stopSpeech();
  const les=lessonById(id); if(!les){viewHome();return;}
  const sec=les.section;
  main.style.setProperty('--sc',sec.color);
  main.innerHTML='';

  const crumb=document.createElement('div');
  crumb.className='crumb';
  crumb.innerHTML='<button data-home>Overview</button><span>/</span>'+
    '<button data-sec>'+esc(sec.name)+'</button><span>/</span><span class="cur">'+esc(les.label)+'</span>';
  crumb.querySelector('[data-home]').addEventListener('click',()=>location.hash='home');
  crumb.querySelector('[data-sec]').addEventListener('click',()=>{
    location.hash='l/'+sec.lessons[0].id; openSection(sec.id);
  });
  main.appendChild(crumb);

  const head=document.createElement('div');
  head.className='lhead';
  head.innerHTML='<span class="ltag">'+esc(les.label)+'</span><h2>'+esc(les.name)+'</h2>'+
    '<p>'+esc(les.summary)+'</p>';
  main.appendChild(head);

  const nav=document.createElement('div'); nav.className='lnav';
  les.groups.forEach((g,i)=>{
    const chip=document.createElement('button');
    chip.className='gchip'; chip.textContent=g.name; chip.dataset.g=i;
    chip.addEventListener('click',()=>{
      document.getElementById('g'+i).scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(chip);
  });
  if(les.groups.length>1) main.appendChild(nav);

  if(les.art && ART[les.art]){
    const fig=document.createElement('figure');
    fig.className='art';
    fig.innerHTML=ART[les.art].svg+'<figcaption>'+esc(ART[les.art].cap)+'</figcaption>';
    main.appendChild(fig);
  }

  renderGroups(main,les.groups,'');

  const idx=LESSONS.indexOf(les);
  const foot=document.createElement('div');
  foot.style.cssText='display:flex;gap:10px;justify-content:space-between;margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)';
  const prev=LESSONS[idx-1], next=LESSONS[idx+1];
  foot.innerHTML=
    (prev?'<button class="tbtn" data-p>← '+esc(prev.label)+'</button>':'<span></span>')+
    (next?'<button class="tbtn" data-n>'+esc(next.label)+' →</button>':'<span></span>');
  if(prev) foot.querySelector('[data-p]').addEventListener('click',()=>location.hash='l/'+prev.id);
  if(next) foot.querySelector('[data-n]').addEventListener('click',()=>location.hash='l/'+next.id);
  main.appendChild(foot);

  setActive(les.id); openSection(sec.id);
  spy(nav);
  window.scrollTo(0,0);
}

function spy(nav){
  const groups=[...main.querySelectorAll('.group')];
  if(!groups.length||!nav.parentNode) return;
  const chips=[...nav.querySelectorAll('.gchip')];
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const i=groups.indexOf(e.target);
        chips.forEach((c,ci)=>c.classList.toggle('on',ci===i));
      }
    });
  },{rootMargin:'-100px 0px -70% 0px'});
  groups.forEach(g=>io.observe(g));
}

function viewFavs(){
  stopSpeech();
  main.style.setProperty('--sc','#D9A400');
  main.innerHTML='';
  const head=document.createElement('div');
  head.className='lhead';
  head.innerHTML='<span class="ltag">Saved</span><h2>Your saved words</h2>'+
    '<p>Tap the star on any card to keep it here. This list lives in your browser, so it survives a refresh on this device.</p>';
  main.appendChild(head);

  const rows=FLAT.filter(r=>favs.has(r.key));
  if(!rows.length){
    main.insertAdjacentHTML('beforeend',
      '<div class="empty"><b>Nothing saved yet.</b>Hover or tap the star in the corner of any card and it will collect here — handy for building a list before a test.</div>');
    setActive('fav'); return;
  }
  const byLes=new Map();
  rows.forEach(r=>{
    const k=r.les.id+'||'+r.group;
    if(!byLes.has(k)) byLes.set(k,{les:r.les,group:r.group,items:[]});
    byLes.get(k).items.push(r.it);
  });
  byLes.forEach(b=>{
    const w=document.createElement('section');
    w.className='rgroup'; w.style.setProperty('--sc',b.les.section.color);
    w.innerHTML='<span class="rpath">'+esc(b.les.label)+' · '+esc(b.group)+'</span>';
    const box=document.createElement('div'); box.className='items two';
    b.items.forEach(it=>box.appendChild(makeItem(it,'')));
    w.appendChild(box); main.appendChild(w);
  });
  setActive('fav');
  window.scrollTo(0,0);
}

function viewSearch(q){
  stopSpeech();
  const term=q.trim().toLowerCase();
  if(!term){route();return;}
  main.style.setProperty('--sc','#16233A');
  main.innerHTML='';
  const hits=FLAT.filter(r=>
    r.it[0].toLowerCase().includes(term)||
    (r.it[2]&&r.it[2].toLowerCase().includes(term))||
    r.it[1].toLowerCase().includes(term)).slice(0,300);

  if(!hits.length){
    main.innerHTML='<div class="empty"><b>Nothing matched “'+esc(q)+'”.</b>Try a shorter word or the English meaning — searching <em>family</em> finds la famille, and <em>87</em> finds quatre-vingt-sept.</div>';
    setActive(null); return;
  }
  main.insertAdjacentHTML('beforeend',
    '<div class="rmeta">'+hits.length+(hits.length===300?'+':'')+' result'+(hits.length===1?'':'s')+' for “'+esc(q)+'”</div>');
  const buckets=new Map();
  hits.forEach(r=>{
    const k=r.les.id+'||'+r.group;
    if(!buckets.has(k)) buckets.set(k,{les:r.les,group:r.group,items:[]});
    buckets.get(k).items.push(r.it);
  });
  buckets.forEach(b=>{
    const w=document.createElement('section');
    w.className='rgroup'; w.style.setProperty('--sc',b.les.section.color);
    w.innerHTML='<button class="rpath" data-go="'+b.les.id+'">'+esc(b.les.section.short)+' · '+esc(b.les.label)+' · '+esc(b.group)+'</button>';
    w.querySelector('[data-go]').addEventListener('click',()=>{
      document.getElementById('q').value=''; location.hash='l/'+b.les.id;
    });
    const box=document.createElement('div'); box.className='items two';
    b.items.forEach(it=>box.appendChild(makeItem(it,term)));
    w.appendChild(box); main.appendChild(w);
  });
  setActive(null);
  window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════
   SIDEBAR
   ══════════════════════════════════════════════ */
const tree=document.getElementById('tree');
function buildTree(){
  DATA.forEach(sec=>{
    const box=document.createElement('div');
    box.className='sec'; box.dataset.sec=sec.id;
    box.style.setProperty('--sc',sec.color);
    const h=document.createElement('button');
    h.className='sechead';
    h.innerHTML='<span class="dot"></span><span class="nm">'+esc(sec.name)+'</span>'+
      '<span class="ct">'+sec.lessons.length+'</span>'+
      '<svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    h.addEventListener('click',()=>box.classList.toggle('open'));
    box.appendChild(h);
    const ul=document.createElement('div'); ul.className='lessons';
    sec.lessons.forEach(les=>{
      const b=document.createElement('button');
      b.className='les'; b.dataset.les=les.id;
      b.innerHTML='<span class="lb">'+esc(les.label)+'</span>'+esc(les.name);
      b.addEventListener('click',()=>{location.hash='l/'+les.id; closeDrawer();});
      ul.appendChild(b);
    });
    box.appendChild(ul);
    tree.appendChild(box);
  });
}
function openSection(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('open',s.dataset.sec===id));
}
function setActive(id){
  document.querySelectorAll('.les').forEach(b=>b.classList.toggle('on',b.dataset.les===id));
  document.getElementById('navhome').classList.toggle('on',id===null&&!location.hash.startsWith('#l/'));
  document.getElementById('navfav').classList.toggle('on',id==='fav');
}
document.getElementById('navhome').addEventListener('click',()=>{location.hash='home';closeDrawer();});
document.getElementById('navfav').addEventListener('click',()=>{location.hash='fav';closeDrawer();});

/* drawer */
const side=document.getElementById('side'), scrim=document.getElementById('scrim');
function openDrawer(){side.classList.add('on');scrim.classList.add('on');}
function closeDrawer(){side.classList.remove('on');scrim.classList.remove('on');}
document.getElementById('menubtn').addEventListener('click',openDrawer);
scrim.addEventListener('click',closeDrawer);

/* ══════════════════════════════════════════════
   PRACTICE
   ══════════════════════════════════════════════ */
const overlay=document.getElementById('overlay'), pbody=document.getElementById('pbody');
let pScope='lesson', pDir='fr', pDeck=[], pIdx=0, pRevealed=false, pDone=0;

function openPractice(){
  overlay.hidden=false;
  document.body.style.overflow='hidden';
  renderPracticeSetup();
}
function closePractice(){
  overlay.hidden=true; document.body.style.overflow=''; stopSpeech();
}
document.getElementById('practicebtn').addEventListener('click',openPractice);
document.getElementById('pclose').addEventListener('click',closePractice);
overlay.addEventListener('click',e=>{if(e.target===overlay)closePractice()});

function scopePool(){
  if(pScope==='favs') return FLAT.filter(r=>favs.has(r.key));
  if(pScope==='all') return FLAT;
  const id=location.hash.replace('#l/','');
  const les=lessonById(id);
  return les?FLAT.filter(r=>r.les.id===les.id):FLAT;
}
function renderPracticeSetup(){
  document.getElementById('ptitle').textContent='Practise';
  const les=lessonById(location.hash.replace('#l/',''));
  const lessonLabel=les?les.label+' · '+les.name:'Current lesson';
  pbody.innerHTML=
   '<div class="optrow"><div class="lab">What to drill</div><div class="opts">'+
     '<button class="opt" data-s="lesson"'+(les?'':' disabled')+'>'+esc(lessonLabel)+'</button>'+
     '<button class="opt" data-s="favs"'+(favs.size?'':' disabled')+'>Saved words ('+favs.size+')</button>'+
     '<button class="opt" data-s="all">Everything</button>'+
   '</div></div>'+
   '<div class="optrow"><div class="lab">Which side first</div><div class="opts">'+
     '<button class="opt" data-d="fr">French → English</button>'+
     '<button class="opt" data-d="en">English → French</button>'+
   '</div></div>'+
   '<div class="prow"><button class="go" id="pstart">Start · 20 cards</button></div>';
  if(!les && pScope==='lesson') pScope='all';
  if(pScope==='favs' && !favs.size) pScope='all';
  pbody.querySelectorAll('[data-s]').forEach(b=>{
    b.classList.toggle('on',b.dataset.s===pScope);
    b.addEventListener('click',()=>{pScope=b.dataset.s;renderPracticeSetup();});
  });
  pbody.querySelectorAll('[data-d]').forEach(b=>{
    b.classList.toggle('on',b.dataset.d===pDir);
    b.addEventListener('click',()=>{pDir=b.dataset.d;renderPracticeSetup();});
  });
  document.getElementById('pstart').addEventListener('click',startDeck);
}
function startDeck(){
  let pool=scopePool().filter(r=>r.it[2]);
  if(pDir==='en') pool=pool.filter(r=>r.it[2]);
  if(!pool.length){ pool=scopePool(); }
  pDeck=[...pool].sort(()=>Math.random()-0.5).slice(0,20);
  pIdx=0; pDone=0; pRevealed=false;
  renderCard();
}
function renderCard(){
  if(pIdx>=pDeck.length){ renderDone(); return; }
  const r=pDeck[pIdx], [fr,ph,en]=r.it;
  document.getElementById('ptitle').textContent='Card '+(pIdx+1)+' of '+pDeck.length;
  const pct=Math.round((pIdx/pDeck.length)*100);
  const promptTxt = pDir==='fr' ? fr : (en||fr);
  pbody.innerHTML=
    '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="pcount"><span>'+esc(r.les.label)+' · '+esc(r.group)+'</span><span>'+pDone+' done</span></div>'+
    '<div class="flash" id="flash">'+
      '<div class="prompt">'+esc(promptTxt)+'</div>'+
      (pRevealed
        ? '<div class="divider"></div>'+
          (pDir==='fr'
            ? '<div class="ansph">'+esc(ph)+'</div><div class="anseng">'+esc(en||'')+'</div>'
            : '<div class="ansfr">'+esc(fr)+'</div><div class="ansph">'+esc(ph)+'</div>')
        : '<div class="sub">'+(pDir==='fr'?'What does it mean?':'How do you say it?')+'</div>')+
    '</div>'+
    (pRevealed
      ? '<div class="prow"><button class="again" id="pagain">Show again later</button><button class="know" id="pknow">Got it</button></div>'
      : '<div class="prow"><button class="tbtn" id="phear" style="flex:none;justify-content:center">Hear it</button><button class="go" id="preveal">Show answer</button></div>');

  if(pRevealed){
    document.getElementById('pagain').addEventListener('click',()=>{
      pDeck.push(pDeck[pIdx]); pIdx++; pRevealed=false; renderCard();
    });
    document.getElementById('pknow').addEventListener('click',()=>{
      pDone++; pIdx++; pRevealed=false; renderCard();
    });
    speak(fr,null);
  } else {
    document.getElementById('preveal').addEventListener('click',()=>{pRevealed=true;renderCard();});
    document.getElementById('phear').addEventListener('click',()=>speak(fr,null));
    if(pDir==='fr') speak(fr,null);
  }
}
function renderDone(){
  document.getElementById('ptitle').textContent='Done';
  pbody.innerHTML='<div class="pdone"><b>'+pDone+' of '+pDeck.length+' first time.</b>'+
    '<p>Cards you asked to see again were shuffled back in, so the count above is the honest one.</p>'+
    '<div class="prow"><button class="tbtn" id="pback" style="justify-content:center">Change settings</button>'+
    '<button class="go" id="pmore">Another 20</button></div></div>';
  document.getElementById('pback').addEventListener('click',renderPracticeSetup);
  document.getElementById('pmore').addEventListener('click',startDeck);
}

/* ══════════════════════════════════════════════
   ROUTING + KEYS
   ══════════════════════════════════════════════ */
function route(){
  const h=location.hash.replace('#','');
  if(h==='fav') return viewFavs();
  if(h.startsWith('l/')) return viewLesson(h.slice(2));
  viewHome();
}
window.addEventListener('hashchange',()=>{
  const q=document.getElementById('q');
  if(q.value){q.value='';}
  route();
});

const qEl=document.getElementById('q');
let deb;
qEl.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>viewSearch(qEl.value),140);});
qEl.addEventListener('keydown',e=>{if(e.key==='Escape'){qEl.value='';qEl.blur();route();}});

document.addEventListener('keydown',e=>{
  if(!overlay.hidden){
    if(e.key==='Escape') closePractice();
    if(e.key===' '&&pDeck.length&&pIdx<pDeck.length){
      const btn=document.getElementById('preveal')||document.getElementById('pknow');
      if(btn){e.preventDefault();btn.click();}
    }
    return;
  }
  if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==='Escape') stopSpeech();
});

buildTree();
route();
</script>
</body>
