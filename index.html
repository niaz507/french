 à la médiathèque"}, {"n": 36, "label": "D1 L2 · p.31 act. 4–6 — le formulaire"}, {"n": 37, "label": "D1 L2 · p.31 act. 4–6 — le formulaire"}, {"n": 38, "label": "D1 L2 · p.32 act. 8 — 70, 80, 90"}, {"n": 39, "label": "D1 L2 · p.32 act. 9 — continuez à compter"}, {"n": 40, "label": "D1 L2 · p.32 act. 10 — phonétique, la liaison"}, {"n": 41, "label": "D1 L2 · p.32 act. 11 — notez les numéros"}, {"n": 42, "label": "D1 L2 · p.33 act. 12 — phonétique, l'ordre"}, {"n": 43, "label": "D1 L2 · p.33 act. 14 — les adresses mail"}]}, {"name": "Demander poliment", "items": [["Je voudrais des informations, s'il vous plaît.", "zhuh voo-DREH day zan-for-ma-see-OHN, seel voo PLEH", "I'd like some information, please."], ["Combien ça coûte ?", "kohm-bee-AN sa KOOT", "How much does it cost?"], ["Ça coûte combien ?", "sa koot kohm-bee-AN", "How much is it? (casual order)"]]}, {"name": "L'article indéfini", "cols": "two", "items": [["un formulaire d'inscription", "uhn for-mew-LAIR dan-skreep-see-OHN", "a registration form (m sing.)"], ["une pièce d'identité", "ewn pee-ESS dee-dahn-tee-TAY", "an ID document (f sing.)"], ["des étudiants", "day zay-tew-dee-AHN", "students (m plur.)"], ["des photos", "day fo-TO", "photos (f plur.)"]]}, {"name": "L'adjectif interrogatif quel", "note": "<strong>quel</strong> agrees with the noun that follows: quel (m sing.) · quelle (f sing.) · quels (m plur.) · quelles (f plur.). All four sound identical — kel.", "items": [["Quel est votre nom ?", "kel ay VOT-ruh NOHN", "What's your surname?"], ["Quel est votre numéro de téléphone ?", "kel ay VOT-ruh new-may-RO duh tay-lay-FON", "What's your phone number?"], ["Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "What's your nationality?"], ["Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "What's your date of birth?"], ["Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO duh tay-lay-FON", "What are your phone numbers?"], ["Quelles sont vos coordonnées ?", "kel sohn vo ko-or-do-NAY", "What are your contact details?"]]}, {"name": "Lire une adresse mail", "cols": "two", "items": [["Yacine point Bellini arobase yahoo point fr", "ya-SEEN pwan bel-LEE-nee a-ro-BAHZ", "yacine.bellini@yahoo.fr"], ["N Roux arobase gmail point com", "enn roo a-ro-BAHZ zhee-mail pwan kom", "nroux@gmail.com"], ["Lina tiret Meunier arobase free point fr", "lee-NAH tee-REH muh-nee-AY", "lina-meunier@free.fr"], ["Paul tiret bas Martini arobase hotmail point fr", "pol tee-reh BAH mar-tee-NEE", "paul_martini@hotmail.fr"]]}, {"name": "Signes et ponctuation", "cols": "three", "items": [["un tiret", "uhn tee-REH", "a dash"], ["un tiret bas", "uhn tee-reh BAH", "an underscore"], ["un slash", "uhn slash", "a slash"], ["une arobase", "ewn a-ro-BAHZ", "an at sign"], ["un point", "uhn PWAN", "a period"], ["une virgule", "ewn veer-GEWL", "a comma"], ["deux points", "duh PWAN", "a colon"], ["un point-virgule", "uhn pwan-veer-GEWL", "a semicolon"], ["un point d'interrogation", "uhn pwan dan-tair-o-ga-see-OHN", "a question mark"], ["un point d'exclamation", "uhn pwan dek-skla-ma-see-OHN", "an exclamation mark"], ["des parenthèses", "day pa-rahn-TEZ", "parentheses"]]}], "bookpages": [30, 31, 32, 33]}, {"id": "ae-d1l3", "label": "Dossier 1 · Leçon 3", "name": "En direct de TV5", "summary": "Pages 34–37. A TV competition to win a trip to Paris: giving personal information, saying which country you live in or were born in, and talking about your passions and dreams.", "art": "prepos", "groups": [{"name": "Les enregistrements", "note": "The original CD tracks for this lesson, in book order. Track numbers are read from the 🎧 icons printed on the pages.", "items": [], "tracks": [{"n": 44, "label": "D1 L3 · p.34 act. 2 — l'émission de TV5"}, {"n": 45, "label": "D1 L3 · p.34 act. 2 — l'émission de TV5"}, {"n": 46, "label": "D1 L3 · p.36 act. 5 — les quatre candidats"}, {"n": 47, "label": "D1 L3 · p.36 act. 5 — les quatre candidats"}, {"n": 48, "label": "D1 L3 · p.37 act. 7d — même prononciation ?"}, {"n": 49, "label": "D1 L3 · p.37 act. 8 — le tirage au sort"}, {"n": 50, "label": "D1 L3 · p.37 act. 8 — le tirage au sort"}, {"n": 51, "label": "D1 L3 · p.37 act. 9 — ils sont / ils ont"}, {"n": 52, "label": "D1 L3 · p.37 act. 9 — ils sont / ils ont"}, {"n": 53, "label": "D1 L3 · p.37 act. 9 — ils sont / ils ont"}]}, {"name": "Le jeu-concours — l'affiche", "cols": "", "items": [["un jeu-concours", "uhn zhuh-kohn-KOOR", "a prize competition"], ["Paris… mon rêve !", "pa-REE… mohn REV", "Paris… my dream!"], ["Allez à Paris pour réaliser votre rêve !", "a-LAY a pa-REE poor ray-a-lee-ZAY VOT-ruh REV", "Go to Paris to make your dream come true!"], ["L'émission « Rêve et réalité »", "lay-mee-see-OHN REV ay ray-a-lee-TAY", "The show “Dream and Reality”"], ["Air Vacances offrent un voyage à Paris pour deux personnes.", "air va-KAHNSS OF-ruh tuhn vwa-YAHZH a pa-REE poor duh pair-SUN", "Air Vacances are offering a trip to Paris for two people."], ["Participer au concours, c'est simple !", "par-tee-see-PAY oh kohn-KOOR, say SAN-pluh", "Entering the competition is easy!"], ["Vous complétez et vous envoyez le bulletin de participation.", "voo kohm-play-TAY ay voo zahn-vwa-YAY luh bewl-TAN duh par-tee-see-pa-see-OHN", "You fill in and send off the entry form."], ["Tirage au sort le 15 janvier.", "tee-RAHZH oh SOR luh kanz zhahn-vee-AY", "Prize draw on 15 January."], ["Vous gagnez ? Nous réalisons votre rêve !", "voo ga-NYAY ? noo ray-a-lee-ZOHN VOT-ruh REV", "You win? We make your dream happen!"]]}, {"name": "Le bulletin de participation", "cols": "three", "items": [["le nom", "luh NOHN", "surname"], ["le prénom", "luh pray-NOHN", "first name"], ["l'adresse", "la-DRESS", "address"], ["la ville", "lah VEEL", "town / city"], ["le pays", "luh pay-EE", "country"], ["le n° de téléphone", "luh new-may-RO duh tay-lay-FON", "phone number"], ["le mail", "luh MAIL", "email"], ["la profession", "lah pro-fay-see-OHN", "occupation"], ["l'âge", "LAHZH", "age"], ["mon rêve", "mohn REV", "my dream"]]}, {"name": "Activité 1 — c'est quoi, ce document ?", "note": "The right answer is <strong>2</strong>. It is not an advert for a trip (the trip is only the prize) and not an invitation to a show — it is an announcement asking you to enter a competition.", "items": [["une publicité pour un voyage", "ewn pew-blee-see-TAY poor uhn vwa-YAHZH", "an advert for a trip"], ["une annonce pour un jeu-concours", "ewn a-NONSS poor uhn zhuh-kohn-KOOR", "an announcement for a competition — ✓ correct"], ["une carte d'invitation à une émission", "ewn kart dan-vee-ta-see-OHN a ewn ay-mee-see-OHN", "an invitation card to a TV show"]]}, {"name": "Point Langue — les prépositions + pays", "note": "<strong>en</strong> for a feminine country, and for any country starting with a vowel · <strong>au</strong> for a masculine country · <strong>aux</strong> for a plural country · <strong>à</strong> for a handful of countries that behave like cities (Madagascar, Singapour, Cuba, Haïti).<br><br>The same three prepositions work with <em>j'habite</em>, <em>je suis né(e)</em> and <em>je vis</em>.", "cols": "two", "items": [["J'habite", "zha-BEET", "I live"], ["Je suis né / Je suis née", "zhuh swee NAY", "I was born"], ["Je vis", "zhuh VEE", "I live"], ["la Tunisie → en Tunisie", "ahn tew-nee-ZEE", "feminine → en"], ["l'Italie → en Italie", "ah nee-ta-LEE", "starts with a vowel → en"], ["le Sénégal → au Sénégal", "oh say-nay-GAL", "masculine → au"], ["le Canada → au Canada", "oh ka-na-DAH", "masculine → au"], ["les États-Unis → aux États-Unis", "oh zay-ta-zew-NEE", "plural → aux"], ["Madagascar → à Madagascar", "a ma-da-gas-KAR", "treated like a city → à"], ["Singapour → Je suis né à Singapour.", "zhuh swee nay a san-ga-POOR", "I was born in Singapore."], ["J'habite en France.", "zha-BEET ahn FRAHNSS", "I live in France."], ["Je suis né au Maroc.", "zhuh swee nay oh ma-ROK", "I was born in Morocco."], ["Je vis aux Philippines.", "zhuh vee oh fee-lee-PEEN", "I live in the Philippines."]]}, {"name": "Point Culture — la francophonie", "items": [["Issa, Nora, Tom et Céline ne sont pas français, mais ils parlent français.", "ee-SAH, no-RAH, tom ay say-LEEN nuh sohn pah frahn-SAY, may zeel parl frahn-SAY", "Issa, Nora, Tom and Céline aren't French, but they speak French."], ["Plus de 200 millions de personnes sont francophones.", "plew duh duh sahn meel-YOHN duh pair-SUN sohn frahn-ko-FON", "Over 200 million people are French-speaking."], ["Le français est la première langue de 80 millions de personnes.", "luh frahn-SAY ay lah pruh-mee-AIR lahng duh katr-van meel-YOHN", "French is the first language of 80 million people."], ["Le français est la troisième langue sur Internet.", "… lah trwa-zee-EM lahng sewr an-tair-NET", "French is the third language on the internet."], ["après l'anglais et l'allemand", "a-PRAY lahn-GLAY ay lal-MAHN", "after English and German"], ["Le français est en 11e position des 6 000 langues parlées dans le monde.", "… ahn ohn-ZEEM po-zee-see-OHN day see meel lahng par-LAY dahn luh MOHND", "French is 11th of the 6,000 languages spoken in the world."], ["83 millions de personnes apprennent le français.", "katr-van-trwah meel-YOHN duh pair-SUN a-PREN luh frahn-SAY", "83 million people are learning French."], ["Il y a 900 000 professeurs de français dans le monde.", "eel ee a nuhf sahn meel pro-fess-UR duh frahn-SAY", "There are 900,000 French teachers in the world."]]}, {"name": "Activité 3 — les sites et monuments", "note": "The pattern: <strong>[site] est</strong> + preposition + country, then <strong>à</strong> + city. Photo letters from your book are given at the end of each line.", "items": [["La 5e Avenue est aux États-Unis, à New York.", "lah san-kee-EM av-NEW ay oh zay-ta-zew-NEE", "Fifth Avenue — USA, New York · photo g"], ["La Cité interdite est en Chine, à Pékin.", "lah see-TAY an-tair-DEET ay ahn SHEEN, a pay-KAN", "The Forbidden City — China, Beijing · photo f"], ["Big Ben est en Angleterre, à Londres.", "big ben ay ah nahn-gluh-TAIR, a LOHN-druh", "Big Ben — England, London · photo a"], ["La mosquée Hassan-II est au Maroc, à Casablanca.", "lah mos-KAY a-SAHN duh ay oh ma-ROK, a ka-za-BLAHN-ka", "The Hassan II Mosque — Morocco, Casablanca · photo i"], ["Le Colisée est en Italie, à Rome.", "luh ko-lee-ZAY ay ah nee-ta-LEE, a ROHM", "The Colosseum — Italy, Rome · photo b"], ["Le Parthénon est en Grèce, à Athènes.", "luh par-tay-NOHN ay ahn GRESS, a a-TEN", "The Parthenon — Greece, Athens · photo h"], ["Le Mont-Saint-Michel est en France, en Normandie.", "luh mohn-san-mee-SHELL ay ahn FRAHNSS", "Mont-Saint-Michel — France, Normandy · photo c"], ["Le Kilimandjaro est en Tanzanie.", "luh kee-lee-mahn-dja-RO ay ahn tahn-za-NEE", "Kilimanjaro — Tanzania · photo d"], ["Copacabana est au Brésil, à Rio de Janeiro.", "ko-pa-ka-ba-NAH ay oh bray-ZEEL, a ree-O duh zha-nay-RO", "Copacabana — Brazil, Rio de Janeiro · photo e"], ["Le Taj Mahal est en Inde.", "luh taj ma-AL ay ah NAND", "The Taj Mahal is in India. — the example for activity 4"]]}, {"name": "Les quatre photos — Paris", "cols": "two", "items": [["La Fête de la musique", "lah fet duh lah mew-ZEEK", "The Music Festival — every 21 June"], ["Le feu d'artifice de la tour Eiffel", "luh fuh dar-tee-FEESS duh lah toor ay-FELL", "The Eiffel Tower fireworks"], ["Le Louvre", "luh LOO-vruh", "The Louvre"], ["L'arrivée du Tour de France", "la-ree-VAY dew toor duh FRAHNSS", "The finish of the Tour de France"]]}, {"name": "Activité 5 — les passions des candidats", "cols": "three", "items": [["Issa → la musique", "ee-SAH → lah mew-ZEEK", "Issa → music"], ["Nora → le cyclisme", "no-RAH → luh see-KLEEZ-muh", "Nora → cycling"], ["Tom → la peinture", "tom → lah pan-TEWR", "Tom → painting"]]}, {"name": "Activité 6 — les réponses des candidats", "note": "Text <strong>a</strong> is <strong>Issa</strong> — the passion is music. Text <strong>b</strong> is <strong>Nora</strong> — the passion is cycling.", "items": [["Je rêve d'aller à Paris pour la Fête de la musique le 21 juin, avec ma copine.", "zhuh rev da-LAY a pa-REE poor lah fet duh lah mew-ZEEK luh van-tay-uhn ZHWAN, a-vek ma ko-PEEN", "I dream of going to Paris for the Music Festival on 21 June, with my girlfriend."], ["Comme moi, elle joue de la guitare.", "kom MWAH, el zhoo duh lah gee-TAR", "Like me, she plays the guitar."], ["Et nous adorons la musique, toutes les musiques !", "ay noo za-do-ROHN lah mew-ZEEK, toot lay mew-ZEEK", "And we love music, all kinds of music!"], ["Ma passion, c'est le cyclisme.", "ma pa-see-OHN, say luh see-KLEEZ-muh", "My passion is cycling."], ["Mon rêve, c'est de voir les coureurs du Tour quand ils arrivent sur les Champs-Élysées !", "mohn REV, say duh vwahr lay koo-RUR dew TOOR kahn teel za-REEV sewr lay shahn-zay-lee-ZAY", "My dream is to see the Tour riders when they arrive on the Champs-Élysées!"]]}, {"name": "Aide-mémoire — exprimer une passion, un rêve", "note": "Activity 7 asks you to find the equivalents in the two texts. <strong>J'ai une passion : le cyclisme</strong> ↔ <em>Ma passion, c'est le cyclisme.</em> · <strong>J'ai un rêve : aller à Paris</strong> ↔ <em>Je rêve d'aller à Paris.</em>", "cols": "two", "items": [["J'ai une passion : le cyclisme.", "zhay ewn pa-see-OHN : luh see-KLEEZ-muh", "I have a passion: cycling."], ["Ma passion, c'est le cyclisme.", "ma pa-see-OHN, say luh see-KLEEZ-muh", "My passion is cycling."], ["J'adore le cyclisme.", "zha-DOR luh see-KLEEZ-muh", "I love cycling."], ["J'ai un rêve : visiter Paris.", "zhay uhn REV : vee-zee-TAY pa-REE", "I have a dream: to visit Paris."], ["Mon rêve ? Visiter Paris.", "mohn REV ? vee-zee-TAY pa-REE", "My dream? To visit Paris."], ["Je rêve de visiter Paris.", "zhuh rev duh vee-zee-TAY pa-REE", "I dream of visiting Paris."], ["Mon rêve, c'est de visiter Paris.", "mohn REV, say duh vee-zee-TAY pa-REE", "My dream is to visit Paris."]]}, {"name": "Point Langue — le présent des verbes en -er", "note": "Take the infinitive, remove <strong>-er</strong>, and you have the <strong>base</strong>: rêver → <code>rêv-</code>, arriver → <code>arriv-</code>, travailler → <code>travaill-</code>, jouer → <code>jou-</code>. Then add the endings <strong>-e, -es, -e, -ons, -ez, -ent</strong>.", "cols": "two", "items": [["je rêve", "zhuh REV", "I dream"], ["tu rêves", "tew REV", "you dream"], ["il / elle rêve", "eel / el REV", "he / she dreams"], ["nous rêvons", "noo ray-VOHN", "we dream"], ["vous rêvez", "voo ray-VAY", "you dream"], ["ils / elles rêvent", "eel / el REV", "they dream"], ["j'adore", "zha-DOR", "I love"], ["tu adores", "tew a-DOR", "you love"], ["il / elle adore", "eel / el a-DOR", "he / she loves"], ["nous adorons", "noo za-do-ROHN", "we love"], ["vous adorez", "voo za-do-RAY", "you love"], ["ils / elles adorent", "eel / el za-DOR", "they love"]]}, {"name": "Activité d & e — même prononciation ?", "note": "<strong>The rule you are meant to find:</strong> <em>je rêve, tu rêves, il rêve, ils rêvent</em> are <strong>written differently</strong> but <strong>pronounced identically</strong>. Only <em>nous</em> and <em>vous</em> actually change the sound.", "items": [["il travaille — ils travaillent", "eel tra-VIGH — eel tra-VIGH", "same sound ✓"], ["je rêve — nous rêvons", "zhuh REV — noo ray-VOHN", "different ✗"], ["vous rêvez — ils rêvent", "voo ray-VAY — eel REV", "different ✗"], ["tu adores — il adore", "tew a-DOR — eel a-DOR", "same sound ✓"]]}, {"name": "Activité 9 — Phonétique : les liaisons", "note": "<strong>ils sont</strong> keeps an <code>[s]</code> sound; <strong>ils ont</strong> gains a <code>[z]</code> — that liaison is the only thing telling you 'they are' from 'they have'.", "items": [["Ils sont / Ils ont", "eel SOHN / eel ZOHN", "They are / They have"], ["Ils ont deux passions.", "eel ZOHN duh pa-see-OHN", "They have two passions."], ["Vous êtes canadien.", "voo ZET ka-na-dee-AN", "You are Canadian."], ["Nous allons tirer au sort.", "noo za-LOHN tee-RAY oh SOR", "We're going to draw the winner."], ["Ils ont un rêve.", "eel ZOHN tuhn REV", "They have a dream."], ["Nous avons quatre finalistes.", "noo za-VOHN katr fee-na-LEEST", "We have four finalists."], ["Ils arrivent sur les Champs-Élysées.", "eel za-REEV sewr lay shahn-zay-lee-ZAY", "They arrive on the Champs-Élysées."], ["Ils habitent aux États-Unis.", "eel za-BEET oh zay-ta-zew-NEE", "They live in the United States."]]}, {"name": "Point Langue — être et avoir", "note": "<strong>être</strong> for what you are: job, nationality, age bracket, where you are. <strong>avoir</strong> for what you have: a passion, a dream — and, unlike English, your age.", "cols": "two", "items": [["Je suis architecte.", "zhuh swee zar-shee-TEKT", "I'm an architect."], ["Je suis marocain.", "zhuh swee ma-ro-KAN", "I'm Moroccan."], ["Il est jeune.", "eel ay ZHUHN", "He's young."], ["Il est étudiant.", "eel et ay-tew-dee-AHN", "He's a student."], ["Ils sont au Canada.", "eel sohn toh ka-na-DAH", "They're in Canada."], ["J'ai une passion.", "zhay ewn pa-see-OHN", "I have a passion."], ["Il a dix-neuf ans.", "eel a deez-nuh VAHN", "He's nineteen."], ["Ils ont un rêve.", "eel zohn tuhn REV", "They have a dream."]]}, {"name": "Le vocabulaire de la leçon", "cols": "two", "items": [["un rêve", "uhn REV", "a dream"], ["rêver de", "ray-VAY duh", "to dream of"], ["une passion", "ewn pa-see-OHN", "a passion"], ["adorer", "a-do-RAY", "to love, adore"], ["une émission", "ewn ay-mee-see-OHN", "a TV / radio show"], ["un concours", "uhn kohn-KOOR", "a competition"], ["le tirage au sort", "luh tee-RAHZH oh SOR", "the prize draw"], ["un bulletin de participation", "uhn bewl-TAN duh par-tee-see-pa-see-OHN", "an entry form"], ["participer", "par-tee-see-PAY", "to take part"], ["compléter", "kohm-play-TAY", "to fill in"], ["envoyer", "ahn-vwa-YAY", "to send"], ["gagner", "ga-NYAY", "to win"], ["réaliser", "ray-a-lee-ZAY", "to make happen, fulfil"], ["un finaliste", "uhn fee-na-LEEST", "a finalist"], ["un présentateur", "uhn pray-zahn-ta-TUR", "a presenter"], ["un candidat", "uhn kahn-dee-DAH", "a contestant"], ["une publicité", "ewn pew-blee-see-TAY", "an advert"], ["une annonce", "ewn a-NONSS", "an announcement"], ["un voyage", "uhn vwa-YAHZH", "a trip"], ["la réalité", "lah ray-a-lee-TAY", "reality"], ["un site", "uhn SEET", "a site"], ["un monument", "uhn mo-new-MAHN", "a monument"], ["une mosquée", "ewn mos-KAY", "a mosque"], ["le cyclisme", "luh see-KLEEZ-muh", "cycling"], ["un coureur", "uhn koo-RUR", "a racer, rider"], ["la peinture", "lah pan-TEWR", "painting"], ["une guitare", "ewn gee-TAR", "a guitar"], ["jouer de la guitare", "zhoo-AY duh lah gee-TAR", "to play the guitar"], ["un feu d'artifice", "uhn fuh dar-tee-FEESS", "a fireworks display"], ["une fête", "ewn FET", "a festival, party"], ["francophone", "frahn-ko-FON", "French-speaking"], ["la francophonie", "lah frahn-ko-fo-NEE", "the French-speaking world"], ["le monde", "luh MOHND", "the world"], ["habiter", "a-bee-TAY", "to live (somewhere)"], ["vivre", "VEE-vruh", "to live"], ["naître — je suis né(e)", "NEH-truh — zhuh swee NAY", "to be born — I was born"], ["arriver", "a-ree-VAY", "to arrive"], ["travailler", "tra-va-YAY", "to work"], ["un architecte", "uh nar-shee-TEKT", "an architect"]]}], "bookpages": [34, 35, 36, 37]}, {"id": "ae-d1-carnet", "label": "Dossier 1 · Carnet de voyage", "name": "La France en Europe", "summary": "Pages 38–39. France's neighbours and seas, fourteen symbols of Europe to place, and the country in six numbers.", "art": "voisins", "groups": [{"name": "L'Hexagone", "items": [["« L'Hexagone » est un autre nom pour « la France ».", "lek-sa-GON ay tuh-NOH-truh nohn poor lah FRAHNSS", "“The Hexagon” is another name for France."], ["un hexagone", "uh nek-sa-GON", "a hexagon — France has six roughly straight sides"], ["Repérez la France sur la carte d'Europe.", "ruh-pay-RAY lah FRAHNSS sewr lah kart duh-ROP", "Find France on the map of Europe."], ["Testez vos connaissances en géographie.", "tes-TAY vo ko-nay-SAHNSS ahn zhay-o-gra-FEE", "Test your geography knowledge."]]}, {"name": "Activité 2a — les pays voisins de la France", "note": "<strong>Six of the listed countries border France:</strong> l'Allemagne, la Belgique, l'Espagne, le Luxembourg, l'Italie, la Suisse.<br><br>The others do <em>not</em> touch France: l'Irlande, la Pologne, le Portugal, la Suède, les Pays-Bas, l'Autriche. (France also borders Monaco and Andorra, which aren't on the list.)", "cols": "two", "items": [["l'Allemagne", "lal-MAHN-yuh", "Germany — voisin ✓"], ["la Belgique", "lah bel-ZHEEK", "Belgium — voisin ✓"], ["l'Espagne", "les-PAN-yuh", "Spain — voisin ✓"], ["le Luxembourg", "luh lewk-sahm-BOOR", "Luxembourg — voisin ✓"], ["l'Italie", "lee-ta-LEE", "Italy — voisin ✓"], ["la Suisse", "lah SWEESS", "Switzerland — voisin ✓"], ["l'Irlande", "leer-LAHND", "Ireland — pas voisin ✗"], ["la Pologne", "lah po-LON-yuh", "Poland — pas voisin ✗"], ["le Portugal", "luh por-tew-GAL", "Portugal — pas voisin ✗"], ["la Suède", "lah sew-ED", "Sweden — pas voisin ✗"], ["les Pays-Bas", "lay pay-ee-BAH", "the Netherlands — pas voisin ✗"], ["l'Autriche", "loh-TREESH", "Austria — pas voisin ✗"]]}, {"name": "Activités 2b, 2c, 2d — les réponses", "note": "<strong>b)</strong> Three neighbours are French-speaking: la Belgique, la Suisse, le Luxembourg.<br><strong>c)</strong> France is bordered by la mer du Nord, la mer Méditerranée and l'océan Atlantique — plus la Manche, the Channel. Not the Pacific, not the Black Sea.<br><strong>d)</strong> The green countries are the members of the European Union.", "cols": "two", "items": [["Les pays voisins francophones sont la Belgique, la Suisse et le Luxembourg.", "lay pay-ee vwa-ZAN frahn-ko-FON sohn lah bel-ZHEEK, lah SWEESS ay luh lewk-sahm-BOOR", "The French-speaking neighbours are Belgium, Switzerland and Luxembourg."], ["la mer du Nord", "lah mair dew NOR", "the North Sea ✓"], ["la mer Méditerranée", "lah mair may-dee-tay-ra-NAY", "the Mediterranean ✓"], ["l'océan Atlantique", "lo-say-AHN at-lahn-TEEK", "the Atlantic Ocean ✓"], ["la Manche", "lah MAHNSH", "the English Channel ✓"], ["l'océan Pacifique", "lo-say-AHN pa-see-FEEK", "the Pacific — ✗ not France"], ["la mer Noire", "lah mair NWAHR", "the Black Sea — ✗ not France"], ["Les pays de couleur verte sont les pays de l'Union européenne.", "lay pay-ee duh koo-LUR VAIRT sohn lay pay-ee duh lew-nee-OHN uh-ro-pay-EN", "The green countries are the European Union countries."]]}, {"name": "Activité 3 — quelques symboles", "note": "The country represented <strong>three times</strong> is <strong>la France</strong>: la mode, le TGV and 1789.", "cols": "two", "items": [["1. la mode → la France", "lah MOD", "fashion → France · événements/culture"], ["2. la Saint-Patrick → l'Irlande", "lah san-pa-TREEK", "St Patrick's Day → Ireland · événements/culture"], ["3. le TGV → la France", "luh tay-zhay-VAY", "the high-speed train → France · technologie"], ["4. le carnaval → l'Italie", "luh kar-na-VAL", "the carnival (Venice) → Italy · événements/culture"], ["5. Mozart → l'Autriche", "mo-ZAR", "Mozart → Austria · personnages célèbres"], ["6. 1789 → la France", "meel set sahn kat-ruh-van-NUHF", "1789, the Revolution → France · événements/culture"], ["7. Vermeer → les Pays-Bas", "vair-MEER", "Vermeer → the Netherlands · personnages célèbres"], ["8. Volkswagen → l'Allemagne", "volks-va-GEN", "Volkswagen → Germany · technologie"], ["9. les moules-frites → la Belgique", "lay mool-FREET", "mussels and chips → Belgium · spécialités/gastronomie"], ["10. une montre → la Suisse", "ewn MOHN-truh", "a watch → Switzerland · technologie"], ["11. Vasco de Gama → le Portugal", "vas-KO duh ga-MAH", "Vasco da Gama → Portugal · personnages célèbres"], ["12. la paella → l'Espagne", "lah pa-ay-LAH", "paella → Spain · spécialités/gastronomie"], ["13. l'heure du thé → le Royaume-Uni", "lur dew TAY", "teatime → the United Kingdom · événements/culture"], ["14. Kafka → la République tchèque", "kaf-KAH", "Kafka → the Czech Republic · personnages célèbres"]]}, {"name": "Les catégories", "cols": "two", "items": [["les spécialités / la gastronomie", "lay spay-see-a-lee-TAY / lah gas-tro-no-MEE", "specialities / food"], ["la technologie", "lah tek-no-lo-ZHEE", "technology"], ["les événements / la culture", "lay zay-vayn-MAHN / lah kewl-TEWR", "events / culture"], ["les personnages célèbres", "lay pair-so-NAHZH say-LEB-ruh", "famous figures"], ["les monuments", "lay mo-new-MAHN", "monuments"], ["l'histoire", "lees-TWAHR", "history"]]}, {"name": "Activité 5 — la France en chiffres", "note": "The six numbers <code>2,2 – 12 – 66 – 533 965 – 22 – 9</code> slot in like this. Note the French decimal comma: <strong>2,2</strong> is read <em>deux virgule deux</em>.", "items": [["les habitants : 66 millions", "lay za-bee-TAHN : swa-sahnt-sees meel-YOHN", "inhabitants: 66 million"], ["la superficie : 533 965 kilomètres carrés", "lah sew-pair-fee-SEE : sank sahn trahnt-trwah meel nuhf sahn swa-sahnt-sank kee-lo-MET-ruh ka-RAY", "area: 533,965 km²"], ["les régions : 22", "lay ray-zhee-OHN : van-DUH", "regions: 22"], ["le salaire minimum : 9 euros de l'heure", "luh sa-LAIR mee-nee-MOM : nuh vuh-RO duh LUR", "minimum wage: €9 an hour"], ["le nombre d'habitants à Paris : 2,2 millions", "luh NOHM-bruh da-bee-TAHN a pa-REE : duh veer-gewl duh meel-YOHN", "people in Paris: 2.2 million"], ["dans le grand Paris (Paris + banlieue) : 12 millions", "dahn luh grahn pa-REE (pa-REE plew bahn-lee-UH) : dooz meel-YOHN", "in greater Paris (city + suburbs): 12 million"]]}, {"name": "Le vocabulaire du carnet", "cols": "two", "items": [["un carnet de voyage", "uhn kar-NAY duh vwa-YAHZH", "a travel notebook"], ["une carte", "ewn KART", "a map"], ["un pays voisin", "uhn pay-EE vwa-ZAN", "a neighbouring country"], ["entourer", "ahn-too-RAY", "to surround"], ["une mer", "ewn MAIR", "a sea"], ["un océan", "uh no-say-AHN", "an ocean"], ["représenter", "ruh-pray-zahn-TAY", "to represent"], ["un symbole", "uhn san-BOL", "a symbol"], ["dessiner", "day-see-NAY", "to draw"], ["les habitants", "lay za-bee-TAHN", "the inhabitants"], ["la superficie", "lah sew-pair-fee-SEE", "the surface area"], ["une région", "ewn ray-zhee-OHN", "a region"], ["le salaire minimum", "luh sa-LAIR mee-nee-MOM", "the minimum wage"], ["la banlieue", "lah bahn-lee-UH", "the suburbs"], ["les chiffres", "lay SHEE-fruh", "the figures, numbers"], ["les connaissances", "lay ko-nay-SAHNSS", "knowledge"]]}], "bookpages": [38, 39]}, {"id": "ae-d1-sexercer", "label": "Dossier 1 · S'exercer", "name": "Les corrigés", "summary": "Pages 40–41. All eighteen practice exercises worked through — greetings, tu/vous, avoir, negation, possessives, articles, quel, numbers, prepositions, -ER verbs, être and avoir.", "art": null, "groups": [{"name": "Ex. 1 — les personnes", "note": "This one matches labels to eight drawings, so the pairing depends on your page. Here is the full label list with pronunciation — several labels can fit the same picture, which the exercise itself warns about.", "cols": "three", "items": [["un homme", "uh NOM", "a man"], ["une femme", "ewn FAM", "a woman"], ["un monsieur", "uhn muh-SYUH", "a gentleman"], ["une dame", "ewn DAM", "a lady"], ["un garçon", "uhn gar-SOHN", "a boy"], ["une fille", "ewn FEE-yuh", "a girl"], ["un jeune homme", "uhn zhuh-NOM", "a young man"], ["une jeune femme", "ewn zhuhn FAM", "a young woman"], ["une jeune fille", "ewn zhuhn FEE-yuh", "a young girl"], ["un bébé", "uhn bay-BAY", "a baby"], ["un enfant", "uh nahn-FAHN", "a child"]]}, {"name": "Ex. 2 — saluer", "items": [["1. — Bonjour ! Tu vas bien ? — Oui, et toi ?", "bohn-ZHOOR ! tew va bee-AN ? — wee, ay TWAH", "Hello! You OK? — Yes, and you?"], ["2. — Bonjour, madame. — Bonjour, mademoiselle. Comment allez-vous ? — Très bien, et vous ?", "… ko-mahn ta-lay VOO ? — tray bee-AN, ay VOO", "Hello madam… How are you? — Very well, and you?"], ["3. — Bonjour, monsieur. — Bonjour mademoiselle, vous allez bien ? — Bien, merci.", "… voo za-lay bee-AN ? — bee-AN, mair-SEE", "Hello sir. — Hello miss, are you well? — Fine, thanks."], ["4. — Salut ! Tu vas bien ? — Super, et toi ?", "sa-LEW ! tew va bee-AN ? — sew-PAIR, ay TWAH", "Hi! You OK? — Great, and you?"]]}, {"name": "Ex. 3 — tu ou vous ?", "items": [["1. — Bonjour, monsieur, comment allez-vous ? — Bien, merci.", "ko-mahn ta-lay VOO", "Formal → vous"], ["2. — Bonjour, tu vas bien ? — Oui, et toi ?", "tew va bee-AN", "Informal → tu"], ["3. — Salut les filles ! Vous allez bien ? — Oui, ça va !", "voo za-lay bee-AN", "Several people → vous, even though they're friends"]]}, {"name": "Ex. 4 — le verbe avoir", "items": [["1. — Tu as quel âge ? — J'ai dix-huit ans.", "tew a kel AHZH ? — zhay dee-zwee TAHN", "How old are you? — I'm eighteen."], ["2. — Vous avez des contacts ? — Oui, nous avons des contacts anglophones et francophones.", "voo za-VAY day kohn-TAKT ? — wee, noo za-VOHN", "Do you have contacts? — Yes, we have English- and French-speaking contacts."], ["3. — Tu as des amis à l'université ? — Oui, j'ai deux amis d'origine mexicaine mais ils ont la nationalité française.", "tew a day za-MEE … eel zohn lah na-see-o-na-lee-TAY frahn-SEZ", "Do you have friends at university? — Yes, two of Mexican origin but they have French nationality."], ["4. — Rachida a vingt-deux ans comme toi ? — Non, elle a vingt ans.", "ra-shee-DAH a van-DUH zahn kom TWAH ? — nohn, el a van TAHN", "Is Rachida twenty-two like you? — No, she's twenty."], ["5. — Tu n'as pas cours, aujourd'hui ? — Non. C'est bien, j'ai le temps d'aller au cinéma !", "tew na pah KOOR, oh-zhoor-DWEE ? — … zhay luh TAHN da-LAY oh see-nay-MAH", "No class today? — No. Good, I've time to go to the cinema!"]]}, {"name": "Ex. 5 — la négation ne… pas", "items": [["1. Elle étudie l'économie ou elle n'étudie pas l'économie ?", "el ay-tew-DEE lay-ko-no-MEE oo el nay-tew-DEE pah", "Does she study economics or not?"], ["2. Nous travaillons le matin ou nous ne travaillons pas le matin ?", "noo tra-va-YOHN luh ma-TAN oo noo nuh tra-va-YOHN pah", "Do we work mornings or not?"], ["3. Ils sont français ou ils ne sont pas français ?", "eel sohn frahn-SAY oo eel nuh sohn pah frahn-SAY", "Are they French or not?"], ["4. Je travaille le mardi ou je ne travaille pas le mardi ?", "zhuh tra-VIGH luh mar-DEE oo zhuh nuh tra-VIGH pah", "Do I work Tuesdays or not?"], ["5. Tu es étudiant ou tu n'es pas étudiant ?", "tew ay zay-tew-dee-AHN oo tew nay pah zay-tew-dee-AHN", "Are you a student or not?"], ["6. Vous avez 20 ans ou vous n'avez pas 20 ans ?", "voo za-VAY van TAHN oo voo na-VAY pah", "Are you twenty or not?"]]}, {"name": "Ex. 6 — l'adjectif possessif", "note": "<strong>mon / ma / mes</strong> = my · <strong>votre / vos</strong> = your (polite). The choice follows the <em>noun</em>, not the owner: <em>ma langue</em> because langue is feminine, <em>mes études</em> because études is plural.", "items": [["1. Votre profil : votre nom, votre âge, vos coordonnées, votre nationalité, votre langue maternelle, vos études.", "VOT-ruh pro-FEEL : VOT-ruh nohn, VOT-ruh AHZH, vo ko-or-do-NAY…", "Your profile: your name, age, contact details, nationality, mother tongue, studies."], ["2. Votre connexion : votre adresse mail — votre mot de passe.", "VOT-ruh ko-nek-see-OHN : VOT-ruh a-DRESS mail — VOT-ruh mo duh PAHSS", "Your login: your email address — your password."], ["3. Mon profil : mon nom : Lorenzo Lentati — mon âge : 35 ans — ma langue maternelle : italien — mes études : architecture.", "mohn pro-FEEL : mohn NOHN … ma lahng ma-tair-NELL … may zay-TEWD", "My profile: my name, my age, my mother tongue, my studies."]]}, {"name": "Ex. 7 — l'article indéfini", "items": [["L'étudiante demande des informations pour une inscription dans une médiathèque.", "lay-tew-dee-AHNT duh-MAHND day zan-for-ma-see-OHN poor ewn an-skreep-see-OHN dahn zewn may-dee-a-TEK", "The student asks for information about registering at a media library."], ["Elle complète un formulaire.", "el kohm-PLET uhn for-mew-LAIR", "She fills in a form."], ["L'employé demande une photo et une pièce d'identité : un passeport ou une carte d'identité.", "lahm-plwa-YAY duh-MAHND ewn fo-TO ay ewn pee-ESS dee-dahn-tee-TAY", "The clerk asks for a photo and ID: a passport or an identity card."]]}, {"name": "Ex. 8 — l'adjectif interrogatif quel", "items": [["— Bonjour, c'est pour une inscription, s'il vous plaît.", "bohn-ZHOOR, say poor ewn an-skreep-see-OHN", "Hello, it's to register, please."], ["— Quel est votre nom ? — Bourdier.", "kel ay VOT-ruh NOHN ? — boor-dee-AY", "What's your surname? — Bourdier."], ["— Quel est votre prénom ? — Sandra.", "kel ay VOT-ruh pray-NOHN ? — sahn-DRAH", "What's your first name? — Sandra."], ["— Vous habitez à quelle adresse ? — 20 rue Marie Curie, 54000 Nancy.", "voo za-bee-TAY a kel a-DRESS", "What address do you live at? — 20 rue Marie Curie, 54000 Nancy."], ["— Quelle langue étudiez-vous ? — L'espagnol.", "kel lahng ay-tew-dee-ay VOO ? — les-pan-YOL", "Which language are you studying? — Spanish."], ["— Quel jour préférez-vous ? — Le vendredi.", "kel zhoor pray-fay-ray VOO ? — luh vahn-druh-DEE", "Which day do you prefer? — Friday."]]}, {"name": "Ex. 9 — écrire les questions du formulaire", "items": [["Nom : Bertholet → Quel est votre nom ?", "kel ay VOT-ruh NOHN", "Surname → What's your surname?"], ["Prénom : Maxime → Quel est votre prénom ?", "kel ay VOT-ruh pray-NOHN", "First name → What's your first name?"], ["Date de naissance : 10 juin 1991 → Quelle est votre date de naissance ?", "kel ay VOT-ruh dat duh nay-SAHNSS", "Born 10 June 1991 → What's your date of birth?"], ["Nationalité : française → Quelle est votre nationalité ?", "kel ay VOT-ruh na-see-o-na-lee-TAY", "French → What's your nationality?"], ["Adresse : 59 rue Savary, 86000 Poitiers → Quelle est votre adresse ?", "kel ay VOT-ruh a-DRESS", "Address → What's your address?"], ["Tél. domicile et portable → Quels sont vos numéros de téléphone ?", "kel sohn vo new-may-RO duh tay-lay-FON", "Two numbers → What are your phone numbers?"]]}, {"name": "Ex. 10 — les opérations", "cols": "two", "items": [["70 + 1 = soixante et onze", "swa-sahnt-ay-ONZ", "71"], ["100 + 80 = cent quatre-vingts", "sahn kat-ruh-VAN", "180"], ["95 − 10 = quatre-vingt-cinq", "kat-ruh-van-SANK", "85"], ["1 000 + 2 000 = trois mille", "twah MEEL", "3 000"], ["100 − 1 = quatre-vingt-dix-neuf", "kat-ruh-van-deez-NUHF", "99"], ["66 + 10 = soixante-seize", "swa-sahnt-SEZ", "76"], ["300 + 50 + 15 + 9 = trois cent soixante-quatorze", "twah sahn swa-sahnt-ka-TORZ", "374"], ["63 + 10 = soixante-treize", "swa-sahnt-TREZ", "73"]]}, {"name": "Ex. 11 — les distances depuis Paris", "cols": "two", "items": [["Paris – Bruxelles : deux cent quatre-vingt-treize kilomètres", "duh sahn kat-ruh-van-TREZ", "293 km"], ["Paris – Madrid : mille deux cent quarante-trois kilomètres", "meel duh sahn ka-rahnt-TWAH", "1 243 km"], ["Paris – Prague : mille cinq kilomètres", "meel SANK", "1 005 km"], ["Paris – Varsovie : mille cinq cent quatre-vingt-sept kilomètres", "meel sank sahn kat-ruh-van-SET", "1 587 km"], ["Paris – Rome : mille trois cent soixante-deux kilomètres", "meel twah sahn swa-sahnt-DUH", "1 362 km"], ["Paris – Dublin : huit cent quarante-six kilomètres", "wee sahn ka-rahnt-SEES", "846 km"]]}, {"name": "Ex. 12 — lire les numéros de téléphone", "note": "Always in <strong>pairs</strong>. A leading zero is <em>zéro</em>, and 00 is <em>zéro zéro</em>.", "items": [["01 42 84 90 00", "zay-RO uhn, ka-rahnt-DUH, kat-ruh-van-KATR, kat-ruh-van-DEES, zay-RO zay-RO", "zéro un, quarante-deux, quatre-vingt-quatre, quatre-vingt-dix, zéro zéro"], ["01 61 19 28 91", "zay-RO uhn, swa-sahnt-ay-UHN, deez-NUHF, van-TWEET, kat-ruh-van-ONZ", "zéro un, soixante et un, dix-neuf, vingt-huit, quatre-vingt-onze"], ["06 04 78 29 81", "zay-RO sees, zay-RO katr, swa-sahnt-dee-ZWEET, van-NUHF, kat-ruh-van-UHN", "zéro six, zéro quatre, soixante-dix-huit, vingt-neuf, quatre-vingt-un"], ["03 46 49 73 79", "zay-RO twah, ka-rahnt-SEES, ka-rahnt-NUHF, swa-sahnt-TREZ, swa-sahnt-deez-NUHF", "zéro trois, quarante-six, quarante-neuf, soixante-treize, soixante-dix-neuf"], ["06 19 21 44 94", "zay-RO sees, deez-NUHF, van-tay-UHN, ka-rahnt-KATR, kat-ruh-van-ka-TORZ", "zéro six, dix-neuf, vingt et un, quarante-quatre, quatre-vingt-quatorze"], ["02 48 80 93 84", "zay-RO duh, ka-rahnt-WEET, kat-ruh-VAN, kat-ruh-van-TREZ, kat-ruh-van-KATR", "zéro deux, quarante-huit, quatre-vingts, quatre-vingt-treize, quatre-vingt-quatre"]]}, {"name": "Ex. 13 — choisir la préposition", "items": [["1. David est américain, il est né aux États-Unis.", "… eel ay nay oh zay-ta-zew-NEE", "plural country → aux"], ["2. Ling est née à Pékin, en Chine. Elle vit en France.", "… a pay-KAN, ahn SHEEN. el vee ahn FRAHNSS", "city → à · feminine country → en"], ["3. Angelica habite en Angleterre mais elle est née au Canada.", "… ah nahn-gluh-TAIR … oh ka-na-DAH", "vowel → en · masculine → au"], ["4. Abdel travaille six mois en Suisse et six mois au Maroc.", "… ahn SWEESS ay see mwah oh ma-ROK", "feminine → en · masculine → au"], ["5. Anna est née à Varsovie, en Pologne, mais elle habite aux Pays-Bas.", "… a var-so-VEE, ahn po-LON-yuh … oh pay-ee-BAH", "city → à · feminine → en · plural → aux"]]}, {"name": "Ex. 14 — l'interview de Tom au présent", "items": [["Comme les autres candidats, vous désirez aller à Paris, n'est-ce pas ?", "kom lay zo-truh kahn-dee-DAH, voo day-zee-RAY a-LAY a pa-REE, ness PAH", "Like the other contestants, you want to go to Paris, don't you?"], ["Oui, je rêve de voir Paris.", "wee, zhuh rev duh vwahr pa-REE", "Yes, I dream of seeing Paris."], ["J'aime la langue et la culture françaises et j'adore la musique.", "zhem lah lahng ay lah kewl-TEWR frahn-SEZ ay zha-DOR lah mew-ZEEK", "I like the French language and culture and I love music."], ["Je désire assister à la Fête de la musique le 21 juin.", "zhuh day-ZEER a-sees-TAY a lah fet duh lah mew-ZEEK", "I want to attend the Music Festival on 21 June."], ["Vous travaillez, vous êtes musicien professionnel ?", "voo tra-va-YAY, voo zet mew-zee-see-AN pro-fay-see-o-NELL", "Do you work — are you a professional musician?"], ["Avec des amis, nous formons un groupe de rock.", "a-vek day za-MEE, noo for-MOHN uhn groop duh ROK", "With friends we form a rock band."], ["Nous jouons dans un bar mais nous travaillons le week-end seulement.", "noo zhoo-OHN dah zuhn BAR may noo tra-va-YOHN luh week-END sul-MAHN", "We play in a bar but we only work weekends."]]}, {"name": "Ex. 15 — changer de personne", "cols": "two", "items": [["Il habite à Tokyo. (ils) → Ils habitent à Tokyo.", "eel za-BEET a to-kee-O", "They live in Tokyo."], ["Tu travailles où ? (vous) → Vous travaillez où ?", "voo tra-va-YAY OO", "Where do you work?"], ["Elle étudie l'économie. (elles) → Elles étudient l'économie.", "el zay-TEW-dee lay-ko-no-MEE", "They study economics."], ["J'arrive lundi. (nous) → Nous arrivons lundi.", "noo za-ree-VOHN luhn-DEE", "We arrive Monday."], ["Elles visitent Barcelone. (elle) → Elle visite Barcelone.", "el vee-ZEET bar-suh-LUN", "She's visiting Barcelona."], ["Vous regardez le film ? (tu) → Tu regardes le film ?", "tew ruh-GARD luh FEELM", "Are you watching the film?"], ["Nous adorons la musique ! (je) → J'adore la musique !", "zha-DOR lah mew-ZEEK", "I love music!"], ["Ils parlent trois langues. (il) → Il parle trois langues.", "eel parl twah LAHNG", "He speaks three languages."]]}, {"name": "Ex. 16 — arriver, habiter, participer, rêver", "items": [["1. — Vous participez à l'émission ? — Oui, je participe au jeu.", "voo par-tee-see-PAY a lay-mee-see-OHN ? — wee, zhuh par-tee-SEEP oh ZHUH", "Are you taking part in the show? — Yes, I'm in the game."], ["2. — Vous habitez où ? — Nous habitons à Dakar.", "voo za-bee-TAY OO ? — noo za-bee-TOHN a da-KAR", "Where do you live? — We live in Dakar."], ["3. — Vous rêvez de visiter Paris ? — Oui, je rêve de visiter le musée d'Orsay.", "voo ray-VAY duh vee-zee-TAY pa-REE ? — wee, zhuh REV duh …", "Do you dream of visiting Paris? — Yes, of visiting the Musée d'Orsay."], ["4. — Vous arrivez quand à Paris ? — Nous arrivons le 23 septembre.", "voo za-ree-VAY kahn a pa-REE ? — noo za-ree-VOHN luh van-TWAH sep-TAHM-bruh", "When do you arrive in Paris? — We arrive on 23 September."]]}, {"name": "Ex. 17 — être ou avoir (à la cafétéria)", "items": [["— Bonjour, Marta. Ça va ? — Ça va bien.", "bohn-ZHOOR, mar-TAH. sa VA ? — sa va bee-AN", "Hello Marta. OK? — I'm fine."], ["Je suis très contente ; j'ai de nouveaux amis : Marion et Vincent.", "zhuh swee tray kohn-TAHNT ; zhay duh noo-VO za-MEE", "I'm very happy; I have new friends: Marion and Vincent."], ["Ils sont français et ils sont étudiants en architecture comme moi.", "eel sohn frahn-SAY ay eel sohn tay-tew-dee-AHN ah nar-shee-tek-TEWR kom MWAH", "They're French and they're architecture students like me."], ["Ils sont mariés et ils ont un bébé : il a six mois !", "eel sohn ma-ree-AY ay eel zohn tuhn bay-BAY : eel a see MWAH", "They're married and they have a baby: he's six months old!"]]}, {"name": "Ex. 18 — reformuler avec être ou avoir", "items": [["Votre nom ? → Quel est votre nom ? — José Esteves.", "kel ay VOT-ruh NOHN", "Your name? → What is your name?"], ["Date de naissance ? → Quelle est votre date de naissance ? — Le 26 avril 1995.", "kel ay VOT-ruh dat duh nay-SAHNSS", "Date of birth? → What is your date of birth?"], ["Étudiant à Paris ? → Vous êtes étudiant à Paris ? — Oui.", "voo zet ay-tew-dee-AHN a pa-REE", "Student in Paris? → Are you a student in Paris?"], ["Une pièce d'identité ? → Vous avez une pièce d'identité, s'il vous plaît ?", "voo za-VAY ewn pee-ESS dee-dahn-tee-TAY", "ID? → Do you have proof of identity, please?"], ["Libre le lundi ? → Vous êtes libre le lundi ? — Oui.", "voo zet LEE-bruh luh luhn-DEE", "Free on Monday? → Are you free on Monday?"], ["Un numéro de portable ? → Vous avez un numéro de portable ? — 07 29 92 36 75.", "voo za-VAY uhn new-may-RO duh por-TAH-bluh", "A mobile number? → Do you have a mobile number?"]]}], "bookpages": [40, 41]}, {"id": "ae-d1-delf", "label": "Dossier 1 · Vers le DELF A1", "name": "L'examen blanc", "summary": "Page 42. A mock exam section: ten points of listening comprehension, ten points of written production — filling in a competition form.", "art": null, "groups": [{"name": "Les enregistrements", "note": "The original CD tracks for this lesson, in book order. Track numbers are read from the 🎧 icons printed on the pages.", "items": [], "tracks": [{"n": 54, "label": "D1 · p.42 — Vers le DELF A1, compréhension"}]}, {"name": "Compréhension de l'oral — les questions", "note": "The recording itself isn't something I can hear, so the answers depend on your audio track. What you <em>can</em> prepare is the question language — these five phrasings come up in every A1 listening paper.", "items": [["Lisez les questions. Écoutez le document deux fois puis répondez.", "lee-ZAY lay kes-tee-OHN. ay-koo-TAY luh do-kew-MAHN duh FWAH pwee ray-pohn-DAY", "Read the questions. Listen twice, then answer."], ["Maria téléphone pour des cours de français, d'anglais ou de portugais ?", "ma-ree-AH tay-lay-FON poor day KOOR duh frahn-SAY, dahn-GLAY oo duh por-tew-GAY", "Is Maria calling about French, English or Portuguese lessons?"], ["Quelle est la profession de Maria ?", "kel ay lah pro-fay-see-OHN duh ma-ree-AH", "What is Maria's job?"], ["Elle est libre quel jour ?", "el ay LEE-bruh kel ZHOOR", "Which day is she free?"], ["Elle est libre à quel moment : le matin, l'après-midi ou le soir ?", "el ay LEE-bruh a kel mo-MAHN", "What time of day is she free: morning, afternoon or evening?"], ["Quel est le numéro de téléphone de Maria ?", "kel ay luh new-may-RO duh tay-lay-FON duh ma-ree-AH", "What is Maria's phone number?"]]}, {"name": "Production écrite — le formulaire", "note": "Ten points for filling this in correctly. Everything here you have already met — this is the payoff of Dossier 1.", "cols": "two", "items": [["Complétez le formulaire pour gagner un dictionnaire.", "kohm-play-TAY luh for-mew-LAIR poor ga-NYAY uhn deek-see-o-NAIR", "Fill in the form to win a dictionary."], ["Jeu concours Hachette", "zhuh kohn-KOOR a-SHET", "Hachette prize competition"], ["Dictionnaires à gagner", "deek-see-o-NAIR a ga-NYAY", "Dictionaries to be won"], ["Tirage au sort à la fin du mois", "tee-RAHZH oh SOR a lah fan dew MWAH", "Prize draw at the end of the month"], ["Nom", "NOHN", "Surname"], ["Prénom", "pray-NOHN", "First name"], ["Date de naissance", "dat duh nay-SAHNSS", "Date of birth"], ["Nationalité", "na-see-o-na-lee-TAY", "Nationality"], ["Adresse", "a-DRESS", "Address"], ["Pays", "pay-EE", "Country"], ["Numéro de téléphone", "new-may-RO duh tay-lay-FON", "Phone number"], ["Mail", "MAIL", "Email"], ["École / Université", "ay-KOL / ew-nee-vair-see-TAY", "School / University"]]}, {"name": "Le vocabulaire de l'examen", "cols": "two", "items": [["la compréhension de l'oral", "lah kohm-pray-ahn-see-OHN duh lo-RAL", "listening comprehension"], ["la production écrite", "lah pro-dewk-see-OHN ay-KREET", "written production"], ["dix points", "dee PWAN", "ten points"], ["un document", "uhn do-kew-MAHN", "a document, a recording"], ["deux fois", "duh FWAH", "twice"], ["répondre", "ray-POHN-druh", "to answer"], ["être libre", "EH-truh LEE-bruh", "to be free / available"], ["un moment", "uhn mo-MAHN", "a time, a moment"], ["un cours", "uhn KOOR", "a class, a lesson"], ["un dictionnaire", "uhn deek-see-o-NAIR", "a dictionary"]]}], "bookpages": [42]}, {"id": "ae-d2l1", "label": "Dossier 2 · Leçon 1", "name": "C'est ma ville", "summary": "Pages 44–47. Pontoise, a town of art and history 30 km from Paris: naming the places in a town, saying where they are, and explaining why you like them.", "art": "prepolieu", "groups": [{"name": "Les enregistrements", "note": "The original CD tracks for this lesson, in book order. Track numbers are read from the 🎧 icons printed on the pages.", "items": [], "tracks": [{"n": 59, "label": "D2 L1 · p.45 act. 4–5 — le journaliste"}, {"n": 60, "label": "D2 L1 · p.45 act. 4–5 — le journaliste"}, {"n": 61, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 62, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 63, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 64, "label": "D2 L1 · p.45 act. 6 — phonétique, un / une"}, {"n": 65, "label": "D2 L1 · p.47 act. 11 — vérifier sur le plan"}, {"n": 66, "label": "D2 L1 · p.47 act. 11 — vérifier sur le plan"}]}, {"name": "L'affiche de Pontoise", "items": [["Bienvenue à Pontoise", "bee-an-vuh-NEW a pohn-TWAHZ", "Welcome to Pontoise"], ["« Ville d'art et d'histoire » à 30 km de Paris", "VEEL dar ay dees-TWAHR a trahnt kee-lo-MET-ruh duh pa-REE", "“Town of art and history”, 30 km from Paris"], ["la ville de Pontoise", "lah veel duh pohn-TWAHZ", "the town of Pontoise"], ["Observez l'affiche de la ville.", "ob-sair-VAY la-FEESH duh lah VEEL", "Look at the town's poster."], ["Regardez les photos et faites des hypothèses.", "ruh-gar-DAY lay fo-TO ay fet day zee-po-TEZ", "Look at the photos and make some guesses."], ["Parler de sa ville", "par-LAY duh sa VEEL", "Talking about your town"]]}, {"name": "Activité 1 — à Pontoise, il y a…", "note": "Checking against the leaflet on p.45, <strong>all eight are true</strong>. The museum is Camille Pissarro, the university is Cergy-Pontoise, the theatre is L'Apostrophe, the river is l'Oise, the cathedral is Saint-Maclou, and there are two gardens. The <em>château</em> is the qualified one — only <strong>les remparts de l'ancien château</strong> survive.", "cols": "two", "items": [["un musée", "uhn mew-ZAY", "a museum ✓"], ["une université", "ew new-nee-vair-see-TAY", "a university ✓"], ["un théâtre", "uhn tay-AH-truh", "a theatre ✓"], ["une rivière", "ewn ree-vee-AIR", "a river ✓ — l'Oise"], ["un château", "uhn sha-TO", "a castle — only the ramparts remain"], ["une cathédrale", "ewn ka-tay-DRAL", "a cathedral ✓ — Saint-Maclou"], ["un pont", "uhn POHN", "a bridge ✓"], ["des jardins", "day zhar-DAN", "gardens ✓"]]}, {"name": "Point Culture — Pontoise, ville de l'Île-de-France", "note": "<strong>The Île-de-France is made of:</strong> Paris (both a city and a département) + the <strong>3</strong> départements of the inner suburbs, in orange (92 Hauts-de-Seine, 93 Seine-Saint-Denis, 94 Val-de-Marne) + the <strong>4</strong> départements of the outer suburbs, in yellow (95 Val-d'Oise, 78 Yvelines, 91 Essonne, 77 Seine-et-Marne).<br><br><strong>Pontoise is in the grande banlieue</strong>, in the Val-d'Oise (95).<br><br>And the riddle in part B: the river hides inside the town's own name — <strong>PONT + OISE</strong>. The coat of arms shows a bridge over the Oise.", "cols": "two", "items": [["la région Île-de-France", "lah ray-zhee-OHN eel-duh-FRAHNSS", "the Île-de-France region"], ["un département", "uhn day-par-tuh-MAHN", "a department (administrative area)"], ["la proche banlieue", "lah prosh bahn-lee-UH", "the inner suburbs"], ["la grande banlieue", "lah grahnd bahn-lee-UH", "the outer suburbs"], ["Pontoise se trouve en grande banlieue.", "pohn-TWAHZ suh troov ahn grahnd bahn-lee-UH", "Pontoise is in the outer suburbs."], ["le blason", "luh bla-ZOHN", "the coat of arms"], ["l'Oise", "LWAHZ", "the Oise — the river inside the name Pont-oise"], ["se trouver", "suh troo-VAY", "to be located"]]}, {"name": "Le dépliant — votre ville, d'hier à aujourd'hui", "cols": "two", "items": [["la cathédrale Saint-Maclou", "lah ka-tay-DRAL san-ma-KLOO", "Saint-Maclou cathedral"], ["l'Oise et les remparts", "LWAHZ ay lay rahm-PAR", "the Oise and the ramparts"], ["le musée Camille Pissarro", "luh mew-ZAY ka-MEE pee-sa-RO", "the Camille Pissarro museum"], ["l'université de Cergy-Pontoise", "lew-nee-vair-see-TAY duh sair-ZHEE pohn-TWAHZ", "Cergy-Pontoise university"], ["le musée Tavet-Delacour", "luh mew-ZAY ta-VAY duh-la-KOOR", "the Tavet-Delacour museum"], ["le jardin de la Ville", "luh zhar-DAN duh lah VEEL", "the town garden"], ["le jardin des Cinq Sens", "luh zhar-DAN day sank SAHNSS", "the Garden of the Five Senses"], ["le théâtre de L'Apostrophe", "luh tay-AH-truh duh la-pos-TROF", "L'Apostrophe theatre"], ["le cinéma Royal Utopia", "luh see-nay-MAH rwa-YAL ew-to-PYA", "the Royal Utopia cinema"], ["le complexe sportif des Louvrais", "luh kohm-PLEX spor-TEEF day loo-VRAY", "the Louvrais sports complex"], ["les marchés", "lay mar-SHAY", "the markets"]]}, {"name": "Activité 2b — art et histoire / vie quotidienne", "note": "A reasonable split: <strong>art et histoire</strong> — la cathédrale, les remparts, le musée Pissarro, le musée Tavet-Delacour, les jardins, le théâtre. <strong>vie quotidienne</strong> — l'université, le cinéma, le complexe sportif, les marchés. Some sit on the line (a theatre is both culture and daily life), and the exercise expects you to argue your case.", "cols": "two", "items": [["l'art et l'histoire", "LAR ay lees-TWAHR", "art and history"], ["la vie quotidienne", "lah vee ko-tee-dee-EN", "daily life"], ["Classez les lieux dans les deux catégories.", "kla-SAY lay lee-UH dahn lay duh ka-tay-go-REE", "Sort the places into the two categories."]]}, {"name": "Point Langue — articles définis et indéfinis", "note": "<strong>The rule you're meant to find:</strong> the indefinite articles <em>un, une, des</em> give <strong>non-specific</strong> information — there is <em>a</em> museum. The definite articles <em>le, la, l', les</em> give <strong>specific</strong> information — it's <em>the</em> Camille Pissarro museum.", "cols": "two", "items": [["Il y a un musée. → C'est le musée Camille Pissarro.", "eel ee a uhn mew-ZAY → say luh mew-ZAY", "There's a museum → It's the Camille Pissarro museum."], ["Il y a une cathédrale. → C'est la cathédrale Saint-Maclou.", "… ewn ka-tay-DRAL → say lah ka-tay-DRAL", "There's a cathedral → It's Saint-Maclou cathedral."], ["Il y a une université. → C'est l'université de Cergy-Pontoise.", "… ew new-nee-vair-see-TAY", "There's a university → It's Cergy-Pontoise university."], ["Il y a une rivière. → C'est l'Oise.", "… ewn ree-vee-AIR → say LWAHZ", "There's a river → It's the Oise."], ["Il y a des remparts. → Ce sont les remparts de l'ancien château.", "… day rahm-PAR → suh sohn lay rahm-PAR duh lahn-see-AN sha-TO", "There are ramparts → They're the ramparts of the old castle."]]}, {"name": "Aide-mémoire — demander et donner une explication", "items": [["Pourquoi aimez-vous ce lieu ?", "poor-KWAH ay-may VOO suh lee-UH", "Why do you like this place?"], ["Parce que j'adore la peinture.", "pars kuh zha-DOR lah pan-TEWR", "Because I love painting."], ["Parce qu'il y a des spectacles intéressants.", "pars keel ee a day spek-TAH-kluh an-tay-ray-SAHN", "Because there are interesting shows."], ["Mon lieu préféré, c'est…", "mohn lee-UH pray-fay-RAY, say", "My favourite place is…"], ["Quel est votre lieu préféré dans votre ville ?", "kel ay VOT-ruh lee-UH pray-fay-RAY dahn VOT-ruh VEEL", "What's your favourite place in your town?"]]}, {"name": "Phonétique — un / une", "cols": "two", "items": [["un musée", "uhn mew-ZAY", "a museum — nasal uhn"], ["un endroit", "uh nahn-DRWAH", "a place — liaison, the n links across"], ["une rivière", "ewn ree-vee-AIR", "a river — clear ewn"], ["une épicerie", "ew nay-pee-SREE", "a grocer's — liaison again"]]}, {"name": "Localiser — les bonnes adresses de Mélanie", "note": "From the town magazine <em>Pontoise infos</em>, page « Vivre et sortir à Pontoise ». Each entry gives three things: the name, an opinion in quotation marks, and the location.", "items": [["Le restaurant L'Audience : « un bon restaurant traditionnel »", "luh res-to-RAHN lo-dee-AHNSS : uhn bohn res-to-RAHN tra-dee-see-o-NELL", "The L'Audience restaurant: “a good traditional restaurant”"], ["sur la place de l'Hôtel de Ville, en face de la mairie, à côté de la pharmacie", "sewr lah plahss duh lo-TELL duh VEEL, ahn fahss duh lah may-REE, a ko-TAY duh lah far-ma-SEE", "on the town hall square, opposite the town hall, next to the pharmacy"], ["Le cinéma Royal Utopia : « une programmation intéressante »", "luh see-nay-MAH rwa-YAL ew-to-PYA : ewn pro-gra-ma-see-OHN an-tay-ray-SAHNT", "The Royal Utopia cinema: “an interesting programme”"], ["dans la rue Alexandre Prachay, à gauche de la bibliothèque Guillaume-Apollinaire", "dahn lah rew a-lek-SAHN-druh pra-SHAY, a GOSH duh lah bee-blee-o-TEK", "on rue Alexandre Prachay, to the left of the Guillaume-Apollinaire library"], ["Le marché du centre : « des commerçants sympathiques »", "luh mar-SHAY dew SAHN-truh : day ko-mair-SAHN san-pa-TEEK", "The central market: “friendly traders”"], ["dans la rue de l'Hôtel de Ville et sur la place, le samedi matin", "dahn lah rew duh lo-TELL duh VEEL ay sewr lah PLAHSS, luh sam-DEE ma-TAN", "on rue de l'Hôtel de Ville and on the square, Saturday mornings"], ["L'épicerie fine L'Arbre blanc : « des produits de qualité et une galerie d'art ! »", "lay-pee-SREE FEEN LAR-bruh BLAHN : day pro-DWEE duh ka-lee-TAY ay ewn gal-REE DAR", "The L'Arbre blanc delicatessen: “quality products and an art gallery!”"], ["dans la rue Alexandre Prachay, près du cinéma", "dahn lah rew a-lek-SAHN-druh pra-SHAY, pray dew see-nay-MAH", "on rue Alexandre Prachay, near the cinema"]]}, {"name": "Activité 8 — les réponses", "note": "<strong>1.</strong> Mélanie is a resident of Pontoise — <em>une Pontoisienne</em> — sharing her favourite local spots in the town magazine.<br><strong>2.</strong> Her addresses are all <strong>commerces et loisirs</strong>: a restaurant, a cinema, a market and a delicatessen.<br><strong>3.</strong> For each place the magazine gives <strong>the name, an opinion, and the location</strong>.", "cols": "two", "items": [["Qui est Mélanie ?", "kee ay may-la-NEE", "Who is Mélanie?"], ["C'est une habitante de Pontoise, une Pontoisienne.", "set ewn a-bee-TAHNT duh pohn-TWAHZ, ewn pohn-twa-zee-EN", "She's a resident of Pontoise."], ["les commerces et les loisirs", "lay ko-MAIRSS ay lay lwa-ZEER", "shops and leisure"], ["le nom, l'opinion et la ong>Number 5 is also FAUX</strong> on the same evidence: the text places L'Arbre blanc <em>près du cinéma</em>, not next to the car park.<br><br>Statements 1, 2 and 4 can only be settled against the street plan on p.46 — read them off your own page.", "items": [["1. Le musée Tavet est en face de la poste.", "luh mew-ZAY ta-VAY et ahn fahss duh lah POST", "The Tavet museum is opposite the post office."], ["2. Il y a une boulangerie à droite de la banque.", "eel ee a ewn boo-lahn-ZHREE a DRWAHT duh lah BAHNK", "There's a bakery to the right of the bank."], ["3. Sur la place, il y a une pharmacie derrière le restaurant L'Audience.", "sewr lah PLAHSS, eel ee a ewn far-ma-SEE dair-ee-AIR luh res-to-RAHN", "On the square there's a pharmacy behind L'Audience. — FAUX, it's next to it"], ["4. La banque est près de l'église Sainte-Anne.", "lah BAHNK ay pray duh lay-GLEEZ sant-ANN", "The bank is near Sainte-Anne church."], ["5. L'épicerie fine L'Arbre blanc est dans la rue Alexandre Prachay, à côté du parking.", "lay-pee-SREE FEEN … a ko-TAY dew par-KEENG", "L'Arbre blanc is on rue Alexandre Prachay, next to the car park. — FAUX, it's near the cinema"]]}, {"name": "Point Langue — les lieux de la ville, par catégorie", "note": "<strong>administrations</strong> — l'hôtel de ville (= la mairie), la poste · <strong>culture</strong> — le cinéma, la cathédrale, le théâtre, le musée, l'église, la bibliothèque · <strong>commerces</strong> — la boulangerie, le restaurant, le marché, l'épicerie, le supermarché, la pharmacie · <strong>nature</strong> — le jardin, la rivière · <strong>éducation</strong> — l'école, l'université · <strong>autres</strong> — l'hôpital.", "cols": "two", "items": [["l'hôtel de ville (= la mairie)", "lo-TELL duh VEEL (= lah may-REE)", "the town hall"], ["la poste", "lah POST", "the post office"], ["le cinéma", "luh see-nay-MAH", "the cinema"], ["la cathédrale", "lah ka-tay-DRAL", "the cathedral"], ["le théâtre", "luh tay-AH-truh", "the theatre"], ["le musée", "l
